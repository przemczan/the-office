# Local infrastructure for The Office: Postgres and the OpenTelemetry backend (spec §5.2).
# Values come from .env (copy .env.example). Ports are published on 127.0.0.1 only, since
# The Office serves localhost alone (spec §5.1). verify-linux, behind its own profile, is
# npm run verify:linux; it reaches the others over the project network by service name.
name: the-office

services:
  postgres:
    # Official-image tags are rebuilt for base-OS updates; the digest pins the exact image.
    image: postgres:18.6-trixie@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?copy .env.example to .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copy .env.example to .env}
      POSTGRES_DB: ${POSTGRES_DB:?copy .env.example to .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:?copy .env.example to .env}:5432"
    volumes:
      # Postgres 18 images keep PGDATA in /var/lib/postgresql/<major>/, so the volume holds the parent.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      # Over TCP: during initialization the temporary server listens on the Unix socket only.
      test: ["CMD-SHELL", 'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 1s
    restart: unless-stopped

  otel-lgtm:
    image: grafana/otel-lgtm:0.38.0@sha256:75cdf892daffadf3763ef61c16a6d7f8586216fce0b40bba7874a0b053121084
    ports:
      - "127.0.0.1:${GRAFANA_PORT:?copy .env.example to .env}:3000"
      - "127.0.0.1:4317:4317" # OTLP over gRPC
      - "127.0.0.1:4318:4318" # OTLP over HTTP
    healthcheck:
      # The image's own check: its ready file, then each component's ready endpoint.
      test: ["CMD", "/otel-lgtm/docker/healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 120s
      start_interval: 2s
    restart: unless-stopped

  # npm run verify:linux (Build defaults in docs/tasks/README.md): tools/verify-linux/verify-linux.sh
  # on the working tree, mounted read-only. Started only by `docker compose run`.
  verify-linux:
    profiles: [verify-linux]
    image: node:22.23.4-trixie@sha256:77d0c7953e80648137a237496c8edbcb3a14bedc5c5298b93a6d0dfa6c3e1271
    working_dir: /work
    command: ["bash", "/source/tools/verify-linux/verify-linux.sh"]
    environment:
      OFFICE_PORT: ${OFFICE_PORT:?copy .env.example to .env}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-lgtm:4318
    volumes:
      - type: bind
        source: .
        target: /source
        read_only: true
      - npm-cache:/root/.npm
      # Chromium for the web's Playwright tests, downloaded once.
      - playwright-browsers:/root/.cache/ms-playwright
    depends_on:
      postgres:
        condition: service_healthy
      otel-lgtm:
        condition: service_healthy

volumes:
  postgres-data:
  npm-cache:
  playwright-browsers:
