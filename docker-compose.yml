# Local infrastructure for The Office: Postgres (spec §5.2). Values come from .env (copy
# .env.example). Ports are published on 127.0.0.1 only, since The Office serves localhost alone
# (spec §5.1). The bundled Grafana isn't here: The Office runs it itself, as Compose project
# `the-office-grafana`, when it's chosen in Settings › Telemetry. The checks run in a Task's run
# environment (.devcontainer/), with a Postgres of its own; this file is for npm run dev and the
# host's checks.
name: the-office

services:
  postgres:
    # Official-image tags are rebuilt for base-OS updates; the digest pins the exact image.
    image: postgres:18.6-trixie@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?copy .env.example to .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copy .env.example to .env}
      POSTGRES_DB: ${POSTGRES_DB:?copy .env.example to .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:?copy .env.example to .env}:5432"
    volumes:
      # Postgres 18 images keep PGDATA in /var/lib/postgresql/<major>/, so the volume holds the parent.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      # Over TCP: during initialization the temporary server listens on the Unix socket only.
      test: ["CMD-SHELL", 'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 1s
    restart: unless-stopped

volumes:
  postgres-data:
