# The Task's run environment (spec §5.5): `checks` is where install, build, lint and test run, with
# the Postgres the service's tests need beside it. The Office mounts the worktree, sets the limits
# and keeps the services off this computer's ports, so none of that is written here.
services:
  checks:
    build:
      context: .
    # Reaps the processes git, the shells and Chromium leave behind.
    init: true
    environment:
      # What the tests, the end-to-end service and the service start check read; the compose
      # Postgres below is a throwaway reached only from this network.
      DATABASE_URL: postgres://office:office@postgres:5432/the_office
      # No OpenTelemetry backend runs here.
      OTEL_SDK_DISABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    # Official-image tags are rebuilt for base-OS updates; the digest pins the exact image.
    image: postgres:18.6-trixie@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6
    environment:
      POSTGRES_USER: office
      POSTGRES_PASSWORD: office
      POSTGRES_DB: the_office
    # Every test file creates databases and pools of its own; the data is thrown away with the Task.
    command: ["postgres", "-c", "max_connections=300", "-c", "fsync=off"]
    volumes:
      # Postgres 18 images keep PGDATA in /var/lib/postgresql/<major>/, so the volume holds the parent.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      # Over TCP: during initialization the temporary server listens on the Unix socket only.
      test: ["CMD-SHELL", 'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 1s

volumes:
  postgres-data:
