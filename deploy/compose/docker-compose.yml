# The Office installed with Docker Compose (spec §5.1 Defaults, "Installing with Docker Compose"):
# The Office's released image and its Postgres, in a folder of its own beside this file's .env
# (each release carries both, as docker-compose.yml and the-office.env, docs/releasing.md).
#
# Every value comes from .env, never from the shell: a variable set in the shell would win over
# .env, and the Office updater, which runs this file from the same folder, wouldn't see it. Nothing
# here is a relative path, so it runs the same from wherever that folder is mounted.
#
# The dev stack (the repository's own docker-compose.yml) is Compose project `the-office` too, with
# the same `postgres-data` volume, so a machine runs one of them, never both.
#
# The bundled Grafana isn't here: The Office runs it itself, as Compose project `the-office-grafana`,
# when it's chosen in Settings › Telemetry.
name: the-office

services:
  # Runs once before The Office: creates the data folder if needed and gives its top to the image's
  # user `office` (uid 10001). Never recursive: The Office owns what it creates inside.
  data-folder:
    image: ${OFFICE_IMAGE:-ghcr.io/przemczan/the-office}:${OFFICE_VERSION:?set OFFICE_VERSION in .env}
    user: "0:0"
    restart: "no"
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -eu
        mkdir -p "$$OFFICE_DATA_DIR"
        if [ "$$(stat -c %u "$$OFFICE_DATA_DIR")" != 10001 ]; then
          chown 10001:10001 "$$OFFICE_DATA_DIR"
          chmod 0750 "$$OFFICE_DATA_DIR"
        fi
    environment:
      OFFICE_DATA_DIR: ${OFFICE_DATA_DIR:?set OFFICE_DATA_DIR in .env}
    volumes:
      - ${OFFICE_DATA_DIR:?set OFFICE_DATA_DIR in .env}:${OFFICE_DATA_DIR:?set OFFICE_DATA_DIR in .env}

  office:
    # Only OFFICE_VERSION sets the tag; OFFICE_IMAGE is for a fork's image and the Release Dry run.
    image: ${OFFICE_IMAGE:-ghcr.io/przemczan/the-office}:${OFFICE_VERSION:?set OFFICE_VERSION in .env}
    # Runs as the image's non-root user `office` (uid 10001): no `user:` override.
    # The host's docker group, so The Office reaches the socket to start run environments.
    group_add:
      - ${DOCKER_GID:?set DOCKER_GID in .env, the group of /var/run/docker.sock}
    # The Host check accepts a request addressed to the IP address it arrived at, at the port it
    # arrived at (spec §5.1), so only the host's network makes OFFICE_HOST and OFFICE_PORT behave as
    # on a direct install: localhost, the LAN IP and the public address. Hence no `ports:`.
    network_mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # The same path on both sides: run environments bind-mount worktrees by their path, which the
      # Docker daemon reads on the host.
      - ${OFFICE_DATA_DIR:?set OFFICE_DATA_DIR in .env}:${OFFICE_DATA_DIR:?set OFFICE_DATA_DIR in .env}
    # Listed one by one, never env_file: whatever The Office's container gets reaches Project
    # commands, and .env's OFFICE_VERSION, DOCKER_GID and POSTGRES_PASSWORD mustn't.
    environment:
      OFFICE_HOST: ${OFFICE_HOST:-127.0.0.1}
      OFFICE_PORT: ${OFFICE_PORT:-4310}
      OFFICE_DATA_DIR: ${OFFICE_DATA_DIR:?set OFFICE_DATA_DIR in .env}
      DATABASE_URL: postgres://office:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@127.0.0.1:${POSTGRES_PORT:-5432}/the_office
      OFFICE_PUBLIC_ADDRESS: ${OFFICE_PUBLIC_ADDRESS:-}
      OFFICE_SKIP_SETUP_BASICS: ${OFFICE_SKIP_SETUP_BASICS:-}
    # The Office updater's `up -d --no-deps office` skips these, which is fine once they've run.
    depends_on:
      postgres:
        condition: service_healthy
      data-folder:
        condition: service_completed_successfully
    restart: unless-stopped
    # Time for the service to stop gracefully.
    stop_grace_period: 1m
    # No healthcheck key: the image's own HEALTHCHECK stays.
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  postgres:
    # The dev stack's pin: official-image tags are rebuilt for base-OS updates; the digest pins it.
    image: postgres:18.6-trixie@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6
    environment:
      POSTGRES_USER: office
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: the_office
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Postgres 18 images keep PGDATA in /var/lib/postgresql/<major>/, so the volume holds the parent.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      # Over TCP: during initialization the temporary server listens on the Unix socket only.
      test: ["CMD-SHELL", 'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 1s
    restart: unless-stopped

volumes:
  postgres-data:
