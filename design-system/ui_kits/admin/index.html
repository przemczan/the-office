<!-- @dsCard group="Admin UI kit" viewport="1440x900" name="Back office" subtitle="Login, overview, users list + detail, audit log, settings" -->
<!doctype html><html><head><meta charset="utf-8"><title>NotNullSoft Admin</title><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<script src="data.js"></script>
<style>html,body,#root{height:100%}</style></head><body><div id="root"></div>
<script type="text/babel" src="Login.jsx"></script>
<script type="text/babel" src="Shell.jsx"></script>
<script type="text/babel" src="Dashboard.jsx"></script>
<script type="text/babel" src="Users.jsx"></script>
<script type="text/babel" src="UserDetail.jsx"></script>
<script type="text/babel" src="AuditLog.jsx"></script>
<script type="text/babel" src="Settings.jsx"></script>
<script type="text/babel">
const {Toast,Button}=window.NotNullSoftAdminDesignSystem_a508e9;
const CRUMBS={overview:['Overview'],users:['Manage','Users'],orders:['Manage','Orders'],audit:['Manage','Audit log'],settings:['System','Settings']};
function App(){const saved=JSON.parse(localStorage.getItem('nns-admin')||'{}');
const[authed,setAuthed]=React.useState(saved.authed??true);const[route,setRoute]=React.useState(saved.route||'overview');const[user,setUser]=React.useState(null);const[theme,setTheme]=React.useState(saved.theme||'light');const[toasts,setToasts]=React.useState([]);
React.useEffect(()=>{document.documentElement.setAttribute('data-theme',theme);localStorage.setItem('nns-admin',JSON.stringify({authed,route,theme}))},[authed,route,theme]);
const toast=t=>{const id=Math.random();setToasts(x=>[...x,{...t,id}]);setTimeout(()=>setToasts(x=>x.filter(y=>y.id!==id)),5000)};
const nav=r=>{setUser(null);setRoute(r==='orders'?'overview':r)};
if(!authed)return <LoginScreen onSignIn={()=>{setAuthed(true);setRoute('overview')}}/>;
const crumbs=user?[{label:'Manage'},{label:'Users',onClick:()=>setUser(null)},{label:user.name}]:CRUMBS[route].map(l=>({label:l}));
return <><Shell active={route} onNav={nav} crumbs={crumbs} theme={theme} onTheme={()=>setTheme(t=>t==='dark'?'light':'dark')} onSignOut={()=>setAuthed(false)}>
{user?<UserDetailScreen key={user.id} user={user} onBack={()=>setUser(null)} toast={toast}/>:route==='overview'?<DashboardScreen onNav={nav} onOpenUser={u=>{setRoute('users');setUser(u)}}/>:route==='users'?<UsersScreen onOpenUser={setUser} toast={toast}/>:route==='audit'?<AuditLogScreen/>:<SettingsScreen toast={toast}/>}</Shell>
<div style={{position:'fixed',right:20,bottom:20,display:'flex',flexDirection:'column',gap:8,zIndex:'var(--z-toast)'}}>{toasts.map(t=><Toast key={t.id} tone={t.tone} title={t.title} description={t.description} action={t.action?<Button size="sm" variant="secondary" onClick={()=>setToasts(x=>x.filter(y=>y.id!==t.id))}>Undo</Button>:null} onClose={()=>setToasts(x=>x.filter(y=>y.id!==t.id))}/>)}</div></>;}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
