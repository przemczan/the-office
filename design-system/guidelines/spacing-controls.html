<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;background:var(--surface)}.g{display:grid;gap:8px}.sw{display:flex;flex-direction:column;gap:6px}.chip{height:48px;border-radius:6px;border:1px solid rgba(0,0,0,.06)}.n{font:500 12px/1.2 var(--font-sans);color:var(--fg-1)}.v{font:400 11px/1.2 var(--font-mono);color:var(--fg-3)}.g{display:flex;gap:24px;align-items:flex-end}.c{display:flex;flex-direction:column;gap:6px;align-items:flex-start}.box{border:1px solid var(--border-strong);border-radius:6px;background:var(--surface);display:flex;align-items:center;padding:0 10px;font:500 13px var(--font-sans)}.k{font:400 11px var(--font-mono);color:var(--fg-3)}.row{width:200px;border-bottom:1px solid var(--border-subtle);display:flex;align-items:center;font:13px var(--font-sans);padding:0 8px}</style></head><body><div class="g"><div class="c"><div class="box" style="height:24px">xs</div><span class="k">24</span></div><div class="c"><div class="box" style="height:28px">sm</div><span class="k">28</span></div><div class="c"><div class="box" style="height:32px">md default</div><span class="k">32</span></div><div class="c"><div class="box" style="height:40px">lg</div><span class="k">40</span></div><div class="c"><div class="row" style="height:36px">compact row</div><div class="row" style="height:44px;background:var(--surface-selected)">default row</div><div class="row" style="height:52px">relaxed row</div><span class="k">36 / 44 / 52</span></div></div></body></html>
