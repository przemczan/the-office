<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;background:var(--surface)}.g{display:grid;gap:8px}.sw{display:flex;flex-direction:column;gap:6px}.chip{height:48px;border-radius:6px;border:1px solid rgba(0,0,0,.06)}.n{font:500 12px/1.2 var(--font-sans);color:var(--fg-1)}.v{font:400 11px/1.2 var(--font-mono);color:var(--fg-3)}.r{display:grid;grid-template-columns:70px repeat(4,1fr);gap:8px;align-items:center;margin-bottom:8px}.c{height:28px;border-radius:4px;display:flex;align-items:center;padding:0 8px;font:500 12px/1 var(--font-sans)}.h{font:400 11px var(--font-mono);color:var(--fg-3)}</style></head><body><div class="r"><span class="h">success</span><div class="c" style="background:var(--success-subtle);color:var(--success-fg)">subtle</div><div class="c" style="background:var(--surface);border:1px solid var(--success-border);color:var(--fg-2)">border</div><div class="c" style="background:var(--success);color:#fff">solid</div><div class="c" style="color:var(--success-fg)">text-fg</div></div><div class="r"><span class="h">warning</span><div class="c" style="background:var(--warning-subtle);color:var(--warning-fg)">subtle</div><div class="c" style="background:var(--surface);border:1px solid var(--warning-border);color:var(--fg-2)">border</div><div class="c" style="background:var(--warning);color:#fff">solid</div><div class="c" style="color:var(--warning-fg)">text-fg</div></div><div class="r"><span class="h">danger</span><div class="c" style="background:var(--danger-subtle);color:var(--danger-fg)">subtle</div><div class="c" style="background:var(--surface);border:1px solid var(--danger-border);color:var(--fg-2)">border</div><div class="c" style="background:var(--danger);color:#fff">solid</div><div class="c" style="color:var(--danger-fg)">text-fg</div></div><div class="r"><span class="h">info</span><div class="c" style="background:var(--info-subtle);color:var(--info-fg)">subtle</div><div class="c" style="background:var(--surface);border:1px solid var(--info-border);color:var(--fg-2)">border</div><div class="c" style="background:var(--info);color:#fff">solid</div><div class="c" style="color:var(--info-fg)">text-fg</div></div></body></html>
