<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;background:var(--surface)}.g{display:grid;gap:8px}.sw{display:flex;flex-direction:column;gap:6px}.chip{height:48px;border-radius:6px;border:1px solid rgba(0,0,0,.06)}.n{font:500 12px/1.2 var(--font-sans);color:var(--fg-1)}.v{font:400 11px/1.2 var(--font-mono);color:var(--fg-3)}body{background:var(--bg);padding:16px}.s{display:grid;grid-template-columns:120px 1fr;height:168px;border:1px solid var(--border);border-radius:8px;overflow:hidden;background:var(--bg)}.sb{background:var(--surface);border-right:1px solid var(--border);padding:8px;display:flex;flex-direction:column;gap:6px}.i{height:10px;border-radius:3px;background:var(--surface-sunken)}.tb{height:28px;background:var(--surface);border-bottom:1px solid var(--border)}.ct{padding:12px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.c{height:40px;background:var(--surface);border:1px solid var(--border);border-radius:4px}.w{grid-column:span 3;height:60px}.k{font:400 10px var(--font-mono);color:var(--fg-3)}</style></head><body><div class="s"><div class="sb"><span class="k">sidebar 240</span><div class="i" style="background:var(--gray-150)"></div><div class="i"></div><div class="i"></div><div class="i"></div></div><div><div class="tb" style="display:flex;align-items:center;padding:0 10px"><span class="k">topbar 56 · sticky</span></div><div class="ct"><div class="c"></div><div class="c"></div><div class="c"></div><div class="c w"></div></div></div></div></body></html>
