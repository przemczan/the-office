<!-- @dsCard group="Spacing" viewport="700x150" name="Elevation" subtitle="Borders first; shadows only for things that float" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;background:var(--surface)}.g{display:grid;gap:8px}.sw{display:flex;flex-direction:column;gap:6px}.chip{height:48px;border-radius:6px;border:1px solid rgba(0,0,0,.06)}.n{font:500 12px/1.2 var(--font-sans);color:var(--fg-1)}.v{font:400 11px/1.2 var(--font-mono);color:var(--fg-3)}body{background:var(--bg)}.g{display:flex;gap:24px}.b{width:140px;height:80px;background:var(--surface);border-radius:8px;border:1px solid var(--border);display:flex;align-items:flex-end;padding:10px;font:400 11px/1.3 var(--font-mono);color:var(--fg-3)}</style></head><body><div class="g"><div class="b">shadow-0<br>cards, tables</div><div class="b" style="box-shadow:var(--shadow-1)">shadow-1<br>inputs, buttons</div><div class="b" style="box-shadow:var(--shadow-2)">shadow-2<br>raised card</div><div class="b" style="box-shadow:var(--shadow-3)">shadow-3<br>menu, dialog, toast</div></div></body></html>
