<!-- @dsCard group="Colors" viewport="700x200" name="Dark theme" subtitle="data-theme=&quot;dark&quot; remaps every alias" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;background:var(--surface)}.g{display:grid;gap:8px}.sw{display:flex;flex-direction:column;gap:6px}.chip{height:48px;border-radius:6px;border:1px solid rgba(0,0,0,.06)}.n{font:500 12px/1.2 var(--font-sans);color:var(--fg-1)}.v{font:400 11px/1.2 var(--font-mono);color:var(--fg-3)}body{background:var(--bg)}.g{grid-template-columns:repeat(6,1fr)}.chip{border-color:rgba(255,255,255,.08)}.p{margin-top:14px;display:flex;gap:8px}.b{padding:6px 10px;border-radius:4px;font:500 12px var(--font-sans)}</style></head><body><div data-theme="dark" style="background:var(--bg);margin:-20px;padding:20px;min-height:200px"><div class="g"><div class="sw"><div class="chip" style="background:var(--bg)"></div><div><div class="n">bg</div><div class="v">gray-950</div></div></div><div class="sw"><div class="chip" style="background:var(--surface)"></div><div><div class="n">surface</div><div class="v">gray-900</div></div></div><div class="sw"><div class="chip" style="background:var(--surface-raised)"></div><div><div class="n">raised</div><div class="v">gray-800</div></div></div><div class="sw"><div class="chip" style="background:var(--border)"></div><div><div class="n">border</div><div class="v">gray-800</div></div></div><div class="sw"><div class="chip" style="background:var(--fg-1)"></div><div><div class="n">fg-1</div><div class="v">#F4F4F2</div></div></div><div class="sw"><div class="chip" style="background:var(--fg-2)"></div><div><div class="n">fg-2</div><div class="v">gray-300</div></div></div></div><div class="p"><span class="b" style="background:var(--success-subtle);color:var(--success-fg)">Active</span><span class="b" style="background:var(--warning-subtle);color:var(--warning-fg)">Pending</span><span class="b" style="background:var(--danger-subtle);color:var(--danger-fg)">Suspended</span><span class="b" style="background:var(--info-subtle);color:var(--info-fg)">Trial</span><span class="b" style="background:var(--primary);color:var(--primary-fg)">Primary</span><span class="b" style="background:var(--accent);color:#fff">Accent</span></div></div></body></html>
