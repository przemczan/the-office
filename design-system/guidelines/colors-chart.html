<!-- @dsCard group="Colors" viewport="700x150" name="Chart palette" subtitle="Categorical series in fixed order; gray-400 for comparison/other" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;background:var(--surface)}.g{display:grid;gap:8px}.sw{display:flex;flex-direction:column;gap:6px}.chip{height:48px;border-radius:6px;border:1px solid rgba(0,0,0,.06)}.n{font:500 12px/1.2 var(--font-sans);color:var(--fg-1)}.v{font:400 11px/1.2 var(--font-mono);color:var(--fg-3)}.g{grid-template-columns:repeat(6,1fr)}.bar{display:flex;height:12px;border-radius:3px;overflow:hidden;margin-top:14px}</style></head><body><div class="g"><div class="sw"><div class="chip" style="background:var(--chart-1)"></div><div><div class="n">chart-1</div><div class="v">ember</div></div></div><div class="sw"><div class="chip" style="background:var(--chart-2)"></div><div><div class="n">chart-2</div><div class="v">blue</div></div></div><div class="sw"><div class="chip" style="background:var(--chart-3)"></div><div><div class="n">chart-3</div><div class="v">teal</div></div></div><div class="sw"><div class="chip" style="background:var(--chart-4)"></div><div><div class="n">chart-4</div><div class="v">flare</div></div></div><div class="sw"><div class="chip" style="background:var(--chart-5)"></div><div><div class="n">chart-5</div><div class="v">violet</div></div></div><div class="sw"><div class="chip" style="background:var(--chart-6)"></div><div><div class="n">chart-6</div><div class="v">gray / other</div></div></div></div><div class="bar"><span style="width:38%;background:var(--chart-1)"></span><span style="width:22%;background:var(--chart-2)"></span><span style="width:16%;background:var(--chart-3)"></span><span style="width:12%;background:var(--chart-4)"></span><span style="width:7%;background:var(--chart-5)"></span><span style="width:5%;background:var(--chart-6)"></span></div></body></html>
