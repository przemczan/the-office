<!doctype html>
<html lang="en" data-theme="light" data-palette="light" data-density="comfortable">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>The Office · Task page, round 2 · proposal</title>
    <!--
      A design proposal, not the UI spec: see README.md next to this file. Self-contained on purpose
      (no network requests): tokens are copied from design-system/tokens and packages/ui/src/appearance,
      the fonts are inlined at the end of the page.
    -->
    <style>
      /* ---------- Tokens: design-system/tokens (colours, type, spacing, radius, elevation, motion) ---------- */
      :root {
        --ember-50: #fff2ed;
        --ember-100: #ffe0d4;
        --ember-300: #ff9370;
        --ember-400: #ff6638;
        --ember-500: #f23d0f;
        --ember-600: #cc2f07;
        --ember-700: #9e2406;
        --flare-300: #ffc266;
        --flare-500: #ff9a1f;
        --white: #ffffff;
        --gray-25: #fafaf9;
        --gray-50: #f4f4f2;
        --gray-100: #e9e9e6;
        --gray-150: #dededa;
        --gray-200: #d1d1cc;
        --gray-300: #b1b1ab;
        --gray-400: #8a8a84;
        --gray-500: #6b6b66;
        --gray-600: #50504c;
        --gray-700: #3a3a37;
        --gray-800: #262624;
        --gray-900: #181817;
        --gray-950: #0f0f0e;
        --green-50: #edf8f1;
        --green-100: #d5f0df;
        --green-500: #1e9e57;
        --green-600: #17834a;
        --green-700: #106a3b;
        --amber-50: #fff8e6;
        --amber-100: #ffedc2;
        --amber-500: #e5a00d;
        --amber-700: #865b05;
        --red-50: #fdeef0;
        --red-100: #fad9dd;
        --red-500: #c8102e;
        --red-600: #aa0d27;
        --red-700: #8e0b20;
        --blue-50: #eef3fd;
        --blue-100: #dae5fa;
        --blue-500: #2f6bdb;
        --blue-700: #1d4699;
        --teal-500: #14a38b;
        --violet-500: #7c5cd6;

        --bg: var(--gray-50);
        --surface: var(--white);
        --surface-raised: var(--white);
        --surface-sunken: var(--gray-50);
        --surface-hover: var(--gray-25);
        --surface-selected: var(--ember-50);
        --surface-inverse: var(--gray-900);
        --fg-1: var(--gray-950);
        --fg-2: var(--gray-600);
        --fg-3: var(--gray-500);
        --fg-disabled: var(--gray-400);
        --fg-inverse: var(--white);
        --fg-on-accent: var(--white);
        --border: var(--gray-150);
        --border-subtle: var(--gray-100);
        --border-strong: var(--gray-200);
        --border-focus: var(--ember-500);
        --accent: var(--ember-500);
        --accent-hover: var(--ember-600);
        --accent-subtle: var(--ember-50);
        --accent-subtle-fg: var(--ember-700);
        --primary: var(--gray-900);
        --primary-hover: var(--gray-700);
        --primary-fg: var(--white);
        --control-hover: var(--gray-50);
        --control-press: var(--gray-100);
        --success: var(--green-500);
        --success-subtle: var(--green-50);
        --success-fg: var(--green-700);
        --success-border: var(--green-100);
        --warning: var(--amber-500);
        --warning-subtle: var(--amber-50);
        --warning-fg: var(--amber-700);
        --warning-border: var(--amber-100);
        --danger: var(--red-500);
        --danger-subtle: var(--red-50);
        --danger-fg: var(--red-700);
        --danger-border: var(--red-100);
        --info: var(--blue-500);
        --info-subtle: var(--blue-50);
        --info-fg: var(--blue-700);
        --info-border: var(--blue-100);
        --neutral-subtle: var(--gray-50);
        --neutral-fg: var(--gray-600);
        --neutral-border: var(--gray-150);
        --text-link: var(--fg-1);
        --text-link-hover: var(--accent-hover);
        --focus-ring: 0 0 0 3px color-mix(in oklab, var(--ember-500) 30%, transparent);
        --overlay: color-mix(in oklab, var(--gray-950) 45%, transparent);

        --font-sans: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        --font-mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        --text-2xs: 11px;
        --text-xs: 12px;
        --text-sm: 13px;
        --text-md: 14px;
        --text-lg: 16px;
        --text-xl: 18px;
        --text-2xl: 20px;
        --type-body: 400 var(--text-md) / 1.5 var(--font-sans);
        --type-overline: 500 var(--text-2xs) / 1.2 var(--font-mono);
        --tracking-caps: 0.06em;

        --radius-sm: 4px;
        --radius-md: 6px;
        --radius-lg: 8px;
        --radius-xl: 12px;
        --radius-full: 999px;
        --radius-control: var(--radius-md);
        --radius-badge: var(--radius-sm);
        --control-xs: 24px;
        --type-card-title: 600 var(--text-md) / 1.4 var(--font-sans);
        --type-body-sm: 400 var(--text-sm) / 1.45 var(--font-sans);
        --type-caption: 400 var(--text-xs) / 1.4 var(--font-sans);
        --type-mono: 400 var(--text-sm) / 1.5 var(--font-mono);
        --control-sm: 28px;
        --control-md: 32px;

        --shadow-1: 0 1px 2px rgba(16, 16, 15, 0.05);
        --shadow-2: 0 4px 12px -2px rgba(16, 16, 15, 0.08), 0 1px 3px rgba(16, 16, 15, 0.05);
        --shadow-3: 0 16px 40px -8px rgba(16, 16, 15, 0.18), 0 2px 6px rgba(16, 16, 15, 0.06);
        --ease-out: cubic-bezier(0.2, 0.8, 0.2, 1);
        --duration-fast: 120ms;
        --duration-base: 200ms;
        --duration-slow: 280ms;
      }
      [data-theme="dark"] {
        --surface-selected: color-mix(in oklab, var(--ember-500) 12%, var(--gray-900));
        --fg-disabled: var(--gray-600);
        --accent-hover: var(--ember-400);
        --accent-subtle: color-mix(in oklab, var(--ember-500) 16%, transparent);
        --accent-subtle-fg: var(--ember-300);
        --success-subtle: color-mix(in oklab, var(--green-500) 16%, transparent);
        --success-fg: #6fd69b;
        --success-border: color-mix(in oklab, var(--green-500) 30%, transparent);
        --warning-subtle: color-mix(in oklab, var(--amber-500) 16%, transparent);
        --warning-fg: var(--flare-300);
        --warning-border: color-mix(in oklab, var(--amber-500) 30%, transparent);
        --danger-subtle: color-mix(in oklab, var(--red-500) 20%, transparent);
        --danger-fg: #ff8a97;
        --danger-border: color-mix(in oklab, var(--red-500) 36%, transparent);
        --info-subtle: color-mix(in oklab, var(--blue-500) 18%, transparent);
        --info-fg: #93b5f5;
        --info-border: color-mix(in oklab, var(--blue-500) 34%, transparent);
        --overlay: color-mix(in oklab, #000 65%, transparent);
        --shadow-1: 0 0 0 1px rgba(255, 255, 255, 0.04);
        --shadow-2: 0 4px 12px -2px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.06);
        --shadow-3: 0 16px 40px -8px rgba(0, 0, 0, 0.65), 0 0 0 1px rgba(255, 255, 255, 0.08);
      }
      /* packages/ui/src/appearance/palettes/light.css */
      :root[data-palette="light"] {
        --fg-1: var(--gray-800);
        --fg-2: var(--gray-500);
        --fg-3: var(--gray-400);
        --border: var(--gray-100);
        --border-subtle: #efefec;
        --border-strong: var(--gray-150);
        --surface-hover: var(--gray-25);
        --neutral-subtle: var(--gray-50);
        --neutral-fg: var(--gray-500);
        --neutral-border: var(--gray-100);
      }
      /* packages/ui/src/appearance/palettes/dark.css */
      :root[data-palette="dark"] {
        --bg: #161615;
        --surface: #1d1d1b;
        --surface-raised: #242422;
        --surface-sunken: #131312;
        --surface-hover: #222220;
        --surface-selected: #2a2420;
        --surface-inverse: #e6e6e2;
        --fg-1: #d9d9d5;
        --fg-2: #9a9a94;
        --fg-3: #6f6f69;
        --fg-inverse: #161615;
        --border: #262624;
        --border-subtle: #222220;
        --border-strong: #33332f;
        --primary: #d9d9d5;
        --primary-fg: #161615;
        --primary-hover: #e6e6e2;
        --control-hover: #262624;
        --control-press: #2e2e2b;
        --neutral-subtle: #242422;
        --neutral-fg: #9a9a94;
        --neutral-border: #2e2e2b;
      }
      /* packages/ui/src/appearance/densities/comfortable.css */
      :root[data-density="comfortable"] {
        --pad-card: 16px 18px;
        --gap-card: 12px;
        --pad-row: 14px 18px;
        --pad-page: 24px;
        --gap-panel: 20px;
        --radius-card: 10px;
        --text-item: 14px;
        --text-body: 13px;
        --control-h: 28px;
        --line: 1.5;
      }

      /* ---------- Base (design-system/tokens/base.css) ---------- */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg-1);
        font: var(--type-body);
        -webkit-font-smoothing: antialiased;
        font-feature-settings: "cv11";
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      a {
        color: var(--text-link);
        text-decoration: underline;
        text-decoration-thickness: 1px;
        text-underline-offset: 3px;
        text-decoration-color: var(--border-strong);
      }
      a:hover {
        color: var(--text-link-hover);
        text-decoration-color: currentColor;
      }
      code,
      kbd,
      pre {
        font-family: var(--font-mono);
      }
      :focus-visible {
        outline: none;
        box-shadow: var(--focus-ring);
      }
      ::selection {
        background: color-mix(in oklab, var(--ember-500) 25%, transparent);
      }
      button {
        font: inherit;
        color: inherit;
      }
      .num {
        font-variant-numeric: tabular-nums;
      }
      [hidden] {
        display: none !important;
      }

      /* ---------- Controls ---------- */
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: var(--control-md);
        padding: 0 12px;
        border: 1px solid var(--border-strong);
        border-radius: var(--radius-control);
        background: var(--surface);
        color: var(--fg-1);
        font-size: var(--text-sm);
        font-weight: 500;
        cursor: pointer;
        white-space: nowrap;
        transition: background var(--duration-fast);
      }
      .btn:hover {
        background: var(--control-hover);
      }
      .btn:active {
        background: var(--control-press);
      }
      .btn:disabled {
        color: var(--fg-disabled);
        cursor: not-allowed;
        background: var(--surface);
      }
      .btn.primary {
        background: var(--primary);
        border-color: var(--primary);
        color: var(--primary-fg);
      }
      .btn.primary:hover {
        background: var(--primary-hover);
      }
      .btn.primary:disabled {
        background: var(--neutral-subtle);
        border-color: var(--border);
        color: var(--fg-disabled);
      }
      .btn.accent {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--fg-on-accent);
      }
      .btn.accent:hover {
        background: var(--accent-hover);
      }
      .btn.danger {
        color: var(--danger-fg);
      }
      .btn.ghost {
        border-color: transparent;
        background: transparent;
      }
      .btn.ghost:hover {
        background: var(--control-hover);
      }
      .btn.xs {
        height: var(--control-sm);
        padding: 0 10px;
      }
      .btn.icon {
        justify-content: center;
        width: var(--control-md);
        padding: 0;
      }
      .btn.xs.icon {
        width: var(--control-sm);
      }
      .linklike {
        border: 0;
        background: none;
        padding: 0;
        cursor: pointer;
        color: var(--fg-2);
        font-size: inherit;
        text-decoration: underline;
        text-underline-offset: 3px;
        text-decoration-color: var(--border-strong);
      }
      .linklike:hover {
        color: var(--text-link-hover);
      }

      .badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 22px;
        padding: 0 8px;
        border-radius: var(--radius-badge);
        font-size: var(--text-xs);
        font-weight: 500;
        border: 1px solid var(--neutral-border);
        background: var(--neutral-subtle);
        color: var(--neutral-fg);
        white-space: nowrap;
      }
      .badge.success {
        background: var(--success-subtle);
        color: var(--success-fg);
        border-color: var(--success-border);
      }
      .badge.warning {
        background: var(--warning-subtle);
        color: var(--warning-fg);
        border-color: var(--warning-border);
      }
      .badge.danger {
        background: var(--danger-subtle);
        color: var(--danger-fg);
        border-color: var(--danger-border);
      }
      .badge.info {
        background: var(--info-subtle);
        color: var(--info-fg);
        border-color: var(--info-border);
      }
      .badge.accent {
        background: var(--accent-subtle);
        color: var(--accent-subtle-fg);
        border-color: transparent;
      }
      .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: currentColor;
        flex: none;
      }
      .dot.live {
        background: var(--accent);
        animation: pulse-dot 1.6s var(--ease-out) infinite;
      }
      .overline {
        font: var(--type-overline);
        letter-spacing: var(--tracking-caps);
        text-transform: uppercase;
        color: var(--fg-3);
      }
      .muted {
        color: var(--fg-2);
      }
      .faint {
        color: var(--fg-3);
      }
      .mono {
        font-family: var(--font-mono);
        font-size: 12px;
      }

      .avatar {
        width: 24px;
        height: 24px;
        border-radius: 50%;
        flex: none;
        display: inline-grid;
        place-items: center;
        overflow: hidden;
        font-size: 9px;
        font-weight: 600;
        line-height: 1;
        color: var(--avatar-fg, var(--gray-700));
        background: var(--avatar-bg, var(--gray-100));
      }
      .avatar.lg {
        width: 32px;
        height: 32px;
        font-size: 12px;
      }
      .avatar.sm {
        width: 20px;
        height: 20px;
        font-size: 8px;
      }
      .avatar.command {
        border-radius: var(--radius-sm);
        background: var(--neutral-subtle);
        color: var(--fg-2);
        font-family: var(--font-mono);
      }
      /* A person's name and avatar lead to their page; You and The Office aren't people, so they stay plain. */
      .person {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        min-width: 0;
        color: inherit;
        text-decoration: none;
        border-radius: var(--radius-sm);
      }
      a.person:hover {
        color: var(--fg-1);
      }
      a.person:hover .person-name,
      a.person-name:hover {
        text-decoration: underline;
        text-underline-offset: 2px;
      }
      a.person:hover .avatar {
        box-shadow: 0 0 0 2px var(--border-strong);
      }
      a.person-name {
        color: inherit;
        text-decoration: none;
      }

      /* Scrollbars follow the palette (Chromium and Safari; Firefox takes the colours below). */
      @supports selector(::-webkit-scrollbar) {
        ::-webkit-scrollbar {
          width: 10px;
          height: 10px;
        }
        ::-webkit-scrollbar-track,
        ::-webkit-scrollbar-corner {
          background: transparent;
        }
        ::-webkit-scrollbar-thumb {
          border: 3px solid transparent;
          border-radius: var(--radius-full);
          background: var(--border-strong) padding-box;
        }
        ::-webkit-scrollbar-thumb:hover {
          background: var(--fg-3) padding-box;
        }
      }
      @supports not selector(::-webkit-scrollbar) {
        * {
          scrollbar-width: thin;
          scrollbar-color: var(--border-strong) transparent;
        }
      }
      html[data-theme="dark"] {
        color-scheme: dark;
      }

      @keyframes pulse-dot {
        0% {
          box-shadow: 0 0 0 0 color-mix(in oklab, var(--accent) 55%, transparent);
        }
        70% {
          box-shadow: 0 0 0 7px transparent;
        }
        100% {
          box-shadow: 0 0 0 0 transparent;
        }
      }
      @keyframes pulse-ring {
        0% {
          transform: scale(1);
          opacity: 0.55;
        }
        100% {
          transform: scale(1.9);
          opacity: 0;
        }
      }
      @keyframes blink {
        0%,
        80%,
        100% {
          opacity: 0.25;
        }
        40% {
          opacity: 1;
        }
      }

      /* ---------- Demo toolbar (not part of the design) ---------- */
      .demo {
        flex: none;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px 16px;
        padding: 8px 16px;
        background: var(--surface-inverse);
        color: var(--fg-inverse);
        font-size: var(--text-xs);
      }
      .demo .label {
        font: var(--type-overline);
        letter-spacing: var(--tracking-caps);
        text-transform: uppercase;
        opacity: 0.7;
      }
      .demo .group {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .seg {
        display: inline-flex;
        border: 1px solid color-mix(in oklab, var(--fg-inverse) 25%, transparent);
        border-radius: var(--radius-control);
        overflow: hidden;
      }
      .seg button {
        border: 0;
        background: transparent;
        padding: 4px 9px;
        cursor: pointer;
        color: inherit;
        font-size: var(--text-xs);
        opacity: 0.75;
      }
      .seg button + button {
        border-left: 1px solid color-mix(in oklab, var(--fg-inverse) 25%, transparent);
      }
      .seg button[aria-pressed="true"] {
        background: var(--fg-inverse);
        color: var(--surface-inverse);
        opacity: 1;
        font-weight: 600;
      }
      .demo .title {
        font-weight: 600;
        font-size: var(--text-sm);
      }
      .demo .chip {
        font-family: var(--font-mono);
        font-size: 11px;
        padding: 1px 6px;
        border-radius: var(--radius-sm);
        background: var(--accent);
        color: var(--white);
      }
      .demo .spacer {
        flex: 1;
      }
      .demo .linklike {
        color: inherit;
        opacity: 0.75;
      }

      /* ---------- Page frame ---------- */
      .viewport {
        flex: 1;
        min-height: 0;
        position: relative;
        overflow: hidden;
        margin: 0 auto;
        width: 100%;
        container: app / size;
      }
      .viewport.narrow-demo {
        max-width: 820px;
        border-inline: 1px solid var(--border-strong);
      }
      .scroller {
        height: 100%;
        overflow: auto;
        padding: 16px var(--pad-page) 24px;
        scroll-behavior: smooth;
      }
      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius-card);
      }

      /* ---------- Head ---------- */
      .head {
        display: flex;
        flex-wrap: wrap;
        align-items: flex-start;
        gap: 10px 16px;
        margin-bottom: 14px;
      }
      .head-main {
        flex: 1 1 420px;
        min-width: 0;
      }
      .crumbs {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: var(--text-xs);
        color: var(--fg-3);
        margin-bottom: 4px;
      }
      .project-mark {
        width: 16px;
        height: 16px;
        border-radius: 4px;
        display: inline-grid;
        place-items: center;
        background: var(--teal-500);
        color: var(--white);
        font-size: 9px;
        font-weight: 700;
      }
      .title-row {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 8px 10px;
      }
      .title-row h1 {
        margin: 0;
        font-size: var(--text-2xl);
        line-height: 1.3;
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      .meta-row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 4px 14px;
        margin-top: 6px;
        font-size: var(--text-sm);
        color: var(--fg-2);
      }
      .meta-row .sep {
        color: var(--border-strong);
      }
      .priority {
        display: inline-flex;
        align-items: center;
        gap: 4px;
      }
      .priority svg {
        color: var(--accent);
      }
      .meter {
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }
      .meter .bar {
        width: 84px;
        height: 5px;
        border-radius: 3px;
        background: var(--neutral-subtle);
        box-shadow: inset 0 0 0 1px var(--border);
        overflow: hidden;
      }
      .meter .bar i {
        display: block;
        height: 100%;
        background: var(--fg-2);
        border-radius: 3px;
      }
      .head-actions {
        display: flex;
        gap: 6px;
        align-items: center;
        padding-top: 18px;
      }

      /* ---------- Pipeline rail ---------- */
      .rail {
        padding: 10px 0 0;
        margin-bottom: 14px;
      }
      .rail-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 0 16px 2px;
      }
      .rail-top .muted {
        font-size: var(--text-xs);
      }
      .rail-scroll {
        overflow-x: auto;
        overflow-y: hidden;
        padding: 0 8px 10px;
      }
      .rail-inner {
        --marker-top: 14px;
        position: relative;
        display: flex;
        padding-top: var(--marker-top);
        min-width: 100%;
      }
      .rail-track,
      .rail-fill {
        position: absolute;
        top: calc(var(--marker-top) + 11px);
        height: 2px;
        border-radius: 2px;
      }
      .rail-track {
        background: var(--border-strong);
      }
      .rail-fill {
        background: var(--success);
        transition: width var(--duration-slow) var(--ease-out);
      }
      .rail-fill.live {
        background: linear-gradient(90deg, var(--success) calc(100% - 60px), var(--accent));
      }
      .rail-arcs {
        position: absolute;
        inset: 0;
        pointer-events: none;
        overflow: visible;
      }
      .rail-arcs path {
        fill: none;
        stroke: var(--danger);
        stroke-width: 1.5;
        stroke-dasharray: 4 3;
      }
      .arc-label {
        position: absolute;
        transform: translate(-50%, -50%);
        pointer-events: auto;
        cursor: pointer;
        font-size: 11px;
        font-weight: 600;
        color: var(--danger-fg);
        background: var(--surface);
        border: 1px solid var(--danger-border);
        border-radius: var(--radius-full);
        padding: 1px 7px;
        white-space: nowrap;
      }
      .node {
        flex: 1 1 0;
        min-width: 150px;
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2px;
        padding: 0 6px 8px;
        text-align: center;
        border-radius: var(--radius-lg);
      }
      .node-hit {
        position: absolute;
        inset: 0;
        z-index: 2;
        padding: 0;
        border: 0;
        background: none;
        cursor: pointer;
        border-radius: var(--radius-lg);
      }
      .node .person {
        position: relative;
        z-index: 3;
        white-space: nowrap;
      }
      .node:hover .node-body {
        background: var(--surface-hover);
      }
      .node.selected .node-body {
        background: var(--surface-selected);
        box-shadow: inset 0 0 0 1px color-mix(in oklab, var(--accent) 35%, transparent);
      }
      .node-hit:focus-visible {
        box-shadow: none;
      }
      .node:has(.node-hit:focus-visible) .node-body {
        box-shadow: var(--focus-ring);
      }
      .marker {
        position: relative;
        z-index: 1;
        width: 24px;
        height: 24px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: var(--surface);
        border: 2px solid var(--border-strong);
        color: var(--fg-3);
      }
      .marker svg {
        width: 12px;
        height: 12px;
      }
      .node.gate .marker {
        border-radius: 5px;
        transform: rotate(45deg);
        width: 21px;
        height: 21px;
        margin: 1.5px 0;
      }
      .node.gate .marker svg {
        transform: rotate(-45deg);
      }
      .node.done .marker {
        background: var(--success);
        border-color: var(--success);
        color: var(--white);
      }
      .node.failed .marker {
        background: var(--danger);
        border-color: var(--danger);
        color: var(--white);
      }
      .node.waiting-on-you .marker {
        background: var(--warning);
        border-color: var(--warning);
        color: var(--gray-950);
      }
      .node.running .marker {
        border-color: var(--accent);
        color: var(--accent);
      }
      .node.running .marker::after {
        content: "";
        position: absolute;
        inset: -3px;
        border-radius: inherit;
        border: 2px solid var(--accent);
        animation: pulse-ring 1.6s var(--ease-out) infinite;
      }
      .node.skipped .marker {
        border-style: dashed;
      }
      .node.pending.future .marker {
        border-color: var(--border-strong);
      }
      .node-body {
        width: 100%;
        margin-top: 6px;
        padding: 6px 6px 7px;
        border-radius: var(--radius-lg);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 3px;
        transition: background var(--duration-fast);
      }
      .node-name {
        font-weight: 600;
        font-size: var(--text-sm);
        color: var(--fg-1);
      }
      .node.pending .node-name,
      .node.skipped .node-name {
        color: var(--fg-2);
      }
      .node-who {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font-size: var(--text-xs);
        color: var(--fg-2);
      }
      .node-state {
        font-size: 11px;
        font-weight: 500;
        color: var(--fg-3);
      }
      .node.running .node-state {
        color: var(--accent-subtle-fg);
      }
      .node.failed .node-state {
        color: var(--danger-fg);
      }
      .node.waiting-on-you .node-state {
        color: var(--warning-fg);
      }
      .node.done .node-state {
        color: var(--success-fg);
      }
      .node-meta {
        font-size: 11px;
        color: var(--fg-3);
        font-variant-numeric: tabular-nums;
      }
      .node-optional {
        font-size: 10px;
        color: var(--fg-3);
        font-style: italic;
      }

      /* ---------- Stage history ---------- */
      @keyframes drop-in {
        from {
          opacity: 0;
          transform: translateY(-4px);
        }
      }
      .history-head {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }
      .history-head h2 {
        margin: 0;
        font-size: var(--text-lg);
        font-weight: 600;
      }
      .history-head .grow {
        flex: 1;
      }
      .kbd {
        font-family: var(--font-mono);
        font-size: 10px;
        border: 1px solid var(--border-strong);
        border-bottom-width: 2px;
        border-radius: 4px;
        padding: 0 4px;
        color: var(--fg-2);
      }
      .history-sub {
        font-size: var(--text-sm);
        color: var(--fg-2);
        margin: 4px 0 12px;
      }
      .runs {
        list-style: none;
        margin: 0;
        padding: 0 0 0 20px;
        /* The line is a background, as a border would clip the run markers that sit on it. */
        background: linear-gradient(var(--border), var(--border)) 5px 0 / 2px 100% no-repeat local;
        display: grid;
        gap: 10px;
        /* A Stage with many runs scrolls here, so the conversation below stays within reach. */
        max-height: min(240px, 26vh);
        overflow-y: auto;
      }
      .run {
        position: relative;
        padding: 10px 12px;
        border: 1px solid var(--border);
        border-left: 3px solid var(--border-strong);
        border-radius: var(--radius-lg);
        background: var(--surface);
      }
      .run::before {
        content: "";
        position: absolute;
        left: -22px;
        top: 15px;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--surface);
        border: 2px solid var(--border-strong);
      }
      .run.done {
        border-left-color: var(--success);
      }
      .run.done::before {
        background: var(--success);
        border-color: var(--success);
      }
      .run.failed {
        border-left-color: var(--danger);
      }
      .run.failed::before {
        background: var(--danger);
        border-color: var(--danger);
      }
      .run.running {
        border-left-color: var(--accent);
      }
      .run.running::before {
        border-color: var(--accent);
      }
      .run.waiting-on-you {
        border-left-color: var(--warning);
      }
      .run.waiting-on-you::before {
        background: var(--warning);
        border-color: var(--warning);
      }
      .run.skipped {
        border-left-style: dashed;
      }
      .run-line {
        display: flex;
        align-items: center;
        gap: 8px 12px;
        flex-wrap: wrap;
        font-size: var(--text-sm);
      }
      .run-line .title {
        font-weight: 600;
      }
      .run-line .grow {
        flex: 1;
      }
      .run-facts {
        font-size: var(--text-xs);
        color: var(--fg-2);
        font-variant-numeric: tabular-nums;
      }
      .run-note {
        margin-top: 8px;
        font-size: var(--text-sm);
      }
      .carried {
        margin-top: 6px;
        font-size: var(--text-xs);
        color: var(--danger-fg);
        display: flex;
        gap: 6px;
        align-items: center;
      }
      .handover {
        margin-top: 8px;
        padding: 8px 10px;
        border-radius: var(--radius-md);
        background: var(--surface-sunken);
        border: 1px solid var(--border-subtle);
        font-size: var(--text-sm);
      }
      .handover .overline {
        display: block;
        margin-bottom: 3px;
      }
      .cmd {
        margin-top: 6px;
        display: flex;
        gap: 8px;
        align-items: center;
        font-size: var(--text-xs);
      }
      .cmd code {
        background: var(--surface-sunken);
        border: 1px solid var(--border-subtle);
        padding: 1px 6px;
        border-radius: 4px;
      }

      /* ---------- Body: record | conversation ---------- */
      .body {
        display: grid;
        grid-template-columns: minmax(0, 1.4fr) minmax(360px, 1fr);
        gap: var(--gap-panel);
        align-items: start;
      }

      /* Record */
      .tabs {
        display: flex;
        gap: 20px;
        border-bottom: 1px solid var(--border);
        margin-bottom: 12px;
        overflow-x: auto;
        overflow-y: hidden;
      }
      .tab {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 38px;
        margin-bottom: -1px;
        padding: 0;
        border: 0;
        border-bottom: 2px solid transparent;
        background: transparent;
        color: var(--fg-3);
        font-size: 13px;
        font-weight: 500;
        line-height: 1;
        white-space: nowrap;
        cursor: pointer;
        transition:
          color var(--duration-fast),
          border-color var(--duration-fast);
      }
      .tab[aria-selected="true"] {
        border-bottom-color: var(--accent);
        color: var(--fg-1);
        font-weight: 600;
      }
      .tab .count {
        padding: 3px 5px;
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        background: var(--surface-sunken);
        color: var(--fg-2);
        font: 500 11px/1 var(--font-mono);
      }
      .folds {
        display: grid;
        gap: 8px;
      }
      .fold {
        overflow: hidden;
      }
      .fold-row {
        display: flex;
        align-items: center;
        gap: 10px;
        padding-right: 14px;
      }
      .fold-row:hover {
        background: var(--surface-hover);
      }
      .fold-head {
        flex: 1;
        min-width: 0;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 12px 0 12px 16px;
        border: 0;
        background: none;
        cursor: pointer;
        text-align: left;
      }
      .fold-head .chev {
        flex: none;
        color: var(--fg-3);
        transition: transform var(--duration-fast);
      }
      .fold.open .fold-head .chev {
        transform: rotate(90deg);
      }
      .fold-title {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        flex: none;
        margin-right: 4px;
        font: var(--type-card-title);
      }
      .fold-summary {
        flex: 1;
        min-width: 0;
        font-size: var(--text-sm);
        color: var(--fg-2);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .fold.open .fold-summary {
        visibility: hidden;
      }
      .fold-side {
        flex: none;
        display: flex;
        gap: 6px;
        align-items: center;
      }
      .fold-body {
        padding: 2px 18px 16px 16px;
        font-size: var(--text-sm);
      }
      .fold:not(.open) .fold-body {
        display: none;
      }

      .md {
        line-height: 1.6;
      }
      .md h1,
      .md h2,
      .md h3 {
        font-size: var(--text-md);
        font-weight: 600;
        margin: 14px 0 4px;
      }
      .md p {
        margin: 0 0 8px;
      }
      .md ul,
      .md ol {
        margin: 0 0 8px;
        padding-left: 20px;
      }
      .md li {
        margin: 2px 0;
      }
      .md code {
        font-size: 12px;
        background: var(--surface-sunken);
        border: 1px solid var(--border-subtle);
        padding: 0 4px;
        border-radius: 4px;
      }
      .md pre {
        background: var(--surface-sunken);
        border: 1px solid var(--border-subtle);
        border-radius: var(--radius-md);
        padding: 8px 10px;
        overflow-x: auto;
        font-size: 12px;
      }
      .md pre code {
        border: 0;
        padding: 0;
        background: none;
      }
      .files {
        list-style: none;
        margin: 6px 0 0;
        padding: 0;
        display: grid;
        gap: 3px;
      }
      .files li {
        display: flex;
        gap: 8px;
        align-items: center;
        font-family: var(--font-mono);
        font-size: 12px;
        color: var(--fg-2);
      }
      .block-foot {
        margin-top: 12px;
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
        font-size: var(--text-xs);
        color: var(--fg-3);
      }

      .dod {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        gap: 6px;
      }
      .dod li {
        display: grid;
        grid-template-columns: 18px 1fr;
        gap: 8px;
        align-items: start;
      }
      .check {
        width: 16px;
        height: 16px;
        margin-top: 2px;
        border-radius: 4px;
        border: 1.5px solid var(--border-strong);
        display: grid;
        place-items: center;
        color: var(--white);
      }
      .check.on {
        background: var(--success);
        border-color: var(--success);
      }
      .dod .n {
        color: var(--fg-3);
        font-variant-numeric: tabular-nums;
        margin-right: 4px;
      }

      .rows {
        display: grid;
        gap: 6px;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 10px;
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        background: var(--surface);
      }
      .row .grow {
        flex: 1;
        min-width: 0;
      }
      .row .ico {
        width: 26px;
        height: 26px;
        border-radius: 6px;
        background: var(--neutral-subtle);
        color: var(--fg-2);
        display: grid;
        place-items: center;
        flex: none;
      }

      .changes-sum {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 16px;
        align-items: center;
        margin-bottom: 10px;
        font-size: var(--text-sm);
      }
      .add {
        color: var(--success-fg);
      }
      .del {
        color: var(--danger-fg);
      }
      .diff {
        margin-top: 10px;
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        overflow: hidden;
        font-size: 12px;
      }
      .diff-head {
        padding: 6px 10px;
        background: var(--surface-sunken);
        border-bottom: 1px solid var(--border);
        font-family: var(--font-mono);
      }
      .diff pre {
        margin: 0;
        padding: 6px 0;
        overflow-x: auto;
        line-height: 1.55;
      }
      .diff span {
        display: block;
        padding: 0 10px;
        white-space: pre;
      }
      .diff .a {
        background: var(--success-subtle);
      }
      .diff .d {
        background: var(--danger-subtle);
      }

      /* Attachments: shell/attachments/attachment-gallery.tsx, by round. */
      .attachments-tab {
        padding: 14px 16px;
      }
      .attachments-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 10px;
        font-size: var(--text-sm);
      }
      .attachment-gallery,
      .attachment-round-content {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .attachment-round {
        border-top: 1px solid var(--border);
        padding-top: 8px;
      }
      .attachment-round:first-child {
        border-top: 0;
        padding-top: 0;
      }
      .attachment-round[open] > summary {
        margin-bottom: 8px;
      }
      .attachment-round > summary {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
        font: var(--type-body-sm);
        list-style: none;
        cursor: pointer;
      }
      .attachment-round > summary::-webkit-details-marker {
        display: none;
      }
      .attachment-round .chev {
        display: inline-flex;
        color: var(--fg-3);
        transition: transform var(--duration-fast);
      }
      .attachment-round[open] .chev {
        transform: rotate(90deg);
      }
      .attachment-round-name {
        flex: none;
        font-weight: 600;
      }
      .attachment-round-feedback {
        overflow: hidden;
        color: var(--fg-3);
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      /* One size wherever a screenshot shows: the live app's 160 by 100. */
      .attachment-thumbnails {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .attachment-thumbnail {
        display: block;
        flex: none;
        width: 160px;
        height: 100px;
        padding: 0;
        overflow: hidden;
        border: 1px solid var(--border);
        border-radius: var(--radius-card);
        background: var(--surface-sunken);
        cursor: zoom-in;
      }
      .attachment-thumbnail:hover,
      .attachment-thumbnail:focus-visible {
        border-color: var(--border-strong);
      }
      .attachment-thumbnail svg {
        display: block;
        width: 100%;
        height: 100%;
      }
      .attachment-chips {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .attachment-chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        max-width: 100%;
        height: 26px;
        padding: 0 8px;
        border: 1px solid var(--border);
        border-radius: var(--radius-control);
        background: var(--surface);
        color: var(--fg-3);
        font-size: var(--text-xs);
      }
      .attachment-chip a {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .tab-empty {
        padding: var(--pad-card);
        color: var(--fg-2);
        font-size: var(--text-sm);
      }

      /* Needs you: the page's full width under the rail, so a Decision has room for its screenshots. */
      .needs-you {
        margin-bottom: var(--gap-panel);
        padding: var(--pad-card);
        border-color: var(--warning-border);
        scroll-margin-top: 12px;
      }
      .needs-you.clear {
        padding: 10px 16px;
        border-color: var(--border);
      }
      .needs-head {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        margin-bottom: 12px;
      }
      .needs-head h2 {
        margin: 0;
        font: var(--type-card-title);
      }
      .needs-head .muted {
        font-size: var(--text-sm);
      }
      .count-pill {
        min-width: 18px;
        height: 18px;
        padding: 0 5px;
        border-radius: 9px;
        background: var(--warning);
        color: var(--gray-950);
        font-size: 11px;
        font-weight: 700;
        display: inline-grid;
        place-items: center;
      }
      .needs-list {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
      }
      .ask {
        flex: 1 1 420px;
        min-width: 0;
        container: ask / inline-size;
        padding: 14px 16px;
        border: 1px solid var(--warning-border);
        border-radius: 10px;
        background: var(--warning-subtle);
      }
      .ask-kind {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px 8px;
        font-size: var(--text-xs);
        color: var(--fg-2);
      }
      .ask-kind .person {
        color: var(--fg-1);
        font-weight: 500;
      }
      .ask-kind .grow {
        flex: 1;
      }
      .ask-q {
        margin: 10px 0 0;
        font-weight: 600;
        font-size: var(--text-md);
        line-height: 1.4;
      }
      .ask-ctx,
      .why {
        margin: 6px 0 0;
        font: var(--type-body-sm);
        color: var(--fg-2);
      }
      .ask-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 12px;
      }
      .option {
        height: auto;
        min-height: var(--control-md);
        padding: 5px 12px;
        text-align: left;
        white-space: normal;
      }
      .free {
        display: flex;
        gap: 8px;
        margin-top: 10px;
      }
      .free input,
      .sendback textarea,
      .sendback select {
        flex: 1;
        min-width: 0;
        height: var(--control-md);
        border: 1px solid var(--border-strong);
        border-radius: var(--radius-control);
        background: var(--surface);
        color: var(--fg-1);
        padding: 0 10px;
        font: inherit;
        font-size: var(--text-sm);
      }
      .sendback {
        margin-top: 10px;
        display: grid;
        gap: 6px;
      }
      .sendback textarea {
        height: 56px;
        padding: 6px 10px;
        resize: vertical;
      }
      /* A Task can gather many screenshots: past this height they scroll, so Needs you stays small. */
      .needs-attachments-head {
        margin-bottom: 6px;
        font: var(--type-caption);
        color: var(--fg-2);
      }
      .needs-attachments-scroll {
        max-height: 176px;
        overflow-y: auto;
        overscroll-behavior: contain;
      }
      .facts + .needs-attachments {
        margin-top: 12px;
      }
      .facts {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
        gap: 8px;
        align-content: start;
      }
      .fact {
        padding: 10px 12px;
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        background: var(--surface);
        font: var(--type-caption);
        color: var(--fg-3);
      }
      .fact b {
        display: block;
        margin-bottom: 2px;
        font: var(--type-card-title);
        color: var(--fg-1);
      }
      .nothing {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: var(--text-sm);
        color: var(--fg-2);
      }
      .nothing svg {
        color: var(--success);
      }
      /* Takes over whenever the Needs you card itself is out of the window, so it never goes unseen. */
      .needs-pin {
        position: absolute;
        top: 8px;
        left: var(--pad-page);
        right: var(--pad-page);
        z-index: 15;
        display: flex;
        align-items: center;
        gap: 8px;
        height: 44px;
        padding: 0 8px 0 12px;
        border: 1px solid var(--warning-border);
        border-radius: 10px;
        background: var(--warning-subtle);
        box-shadow: var(--shadow-2);
        font-size: var(--text-sm);
      }
      .needs-pin[hidden] {
        display: none;
      }
      .needs-pin.below {
        top: auto;
        bottom: 12px;
      }
      .needs-pin b {
        flex: none;
        font-weight: 600;
      }
      .needs-pin .grow {
        flex: 1;
        min-width: 0;
        color: var(--fg-2);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .record {
        scroll-margin-top: 64px;
      }

      .conversation {
        position: sticky;
        top: calc(12px + var(--pin-room, 0px));
        height: 520px;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius-card);
      }
      .drawer-close {
        display: none;
      }

      .thread-head {
        flex: none;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 16px;
        border-bottom: 1px solid var(--border-subtle);
      }
      .thread-head .grow {
        flex: 1;
        min-width: 0;
      }
      .thread-head .name {
        font: var(--type-card-title);
      }
      .thread-head .sub {
        font: var(--type-caption);
        color: var(--fg-3);
      }
      .switch-label {
        flex: none;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 0;
        border: 0;
        background: none;
        color: var(--fg-2);
        font: var(--type-caption);
        cursor: pointer;
      }
      .switch {
        position: relative;
        width: 28px;
        height: 16px;
        border-radius: 999px;
        background: var(--gray-200);
        transition: background var(--duration-fast) var(--ease-out);
      }
      .switch::after {
        content: "";
        position: absolute;
        top: 2px;
        left: 2px;
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: var(--white);
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
        transition: left var(--duration-base) var(--ease-out);
      }
      .switch-label[aria-checked="true"] .switch {
        background: var(--accent);
      }
      .switch-label[aria-checked="true"] .switch::after {
        left: 14px;
      }

      /* Messages: shell/conversation/conversation.css */
      .message-list {
        flex: 1;
        min-height: 56px;
        overflow: auto;
        padding: 14px 16px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        background: var(--surface-sunken);
        overscroll-behavior: contain;
      }
      /* A Handover note or a Decision: the cards that stand out from the plain turns around them. */
      .message {
        padding: 10px 12px;
        border-radius: 10px;
        font: var(--type-body-sm);
        line-height: 1.55;
        color: var(--fg-1);
      }
      .message.handover-note {
        border: 1px solid var(--info-border);
        background: var(--info-subtle);
      }
      .message.decision-card {
        border: 1px solid var(--warning-border);
        background: var(--warning-subtle);
      }
      .message-by {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 4px;
        font: var(--type-caption);
        font-weight: 500;
        color: var(--fg-3);
      }
      .message-by .person {
        color: var(--fg-2);
      }
      .message-text {
        overflow-wrap: anywhere;
      }
      .message-text p {
        margin: 0 0 6px;
      }
      .message-text p:last-child {
        margin: 0;
      }
      .message-text code {
        font-size: 12px;
        background: var(--surface-sunken);
        padding: 0 4px;
        border-radius: 4px;
      }
      .decision-question {
        font-weight: 500;
      }
      .decision-hint {
        margin: 6px 0 0;
        font: var(--type-caption);
        color: var(--fg-3);
      }
      .decision-answered {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-top: 8px;
        font: var(--type-caption);
        color: var(--success-fg);
      }
      /* A turn: one author's neighbouring messages, on the column's own surface. */
      .turn {
        min-width: 0;
        font: var(--type-body-sm);
        line-height: 1.55;
        color: var(--fg-1);
      }
      .turn-by {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 2px;
        font: var(--type-caption);
        color: var(--fg-3);
      }
      .turn-by .person {
        color: var(--fg-1);
        font-weight: 600;
      }
      .turn-by .avatar {
        display: none;
      }
      .turn.mine {
        padding: 6px 10px;
        border-radius: 8px;
        background: var(--surface-sunken);
      }
      .tool-calls {
        display: grid;
        gap: 2px;
        min-width: 0;
        color: var(--fg-3);
      }
      .tool-call {
        display: flex;
        align-items: center;
        gap: 6px;
        min-width: 0;
      }
      .tool-call svg {
        flex: none;
      }
      .message-summary {
        min-width: 0;
        overflow: hidden;
        font: var(--type-mono);
        font-size: 11px;
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      .thread-end {
        font: var(--type-caption);
        color: var(--fg-3);
      }
      .thread-end.failed {
        color: var(--danger-fg);
      }
      .message-answering {
        display: inline-flex;
        gap: 6px;
        align-items: center;
        min-width: 0;
        font: var(--type-caption);
        color: var(--fg-3);
      }
      .message-answering i {
        flex: none;
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: var(--fg-3);
        animation: blink 1.2s infinite;
      }
      .message-answering i:nth-child(2) {
        animation-delay: 0.15s;
      }
      .message-answering i:nth-child(3) {
        animation-delay: 0.3s;
      }
      /* A chapter: each Thread is a box of its own, and the ones behind you fold to a line. */
      /* In a narrow drawer the time wraps; it stays on the right, under the state. */

      .composer {
        flex: none;
        border-top: 1px solid var(--border-subtle);
        padding: 10px 16px 12px;
      }
      .to {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: var(--text-xs);
        color: var(--fg-2);
        margin-bottom: 6px;
      }
      .to .person {
        color: var(--fg-1);
        font-weight: 600;
      }
      .to-place {
        margin-left: -6px;
      }
      .compose-box {
        display: flex;
        gap: 8px;
        align-items: flex-end;
      }
      .compose-box textarea {
        flex: 1;
        min-width: 0;
        height: 56px;
        padding: 6px 10px;
        border: 1px solid var(--border-strong);
        border-radius: var(--radius-control);
        background: var(--surface);
        color: var(--fg-1);
        font: var(--type-body-sm);
        resize: none;
      }
      .compose-box textarea:focus {
        outline: 0;
        border-color: var(--border-focus);
        box-shadow: var(--focus-ring);
      }
      .context-label {
        display: flex;
        gap: 6px;
        align-items: center;
        margin-top: 6px;
        font-size: 11px;
        color: var(--fg-3);
      }
      .ended {
        font-size: var(--text-xs);
        color: var(--fg-2);
        background: var(--surface-sunken);
        border: 1px solid var(--border-subtle);
        border-radius: var(--radius-md);
        padding: 8px 10px;
      }

      .drawer-handle,
      .scrim {
        display: none;
      }
      .lightbox {
        width: min(1040px, 92vw);
        padding: 0;
        overflow: hidden;
        border: 1px solid var(--border);
        border-radius: var(--radius-card);
        background: var(--surface);
        color: var(--fg-1);
        box-shadow: var(--shadow-3);
      }
      .lightbox::backdrop {
        background: var(--overlay);
      }
      .lightbox-head {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 8px 8px 16px;
        border-bottom: 1px solid var(--border-subtle);
        font: var(--type-card-title);
      }
      .lightbox-head .grow {
        flex: 1;
        min-width: 0;
      }
      .lightbox-head .faint {
        font: var(--type-caption);
        white-space: nowrap;
      }
      .lightbox svg[viewBox="0 0 640 400"] {
        display: block;
        width: 100%;
        height: auto;
      }
      .toast {
        position: absolute;
        left: 50%;
        bottom: 20px;
        transform: translate(-50%, 20px);
        opacity: 0;
        pointer-events: none;
        background: var(--surface-inverse);
        color: var(--fg-inverse);
        padding: 8px 14px;
        border-radius: var(--radius-lg);
        font-size: var(--text-sm);
        box-shadow: var(--shadow-3);
        transition: all var(--duration-base) var(--ease-out);
        z-index: 50;
        max-width: 90%;
      }
      .toast.show {
        opacity: 1;
        transform: translate(-50%, 0);
      }

      /* ---------- Round 2: form fields as packages/ui's Select and Textarea ---------- */
      .select,
      .textarea {
        min-width: 0;
        height: var(--control-md);
        padding: 0 10px;
        border: 1px solid var(--border-strong);
        border-radius: var(--radius-control);
        background: var(--surface);
        color: var(--fg-1);
        font: inherit;
        font-size: var(--text-sm);
      }
      .select.xs {
        height: var(--control-sm);
        font-size: var(--text-xs);
      }
      .textarea {
        height: 56px;
        padding: 6px 10px;
        resize: vertical;
      }
      .select:focus,
      .textarea:focus {
        outline: 0;
        border-color: var(--border-focus);
        box-shadow: var(--focus-ring);
      }

      /* ---------- Round 2: the Pipeline proposal inside the rail ---------- */
      .rail-proposal {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        margin-top: 12px;
        padding-top: 12px;
        border-top: 1px dashed var(--border);
        text-align: center;
        font: var(--type-body-sm);
        color: var(--fg-2);
      }
      .rail-proposal p {
        margin: 0;
        max-width: 72ch;
      }
      .rail-proposal b {
        color: var(--fg-1);
      }
      .rail-proposal-actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 6px;
      }

      /* ---------- Round 2: the column beside the conversation ---------- */
      .work-column {
        min-width: 0;
      }
      .needs-area {
        display: grid;
        gap: 12px;
        margin-bottom: var(--gap-panel);
        scroll-margin-top: 12px;
      }
      .needs-area .needs-you {
        margin-bottom: 0;
      }
      .needs-list {
        flex-direction: column;
        flex-wrap: nowrap;
      }
      .ask {
        flex: none;
      }
      .answers {
        display: grid;
        gap: 6px;
        margin-top: 12px;
      }
      .answers .option {
        display: flex;
        justify-content: flex-start;
        gap: 8px;
        width: 100%;
      }
      .answers .option .grow {
        flex: 1;
        min-width: 0;
      }
      .option-tag {
        flex: none;
        font: var(--type-caption);
        opacity: 0.85;
      }
      .ask-choices {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 10px;
        margin-top: 12px;
      }
      .ask-choice {
        display: flex;
        flex-direction: column;
        padding: 12px 14px;
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        background: var(--surface);
      }
      .ask-choice-main {
        margin: 4px 0 0;
        font-weight: 600;
        font-size: var(--text-sm);
      }
      .ask-choice .why {
        flex: 1;
      }
      .ask-choice-foot {
        margin-top: 10px;
      }
      .before-ready {
        padding: 12px 16px;
      }
      .before-ready-head {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px 8px;
        font-size: var(--text-sm);
      }
      .before-ready-head .muted {
        font-size: var(--text-xs);
      }
      .checklist {
        display: grid;
        gap: 6px;
        margin: 10px 0 0;
        padding: 0;
        list-style: none;
        font-size: var(--text-sm);
      }
      .checklist li {
        display: flex;
        align-items: baseline;
        gap: 8px;
      }
      .checklist .check {
        flex: none;
        transform: translateY(2px);
      }

      /* ---------- Round 2: the details window of a Decision or the Gate, and the Stage history window ---------- */
      .modal {
        padding: 0;
        overflow: hidden;
        border: 1px solid var(--border);
        border-radius: var(--radius-card);
        background: var(--surface);
        color: var(--fg-1);
        box-shadow: var(--shadow-3);
      }
      .modal::backdrop {
        background: var(--overlay);
      }
      .details-modal {
        width: min(760px, 94vw);
        max-height: 88vh;
      }
      .details-modal[open] {
        display: flex;
        flex-direction: column;
      }
      .modal-head {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        padding: 10px 10px 10px 16px;
        border-bottom: 1px solid var(--border-subtle);
        font-size: var(--text-xs);
        color: var(--fg-2);
      }
      .modal-head .grow {
        flex: 1;
      }
      .modal-body {
        padding: 4px 18px 18px;
        overflow-y: auto;
      }
      .modal-body .facts,
      .modal-body .needs-attachments {
        margin-top: 14px;
      }
      .history-modal {
        width: min(1180px, 94vw);
        height: min(86vh, 900px);
      }
      .history-window {
        display: flex;
        flex-direction: column;
        height: 100%;
        padding: 14px 16px 16px;
      }

      /* ---------- Round 2: the Stage history in the page, in place of what sits under the rail ---------- */
      .history-page {
        animation: drop-in var(--duration-base) var(--ease-out);
      }
      .history-back {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 10px;
        font-size: var(--text-sm);
      }
      .history-card {
        display: flex;
        flex-direction: column;
        height: max(460px, calc(100cqh - 250px));
        padding: 14px 16px 16px;
      }
      .history-head .keys {
        font-size: 11px;
      }
      .history-panes {
        flex: 1;
        min-height: 0;
        display: grid;
        grid-template-columns: minmax(280px, 380px) minmax(0, 1fr);
        gap: 14px;
      }
      .history-panes .runs {
        max-height: none;
        min-height: 0;
        align-content: start;
        padding-right: 4px;
      }
      .history-empty {
        font-size: var(--text-sm);
      }
      .run.shown {
        background: var(--surface-selected);
      }
      .run-shown {
        font-size: var(--text-xs);
      }
      .run .run-facts {
        margin-top: 2px;
      }
      .run-thread {
        display: flex;
        flex-direction: column;
        min-height: 0;
        border: 1px solid var(--border);
        border-radius: var(--radius-card);
        background: var(--surface);
      }
      .run-thread.empty {
        align-items: center;
        justify-content: center;
        padding: 24px;
        font-size: var(--text-sm);
        background: var(--surface-sunken);
      }
      .run-thread-head,
      .run-thread-foot {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        font-size: var(--text-xs);
      }
      .run-thread-head {
        border-bottom: 1px solid var(--border-subtle);
      }
      .run-thread-foot {
        border-top: 1px solid var(--border-subtle);
        color: var(--fg-3);
      }
      .run-thread-head .grow,
      .run-thread-foot .grow {
        flex: 1;
        min-width: 0;
      }
      .run-thread-body {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 12px;
        padding: 12px;
      }

      /* ---------- Round 2: the conversation's tabs, one per person ---------- */
      .conversation-tabs {
        flex: none;
        gap: 16px;
        margin: 0;
        padding: 0 14px;
      }
      .conversation-tabs .tab {
        gap: 6px;
      }
      .cache {
        display: inline-flex;
        align-items: center;
        gap: 2px;
        font: 500 11px/1 var(--font-mono);
      }
      .cache.warm {
        color: var(--warning-fg);
      }
      .cache.cold {
        color: var(--info-fg);
      }
      .thread-head .cache {
        margin-right: 4px;
      }
      .working-now {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 14px;
        border-bottom: 1px solid var(--border-subtle);
        background: var(--accent-subtle);
        font-size: var(--text-xs);
      }
      .working-now .grow {
        flex: 1;
        min-width: 0;
      }
      .thread-empty {
        margin: auto 0;
        padding: 24px 8px;
        text-align: center;
        font-size: var(--text-sm);
        color: var(--fg-3);
      }
      .segmented {
        display: inline-flex;
        flex: none;
        border: 1px solid var(--border-strong);
        border-radius: var(--radius-control);
        overflow: hidden;
      }
      .segmented button {
        height: 22px;
        padding: 0 8px;
        border: 0;
        background: var(--surface);
        color: var(--fg-2);
        font-size: 11px;
        cursor: pointer;
      }
      .segmented button + button {
        border-left: 1px solid var(--border);
      }
      .segmented button[aria-pressed="true"] {
        background: var(--surface-selected);
        color: var(--fg-1);
        font-weight: 600;
      }
      .context-label {
        flex-wrap: wrap;
      }
      .to .select {
        margin-left: 2px;
      }
      .drawer-close {
        justify-content: flex-end;
        padding: 6px 8px 0;
      }

      /* ---------- Narrow: 900px and under ---------- */
      @container app (max-width: 900px) {
        .scroller {
          padding: 12px 14px 80px;
        }
        .head-actions {
          padding-top: 0;
        }
        .needs-pin.below {
          bottom: 68px;
        }
        .rail-inner {
          min-width: max-content;
        }
        .node {
          flex: 0 0 150px;
        }
        .body {
          grid-template-columns: minmax(0, 1fr);
        }
        .history-panes {
          grid-template-columns: minmax(0, 1fr);
          grid-template-rows: auto minmax(320px, 1fr);
          overflow-y: auto;
        }
        .conversation {
          position: absolute;
          top: 0;
          right: 0;
          bottom: 0;
          height: auto;
          width: min(440px, 94cqw);
          z-index: 30;
          border-radius: 0;
          border-width: 0 0 0 1px;
          box-shadow: var(--shadow-3);
          transform: translateX(104%);
          transition: transform var(--duration-slow) var(--ease-out);
        }
        .viewport.drawer-open .conversation {
          transform: none;
        }
        .drawer-close {
          display: inline-flex;
        }
        .scrim {
          display: block;
          position: absolute;
          inset: 0;
          z-index: 20;
          background: var(--overlay);
          opacity: 0;
          pointer-events: none;
          transition: opacity var(--duration-slow);
        }
        .viewport.drawer-open .scrim {
          opacity: 1;
          pointer-events: auto;
        }
        .drawer-handle {
          display: inline-flex;
          position: absolute;
          right: 16px;
          bottom: 16px;
          z-index: 10;
          height: 40px;
          padding: 0 14px;
          border-radius: var(--radius-full);
          box-shadow: var(--shadow-3);
          gap: 8px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation: none !important;
          transition: none !important;
          scroll-behavior: auto !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="demo" role="toolbar" aria-label="Proposal controls">
      <span class="title">Task page, round 2</span><span class="chip">proposal</span>
      <div class="group">
        <span class="label">Scenario</span>
        <div class="seg" id="scenario-switch"></div>
      </div>
      <div class="group">
        <span class="label">Stage history</span>
        <div class="seg" id="history-switch"></div>
      </div>
      <div class="group">
        <span class="label">Width</span>
        <div class="seg" id="width-switch"></div>
      </div>
      <div class="group">
        <span class="label">Palette</span>
        <div class="seg" id="palette-switch"></div>
      </div>
      <span class="spacer"></span>
      <button class="linklike" data-action="reset-folds" type="button">
        Forget remembered folds
      </button>
    </div>

    <div class="viewport" id="viewport">
      <div class="scroller" id="scroller">
        <header class="head" id="head"></header>
        <section class="rail card" id="rail" aria-label="Pipeline"></section>
        <section class="history-page" id="history-page" hidden aria-live="polite"></section>
        <div class="body" id="body">
          <div class="work-column">
            <div class="needs-area" id="needs"></div>
            <main class="record" id="record"></main>
          </div>
          <aside class="conversation" id="conversation" aria-label="Conversation"></aside>
        </div>
      </div>
      <div class="needs-pin" id="needs-pin" hidden></div>
      <div class="scrim" data-action="close-drawer"></div>
      <button
        class="btn primary drawer-handle"
        id="drawer-handle"
        data-action="open-drawer"
        type="button"

      function markdown(source) {

        const flushPara = () => {
          if (para.length) {
            out.push(`<p>${inline(para.join(" "))}</p>`);

            );

          if (fence !== null) {
            if (line.startsWith("```")) {
              out.push(`<pre><code>${esc(fence.join("\n"))}</code></pre>`);
              fence = null;
            } else fence.push(line);
            continue;

            flushPara();
            flushList();
            fence = [];

          const bullet = /^[-*]\s+(.*)$/.exec(line);
          const numbered = /^\d+\.\s+(.*)$/.exec(line);

            flushPara();
            flushList();
            out.push(

            if (!list || list.tag !== tag) {

              list = { tag, items: [] };
            }
            list.items.push((bullet || numbered)[1]);
          } else if (!line.trim()) {
            flushPara();
            flushList();
          } else {
            flushList();
            para.push(line.trim());
          }
        }
        flushPara();
        flushList();
        return out.join("");
