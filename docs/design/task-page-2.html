            '<button class="btn primary" disabled title="Confirm the Plan, the Definition of Done and the Pipeline first">Mark Ready</button>',
          "in-progress":
            '<button class="btn" data-action="toast" data-text="Pausing holds the running Stage at its next safe point.">Pause</button><button class="btn danger" data-action="toast" data-text="Stopping ends the running Stage now.">Stop</button>',
          "waiting-on-you":
            '<button class="btn" data-action="toast" data-text="Pausing holds the Task where it waits.">Pause</button>',
          done: `<a class="btn" href="#" data-action="toast" data-text="Opens pull request ${view.data.published} on GitHub.">Open pull request ${view.data.published}</a>`,
        }[task.state];
        $("head").innerHTML = `
          <div class="head-main">
            <div class="crumbs"><span class="project-mark">${PROJECT.mark}</span>${PROJECT.name}<span>/</span>Tasks</div>
            <div class="title-row">
              <h1>${esc(task.title)}</h1>
              <span class="badge ${tone}">${task.state === "in-progress" ? '<span class="dot live"></span>' : ""}${stateWord}</span>
            </div>
            <div class="meta-row">
              <span class="priority">${ICON.flag} High priority</span><span class="sep">·</span>
              <span>Pipeline <b style="font-weight:500;color:var(--fg-1)">Full</b>${task.state === "planning" ? " (proposed)" : ""}</span><span class="sep">·</span>
              <span class="meter" title="Tokens used of the Planner's estimate"><span class="bar"><i style="width:${pct}%"></i></span><span class="num">${kTokens(used)} of ~${kTokens(task.estimatedTokens)} tokens</span></span><span class="sep">·</span>
              <span>${task.tags.map((t) => `#${t}`).join(" ")}</span>
            </div>
          </div>
          <div class="head-actions">${actions}<button class="btn ghost" aria-label="More actions" data-action="toast" data-text="More: Edit Stages for this Task, Drop Task.">···</button></div>`;
      }

      /* ===================== Pipeline rail ===================== */

      /** The node the walk has reached: the live or stopped one, else the last that ran. */
      function currentIndex(stages) {
        const active = stages.findIndex((ts) =>
          ["running", "waiting-on-you", "failed", "paused", "stopped"].includes(ts.state),
        );
        if (active >= 0) return active;
        let last = -1;
        stages.forEach((ts, i) => {
          if (ts.runs.length) last = i;
        });
        return last;
      }

      /** Loop-backs from the run history: each run briefed with a carried failure is one trip back. */
      function loopBacks(stages) {
        const loops = new Map();
        for (const ts of stages)
          for (const r of ts.runs) {
            if (!r.carriedFailure) continue;
            const key = `${r.carriedFailure.stageKey}>${ts.stage.key}`;
            const loop = loops.get(key) || {
              from: r.carriedFailure.stageKey,
              to: ts.stage.key,
              count: 0,
              rounds: r.carriedFailure.rounds,
            };
            loop.count += 1;
            loops.set(key, loop);
          }
        return [...loops.values()];
      }

      /** Room above the track for the loop-back arcs, one level per loop (see layoutRail). */
      function railHeadroom(stages) {
        const loops = loopBacks(stages).length;
        return loops ? `--marker-top: ${26 + loops * 16}px` : "";
      }

      function nodeHtml(ts, index, current) {
        const { stage, state, runs } = ts;
        const time = runs.reduce((a, r) => a + runDuration(r), 0);
        const tok = sumTokens(ts.tokens);
        const glyph =
          {
            done: ICON.check,
            failed: ICON.cross,
            "waiting-on-you": ICON.pause,
            skipped: ICON.dash,
          }[state] || "";
        const facts =
          state === "skipped"
            ? "Not needed"
            : runs.length === 0
              ? view.data.task.state === "planning"
                ? "Not started"
                : "Not run yet"
              : [
                  `${runs.length} ${runs.length === 1 ? "run" : "runs"}`,
                  span(time) + (state === "running" ? " so far" : ""),
                  stage.kind === "agent" ? kTokens(tok) : null,
                ]
                  .filter(Boolean)
                  .join(" · ");
        const selected = view.selectedStage === stage.key;
        const classes = [
          "node",
          state,
          stage.kind,
          index > current ? "future" : "",
          selected ? "selected" : "",
        ].join(" ");
        return `<div class="${classes}" data-stage="${stage.key}">
          <button class="node-hit" role="tab" data-stage="${stage.key}" aria-selected="${selected}" aria-label="${esc(stage.name)}: ${STATE_WORDS[state]}" title="${esc(stage.name)}: ${STATE_WORDS[state]}"></button>
          <span class="marker">${glyph}</span>
          <span class="node-body">
            <span class="node-name">${esc(stage.name)}${stage.optional ? '<span class="node-optional"> · optional</span>' : ""}</span>
            <span class="node-who">${stageWorker(stage)}</span>
            <span class="node-state">${state === "running" ? '<span class="dot live" style="display:inline-block;margin-right:4px;vertical-align:1px"></span>' : ""}${STATE_WORDS[state]}${ts.wentBack ? ` · went back to ${byKey(ts.wentBack.stageKey).name}` : ""}</span>
            <span class="node-meta">${facts}</span>
          </span>
        </div>`;
      }

      function renderRail() {
        const { stages, task } = view.data;
        const current = currentIndex(stages);
        const doneCount = stages.filter(
          (ts) => ts.state === "done" || ts.state === "skipped",
        ).length;
        const at = stages[current];
        const caption =
          task.state === "planning"
            ? "Starts once you confirm the Plan, the Definition of Done and the Pipeline"
            : task.state === "backlog"
              ? "Not started"
              : task.state === "done"
                ? `All ${stages.length} Stages finished`
                : at && at.state !== "done"
                  ? `At ${at.stage.name}: ${STATE_WORDS[at.state].toLowerCase()}`
                  : `${doneCount} of ${stages.length} Stages finished`;
        const railScrollLeft = $("rail-scroll")?.scrollLeft ?? 0;
        $("rail").innerHTML = `
          <div class="rail-top"><span class="overline">Pipeline · Full</span><span class="muted">${caption} · select a Stage for its history</span></div>
          <div class="rail-scroll" id="rail-scroll">
            <div class="rail-inner" id="rail-inner" style="${railHeadroom(stages)}" role="tablist" aria-label="Stages">
              <div class="rail-track" id="rail-track"></div><div class="rail-fill" id="rail-fill"></div>
              <svg class="rail-arcs" id="rail-arcs" aria-hidden="true"></svg>
              ${stages.map((ts, i) => nodeHtml(ts, i, current)).join("")}
            </div>
          </div>${proposedPipelineHtml()}`;
        $("rail-scroll").scrollLeft = railScrollLeft;
        requestAnimationFrame(layoutRail);
      }

      /** The Planner's Pipeline proposal sits in the rail it would change, under the Stages. */
      function proposedPipelineHtml() {
        const proposed = view.data.task.proposedPipeline;
        if (!proposed) return "";
        return `<div class="rail-proposal">
          <p><span class="badge warning">Proposed by ${personName("planner")}</span> <b>Full</b> (the one it follows): ${esc(proposed.reason)}</p>
          <div class="rail-proposal-actions">
            <button class="btn primary xs" data-action="toast" data-text="Confirms the Full Pipeline.">Confirm</button>
            <select class="select xs" aria-label="Another Pipeline"><option>Another Pipeline…</option><option>Quick fix</option><option>Docs only</option></select>
          </div>
        </div>`;
      }

      /** Narrow: the rail scrolls, so a Stage that's out of view is brought to the middle of it. */
      function revealNode(key) {
        const scroller = $("rail-scroll");
        const node = scroller.querySelector(`.node[data-stage="${key}"]`);
        const area = scroller.getBoundingClientRect();
        const box = node.getBoundingClientRect();
        if (box.left < area.left || box.right > area.right)
          scroller.scrollLeft += box.left - area.left - (area.width - box.width) / 2;
        return node;
      }

      const focusNode = (key) =>
        revealNode(key).querySelector(".node-hit").focus({ preventScroll: true });

      function revealCurrentStage() {
        const { stages } = view.data;
        const at = stages[currentIndex(stages)];
        if (at) revealNode(at.stage.key);
      }

      /** Positions the track, its fill and the loop-back arcs from where the nodes landed. */
      function layoutRail() {
        const inner = $("rail-inner");
        if (!inner) return;
        const { stages } = view.data;
        // Shorter loops nest under longer ones: each is one level higher than the loops it spans.
        const indexOf = (key) => stages.findIndex((ts) => ts.stage.key === key);
        const loops = loopBacks(stages)
          .map((loop) => ({ ...loop, span: Math.abs(indexOf(loop.from) - indexOf(loop.to)) }))
          .sort((a, b) => a.span - b.span);
        const box = inner.getBoundingClientRect();
        const centers = {};
        inner.querySelectorAll(".node").forEach((node) => {
          const m = node.querySelector(".marker").getBoundingClientRect();
          centers[node.dataset.stage] = {
            x: m.left - box.left + m.width / 2,
            top: m.top - box.top,
          };
        });
        const keys = stages.map((ts) => ts.stage.key);
        const first = centers[keys[0]].x,
          last = centers[keys[keys.length - 1]].x;
        const track = $("rail-track");
        track.style.left = `${first}px`;
        track.style.width = `${last - first}px`;
        const current = currentIndex(stages);
        const fill = $("rail-fill");
        const reached = current < 0 ? first : centers[keys[current]].x;
        fill.style.left = `${first}px`;
        fill.style.width = `${reached - first}px`;
        fill.classList.toggle("live", stages[current] && stages[current].state === "running");

        const svg = $("rail-arcs");
        inner.querySelectorAll(".arc-label").forEach((l) => l.remove());
        svg.innerHTML =
          '<defs><marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L9 5 0 9z" fill="var(--danger)"/></marker></defs>' +
          loops
            .map((loop, i) => {
              const a = centers[loop.from],
                b = centers[loop.to];
              const y = a.top - 2,
                height = 28 + i * 21;
              // A longer loop lands left of a shorter one on the same Stage, so the arcs nest instead of crossing.
              const x1 = a.x - 4,
                x2 = b.x + 6 - i * 12;
              const label = document.createElement("button");
              label.className = "arc-label";
              label.type = "button";
              label.dataset.stage = loop.from;
              label.title = `${byKey(loop.from).name} failed and went back to ${byKey(loop.to).name} ${loop.count} ${loop.count === 1 ? "time" : "times"}, of at most ${loop.rounds}`;
              label.textContent = `↺ ${loop.count} of ${loop.rounds}`;
              label.style.left = `${(x1 + x2) / 2}px`;
              label.style.top = `${y - height * 0.8}px`;
              inner.appendChild(label);
              const top = y - height * 0.8,
                r = 6,
                back = x2 < x1 ? -1 : 1;
              return `<path d="M${x1} ${y} V${top + r} Q${x1} ${top} ${x1 + back * r} ${top} H${x2 - back * r} Q${x2} ${top} ${x2} ${top + r} V${y}" marker-end="url(#arrow)"/>`;
            })
            .join("");
      }

      /* ===================== Stage history ===================== */

      function runState(ts, r) {
        const o = r.outcome;
        if (o === null) return ts.stage.kind === "gate" ? "waiting-on-you" : "running";
        if (o.status === "failed") return "failed";
        if (o.skipped) return "skipped";
        return o.status === "needs-decision" ? "waiting-on-you" : "done";
      }

      const RUN_BADGE = {
        done: '<span class="badge success">Done</span>',
        failed: '<span class="badge danger">Failed</span>',
        skipped: '<span class="badge">Skipped</span>',
        running: '<span class="badge accent"><span class="dot live"></span>Running</span>',
        "waiting-on-you": '<span class="badge warning">Waiting on you</span>',
      };

      /** The run whose Thread shows beside the list: the one picked, else the newest. */
      function shownRun(ts) {
        return ts.runs.find((r) => r.id === view.selectedRun) ?? ts.runs.at(-1) ?? null;
      }

      function runHtml(ts, r) {
        const o = r.outcome;
        const state = runState(ts, r);
        const tok = sumTokens(r.tokens);
        const facts = [
          `${clock(r.startedAt)} → ${r.endedAt ? clock(r.endedAt) : "now"}`,
          span(runDuration(r)),
          ts.stage.kind === "agent" ? `${kTokens(tok)} tokens` : null,
          r.session ? `${r.session} session` : null,
        ]
          .filter(Boolean)
          .join(" · ");
        const carried = r.carriedFailure
          ? `<div class="carried">↺ Briefed with what failed in ${esc(byKey(r.carriedFailure.stageKey).name)}, round ${r.carriedFailure.round} of ${r.carriedFailure.rounds}</div>`
          : "";
        const text = o
          ? o.status === "failed"
            ? o.error
            : o.summary
          : ts.stage.kind === "gate"
            ? "Waits for you to look at the changes and let the work continue."
            : "Working now.";
        const commands = r.commandRuns
          .map(
            (c) =>
              `<div class="cmd"><code>${esc(c.commandLine)}</code><span class="${c.outcome === "passed" ? "add" : "del"}">${c.outcome}</span><span class="faint">${c.purpose === "re-run" ? "re-run · " : ""}${span(c.durationMs)}</span></div>`,
          )
          .join("");
        const gate = r.gateAction
          ? `<div class="run-note muted">You chose: ${r.gateAction.kind === "continue" ? "Continue" : r.gateAction.kind === "drop" ? "Drop" : "Send back"}</div>`
          : "";
        const handover =
          o && o.handoverNote
            ? `<div class="handover"><span class="overline">Handover note · ${personLink(ts.stage.role)}</span>${inline(o.handoverNote)}</div>`
            : "";
        const shown = shownRun(ts) === r;
        const choosable = ts.runs.filter((run) => run.threadId).length > 1;
        const pick =
          r.threadId && choosable && !shown
            ? `<button class="btn xs" data-action="show-run" data-run="${r.id}">Show its Thread</button>`
            : r.threadId && choosable
              ? '<span class="faint run-shown">Thread shown</span>'
              : "";
        return `<li class="run ${state} ${shown && r.threadId ? "shown" : ""}">
          <div class="run-line"><span class="title">Run ${r.number}</span>${RUN_BADGE[state]}<span class="grow"></span>${pick}</div>
          <div class="run-facts">${facts}</div>
          ${carried}<div class="run-note">${inline(text)}</div>${commands}${gate}${handover}
        </li>`;
      }

      /** A run's Thread, read-only: it follows a running Stage live; writing to its person is in their tab. */
      function runThreadHtml(ts) {
        const r = shownRun(ts);
        const t = r && r.threadId ? threadById(r.threadId) : null;
        if (!t) {
          const words =
            ts.stage.kind === "gate"
              ? "A Gate has no Thread: it waits for you in Needs you."
              : ts.stage.kind === "script"
                ? "A Project command has no Thread: its commands and results are in each run."
                : "This run has no Thread.";
          return `<div class="run-thread empty"><span class="muted">${words}</span></div>`;
        }
        const live = t.id === view.data.liveThreadId;
        const body = groupedMessages(visibleMessages(t))
          .map((group) => messageHtml(group, t))
          .join("");
        const own = personThreadOf(t.roleKey);
        const ended = ["done", "dropped"].includes(view.data.task.state);
        const write =
          own && !ended
            ? `<button class="btn xs" data-action="ask-person" data-role="${t.roleKey}">Write to ${personName(t.roleKey)}</button>`
            : "";
        return `<div class="run-thread">
          <div class="run-thread-head">${personTag(t.roleKey, "sm", personLabel(t.roleKey))}<span class="muted">${esc(threadPlace(t))}</span><span class="grow"></span>${live ? liveBadge() : ""}${detailsSwitch()}</div>
          <div class="run-thread-body" id="run-thread-body">${body}${workingHtml(t)}</div>
          <div class="run-thread-foot">${ICON.chat}<span class="grow">Read-only: a Stage's Thread is the record of its run.${write ? ` To ask ${personName(t.roleKey)} about it, write in ${personName(t.roleKey)}'s tab.` : ""}</span>${write}</div>
        </div>`;
      }

      /** The history of the selected Stage, the same in the window and in the page. */
      function historyContent(ts, index) {
        const { stages } = view.data;
        const kindWords =
          ts.stage.kind === "agent"
            ? `Agent Stage · ${PEOPLE[ts.stage.role].name} · ${PEOPLE[ts.stage.role].role} · budget ${kTokens(ts.stage.budget)} tokens`
            : ts.stage.kind === "gate"
              ? "Gate · waits for you"
              : `Project command · ${ts.stage.command}`;
        const loop = ts.stage.onFailure
          ? ` · on failure goes back to ${byKey(ts.stage.onFailure.goBackTo).name}, at most ${ts.stage.onFailure.rounds} times`
          : "";
        const closeButton =
          view.historyMode === "modal"
            ? `<button class="btn ghost xs icon" data-action="close-history" aria-label="Close the Stage history">${ICON.close}</button>`
            : "";
        const runs = ts.runs.length
          ? `<div class="history-panes">
              <ol class="runs">${[...ts.runs]
                .reverse()
                .map((r) => runHtml(ts, r))
                .join("")}</ol>
              ${runThreadHtml(ts)}
            </div>`
          : `<div class="muted history-empty">${["planning", "backlog"].includes(view.data.task.state) ? "Runs once the Task starts." : "Hasn't run yet."}</div>`;
        return `<div class="history-head">
            <h2>${esc(ts.stage.name)}</h2>${stageWorker(ts.stage)}<span class="badge">${STATE_WORDS[ts.state]}</span>
            <span class="grow"></span>
            <span class="faint keys"><span class="kbd">←</span> <span class="kbd">→</span> Stages · <span class="kbd">Esc</span> ${view.historyMode === "modal" ? "close" : "back"}</span>
            <button class="btn ghost xs icon" data-action="step-stage" data-step="-1" aria-label="Previous Stage" ${index === 0 ? "disabled" : ""}>${ICON.left}</button>
            <button class="btn ghost xs icon" data-action="step-stage" data-step="1" aria-label="Next Stage" ${index === stages.length - 1 ? "disabled" : ""}>${ICON.right}</button>
            ${closeButton}
          </div>
          <div class="history-sub">${kindWords}${loop}${ts.runs.length ? ` · ${kTokens(sumTokens(ts.tokens))} tokens over ${ts.runs.length} ${ts.runs.length === 1 ? "run" : "runs"}` : ""}</div>
          ${runs}`;
      }

      function threadBodyAtEnd() {
        const body = $("run-thread-body");
        return !body || body.scrollHeight - body.scrollTop - body.clientHeight < 40;
      }

      /** Version 1 opens a window over the page; version 2 takes the place of everything under the rail. */
      function renderHistory() {
        const modal = $("history-modal");
        const page = $("history-page");
        const index = view.data.stages.findIndex((ts) => ts.stage.key === view.selectedStage);
        const previous = $("run-thread-body");
        const keepScroll = previous && !threadBodyAtEnd() ? previous.scrollTop : null;
        modal.innerHTML = "";
        page.innerHTML = "";
        if (index < 0) {
          if (modal.open) modal.close();
          page.hidden = true;
          $("body").hidden = false;
          return;
        }
        const content = historyContent(view.data.stages[index], index);
        if (view.historyMode === "modal") {
          page.hidden = true;
          $("body").hidden = false;
          modal.innerHTML = `<div class="history-window">${content}</div>`;
          if (!modal.open) modal.showModal();
        } else {
          if (modal.open) modal.close();
          $("body").hidden = true;
          page.hidden = false;
          page.innerHTML = `<div class="history-back"><button class="btn" data-action="close-history">${ICON.left} Back to the Task</button><span class="muted">Stage history of ${esc(view.data.stages[index].stage.name)}</span></div><div class="card history-card">${content}</div>`;
        }
        // A reader who scrolled up in the Thread stays put while it updates; else it follows the end.
        const body = $("run-thread-body");
        if (body) body.scrollTop = keepScroll ?? body.scrollHeight;
      }

      function selectStage(key) {
        view.selectedStage = key;
        view.selectedRun = null;
        renderRail();
        renderHistory();
        fitConversation();
        if (view.historyMode === "subpage") {
          focusNode(key);
          $("history-page").scrollIntoView({ block: "nearest", behavior: "smooth" });
        }
      }

      function closeHistory() {
        const key = view.selectedStage;
        if (!key) return;
        view.selectedStage = null;
        view.selectedRun = null;
        renderRail();
        renderHistory();
        fitConversation();
        focusNode(key);
      }

      /* ===================== Record ===================== */

      const BLOCK_ICONS = { plan: "file", dod: "check", dependencies: "task", origin: "idea" };

      function foldOpen(block) {
        const remembered = store.get(`folds.${view.data.task.id}`, {});
        if (block in remembered) return remembered[block];
        // By default the Plan and Definition of Done are open while Planning and folded once the Task runs.
        const notStarted = ["backlog", "planning"].includes(view.data.task.state);
        return notStarted && (block === "plan" || block === "dod");
      }
      function toggleFold(block) {
        const key = `folds.${view.data.task.id}`;
        const remembered = store.get(key, {});
        remembered[block] = !foldOpen(block);
        store.set(key, remembered);
        renderRecord();
      }

      function fold(block, title, summary, side, body) {
        const open = foldOpen(block);
        return `<section class="fold card ${open ? "open" : ""}">
          <div class="fold-row">
            <button class="fold-head" data-action="fold" data-block="${block}" aria-expanded="${open}">
              <span class="chev">${ICON.chev}</span><span class="fold-title">${ICON[BLOCK_ICONS[block]].replace("<svg", '<svg width="15" height="15"')}${title}</span>
              <span class="fold-summary">${summary}</span>
            </button>
            <span class="fold-side">${side}</span>
          </div>
          <div class="fold-body">${body}</div>
        </section>`;
      }

      function attachmentChip({ name, kind, size, by }) {
        return `<span class="attachment-chip">${kind === "link" ? ICON.link : ICON.file}<a href="#" data-action="toast" data-text="Opens the Attachment.">${esc(name)}</a>${esc(size)} · ${personLink(by)}</span>`;
      }

      const isScreenshot = ({ shot }) => Boolean(shot);

      /** The Task's Attachments by round, oldest first. */
      function attachmentRounds() {
        const numbers = [...new Set(view.data.attachments.map(({ round }) => round))].sort();
        return numbers.map((number) => ({
          number,
          sentBackWith: ROUND_FEEDBACK[number] ?? null,
          attachments: view.data.attachments.filter(({ round }) => round === number),
        }));
      }

      const shotsOf = (attachments) => attachments.filter(isScreenshot).map(({ shot }) => shot);

      /** Each thumbnail opens the viewer, which steps through every picture of `viewable`. */
      function thumbnails(keys, viewable = keys) {
        const items = keys.map((key) => {
          const title = esc(SHOTS[key].title);
          return `<button type="button" class="attachment-thumbnail" data-action="open-shot" data-shot="${key}" data-viewable="${viewable.join(" ")}" aria-label="View ${title}" title="${title}">${shotSvg(key)}</button>`;
        });
        return `<div class="attachment-thumbnails">${items.join("")}</div>`;
      }

      function roundContent(attachments, viewable) {
        const keys = shotsOf(attachments);
        const others = attachments.filter((attachment) => !isScreenshot(attachment));
        return `<div class="attachment-round-content">${keys.length ? thumbnails(keys, viewable) : ""}${others.length ? `<div class="attachment-chips">${others.map(attachmentChip).join("")}</div>` : ""}</div>`;
      }

      /** With several rounds the newest is open on top and the earlier ones fold under their headings; with one, no heading. */
      function attachmentGallery() {
        const rounds = attachmentRounds();
        const viewable = shotsOf(view.data.attachments);
        if (rounds.length === 1) return roundContent(rounds[0].attachments, viewable);
        const sections = rounds.toReversed().map(
          ({ number, sentBackWith, attachments }, index) =>
            `<details class="attachment-round" ${index === 0 ? "open" : ""}>
              <summary title="${esc(sentBackWith ?? "")}"><span class="chev">${ICON.chev}</span><span class="attachment-round-name">Round ${number}</span>${sentBackWith ? `<span class="attachment-round-feedback">Sent back: ${esc(sentBackWith)}</span>` : ""}</summary>
              ${roundContent(attachments, viewable)}
            </details>`,
        );
        return `<div class="attachment-gallery">${sections.join("")}</div>`;
      }

      function renderRecord() {
        const { task, dodMet, attachments } = view.data;
        const planning = task.state === "planning";
        const notStarted = planning || task.state === "backlog";
        const firstLine = task.plan.split("\n")[0].replace(/\*\*/g, "");
        // Each part is confirmed on its own block; Before Ready only lists what Mark Ready waits for.
        const proposed = (confirmed, part) =>
          confirmed
            ? '<span class="badge success">Confirmed</span>'
            : `<span class="badge info">${personTag("planner", "sm", "Proposed by Angela")}</span><button class="btn primary xs" data-action="toast" data-text="Confirms the ${part} as it reads.">Confirm</button>`;

        const plan = fold(
          "plan",
          "Plan",
          `${esc(firstLine)} · ${task.filesToChange.length} files`,
          proposed(task.planConfirmed, "Plan"),
          `<div class="md">${markdown(task.plan)}</div>
           <div class="overline" style="margin-top:12px">Files to change</div>
           <ul class="files">${task.filesToChange.map((f) => `<li>${ICON.file}${esc(f)}</li>`).join("")}</ul>
           ${notStarted ? `<div class="block-foot"><button class="btn xs" data-action="toast" data-text="Opens the Plan in the editor.">Edit Plan</button><span>${planning ? "Angela updates it as you talk in Angela's tab." : "Written by you."}</span></div>` : ""}`,
        );

        const met = new Set(dodMet);
        const dodSummary = notStarted
          ? `${task.definitionOfDone.length} statements · ${task.definitionOfDoneConfirmed ? "confirmed" : "not confirmed yet"}`
          : `${met.size} of ${task.definitionOfDone.length} checked`;
        const dod = fold(
          "dod",
          "Definition of Done",
          dodSummary,
          notStarted
            ? proposed(task.definitionOfDoneConfirmed, "Definition of Done")
            : met.size === task.definitionOfDone.length
              ? '<span class="badge success">All met</span>'
              : `<span class="badge">${met.size} / ${task.definitionOfDone.length}</span>`,
          `<ul class="dod">${task.definitionOfDone.map((s, i) => `<li><span class="check ${met.has(i + 1) ? "on" : ""}">${met.has(i + 1) ? ICON.check.replace("<svg", '<svg width="10" height="10"') : ""}</span><span><span class="n">${i + 1}.</span>${inline(s)}</span></li>`).join("")}</ul>
           ${view.data.dodMetBy ? `<div class="block-foot">Checked as of ${esc(view.data.dodMetBy)}</div>` : ""}`,
        );

        const deps = fold(
          "dependencies",
          "Dependencies",
          task.blockedBy.length
            ? `Waits on ${task.blockedBy.length} Task · Done, so it doesn't block`
            : "None",
          "",
          task.blockedBy.length
            ? `<div class="rows"><div class="row"><span class="ico">${ICON.task}</span><span class="grow"><a href="#" data-action="toast" data-text="Opens that Task's page.">${esc(OTHER_TASK.title)}</a><div class="faint" style="font-size:var(--text-xs)">Must be Done before this Task starts</div></span><span class="badge success">Done</span></div></div>`
            : '<div class="muted" style="font-size:var(--text-sm)">This Task waits on no other Task.</div>',
        );

        const origin = fold(
          "origin",
          "Origin",
          `Idea: ${esc(ORIGIN.idea)} · Initiative: ${esc(ORIGIN.initiative)}`,
          "",
          `<div class="rows">
            <div class="row"><span class="ico">${ICON.idea}</span><span class="grow"><a href="#" data-action="toast" data-text="Opens the Idea.">${esc(ORIGIN.idea)}</a><div class="faint" style="font-size:var(--text-xs)">Idea · captured by you on ${ORIGIN.capturedAt}</div></span></div>
            <div class="row"><span class="ico">${ICON.task}</span><span class="grow"><a href="#" data-action="toast" data-text="Opens the Initiative.">${esc(ORIGIN.initiative)}</a><div class="faint" style="font-size:var(--text-xs)">Initiative · this Task is one of 4</div></span></div>
          </div>`,
        );

        const added = CHANGES.reduce((a, c) => a + c.added, 0),
          removed = CHANGES.reduce((a, c) => a + c.removed, 0);
        const tab = (key, label, count) =>
          `<button class="tab" role="tab" data-action="record-tab" data-tab="${key}" aria-selected="${view.recordTab === key}">${label}${count ? ` <span class="count">${count}</span>` : ""}</button>`;
        const tabs = `<div class="tabs" role="tablist">${tab("overview", "Overview")}${tab("changes", "Changes", notStarted ? 0 : CHANGES.length)}${tab("attachments", "Attachments", attachments.length)}</div>`;
        const changes = notStarted
          ? '<div class="card tab-empty">No changes yet: the Task hasn\'t started.</div>'
          : `<div class="card" style="padding:14px 16px">
          <div class="changes-sum"><b>${CHANGES.length} files</b><span class="add num">+${added}</span><span class="del num">−${removed}</span><span class="badge success">Tests passed · run 4</span><span class="grow" style="flex:1"></span><a href="#" data-action="toast" data-text="Opens the Task's worktree in VS Code.">Open in editor</a></div>
          <div class="rows">${CHANGES.map((c) => `<div class="row"><span class="mono grow">${esc(c.path)}</span>${c.status === "added" ? '<span class="badge info">new</span>' : ""}<span class="mono add">+${c.added}</span><span class="mono del">−${c.removed}</span></div>`).join("")}</div>
          <div class="diff"><div class="diff-head">apps/api/src/modules/reports/usage-csv.ts</div><pre>${DIFF.map(([k, l]) => `<span class="${k}">${k === "a" ? "+" : k === "d" ? "−" : " "} ${esc(l)}</span>`).join("")}</pre></div>
        </div>`;
        const attachmentsTab = attachments.length
          ? `<div class="card attachments-tab"><div class="attachments-head"><span class="muted">${attachments.length} Attachments</span><button class="btn xs" data-action="toast" data-text="Adds an Attachment to this round.">Add</button></div>${attachmentGallery()}</div>`
          : '<div class="card tab-empty">Agents and you can attach documents, screenshots, files and links here.</div>';
        $("record").innerHTML =
          tabs +
          {
            overview: `<div class="folds">${plan}${dod}${deps}${origin}</div>`,
            changes,
            attachments: attachmentsTab,
          }[view.recordTab];
      }

      /* ===================== Conversation ===================== */

      function shotSvg(key) {
        const { columns, rows, marked } = SHOTS[key];
        const width = 640 / columns.length;
        const cell = (text, column, y, weight) =>
          `<text x="${column * width + 8}" y="${y}" font-family="monospace" font-size="14" font-weight="${weight}" fill="#26261f">${esc(text)}</text>`;
        const lines = rows
          .map(
            (row, index) =>
              `<line x1="0" x2="640" y1="${100 + index * 56}" y2="${100 + index * 56}" stroke="#e4e4de"/>${row.map((text, column) => cell(text, column, 134 + index * 56, 400)).join("")}`,
          )
          .join("");
        const highlight =
          marked === undefined
            ? ""
            : `<rect x="${marked * width}" y="44" width="${width}" height="356" fill="#fff1c7"/>`;
        return `<svg viewBox="0 0 640 400" role="img" aria-label="${esc(SHOTS[key].title)}"><rect width="640" height="400" fill="#fff"/><rect width="640" height="44" fill="#ecece6"/><circle cx="20" cy="22" r="5" fill="#c9c9c2"/><circle cx="38" cy="22" r="5" fill="#c9c9c2"/><circle cx="56" cy="22" r="5" fill="#c9c9c2"/>${highlight}<rect y="44" width="640" height="56" fill="#f6f6f2" opacity="0.7"/>${columns.map((text, column) => cell(text, column, 78, 600)).join("")}${lines}</svg>`;
      }

      const screenshotsHtml = (keys, scrolls = true) =>
        `<section class="needs-attachments" aria-label="Screenshots"><div class="needs-attachments-head">Screenshots · ${keys.length}</div><div class="${scrolls ? "needs-attachments-scroll" : ""}" tabindex="0">${thumbnails(keys)}</div></section>`;

      const factsHtml = (facts) =>
        `<div class="facts">${facts.map(([value, label]) => `<div class="fact"><b>${value}</b>${esc(label)}</div>`).join("")}</div>`;

      /** One thing that needs the user, in the column beside the conversation. */
      function askCard({ badge, who, place, body }) {
        return `<article class="ask">
          <div class="ask-kind">${badge}${who}<span class="grow"></span>${place}</div>
          ${body}
        </article>`;
      }

      const decisionPlace = (d) =>
        `<button class="linklike" data-action="open-thread" data-thread="${d.threadId}">in ${esc(threadPlace(threadById(d.threadId)))} · ${clock(d.askedAt)}</button>`;

      /** Every answer on its own line, the recommended one marked, and the user's own words last. */
      function answersHtml(d) {
        const options = d.options
          .map((o, i) => {
            const recommended = i === d.recommendation.option;
            return `<button class="btn option ${recommended ? "primary" : ""}" data-action="answer" data-decision="${d.id}" data-option="${i}"><span class="grow">${esc(o)}</span>${recommended ? '<span class="option-tag">Recommended</span>' : ""}</button>`;
          })
          .join("");
        return `<div class="answers">${options}</div>
          <p class="why">${personLink(d.roleKey)} recommends “${esc(d.options[d.recommendation.option])}”: ${esc(d.recommendation.reason)}</p>
          <div class="free"><input placeholder="Or answer in your own words" aria-label="Your answer" /><button class="btn" data-action="answer" data-decision="${d.id}" data-option="free">Answer</button></div>`;
      }

      /**
       * A Decision with nothing to look at is answered in place. One with Attachments shows its
       * recommendation to accept, and the rest, pictures included, in its details window.
       */
      function decisionCard(d) {
        const head = {
          badge: '<span class="badge warning">Decision</span>',
          who: personTag(d.roleKey),
          place: decisionPlace(d),
        };
        if (!d.screenshots)
          return askCard({
            ...head,
            body: `<p class="ask-q">${esc(d.question)}</p><p class="ask-ctx">${esc(d.context)}</p>${answersHtml(d)}`,
          });
        const count = d.screenshots.length;
        return askCard({
          ...head,
          body: `<p class="ask-q">${esc(d.question)}</p>
            <div class="ask-choices">
              <section class="ask-choice">
                <div class="overline">Recommended answer</div>
                <p class="ask-choice-main">${esc(d.options[d.recommendation.option])}</p>
                <p class="why">${esc(d.recommendation.reason)}</p>
                <div class="ask-choice-foot"><button class="btn primary" data-action="answer" data-decision="${d.id}" data-option="${d.recommendation.option}">Accept</button></div>
              </section>
              <section class="ask-choice">
                <div class="overline">Details</div>
                <p class="ask-choice-main">${d.options.length} answers · ${count} ${count === 1 ? "screenshot" : "screenshots"}</p>
                <p class="why">The context, every answer, your own words and the Attachments to look at.</p>
                <div class="ask-choice-foot"><button class="btn" data-action="open-details" data-kind="decision" data-decision="${d.id}">Open details</button></div>
              </section>
            </div>`,
        });
      }

      function gateFacts() {
        const added = CHANGES.reduce((a, c) => a + c.added, 0),
          removed = CHANGES.reduce((a, c) => a + c.removed, 0);
        return factsHtml([
          [CHANGES.length, "Files changed"],
          [`<span class="add">+${added}</span> <span class="del">−${removed}</span>`, "Lines"],
          ["Passed", "Tests"],
          [
            `${view.data.dodMet.length} of ${view.data.task.definitionOfDone.length}`,
            "Definition of Done",
          ],
        ]);
      }

      const GATE_DESCRIPTION = "Look at the changes and let the work continue to Publish";

      /** The Gate in short: what it waits for and Continue; everything else is in its details window. */
      function gateCard(ts) {
        return askCard({
          badge: '<span class="badge accent">Gate</span>',
          who: '<span class="muted">before Publish</span>',
          place: `<span class="faint">${clock(ts.runs.at(-1).startedAt)}</span>`,
          body: `<p class="ask-q">${GATE_DESCRIPTION}</p>
            <p class="ask-ctx">${CHANGES.length} files changed · tests passed · Definition of Done ${view.data.dodMet.length} of ${view.data.task.definitionOfDone.length}</p>
            <div class="ask-actions">
              <button class="btn primary" data-action="toast" data-text="Continue: Publish runs next.">Continue</button>
              <button class="btn" data-action="open-details" data-kind="gate">Show details</button>
            </div>`,
        });
      }

      /** The Gate's details window: the four facts, this round's pictures and every action. */
      function gateDetailsHtml() {
        const agentStages = view.data.stages.filter(
          (s) =>
            s.stage.kind === "agent" &&
            s.runs.length &&
            !s.runs.every((r) => r.outcome && r.outcome.skipped),
        );
        const latestRound = attachmentRounds().at(-1);
        const latestShots = latestRound ? shotsOf(latestRound.attachments) : [];
        const sendBack = view.sendBackOpen
          ? `<div class="sendback">
              <select class="select" aria-label="Send back to">${agentStages.map((s) => `<option>${esc(s.stage.name)} · ${PEOPLE[s.stage.role].name}</option>`).join("")}</select>
              <textarea class="textarea" placeholder="Say what should change"></textarea>
              <div><button class="btn primary xs" data-action="toast" data-text="Sends the work back with your notes in the Stage's Brief.">Send back</button></div>
            </div>`
          : "";
        return `<p class="ask-q">${GATE_DESCRIPTION}</p>
          ${gateFacts()}
          ${latestShots.length ? screenshotsHtml(latestShots, false) : ""}
          <div class="ask-actions">
            <button class="btn primary" data-action="toast" data-text="Continue: Publish runs next.">Continue</button>
            <button class="btn" data-action="open-changes">Open Changes</button>
            <button class="btn" data-action="send-back" aria-expanded="${view.sendBackOpen}">${view.sendBackOpen ? "Cancel" : "Send back with notes…"}</button>
            <button class="btn danger" data-action="toast" data-text="Drop asks you to confirm first.">Drop</button>
          </div>
          ${sendBack}`;
      }

      function renderDetails() {
        const dialog = $("details-modal");
        const details = view.details;
        if (!details) {
          if (dialog.open) dialog.close();
          return;
        }
        let title, who, body;
        if (details.kind === "decision") {
          const d = decision(details.id);
          title = "Decision";
          who = `${personTag(d.roleKey)}${decisionPlace(d)}`;
          body = `<p class="ask-q">${esc(d.question)}</p><p class="ask-ctx">${esc(d.context)}</p>${d.screenshots ? screenshotsHtml(d.screenshots, false) : ""}${answersHtml(d)}`;
        } else {
          title = "Gate";
          who = '<span class="muted">before Publish</span>';
          body = gateDetailsHtml();
        }
        dialog.setAttribute("aria-label", title);
        dialog.innerHTML = `<div class="modal-head"><span class="badge ${details.kind === "gate" ? "accent" : "warning"}">${title}</span>${who}<span class="grow"></span><button class="btn ghost xs icon" data-action="close-details" aria-label="Close">${ICON.close}</button></div><div class="modal-body">${body}</div>`;
        if (!dialog.open) dialog.showModal();
      }

      /** What Mark Ready waits for, read-only: each part is settled where it lives. */
      function beforeReadyHtml() {
        const { task } = view.data;
        const decisions = openDecisions().length;
        const where = (words, action, attributes) =>
          `<button class="linklike" data-action="${action}" ${attributes}>${words}</button>`;
        const lines = [
          [
            task.planConfirmed,
            "Plan confirmed",
            `Proposed by Angela · confirm it ${where("on the Plan", "open-fold", 'data-block="plan"')}`,
          ],
          [
            task.definitionOfDoneConfirmed,
            "Definition of Done confirmed",
            `Proposed by Angela · confirm it ${where("on the Definition of Done", "open-fold", 'data-block="dod"')}`,
          ],
          [
            !task.proposedPipeline,
            "Pipeline chosen",
            `Angela proposes Full · confirm it ${where("on the rail", "show-rail", "")}`,
          ],
          [decisions === 0, "No Decision open", `${decisions} open, in Needs you`],
        ];
        const ready = lines.every(([met]) => met);
        return `<section class="card before-ready" aria-label="Before Ready">
          <div class="before-ready-head">${ICON.task}<b>Before Ready</b><span class="muted">${ready ? (task.state === "backlog" ? "All set: Mark Ready, or Plan with… to talk it through first." : "All set: Mark Ready when you want.") : "What Mark Ready waits for"}</span></div>
          <ul class="checklist">${lines
            .map(
              ([met, label, missing]) =>
                `<li class="${met ? "met" : ""}"><span class="check ${met ? "on" : ""}">${met ? ICON.check.replace("<svg", '<svg width="10" height="10"') : ""}</span><span>${label}${met ? "" : `<span class="faint"> · ${missing}</span>`}</span></li>`,
            )
            .join("")}</ul>
        </section>`;
      }

      function needsSummary(decisions, gate) {
        const parts = [];
        if (decisions.length)
          parts.push(`${decisions.length} ${decisions.length === 1 ? "Decision" : "Decisions"}`);
        if (gate) parts.push("the Gate before Publish");
        return parts.join(" · ");
      }

      function renderNeeds() {
        const decisions = openDecisions();
        const gate = gateWaiting();
        const n = needsCount();
        const { task } = view.data;
        const beforeReady =
          task.state === "planning" || task.state === "backlog" ? beforeReadyHtml() : "";
        if (n === 0 && beforeReady) {
          $("needs").innerHTML = beforeReady;
          return;
        }
        if (n === 0) {
          const words =
            task.state === "done"
              ? "Nothing needs you: this Task is Done."
              : "Nothing needs you right now. You'll see it here first.";
          $("needs").innerHTML =
            `<section class="needs-you card clear" aria-label="Needs you"><div class="nothing">${ICON.ok}${words}</div></section>${beforeReady}`;
          return;
        }
        const cards = decisions.map(decisionCard).join("") + (gate ? gateCard(gate) : "");
        $("needs").innerHTML =
          `<section class="needs-you card" aria-label="Needs you"><header class="needs-head"><span class="count-pill">${n}</span><h2>Needs you</h2><span class="muted">${needsSummary(decisions, gate)}</span></header>
          <div class="needs-list">${cards}</div></section>${beforeReady}`;
        $("needs-pin").innerHTML =
          `<span class="count-pill">${n}</span><b>Needs you</b><span class="grow">${esc($("needs").querySelector(".ask-q").textContent)}</span><button class="btn xs" data-action="show-needs">Show</button>`;
      }

      /** Tool calls: the noise the Details switch hides. */
      const visibleMessages = (t) =>
        view.showDetails ? t.messages : t.messages.filter((m) => m.kind !== "tool");

      /** One author's neighbouring messages read as one turn, and neighbouring tool calls as one block. */
      function groupedMessages(messages) {
        const groups = [];
        for (const message of messages) {
          const last = groups.at(-1);
          if (message.kind === "start") continue;
          if (message.kind === "say" && last?.kind === "turn" && last.author === message.author)
            last.texts.push(message.text);
          else if (message.kind === "say")
            groups.push({
              kind: "turn",
              author: message.author,
              at: message.at,
              texts: [message.text],
            });
          else if (message.kind === "tool" && last?.kind === "tools") last.texts.push(message.text);
          else if (message.kind === "tool") groups.push({ kind: "tools", texts: [message.text] });
          else groups.push(message);
        }
        return groups;
      }

      function turnHtml({ author, at, texts }) {
        return `<div class="turn ${author === "you" ? "mine" : ""}"><div class="turn-by">${personTag(author)}<span>${clock(at)}</span></div><div class="message-text">${texts.map(markdown).join("")}</div></div>`;
      }

      function messageHtml(group, thread) {
        if (group.kind === "turn") return turnHtml(group);
        if (group.kind === "tools")
          return `<div class="tool-calls">${group.texts.map((text) => `<div class="tool-call">${ICON.wrench}<span class="message-summary">${esc(text)}</span></div>`).join("")}</div>`;
        if (group.kind === "end")
          return `<div class="thread-end ${group.failedRun ? "failed" : ""}">${esc(group.text)} · ${clock(group.at)}</div>`;
        if (group.kind === "handover")
          return `<div class="message handover-note"><div class="message-by">${ICON.note}Handover note · ${personLink(thread.roleKey)}</div><div class="message-text">${inline(group.text)}</div></div>`;
        if (group.kind === "decision") {
          const d = decision(group.decisionId);
          const by = '<div class="message-by"><span class="badge warning">Decision</span></div>';
          if (d.answer === null)
            return `<div class="message decision-card">${by}<div class="message-text decision-question">${esc(d.question)}</div><p class="decision-hint">Waits on you. <button class="linklike" data-action="show-needs">Answer it in Needs you</button></p></div>`;
          const answer = d.answer.kind === "option" ? d.options[d.answer.option] : d.answer.text;
          return `<div class="message decision-card">${by}<div class="message-text decision-question">${esc(d.question)}</div><div class="decision-answered">${ICON.check.replace("<svg", '<svg width="12" height="12"')}<span>You answered at ${clock(d.answeredAt)}: <b>${esc(answer)}</b></span></div></div>`;
        }
        return "";
      }

      function workingHtml(t) {
        if (t.state !== "answering") return "";
        const tools = t.messages.filter((m) => m.kind === "tool");
        const latest = !view.showDetails && tools.length ? tools[tools.length - 1].text : "";
        return `<div class="message-answering"><i></i><i></i><i></i>${personName(t.roleKey)} is working<span class="message-summary">${esc(latest)}</span></div>`;
      }

      const detailsSwitch = () =>
        `<button class="switch-label" role="switch" aria-checked="${view.showDetails}" data-action="toggle-details" title="Tool calls">Details<span class="switch"></span></button>`;

      const liveBadge = () =>
        '<span class="badge accent"><span class="dot live"></span>Live</span>';

      /* ----- The people's tabs ----- */

      /** The cache stays warm for an hour after the session's last call (spec 2.5). */
      const CACHE_MINUTES = 60;
      function cacheOf(t) {
        if (!t.lastCallAt) return { kind: "none" };
        const left = Math.round(CACHE_MINUTES - (NOW - Date.parse(t.lastCallAt)) / 60000);
        return left > 0 ? { kind: "warm", left } : { kind: "cold" };
      }

      function cacheMark(t) {
        const cache = cacheOf(t);
        if (cache.kind === "none") return "";
        return cache.kind === "warm"
          ? `<span class="cache warm" title="Cache warm: ${cache.left} min left, so the next message continues cheaply">${ICON.warm}${cache.left}m</span>`
          : `<span class="cache cold" title="Cache cold: the next message reads the context again, or starts fresh">${ICON.cold}</span>`;
      }

      /** The Planner, then everyone who ran a Stage of this Task, in the order they first worked. */
      const tabPeople = () => view.data.people;

      function workedOn(roleKey) {
        return view.data.stages
          .filter((ts) => ts.stage.role === roleKey && ts.runs.length)
          .map(
            (ts) =>
              `${ts.stage.name} (${ts.runs.length === 1 ? "run" : "runs"} ${ts.runs.map((r) => r.number).join(", ")})`,
          );
      }

      function conversationTabs() {
        const tab = (roleKey) => {
          const t = personThreadOf(roleKey);
          const working = runningStageOf(roleKey);
          return `<button class="tab" role="tab" data-action="conversation-tab" data-role="${roleKey}" aria-selected="${view.conversationTab === roleKey}">${avatar(roleKey, "sm")}${personName(roleKey)}${working ? '<span class="dot live" title="Working in a Stage now"></span>' : ""}${cacheMark(t)}</button>`;
        };
        return `<div class="tabs conversation-tabs" role="tablist" aria-label="People on this Task">${tabPeople().map(tab).join("")}</div>`;
      }

      const CONTEXT_CHOICES = [
        ["auto", "Auto"],
        ["continue", "Continue"],
        ["fresh", "Start fresh"],
      ];

      /** What the next message does with the session, by the choice and the cache, with its cost. */
      function contextWords(t, choice) {
        const cache = cacheOf(t);
        const context = `${kTokens(t.context.contextTokens)} context`;
        const brief = "Brief ~3k tokens";
        if (cache.kind === "none") return `Starts a session with a ${brief}`;
        if (choice === "fresh") return `Starts fresh · ${brief}`;
        if (cache.kind === "warm")
          return `Continues · cache warm, ${cache.left} min left · ${context}`;
        if (choice === "continue")
          return `Continues anyway · cache cold, so the ${context} is read again in full`;
        return t.context.contextTokens > 30000
          ? `Starts fresh · cache cold, ${context} · ${brief}`
          : `Continues · cache cold, but only ${context}`;
      }

      function contextChoiceHtml(t) {
        if (cacheOf(t).kind === "none")
          return `<div class="context-label">${contextWords(t, "auto")}</div>`;
        const current = view.contextChoice[t.id] ?? "auto";
        const buttons = CONTEXT_CHOICES.map(
          ([value, label]) =>
            `<button type="button" data-action="context-choice" data-thread="${t.id}" data-value="${value}" aria-pressed="${current === value}" title="${esc(contextWords(t, value))}">${label}</button>`,
        ).join("");
        return `<div class="context-label"><span class="segmented" role="group" aria-label="Session">${buttons}</span><span>${contextWords(t, current)}</span></div>`;
      }

      function composer(t) {
        const { task } = view.data;
        if (task.state === "done" || task.state === "dropped") {
          return `<div class="composer"><div class="ended">This Task is ${task.state === "done" ? "Done" : "Dropped"} and its worktree has been removed, so you can read these Threads but not continue them. To keep working, start a new Task.</div></div>`;
        }
        const p = PEOPLE[t.roleKey];
        const working = runningStageOf(t.roleKey);
        const to = working
          ? `<div class="to">To ${personTag(t.roleKey, "sm", `${p.name} · ${p.role}`)}<select class="select xs" aria-label="Where it lands"><option>in this Thread</option><option>in ${esc(working.stage.name)}, running: lands at the next safe point</option></select></div>`
          : `<div class="to">To ${personTag(t.roleKey, "sm", `${p.name} · ${p.role}`)}<span class="to-place">, in this Thread</span></div>`;
        return `<div class="composer">
          ${to}
          <div class="compose-box"><textarea class="textarea" placeholder="Ask ${p.name} anything about this Task…" aria-label="Message to ${p.name}">${esc(view.composerDraft)}</textarea><button class="btn ghost icon" aria-label="Mention someone" data-action="toast" data-text="Opens the @ picker.">${ICON.at}</button><button class="btn primary icon" aria-label="Send" data-action="toast" data-text="Sends your message to ${p.name}.">${ICON.send}</button></div>
          ${contextChoiceHtml(t)}
        </div>`;
      }

      function emptyThreadWords(roleKey) {
        const name = personName(roleKey);
        if (roleKey === "planner")
          return view.data.task.state === "backlog"
            ? `No conversation yet. Writing to ${name} starts Planning, as Plan with… does.`
            : `No conversation yet. Ask ${name} anything about this Task.`;
        const stages = workedOn(roleKey);
        return `No messages yet. Ask ${name} anything about this Task: ${stages.length ? `${name} worked on ${stages.join(" and ")}.` : ""}`;
      }

      function personPanelHtml(roleKey) {
        const t = personThreadOf(roleKey);
        const working = runningStageOf(roleKey);
        const stages = workedOn(roleKey);
        const sub =
          roleKey === "planner"
            ? t.messages.length
              ? "Plans this Task"
              : "Hasn't planned this Task"
            : stages.length
              ? `Worked on ${stages.join(" · ")}`
              : "";
        const banner = working
          ? `<div class="working-now"><span class="dot live"></span><span class="grow">${personName(roleKey)} is working on ${esc(working.stage.name)} now.</span><button class="linklike" data-action="select-stage" data-stage="${working.stage.key}">Watch it in the Stage history</button></div>`
          : "";
        const body = t.messages.length
          ? groupedMessages(visibleMessages(t))
              .map((group) => messageHtml(group, t))
              .join("")
          : `<div class="thread-empty">${esc(emptyThreadWords(roleKey))}</div>`;
        return `<div class="thread-head"><span class="grow"><span class="name">${esc(personLabel(roleKey))}</span><div class="sub">${esc(sub)}</div></span>${cacheMark(t)}${detailsSwitch()}</div>
          ${banner}
          <div class="message-list" id="messages">${body}</div>
          ${composer(t)}`;
      }

      function renderConversation() {
        const conversation = $("conversation");
        const previous = $("messages");
        const key = `${view.scenario}/${view.conversationTab}`;
        const keepScroll = previous?.dataset.key === key ? previous.scrollTop : null;
        const typing = document.activeElement?.closest(".composer textarea");
        const caret = typing?.selectionStart;
        const close = `<div class="drawer-close"><button class="btn ghost xs icon" data-action="close-drawer" aria-label="Close the conversation">${ICON.close}</button></div>`;
        conversation.innerHTML = close + conversationTabs() + personPanelHtml(view.conversationTab);
        const composerBox = typing && conversation.querySelector(".composer textarea");
        if (composerBox) {
          composerBox.focus();
          composerBox.setSelectionRange(caret, caret);
        }
        const messages = $("messages");
        messages.dataset.key = key;
        messages.scrollTop = keepScroll !== null ? keepScroll : messages.scrollHeight;
        $("drawer-handle").innerHTML =
          `${ICON.chat}Conversation${view.data.liveThreadId ? ' <span class="dot live"></span>' : ""}`;
      }

      function messagesAtEnd() {
        const messages = $("messages");
        return messages && messages.scrollHeight - messages.scrollTop - messages.clientHeight < 40;
      }

      /** Running scenario: the running Stage's Thread grows while the page is open; its history follows it live. */
      function startLiveScript() {
        clearInterval(view.liveTimer);
        const script = view.data.liveScript;
        if (!script) return;
        let next = 0;
        view.liveTimer = setInterval(() => {
          if (next >= script.length) {
            clearInterval(view.liveTimer);
            return;
          }
          const live = threadById(view.data.liveThreadId);
          live.messages.push({ ...script[next], at: new Date(NOW).toISOString() });
          next += 1;
          const shown =
            view.selectedStage &&
            stageOfThread(live.id)?.taskStage.stage.key === view.selectedStage;
          if (shown) renderHistory();
        }, 6000);
      }

      function showConversationTab(roleKey) {
        view.conversationTab = roleKey;
        view.composerDraft = "";
        renderConversation();
        if (isNarrow()) {
          view.drawerOpen = true;
          $("viewport").classList.add("drawer-open");
        }
      }

      /* ===================== Render & events ===================== */

      function renderAll() {
        renderHead();
        renderRail();
        renderHistory();
        renderRecord();
        renderNeeds();
        renderDetails();
        // Sized before it's filled, so a Thread opens at its newest message.
        fitConversation();
        renderConversation();
        $("viewport").classList.toggle("drawer-open", view.drawerOpen);
      }

      /**
       * Wide: the conversation column ends at the window's bottom edge wherever it starts, so the
       * composer is always in view; it grows to the full height as the page scrolls. Narrow: a drawer.
       */
      function fitConversation() {
        updateNeedsPin();
        const conversation = $("conversation");
        if (isNarrow() || $("body").hidden) {
          conversation.style.height = "";
          return;
        }
        const scroller = $("scroller");
        const top = conversation.getBoundingClientRect().top - scroller.getBoundingClientRect().top;
        const stuckAt = parseFloat(getComputedStyle(conversation).top);
        const atEnd = messagesAtEnd();
        conversation.style.height = `${Math.max(420, scroller.clientHeight - Math.max(top, stuckAt) - 16)}px`;
        if (atEnd) $("messages").scrollTop = $("messages").scrollHeight;
      }

      /** Shows the slim bar while the Needs you card is above or below the window, at the edge it went past. */
      function updateNeedsPin() {
        const pin = $("needs-pin");
        const scroller = $("scroller");
        const area = scroller.getBoundingClientRect();
        const card = $("needs").getBoundingClientRect();
        const above = card.bottom < area.top + 72;
        const below = card.top > area.bottom - 96;
        pin.hidden = needsCount() === 0 || $("body").hidden || !(above || below);
        pin.classList.toggle("below", below);
        scroller.style.setProperty("--pin-room", !pin.hidden && above ? "52px" : "0px");
      }

      function loadScenario(key) {
        view.scenario = key;
        view.data = SCENARIOS[key].build();
        view.selectedStage = null;
        view.selectedRun = null;
        view.recordTab = "overview";
        view.sendBackOpen = false;
        view.details = null;
        view.composerDraft = "";
        view.contextChoice = {};
        // The tab of whoever the work is with: the running Stage's person, else whoever asked last.
        const asking = openDecisions().find((d) => !threadById(d.threadId).stageThread);
        const running = view.data.stages.find((ts) => ts.state === "running");
        view.conversationTab = asking?.roleKey ?? running?.stage.role ?? "planner";
        renderSwitches();
        renderAll();
        revealCurrentStage();
        startLiveScript();
      }

      function segmented(id, options, current, action) {
        $(id).innerHTML = options
          .map(
            ([value, label]) =>
              `<button type="button" data-action="${action}" data-value="${value}" aria-pressed="${current === value}">${label}</button>`,
          )
          .join("");
      }
      function renderSwitches() {
        segmented(
          "scenario-switch",
          Object.entries(SCENARIOS).map(([k, s]) => [k, s.label]),
          view.scenario,
          "scenario",
        );
        segmented(
          "history-switch",
          [
            ["modal", "1 · Window"],
            ["subpage", "2 · In the page"],
          ],
          view.historyMode,
          "history-mode",
        );
        segmented(
          "width-switch",
          [
            ["wide", "Window"],
            ["narrow", "Narrow · 820px"],
          ],
          view.narrow ? "narrow" : "wide",
          "width",
        );
        segmented(
          "palette-switch",
          [
            ["light", "Light"],
            ["dark", "Dark"],
          ],
          view.palette,
          "palette",
        );
      }

      let toastTimer = null;
      function toast(text) {
        const el = $("toast");
        el.textContent = `${text} (In the mock-up nothing changes.)`;
        el.classList.add("show");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => el.classList.remove("show"), 2600);
      }

      function isNarrow() {
        return $("viewport").getBoundingClientRect().width <= 900;
      }

      const revealInPage = (element) =>
        element.scrollIntoView({ block: "start", behavior: "smooth" });

      function closeDialogs() {
        view.details = null;
        renderDetails();
        if (view.selectedStage) closeHistory();
      }

      /** A person's own Thread opens their tab; a Stage's Thread opens that run in the Stage history. */
      function openThread(id) {
        const t = threadById(id);
        if (!t.stageThread) {
          closeDialogs();
          showConversationTab(t.roleKey);
          return;
        }
        const found = stageOfThread(id);
        selectStage(found.taskStage.stage.key);
        view.selectedRun = found.run.id;
        renderHistory();
      }

      /** The viewer: one picture, stepping through the ones it was opened on. */
      function viewShot(keys, index) {
        view.viewedShots = { keys, index };
        const key = keys[index];
        const rounds = attachmentRounds();
        const round = view.data.attachments.find(({ shot }) => shot === key)?.round;
        const step = (by, label, sign) =>
          `<button class="btn ghost xs icon" data-action="step-shot" data-step="${by}" aria-label="${label}" ${keys[index + by] ? "" : "disabled"}>${sign}</button>`;
        $("lightbox").innerHTML =
          `<div class="lightbox-head"><span class="grow">${esc(SHOTS[key].title)}</span><span class="faint">${rounds.length > 1 && round ? `Round ${round} · ` : ""}${index + 1} of ${keys.length}</span>${step(-1, "Previous screenshot", "‹")}${step(1, "Next screenshot", "›")}<button class="btn ghost xs icon" data-action="close-shot" aria-label="Close the screenshot">${ICON.close}</button></div>${shotSvg(key)}`;
      }

      function stepShot(by) {
        const { keys, index } = view.viewedShots;
        if (!keys[index + by]) return;
        viewShot(keys, index + by);
        $("lightbox").querySelector(`[data-step="${by}"]:not(:disabled)`)?.focus();
      }

      function showRecordTab(tab) {
        view.recordTab = tab;
        renderRecord();
        view.drawerOpen = false;
        $("viewport").classList.remove("drawer-open");
      }

      const ACTIONS = {
        scenario: (el) => loadScenario(el.dataset.value),
        "history-mode": (el) => {
          view.historyMode = el.dataset.value;
          store.set("historyMode", view.historyMode);
          renderSwitches();
          renderHistory();
          fitConversation();
        },
        width: (el) => {
          view.narrow = el.dataset.value === "narrow";
          $("viewport").classList.toggle("narrow-demo", view.narrow);
          renderSwitches();
          requestAnimationFrame(() => {
            layoutRail();
            fitConversation();
            revealCurrentStage();
          });
        },
        palette: (el) => {
          view.palette = el.dataset.value;
          document.documentElement.dataset.theme = view.palette;
          document.documentElement.dataset.palette = view.palette;
          renderSwitches();
        },
        "reset-folds": () => {
          store.clear();
          renderRecord();
          toast("Remembered folds forgotten; each Task shows its defaults again.");
        },
        fold: (el) => toggleFold(el.dataset.block),
        "open-fold": (el) => {
          const key = `folds.${view.data.task.id}`;
          const remembered = store.get(key, {});
          remembered[el.dataset.block] = true;
          store.set(key, remembered);
          showRecordTab("overview");
          revealInPage($("record"));
        },
        "show-rail": () => revealInPage($("rail")),
        "record-tab": (el) => showRecordTab(el.dataset.tab),
        "open-changes": () => {
          closeDialogs();
          showRecordTab("changes");
          revealInPage($("record"));
        },
        "select-stage": (el) => {
          view.drawerOpen = false;
          $("viewport").classList.remove("drawer-open");
          selectStage(el.dataset.stage);
        },
        "step-stage": (el) => stepStage(Number(el.dataset.step)),
        "close-history": () => closeHistory(),
        "show-run": (el) => {
          view.selectedRun = el.dataset.run;
          renderHistory();
        },
        "open-thread": (el) => openThread(el.dataset.thread),
        "ask-person": (el) => {
          closeDialogs();
          showConversationTab(el.dataset.role);
          $("conversation").querySelector(".composer textarea")?.focus();
        },
        "conversation-tab": (el) => showConversationTab(el.dataset.role),
        "context-choice": (el) => {
          view.contextChoice[el.dataset.thread] = el.dataset.value;
          renderConversation();
        },
        "show-needs": () => {
          closeDialogs();
          view.drawerOpen = false;
          $("viewport").classList.remove("drawer-open");
          $("needs").scrollIntoView({ block: "start", behavior: "smooth" });
        },
        "toggle-details": () => {
          view.showDetails = !view.showDetails;
          store.set("showDetails", view.showDetails);
          renderConversation();
          renderHistory();
        },
        "open-details": (el) => {
          view.details =
            el.dataset.kind === "gate"
              ? { kind: "gate" }
              : { kind: "decision", id: el.dataset.decision };
          view.sendBackOpen = false;
          renderDetails();
        },
        "close-details": () => {
          view.details = null;
          renderDetails();
        },
        person: (el) => toast(`Opens ${personName(el.dataset.role)}'s page.`),
        "open-shot": (el) => {
          const keys = el.dataset.viewable.split(" ");
          viewShot(keys, keys.indexOf(el.dataset.shot));
          $("lightbox").showModal();
        },
        "step-shot": (el) => stepShot(Number(el.dataset.step)),
        "close-shot": () => $("lightbox").close(),
        "send-back": () => {
          view.sendBackOpen = !view.sendBackOpen;
          renderDetails();
        },
        answer: (el) => {
          const d = decision(el.dataset.decision);
          toast(
            el.dataset.option === "free"
              ? "Sends your own answer to the Decision."
              : `Answers: "${d.options[Number(el.dataset.option)]}".`,
          );
        },
        "open-drawer": () => {
          view.drawerOpen = true;
          $("viewport").classList.add("drawer-open");
        },
        "close-drawer": () => {
          view.drawerOpen = false;
          $("viewport").classList.remove("drawer-open");
        },
        toast: (el) => toast(el.dataset.text),
      };

      function stepStage(step) {
        const keys = view.data.stages.map((ts) => ts.stage.key);
        const index = keys.indexOf(view.selectedStage);
        const next = keys[Math.max(0, Math.min(keys.length - 1, index + step))];
        if (next === view.selectedStage) return;
        view.selectedStage = next;
        view.selectedRun = null;
        renderRail();
        renderHistory();
        fitConversation();
        if (view.historyMode === "subpage") focusNode(next);
      }

      document.addEventListener("click", (event) => {
        const node = event.target.closest(".node-hit, .arc-label");
        if (node) {
          selectStage(node.dataset.stage);
          return;
        }
        const el = event.target.closest("[data-action]");
        if (!el || el.disabled) return;
        if (el.tagName === "A") event.preventDefault();
        ACTIONS[el.dataset.action](el);
      });

      document.addEventListener("input", (event) => {
        if (event.target.matches(".composer textarea")) view.composerDraft = event.target.value;
      });

      document.addEventListener("keydown", (event) => {
        if ($("lightbox").open || $("details-modal").open) {
          if ($("lightbox").open && event.key === "ArrowRight") stepShot(1);
          if ($("lightbox").open && event.key === "ArrowLeft") stepShot(-1);
          return;
        }
        const typing = event.target.closest("input, textarea, select");
        if (typing) return;
        if (event.key === "Escape") {
          // The window's own Esc closes it (its cancel event); in the page, Esc goes back.
          if (view.drawerOpen) ACTIONS["close-drawer"]();
          else if (view.selectedStage && view.historyMode === "subpage") closeHistory();
          return;
        }
        if (!view.selectedStage) return;
        if (event.key === "ArrowRight") {
          event.preventDefault();
          stepStage(1);
        }
        if (event.key === "ArrowLeft") {
          event.preventDefault();
          stepStage(-1);
        }
      });

      $("history-modal").addEventListener("close", () => {
        if (view.selectedStage && view.historyMode === "modal") closeHistory();
      });
      $("details-modal").addEventListener("close", () => {
        view.details = null;
      });
      new ResizeObserver(() => {
        layoutRail();
        fitConversation();
      }).observe($("viewport"));
      $("scroller").addEventListener("scroll", fitConversation, { passive: true });
      for (const dialog of [$("lightbox"), $("history-modal"), $("details-modal")])
        dialog.addEventListener("click", (event) => {
          if (event.target === event.currentTarget) event.currentTarget.close();
        });

      view.palette = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.dataset.theme = view.palette;
      document.documentElement.dataset.palette = view.palette;
      loadScenario(view.scenario);
    </script>
