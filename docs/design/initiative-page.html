<!doctype html>
<html lang="en" data-palette="light" data-density="comfortable">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>The Initiative page · design proposal · The Office</title>
    <style>
      /* ---------- Tokens (design-system/tokens/, copied as they were on 2026-11-13) ---------- */
      :root {
        --ember-50: #fff2ed;
        --ember-300: #ff9370;
        --ember-500: #f23d0f;
        --ember-700: #9e2406;
        --flare-300: #ffc266;
        --white: #ffffff;
        --gray-25: #fafaf9;
        --gray-50: #f4f4f2;
        --gray-100: #e9e9e6;
        --gray-150: #dededa;
        --gray-200: #d1d1cc;
        --gray-300: #b1b1ab;
        --gray-400: #8a8a84;
        --gray-500: #6b6b66;
        --gray-600: #50504c;
        --gray-700: #3a3a37;
        --gray-800: #262624;
        --gray-900: #181817;
        --gray-950: #0f0f0e;
        --green-50: #edf8f1;
        --green-100: #d5f0df;
        --green-500: #1e9e57;
        --green-700: #106a3b;
        --amber-50: #fff8e6;
        --amber-100: #ffedc2;
        --amber-500: #e5a00d;
        --amber-700: #865b05;
        --red-50: #fdeef0;
        --red-100: #fad9dd;
        --red-500: #c8102e;
        --red-700: #8e0b20;
        --blue-50: #eef3fd;
        --blue-100: #dae5fa;
        --blue-500: #2f6bdb;
        --blue-700: #1d4699;

        --bg: var(--gray-50);
        --surface: var(--white);
        --surface-raised: var(--white);
        --surface-sunken: var(--gray-50);
        --surface-hover: var(--gray-25);
        --surface-selected: var(--ember-50);
        --surface-inverse: var(--gray-900);
        --fg-1: var(--gray-950);
        --fg-2: var(--gray-600);
        --fg-3: var(--gray-500);
        --fg-inverse: var(--white);
        --fg-disabled: var(--gray-300);
        --border: var(--gray-150);
        --border-subtle: var(--gray-100);
        --border-strong: var(--gray-200);
        --accent: var(--ember-500);
        --accent-subtle: var(--ember-50);
        --accent-subtle-fg: var(--ember-700);
        --control-hover: var(--gray-50);
        --control-press: var(--gray-100);
        --success: var(--green-500);
        --success-subtle: var(--green-50);
        --success-fg: var(--green-700);
        --success-border: var(--green-100);
        --warning: var(--amber-500);
        --warning-subtle: var(--amber-50);
        --warning-fg: var(--amber-700);
        --warning-border: var(--amber-100);
        --danger: var(--red-500);
        --danger-subtle: var(--red-50);
        --danger-fg: var(--red-700);
        --danger-border: var(--red-100);
        --info: var(--blue-500);
        --info-subtle: var(--blue-50);
        --info-fg: var(--blue-700);
        --info-border: var(--blue-100);
        --neutral-subtle: var(--gray-50);
        --neutral-fg: var(--gray-600);
        --neutral-border: var(--gray-150);
        --focus-ring: 0 0 0 3px color-mix(in oklab, var(--ember-500) 30%, transparent);

        --font-sans: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        --font-mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        --text-2xs: 11px;
        --text-xs: 12px;
        --text-sm: 13px;
        --text-md: 14px;
        --text-lg: 16px;
        --text-xl: 18px;
        --text-2xl: 20px;
        --type-body: 400 var(--text-md) / 1.5 var(--font-sans);
        --type-body-sm: 400 var(--text-sm) / 1.45 var(--font-sans);
        --type-caption: 400 var(--text-xs) / 1.4 var(--font-sans);
        --type-label: 500 var(--text-sm) / 1.3 var(--font-sans);
        --type-card-title: 600 var(--text-md) / 1.4 var(--font-sans);
        --type-section-title: 600 var(--text-lg) / 1.3 var(--font-sans);
        --type-overline: 500 var(--text-2xs) / 1.2 var(--font-mono);
        --type-mono: 400 var(--text-sm) / 1.5 var(--font-mono);
        --tracking-caps: 0.06em;
        --tracking-tight: -0.01em;

        --radius-sm: 4px;
        --radius-md: 6px;
        --radius-lg: 8px;
        --radius-full: 999px;
        --radius-control: var(--radius-md);
        --radius-badge: var(--radius-sm);
        --control-sm: 28px;
        --control-md: 32px;

        --shadow-1: 0 1px 2px rgba(16, 16, 15, 0.06);
        --shadow-2: 0 4px 12px -2px rgba(16, 16, 15, 0.08), 0 1px 3px rgba(16, 16, 15, 0.05);
        --shadow-3: 0 16px 40px -8px rgba(16, 16, 15, 0.18), 0 2px 6px rgba(16, 16, 15, 0.06);
        --ease-out: cubic-bezier(0.2, 0.8, 0.2, 1);
        --duration-fast: 120ms;
        --stage-mark-size: 24px;
      }
      [data-theme="dark"] {
        --surface-selected: color-mix(in oklab, var(--ember-500) 12%, var(--gray-900));
        --accent-subtle: color-mix(in oklab, var(--ember-500) 16%, transparent);
        --accent-subtle-fg: var(--ember-300);
        --success-subtle: color-mix(in oklab, var(--green-500) 16%, transparent);
        --success-fg: #6fd69b;
        --success-border: color-mix(in oklab, var(--green-500) 30%, transparent);
        --warning-subtle: color-mix(in oklab, var(--amber-500) 16%, transparent);
        --warning-fg: var(--flare-300);
        --warning-border: color-mix(in oklab, var(--amber-500) 30%, transparent);
        --danger-subtle: color-mix(in oklab, var(--red-500) 20%, transparent);
        --danger-fg: #ff8a97;
        --danger-border: color-mix(in oklab, var(--red-500) 36%, transparent);
        --info-subtle: color-mix(in oklab, var(--blue-500) 18%, transparent);
        --info-fg: #93b5f5;
        --info-border: color-mix(in oklab, var(--blue-500) 34%, transparent);
        --shadow-1: 0 1px 2px rgba(0, 0, 0, 0.4);
        --shadow-2: 0 4px 12px -2px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.06);
        --shadow-3: 0 16px 40px -8px rgba(0, 0, 0, 0.65), 0 0 0 1px rgba(255, 255, 255, 0.08);
      }
      /* packages/ui/src/appearance/palettes/light.css */
      :root[data-palette="light"] {
        --fg-1: var(--gray-800);
        --fg-2: var(--gray-500);
        --fg-3: var(--gray-400);
        --border: var(--gray-100);
        --border-subtle: #efefec;
        --border-strong: var(--gray-150);
        --surface-hover: var(--gray-25);
        --neutral-subtle: var(--gray-50);
        --neutral-fg: var(--gray-500);
        --neutral-border: var(--gray-100);
      }
      /* packages/ui/src/appearance/palettes/dark.css */
      :root[data-palette="dark"] {
        --bg: #161615;
        --surface: #1d1d1b;
        --surface-raised: #242422;
        --surface-sunken: #131312;
        --surface-hover: #222220;
        --surface-selected: #2a2420;
        --surface-inverse: #e6e6e2;
        --fg-1: #d9d9d5;
        --fg-2: #9a9a94;
        --fg-3: #6f6f69;
        --fg-inverse: #161615;
        --fg-disabled: #4a4a46;
        --border: #262624;
        --border-subtle: #222220;
        --border-strong: #33332f;
        --control-hover: #262624;
        --control-press: #2e2e2b;
        --neutral-subtle: #242422;
        --neutral-fg: #9a9a94;
        --neutral-border: #2e2e2b;
      }
      /* packages/ui/src/appearance/densities/comfortable.css */
      :root[data-density="comfortable"] {
        --pad-card: 16px 18px;
        --gap-card: 12px;
        --pad-page: 24px;
        --gap-panel: 20px;
        --radius-card: 10px;
        --text-body: 14px;
      }

      /* ---------- Base (design-system/tokens/base.css) ---------- */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
        color: inherit;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      code {
        font-family: var(--font-mono);
        font-size: 0.92em;
      }
      @supports selector(::-webkit-scrollbar) {
        ::-webkit-scrollbar {
          width: 10px;
          height: 10px;
        }
        ::-webkit-scrollbar-track,
        ::-webkit-scrollbar-corner {
          background: transparent;
        }
        ::-webkit-scrollbar-thumb {
          border: 3px solid transparent;
          border-radius: var(--radius-full);
          background: var(--border-strong) padding-box;
        }
      }
      @supports not selector(::-webkit-scrollbar) {
        * {
          scrollbar-width: thin;
          scrollbar-color: var(--border-strong) transparent;
        }
      }
      :is(button, a, input, select, textarea, [tabindex]):focus-visible {
        outline: none;
        box-shadow: var(--focus-ring);
      }
      @keyframes pulse-ring {
        0% {
          opacity: 0.7;
          transform: scale(0.9);
        }
        100% {
          opacity: 0;
          transform: scale(1.35);
        }
      }
      @keyframes live-dot {
        50% {
          opacity: 0.35;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation: none !important;
          transition: none !important;
        }
      }
      .overline {
        font: var(--type-overline);
        letter-spacing: var(--tracking-caps);
        text-transform: uppercase;
        color: var(--fg-3);
      }
      .grow {
        flex: 1;
        min-width: 0;
      }

      /* ---------- packages/ui, re-drawn: badge, button, select, input, alert, card, fold button ---------- */
      .badge {
        display: inline-flex;
        flex: none;
        align-items: center;
        gap: 6px;
        height: 22px;
        padding: 0 8px;
        border: 1px solid var(--neutral-border);
        border-radius: var(--radius-badge);
        background: var(--neutral-subtle);
        color: var(--neutral-fg);
        font: 500 var(--text-xs) / 1 var(--font-sans);
        white-space: nowrap;
      }
      .badge.dot::before {
        content: "";
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: currentColor;
      }
      .badge.success {
        border-color: var(--success-border);
        background: var(--success-subtle);
        color: var(--success-fg);
      }
      .badge.warning {
        border-color: var(--warning-border);
        background: var(--warning-subtle);
        color: var(--warning-fg);
      }
      .badge.danger {
        border-color: var(--danger-border);
        background: var(--danger-subtle);
        color: var(--danger-fg);
      }
      .badge.info {
        border-color: var(--info-border);
        background: var(--info-subtle);
        color: var(--info-fg);
      }
      .btn {
        display: inline-flex;
        flex: none;
        align-items: center;
        justify-content: center;
        gap: 6px;
        height: var(--control-md);
        padding: 0 12px;
        border: 1px solid transparent;
        border-radius: var(--radius-control);
        background: none;
        font: 500 var(--text-sm) / 1 var(--font-sans);
        white-space: nowrap;
        cursor: pointer;
      }
      .btn.sm {
        height: var(--control-sm);
        padding: 0 10px;
        font-size: var(--text-xs);
      }
      .btn.primary {
        background: var(--accent);
        color: var(--white);
      }
      .btn.secondary {
        border-color: var(--border-strong);
        background: var(--surface);
        color: var(--fg-1);
      }
      .btn.secondary:hover,
      .btn.ghost:hover {
        background: var(--control-hover);
        color: var(--fg-1);
      }
      .btn.ghost {
        color: var(--fg-2);
      }
      .icon-button {
        display: inline-grid;
        flex: none;
        place-items: center;
        width: 28px;
        height: 28px;
        padding: 0;
        border: 0;
        border-radius: var(--radius-md);
        background: none;
        color: var(--fg-3);
        cursor: pointer;
      }
      .icon-button:hover {
        background: var(--control-hover);
        color: var(--fg-1);
      }
      .field {
        display: flex;
        flex-direction: column;
        gap: 4px;
        min-width: 0;
      }
      .field-label {
        font: var(--type-label);
        color: var(--fg-1);
      }
      .field-hint {
        font: var(--type-caption);
        color: var(--fg-3);
      }
      .select {
        position: relative;
        display: inline-flex;
        flex: 0 1 auto;
        min-width: 0;
        max-width: 100%;
      }
      .select select {
        width: 100%;
        min-width: 200px;
        max-width: 100%;
        height: var(--control-sm);
        padding: 0 28px 0 10px;
        overflow: hidden;
        border: 1px solid var(--border-strong);
        border-radius: var(--radius-control);
        background: var(--surface);
        font: var(--type-body-sm);
        text-overflow: ellipsis;
        appearance: none;
        cursor: pointer;
      }
      .select svg {
        position: absolute;
        top: 50%;
        right: 8px;
        color: var(--fg-3);
        transform: translateY(-50%);
        pointer-events: none;
      }
      .input {
        width: 100%;
        height: var(--control-sm);
        padding: 0 10px;
        border: 1px solid var(--border-strong);
        border-radius: var(--radius-control);
        background: var(--surface);
        font: 400 var(--text-sm) / 1 var(--font-mono);
        color: var(--fg-1);
      }
      .input:focus {
        border-color: var(--accent);
        outline: none;
      }
      .alert {
        display: flex;
        gap: 10px;
        padding: 10px 12px;
        border: 1px solid var(--info-border);
        border-radius: var(--radius-lg);
        background: var(--info-subtle);
        color: var(--fg-1);
        font: var(--type-body-sm);
      }
      .alert > svg {
        flex: none;
        margin-top: 2px;
        color: var(--info-fg);
      }
      .alert.warning {
        border-color: var(--warning-border);
        background: var(--warning-subtle);
      }
      .alert.warning > svg {
        color: var(--warning-fg);
      }
      .alert-title {
        display: block;
        font-weight: 600;
      }
      .card {
        border: 1px solid var(--border);
        border-radius: var(--radius-card);
        background: var(--surface);
      }
      .card-head {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px 12px;
        padding: 14px 18px 0 16px;
      }
      .card-head .task-block-title {
        flex: 1;
        font: var(--type-card-title);
      }
      .card-body {
        padding: 10px 18px 16px 16px;
      }
      /* packages/ui FoldButton: a chevron that turns, and whatever it holds */
      .fold-button {
        display: flex;
        flex: 1;
        align-items: center;
        min-width: 0;
        border: 0;
        background: none;
        text-align: left;
        cursor: pointer;
      }
      .fold-chevron {
        display: inline-grid;
        flex: none;
        place-items: center;
        color: var(--fg-3);
        transition: transform var(--duration-fast) var(--ease-out);
      }
      .fold-button[aria-expanded="true"] .fold-chevron {
        transform: rotate(90deg);
      }
      .project-mark {
        display: inline-flex;
        flex: none;
        align-items: center;
        gap: 5px;
        color: var(--fg-2);
        white-space: nowrap;
      }
      .project-mark::before,
      .mark-square {
        content: "";
        flex: none;
        width: 10px;
        height: 10px;
        border-radius: 3px;
        background: var(--mark);
      }
      .avatar {
        display: inline-grid;
        flex: none;
        place-items: center;
        width: 28px;
        height: 28px;
        border-radius: 50%;
        background: var(--tone);
        color: var(--white);
        font: 600 10px/1 var(--font-sans);
      }
      .live-dot {
        display: inline-block;
        flex: none;
        width: 6px;
        height: 6px;
        margin-right: 4px;
        border-radius: 50%;
        background: var(--info);
        vertical-align: 1px;
        animation: live-dot 1.6s ease-in-out infinite;
      }
      .link {
        font-weight: 500;
        color: var(--fg-1);
        text-decoration: underline;
        text-decoration-color: var(--border-strong);
        text-underline-offset: 3px;
      }
      .link:hover {
        text-decoration-color: currentColor;
      }

      /* ---------- The design page around the mock ---------- */
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg-1);
        font: var(--type-body);
      }
      .bar {
        position: sticky;
        top: 0;
        z-index: 10;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px 18px;
        padding: 10px 16px;
        background: #181817;
        color: #e6e6e2;
      }
      .bar-title {
        font-weight: 600;
      }
      .bar-tag {
        padding: 1px 6px;
        border-radius: 4px;
        background: var(--ember-500);
        color: #fff;
        font: var(--type-overline);
      }
      .bar-break {
        flex-basis: 100%;
        height: 0;
      }
      .control {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
      }
      .control-label {
        font: var(--type-overline);
        letter-spacing: var(--tracking-caps);
        text-transform: uppercase;
        color: #b1b1ab;
      }
      .segments {
        display: flex;
        flex-wrap: wrap;
        overflow: hidden;
        border: 1px solid #50504c;
        border-radius: 6px;
      }
      .segments button {
        padding: 4px 10px;
        border: 0;
        background: none;
        font: var(--type-caption);
        color: #d1d1cc;
        cursor: pointer;
      }
      .segments button + button {
        border-left: 1px solid #50504c;
      }
      .segments button[aria-pressed="true"] {
        background: #f4f4f2;
        color: #181817;
      }
      .stage {
        display: grid;
        gap: 12px;
        padding: 16px 24px 40px;
      }
      .scenario-note {
        max-width: 130ch;
        margin: 0;
        font: var(--type-body-sm);
        color: var(--fg-2);
      }
      .scenario-note strong {
        color: var(--fg-1);
      }
      .address {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 10px;
        margin: 0;
        font: var(--type-caption);
        color: var(--fg-3);
      }
      .address code {
        overflow-wrap: anywhere;
        font: 500 var(--text-xs) / 1.4 var(--font-mono);
        color: var(--fg-1);
      }
      .frame-row {
        display: flex;
        justify-content: center;
        overflow-x: auto;
      }
      .frame {
        position: relative;
        flex: none;
        height: max(720px, calc(100vh - 250px));
        overflow: hidden;
        border: 1px solid var(--border-strong);
        border-radius: 10px;
        background: var(--bg);
        box-shadow: var(--shadow-2);
      }
      .frame.w-wide {
        flex: 1 1 auto;
        width: 100%;
      }
      .frame.w-900 {
        width: 900px;
      }
      .frame.w-390 {
        width: 390px;
        height: max(720px, min(844px, calc(100vh - 250px)));
      }
      .reference {
        display: grid;
        gap: 20px;
        max-width: 1500px;
        margin: 12px auto 0;
        font: var(--type-body-sm);
        color: var(--fg-2);
      }
      .reference-columns {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: 12px 28px;
      }
      .reference h2 {
        margin: 0 0 6px;
        font: var(--type-card-title);
        color: var(--fg-1);
      }
      .reference h3 {
        margin: 0 0 8px;
        font: var(--type-label);
        color: var(--fg-1);
      }
      .reference p {
        margin: 0 0 6px;
      }
      .reference strong,
      .reference code {
        color: var(--fg-1);
      }
      .compare {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(min(100%, 640px), 1fr));
        gap: 16px;
      }
      .compare figure {
        min-width: 0;
        margin: 0;
      }
      .compare figcaption {
        margin-bottom: 8px;
      }
      .compare .card-body {
        padding: 12px;
      }
      .anatomy {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr));
        gap: 16px;
      }
      .anatomy svg {
        display: block;
        width: 100%;
        height: auto;
      }
      .anatomy .node-box {
        fill: var(--surface);
        stroke: var(--border);
      }
      .anatomy .node-text {
        font: 500 12px var(--font-sans);
        fill: var(--fg-2);
      }
      .anatomy .edge {
        fill: none;
        stroke: var(--fg-3);
        stroke-width: 1.5;
      }
      .anatomy .head {
        fill: var(--fg-3);
      }
      .anatomy .dimension {
        fill: none;
        stroke: var(--accent);
        stroke-width: 1;
      }
      .anatomy .dimension-text {
        font: 500 10.5px var(--font-mono);
        fill: var(--accent-subtle-fg);
      }
      .numbers {
        display: grid;
        grid-template-columns: max-content 1fr;
        gap: 4px 14px;
        margin: 8px 0 0;
      }
      .numbers dt {
        font: 500 var(--text-xs) / 1.45 var(--font-mono);
        color: var(--fg-1);
      }
      .numbers dd {
        margin: 0;
      }

      /* ---------- The app's frame: rail, top bar ---------- */
      .app {
        position: absolute;
        inset: 0;
        display: grid;
        grid-template-columns: 56px minmax(0, 1fr);
        grid-template-rows: 56px minmax(0, 1fr);
        color: var(--fg-1);
        font: var(--type-body);
      }
      .rail {
        grid-row: 1 / -1;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        padding: 12px 0;
        border-right: 1px solid var(--border);
        background: var(--surface);
      }
      .rail-mark {
        display: grid;
        place-items: center;
        width: 28px;
        height: 28px;
        margin-bottom: 12px;
        border-radius: 7px;
        background: var(--ember-500);
        color: var(--white);
        font: 700 12px/1 var(--font-sans);
      }
      .rail-item {
        position: relative;
        display: grid;
        place-items: center;
        width: 40px;
        height: 40px;
        border-radius: var(--radius-lg);
        color: var(--fg-2);
      }
      .rail-item.on {
        background: var(--surface-selected);
        color: var(--accent-subtle-fg);
      }
      .rail-item.on::before {
        content: "";
        position: absolute;
        left: -8px;
        width: 3px;
        height: 16px;
        border-radius: 0 2px 2px 0;
        background: var(--accent);
      }
      .top {
        display: flex;
        align-items: center;
        gap: 12px;
        min-width: 0;
        padding: 0 24px;
        border-bottom: 1px solid var(--border);
        background: var(--bg);
      }
      .frame.w-390 .top {
        gap: 8px;
        padding: 0 12px;
      }
      .top h1 {
        flex: none;
        margin: 0;
        font: var(--type-section-title);
        letter-spacing: var(--tracking-tight);
      }
      .crumb {
        min-width: 0;
        overflow: hidden;
        font: var(--type-body-sm);
        color: var(--fg-3);
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      .main {
        position: relative;
        min-width: 0;
        overflow-x: hidden;
        overflow-y: auto;
        container: page / inline-size;
      }
      .toast {
        position: absolute;
        right: 16px;
        bottom: 16px;
        z-index: 30;
        max-width: min(420px, calc(100% - 32px));
        padding: 10px 14px;
        border-radius: var(--radius-lg);
        background: var(--surface-inverse);
        color: var(--fg-inverse);
        font: var(--type-body-sm);
        box-shadow: var(--shadow-3);
      }

      /* ---------- The Initiative page (work.css, re-drawn) ---------- */
      .task-page {
        display: flex;
        flex-direction: column;
        gap: 14px;
        padding: 16px var(--pad-page) var(--pad-page);
      }
      .task-head {
        display: flex;
        flex-wrap: wrap;
        align-items: flex-start;
        gap: 10px 16px;
      }
      .task-head-grow {
        flex: 1 1 420px;
        min-width: 0;
      }
      .task-head h2 {
        margin: 0;
        font: 600 var(--text-2xl) / 1.3 var(--font-sans);
        letter-spacing: -0.01em;
      }
      .task-head-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 14px;
        align-items: center;
        margin-top: 6px;
        font-size: var(--text-body);
        color: var(--fg-2);
      }
      .task-head-meta > :not(:first-child)::before {
        content: "·";
        margin-right: 14px;
        color: var(--border-strong);
      }
      .task-head-projects {
        display: inline-flex;
        flex-wrap: wrap;
        gap: 4px 12px;
      }
      .task-head-actions {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
      }
      .task-columns {
        display: grid;
        grid-template-columns: minmax(0, 1.4fr) minmax(360px, 1fr);
        gap: var(--gap-panel);
        align-items: start;
        margin-top: 6px;
      }
      .task-columns.narrow {
        grid-template-columns: minmax(0, 1fr);
      }
      .task-record {
        display: flex;
        flex-direction: column;
        gap: 8px;
        min-width: 0;
      }
      .task-block-title {
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }
      .task-block-title svg {
        color: var(--fg-2);
      }
      .record-fold {
        overflow: hidden;
        border: 1px solid var(--border);
        border-radius: var(--radius-card);
        background: var(--surface);
      }
      .record-fold-row {
        display: flex;
        gap: 10px;
        align-items: center;
        padding-right: 14px;
      }
      .record-fold-row:hover {
        background: var(--surface-hover);
      }
      .record-fold-head {
        gap: 8px;
        padding: 12px 0 12px 16px;
      }
      .record-fold-head .task-block-title {
        flex: none;
        margin-right: 4px;
        font: var(--type-card-title);
      }
      .record-fold-summary {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        color: var(--fg-2);
        font: 400 var(--text-body) / 1.45 var(--font-sans);
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .record-fold-head[aria-expanded="true"] .record-fold-summary {
        visibility: hidden;
      }
      .record-fold-body {
        padding: 2px 18px 16px 16px;
        font-size: var(--text-body);
      }
      .task-plan,
      .task-quiet {
        margin: 0;
        font: 400 var(--text-body) / 1.55 var(--font-sans);
      }
      .task-quiet {
        color: var(--fg-3);
      }
      .task-quiet.sm {
        font: var(--type-caption);
      }
      .initiative-pipeline,
      .initiative-short-name {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .initiative-short-name-row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
      }
      .initiative-short-name-label {
        font: var(--type-overline);
        letter-spacing: var(--tracking-caps);
        text-transform: uppercase;
        color: var(--fg-3);
      }
      .initiative-short-name-editor {
        display: flex;
        flex-direction: column;
        gap: 8px;
        max-width: 420px;
      }
      .initiative-short-name-editor .actions {
        display: flex;
        gap: 6px;
      }
      .initiative-branches,
      .initiative-publishing-tasks {
        display: flex;
        flex-direction: column;
        gap: 6px;
        margin: 0;
        padding: 0;
        list-style: none;
      }
      .initiative-branches li,
      .initiative-publishing-tasks li {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 4px 8px;
      }

      /* The Task graph (task-graph.tsx and work.css) */
      .task-graph {
        position: relative;
        overflow-x: auto;
        padding: 4px 2px 8px;
      }
      .task-graph-edges {
        position: absolute;
        top: 0;
        left: 0;
        overflow: visible;
        pointer-events: none;
      }
      .task-graph-edges path {
        fill: none;
        stroke: var(--border-strong);
        stroke-width: 1.5;
      }
      .task-graph-edges path.blocker-done {
        stroke: var(--success-border);
      }
      .task-graph-edges .task-graph-arrow {
        fill: var(--border-strong);
        stroke: none;
      }
      .task-graph-columns {
        position: relative;
        display: flex;
        align-items: center;
        gap: 44px;
        width: max-content;
        min-width: 100%;
      }
      .task-graph-column {
        display: flex;
        flex-direction: column;
        gap: var(--gap-card);
      }
      .task-graph-node {
        display: flex;
        flex-direction: column;
        gap: 6px;
        width: 200px;
        padding: var(--pad-card);
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--surface);
        color: inherit;
        font: 400 var(--text-body) / 1.45 var(--font-sans);
      }
      .task-graph-node:hover {
        border-color: var(--border-strong);
      }
      .task-graph-node.outside {
        border-style: dashed;
        background: transparent;
      }
      .task-graph-node-title {
        display: flex;
        align-items: flex-start;
        gap: 6px;
        font-weight: 500;
      }
      .task-graph-node-title .mark-square {
        margin-top: 5px;
      }
      .task-graph-node-sub {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px;
        font: var(--type-caption);
        color: var(--fg-3);
      }

      /* New: the arrows that come in straight */
      .task-graph.proposed .task-graph-columns {
        gap: 64px;
      }
      .task-graph.proposed .task-graph-edges path.edge {
        stroke-linejoin: round;
      }
      .task-graph.proposed .task-graph-edges path.edge.from-outside {
        stroke-dasharray: 4 3;
      }
      .task-graph.proposed .task-graph-edges path.head {
        fill: var(--border-strong);
        stroke: none;
      }
      .task-graph.proposed .task-graph-edges path.head.blocker-done {
        fill: var(--success-border);
      }
      .graph-legend {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 18px;
        margin: 0 0 6px;
        font: var(--type-caption);
        color: var(--fg-3);
      }
      .graph-legend span {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .graph-legend svg path.line {
        fill: none;
        stroke: var(--border-strong);
        stroke-width: 1.5;
      }
      .graph-legend svg path.tip {
        fill: var(--border-strong);
      }
      .graph-legend .done path.line {
        stroke: var(--success-border);
      }
      .graph-legend .done path.tip {
        fill: var(--success-border);
      }
      .graph-legend .outside path.line {
        stroke-dasharray: 4 3;
      }
      /* In the light palette a Done blocker's green-100 line all but vanishes on white: proposed a stronger green. */
      [data-palette="light"] .graph-legend .done path.line,
      [data-palette="light"] .task-graph.proposed .task-graph-edges path.edge.blocker-done {
        stroke: color-mix(in oklab, var(--success) 45%, var(--success-border));
      }
      [data-palette="light"] .graph-legend .done path.tip,
      [data-palette="light"] .task-graph.proposed .task-graph-edges path.head.blocker-done {
        fill: color-mix(in oklab, var(--success) 45%, var(--success-border));
      }

      /* The Stage mark (stage-mark.tsx and work.css) */
      .stage-mark {
        position: relative;
        z-index: 1;
        display: grid;
        flex: none;
        place-items: center;
        width: var(--stage-mark-size);
        height: var(--stage-mark-size);
        border: 2px solid var(--border-strong);
        border-radius: 50%;
        background: var(--surface);
        color: var(--fg-3);
      }
      .stage-mark svg {
        stroke-width: 3;
      }
      .stage-mark-kind-gate {
        width: calc(var(--stage-mark-size) * 0.875);
        height: calc(var(--stage-mark-size) * 0.875);
        margin: calc(var(--stage-mark-size) * 0.0625) 0;
        border-radius: 5px;
        transform: rotate(45deg);
      }
      .stage-mark-kind-gate svg {
        transform: rotate(-45deg);
      }
      .stage-mark-done {
        border-color: var(--success);
        background: var(--success);
        color: var(--white);
      }
      .stage-mark-failed {
        border-color: var(--danger);
        background: var(--danger);
        color: var(--white);
      }
      .stage-mark-waiting-on-you {
        border-color: var(--warning);
        background: var(--warning);
        color: var(--gray-950);
      }
      .stage-mark-paused,
      .stage-mark-stopped {
        border-color: var(--warning);
        color: var(--warning-fg);
      }
      .stage-mark-running {
        border-color: var(--info);
        color: var(--info);
      }
      .stage-mark-running::after {
        content: "";
        position: absolute;
        inset: -3px;
        border: 2px solid var(--info);
        border-radius: inherit;
        animation: pulse-ring 1.6s var(--ease-out) infinite;
      }
      .stage-mark-skipped {
        border-style: dashed;
      }
      /* New: a Stage no Publishing Task walks yet, drawn lighter than a pending one */
      .stage-mark-placeholder {
        border-style: dashed;
        border-color: var(--border-strong);
        background: var(--surface);
      }

      /* ---------- New: the Pipeline diagram ---------- */
      .pipeline-diagram-block {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .pd-choice {
        display: flex;
        flex-wrap: wrap;
        align-items: flex-start;
        gap: 12px 24px;
        padding-bottom: 12px;
        border-bottom: 1px solid var(--border-subtle);
      }
      .pd-choice .initiative-short-name {
        gap: 4px;
        padding-top: 2px;
      }
      .pd-caption {
        display: flex;
        flex-wrap: wrap;
        gap: 2px 8px;
        margin: 0;
        font: var(--type-body-sm);
        color: var(--fg-2);
      }
      .pd-caption b {
        font-weight: 600;
        color: var(--fg-1);
      }
      .pd-caption > :not(:first-child)::before {
        content: "·";
        margin-right: 8px;
        color: var(--border-strong);
      }
      .pd-none {
        padding: 12px 14px;
        border: 1px dashed var(--border-strong);
        border-radius: var(--radius-lg);
      }
      .pd-none p {
        margin: 0;
        font: 400 var(--text-body) / 1.5 var(--font-sans);
        color: var(--fg-2);
      }
      .pd-none p + p {
        margin-top: 2px;
        font: var(--type-body-sm);
        color: var(--fg-3);
      }
      .pipeline-diagram {
        --stages: 5;
        min-width: 0;
      }
      .pipeline-diagram[data-fit="across"] .pd-stacked-view,
      .pipeline-diagram[data-fit="stacked"] .pd-across-view {
        display: none;
      }
      /* Across: the Stage heads once, then a row per Project, its track in the same columns */
      .pd-heads,
      .pd-cells {
        display: grid;
        grid-template-columns: repeat(var(--stages), minmax(0, 1fr));
        margin: 0;
        padding: 0;
        list-style: none;
      }
      .pd-head {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1px;
        min-width: 0;
        padding: 0 4px 10px;
        text-align: center;
      }
      .pd-head-name {
        font: 600 var(--text-sm) / 1.35 var(--font-sans);
        color: var(--fg-1);
        overflow-wrap: anywhere;
      }
      .pd-head-who,
      .pd-optional {
        font: 400 11px/1.4 var(--font-sans);
        color: var(--fg-3);
      }
      .pd-optional {
        font-style: italic;
      }
      .pd-rows {
        margin: 0;
        padding: 0;
        list-style: none;
        border-top: 1px solid var(--border-subtle);
      }
      .pd-row {
        padding: 10px 0 6px;
        border-bottom: 1px solid var(--border-subtle);
      }
      .pd-row:last-child {
        border-bottom: 0;
        padding-bottom: 0;
      }
      .pd-row-label {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 4px 10px;
        min-width: 0;
        padding: 0 4px 10px;
        font: var(--type-body-sm);
      }
      .pd-row-label .link {
        overflow-wrap: anywhere;
      }
      .pd-row-pending {
        color: var(--fg-3);
      }
      .pd-branch {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        min-width: 0;
        font: 500 11.5px/1.4 var(--font-mono);
        color: var(--fg-2);
        overflow-wrap: anywhere;
      }
      .pd-branch svg {
        flex: none;
        color: var(--fg-3);
      }
      .pd-branch .pd-branch-note {
        font: 400 var(--text-xs) / 1.4 var(--font-sans);
        color: var(--fg-3);
      }
      .pd-published {
        font: var(--type-caption);
        color: var(--success-fg);
      }
      .pd-track {
        --mark-top: 0px;

        position: relative;
        padding-top: var(--mark-top);
      }
      .pd-track.has-loop {
        --mark-top: 30px;
      }
      .pd-line,
      .pd-reached {
        position: absolute;
        top: calc(var(--mark-top) + 11px);
        height: 2px;
        border-radius: 2px;
        pointer-events: none;
      }
      .pd-line {
        background: var(--border-strong);
      }
      .pd-track.placeholder .pd-line {
        background: repeating-linear-gradient(90deg, var(--border-strong) 0 4px, transparent 4px 8px);
      }
      .pd-reached {
        background: var(--success);
      }
      .pd-reached.live {
        background: linear-gradient(90deg, var(--success) calc(100% - 40px), var(--info));
      }
      .pd-cell {
        display: flex;
        justify-content: center;
        min-width: 0;
      }
      .pd-cell-button {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 5px;
        min-width: 0;
        max-width: 100%;
        padding: 0 4px 4px;
        border: 0;
        border-radius: var(--radius-md);
        background: none;
        cursor: pointer;
      }
      span.pd-cell-button {
        cursor: default;
      }
      .pd-cell-state {
        min-height: 15px;
        font: 500 11px/1.4 var(--font-sans);
        color: var(--fg-3);
        text-align: center;
      }
      button.pd-cell-button:hover .pd-cell-state {
        color: var(--fg-1);
        text-decoration: underline;
        text-underline-offset: 2px;
      }
      button.pd-cell-button:hover .stage-mark {
        box-shadow: 0 0 0 3px var(--surface), 0 0 0 4px var(--fg-3);
      }
      .pd-cell.selected .stage-mark {
        box-shadow: 0 0 0 3px var(--surface), 0 0 0 5px var(--accent);
      }
      .pd-cell-running .pd-cell-state {
        color: var(--info-fg);
      }
      .pd-cell-failed .pd-cell-state {
        color: var(--danger-fg);
      }
      .pd-cell-waiting-on-you .pd-cell-state,
      .pd-cell-stopped .pd-cell-state {
        color: var(--warning-fg);
      }
      .pd-cell-done .pd-cell-state {
        color: var(--success-fg);
      }
      /* A loop-back, square with small rounded corners as on the Task page's rail */
      .pd-arc {
        position: absolute;
        top: 9px;
        height: calc(var(--mark-top) - 9px - 6px);
        border: 1.5px dashed var(--danger);
        border-bottom: 0;
        border-radius: 5px 5px 0 0;
        pointer-events: none;
      }
      .pd-arc::after {
        content: "";
        position: absolute;
        bottom: -6px;
        left: -4.75px;
        border: 4px solid transparent;
        border-top: 7px solid var(--danger);
        border-bottom: 0;
      }
      .pd-arc::before {
        content: "";
        position: absolute;
        right: -1.5px;
        bottom: -6px;
        height: 6px;
        border-right: 1.5px dashed var(--danger);
      }
      .pd-arc-mark {
        position: absolute;
        top: -1px;
        left: 50%;
        padding: 1px 7px;
        border: 1px solid var(--danger-border);
        border-radius: var(--radius-full);
        background: var(--surface);
        font: 600 11px/1.4 var(--font-sans);
        white-space: nowrap;
        color: var(--danger-fg);
        transform: translate(-50%, -50%);
        pointer-events: auto;
        cursor: pointer;
      }
      /* Stacked: a Stage a row, a Project a column, when the Stages don't fit across */
      .pd-stacked {
        display: grid;
        grid-template-columns: minmax(0, 1fr) repeat(var(--projects), 72px);
      }
      .pd-s-head {
        align-self: end;
        padding: 0 4px 8px;
      }
      .pd-s-project {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        min-width: 0;
        font: 500 11px/1.3 var(--font-sans);
        color: var(--fg-2);
        text-align: center;
        overflow-wrap: anywhere;
      }
      .pd-s-name {
        display: flex;
        flex-direction: column;
        justify-content: center;
        min-width: 0;
        padding: 8px 4px;
        border-top: 1px solid var(--border-subtle);
      }
      .pd-s-name b {
        font: 600 var(--text-sm) / 1.35 var(--font-sans);
        overflow-wrap: anywhere;
      }
      .pd-s-cell {
        position: relative;
        display: grid;
        place-items: center;
        min-height: 50px;
        border-top: 1px solid var(--border-subtle);
      }
      .pd-s-cell::before,
      .pd-s-cell::after {
        content: "";
        position: absolute;
        left: calc(50% - 1px);
        width: 2px;
        background: var(--border-strong);
      }
      .pd-s-cell::before {
        top: -1px;
        bottom: 50%;
      }
      .pd-s-cell::after {
        top: 50%;
        bottom: 0;
      }
      .pd-s-cell.placeholder::before,
      .pd-s-cell.placeholder::after {
        background: repeating-linear-gradient(180deg, var(--border-strong) 0 4px, transparent 4px 8px);
      }
      .pd-s-cell.first::before,
      .pd-s-cell.last::after {
        display: none;
      }
      .pd-s-cell.reached-above::before,
      .pd-s-cell.reached-below::after {
        background: var(--success);
      }
      .pd-s-cell .pd-cell-button {
        padding: 4px;
        border-radius: 50%;
      }
      .pd-s-rows {
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin: 12px 0 0;
        padding: 12px 0 0;
        list-style: none;
        border-top: 1px solid var(--border-subtle);
      }
      .pd-s-rows .pd-row-label {
        padding-bottom: 0;
      }
      .pd-loop-words {
        margin: 2px 4px 0;
        font: var(--type-caption);
        color: var(--danger-fg);
      }

      /* The conversation, as today (initiative-conversation.tsx), in brief */
      .conversation {
        display: flex;
        flex-direction: column;
        min-height: 460px;
        border: 1px solid var(--border);
        border-radius: var(--radius-card);
        background: var(--surface);
      }
      .conversation-tabs {
        display: flex;
        gap: 18px;
        padding: 0 16px;
        border-bottom: 1px solid var(--border);
      }
      .conversation-tab {
        margin-bottom: -1px;
        padding: 11px 0 9px;
        border-bottom: 2px solid transparent;
        font: 500 var(--text-sm) / 1 var(--font-sans);
        color: var(--fg-2);
      }
      .conversation-tab.on {
        border-color: var(--accent);
        color: var(--fg-1);
      }
      .conversation-body {
        display: flex;
        flex: 1;
        flex-direction: column;
        gap: 16px;
        padding: 16px;
      }
      .turn {
        display: flex;
        gap: 10px;
      }
      .turn-name {
        font: 600 var(--text-sm) / 1.4 var(--font-sans);
      }
      .turn-name span {
        margin-left: 6px;
        font: var(--type-caption);
        color: var(--fg-3);
      }
      .turn-text {
        margin: 2px 0 0;
        font: var(--type-body-sm);
        color: var(--fg-1);
      }
      .composer {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 0 12px 12px;
        padding: 8px 8px 8px 12px;
        border: 1px solid var(--border-strong);
        border-radius: var(--radius-lg);
        font: var(--type-body-sm);
        color: var(--fg-3);
      }
      .conversation-handle {
        position: absolute;
        top: 50%;
        right: 0;
        z-index: 5;
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 12px 7px;
        border: 1px solid var(--border-strong);
        border-right: 0;
        border-radius: 8px 0 0 8px;
        background: var(--surface);
        color: var(--fg-2);
        font: 500 var(--text-xs) / 1 var(--font-sans);
        writing-mode: vertical-rl;
        box-shadow: var(--shadow-1);
        cursor: pointer;
        transform: translateY(-50%);
      }

      /* The Stage history window, as the Task page opens it (stage-history-window.tsx), in brief */
      .backdrop {
        position: absolute;
        inset: 0;
        z-index: 20;
        display: flex;
        align-items: flex-start;
        justify-content: center;
        padding: max(24px, 7%) 12px 12px;
        background: rgba(15, 15, 14, 0.42);
      }
      .window {
        display: flex;
        flex-direction: column;
        width: min(980px, 94%);
        height: 86%;
        overflow: hidden;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: var(--surface-raised);
        box-shadow: var(--shadow-3);
      }
      .window-head {
        display: flex;
        align-items: flex-start;
        gap: 12px;
        padding: 14px 16px 12px 18px;
        border-bottom: 1px solid var(--border);
      }
      .window-head h3 {
        margin: 3px 0 0;
        font: var(--type-section-title);
        overflow-wrap: anywhere;
      }
      .window-strip {
        display: flex;
        gap: 4px;
        padding: 10px 14px;
        overflow-x: auto;
        border-bottom: 1px solid var(--border);
      }
      .window-strip button {
        display: inline-flex;
        flex: none;
        align-items: center;
        gap: 8px;
        padding: 5px 10px 5px 6px;
        border: 0;
        border-radius: var(--radius-full);
        background: none;
        font: 500 var(--text-xs) / 1 var(--font-sans);
        color: var(--fg-2);
        cursor: pointer;
        --stage-mark-size: 18px;
      }
      .window-strip button:hover {
        background: var(--control-hover);
      }
      .window-strip button[aria-current="true"] {
        background: var(--surface-selected);
        color: var(--fg-1);
        box-shadow: inset 0 0 0 1px color-mix(in oklab, var(--accent) 35%, transparent);
      }
      .window-strip .stage-mark svg {
        width: 10px;
        height: 10px;
      }
      .window-body {
        display: grid;
        flex: 1;
        grid-template-columns: 260px minmax(0, 1fr);
        min-height: 0;
        overflow: auto;
      }
      .run-list {
        margin: 0;
        padding: 10px;
        list-style: none;
        border-right: 1px solid var(--border);
      }
      .run-list li {
        padding: 9px 10px;
        border-radius: var(--radius-lg);
        font: var(--type-caption);
        color: var(--fg-2);
      }
      .run-list li.on {
        background: var(--surface-selected);
        color: var(--fg-1);
      }
      .run-list b {
        display: block;
        margin-bottom: 2px;
        font: 600 var(--text-sm) / 1.4 var(--font-sans);
        color: var(--fg-1);
      }
      .run-detail {
        padding: 16px 20px;
        font: var(--type-body-sm);
      }
      .run-detail p {
        max-width: 72ch;
        margin: 0 0 10px;
      }
      .window-bar {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 14px;
        border-top: 1px solid var(--border);
      }
      .frame.w-390 .window-body {
        grid-template-columns: minmax(0, 1fr);
      }
      .frame.w-390 .run-list {
        border-right: 0;
        border-bottom: 1px solid var(--border);
      }

      /* ---------- Widths: by the page's own width (container `page`), as work.css does ---------- */
      @container page (max-width: 640px) {
        .task-page {
          padding: 12px 14px 20px;
        }
        .task-head h2 {
          font-size: var(--text-xl);
        }
        .record-fold-head {
          padding-left: 12px;
        }
        .record-fold-body {
          padding: 2px 12px 14px;
        }
        .pd-choice .select select {
          min-width: 0;
        }
        .pd-choice .field {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div class="bar" id="bar"></div>
    <main class="stage">
      <p class="scenario-note" id="note"></p>
      <p class="address" id="address"></p>
      <div class="frame-row"><div class="frame" id="frame"></div></div>
      <section class="reference" aria-label="What it proposes" id="reference"></section>
    </main>
    <script>
      /* ---------- Icons (lucide, as packages/ui's Icon draws them) ---------- */
      const PATHS = {
        "chevron-right": '<path d="m9 18 6-6-6-6"/>',
        "chevron-down": '<path d="m6 9 6 6 6-6"/>',
        home: '<path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/>',

        folder: '<path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/>',
        "git-fork": '<circle cx="12" cy="18" r="3"/><circle cx="6" cy="6" r="3"/><circle cx="18" cy="6" r="3"/><path d="M18 9v2c0 .6-.4 1-1 1H7c-.6 0-1-.4-1-1V9"/><path d="M12 12v3"/>',

        "arrow-right": '<path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>',
      };
      const icon = (name, size = 14) =>
        `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${PATHS[name]}</svg>`;
      const escapeHtml = (text) => String(text).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
      const plural = (count, one, many) => `${count} ${count === 1 ? one : many}`;

      /* ---------- Mock data: `Initiative`, `Task`, `TaskStage` and `Pipeline` as packages/contracts has them ---------- */
      const PROJECTS = {
        "not-astray": { id: "not-astray", name: "not-astray", mark: "#14a38b", base: "main", publishing: "Merged into main" },
        notnullsoft: { id: "notnullsoft", name: "notnullsoft", mark: "#7c5cd6", base: "main", publishing: "Pull request #214, merged into main" },
      };
      const CTO_NAME = "Michael";
      const INITIATIVE = {
        id: "7f3c2a90-51d8-4e0b-9a3c-0c51a2e6b1d4",
        name: "Offline sync",
        outcome: "Field notes written offline in not-astray reach notnullsoft's sync service once the phone is back online, and a conflict is shown to the user rather than lost.",
        projectIds: ["not-astray", "notnullsoft"],
        originIdea: "Work offline in the field",
      };
      /** The Stages of the library's Pipelines; `who` is what `whoWorks` says (pipeline-words.ts). */
      const STAGE = {
        integrate: { key: "integrate", name: "Integrate", kind: "agent", who: "Jim" },
        review: { key: "review", name: "Review", kind: "agent", who: "Oscar" },
        check: { key: "check", name: "Check", kind: "script", who: "verify" },
        e2e: { key: "e2e", name: "End-to-end tests", kind: "script", who: "test:e2e" },
        notes: { key: "notes", name: "Release notes", kind: "agent", who: "Jim", optional: true },
        gate: { key: "your-review", name: "Your review", kind: "gate", who: "waits for you" },
        publish: { key: "publish", name: "Publish", kind: "script", who: "publish" },
      };
      const PIPELINES = [
        { id: "ship-an-initiative", name: "Ship an Initiative", stages: [STAGE.integrate, STAGE.review, STAGE.check, STAGE.gate, STAGE.publish] },
        { id: "publish-straight-away", name: "Publish straight away", stages: [STAGE.integrate, STAGE.check, STAGE.publish] },
        { id: "ship-with-tests-and-notes", name: "Ship with tests and notes", stages: [STAGE.integrate, STAGE.review, STAGE.check, STAGE.e2e, STAGE.notes, STAGE.gate, STAGE.publish] },
      ];
      const pipelineById = (id) => PIPELINES.find((pipeline) => pipeline.id === id);
      const hasGate = (pipeline) => pipeline.stages.some(({ kind }) => kind === "gate");

      /** The Initiative's Tasks but its Publishing Tasks, with a blocker from outside it; `column` is their depth (taskGraph). */
      const GRAPH_TASKS = [
        { id: "t-rate-limits", title: "Rate limits on the sync API", projectId: "notnullsoft", column: 0, blockedBy: [], outside: true, initiativeName: "API hardening" },
        { id: "t-protocol", title: "Sync protocol v2 schema", projectId: "notnullsoft", column: 0, blockedBy: [] },
        { id: "t-local-store", title: "Local store on SQLite", projectId: "not-astray", column: 0, blockedBy: [] },
        { id: "t-endpoint", title: "Sync endpoint with a conflict log", projectId: "notnullsoft", column: 1, blockedBy: ["t-rate-limits", "t-protocol"] },
        { id: "t-queue", title: "Offline queue for edits", projectId: "not-astray", column: 1, blockedBy: ["t-local-store"] },
        { id: "t-conflicts", title: "Conflict resolution screen", projectId: "not-astray", column: 2, blockedBy: ["t-endpoint", "t-queue", "t-local-store"] },
        { id: "t-status", title: "Sync status in Settings", projectId: "not-astray", column: 2, blockedBy: ["t-queue"] },
        { id: "t-rollout", title: "Roll out behind a flag", projectId: "not-astray", column: 3, blockedBy: ["t-conflicts", "t-status"] },
      ];
      const graphTask = (id) => GRAPH_TASKS.find((task) => task.id === id);
      const TASK_STATES = {
        shaping: { "t-protocol": "shaping", "t-local-store": "shaping", "t-endpoint": "shaping", "t-queue": "shaping", "t-conflicts": "shaping", "t-status": "shaping", "t-rollout": "shaping" },
        active: { "t-protocol": "done", "t-local-store": "done", "t-endpoint": "in-progress", "t-queue": "waiting-on-you", "t-conflicts": "ready", "t-status": "backlog", "t-rollout": "backlog" },
        finished: { "t-protocol": "done", "t-local-store": "done", "t-endpoint": "done", "t-queue": "done", "t-conflicts": "done", "t-status": "dropped", "t-rollout": "done" },
      };
      /** The blocker from outside is another Initiative's, Done. */
      const taskStateOf = (task, states) => (task.outside ? "done" : TASK_STATES[states][task.id]);

      /** A Publishing Task, titled "<Initiative> → <Project>", and its Stages' states (TaskStage.state, wentBack). */
      const publishingTask = (projectId, taskState, stages) => ({
        id: `pt-${projectId}`,
        title: `${INITIATIVE.name} → ${projectId}`,
        projectId,
        state: taskState,
        stages,
      });
      const at = (state, extra = {}) => ({ state, ...extra });
      const BRANCHES = INITIATIVE.projectIds.map((projectId) => ({ projectId, branch: "initiative/offline-sync" }));
      const PUBLISHING = {
        publishing: [
          publishingTask("not-astray", "waiting-on-you", { integrate: at("done"), review: at("done"), check: at("done"), "your-review": at("waiting-on-you"), publish: at("pending") }),
          publishingTask("notnullsoft", "in-progress", {
            integrate: at("running", { round: 2 }),
            review: at("pending"),
            check: at("failed", { wentBack: { stageKey: "integrate", round: 1, rounds: 2 } }),
            "your-review": at("pending"),
            publish: at("pending"),
          }),
        ],
        done: [
          publishingTask("not-astray", "done", { integrate: at("done"), review: at("done"), check: at("done"), "your-review": at("done"), publish: at("done") }),
          publishingTask("notnullsoft", "done", { integrate: at("done", { round: 2 }), review: at("done"), check: at("done"), "your-review": at("done"), publish: at("done") }),
        ],
        dropped: [
          publishingTask("not-astray", "dropped", { integrate: at("done"), review: at("stopped"), check: at("pending"), "your-review": at("pending"), publish: at("pending") }),
          publishingTask("notnullsoft", "dropped", { integrate: at("pending"), review: at("pending"), check: at("pending"), "your-review": at("pending"), publish: at("pending") }),
        ],
        long: [
          publishingTask("not-astray", "in-progress", { integrate: at("done"), review: at("done"), check: at("done"), e2e: at("running"), notes: at("pending"), "your-review": at("pending"), publish: at("pending") }),
          publishingTask("notnullsoft", "waiting-on-you", { integrate: at("done"), review: at("done"), check: at("done"), e2e: at("done"), notes: at("skipped"), "your-review": at("waiting-on-you"), publish: at("pending") }),

      };

      /* ---------- Words (work-words.ts, stage-rail-words.ts) ---------- */
      const TASK_STATE_NAMES = { shaping: "Shaping", backlog: "Backlog", planning: "Planning", ready: "Ready", "in-progress": "In progress", "waiting-on-you": "Waiting on you", paused: "Paused", done: "Done", dropped: "Dropped" };
      const TASK_STATE_TONES = { shaping: "", backlog: "", planning: "", ready: "", "in-progress": "success", "waiting-on-you": "warning", paused: "warning", done: "success", dropped: "danger" };
      const STAGE_STATE_WORDS = { pending: "", running: "Running", "waiting-on-you": "Waiting on you", paused: "Paused", stopped: "Stopped", done: "Done", skipped: "Skipped", failed: "Failed" };
      const STAGE_STATE_ICONS = { done: "check", failed: "x", "waiting-on-you": "pause", paused: "pause", stopped: "square", skipped: "minus" };
      const INITIATIVE_STATES = { shaping: ["warning", `Shaping with ${CTO_NAME}`], active: ["info", "Active"], done: ["success", "Done"], dropped: ["danger", "Dropped"] };
      const NONE_CONFIRMED = "None: publishes Task by Task";
      const taskBadge = (taskState) => `<span class="badge dot ${TASK_STATE_TONES[taskState]}">${TASK_STATE_NAMES[taskState]}</span>`;

      const stageMark = (stage, stageState) => {
        const symbol = STAGE_STATE_ICONS[stageState];
        return `<span class="stage-mark stage-mark-${stageState} stage-mark-kind-${stage.kind}">${symbol ? icon(symbol, 12) : ""}</span>`;

      /* ---------- Scenarios ---------- */
      const SCENARIOS = {
        "shaping-none": {
          label: "Shaping: None",
          initiative: { state: "shaping", pipelineId: null, shortName: null, branches: [] },
          tasks: null,
          note: {
            today: "Shaping, with no Tasks yet and None as the Pipeline: the Tasks card says Michael drafts them with you; under Outcome, the Pipeline fold holds the select.",

          },
