      };

      /* ---------- State, as this browser holds it ---------- */
      const state = {
        view: "proposed",
        scenario: "active",
        width: "wide",
        palette: "light",
        folds: {},
        choices: {},
        shortNames: {},
        editingShortName: false,
        selected: undefined,
        toast: undefined,
      };
      let toastTimer;
      const scenario = () => SCENARIOS[state.scenario];
      function initiative() {
        const base = scenario().initiative;
        const pipelineId = state.scenario in state.choices ? state.choices[state.scenario] : base.pipelineId;
        const shortName = state.shortNames[state.scenario] ?? base.shortName ?? (pipelineId === null ? null : "offline-sync");
        return { ...INITIATIVE, ...base, pipelineId, shortName };
      }
      const publishingOf = () => (scenario().publishing ? PUBLISHING[scenario().publishing] : []);
      /** Folds start as the block says until the user folds one, then are remembered (record-folds.ts); per Initiative, here per scenario. */
      function isOpen(block) {
        const key = `${state.view}:${state.scenario}:${block}`;
        if (key in state.folds) return state.folds[key];
        const ini = initiative();
        if (block === "pipeline" && state.view === "proposed") return !(ini.pipelineId === null && ini.state !== "shaping");
        return block === "tasks" || block === "pipeline" || block === "outcome";
      }

      /* ---------- The page ---------- */
      function app() {
        const ini = initiative();
        const rail = ["home", "kanban", "users", "folder"].map((name) => `<span class="rail-item${name === "kanban" ? " on" : ""}">${icon(name, 18)}</span>`).join("");
        const narrow = state.width !== "wide";
        return `<div class="app">
          <nav class="rail" aria-label="The Office"><span class="rail-mark">O</span>${rail}</nav>
          <header class="top"><h1>Work</h1><span class="crumb">Initiatives › ${ini.name}</span></header>
          <div class="main"><div class="task-page">
            ${head(ini)}
            ${state.view === "today" ? todayTasksBlock(ini) : tasksFold(ini)}
            <div class="task-columns${narrow ? " narrow" : ""}">
              <section class="task-record" aria-label="Record">${record(ini)}</section>
              ${narrow ? "" : conversation(ini)}
            </div>
          </div></div>
          ${narrow ? `<button type="button" class="conversation-handle" data-action="toast" data-value="The conversation's drawer opens over the page, as today.">${icon("message-square", 14)}Conversation</button>` : ""}
          ${state.selected ? stageHistoryWindow() : ""}
          ${state.toast ? `<div class="toast" role="status">${state.toast}</div>` : ""}
        </div>`;
      }
      function progressWords(ini) {
        const states = scenario().tasks;
        const tasks = states ? GRAPH_TASKS.filter((task) => !task.outside).map((task) => ({ ...task, state: taskStateOf(task, states) })) : [];
        const counted = [...tasks, ...publishingOf()].filter((task) => task.state !== "dropped");
        const done = counted.filter((task) => task.state === "done").length;
        const readyToStart = tasks.filter((task) => task.state === "ready" && task.blockedBy.every((id) => taskStateOf(graphTask(id), states) === "done")).length;
        return `${done} of ${plural(counted.length, "Task", "Tasks")} done${readyToStart ? ` · ${readyToStart} ready to start` : ""}`;
      }
      function head(ini) {
        const [tone, words] = INITIATIVE_STATES[ini.state];
        const actions =
          ini.state === "shaping"
            ? `<button type="button" class="btn sm primary" data-action="toast" data-value="Confirm makes the Initiative active, as today.">${icon("check", 14)}Confirm</button>`
            : ini.state === "active"
              ? `<button type="button" class="btn sm secondary" data-action="toast" data-value="Start Ready Tasks, as today.">${icon("play", 12)}Start Ready Tasks</button>`
              : "";
        return `<header class="task-head">
          <div class="task-head-grow">
            <h2>${ini.name}</h2>
            <div class="task-head-meta">
              <span><span class="badge dot ${tone}">${words}</span></span>
              <span class="task-head-projects">${ini.projectIds.map(projectMark).join("")}</span>
              <span>${progressWords(ini)}</span>
            </div>
          </div>
          <div class="task-head-actions">${actions}<button type="button" class="icon-button" aria-label="More" data-action="toast" data-value="The Initiative's menu, as today.">${icon("ellipsis", 16)}</button></div>
        </header>`;
      }

      /* ---------- The Tasks block: today a card, proposed a fold ---------- */
      function todayTasksBlock(ini) {
        const states = scenario().tasks;
        const body = states
          ? `<p class="task-quiet">${GRAPH_TASKS.filter((task) => !task.outside).length} across ${plural(ini.projectIds.length, "Project", "Projects")}</p>${graph("today", states, "graph-page")}`
          : `<p class="task-quiet">No Tasks yet. ${CTO_NAME} drafts them with you.</p>`;
        return `<section class="card" aria-label="Tasks">
          <div class="card-head"><span class="task-block-title">${icon("git-fork", 15)}Tasks</span><span class="task-quiet sm">An arrow means “must be Done first”</span></div>
          <div class="card-body">${body}</div>
        </section>`;
      }
      /** The folded line: what the graph holds, and how far it is. */
      function tasksSummary(ini) {
        const states = scenario().tasks;
        if (!states) return "None yet";
        const tasks = GRAPH_TASKS.filter((task) => !task.outside);
        const where = `${tasks.length} across ${plural(ini.projectIds.length, "Project", "Projects")}`;
        if (states === "shaping") return `${where} · in Shaping until you confirm`;
        const count = (taskState) => tasks.filter((task) => taskStateOf(task, states) === taskState).length;
        const parts = [
          [count("done"), "done"],
          [count("in-progress"), "in progress"],
          [count("waiting-on-you"), "waiting on you"],
          [count("dropped"), "dropped"],
        ]
          .filter(([number]) => number > 0)
          .map(([number, words]) => `${number} ${words}`);
        return [where, ...parts].join(" · ");
      }
      function tasksFold(ini) {
        const states = scenario().tasks;
        const body = states
          ? `${graphLegend(states)}${graph("proposed", states, "graph-page")}`
          : `<p class="task-quiet">No Tasks yet. ${CTO_NAME} drafts them with you in the conversation, straight onto this page.</p>`;
        return recordFold({ block: "tasks", icon: "git-fork", title: "Tasks", summary: tasksSummary(ini), body });
      }
      const legendLine = () =>
        `<svg width="30" height="10" viewBox="0 0 30 10" aria-hidden="true"><path class="line" d="M1,5 L22.5,5"/><path class="tip" d="M22,1 L30,5 L22,9 Z"/></svg>`;
      function graphLegend(states) {
        const edges = edgesOf(states);
        const items = [`<span>${legendLine()}must be Done first</span>`];
        if (edges.some(({ blockerDone }) => blockerDone)) items.push(`<span class="done">${legendLine()}its blocker is Done</span>`);
        if (edges.some(({ outside }) => outside)) items.push(`<span class="outside">${legendLine()}from outside this Initiative</span>`);
        return `<p class="graph-legend">${items.join("")}</p>`;
      }
      function recordFold({ block, icon: iconName, title, summary, body }) {
        const open = isOpen(block);
        return `<section class="record-fold" aria-label="${title}">
          <div class="record-fold-row">
            <button type="button" class="fold-button record-fold-head" aria-expanded="${open}" data-action="fold" data-value="${block}">
              <span class="fold-chevron">${icon("chevron-right", 14)}</span>
              <span class="task-block-title">${icon(iconName, 15)}${title}</span>
              <span class="record-fold-summary">${escapeHtml(summary)}</span>
            </button>
          </div>
          ${open ? `<div class="record-fold-body">${body}</div>` : ""}
        </section>`;
      }

      /* ---------- The Task graph (task-graph.tsx): the nodes; the edges are drawn once laid out ---------- */
      function graph(variant, states, id) {
        const columns = [];
        for (const task of GRAPH_TASKS) (columns[task.column] ??= []).push(task);
        const nodes = columns
          .map(
            (column) => `<div class="task-graph-column">${column
              .map((task) => {
                const taskState = taskStateOf(task, states);
                return `<a href="#" class="task-graph-node${task.outside ? " outside" : ""}" data-task="${task.id}" data-column="${task.column}" data-action="open-task" data-title="${escapeHtml(task.title)}">
                  <span class="task-graph-node-title"><span class="mark-square" style="--mark:${PROJECTS[task.projectId].mark}" title="${task.projectId}"></span>${task.title}</span>
                  <span class="task-graph-node-sub">${taskBadge(taskState)}${task.outside ? `<span>Initiative ${task.initiativeName}</span>` : ""}</span>
                </a>`;
              })
              .join("")}</div>`,
          )
          .join("");
        return `<div class="task-graph ${variant}" id="${id}" data-graph="${variant}" data-states="${states}" role="group" aria-label="Task graph">
          <svg class="task-graph-edges" aria-hidden="true"></svg>
          <div class="task-graph-columns">${nodes}</div>
        </div>`;
      }
      function edgesOf(states) {
        return GRAPH_TASKS.filter((task) => !task.outside).flatMap((task) =>
          task.blockedBy.map((blockerId) => {
            const blocker = graphTask(blockerId);
            return { from: blockerId, to: task.id, blockerDone: taskStateOf(blocker, states) === "done", outside: Boolean(blocker.outside) };
          }),
        );
      }
      /** Each node's box in the graph's own coordinates, as `edgeCurves` measures it. */
      function measure(element) {
        const origin = element.getBoundingClientRect();
        const boxes = new Map();
        for (const node of element.querySelectorAll("[data-task]")) {
          const rect = node.getBoundingClientRect();
          const left = rect.left - origin.left + element.scrollLeft;
          const top = rect.top - origin.top;
          boxes.set(node.dataset.task, { left, right: left + rect.width, top, bottom: top + rect.height, middle: top + rect.height / 2, column: Number(node.dataset.column) });
        }
        return boxes;
      }
      function drawGraph(element) {
        const svg = element.querySelector(".task-graph-edges");
        // Measured without the last drawing, so a narrower page doesn't keep its width.
        svg.setAttribute("width", "0");
        svg.setAttribute("height", "0");
        svg.setAttribute("width", String(element.scrollWidth));
        svg.setAttribute("height", String(element.scrollHeight));
        const edges = edgesOf(element.dataset.states);
        const boxes = measure(element);
        svg.innerHTML = element.dataset.graph === "today" ? todayEdges(element.id, edges, boxes) : proposedEdges(edges, boxes);
      }

      /** Today (`edgeCurves`): one cubic curve from the blocker's right edge to 6px before the waiting Task, an arrow marker scaled by the stroke. */
      function todayEdges(id, edges, boxes) {
        const marker = `arrow-${id}`;
        const paths = edges.map(({ from, to, blockerDone }) => {
          const blocker = boxes.get(from);
          const waiting = boxes.get(to);
          const x1 = blocker.right;
          const y1 = blocker.middle;
          const x2 = waiting.left - 6;
          const y2 = waiting.middle;
          const middle = (x1 + x2) / 2;
          return `<path d="M${x1},${y1} C${middle},${y1} ${middle},${y2} ${x2},${y2}"${blockerDone ? ' class="blocker-done"' : ""} marker-end="url(#${marker})"/>`;
        });
        return `<defs><marker id="${marker}" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 z" class="task-graph-arrow"/></marker></defs>${paths.join("")}`;
      }

      /**
       * Proposed: a straight run out of the blocker, the bend in the gap, and a straight run into the
       * arrowhead, so the head always points along the line. The numbers the build takes.
       */
      const CURVE = {
        columnGap: 64,
        runOut: 12,
        runIn: 12,
        arrowLength: 8,
        arrowWidth: 8,
        tipGap: 2,
        radius: 8,
        portSpacing: 8,
        portInset: 12,
        laneSpacing: 4,
        clearance: 10,
      };
      function proposedEdges(edges, boxes) {
        const key = ({ from, to }) => `${from}>${to}`;
        const drawn = edges.filter(({ from, to }) => boxes.has(from) && boxes.has(to));
        // Ports: several edges at one side of a Task spread 8px apart, ordered by the other end's height so they don't cross.
        const outY = new Map();
        const inY = new Map();
        const spread = (list, box, otherMiddle, into) => {
          const sorted = [...list].sort((first, second) => otherMiddle(first) - otherMiddle(second));
          const reach = Math.max(0, (box.bottom - box.top) / 2 - CURVE.portInset);
          sorted.forEach((edge, index) => {
            const offset = (index - (sorted.length - 1) / 2) * CURVE.portSpacing;
            into.set(key(edge), box.middle + Math.max(-reach, Math.min(reach, offset)));
          });
        };
        for (const [id, box] of boxes) {
          spread(drawn.filter(({ from }) => from === id), box, ({ to }) => boxes.get(to).middle, outY);
          spread(drawn.filter(({ to }) => to === id), box, ({ from }) => boxes.get(from).middle, inY);
        }
        const columns = new Map();
        for (const box of boxes.values()) {
          const column = columns.get(box.column) ?? { left: Infinity, right: -Infinity, boxes: [] };
          column.left = Math.min(column.left, box.left);
          column.right = Math.max(column.right, box.right);
          column.boxes.push(box);
          columns.set(box.column, column);
        }
        // The heights an edge runs at: its blocker's port, a free lane through each column it skips, the waiting Task's port.
        const routes = drawn.map((edge) => {
          const from = boxes.get(edge.from);
          const to = boxes.get(edge.to);
          const end = inY.get(key(edge));
          const levels = [outY.get(key(edge))];
          for (let column = from.column + 1; column < to.column; column++) levels.push(laneThrough(columns.get(column), levels[levels.length - 1], end));
          levels.push(end);
          for (let index = 1; index < levels.length; index++) if (Math.abs(levels[index] - levels[index - 1]) < 1) levels[index] = levels[index - 1];
          return { edge, from, to, levels };
        });
        // Bends that share a gap stand 4px apart, so no two vertical runs lie on one line.
        const bendsByGap = new Map();
        for (const route of routes) {
          route.levels.slice(1).forEach((level, index) => {
            if (level === route.levels[index]) return;
            const gap = route.from.column + index;
            if (!bendsByGap.has(gap)) bendsByGap.set(gap, []);
            bendsByGap.get(gap).push({ route, index, middle: (level + route.levels[index]) / 2 });
          });
        }
        const bendX = new Map();
        for (const [gap, bends] of bendsByGap) {
          const left = columns.get(gap).right + CURVE.runOut + CURVE.radius;
          const right = columns.get(gap + 1).left - CURVE.tipGap - CURVE.arrowLength - CURVE.runIn - CURVE.radius;
          const centre = (left + right) / 2;
          const reach = Math.max(0, (right - left) / 2);
          bends.sort((first, second) => first.middle - second.middle);
          bends.forEach((bend, order) => {
            const offset = (order - (bends.length - 1) / 2) * CURVE.laneSpacing;
            bendX.set(`${key(bend.route.edge)}#${bend.index}`, centre + Math.max(-reach, Math.min(reach, offset)));
          });
        }
        return routes
          .map(({ edge, from, to, levels }) => {
            const tip = to.left - CURVE.tipGap;
            const base = tip - CURVE.arrowLength;
            const last = levels[levels.length - 1];
            let path = `M${from.right},${levels[0]}`;
            for (let index = 1; index < levels.length; index++) {
              const y0 = levels[index - 1];
              const y1 = levels[index];
              if (y0 === y1) continue;
              const x = bendX.get(`${key(edge)}#${index - 1}`);
              const sign = Math.sign(y1 - y0);
              const radius = Math.min(CURVE.radius, Math.abs(y1 - y0) / 2);
              path += ` L${x - radius},${y0} A${radius},${radius} 0 0 ${sign > 0 ? 1 : 0} ${x},${y0 + sign * radius}`;
              path += ` L${x},${y1 - sign * radius} A${radius},${radius} 0 0 ${sign > 0 ? 0 : 1} ${x + radius},${y1}`;
            }
            path += ` L${base + 0.5},${last}`;
            const done = edge.blockerDone ? " blocker-done" : "";
            const outside = edge.outside ? " from-outside" : "";
            const half = CURVE.arrowWidth / 2;
            return `<path class="edge${done}${outside}" d="${path}"/><path class="head${done}" d="M${base},${last - half} L${tip},${last} L${base},${last + half} Z"/>`;
          })
          .join("");
      }
      /** Where an edge crosses a column it skips: at its own height if that misses every Task by 10px, else the nearest free lane. */
      function laneThrough(column, y, target) {
        const sorted = [...column.boxes].sort((first, second) => first.top - second.top);
        const blocked = (candidate) => sorted.some((box) => candidate > box.top - CURVE.clearance && candidate < box.bottom + CURVE.clearance);
        if (!blocked(y)) return y;
        const candidates = [sorted[0].top - CURVE.clearance, sorted[sorted.length - 1].bottom + CURVE.clearance];
        for (let index = 0; index + 1 < sorted.length; index++) candidates.push((sorted[index].bottom + sorted[index + 1].top) / 2);
        const cost = (candidate) => Math.abs(candidate - y) + Math.abs(candidate - target);
        return candidates.reduce((best, candidate) => (cost(candidate) < cost(best) ? candidate : best));
      }

      /* ---------- The record column ---------- */
      function record(ini) {
        const shapingNote =
          ini.state === "shaping"
            ? `<div class="alert" role="note">${icon("info", 16)}<span>${CTO_NAME} drafts the outcome and the Tasks with you in the conversation, straight onto this page. Once you confirm the Initiative, each change ${CTO_NAME} wants is a Proposal you apply.</span></div>`
            : "";
        const outcome = recordFold({ block: "outcome", icon: "target", title: "Outcome", summary: ini.outcome, body: `<p class="task-plan">${ini.outcome}</p>` });
        const attachments = recordFold({ block: "attachments", icon: "paperclip", title: "Attachments", summary: "None", body: `<p class="task-quiet">No Attachments yet.</p>` });
        const origin = recordFold({ block: "origin", icon: "lightbulb", title: "Origin", summary: `From the Idea “${ini.originIdea}”`, body: `<p class="task-plan">From the Idea <a href="#" class="link" data-action="toast" data-value="Opens the Idea, as today.">${ini.originIdea}</a>.</p>` });
        if (state.view === "today") return `${shapingNote}${outcome}${todayPipelineFold(ini)}${attachments}${origin}`;
        return `${shapingNote}${pipelineFold(ini)}${outcome}${attachments}${origin}`;
      }
      function choiceSelect(ini) {
        const options = [["", "None"], ...PIPELINES.map(({ id, name }) => [id, name])]
          .map(([value, label]) => `<option value="${value}"${value === (ini.pipelineId ?? "") ? " selected" : ""}>${label}</option>`)
          .join("");
        return `<label class="field"><span class="field-label">Initiative's Pipeline</span><span class="select"><select data-action="choose-pipeline">${options}</select>${icon("chevron-down", 13)}</span><span class="field-hint">Whether it has a Pipeline is fixed at Confirm.</span></label>`;
      }
      function shortName(ini, withBranchLine) {
        if (state.editingShortName) {
          return `<form class="initiative-short-name-editor" data-form="short-name">
            <label class="field"><span class="field-label">Short name</span><input class="input" name="shortName" value="${escapeHtml(ini.shortName ?? "")}" maxlength="40" autocomplete="off" /><span class="field-hint">Lower-case a–z, 0–9 and -, at most 40 characters. The branch is initiative/${escapeHtml(ini.shortName ?? "")}.</span></label>
            <span class="actions"><button type="submit" class="btn sm primary">${icon("check", 14)}Save</button><button type="button" class="btn sm ghost" data-action="cancel-short-name">Cancel</button></span>
          </form>`;
        }
        return `<div class="initiative-short-name">
          <div class="initiative-short-name-row"><span class="initiative-short-name-label">Short name</span><code>${escapeHtml(ini.shortName ?? "Not made yet")}</code><button type="button" class="btn sm secondary" data-action="edit-short-name">Edit</button></div>
          ${withBranchLine && ini.shortName ? `<p class="task-quiet">At Confirm, each Project it spans gets the branch <code>initiative/${escapeHtml(ini.shortName)}</code>.</p>` : ""}
        </div>`;
      }
      const noGateAlert = (pipeline) =>
        `<div class="alert warning" role="note">${icon("triangle-alert", 16)}<span><span class="alert-title">Publishes without your review</span>No Stage of ${pipeline.name} is a Gate, so the Initiative's branch is published into each base branch without you looking at it first.</span></div>`;

      /** Today (initiative-pipeline-block.tsx). */
      function todayPipelineFold(ini) {
        const pipeline = ini.pipelineId && pipelineById(ini.pipelineId);
        const shaping = ini.state === "shaping";
        const summary = pipeline ? pipeline.name : shaping ? "None" : NONE_CONFIRMED;
        let body;
        if (shaping) {
          body = `<div class="initiative-pipeline">${choiceSelect(ini)}${
            pipeline
              ? `<p class="task-quiet">${pipeline.stages.map(({ name }) => name).join(" → ")}</p>${hasGate(pipeline) ? "" : noGateAlert(pipeline)}${shortName(ini, true)}`
              : `<p class="task-quiet">None: each Task publishes on its own, as it is done.</p>`
          }</div>`;
        } else if (!pipeline) {
          body = `<p class="task-plan">${NONE_CONFIRMED}</p>`;
        } else {
          const ended = ini.state === "done" || ini.state === "dropped";
          const publishing = publishingOf();
          const branches = `<ul class="initiative-branches" aria-label="Initiative's branches">${ini.branches
            .map(({ projectId, branch }) => `<li>${projectMark(projectId)} <code>${branch}</code>${ended ? `<span class="task-quiet"> · kept for you to delete</span>` : ""}</li>`)
            .join("")}</ul>`;
          const tasks =
            publishing.length === 0
              ? ini.state === "active"
                ? `<p class="task-quiet">Once every other Task is Done or Dropped, The Office adds a Publishing Task in each Project whose branch holds work, to publish the whole change.</p>`
                : ""
              : `<ul class="initiative-publishing-tasks" aria-label="Publishing Tasks">${publishing
                  .map((task) => `<li>${projectMark(task.projectId)} <a href="#" class="link" data-action="open-task" data-title="${task.title}">${task.title}</a> ${taskBadge(task.state)}</li>`)
                  .join("")}</ul>`;
          body = `<div class="initiative-pipeline"><p class="task-plan">${pipeline.name}</p>${branches}${tasks}${ini.state === "active" ? `<p class="task-quiet">Another Pipeline comes by the CTO's Proposal.</p>` : ""}</div>`;
        }
        return recordFold({ block: "pipeline", icon: "route", title: "Pipeline", summary, body });
      }

      /* ---------- New: the Pipeline card with its diagram ---------- */
      /** Where a Publishing Task is: the Stage it is at, or -1 once it walked them all. */
      function currentIndex(pipeline, task) {
        const states = pipeline.stages.map(({ key }) => task.stages[key].state);
        const held = states.findIndex((stageState) => ["running", "waiting-on-you", "paused", "stopped"].includes(stageState));
        if (held >= 0) return held;
        const failed = states.findIndex((stageState) => stageState === "failed");
        if (failed >= 0) return failed;
        const next = states.findIndex((stageState) => stageState === "pending");
        return next;
      }
      /** How far the line is green: to the Stage it is at, or to the end. */
      function reachedIndex(pipeline, task) {
        const current = currentIndex(pipeline, task);
        return current < 0 ? pipeline.stages.length - 1 : current;
      }
      function pipelineSummary(ini, pipeline) {
        if (!pipeline) return ini.state === "shaping" ? "None: each Task publishes on its own" : NONE_CONFIRMED;
        const gates = pipeline.stages.filter(({ kind }) => kind === "gate").length;
        const shape = `${plural(pipeline.stages.length, "Stage", "Stages")}, ${gates === 0 ? "no Gate" : plural(gates, "Gate", "Gates")}`;
        const publishing = publishingOf();
        if (ini.state === "shaping") return `${pipeline.name} · ${shape}`;
        if (ini.state === "dropped") return `${pipeline.name} · dropped · ${plural(ini.branches.length, "branch", "branches")} kept for you to delete`;
        if (ini.state === "done") return `${pipeline.name} · published in ${plural(publishing.length, "Project", "Projects")}`;
        if (publishing.length === 0) return `${pipeline.name} · ${shape} · starts once every Task is Done or Dropped`;
        const where = publishing.map((task) => {
          const index = currentIndex(pipeline, task);
          if (index < 0) return `${task.projectId} published`;
          const stage = pipeline.stages[index];
          const stageState = task.stages[stage.key].state;
          const how = stageState === "waiting-on-you" ? ", waiting on you" : stageState === "failed" ? ", failed" : "";
          return `${task.projectId} at ${stage.name}${how}`;
        });
        return [pipeline.name, ...where].join(" · ");
      }
      function pipelineFold(ini) {
        const pipeline = ini.pipelineId && pipelineById(ini.pipelineId);
        const shaping = ini.state === "shaping";
        const publishing = publishingOf();
        const parts = [];
        if (shaping) parts.push(`<div class="pd-choice">${choiceSelect(ini)}${pipeline ? shortName(ini, false) : ""}</div>`);
        if (!pipeline) {
          parts.push(
            shaping
              ? `<div class="pd-none"><p>None: each Task publishes on its own, as it is done.</p><p>Choose a Pipeline to publish the Initiative's whole change at once in each Project, after its last Task, through the Stages you pick.</p></div>`
              : `<div class="pd-none"><p>${NONE_CONFIRMED}.</p><p>Each Task publishes on its own, as it is done. Whether the Initiative has a Pipeline was fixed at Confirm.</p></div>`,
          );
        } else {
          if (shaping && !hasGate(pipeline)) parts.push(noGateAlert(pipeline));
          parts.push(diagram(ini, pipeline, publishing));
          parts.push(pipelineFoot(ini, publishing));
        }
        return recordFold({ block: "pipeline", icon: "route", title: "Pipeline", summary: pipelineSummary(ini, pipeline), body: `<div class="pipeline-diagram-block">${parts.join("")}</div>` });
      }
      function pipelineFoot(ini, publishing) {
        if (ini.state === "shaping") return `<p class="task-quiet sm">Once every other Task is Done or Dropped, each Project gets a Publishing Task that walks these Stages.</p>`;
        if (ini.state === "dropped") return `<p class="task-quiet sm">Dropped: no Publishing Task is added any more.</p>`;
        if (ini.state === "done") return "";
        if (publishing.length === 0)
          return `<p class="task-quiet sm">Once every other Task is Done or Dropped, The Office adds a Publishing Task in each Project whose branch holds work, to publish the whole change; you start it, or Start Ready Tasks does. Another Pipeline comes by the CTO's Proposal.</p>`;
        const started = publishing.some((task) => !["ready", "dropped"].includes(task.state));
        return started ? `<p class="task-quiet sm">Its Publishing Tasks have started, so its Pipeline no longer changes.</p>` : "";
      }
      /** The diagram: both layouts drawn, one shown by its own width once laid out (`data-fit`). */
      function diagram(ini, pipeline, publishing) {
        const stages = pipeline.stages;
        const gates = stages.filter(({ kind }) => kind === "gate").length;
        const caption = [
          `<b>${pipeline.name}</b>`,
          `<span>${plural(stages.length, "Stage", "Stages")}, ${gates === 0 ? "no Gate" : plural(gates, "Gate", "Gates")}</span>`,
          publishing.length > 0 ? `<span>select a Stage for its history</span>` : "",
        ].join("");
        const rows = ini.projectIds.map((projectId) => ({ projectId, task: publishing.find((task) => task.projectId === projectId) }));
        return `<p class="pd-caption">${caption}</p>
          <div class="pipeline-diagram" data-fit="across" data-stages="${stages.length}" style="--stages:${stages.length};--projects:${rows.length}" role="group" aria-label="Pipeline diagram">
            <div class="pd-across-view">${acrossView(ini, pipeline, rows)}</div>
            <div class="pd-stacked-view">${stackedView(ini, pipeline, rows)}</div>
          </div>`;
      }
      function rowLabel(ini, pipeline, { projectId, task }) {
        const ended = ini.state === "done" || ini.state === "dropped";
        const branchName = `initiative/${escapeHtml(ini.shortName ?? "")}`;
        const branchNote = ini.state === "shaping" ? "made at Confirm" : ended ? "kept for you to delete" : "";
        const branch = `<span class="pd-branch">${icon("git-branch", 12)}${branchName}${branchNote ? ` <span class="pd-branch-note">· ${branchNote}</span>` : ""}</span>`;
        const who = task
          ? `<a href="#" class="link" data-action="open-task" data-title="${task.title}">${task.title}</a>${taskBadge(task.state)}${task.state === "done" ? `<span class="pd-published">${PROJECTS[projectId].publishing}</span>` : ""}`
          : ini.state === "shaping"
            ? ""
            : `<span class="pd-row-pending">No Publishing Task yet</span>`;
        return `<div class="pd-row-label">${projectMark(projectId)}${who}${branch}</div>`;
      }
      function loopWords(pipeline, task) {
        return pipeline.stages
          .filter(({ key }) => task.stages[key].wentBack)
          .map((stage) => {
            const { stageKey, round, rounds } = task.stages[stage.key].wentBack;
            const back = pipeline.stages.find(({ key }) => key === stageKey);
            return `${stage.name} failed: back to ${back.name}, round ${round} of ${rounds}`;
          });
      }
      function cellButton(task, stage, extraClass = "") {
        const stageState = task.stages[stage.key].state;
        const words = STAGE_STATE_WORDS[stageState];
        const round = task.stages[stage.key].round;
        const label = `${task.projectId}: ${stage.name}${words ? `, ${words}` : ", not reached"}${round ? `, round ${round}` : ""}`;
        return `<button type="button" class="pd-cell-button${extraClass}" data-action="stage" data-task="${task.id}" data-stage="${stage.key}" aria-label="${label}" title="${label}">${stageMark(stage, stageState)}`;
      }
      function acrossView(ini, pipeline, rows) {
        const stages = pipeline.stages;
        const share = 100 / stages.length;
        const heads = stages
          .map((stage) => `<li class="pd-head"><span class="pd-head-name">${stage.name}</span><span class="pd-head-who">${stage.who}</span>${stage.optional ? `<span class="pd-optional">optional</span>` : ""}</li>`)
          .join("");
        const trackOf = ({ task }) => {
          if (!task) {
            const cells = stages.map((stage) => `<li class="pd-cell"><span class="pd-cell-button"><span class="stage-mark stage-mark-placeholder stage-mark-kind-${stage.kind}"></span><span class="pd-cell-state"></span></span></li>`).join("");
            return `<div class="pd-track placeholder"><span class="pd-line" style="left:${share / 2}%;right:${share / 2}%"></span><ol class="pd-cells">${cells}</ol></div>`;
          }
          const reached = reachedIndex(pipeline, task);
          const live = stages[reached] && task.stages[stages[reached].key].state === "running";
          const loops = stages
            .map((stage, index) => ({ stage, index, wentBack: task.stages[stage.key].wentBack }))
            .filter(({ wentBack }) => wentBack);
          const cells = stages
            .map((stage) => {
              const stageState = task.stages[stage.key].state;
              const selected = state.selected && state.selected.taskId === task.id && state.selected.stageKey === stage.key ? " selected" : "";
              const round = task.stages[stage.key].round;
              const words = `${stageState === "running" ? '<span class="live-dot"></span>' : ""}${STAGE_STATE_WORDS[stageState]}${round && stageState === "running" ? ` · round ${round}` : ""}` || "&nbsp;";
              return `<li class="pd-cell pd-cell-${stageState}${selected}">${cellButton(task, stage)}<span class="pd-cell-state">${words}</span></button></li>`;
            })
            .join("");
          const arcs = loops
            .map(({ stage, index, wentBack }) => {
              const back = stages.findIndex(({ key }) => key === wentBack.stageKey);
              const words = `${stage.name} failed: back to ${stages[back].name}, round ${wentBack.round} of ${wentBack.rounds}`;
              return `<div class="pd-arc" style="left:${(back + 0.5) * share}%;right:${100 - (index + 0.5) * share}%"><button type="button" class="pd-arc-mark" data-action="stage" data-task="${task.id}" data-stage="${stage.key}" aria-label="${words}" title="${words}">↺ ${wentBack.round} of ${wentBack.rounds}</button></div>`;
            })
            .join("");
          return `<div class="pd-track${loops.length ? " has-loop" : ""}">
            <span class="pd-line" style="left:${share / 2}%;right:${share / 2}%"></span>
            ${reached > 0 ? `<span class="pd-reached${live ? " live" : ""}" style="left:${share / 2}%;width:${reached * share}%"></span>` : ""}
            <ol class="pd-cells">${cells}</ol>${arcs}
          </div>`;
        };
        const rowItems = rows.map((row) => `<li class="pd-row">${rowLabel(ini, pipeline, row)}${trackOf(row)}</li>`).join("");
        return `<ol class="pd-heads" aria-label="Stages">${heads}</ol><ol class="pd-rows" aria-label="Projects">${rowItems}</ol>`;
      }
      function stackedView(ini, pipeline, rows) {
        const stages = pipeline.stages;
        const projectHeads = rows.map(({ projectId }) => `<div class="pd-s-head pd-s-project"><span class="mark-square" style="--mark:${PROJECTS[projectId].mark}"></span>${projectId}</div>`).join("");
        const lines = stages
          .map((stage, index) => {
            const name = `<div class="pd-s-name"><b>${stage.name}</b><span class="pd-head-who">${stage.who}${stage.optional ? " · optional" : ""}</span></div>`;
            const cells = rows
              .map(({ task }) => {
                const ends = `${index === 0 ? " first" : ""}${index === stages.length - 1 ? " last" : ""}`;
                if (!task) return `<div class="pd-s-cell placeholder${ends}"><span class="stage-mark stage-mark-placeholder stage-mark-kind-${stage.kind}"></span></div>`;
                const reached = reachedIndex(pipeline, task);
                const reach = `${index <= reached && index > 0 ? " reached-above" : ""}${index < reached ? " reached-below" : ""}`;
                const selected = state.selected && state.selected.taskId === task.id && state.selected.stageKey === stage.key ? " selected" : "";
                return `<div class="pd-s-cell pd-cell${selected}${ends}${reach}">${cellButton(task, stage)}</button></div>`;
              })
              .join("");
            return name + cells;
          })
          .join("");
        const labels = rows
          .map((row) => {
            const loops = row.task ? loopWords(pipeline, row.task).map((words) => `<p class="pd-loop-words">↺ ${words}</p>`).join("") : "";

        return `<div class="pd-stacked"><div class="pd-s-head"><span class="overline">Stage</span></div>${projectHeads}${lines}</div><ul class="pd-s-rows" aria-label="Publishing Tasks">${labels}</ul>`;

      /* ---------- The Stage history window, opened from a Stage of a Publishing Task ---------- */
      const RUN_WORDS = {

        "integrate:running": "Fixing the 3 tests Check found failing, on the Initiative's branch.",
        "review:done": "Read the whole change against the outcome; nothing to change.",

        "notes:skipped": "Optional, skipped: nothing user-facing changed in this Project.",
        "your-review:waiting-on-you": "Waiting for you: Continue, Send back with notes… or Drop, on the Task's page.",

        "publish:done": "Published the Initiative's branch into main.",
      };
      function runsOf(task, stage) {
        const { state: stageState, round } = task.stages[stage.key];

        const runs = [{ number: round ?? 1, state: stageState, when: stageState === "running" || stageState === "waiting-on-you" ? "since 14:02" : "13:12 – 13:31", words: RUN_WORDS[`${stage.key}:${stageState}`] ?? "" }];
        if (round && round > 1) runs.push({ number: round - 1, state: "done", when: "12:40 – 13:05", words: RUN_WORDS[`${stage.key}:done`] ?? "" });
        return runs;
      }
      function stageHistoryWindow() {
        const ini = initiative();

        const strip = pipeline.stages
          .map((each) => `<button type="button" data-action="stage" data-task="${task.id}" data-stage="${each.key}" aria-current="${each.key === stage.key}">${stageMark(each, task.stages[each.key].state)}${each.name}</button>`)
          .join("");
        const runs = runsOf(task, stage);
        const list = runs.length

        const detail = runs.length

          <div class="window-strip">${strip}</div>
          <div class="window-body"><ol class="run-list">${list}</ol><div class="run-detail">${detail}</div></div>

      /* ---------- The conversation, as today, in brief ---------- */
      const CONVERSATION = {
        shaping: "I've drafted seven Tasks across not-astray and notnullsoft. Shall the whole change publish at once, through a Pipeline, or Task by Task?",
        active: "Sync endpoint is in progress; Offline queue for edits is waiting for your answer on its Plan.",

      /* ---------- Rendering ---------- */

      /* ---------- The reference under the frame ---------- */
      function anatomy() {

          <defs><marker id="anatomy-arrow" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 z" class="head"/></marker></defs>
          ${nodes(260)}
          <path class="edge" d="M216,62 C235,62 235,158 254,158" marker-end="url(#anatomy-arrow)"/>

      }
      function renderReference() {
        document.getElementById("reference").innerHTML = `
          <div>
            <h2>The arrows, Today and Proposed, on the same graph</h2>
            <p>The Active scenario's Tasks, drawn both ways with the same measuring as the app: from the blocker's right edge at mid-height to the waiting Task's left edge.</p>

          <div class="compare">

      /* ---------- What the controls do ---------- */
      function showToast(words) {
        clearTimeout(toastTimer);
        state.toast = words;
        render();
        toastTimer = setTimeout(() => {
          state.toast = undefined;
          render();
        }, 2600);
      }
      document.getElementById("bar").addEventListener("click", (event) => {
        const button = event.target.closest("[data-action]");
        if (!button) return;
        const { action, value } = button.dataset;
        state.selected = undefined;
        state.editingShortName = false;
        if (action === "scenario") {
          state.scenario = value;
          render();
          document.querySelector("#frame .main").scrollTop = 0;
          return;
        }
        state[action] = value;
        render();
      });
      const frame = document.getElementById("frame");
      frame.addEventListener("click", (event) => {
        const target = event.target.closest("[data-action]");
        if (!target || target.tagName === "SELECT") return;
        const { action, value } = target.dataset;
        if (target.tagName === "A") event.preventDefault();
        if (action === "fold") {
          state.folds[`${state.view}:${state.scenario}:${value}`] = !isOpen(value);
          render();
        } else if (action === "open-task") {
          state.selected = undefined;
          showToast(`Opens the Task's page: ${target.dataset.title}`);
        } else if (action === "toast") {
          showToast(value);
        } else if (action === "stage") {
          state.selected = { taskId: target.dataset.task, stageKey: target.dataset.stage };
          render();
        } else if (action === "close-window") {
          state.selected = undefined;
          render();
        } else if (action === "edit-short-name") {
          state.editingShortName = true;
          render();
          frame.querySelector('input[name="shortName"]')?.focus();
        } else if (action === "cancel-short-name") {
          state.editingShortName = false;
          render();
        }
      });
      frame.addEventListener("change", (event) => {
        if (event.target.dataset.action !== "choose-pipeline") return;
        state.choices[state.scenario] = event.target.value === "" ? null : event.target.value;
        state.editingShortName = false;
        render();
      });
      frame.addEventListener("submit", (event) => {
        if (event.target.dataset.form !== "short-name") return;
        event.preventDefault();
        const typed = new FormData(event.target).get("shortName").trim();
        state.shortNames[state.scenario] = typed.toLowerCase().replace(/[^a-z0-9-]/g, "-").slice(0, 40) || "offline-sync";
        state.editingShortName = false;
        render();
      });
      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && state.selected) {
          state.selected = undefined;
          render();
        }
      });
      window.addEventListener("resize", afterLayout);
      render();
    </script>
  </body>
</html>
