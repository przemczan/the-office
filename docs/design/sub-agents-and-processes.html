        following: true,
        loadingOutput: false,
        lineLoading: false,
        openedAt: Date.now(),
      };
      let lateTimers = [];

      const scenario = () => SCENARIOS.find((s) => s.key === state.scenario);
      const now = () => (Date.now() - state.openedAt) / 1000;
      const isPhone = () => state.width === "390";

      function applyScenario() {
        const s = scenario();
        lateTimers.forEach(clearTimeout);
        lateTimers = [];
        state.openedAt = Date.now();
        state.items = s.items();
        state.open = s.open;
        state.picked = s.picked ?? state.items[0].id;
        state.pane = s.open ? "details" : "list";
        state.stageTab = s.open ? "view" : "thread";
        state.promptOpen = false;
        state.following = true;
        state.loadingOutput = Boolean(s.late);
        state.lineLoading = Boolean(s.late);
        if (s.late) {
          lateTimers.push(setTimeout(() => ((state.lineLoading = false), render()), 450));
          lateTimers.push(setTimeout(() => ((state.loadingOutput = false), render()), 1100));
        }
      }

      /* ---------- Words ---------- */
      const clock = (seconds) => {
        const total = 14 * 3600 + 6 * 60 + Math.floor(seconds);
        const h = Math.floor(total / 3600);
        const m = Math.floor((total % 3600) / 60);
        return `${h}:${String(m).padStart(2, "0")}`;
      };
      const duration = (seconds) => {
        const s = Math.max(0, Math.floor(seconds));
        if (s < 60) return `${s}s`;
        if (s < 3600) return `${Math.floor(s / 60)}m ${String(s % 60).padStart(2, "0")}s`;
        return `${Math.floor(s / 3600)}h ${String(Math.floor((s % 3600) / 60)).padStart(2, "0")}m`;
      };
      const ranFor = (item) => (item.endedAt ?? now()) - item.startedAt;
      const stateOf = (item) => item.ending?.state ?? "running";
      const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;
      const kinds = (items) =>
        [
          [items.filter((i) => i.kind === "sub-agent").length, "sub-agent", "sub-agents"],
          [items.filter((i) => i.kind === "process").length, "process", "processes"],
        ]
          .filter(([n]) => n > 0)
          .map(([n, one, many]) => plural(n, one, many))
          .join(", ");

      /* What the line says (spec 2.9, The UI): what runs, then how many ended and failed. */
      function lineWords(items) {
        const live = items.filter((i) => stateOf(i) === "running");
        const ended = items.filter((i) => stateOf(i) !== "running");
        const failed = ended.filter((i) => stateOf(i) === "failed").length;
        if (live.length > 0) {
          const endedWords = ended.length > 0 ? ` · ${ended.length} ended` : "";
          const failedWords = failed > 0 ? `, <span class="failed">${failed} failed</span>` : "";
          return {
            live: true,
            html: `<b>${kinds(live)}</b> running${endedWords}${failedWords}`,
            label: `${kinds(live)} running${endedWords}${failed ? `, ${failed} failed` : ""}`,
          };
        }
        const failedWords = failed > 0 ? ` · <span class="failed">${failed} failed</span>` : "";
        return {
          live: false,
          html: `<b>${kinds(ended)}</b> ended${failedWords}`,
          label: `${kinds(ended)} ended${failed ? `, ${failed} failed` : ""}`,
        };
      }

      const STATE_WORDS = { running: "Running", finished: "Finished", failed: "Failed", stopped: "Stopped" };
      const STOPPED_BY = {
        agent: "by the Agent",
        interrupt: "when the turn was interrupted",
        "session-end": "with the session",
        restart: "when The Office restarted",
      };
      /* An item's state in the list: the state, then what the user asks next (how long, how it ended). */
      function stateLine(item) {
        const st = stateOf(item);
        const mark = st === "running" ? '<span class="dot running"></span>' : st === "finished" ? ICON.check(11) : "";
        const how =
          st === "failed" && item.kind === "process"
            ? ` · exit code ${item.exitCode}`
            : st === "stopped"
              ? ` ${STOPPED_BY[item.ending.by]}`
              : "";
        return `<span class="state ${st}">${mark}${STATE_WORDS[st]}${how}</span><span aria-hidden="true">·</span><span data-ran="${esc(item.id)}">${duration(ranFor(item))}</span>`;
      }
      function stateBadge(item) {
        const st = stateOf(item);
        const look = { running: "success", finished: "", failed: "danger", stopped: "" }[st];
        const mark = st === "running" ? '<span class="dot running" style="width:6px;height:6px"></span>' : "";
        return `<span class="badge ${look}">${mark}${STATE_WORDS[st]}</span>`;
      }

      /* ---------- The line above the message input ---------- */
      function workLine() {
        if (state.items.length === 0 || state.lineLoading) return "";
        const words = lineWords(state.items);
        const mark = words.live ? '<span class="dot running"></span>' : ICON.subAgent(14);
        // In the Stage history it switches to the run's tab; elsewhere it opens a window.
        const opens = state.place === "stage" ? "" : `aria-haspopup="dialog" aria-expanded="${state.open}"`;
        return `<button class="work-line" data-action="open" ${opens} aria-label="${esc(words.label)}. Show them.">
          <span class="work-line-mark">${mark}</span>
          <span class="work-line-text">${words.html}</span>
          <span class="work-line-open">${isPhone() ? "" : "Show"}${ICON.chevronRight(12)}</span>
        </button>`;
      }

      /* ---------- The view: a list and details ---------- */
      function viewList() {
        const live = state.items.filter((i) => stateOf(i) === "running");
        const ended = state.items
          .filter((i) => stateOf(i) !== "running")
          .sort((a, b) => b.endedAt - a.endedAt);
        const group = (title, items) =>
          items.length === 0
            ? ""
            : `<div class="view-group"><span class="overline">${title}</span><span class="badge count">${items.length}</span></div>` +
              items.map(listItem).join("");
        return `<nav class="view-list" aria-label="Sub-agents and processes">${group("Running", live)}${group("Ended", ended)}</nav>`;
      }
      function listItem(item) {
        const isProcess = item.kind === "process";
        const title = item.description || item.commandLine;
        const kindWords = isProcess ? "Process" : `Sub-agent · ${item.agentKind}`;
        return `<button class="view-item" data-pick="${esc(item.id)}" aria-current="${item.id === state.picked}">
          <span class="view-item-mark">${isProcess ? ICON.process(15) : ICON.subAgent(15)}</span>
          <span class="view-item-title${item.description ? "" : " command"}">${esc(title)}</span>
          <span class="view-item-meta"><span>${kindWords}</span>·${stateLine(item)}</span>
        </button>`;
      }

      function viewDetail() {
        const item = state.items.find((i) => i.id === state.picked);
        if (!item) return `<div class="view-detail"></div>`;
        const back = `<button class="view-back" data-action="back">${ICON.chevronLeft(14)} All sub-agents and processes</button>`;
        return `<section class="view-detail" aria-label="${esc(item.description)}">${back}${item.kind === "process" ? processDetail(item) : subAgentDetail(item)}</section>`;
      }

      function detailHead(item) {
        const isProcess = item.kind === "process";
        const st = stateOf(item);
        const facts = [
          `Started by ${item.startedBy} at ${clock(item.startedAt)}`,
          st === "running"
            ? `running for <span data-ran="${esc(item.id)}">${duration(ranFor(item))}</span>`
            : `ran <span>${duration(ranFor(item))}</span>, until ${clock(item.endedAt)}`,
          isProcess ? `${item.shell} · id ${item.id}` : `<span data-calls>${plural(item.toolCalls, "tool call", "tool calls")}</span>`,
        ];
        const badges = [
          stateBadge(item),
          isProcess ? "" : `<span class="badge">${esc(item.agentKind)}</span>`,
          item.background ? '<span class="badge info">In the background</span>' : "",
        ].join("");
        return `<header class="view-head">
          <h3 class="view-title">${isProcess ? ICON.process(16) : ICON.subAgent(16)}<span>${esc(item.description || item.commandLine)}</span></h3>
          <div class="view-badges">${badges}</div>
          <p class="view-facts">${facts.map((f) => `<span>${f}</span>`).join("")}</p>
        </header>`;
      }

      function endingStrip(item) {
        const st = stateOf(item);
        if (st === "running") return "";
        if (st === "finished") {
          return item.kind === "process"
            ? `<div class="ending finished">${ICON.check(14)}<span>Finished with exit code 0 at ${clock(item.endedAt)}.</span></div>`
            : "";
        }
        if (st === "failed") {
          const why = item.kind === "process" ? `Failed with exit code ${item.exitCode} at ${clock(item.endedAt)}.` : `Failed at ${clock(item.endedAt)}. ${item.ending.reason}`;
          return `<div class="ending failed">${ICON.alert(14)}<span>${esc(why)}</span></div>`;
        }
        return `<div class="ending">${ICON.stop(14)}<span>Stopped ${STOPPED_BY[item.ending.by]} at ${clock(item.endedAt)}${item.ending.by === "agent" ? " (TaskStop)" : ""}.</span></div>`;
      }

      function processDetail(item) {
        const st = stateOf(item);
        const follow =
          st !== "running"
            ? ""
            : state.following
              ? '<span class="following" id="following"><span class="dot running" style="width:6px;height:6px"></span>Following the end</span>'
              : `<button class="btn sm secondary" data-action="jump" id="following">${ICON.down(12)} Jump to the end</button>`;
        const dropped = item.droppedBytes
          ? `<span class="output-dropped">${item.droppedBytes} MB of earlier output isn't kept. The last 256 KB show here.</span>`
          : "";
        const body = state.loadingOutput
          ? `<span class="output-loading" role="status" aria-label="Loading the output…">${[92, 78, 85, 60, 70, 44].map((w) => `<span class="skeleton" style="width:${w}%"></span>`).join("")}</span>`
          : dropped + item.output.map(esc).join("\n");
        return `<div class="view-detail-scroll">
          ${detailHead(item)}
          <div class="view-section"><span class="overline">Command</span><pre class="command">${esc(item.commandLine)}</pre></div>
          <div class="output-section">
            <div class="view-section-row"><span class="overline">Output</span>${follow}</div>
            <pre class="output" id="output" tabindex="0" aria-label="Output" aria-live="off">${body}</pre>
            ${endingStrip(item)}
          </div>
        </div>`;
      }

      function subAgentDetail(item) {
        const promptFolded = !state.promptOpen && item.prompt.split("\n").length + item.prompt.length / 90 > 3.2;
        const detailsSwitch = `<button class="switch-label" role="switch" aria-checked="${state.details}" data-action="details">Details<span class="switch"></span></button>`;
        return `<div class="view-detail-scroll" id="sub-agent-scroll">
          ${detailHead(item)}
          <div class="view-section">
            <span class="overline">Its prompt</span>
            <p class="prompt${promptFolded ? " folded" : ""}">${esc(item.prompt)}</p>
            ${promptFolded ? '<div><button class="text-link" data-action="prompt">Read it in full</button></div>' : ""}
          </div>
          <div class="view-section" style="padding-bottom:0">
            <div class="view-section-row"><span class="overline">Messages and tool calls</span>${detailsSwitch}</div>
          </div>
          <div class="sub-agent-thread"><div class="thread-column" id="sub-agent-thread">${subAgentRows(item)}</div></div>
        </div>`;
      }

      /* A Sub-agent's messages in Rows: its text as turns, its tool calls folded under them, as a Thread shows its Agent's. */
      function subAgentRows(item) {
        const st = stateOf(item);
        const rows = [];
        item.entries.forEach((entry, index) => {
          if (entry.text) rows.push(subAgentTurn(item, entry.text));
          else if (state.details) rows.push(toolFold(entry.tools, index === item.entries.length - 1 && entry.fresh));
        });
        if (!state.details && item.entries.every((e) => !e.text)) {
          rows.push(`<p class="detail-empty">Nothing written yet. Its tool calls show with Details.</p>`);
        }
        if (st === "running") {
          rows.push(`<div class="in-column"><span class="typing" aria-label="Working"><i></i><i></i><i></i></span></div>`);
        } else if (item.reportedBack) {
          rows.push(`<div class="in-column reported"><b>Reported back to ${item.startedBy}</b>${said(item.reportedBack)}</div>`);
        }
        const strip = endingStrip(item);
        if (strip) rows.push(`<div class="in-column">${strip}</div>`);
        return rows.join("");
      }
      function subAgentTurn(item, text) {
        return `<div class="turn">
          <span class="avatar agent-mark">${ICON.subAgent(13)}</span>
          <div style="min-width:0"><div class="turn-by"><b>${esc(item.agentKind)} sub-agent</b><span>${clock(item.startedAt)}</span></div>
          <div class="said"><p>${said(text)}</p></div></div>
        </div>`;
      }
      function toolFold(tools, fresh) {
        const last = tools[tools.length - 1];
        return `<details class="tools in-column"${fresh ? " open" : ""}>
          <summary>${ICON.tools(10)}<span>${plural(tools.length, "tool call", "tool calls")}</span><span class="tools-last">${esc(last[0])} ${esc(last[1])}</span></summary>
          <ul>${tools.map(([tool, input]) => `<li${fresh ? ' class="arrived"' : ""}><b>${esc(tool)}</b><span>${esc(input)}</span></li>`).join("")}</ul>
        </details>`;
      }

      function view() {
        return `<div class="view" data-pane="${state.pane}" id="view">
          <div class="view-body">${viewList()}${viewDetail()}</div>
        </div>`;
      }

      /* The window the line opens, in the chat drawer and on the Task page: large, one height, no actions but Close. */
      function viewWindow() {
        const where = state.place === "chat" ? "Jim's chat · Try a search index on a copy of the data" : "Jim's Thread on Search across Threads";
        return `<div class="window-backdrop" data-action="backdrop">
          <div class="window" role="dialog" aria-modal="true" aria-labelledby="view-title">
            <div class="window-head">
              <h2 id="view-title">Sub-agents and processes<span>${esc(where)}</span></h2>
              <button class="icon-button" data-action="close" aria-label="Close">${ICON.x(16)}</button>
            </div>
            <div class="window-body">${view()}</div>
            <div class="window-bar">
              <span class="grow">${ICON.lock(12)} Read-only: only the Agent can stop them.</span>
              <button class="btn secondary" data-action="close">Close</button>
            </div>
          </div>
        </div>`;
      }

      /* ---------- The Thread behind: Jim's turns ---------- */
      function jimsThread({ stage = false } = {}) {
        const intro = stage
          ? `<div class="office-break">Brief · Implement, run 2</div>`
          : `<div class="turn"><span class="avatar you">You</span><div style="min-width:0"><div class="turn-by"><b>You</b><span>14:01</span></div><div class="said"><p>Before you build it: does an index on the messages slow down writing them? Try it on a copy of the data.</p></div></div></div>`;
        const tools = [
          ["Task", "Check how the web app lists Threads"],
          ["Bash", "npm run dev -w apps/web (in the background)"],
          ["Task", "Find where Threads are read and searched"],
          ["Task", "Review the search migration for locks (in the background)"],
        ];
        const fold = state.threadDetails
          ? `<details class="tools in-column" open><summary>${ICON.tools(10)}<span>4 tool calls</span><span class="tools-last">Task Review the search migration for locks</span></summary><ul>${tools.map(([t, i]) => `<li><b>${t}</b><span>${esc(i)}</span></li>`).join("")}</ul></details>`
          : "";
        return `<div class="thread-column">
          ${intro}
          <div class="turn"><span class="avatar jim">JH</span><div style="min-width:0"><div class="turn-by"><b>Jim</b><span>Developer</span><span>14:02</span></div>
            <div class="said"><p>I'll find where messages are written and start the web app, and a sub-agent reviews the migration while the tests run.</p></div></div></div>
          ${fold}
          <div class="in-column"><span class="typing" aria-label="Jim is answering"><i></i><i></i><i></i></span></div>
        </div>`;
      }
      function composer({ placeholder, to = true }) {
        const toLine = to
          ? `<div class="composer-to">To <span class="avatar sm jim">JH</span><strong>Jim</strong><span class="dot warm"></span><span>cache warm, 41 min left</span></div>`
          : "";
        return `<div class="composer">${toLine}<div class="composer-row"><textarea class="composer-field" rows="1" placeholder="${esc(placeholder)}" aria-label="Message"></textarea><button class="composer-send" disabled aria-label="Send">${ICON.send(16)}</button></div></div>`;
      }
      const threadDetailsSwitch = () =>
        `<button class="switch-label" role="switch" aria-checked="${state.threadDetails}" data-action="thread-details">Details<span class="switch"></span></button>`;

      /* ---------- The shell ---------- */
      /* `overlay`: what lies over the page inside the app, such as the chat drawer or the Stage history. */
      function shell(title, crumb, mainHtml, { chatOpen = false, overlay = "" } = {}) {
        const phone = isPhone();
        const onNow = state.place === "chat";
        return `<div class="app ${phone ? "w-phone" : ""} ${state.place === "chat" && state.width === "wide" ? "pushed" : ""} ${state.width !== "wide" ? "narrow-page" : ""}">
          <nav class="rail" aria-label="Surfaces"><span class="rail-mark">O</span>
            <span class="rail-item ${onNow ? "on" : ""}">${ICON.now()}</span><span class="rail-item ${onNow ? "" : "on"}">${ICON.work()}</span>
            <span class="rail-item">${ICON.people()}</span><span class="rail-item">${ICON.projects()}</span><span class="rail-item">${ICON.settings()}</span></nav>
          <header class="top"><span class="crumb">${esc(crumb)}</span><h1>${esc(title)}</h1><span class="grow"></span>
            <span class="chat-button ${chatOpen ? "open" : ""}">${ICON.chat(14)}${phone ? "" : "Chat"}</span></header>
          <div class="strip"><span><b>2</b> Needs you</span><span><b>3</b> running</span>${phone ? "" : "<span><b>41%</b> of the 5-hour window</span>"}</div>
          <main class="main">${mainHtml}</main>
          ${overlay}
        </div>`;
      }

      function nowPage() {
        const card = (title, lines) =>
          `<div class="card"><h3>${title}</h3>${lines.map((w) => `<span class="ghost-line" style="width:${w}%"></span>`).join("")}</div>`;
        return `<div class="page-scroll"><div class="now-page">${card("Needs you", [90, 70, 80])}${card("Running", [85, 60, 75, 50])}${card("Today", [70, 90, 40])}</div></div>`;
      }

      function chatPlace() {
        const phone = isPhone();
        const drawerLook = phone ? "fill" : state.width === "900" ? "over" : "";
        const drawer = `<aside class="chat-drawer ${drawerLook}" aria-label="Chat">
          <div class="drawer-head"><span class="avatar jim">JH</span><div class="drawer-head-main"><span class="drawer-title">Jim</span><span class="drawer-sub">Developer · reads and changes code in a Task's worktree</span></div>
            <button class="icon-button" aria-label="Close the chat">${ICON.x(16)}</button></div>
          <div class="thread-row"><button class="btn ghost sm">${ICON.chevronLeft(12)} Threads</button><span class="thread-row-title">Try a search index on a copy of the data</span>${threadDetailsSwitch()}</div>
          <div class="thread">${jimsThread()}</div>
          ${workLine()}
          ${composer({ placeholder: "Write to Jim…" })}
        </aside>`;
        return shell("Now", "", nowPage(), { chatOpen: true, overlay: drawer });
      }

      function taskRecord() {
        return `<div class="record">
          <div class="record-head"><h2>Search across Threads</h2>
            <div class="record-facts"><span class="badge success"><span class="dot running" style="width:6px;height:6px"></span>In progress</span><span>the-office</span><span>Implement · Jim</span></div></div>
          <div class="pipeline-rail"><span class="rail-stage done">${ICON.check(11)} Plan</span><span class="rail-stage now">Implement</span><span class="rail-stage">Review</span><span class="rail-stage">Publish</span></div>
          <div class="tabs"><button class="tab" aria-selected="true">Overview</button><button class="tab">Changes</button><button class="tab">Attachments</button></div>
          <div class="card record-block"><h3>Description</h3><p>A search box above the Thread list that finds a Thread by any word in its messages, in the chat drawer and on a Task page.</p></div>
          <div class="card record-block"><h3>Plan</h3><p>Index the masked text of every message with a GIN index, add GET /api/threads/search, and a search box over the Thread list. Try the index on a copy of the data first.</p></div>
        </div>`;
      }

      function taskPlace() {
        const narrow = state.width !== "wide";
        const conversation = `<section class="conversation" aria-label="Conversation">
          <div class="tabs conversation-tabs"><button class="tab"><span class="avatar sm angela">AM</span>Angela</button><button class="tab" aria-selected="true"><span class="avatar sm jim">JH</span>Jim</button>
            <span class="tabs-end">${threadDetailsSwitch()}</span></div>
          <div class="thread">${jimsThread()}</div>
          ${workLine()}
          ${composer({ placeholder: "Write to Jim…" })}
        </section>`;
        const page = `<div class="task-page">${taskRecord()}${narrow ? "" : conversation}</div>`;
        const drawer = narrow ? `<div class="scrim"></div><span class="drawer-handle">Conversation</span>${conversation}` : "";
        return shell("Search across Threads", "Work ›", page + drawer);
      }

      function stagePlace() {
        const tab = state.stageTab;
        const count = state.items.length;
        const tabs = `<div class="tabs" role="tablist">
          <button class="tab" role="tab" data-tab="summary" aria-selected="${tab === "summary"}">Summary</button>
          <button class="tab" role="tab" data-tab="thread" aria-selected="${tab === "thread"}">Thread</button>
          <button class="tab" role="tab" data-tab="view" aria-selected="${tab === "view"}">Sub-agents and processes <span class="badge count">${count}</span></button>
          <span class="tabs-end">${tab === "thread" ? threadDetailsSwitch() : tab === "view" ? `<span class="following">${ICON.lock(12)}${isPhone() ? "Read-only" : "Read-only: only the Agent can stop them"}</span>` : ""}</span>
        </div>`;
        const body =
          tab === "summary"
            ? `<div class="summary-tab"><span class="overline">Outcome</span><p>Still running: the outcome and the Handover note show here once Jim ends the Stage.</p></div>`
            : tab === "thread"
              ? `<div class="stage-thread"><div class="thread">${jimsThread({ stage: true })}</div>${workLine()}${composer({ placeholder: "Write to Jim… (lands at the next safe point)", to: false })}</div>`
              : view();
        const history = `<div class="window-backdrop">
          <div class="window" role="dialog" aria-modal="true" aria-labelledby="history-title">
            <div class="window-head"><h2 id="history-title">Stage history<span>Search across Threads</span></h2><button class="icon-button" aria-label="Close">${ICON.x(16)}</button></div>
            <div class="window-body"><div class="history">
              <div class="history-pipeline"><span class="rail-stage done">${ICON.check(11)} Plan</span><span class="rail-stage now picked">Implement</span><span class="rail-stage">Review</span><span class="rail-stage">Publish</span></div>
              <div class="history-body">
                <div class="history-runs"><button class="history-run" aria-current="true"><b>Run 2 · Running</b><span>Since 14:01 · 48k tokens</span></button><button class="history-run"><b>Run 1 · Failed</b><span>13:20–13:52 · tests failed</span></button></div>
                <div class="history-detail">${tabs}${body}</div>
              </div>
            </div></div>
            <div class="window-bar"><span class="grow"></span><button class="btn secondary">Close</button></div>
          </div>
        </div>`;
        return shell("Search across Threads", "Work ›", `<div class="task-page">${taskRecord()}</div>`, { overlay: history });
      }

      /* ---------- The bar, the note and the reference ---------- */
      function segments(name, options, current) {
        return `<div class="control"><span class="control-label">${name}</span><div class="segments">${options
          .map((o) => `<button data-${name.toLowerCase()}="${o.key}" aria-pressed="${o.key === current}">${o.label}</button>`)
          .join("")}</div></div>`;
      }
      function renderBar() {
        document.getElementById("bar").innerHTML = `
          <span class="bar-title">Sub-agents and processes</span><span class="bar-tag">PROPOSAL</span>
          ${segments("Place", PLACES, state.place)}
          ${segments("Width", WIDTHS, state.width)}
          ${segments("Palette", PALETTES, state.palette)}
          <span class="bar-break"></span>
          ${segments("Scenario", SCENARIOS, state.scenario)}`;
      }
      function renderNote() {
        const s = scenario();
        const where = {
          chat: "In Jim's chat in the chat drawer, the view opens in a large window.",
          task: "On the Task page, in Jim's tab of the conversation (a drawer on a narrow page), the view opens in a large window.",
          stage: "In the Stage history, already a window, the view is the run's third tab, beside Summary and Thread; the line in the Thread tab opens it.",
        }[state.place];
        const replay = s.late ? '<button class="btn sm secondary" data-action="replay">Replay the late open</button>' : "";
        document.getElementById("note").innerHTML = `<span><strong>${s.label}.</strong> ${s.note} ${where}</span>${replay}`;
      }

      function renderReference() {
        const look = (label, items) =>
          `<div class="look"><span>${label}</span>${items ? lineMarkup(items) : '<span class="look-none">No line: the session has had none.</span>'}</div>`;
        const R = (kind) => ({ kind, ending: undefined });
        const E = (kind, st) => ({ kind, ending: { state: st }, endedAt: 0 });
        document.getElementById("reference").innerHTML = `
          <div><h2>The line, in each of its forms</h2><div class="looks">
            ${look("One Sub-agent running", [R("sub-agent")])}
            ${look("One Process running (the API engine has Processes only)", [R("process")])}
            ${look("Both kinds running", [R("sub-agent"), R("sub-agent"), R("process")])}
            ${look("Running, with some ended", [R("sub-agent"), R("process"), E("sub-agent", "finished"), E("process", "finished"), E("process", "stopped")])}
            ${look("Running, with a failure among the ended", [R("process"), E("sub-agent", "finished"), E("process", "failed")])}
            ${look("Only ended ones left", [E("sub-agent", "finished"), E("sub-agent", "finished"), E("process", "stopped")])}
            ${look("Only ended, one failed", [E("sub-agent", "failed"), E("process", "finished")])}
            ${look("None yet")}
          </div></div>
          <div><h2>A page opened late catches up</h2>
            <ol>
              <li>The page subscribes to the Thread's events first and holds what arrives, say output chunks 41 to 44.</li>
              <li>It reads the output: the read answers up to chunk 42.</li>
              <li>It shows the read, then the held chunks after 42: 43 and 44. Chunks 41 and 42 are already in the read, so they are dropped: nothing shows twice.</li>
              <li>Live chunks follow in order. One that skips ahead (46 after 44), or a reconnect, reads again from 44 (<code>?after=44</code>): nothing is missed.</li>
            </ol>
            <p>The list works the same way: a start or an end that arrives while it is read makes the page read it again. The output and the messages stream only to a page with the view open.</p>
          </div>
          <div><h2>What the view settles</h2>
            <ul>
              <li><b>Order:</b> Running on top, then Ended, the one that ended last first. A press on the whole item picks it.</li>
              <li><b>States:</b> Running (green, live dot), Finished (check), Failed (red, with the exit code or the reason), Stopped (grey, by whom: the Agent, an interrupt, the session's end, a restart).</li>
              <li><b>A Sub-agent:</b> its kind, whether it runs in the background, its prompt's first lines with Read it in full, its messages and tool calls in Rows with Details, and what it reported back.</li>
              <li><b>A Process:</b> its description, the command whole and wrapping, its output following the end until scrolled up, how it ended, and the earlier output not kept past 256 KB.</li>
              <li><b>Read-only:</b> no Stop anywhere. Stopping one from here is later work.</li>
            </ul>
          </div>
          <div><h2>Widths</h2>
            <table><tr><th>Width</th><th>Line</th><th>View</th></tr>
              <tr><td>Wide</td><td>Show and a chevron</td><td>List beside the details</td></tr>
              <tr><td>900px</td><td>The same</td><td>List beside the details (window 846px); in the Stage history the run's tab stacks</td></tr>
              <tr><td>390px</td><td>A chevron alone; the words wrap</td><td>The list, then the details with ‹ All sub-agents and processes</td></tr>
            </table>
            <p>The view lays itself out by its own width (under 640px it stacks), so it reads the same in a window and in a tab. Nothing scrolls sideways: commands and output wrap.</p>
          </div>`;
      }
      function lineMarkup(items) {
        const words = lineWords(items);
        const mark = words.live ? '<span class="dot running"></span>' : ICON.subAgent(14);
        return `<span class="work-line" aria-hidden="true"><span class="work-line-mark">${mark}</span><span class="work-line-text">${words.html}</span><span class="work-line-open">Show${ICON.chevronRight(12)}</span></span>`;
      }

      /* ---------- Render ---------- */
      function renderFrame() {
        const frame = document.getElementById("frame");
        frame.className = `frame w-${state.width}`;
        const place = { chat: chatPlace, task: taskPlace, stage: stagePlace }[state.place]();
        const windowHtml = state.open && state.place !== "stage" ? viewWindow() : "";
        frame.innerHTML = place + windowHtml;
        afterRender();
      }
      function render() {
        document.documentElement.dataset.palette = state.palette;
        document.documentElement.dataset.theme = state.palette;
        renderBar();
        renderNote();
        renderFrame();
        renderReference();
      }
      function afterRender() {
        const output = document.getElementById("output");
        if (output && state.following) output.scrollTop = output.scrollHeight;
        if (output) output.addEventListener("scroll", onOutputScroll);
        const scroll = document.getElementById("sub-agent-scroll");
        const item = picked();
        if (scroll && item && stateOf(item) === "running") scroll.scrollTop = scroll.scrollHeight;
        document.querySelectorAll(".frame .thread").forEach((thread) => (thread.scrollTop = thread.scrollHeight));
      }
      const picked = () => state.items.find((i) => i.id === state.picked);
      function onOutputScroll(event) {
        const output = event.currentTarget;
        const atEnd = output.scrollTop + output.clientHeight >= output.scrollHeight - 8;
        if (atEnd !== state.following) {
          state.following = atEnd;
          const item = picked();
          const follow = document.getElementById("following");
          if (follow && item && stateOf(item) === "running") {
            follow.outerHTML = atEnd
              ? '<span class="following" id="following"><span class="dot running" style="width:6px;height:6px"></span>Following the end</span>'
              : `<button class="btn sm secondary" data-action="jump" id="following">${ICON.down(12)} Jump to the end</button>`;
          }
        }
      }

      /* ---------- Live: what streams while the page is open ---------- */
      let tick = 0;
      function stream() {
        tick += 1;
        const clockNow = clock(now());
        state.items.forEach((item) => {
          if (stateOf(item) !== "running") return;
          if (item.stream === "vite" && tick % 3 === 0) appendOutput(item, [`${clockNow}:${String(Math.floor(now()) % 60).padStart(2, "0")} ${VITE_MORE[(tick / 3) % VITE_MORE.length]}`]);
          if (item.stream === "tests") appendOutput(item, [testLine(4000 + tick)]);
          if (item.kind === "sub-agent" && item.coming.length > 0 && tick % 7 === (item.background ? 3 : 0)) appendEntry(item);
        });
        document.querySelectorAll("[data-ran]").forEach((el) => {
          const item = state.items.find((i) => i.id === el.dataset.ran);
          if (item && stateOf(item) === "running") el.textContent = duration(ranFor(item));
        });
      }
      function appendOutput(item, lines) {
        item.output.push(...lines);
        if (item.id !== state.picked || state.loadingOutput) return;
        const output = document.getElementById("output");
        if (!output) return;
        lines.forEach((line) => {
          const span = document.createElement("span");
          span.className = "arrived";
          span.textContent = `\n${line}`;
          output.appendChild(span);
        });
        if (state.following) output.scrollTop = output.scrollHeight;
      }
      function appendEntry(item) {
        const entry = { ...item.coming.shift(), fresh: true };
        item.entries.forEach((e) => delete e.fresh);
        item.entries.push(entry);
        if (entry.tools) item.toolCalls += entry.tools.length;
        if (item.id !== state.picked) return;
        const rows = document.getElementById("sub-agent-thread");
        const scroll = document.getElementById("sub-agent-scroll");
        if (!rows || !scroll) return;
        const atEnd = scroll.scrollTop + scroll.clientHeight >= scroll.scrollHeight - 24;
        rows.innerHTML = subAgentRows(item);
        const calls = scroll.querySelector("[data-calls]");
        if (calls) calls.textContent = plural(item.toolCalls, "tool call", "tool calls");
        if (atEnd) scroll.scrollTop = scroll.scrollHeight;
      }
      setInterval(stream, 1000);

      /* ---------- Events ---------- */
      document.addEventListener("click", (event) => {
        const target = event.target.closest("button, [data-action]");
        if (!target) return;
        const { dataset } = target;
        if (dataset.place) {
          state.place = dataset.place;
          applyScenario();
          return render();
        }
        if (dataset.width) {
          state.width = dataset.width;
          return render();
        }
        if (dataset.palette) {
          state.palette = dataset.palette;
          return render();
        }
        if (dataset.scenario) {
          state.scenario = dataset.scenario;
          applyScenario();
          return render();
        }
        if (dataset.pick) {
          state.picked = dataset.pick;
          state.pane = "details";
          state.promptOpen = false;
          state.following = true;
          return renderFrame();
        }
        if (dataset.tab) {
          state.stageTab = dataset.tab;
          state.open = dataset.tab === "view";
          return renderFrame();
        }
        switch (dataset.action) {
          case "open":
            state.open = true;
            state.pane = isPhone() ? "list" : "details";
            if (state.place === "stage") state.stageTab = "view";
            return renderFrame();
          case "close":
            state.open = false;
            return renderFrame();
          case "backdrop":
            // A press on the dimmed backdrop never closes a window (spec 4.1).
            return;
          case "back":
            state.pane = "list";
            return renderFrame();
          case "details":
            state.details = !state.details;
            return renderFrame();
          case "thread-details":
            state.threadDetails = !state.threadDetails;
            return renderFrame();
          case "prompt":
            state.promptOpen = true;
            return renderFrame();
          case "jump": {
            state.following = true;
            const output = document.getElementById("output");
            if (output) output.scrollTop = output.scrollHeight;
            return;
          }
          case "replay":
            applyScenario();
            return render();
        }
      });
      document.addEventListener("keydown", (event) => {
        if (event.key !== "Escape") return;
        if (state.open && state.place !== "stage") {
          state.open = false;
          renderFrame();
        }
      });

      applyScenario();
      render();
    </script>
  </body>
</html>
