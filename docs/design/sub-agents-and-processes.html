<!doctype html>
<html lang="en" data-palette="light" data-theme="light" data-density="comfortable">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sub-agents and processes · design proposal · The Office</title>
    <style>
      /* ---------- Tokens (design-system/tokens/, as docs/design/chat-drawer.html copied them on 2026-11-06) ---------- */
      :root {
        --ember-50: #fff2ed;
        --ember-100: #ffe0d4;
        --ember-300: #ff9370;
        --ember-400: #ff6638;
        --ember-500: #f23d0f;
        --ember-600: #cc2f07;
        --ember-700: #9e2406;
        --flare-300: #ffc266;
        --white: #ffffff;
        --gray-25: #fafaf9;
        --gray-50: #f4f4f2;
        --gray-100: #e9e9e6;
        --gray-150: #dededa;
        --gray-200: #d1d1cc;
        --gray-300: #b1b1ab;
        --gray-400: #8a8a84;
        --gray-500: #6b6b66;
        --gray-600: #50504c;
        --gray-700: #3a3a37;
        --gray-800: #262624;
        --gray-900: #181817;
        --gray-950: #0f0f0e;
        --green-50: #edf8f1;
        --green-100: #d5f0df;
        --green-500: #1e9e57;
        --green-700: #106a3b;
        --amber-50: #fff8e6;
        --amber-100: #ffedc2;
        --amber-500: #e5a00d;
        --amber-700: #865b05;
        --red-50: #fdeef0;
        --red-100: #fad9dd;
        --red-500: #c8102e;
        --red-700: #8e0b20;
        --blue-50: #eef3fd;
        --blue-100: #dae5fa;
        --blue-500: #2f6bdb;
        --blue-700: #1d4699;
        --teal-500: #14a38b;
        --violet-500: #7c5cd6;

        --bg: var(--gray-50);
        --surface: var(--white);
        --surface-raised: var(--white);
        --surface-sunken: var(--gray-50);
        --surface-hover: var(--gray-25);
        --surface-selected: var(--ember-50);
        --surface-inverse: var(--gray-900);
        --fg-1: var(--gray-950);
        --fg-2: var(--gray-600);
        --fg-3: var(--gray-500);
        --fg-inverse: var(--white);
        --border: var(--gray-150);
        --border-subtle: var(--gray-100);
        --border-strong: var(--gray-200);
        --border-focus: var(--ember-500);
        --accent: var(--ember-500);
        --accent-subtle: var(--ember-50);
        --accent-subtle-fg: var(--ember-700);
        --primary: var(--gray-900);
        --primary-hover: var(--gray-700);
        --primary-fg: var(--white);
        --control-hover: var(--gray-50);
        --control-press: var(--gray-100);
        --success: var(--green-500);
        --success-subtle: var(--green-50);
        --success-fg: var(--green-700);
        --success-border: var(--green-100);
        --warning-subtle: var(--amber-50);
        --warning-fg: var(--amber-700);
        --warning-border: var(--amber-100);
        --danger: var(--red-500);
        --danger-subtle: var(--red-50);
        --danger-fg: var(--red-700);
        --danger-border: var(--red-100);
        --info-subtle: var(--blue-50);
        --info-fg: var(--blue-700);
        --info-border: var(--blue-100);
        --neutral-subtle: var(--gray-50);
        --neutral-fg: var(--gray-600);
        --neutral-border: var(--gray-150);
        --focus-ring: 0 0 0 3px color-mix(in oklab, var(--ember-500) 30%, transparent);
        --overlay: color-mix(in oklab, var(--gray-950) 45%, transparent);

        --font-sans: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        --font-mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        --text-2xs: 11px;
        --text-xs: 12px;
        --text-sm: 13px;
        --text-md: 14px;
        --text-lg: 16px;
        --type-body: 400 var(--text-md) / 1.5 var(--font-sans);
        --type-body-sm: 400 var(--text-sm) / 1.45 var(--font-sans);
        --type-caption: 400 var(--text-xs) / 1.4 var(--font-sans);
        --type-card-title: 600 var(--text-md) / 1.4 var(--font-sans);
        --type-section-title: 600 var(--text-lg) / 1.3 var(--font-sans);
        --type-overline: 500 var(--text-2xs) / 1.2 var(--font-mono);
        --type-code: 400 var(--text-xs) / 1.55 var(--font-mono);
        --tracking-caps: 0.06em;
        --tracking-tight: -0.01em;

        --radius-sm: 4px;
        --radius-md: 6px;
        --radius-lg: 8px;
        --radius-xl: 12px;
        --radius-full: 999px;
        --radius-control: var(--radius-md);
        --radius-badge: var(--radius-sm);
        --control-sm: 28px;
        --control-md: 32px;

        --shadow-1: 0 1px 2px rgba(16, 16, 15, 0.05);
        --shadow-2: 0 4px 12px -2px rgba(16, 16, 15, 0.08), 0 1px 3px rgba(16, 16, 15, 0.05);
        --shadow-3: 0 16px 40px -8px rgba(16, 16, 15, 0.18), 0 2px 6px rgba(16, 16, 15, 0.06);
        --ease-out: cubic-bezier(0.2, 0.8, 0.2, 1);
        --duration-fast: 120ms;
        --duration-base: 200ms;
      }
      [data-theme="dark"] {
        --surface-selected: color-mix(in oklab, var(--ember-500) 12%, var(--gray-900));
        --accent-subtle: color-mix(in oklab, var(--ember-500) 16%, transparent);
        --accent-subtle-fg: var(--ember-300);
        --success-subtle: color-mix(in oklab, var(--green-500) 16%, transparent);
        --success-fg: #6fd69b;
        --success-border: color-mix(in oklab, var(--green-500) 30%, transparent);
        --warning-subtle: color-mix(in oklab, var(--amber-500) 16%, transparent);
        --warning-fg: var(--flare-300);
        --warning-border: color-mix(in oklab, var(--amber-500) 30%, transparent);
        --danger-subtle: color-mix(in oklab, var(--red-500) 20%, transparent);
        --danger-fg: #ff8a97;
        --danger-border: color-mix(in oklab, var(--red-500) 36%, transparent);
        --info-subtle: color-mix(in oklab, var(--blue-500) 18%, transparent);
        --info-fg: #93b5f5;
        --info-border: color-mix(in oklab, var(--blue-500) 34%, transparent);
        --overlay: color-mix(in oklab, #000 65%, transparent);
        --shadow-1: 0 0 0 1px rgba(255, 255, 255, 0.04);
        --shadow-2: 0 4px 12px -2px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.06);
        --shadow-3: 0 16px 40px -8px rgba(0, 0, 0, 0.65), 0 0 0 1px rgba(255, 255, 255, 0.08);
      }
      /* packages/ui/src/appearance/palettes/light.css */
      :root[data-palette="light"] {
        --fg-1: var(--gray-800);
        --fg-2: var(--gray-500);
        --fg-3: var(--gray-400);
        --border: var(--gray-100);
        --border-subtle: #efefec;
        --border-strong: var(--gray-150);
        --surface-hover: var(--gray-25);
        --neutral-subtle: var(--gray-50);
        --neutral-fg: var(--gray-500);
        --neutral-border: var(--gray-100);
      }
      /* packages/ui/src/appearance/palettes/dark.css */
      :root[data-palette="dark"] {
        --bg: #161615;
        --surface: #1d1d1b;
        --surface-raised: #242422;
        --surface-sunken: #131312;
        --surface-hover: #222220;
        --surface-selected: #2a2420;
        --surface-inverse: #e6e6e2;
        --fg-1: #d9d9d5;
        --fg-2: #9a9a94;
        --fg-3: #6f6f69;
        --fg-inverse: #161615;
        --border: #262624;
        --border-subtle: #222220;
        --border-strong: #33332f;
        --primary: #d9d9d5;
        --primary-fg: #161615;
        --primary-hover: #e6e6e2;
        --control-hover: #262624;
        --control-press: #2e2e2b;
        --neutral-subtle: #242422;
        --neutral-fg: #9a9a94;
        --neutral-border: #2e2e2b;
      }
      /* packages/ui/src/appearance/densities/comfortable.css */
      :root[data-density="comfortable"] {
        --pad-card: 16px 18px;
        --radius-card: 10px;
        --text-item: 14px;
        --text-body: 13px;
      }

      /* ---------- Base (design-system/tokens/base.css) ---------- */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      button,
      textarea {
        font: inherit;
        color: inherit;
      }
      @supports selector(::-webkit-scrollbar) {
        ::-webkit-scrollbar {
          width: 10px;
          height: 10px;
        }
        ::-webkit-scrollbar-track,
        ::-webkit-scrollbar-corner {
          background: transparent;
        }
        ::-webkit-scrollbar-thumb {
          border: 3px solid transparent;
          border-radius: var(--radius-full);
          background: var(--border-strong) padding-box;
        }
      }
      @supports not selector(::-webkit-scrollbar) {
        * {
          scrollbar-width: thin;
          scrollbar-color: var(--border-strong) transparent;
        }
      }
      :is(button, textarea, [tabindex]):focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 1px;
      }
      @keyframes live {
        0%,
        100% {
          box-shadow: 0 0 0 0 color-mix(in oklab, var(--success) 55%, transparent);
        }
        60% {
          box-shadow: 0 0 0 4px color-mix(in oklab, var(--success) 0%, transparent);
        }
      }
      @keyframes typing {
        0%,
        80%,
        100% {
          opacity: 0.25;
        }
        40% {
          opacity: 1;
        }
      }
      @keyframes shimmer {
        from {
          background-position: 100% 0;
        }
        to {
          background-position: -100% 0;
        }
      }
      @keyframes arrive {
        from {
          background: var(--success-subtle);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation: none !important;
          transition: none !important;
        }
      }

      /* ---------- packages/ui, re-drawn: badge, avatar, button, switch, tabs, skeleton ---------- */
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        height: 22px;
        padding: 0 8px;
        border: 1px solid var(--neutral-border);
        border-radius: var(--radius-badge);
        background: var(--neutral-subtle);
        color: var(--neutral-fg);
        font-size: var(--text-xs);
        font-weight: 500;
        white-space: nowrap;
      }
      .badge.success {
        border-color: var(--success-border);
        background: var(--success-subtle);
        color: var(--success-fg);
      }
      .badge.danger {
        border-color: var(--danger-border);
        background: var(--danger-subtle);
        color: var(--danger-fg);
      }
      .badge.info {
        border-color: var(--info-border);
        background: var(--info-subtle);
        color: var(--info-fg);
      }
      .badge.count {
        height: 18px;
        padding: 0 6px;
        font-size: var(--text-2xs);
      }
      .avatar {
        display: inline-grid;
        flex: none;
        place-items: center;
        width: 24px;
        height: 24px;
        overflow: hidden;
        border-radius: 50%;
        background: var(--avatar-bg, var(--gray-100));
        color: var(--avatar-fg, var(--gray-700));
        font-size: 9px;
        font-weight: 600;
        line-height: 1;
      }
      .avatar.sm {
        width: 20px;
        height: 20px;
        font-size: 8px;
      }
      .avatar.jim {
        --avatar-bg: color-mix(in oklab, var(--teal-500) 22%, var(--surface));
        --avatar-fg: color-mix(in oklab, var(--teal-500) 70%, var(--fg-1));
      }
      .avatar.angela {
        --avatar-bg: color-mix(in oklab, var(--violet-500) 22%, var(--surface));
        --avatar-fg: color-mix(in oklab, var(--violet-500) 70%, var(--fg-1));
      }
      .avatar.you {
        --avatar-bg: var(--neutral-subtle);
        --avatar-fg: var(--fg-2);
      }
      /* A Sub-agent's mark: no face, as it isn't a person. */
      .avatar.agent-mark {
        border-radius: var(--radius-md);
        background: var(--neutral-subtle);
        color: var(--fg-2);
        box-shadow: inset 0 0 0 1px var(--border);
      }
      .btn {
        display: inline-flex;
        flex: none;
        align-items: center;
        justify-content: center;
        gap: 6px;
        height: var(--control-md);
        padding: 0 12px;
        border: 1px solid transparent;
        border-radius: var(--radius-control);
        font: 500 var(--text-sm) / 1 var(--font-sans);
        white-space: nowrap;
        cursor: pointer;
        transition: background var(--duration-fast) var(--ease-out);
      }
      .btn.sm {
        height: var(--control-sm);
        padding: 0 10px;
        font-size: var(--text-xs);
      }
      .btn.secondary {
        border-color: var(--border-strong);
        background: var(--surface);
        color: var(--fg-1);
      }
      .btn.secondary:hover {
        background: var(--control-hover);
      }
      .btn.ghost {
        background: none;
        color: var(--fg-2);
      }
      .btn.ghost:hover {
        background: var(--control-hover);
        color: var(--fg-1);
      }
      .icon-button {
        display: inline-grid;
        flex: none;
        place-items: center;
        width: var(--control-sm);
        height: var(--control-sm);
        padding: 0;
        border: 0;
        border-radius: var(--radius-md);
        background: none;
        color: var(--fg-2);
        cursor: pointer;
      }
      .icon-button:hover {
        background: var(--control-hover);
        color: var(--fg-1);
      }
      .switch-label {
        display: flex;
        flex: none;
        align-items: center;
        gap: 8px;
        padding: 0;
        border: 0;
        background: none;
        font: var(--type-caption);
        color: var(--fg-2);
        cursor: pointer;
      }
      .switch {
        position: relative;
        width: 28px;
        height: 16px;
        border-radius: 8px;
        background: var(--border-strong);
      }
      .switch::after {
        content: "";
        position: absolute;
        top: 2px;
        left: 2px;
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: var(--white);
        transition: left var(--duration-base) var(--ease-out);
      }
      .switch-label[aria-checked="true"] .switch {
        background: var(--accent);
      }
      .switch-label[aria-checked="true"] .switch::after {
        left: 14px;
      }
      .tabs {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0 18px;
        min-width: 0;
        border-bottom: 1px solid var(--border);
      }
      .tab {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        margin-bottom: -1px;
        padding: 10px 0 9px;
        border: 0;
        border-bottom: 2px solid transparent;
        background: none;
        font: 500 var(--text-sm) / 1.3 var(--font-sans);
        color: var(--fg-2);
        cursor: pointer;
      }
      .tab:hover {
        color: var(--fg-1);
      }
      .tab[aria-selected="true"] {
        border-bottom-color: var(--accent);
        color: var(--fg-1);
      }
      .tabs .tabs-end {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-left: auto;
        padding: 6px 0;
      }
      .skeleton {
        display: block;
        height: 10px;
        border-radius: var(--radius-sm);
        background: linear-gradient(90deg, var(--border) 25%, var(--surface-hover) 50%, var(--border) 75%) 0 0 / 200% 100%;
        animation: shimmer 1.4s linear infinite;
      }
      .overline {
        font: var(--type-overline);
        letter-spacing: var(--tracking-caps);
        text-transform: uppercase;
        color: var(--fg-3);
      }
      .dot {
        display: inline-block;
        flex: none;
        width: 8px;
        height: 8px;
        border-radius: 50%;
      }
      .dot.running {
        background: var(--success);
        animation: live 1.4s ease-in-out infinite;
      }
      .dot.warm {
        width: 6px;
        height: 6px;
        background: var(--success);
      }
      .text-link {
        padding: 0;
        border: 0;
        background: none;
        color: var(--fg-1);
        font: inherit;
        font-weight: 500;
        text-decoration: underline;
        text-decoration-color: var(--border-strong);
        text-underline-offset: 2px;
        cursor: pointer;
      }
      .text-link:hover {
        text-decoration-color: currentColor;
      }

      /* ---------- The design page around the mock ---------- */
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg-1);
        font: var(--type-body);
      }
      .bar {
        position: sticky;
        top: 0;
        z-index: 10;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px 18px;
        padding: 10px 16px;
        background: #181817;
        color: #e6e6e2;
      }
      .bar-title {
        font-weight: 600;
      }
      .bar-tag {
        padding: 1px 6px;
        border-radius: 4px;
        background: var(--ember-500);
        color: #fff;
        font: var(--type-overline);
      }
      .control {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
      }
      .control-label {
        font: var(--type-overline);
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: #b1b1ab;
      }
      .segments {
        display: flex;
        flex-wrap: wrap;
        overflow: hidden;
        border: 1px solid #50504c;
        border-radius: 6px;
      }
      .segments button {
        padding: 4px 10px;
        border: 0;
        background: none;
        font: var(--type-caption);
        color: #d1d1cc;
        cursor: pointer;
      }
      .segments button + button {
        border-left: 1px solid #50504c;
      }
      .segments button[aria-pressed="true"] {
        background: #f4f4f2;
        color: #181817;
      }
      .bar-break {
        flex-basis: 100%;
        height: 0;
      }
      .stage {
        display: grid;
        gap: 14px;
        padding: 16px 24px 40px;
      }
      .scenario-note {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 6px 12px;
        max-width: 130ch;
        margin: 0;
        font: var(--type-body-sm);
        color: var(--fg-2);
      }
      .scenario-note strong {
        color: var(--fg-1);
      }
      .frame-row {
        display: flex;
        justify-content: center;
        overflow-x: auto;
      }
      .frame {
        position: relative;
        flex: none;
        height: max(640px, calc(100vh - 240px));
        overflow: hidden;
        border: 1px solid var(--border-strong);
        border-radius: 10px;
        background: var(--bg);
        box-shadow: var(--shadow-2);
      }
      .frame.w-wide {
        flex: 1 1 auto;
        width: 100%;
      }
      .frame.w-900 {
        width: 900px;
      }
      .frame.w-390 {
        width: 390px;
        height: max(640px, min(844px, calc(100vh - 240px)));
      }
      .reference {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(330px, 1fr));
        gap: 18px 28px;
        max-width: 1400px;
        font: var(--type-body-sm);
        color: var(--fg-2);
      }
      .reference h2 {
        margin: 0 0 8px;
        font: var(--type-card-title);
        color: var(--fg-1);
      }
      .reference p,
      .reference ol,
      .reference ul {
        margin: 0 0 8px;
      }
      .reference ol,
      .reference ul {
        padding-left: 18px;
      }
      .reference li + li {
        margin-top: 4px;
      }
      .reference code {
        font: 400 11.5px/1.5 var(--font-mono);
      }
      .reference table {
        width: 100%;
        border-collapse: collapse;
      }
      .reference th,
      .reference td {
        padding: 5px 8px 5px 0;
        border-bottom: 1px solid var(--border);
        text-align: left;
        vertical-align: top;
      }
      .reference th {
        font: var(--type-overline);
        letter-spacing: var(--tracking-caps);
        text-transform: uppercase;
        color: var(--fg-3);
      }
      .looks {
        display: grid;
        gap: 10px;
      }
      .look {
        display: grid;
        gap: 4px;
      }
      .look > span {
        font: var(--type-caption);
        color: var(--fg-3);
      }
      .look .work-line {
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        pointer-events: none;
      }
      .look-none {
        padding: 7px 12px;
        border: 1px dashed var(--border-strong);
        border-radius: var(--radius-md);
        font: var(--type-caption);
        color: var(--fg-3);
      }

      /* ---------- The app: Shell A3 · Desk ---------- */
      .app {
        position: absolute;
        inset: 0;
        display: grid;
        grid-template-columns: 56px minmax(0, 1fr);
        grid-template-rows: 56px 48px minmax(0, 1fr);
        color: var(--fg-1);
        font: var(--type-body);
      }
      .app.w-phone {
        grid-template-columns: minmax(0, 1fr);
      }
      .rail {
        grid-row: 1 / -1;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        padding: 12px 0;
        border-right: 1px solid var(--border);
        background: var(--surface);
      }
      .app.w-phone .rail {
        display: none;
      }
      .rail-mark {
        display: grid;
        place-items: center;
        width: 28px;
        height: 28px;
        margin-bottom: 12px;
        border-radius: 7px;
        background: var(--ember-500);
        color: var(--white);
        font: 700 12px/1 var(--font-sans);
      }
      .rail-item {
        position: relative;
        display: grid;
        place-items: center;
        width: 40px;
        height: 40px;
        border-radius: var(--radius-lg);
        color: var(--fg-2);
      }
      .rail-item.on {
        background: var(--surface-selected);
        color: var(--accent-subtle-fg);
      }
      .rail-item.on::before {
        content: "";
        position: absolute;
        left: -8px;
        width: 3px;
        height: 16px;
        border-radius: 0 2px 2px 0;
        background: var(--accent);
      }
      .top {
        display: flex;
        align-items: center;
        gap: 14px;
        min-width: 0;
        padding: 0 20px;
        border-bottom: 1px solid var(--border);
        background: var(--bg);
      }
      .app.w-phone .top {
        gap: 8px;
        padding: 0 12px;
      }
      .top h1 {
        min-width: 0;
        margin: 0;
        overflow: hidden;
        font: var(--type-section-title);
        letter-spacing: var(--tracking-tight);
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      .crumb {
        flex: none;
        font: var(--type-body-sm);
        color: var(--fg-3);
        white-space: nowrap;
      }
      .app.w-phone .crumb {
        display: none;
      }
      .grow {
        flex: 1;
        min-width: 0;
      }
      .chat-button {
        display: inline-flex;
        flex: none;
        align-items: center;
        gap: 6px;
        height: var(--control-md);
        padding: 0 10px;
        border: 1px solid var(--border-strong);
        border-radius: var(--radius-control);
        background: var(--surface);
        font: 500 var(--text-sm) / 1 var(--font-sans);
      }
      .chat-button.open {
        background: var(--control-press);
      }
      .strip {
        display: flex;
        align-items: center;
        gap: 24px;
        min-width: 0;
        padding: 0 20px;
        overflow: hidden;
        border-bottom: 1px solid var(--border);
        background: var(--surface);
        font: var(--type-body-sm);
        color: var(--fg-2);
        white-space: nowrap;
      }
      .app.w-phone .strip {
        gap: 14px;
        padding: 0 12px;
      }
      .strip b {
        font: 600 15px/1 var(--font-sans);
        color: var(--fg-1);
      }
      .main {
        position: relative;
        min-width: 0;
        min-height: 0;
        overflow: hidden;
      }
      .app.pushed .main {
        margin-right: 420px;
      }

      /* ---------- The pages behind ---------- */
      .page-scroll {
        position: absolute;
        inset: 0;
        overflow-x: hidden;
        overflow-y: auto;
      }
      .now-page {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 16px;
        padding: 20px;
      }
      .card {
        display: grid;
        align-content: start;
        gap: 10px;
        padding: var(--pad-card);
        border: 1px solid var(--border);
        border-radius: var(--radius-card);
        background: var(--surface);
        box-shadow: var(--shadow-1);
      }
      .card h3 {
        margin: 0;
        font: var(--type-card-title);
      }
      .ghost-line {
        display: block;
        height: 9px;
        border-radius: var(--radius-sm);
        background: var(--border);
      }
      .task-page {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 440px;
        height: 100%;
      }
      .record {
        display: grid;
        align-content: start;
        gap: 14px;
        min-width: 0;
        padding: 18px 22px;
        overflow-x: hidden;
        overflow-y: auto;
      }
      .record-head {
        display: grid;
        gap: 8px;
      }
      .record-head h2 {
        margin: 0;
        font: 600 20px/1.3 var(--font-sans);
        letter-spacing: var(--tracking-tight);
      }
      .record-facts {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px 10px;
        font: var(--type-caption);
        color: var(--fg-2);
      }
      .pipeline-rail {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .rail-stage {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 5px 10px;
        border: 1px solid var(--border);
        border-radius: var(--radius-full);
        background: var(--surface);
        font: 500 var(--text-xs) / 1.2 var(--font-sans);
        color: var(--fg-2);
      }
      .rail-stage.done {
        color: var(--success-fg);
      }
      .rail-stage.now {
        border-color: var(--success-border);
        background: var(--success-subtle);
        color: var(--success-fg);
      }
      .rail-stage.picked {
        box-shadow: inset 0 0 0 1px var(--accent);
        color: var(--fg-1);
      }
      .record-block p {
        max-width: 72ch;
        margin: 0;
        font: var(--type-body-sm);
        color: var(--fg-1);
      }
      .conversation {
        display: flex;
        flex-direction: column;
        min-width: 0;
        min-height: 0;
        border-left: 1px solid var(--border);
        background: var(--surface);
      }
      .conversation-tabs {
        padding: 0 16px;
      }
      .conversation-tabs .tab {
        font-size: var(--text-xs);
      }
      .conversation-row {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 16px;
        border-bottom: 1px solid var(--border);
        font: var(--type-caption);
        color: var(--fg-2);
      }
      .narrow-page .task-page {
        grid-template-columns: minmax(0, 1fr);
      }
      .narrow-page .conversation {
        position: absolute;
        top: 0;
        right: 0;
        bottom: 0;
        z-index: 40;
        width: min(440px, 100%);
        box-shadow: var(--shadow-3);
      }
      .scrim {
        position: absolute;
        inset: 0;
        z-index: 39;
        background: var(--overlay);
      }
      .drawer-handle {
        position: absolute;
        top: 14px;
        right: min(440px, 100%);
        z-index: 41;
        padding: 6px 10px;
        border: 1px solid var(--border);
        border-right: 0;
        border-radius: var(--radius-md) 0 0 var(--radius-md);
        background: var(--surface);
        font: 500 var(--text-xs) / 1.2 var(--font-sans);
        color: var(--fg-2);
      }
      .w-phone .drawer-handle {
        display: none;
      }

      /* ---------- The chat drawer (docs/design/chat-drawer.html, adopted) ---------- */
      .chat-drawer {
        position: absolute;
        top: 104px;
        right: 0;
        bottom: 0;
        z-index: 30;
        display: flex;
        flex-direction: column;
        width: 420px;
        min-width: 0;
        border-left: 1px solid var(--border);
        background: var(--surface);
      }
      .chat-drawer.over {
        box-shadow: var(--shadow-3);
      }
      .chat-drawer.fill {
        top: 0;
        left: 0;
        width: auto;
        border-left: 0;
      }
      .drawer-head {
        display: flex;
        flex: none;
        align-items: center;
        gap: 10px;
        min-width: 0;
        padding: 10px 10px 10px 16px;
        border-bottom: 1px solid var(--border);
      }
      .drawer-head-main {
        display: grid;
        flex: 1;
        gap: 1px;
        min-width: 0;
      }
      .drawer-title {
        font: var(--type-card-title);
      }
      .drawer-sub {
        font: var(--type-caption);
        color: var(--fg-2);
      }
      .thread-row {
        display: flex;
        flex: none;
        align-items: center;
        gap: 8px;
        min-width: 0;
        padding: 6px 12px 6px 8px;
        border-bottom: 1px solid var(--border);
      }
      .thread-row-title {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        font: 500 var(--text-sm) / 1.3 var(--font-sans);
        white-space: nowrap;
        text-overflow: ellipsis;
      }

      /* ---------- The Thread, in Rows (docs/design/thread-dialog.html, adopted by task 53) ---------- */
      .thread {
        flex: 1;
        min-height: 0;
        overflow-x: hidden;
        overflow-y: auto;
        overscroll-behavior: contain;
      }
      .thread-column {
        --gutter: 34px;
        display: flex;
        flex-direction: column;
        gap: 18px;
        padding: 16px 16px 20px;
      }
      .turn {
        display: grid;
        grid-template-columns: var(--gutter) minmax(0, 1fr);
        min-width: 0;
      }
      .turn-by {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 2px 6px;
        margin-bottom: 1px;
        font: var(--type-caption);
        color: var(--fg-2);
      }
      .turn-by b {
        font: 600 var(--text-sm) / 1.4 var(--font-sans);
        color: var(--fg-1);
      }
      .said {
        min-width: 0;
        max-width: 72ch;
        font: var(--type-body);
        line-height: 1.6;
        overflow-wrap: anywhere;
      }
      .said p {
        margin: 0 0 8px;
      }
      .said p:last-child {
        margin-bottom: 0;
      }
      .said code {
        padding: 1px 4px;
        border-radius: var(--radius-sm);
        background: var(--neutral-subtle);
        font: 400 12px/1.5 var(--font-mono);
      }
      .in-column {
        min-width: 0;
        margin-left: var(--gutter);
      }
      .turn + .tools {
        margin-top: -10px;
      }
      .tools {
        font: var(--type-caption);
        color: var(--fg-2);
      }
      .tools summary {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        max-width: 100%;
        padding: 2px 6px 2px 0;
        list-style: none;
        cursor: pointer;
      }
      .tools summary::-webkit-details-marker {
        display: none;
      }
      .tools-chevron {
        flex: none;
        transition: transform var(--duration-fast) var(--ease-out);
      }
      .tools[open] .tools-chevron {
        transform: rotate(90deg);
      }
      .tools-last {
        min-width: 0;
        overflow: hidden;
        font: 400 11px/1.5 var(--font-mono);
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      .tools ul {
        display: grid;
        gap: 3px;
        margin: 4px 0 2px 5px;
        padding: 0 0 0 12px;
        border-left: 1px solid var(--border-strong);
        list-style: none;
      }
      .tools li {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr);
        gap: 8px;
        min-width: 0;
      }
      .tools li b {
        font-weight: 500;
      }
      .tools li span {
        font: 400 11px/1.5 var(--font-mono);
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .tools li.arrived {
        animation: arrive 1.2s var(--ease-out);
      }
      .office-break {
        display: flex;
        align-items: center;
        gap: 10px;
        font: var(--type-caption);
        color: var(--fg-2);
      }
      .office-break::before,
      .office-break::after {
        content: "";
        flex: 1;
        height: 1px;
        background: var(--border);
      }
      .typing {
        display: inline-flex;
        gap: 3px;
        padding: 6px 0;
      }
      .typing i {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--fg-3);
        animation: typing 1.2s infinite;
      }
      .typing i:nth-child(2) {
        animation-delay: 0.15s;
      }
      .typing i:nth-child(3) {
        animation-delay: 0.3s;
      }
      .composer {
        flex: none;
        padding: 10px 12px 12px;
        border-top: 1px solid var(--border);
        background: var(--surface);
      }
      .composer-to {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 4px 6px;
        margin-bottom: 6px;
        font: var(--type-caption);
        color: var(--fg-2);
      }
      .composer-to strong {
        font-weight: 600;
        color: var(--fg-1);
      }
      .composer-row {
        display: flex;
        align-items: flex-end;
        gap: 8px;
      }
      .composer-field {
        flex: 1;
        min-width: 0;
        min-height: 44px;
        padding: 8px 10px;
        border: 1px solid var(--border-strong);
        border-radius: var(--radius-lg);
        background: var(--surface);
        color: var(--fg-1);
        font: var(--type-body-sm);
        resize: none;
      }
      .composer-field::placeholder {
        color: var(--fg-3);
      }
      .composer-send {
        display: grid;
        flex: none;
        place-items: center;
        width: 32px;
        height: 32px;
        border: 0;
        border-radius: var(--radius-md);
        background: var(--primary);
        color: var(--primary-fg);
        opacity: 0.4;
      }

      /* ---------- Proposed: the line above the message input ---------- */
      /* A composer note (conversation.css, .composer-note), neutral, as it tells and asks nothing. */
      .work-line {
        display: flex;
        flex: none;
        align-items: center;
        gap: 8px;
        width: 100%;
        min-width: 0;
        margin: 0;
        padding: 7px 16px;
        border: 0;
        border-top: 1px solid var(--border);
        background: var(--surface);
        font: var(--type-caption);
        color: var(--fg-2);
        text-align: left;
        cursor: pointer;
        transition: background var(--duration-fast) var(--ease-out);
      }
      .work-line:hover {
        background: var(--control-hover);
      }
      .chat-drawer .work-line,
      .stage-thread .work-line {
        padding: 7px 12px;
      }
      .work-line-mark {
        display: inline-grid;
        flex: none;
        place-items: center;
        width: 16px;
        color: var(--fg-3);
      }
      .work-line-text {
        flex: 1;
        min-width: 0;
        overflow-wrap: anywhere;
      }
      .work-line-text b {
        font-weight: 600;
        color: var(--fg-1);
      }
      .work-line .failed {
        font-weight: 500;
        color: var(--danger-fg);
      }
      .work-line-open {
        display: inline-flex;
        flex: none;
        align-items: center;
        gap: 4px;
        font-weight: 500;
        color: var(--fg-2);
      }
      .work-line:hover .work-line-open {
        color: var(--fg-1);
      }
      .work-line[aria-expanded="true"] {
        background: var(--control-press);
      }

      /* ---------- Windows (spec 4.1): pinned 7% from the top, a large one keeps one height ---------- */
      .window-backdrop {
        position: absolute;
        inset: 0;
        z-index: 200;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 0 12px;
        background: var(--overlay);
      }
      .window-backdrop::before {
        content: "";
        flex: none;
        height: max(24px, 7%);
      }
      .window {
        display: flex;
        flex-direction: column;
        width: min(1180px, 94%);
        height: 86%;
        min-height: 0;
        overflow: hidden;
        border-radius: var(--radius-xl);
        background: var(--surface-raised);
        box-shadow: var(--shadow-3);
      }
      .window-head {
        display: flex;
        flex: none;
        align-items: center;
        gap: 10px;
        min-width: 0;
        padding: 12px 12px 12px 20px;
        border-bottom: 1px solid var(--border);
      }
      .window-head h2 {
        display: flex;
        flex: 1;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 2px 10px;
        min-width: 0;
        margin: 0;
        font: var(--type-section-title);
      }
      .window-head h2 span {
        min-width: 0;
        font: var(--type-body-sm);
        color: var(--fg-2);
        overflow-wrap: anywhere;
      }
      .window-body {
        display: flex;
        flex: 1;
        flex-direction: column;
        min-height: 0;
      }
      .window-bar {
        display: flex;
        flex: none;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px 12px;
        padding: 10px 16px 10px 20px;
        border-top: 1px solid var(--border);
      }
      .window-bar .grow {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font: var(--type-caption);
        color: var(--fg-3);
      }

      /* ---------- The Stage history (docs/design/task-page-2.html, adopted by task 51) ---------- */
      .history {
        container-type: inline-size;
        display: flex;
        flex: 1;
        flex-direction: column;
        min-height: 0;
      }
      .history-pipeline {
        display: flex;
        flex: none;
        flex-wrap: wrap;
        gap: 6px;
        padding: 10px 20px;
        border-bottom: 1px solid var(--border);
        background: var(--surface-sunken);
      }
      .history-body {
        display: grid;
        flex: 1;
        grid-template-columns: 220px minmax(0, 1fr);
        grid-template-rows: minmax(0, 1fr);
        min-height: 0;
      }
      .history-runs {
        display: grid;
        align-content: start;
        gap: 2px;
        padding: 8px;
        overflow-y: auto;
        border-right: 1px solid var(--border);
      }
      .history-run {
        display: grid;
        gap: 2px;
        padding: 8px 10px;
        border: 0;
        border-radius: var(--radius-md);
        background: none;
        text-align: left;
        cursor: pointer;
      }
      .history-run b {
        font: 600 var(--text-sm) / 1.3 var(--font-sans);
      }
      .history-run span {
        font: var(--type-caption);
        color: var(--fg-2);
      }
      .history-run[aria-current="true"] {
        background: var(--surface-selected);
      }
      .history-detail {
        display: flex;
        flex-direction: column;
        min-width: 0;
        min-height: 0;
      }
      .history-detail > .tabs {
        flex: none;
        padding: 0 16px;
      }
      .stage-thread {
        display: flex;
        flex: 1;
        flex-direction: column;
        min-height: 0;
      }
      .summary-tab {
        display: grid;
        align-content: start;
        gap: 10px;
        padding: 18px 20px;
        overflow-y: auto;
      }
      .summary-tab p {
        max-width: 72ch;
        margin: 0;
        font: var(--type-body-sm);
      }
      @container (max-width: 640px) {
        .history-body {
          grid-template-columns: minmax(0, 1fr);
          grid-template-rows: auto minmax(0, 1fr);
        }
        .history-runs {
          display: flex;
          flex-wrap: wrap;
          gap: 4px;
          padding: 6px 12px;
          border-right: 0;
          border-bottom: 1px solid var(--border);
        }
        .history-run {
          padding: 5px 8px;
        }
        .history-pipeline {
          padding: 8px 12px;
        }
        .history-detail > .tabs {
          padding: 0 12px;
          gap: 0 14px;
        }
      }

      /* ---------- Proposed: the view of a session's Sub-agents and Processes ---------- */
      /* A list and details (spec 4.1's Layout), laid out by its own width, so it reads the same in a window and in a tab. */
      .view {
        container-type: inline-size;
        display: flex;
        flex: 1;
        flex-direction: column;
        min-width: 0;
        min-height: 0;
      }
      .view-body {
        display: grid;
        flex: 1;
        grid-template-columns: minmax(230px, 300px) minmax(0, 1fr);
        grid-template-rows: minmax(0, 1fr);
        min-height: 0;
      }
      .view-list {
        min-width: 0;
        padding: 4px 0 12px;
        overflow-x: hidden;
        overflow-y: auto;
        border-right: 1px solid var(--border);
      }
      .view-group {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 12px 16px 6px;
      }
      .view-item {
        position: relative;
        display: grid;
        grid-template-columns: 18px minmax(0, 1fr);
        gap: 2px 10px;
        width: 100%;
        padding: 8px 16px;
        border: 0;
        background: none;
        text-align: left;
        cursor: pointer;
      }
      .view-item:hover {
        background: var(--surface-hover);
      }
      .view-item[aria-current="true"] {
        background: var(--surface-selected);
      }
      .view-item[aria-current="true"]::before {
        content: "";
        position: absolute;
        top: 6px;
        bottom: 6px;
        left: 0;
        width: 3px;
        border-radius: 0 2px 2px 0;
        background: var(--accent);
      }
      .view-item-mark {
        padding-top: 2px;
        color: var(--fg-3);
      }
      .view-item-title {
        min-width: 0;
        font: 500 var(--text-sm) / 1.4 var(--font-sans);
        color: var(--fg-1);
        overflow-wrap: anywhere;
      }
      .view-item-title.command {
        font: 500 12px/1.5 var(--font-mono);
      }
      .view-item-meta {
        grid-column: 2;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 2px 6px;
        font: var(--type-caption);
        color: var(--fg-2);
      }
      .state {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font-weight: 500;
      }
      .state.running {
        color: var(--success-fg);
      }
      .state.finished {
        color: var(--fg-2);
      }
      .state.failed {
        color: var(--danger-fg);
      }
      .state.stopped {
        color: var(--fg-3);
      }
      .state .dot.running {
        width: 6px;
        height: 6px;
      }
      .view-back {
        display: none;
        flex: none;
        align-items: center;
        gap: 6px;
        width: 100%;
        padding: 9px 14px;
        border: 0;
        border-bottom: 1px solid var(--border);
        background: var(--surface);
        font: 500 var(--text-sm) / 1.3 var(--font-sans);
        color: var(--fg-2);
        text-align: left;
        cursor: pointer;
      }
      .view-back:hover {
        color: var(--fg-1);
      }
      .view-detail {
        display: flex;
        flex-direction: column;
        min-width: 0;
        min-height: 0;
      }
      .view-detail-scroll {
        display: flex;
        flex: 1;
        flex-direction: column;
        min-height: 0;
        overflow-x: hidden;
        overflow-y: auto;
      }
      .view-head {
        display: grid;
        flex: none;
        gap: 6px;
        padding: 16px 20px 12px;
      }
      .view-title {
        display: flex;
        align-items: flex-start;
        gap: 8px;
        margin: 0;
        font: var(--type-card-title);
        overflow-wrap: anywhere;
      }
      .view-title svg {
        flex: none;
