      :root {
        --ember-50: #fff2ed;
        --ember-100: #ffe0d4;
        --ember-300: #ff9370;
        --ember-400: #ff6638;
        --ember-500: #f23d0f;
        --ember-600: #cc2f07;
        --ember-700: #9e2406;
        --flare-300: #ffc266;
        --flare-500: #ff9a1f;
        --white: #ffffff;
        --gray-25: #fafaf9;
        --gray-50: #f4f4f2;
        --gray-100: #e9e9e6;
        --gray-150: #dededa;
        --gray-200: #d1d1cc;
        --gray-300: #b1b1ab;
        --gray-400: #8a8a84;
        --gray-500: #6b6b66;
        --gray-600: #50504c;
        --gray-700: #3a3a37;
        --gray-800: #262624;
        --gray-900: #181817;
        --gray-950: #0f0f0e;
        --green-50: #edf8f1;
        --green-100: #d5f0df;
        --green-500: #1e9e57;
        --green-600: #17834a;
        --green-700: #106a3b;
        --amber-50: #fff8e6;
        --amber-100: #ffedc2;
        --amber-500: #e5a00d;
        --amber-700: #865b05;
        --red-50: #fdeef0;
        --red-100: #fad9dd;
        --red-500: #c8102e;
        --red-600: #aa0d27;
        --red-700: #8e0b20;
        --blue-50: #eef3fd;
        --blue-100: #dae5fa;
        --blue-500: #2f6bdb;
        --blue-700: #1d4699;
        --teal-500: #14a38b;
        --violet-500: #7c5cd6;

        --bg: var(--gray-50);
        --surface: var(--white);
        --surface-raised: var(--white);
        --surface-sunken: var(--gray-50);
        --surface-hover: var(--gray-25);
        --surface-selected: var(--ember-50);
        --surface-inverse: var(--gray-900);
        --fg-1: var(--gray-950);
        --fg-2: var(--gray-600);
        --fg-3: var(--gray-500);
        --fg-disabled: var(--gray-400);
        --fg-inverse: var(--white);
        --fg-on-accent: var(--white);
        --border: var(--gray-150);
        --border-subtle: var(--gray-100);
        --border-strong: var(--gray-200);
        --border-focus: var(--ember-500);
        --accent: var(--ember-500);
        --accent-hover: var(--ember-600);
        --accent-subtle: var(--ember-50);
        --accent-subtle-fg: var(--ember-700);
        --primary: var(--gray-900);
        --primary-hover: var(--gray-700);
        --primary-fg: var(--white);
        --control-hover: var(--gray-50);
        --control-press: var(--gray-100);
        --success: var(--green-500);
        --success-subtle: var(--green-50);
        --success-fg: var(--green-700);
        --success-border: var(--green-100);
        --warning: var(--amber-500);
        --warning-subtle: var(--amber-50);
        --warning-fg: var(--amber-700);
        --warning-border: var(--amber-100);
        --danger: var(--red-500);
        --danger-subtle: var(--red-50);
        --danger-fg: var(--red-700);
        --danger-border: var(--red-100);
        --info: var(--blue-500);
        --info-subtle: var(--blue-50);
        --info-fg: var(--blue-700);
        --info-border: var(--blue-100);
        --neutral-subtle: var(--gray-50);
        --neutral-fg: var(--gray-600);
        --neutral-border: var(--gray-150);
        --text-link: var(--fg-1);
        --text-link-hover: var(--accent-hover);
        --focus-ring: 0 0 0 3px color-mix(in oklab, var(--ember-500) 30%, transparent);
        --overlay: color-mix(in oklab, var(--gray-950) 45%, transparent);

        --font-sans: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        --font-mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        --text-2xs: 11px;
        --text-xs: 12px;
        --text-sm: 13px;
        --text-md: 14px;
        --text-lg: 16px;
        --text-xl: 18px;
        --text-2xl: 20px;
        --type-body: 400 var(--text-md) / 1.5 var(--font-sans);
        --type-overline: 500 var(--text-2xs) / 1.2 var(--font-mono);
        --tracking-caps: 0.06em;

        --radius-sm: 4px;
        --radius-md: 6px;
        --radius-lg: 8px;
        --radius-xl: 12px;
        --radius-full: 999px;
        --radius-control: var(--radius-md);
        --radius-badge: var(--radius-sm);
        --control-xs: 24px;
        --type-card-title: 600 var(--text-md) / 1.4 var(--font-sans);
        --type-body-sm: 400 var(--text-sm) / 1.45 var(--font-sans);
        --type-caption: 400 var(--text-xs) / 1.4 var(--font-sans);
        --type-mono: 400 var(--text-sm) / 1.5 var(--font-mono);
        --control-sm: 28px;
        --control-md: 32px;

        --shadow-1: 0 1px 2px rgba(16, 16, 15, 0.05);
        --shadow-2: 0 4px 12px -2px rgba(16, 16, 15, 0.08), 0 1px 3px rgba(16, 16, 15, 0.05);
        --shadow-3: 0 16px 40px -8px rgba(16, 16, 15, 0.18), 0 2px 6px rgba(16, 16, 15, 0.06);
        --ease-out: cubic-bezier(0.2, 0.8, 0.2, 1);
        --duration-fast: 120ms;
        --duration-base: 200ms;
        --duration-slow: 280ms;
      }
      [data-theme="dark"] {
        --surface-selected: color-mix(in oklab, var(--ember-500) 12%, var(--gray-900));
        --fg-disabled: var(--gray-600);
        --accent-hover: var(--ember-400);
        --accent-subtle: color-mix(in oklab, var(--ember-500) 16%, transparent);
        --accent-subtle-fg: var(--ember-300);
        --success-subtle: color-mix(in oklab, var(--green-500) 16%, transparent);
        --success-fg: #6fd69b;
        --success-border: color-mix(in oklab, var(--green-500) 30%, transparent);
        --warning-subtle: color-mix(in oklab, var(--amber-500) 16%, transparent);
        --warning-fg: var(--flare-300);
        --warning-border: color-mix(in oklab, var(--amber-500) 30%, transparent);
        --danger-subtle: color-mix(in oklab, var(--red-500) 20%, transparent);
        --danger-fg: #ff8a97;
        --danger-border: color-mix(in oklab, var(--red-500) 36%, transparent);
        --info-subtle: color-mix(in oklab, var(--blue-500) 18%, transparent);
        --info-fg: #93b5f5;
        --info-border: color-mix(in oklab, var(--blue-500) 34%, transparent);
        --overlay: color-mix(in oklab, #000 65%, transparent);
        --shadow-1: 0 0 0 1px rgba(255, 255, 255, 0.04);
        --shadow-2: 0 4px 12px -2px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.06);
        --shadow-3: 0 16px 40px -8px rgba(0, 0, 0, 0.65), 0 0 0 1px rgba(255, 255, 255, 0.08);
      }

        --control-press: #2e2e2b;
        --neutral-subtle: #242422;
        --neutral-fg: #9a9a94;
        --neutral-border: #2e2e2b;
      }
      /* packages/ui/src/appearance/densities/comfortable.css */
      :root[data-density="comfortable"] {
        --pad-card: 16px 18px;
        --gap-card: 12px;
        --pad-row: 14px 18px;
        --pad-page: 24px;
        --gap-panel: 20px;
        --radius-card: 10px;
        --text-item: 14px;
        --text-body: 13px;
        --control-h: 28px;
        --line: 1.5;
      }

      /* ---------- Base (design-system/tokens/base.css) ---------- */

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 22px;
        padding: 0 8px;
        border-radius: var(--radius-badge);
        font-size: var(--text-xs);
        font-weight: 500;
        border: 1px solid var(--neutral-border);
        background: var(--neutral-subtle);
        color: var(--neutral-fg);
        white-space: nowrap;
      }
      .badge.success {
        background: var(--success-subtle);
        color: var(--success-fg);
        border-color: var(--success-border);
      }
      .badge.warning {
        background: var(--warning-subtle);
        color: var(--warning-fg);
        border-color: var(--warning-border);
      }
      .badge.danger {
        background: var(--danger-subtle);
        color: var(--danger-fg);
        border-color: var(--danger-border);
      }
      .badge.info {
        background: var(--info-subtle);
        color: var(--info-fg);
        border-color: var(--info-border);
      }
      .badge.accent {
        background: var(--accent-subtle);
        color: var(--accent-subtle-fg);
        border-color: transparent;
      }
      .avatar {
        width: 24px;
        height: 24px;
        border-radius: 50%;
        flex: none;
        display: inline-grid;
        place-items: center;
        overflow: hidden;
        font-size: 9px;
        font-weight: 600;
        line-height: 1;
        color: var(--avatar-fg, var(--gray-700));
        background: var(--avatar-bg, var(--gray-100));
      }
      .avatar.lg {
        width: 32px;
        height: 32px;
        font-size: 12px;
      }
      .avatar.sm {
        width: 20px;
        height: 20px;
        font-size: 8px;
      }
      .avatar.command {
        border-radius: var(--radius-sm);
        background: var(--neutral-subtle);
        color: var(--fg-2);
        font-family: var(--font-mono);
      }
      /* A person's name and avatar lead to their page; You and The Office aren't people, so they stay plain. */
      @supports selector(::-webkit-scrollbar) {
        ::-webkit-scrollbar {
          width: 10px;
          height: 10px;
        }
        ::-webkit-scrollbar-track,
        ::-webkit-scrollbar-corner {
          background: transparent;
        }
        ::-webkit-scrollbar-thumb {
          border: 3px solid transparent;
          border-radius: var(--radius-full);
          background: var(--border-strong) padding-box;
        }
        ::-webkit-scrollbar-thumb:hover {
          background: var(--fg-3) padding-box;
        }
      }
      @supports not selector(::-webkit-scrollbar) {
        * {
          scrollbar-width: thin;
          scrollbar-color: var(--border-strong) transparent;
        }
      }

      /* ---------- The page around the Thread ---------- */
      html,
      body {
        height: 100%;
      }
      body {
        display: flex;
        flex-direction: column;
        margin: 0;
        background: var(--bg);
        color: var(--fg-1);
        font: var(--type-body);
      }
      button {
        font: inherit;
        color: inherit;
      }
      .bar {
        display: flex;
        flex: none;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px 18px;
        padding: 10px 16px;
        background: #181817;
        color: #e6e6e2;
      }
      .bar-title {
        font-weight: 600;
      }
      .bar-tag {
        padding: 1px 6px;
        border-radius: 4px;
        background: var(--ember-500);
        color: #fff;
        font: var(--type-overline);
      }
      .control {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .control-label {
        font: var(--type-overline);
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: #b1b1ab;
      }
      .segments {
        display: flex;
        flex-wrap: wrap;
        overflow: hidden;
        border: 1px solid #50504c;
        border-radius: 6px;
      }
      .segments button {
        padding: 4px 10px;
        border: 0;
        background: none;
        font: var(--type-caption);
        color: #d1d1cc;
        cursor: pointer;
      }
      .segments button + button {
        border-left: 1px solid #50504c;
      }
      .segments button[aria-pressed="true"] {
        background: #f4f4f2;
        color: #181817;
      }
      .segments button:focus-visible,
      .switch-label:focus-visible,
      .tools summary:focus-visible,
      .office-brief summary:focus-visible,
      .text-button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 1px;
      }
      .stage {
        display: flex;
        flex: 1;
        justify-content: center;
        gap: 24px;
        min-height: 0;
        padding: 20px 24px;
      }
      .notes {
        flex: 0 1 300px;
        min-width: 220px;
        overflow: auto;
        font: var(--type-body-sm);
        color: var(--fg-2);
      }
      .notes h1 {
        margin: 0 0 6px;
        font: var(--type-card-title);
        font-size: 16px;
        color: var(--fg-1);
      }
      .notes h2 {
        margin: 18px 0 6px;
        font: var(--type-overline);
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--fg-2);
      }
      .notes p {
        margin: 0;
      }
      .notes ul {
        margin: 0;
        padding-left: 16px;
      }
      .notes li + li {
        margin-top: 4px;
      }
      .recommended {
        display: inline-block;
        margin-bottom: 8px;
      }
      @media (max-width: 1000px) {
        html,
        body {
          height: auto;
        }
        .stage {
          flex-direction: column;
          padding: 16px;
        }
        .notes {
          flex: none;
        }
        .pane {
          order: -1;
          flex: none;
          height: 80vh;
        }
      }

      /* ---------- The conversation's frame, as on the Task page ---------- */
      .pane {
        display: flex;
        flex: 0 1 auto;
        flex-direction: column;
        width: var(--pane-width);
        max-width: 100%;
        min-width: 0;
        overflow: hidden;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: var(--surface);
      }
      .pane-tabs {
        display: flex;
        flex: none;
        gap: 16px;
        padding: 0 16px;
        border-bottom: 1px solid var(--border);
      }
      .pane-tab {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 10px 0 9px;
        border-bottom: 2px solid transparent;
        font: var(--type-body-sm);
        color: var(--fg-2);
      }
      .pane-tab.on {
        border-bottom-color: var(--fg-1);
        font-weight: 500;
        color: var(--fg-1);
      }
      .pane-head {
        display: flex;
        flex: none;
        align-items: center;
        gap: 12px;
        padding: 10px 16px;
        border-bottom: 1px solid var(--border);
      }
      .pane-title {
        flex: 1;
        min-width: 0;
      }
      .pane-title strong {
        display: block;
        font-weight: 600;
      }
      .pane-title span {
        font: var(--type-caption);
        color: var(--fg-2);
      }
      .switch-label {
        display: flex;
        flex: none;
        align-items: center;
        gap: 8px;
        padding: 0;
        border: 0;
        background: none;
        font: var(--type-caption);
        color: var(--fg-2);
        cursor: pointer;
      }
      .switch {
        position: relative;
        width: 28px;
        height: 16px;
        border-radius: 8px;
        background: var(--border-strong);
      }
      .switch::after {
        content: "";
        position: absolute;
        top: 2px;
        left: 2px;
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: #fff;
        transition: left var(--duration-base) var(--ease-out);
      }
      .switch-label[aria-checked="true"] .switch {
        background: var(--accent);
      }
      .switch-label[aria-checked="true"] .switch::after {
        left: 14px;
      }
      .composer {
        flex: none;
        padding: 10px 16px 12px;
        border-top: 1px solid var(--border);
      }
      .composer-to {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 6px;
        font: var(--type-caption);
        color: var(--fg-2);
      }
      .composer-to strong {
        font-weight: 600;
        color: var(--fg-1);
      }
      .composer-row {
        display: flex;
        align-items: flex-end;
        gap: 8px;
      }
      .composer-field {
        flex: 1;
        min-width: 0;
        min-height: 44px;
        padding: 8px 10px;
        border: 1px solid var(--border-strong);
        border-radius: 8px;
        font: var(--type-body-sm);
        color: var(--fg-2);
      }
      .composer-send {
        display: grid;
        flex: none;
        place-items: center;
        width: 32px;
        height: 32px;
        border-radius: 6px;
        background: var(--primary);
        color: var(--primary-fg);
      }

      /* ---------- The Thread: what every design below shares ---------- */
      .thread {
        flex: 1;
        min-height: 0;
        overflow: auto;
        overscroll-behavior: contain;
      }
      .thread-column {
        display: flex;
        flex-direction: column;
      }
      .turn {
        min-width: 0;
        color: var(--fg-1);
      }
      .turn-by {
        display: flex;
        align-items: center;
        gap: 6px;
        min-width: 0;
        font: var(--type-caption);
        color: var(--fg-2);
      }
      .turn-author {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        min-width: 0;
      }
      .turn-author svg {
        flex: none;
      }
      .said {
        min-width: 0;
        overflow-wrap: anywhere;
      }
      /* The app's MarkdownText, with the room a chat's text needs. */
      .md > :first-child {
        margin-top: 0;
      }
      .md > :last-child {
        margin-bottom: 0;
      }
      .md p,
      .md ul,
      .md ol,
      .md pre {
        margin: 0 0 0.6em;
      }
      .md ul,
      .md ol {
        padding-left: 1.3em;
      }
      .md li + li {
        margin-top: 0.2em;
      }
      .md h4 {
        margin: 1em 0 0.3em;
        font-size: inherit;
        font-weight: 600;
      }
      .md code {
        padding: 1px 4px;
        border-radius: 4px;
        background: var(--code-background);
        font-family: var(--font-mono);
        font-size: 0.88em;
      }
      .md pre {
        padding: 8px 10px;
        overflow-x: auto;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--surface-sunken);
        font-size: 12px;
        line-height: 1.5;
      }
      .md pre code {
        padding: 0;
        background: none;
        font-size: inherit;
      }
      .delivery {
        display: flex;
        align-items: center;
        gap: 4px;
        font: var(--type-caption);
        color: var(--fg-2);
      }
      .delivery.not-delivered {
        color: var(--danger-fg);
      }
      .delivery-time {
        display: none;
      }

      /* The cards the user likes stay as they are in the app: conversation.css. */
      .message {
        min-width: 0;
        padding: 10px 12px;
        border-radius: 10px;
        font: var(--type-body-sm);
        line-height: 1.55;
        color: var(--fg-1);
      }
      .message.handover-note {
        border: 1px solid var(--info-border);
        background: var(--info-subtle);
      }
      .message.decision-card {
        border: 1px solid var(--warning-border);
        background: var(--warning-subtle);
      }
      .message-by {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 4px;
        font: var(--type-caption);
        font-weight: 500;
        color: var(--fg-2);
      }
      .handover-start {
        display: -webkit-box;
        overflow: hidden;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 4;
      }
      .handover-start h4 {
        margin: 0;
      }
      .decision-question {
        font-weight: 500;
      }
      .decision-hint {
        margin: 6px 0 0;
        font: var(--type-caption);
        color: var(--fg-2);
      }
      .decision-answered {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-top: 8px;
        font: var(--type-caption);
        color: var(--success-fg);
      }
      .decision-answered svg {
        flex: none;
        width: 12px;
        height: 12px;
      }
      .text-button {
        padding: 0;
        border: 0;
        background: none;
        font: var(--type-caption);
        color: inherit;
        text-decoration: underline;
        text-underline-offset: 2px;
        cursor: pointer;
      }
      .plain-card {
        padding: 0;
        overflow: hidden;
        border: 1px solid var(--border);
        background: var(--surface);
      }
      .plain-card-head {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 12px;
      }
      .plain-card-head > svg {
        flex: none;
        color: var(--fg-2);
      }
      .plain-card-text {
        flex: 1;
        min-width: 0;
      }
      .plain-card-title {
        display: block;
        font-weight: 600;
      }
      .plain-card-sub {
        display: block;
        font: var(--type-caption);
        color: var(--fg-2);
      }
      .plain-card-note {
        padding: 8px 12px 10px;
        border-top: 1px solid var(--border-subtle);
      }
      .plain-card-label {
        margin-bottom: 4px;
        font: var(--type-overline);
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--fg-2);
      }
      .plain-card-button {
        flex: none;
        padding: 3px 10px;
        border: 1px solid var(--border-strong);
        border-radius: 6px;
        font: var(--type-caption);
      }

      /* ---------- Today: the app as it is, for comparing ---------- */
      [data-design="today"] .thread {
        background: var(--surface-sunken);
      }
      [data-design="today"] .thread-column {
        gap: 10px;
        padding: 14px 16px;
      }
      [data-design="today"] .turn {
        font: var(--type-body-sm);
        line-height: 1.55;
      }
      [data-design="today"] .turn-avatar {
        display: none;
      }
      [data-design="today"] .turn-by {
        margin-bottom: 2px;
        color: var(--fg-3);
      }
      [data-design="today"] .turn-author {
        font-weight: 600;
        color: var(--fg-1);
      }
      [data-design="today"] .turn.mine {
        padding: 6px 10px;
        border-radius: 8px;
        background: var(--surface-sunken);
      }
      [data-design="today"] .turn-messages {
        display: grid;
        gap: 6px;
      }
      [data-design="today"] .delivery {
        margin-top: 4px;
        color: var(--fg-3);
      }
      [data-design="today"] .delivery.not-delivered {
        color: var(--danger-fg);
      }
      .today-tools {
        display: grid;
        gap: 2px;
        min-width: 0;
      }
      .today-line {
        display: flex;
        align-items: baseline;
        gap: 6px;
        min-width: 0;
        font: var(--type-caption);
        color: var(--fg-3);
      }
      .today-line svg {
        flex: none;
        align-self: center;
      }
      .today-line .tool-name {
        flex: none;
        font-weight: 500;
        color: var(--fg-2);
      }
      .today-line .tool-summary {
        min-width: 0;
        overflow: hidden;
        font: var(--type-mono);
        font-size: 11px;
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      .today-line.refused,
      .today-line.refused .tool-name {
        color: var(--warning-fg);
      }
      .today-line.failed {
        color: var(--danger-fg);
      }
      .today-line.failed .tool-summary,
      .today-line.held .tool-summary {
        font: var(--type-caption);
        white-space: normal;
      }
      .today-line.held {
        color: var(--fg-2);
      }
      .today-office {
        padding: 6px 10px;
        border: 1px dashed var(--border);
        border-radius: 8px;
        font: var(--type-caption);
        color: var(--fg-2);
        text-align: center;
      }
      .today-log {
        margin: 0;
        font: var(--type-caption);
        color: var(--fg-3);
      }

      /* ---------- Chat, Bubbles and Rows share their rhythm and quiet lines ---------- */
      .pane:not([data-design="today"]) {
        --code-background: var(--neutral-subtle);
        --bubble-mine: var(--neutral-subtle);
      }
      .pane:not([data-design="today"]) .thread-column {
        gap: 18px;
        width: 100%;
        max-width: 760px;
        margin: 0 auto;
        padding: 20px 20px 24px;
      }
      .pane:not([data-design="today"]) .said {
        font: var(--type-body);
        line-height: 1.6;
      }
      .pane:not([data-design="today"]) .turn-author {
        font: var(--type-body-sm);
        font-weight: 600;
        color: var(--fg-1);
      }
      .pane:not([data-design="today"]) .labelled .turn-author {
        font: var(--type-caption);
        font-weight: 500;
        color: var(--fg-2);
      }
      .turn-messages {
        min-width: 0;
      }
      .in-column {
        min-width: 0;
        margin-left: var(--gutter, 0);
      }
      /* A tool line belongs to the turn before it, so it sits nearer than the next turn does. */
      .turn + .tools {
        margin-top: -10px;
      }
      .tools {
        font: var(--type-caption);
        color: var(--fg-2);
      }
      .tools summary {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        max-width: 100%;
        padding: 2px 6px 2px 0;
        border-radius: 4px;
        list-style: none;
        cursor: pointer;
      }
      .tools summary::-webkit-details-marker {
        display: none;
      }
      .tools summary:hover {
        color: var(--fg-1);
      }
      .tools summary > svg {
        flex: none;
      }
      .tools-chevron {
        transition: transform var(--duration-fast) var(--ease-out);
      }
      .tools[open] .tools-chevron {
        transform: rotate(90deg);
      }
      .tools-count {
        flex: none;
      }
      .tools-last {
        min-width: 0;
        overflow: hidden;
        font-family: var(--font-mono);
        font-size: 11px;
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      .tools ul {
        display: grid;
        gap: 3px;
        margin: 4px 0 2px 5px;
        padding: 0 0 0 12px;
        border-left: 1px solid var(--border-strong);
        list-style: none;
      }
      .tools li {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr);
        gap: 8px;
        min-width: 0;
      }
      .tools li b {
        font-weight: 500;
      }
      /* The whole command, at any width: it wraps, and only a very long one scrolls in its place. */
      .tools li span {
        max-height: 320px;
        overflow: auto;
        font-family: var(--font-mono);
        font-size: 11px;
        line-height: 1.5;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      /* The Office's own lines, never a box or a person's turn. A day or a run marks a break on a
         hairline; the rest are small notes, so a few in a row don't stripe the Thread. */
      .office-line,
      .office-break {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 6px;
        font: var(--type-caption);
        color: var(--fg-2);
        text-align: center;
      }
      .office-line svg {
        flex: none;
      }
      .office-line + .office-line {
        margin-top: -10px;
      }
      .office-break {
        gap: 10px;
      }
      .office-break::before,
      .office-break::after {
        content: "";
        flex: 1 1 16px;
        height: 1px;
        background: var(--border);
      }
      .office-words {
        min-width: 0;
      }
      .office-brief summary {
        list-style: none;
        cursor: pointer;
      }
      .office-brief summary::-webkit-details-marker {
        display: none;
      }
      .office-brief[open] .tools-chevron {
        transform: rotate(180deg);
      }
      .office-brief-text {
        max-height: 240px;
        margin-top: 8px;
        padding: 10px 12px;
        overflow: auto;
        border: 1px solid var(--border);
        border-radius: 8px;
        font: var(--type-body-sm);
        color: var(--fg-1);
      }
      .notice {
        display: flex;
        gap: 6px;
        font: var(--type-caption);
      }
      .notice svg {
        flex: none;
        margin-top: 2px;
      }
      .notice b {
        font-weight: 500;
      }
      .notice.refused {
        color: var(--warning-fg);
      }
      .notice.failed {
        padding: 8px 10px;
        border: 1px solid var(--danger-border);
        border-radius: 8px;
        background: var(--danger-subtle);
        color: var(--danger-fg);
      }
      .working {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
        font: var(--type-caption);
        color: var(--fg-2);
      }
      .working-words {
        flex: none;
      }
      .working-dots {
        display: inline-flex;
        flex: none;
        gap: 4px;
      }
      .working-dots i {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: var(--fg-2);
        animation: working-blink 1.2s infinite;
      }
      .working-dots i:nth-child(2) {
        animation-delay: 0.15s;
      }
      .working-dots i:nth-child(3) {
        animation-delay: 0.3s;
      }
      .working {

        let hash = 0;
        for (const character of name) hash = (hash * 31 + character.charCodeAt(0)) >>> 0;

      }

      const inline = (text) =>

      /** Just enough Markdown for the mock's messages: headings, lists, fences and paragraphs. */
      function markdown(text) {
        const lines = text.trim().split("\n");
        const blocks = [];
        while (lines.length > 0) {
          const line = lines.shift();
          if (line === "") continue;
          if (line.startsWith("```")) {
            const end = lines.findIndex((l) => l.startsWith("```"));
            blocks.push(`<pre><code>${esc(lines.splice(0, end).join("\n"))}</code></pre>`);
            lines.shift();
          } else if (line.startsWith("## ")) {
            blocks.push(`<h4>${inline(line.slice(3))}</h4>`);
          } else if (line.startsWith("- ")) {
            const items = [line];
            while (lines[0]?.startsWith("- ")) items.push(lines.shift());
            blocks.push(
              `<ul>${items.map((item) => `<li>${inline(item.slice(2))}</li>`).join("")}</ul>`,
            );
          } else {
            blocks.push(`<p>${inline(line)}</p>`);
          }
        }
        return blocks.join("");

            tool("08:52", "Bash", "npm run verify"),
            card(
              `<div class="message plain-card in-column"><div class="plain-card-head">${avatar("Jim")}<div class="plain-card-text"><span class="plain-card-title">Jim</span><span class="plain-card-sub">Developer · idle · Export the usage report as CSV</span></div><span class="plain-card-button">Open chat</span></div><div class="plain-card-note"><div class="plain-card-label">Handover note</div>The toolbar's button order is settled; the tests follow the Plan.</div></div>`,
            ),
            card(
              `<div class="message plain-card in-column"><div class="plain-card-head">${ICON.idea}<div class="plain-card-text"><span class="plain-card-title">Export the invoices as CSV too</span><span class="plain-card-sub">Idea · Ledger</span></div></div></div>`,
            ),
            card(
              `<div class="message plain-card in-column"><div class="plain-card-head">${ICON.status}<div class="plain-card-text"><span class="plain-card-title">3 Tasks running, 1 waiting on you</span><span class="plain-card-sub">Office status · 594k of ~600k tokens today</span></div></div></div>`,
            ),
            say("09:14", "reviewer", "All done. The note below says what I checked."),
            note("09:15", "reviewer", REVIEW_NOTE, true),
            log("09:15", "Review & fix · run 5 done · 148k tokens"),
          ],
        },
      };

      const DESIGNS = {
        open: {
          label: "Chat",
          summary:
            "Your words in a neutral bubble on the right. The person's words run as plain text at reading width, under their avatar and name. It's the shape of today's AI chat apps, and it suits long answers with lists and code.",
          good: "Long answers read like a page, and a glance down the right edge finds what you said.",
          watch: "The person's text has no edge, so cards do the framing.",
        },
        bubbles: {
          label: "Bubbles",
          summary: "A messenger: both sides in bubbles, the person's with an avatar beside them.",
          good: "The most familiar look for short back-and-forth.",
          watch:
            "Long Markdown and code get cramped in a bubble, and at narrow width the gutter costs room.",
        },
        rows: {
          label: "Rows",
          chosen: true,
          summary: "A team channel: everyone on the left, each turn with an avatar, name and time.",
          good: "The most compact, and it holds up best in the narrow drawer.",
          watch: "You and the person look alike, so a turn's author takes a moment to find.",
        },
        today: {
          label: "Today",
          summary: "The Thread as the app draws it now, on the same messages, for comparing.",
          good: "",
          watch:
            "Your turn has the same colour as the Thread behind it, so nothing separates who said what.",
        },
      };

      const WIDTHS = {
        column: ["Task column", 620],
        drawer: ["Narrow", 380],
        window: ["Large window", 900],
      };
      const view = {
        design: "rows",
        scenario: "talk",
        details: true,
        width: "column",
        palette: "light",
      };

      /* ----- Grouping, as message-groups.ts: run on what shows, so a hidden line splits nothing ----- */
      const showsWith = (message) => message.kind === "tool" || message.kind === "context";
      const sameAuthor = (a, b) =>
        a.kind === b.kind &&
        (a.kind === "person" ? a.role === b.role : a.from === null && b.from === null);

      function grouped(messages) {
        const groups = [];
        for (const message of messages) {
          const last = groups.at(-1);
          const isTurn = message.kind === "user" || message.kind === "person";
          if (isTurn && last?.kind === "turn" && sameAuthor(last.messages[0], message))
            last.messages.push(message);
          else if (message.kind === "tool" && last?.kind === "tools") last.messages.push(message);
          else if (isTurn) groups.push({ kind: "turn", messages: [message] });
          else if (message.kind === "tool") groups.push({ kind: "tools", messages: [message] });
          else groups.push({ kind: "alone", message });
        }
        return groups;
      }

      /* ----- Drawing ----- */
      const DELIVERY = {
        waiting: [ICON.clock, "Lands at the next safe point"],
        delivered: [ICON.tick, "Delivered"],
        "not-delivered": [ICON.circleX, "Not delivered: the Stage ended first"],
      };

      function deliveryHtml(delivery, at) {
        const [icon, words] = DELIVERY[delivery];
        return `<div class="delivery ${delivery}">${icon}${words}<time class="delivery-time">· ${at}</time></div>`;
      }

      function turnFrame({ mine, labelled, marked = false, name, by, at, body }) {
        const classes = `turn ${mine ? "mine" : "theirs"} ${labelled ? "labelled" : ""} ${marked ? "marked" : ""}`;
        return `<div class="${classes}"><div class="turn-avatar">${avatar(name)}</div><div class="turn-body"><div class="turn-by"><span class="turn-author">${by}</span><time>${at}</time></div><div class="turn-messages">${body}</div></div></div>`;
      }

      function turnHtml(messages, stageThread) {
        const [opening] = messages;
        const mine = opening.kind === "user";
        const marked = stageThread && mine;
        const body = messages
          .map(
            (message) =>
              `<div class="said-row"><div class="said"><div class="md">${markdown(message.text)}</div></div>${marked && !message.from ? deliveryHtml(message.delivery, message.at) : ""}</div>`,
          )
          .join("");
        const by = mine
          ? opening.from
            ? `${ICON.note}You · Handover note from ${opening.from}`
            : "You"
          : PEOPLE[opening.role].name;
        return turnFrame({
          mine,
          labelled: Boolean(opening.from),
          marked: marked && !opening.from,
          name: mine ? "You" : PEOPLE[opening.role].name,
          by,
          at: opening.at,
          body,
        });
      }

      function toolsHtml(calls) {
        if (view.design === "today")
          return `<div class="today-tools">${calls.map(({ name, summary }) => `<div class="today-line">${ICON.wrench}<span class="tool-name">${esc(name)}</span><span class="tool-summary">${esc(summary)}</span></div>`).join("")}</div>`;
        const last = calls.at(-1);
        const count = calls.length === 1 ? "1 tool call" : `${calls.length} tool calls`;
        const rows = calls
          .map(({ name, summary }) => `<li><b>${esc(name)}</b><span>${esc(summary)}</span></li>`)
          .join("");
        return `<details class="tools in-column"><summary>${ICON.chevronRight}<span class="tools-count">${count}</span><span aria-hidden="true">·</span><span class="tools-last">${esc(last.name)} ${esc(last.summary)}</span></summary><ul>${rows}</ul></details>`;
      }

      const officeLine = (words, icon = "") =>
        view.design === "today"
          ? `<div class="today-office">${esc(words)}</div>`
          : `<div class="office-line">${icon}<span class="office-words">${esc(words)}</span></div>`;

      const breakLine = (words) =>
        `<div class="office-break"><span class="office-words">${esc(words)}</span></div>`;

      function contextHtml({ label, brief }) {
        if (brief === null) return officeLine(label);
        if (view.design === "today")
          return `<details class="today-office office-brief"><summary>${esc(label)} · Brief</summary><div class="office-brief-text">${esc(brief)}</div></details>`;
        return `<details class="office-brief"><summary class="office-line"><span class="office-words">${esc(label)}</span>${ICON.chevronDown}</summary><div class="office-brief-text">${esc(brief)}</div></details>`;
      }

      function noticeHtml(kind, icon, html, plainText) {
        return view.design === "today"
          ? `<div class="today-line ${kind}">${icon}${plainText}</div>`
          : `<div class="notice ${kind} in-column">${icon}<span>${html}</span></div>`;
      }

      function aloneHtml(message, thread) {
        const person = PEOPLE[thread.person].name;
        switch (message.kind) {
          case "log":
            return view.design === "today"
              ? `<p class="today-log">${esc(message.words)} · ${message.at}</p>`
              : breakLine(`${message.words} · ${message.at}`);
          case "day":
            return view.design === "today" ? "" : breakLine(message.words);
          case "context":
            return contextHtml(message);
          case "changes":
            return officeLine(message.allowed ? "Changes allowed" : "Changes switched off");
          case "held":
            return view.design === "today"
              ? `<div class="today-line held">${ICON.pauseLine}<span class="tool-summary">${esc(message.text)}</span></div>`
              : officeLine(message.text, ICON.pauseLine);
          case "refusal":
            return noticeHtml(
              "refused",
              ICON.shield,
              `<b>${esc(message.name)} refused:</b> ${esc(message.reason)}`,
              `<span class="tool-name">${esc(message.name)} refused</span><span class="tool-summary">${esc(message.reason)}</span>`,
            );
          case "mcp":
            return noticeHtml(
              "failed",
              ICON.triangle,
              `The MCP server ${esc(message.server)} didn't start: ${esc(message.reason)}`,
              `<span class="tool-summary">The MCP server ${esc(message.server)} didn't start: ${esc(message.reason)}</span>`,
            );
          case "failure":
            return noticeHtml(
              "failed",
              ICON.alert,
              `${esc(message.reason)} · ${message.at}`,
              `<span class="tool-summary">${esc(message.reason)} · ${message.at}</span>`,
            );
          case "note": {
            const start = message.long ? "md handover-start" : "md";
            const read = message.long ? '<button class="text-button">Read it in full</button>' : "";
            return `<div class="message handover-note in-column"><div class="message-by">${ICON.note}Handover note · ${person}</div><div class="${start}">${markdown(message.text)}</div>${read}</div>`;
          }
          case "decision": {
            const foot = message.answer
              ? `<div class="decision-answered">${ICON.check}Answered: ${esc(message.answer)}</div>`
              : '<p class="decision-hint">Waits on you. <button class="text-button">Answer it in Needs you</button></p>';
            return `<div class="message decision-card in-column"><div class="message-by"><span class="badge warning">Decision</span></div><div class="decision-question">${esc(message.question)}</div>${foot}</div>`;
          }
          case "answer":
            return turnFrame({
              mine: true,
              labelled: true,
              name: "You",
              by: "You · answering the Decision",
              at: message.at,
              body: `<div class="said-row"><div class="said"><div class="md">${markdown(message.text)}</div></div></div>`,
            });
          case "card":
            return message.html;
        }
      }

      function workingHtml(thread) {
        if (!thread.working) return "";
        const name = PEOPLE[thread.person].name;
        const tool = view.details ? "" : `<span class="tools-last">${esc(thread.working)}</span>`;
        return `<div class="working in-column" role="status">${view.design === "today" ? "" : avatar(name)}<span class="working-dots" aria-hidden="true"><i></i><i></i><i></i></span><span class="working-words">${name} is working</span>${tool}</div>`;
      }

      function threadHtml(thread) {
        const shown = thread.messages.filter((message) => view.details || !showsWith(message));
        return grouped(shown)
          .map((group) => {
            if (group.kind === "turn") return turnHtml(group.messages, thread.stageThread);
            if (group.kind === "tools") return toolsHtml(group.messages);
            return aloneHtml(group.message, thread);
          })
          .join("");
      }

      function paneHtml() {
        const thread = SCENARIOS[view.scenario];
        const person = PEOPLE[thread.person];
        const tabs = Object.entries(PEOPLE)
          .map(
            ([key, { name }]) =>
              `<span class="pane-tab ${key === thread.person ? "on" : ""}">${avatar(name)}${name}</span>`,
          )
          .join("");
        return `<div class="pane-tabs">${tabs}</div>
                <div class="pane-head">
                  <div class="pane-title"><strong>${person.name} · ${person.title}</strong><span>${esc(thread.subtitle)}</span></div>
                  <button class="switch-label" role="switch" aria-checked="${view.details}" data-toggle="details" title="Tool calls and context lines">Details<span class="switch"></span></button>
                </div>
                <div class="thread" id="thread"><div class="thread-column">${threadHtml(thread)}${workingHtml(thread)}</div></div>
                <div class="composer">
                  <div class="composer-to">To ${avatar(person.name)}<span><strong>${person.name} · ${person.title}</strong>, in this Thread</span></div>
                  <div class="composer-row"><div class="composer-field">Ask ${person.name} anything about this Task…</div><span class="composer-send">${ICON.send}</span></div>
                </div>`;
      }

      function notesHtml() {
        const design = DESIGNS[view.design];
        const point = (label, words) => (words ? `<h2>${label}</h2><p>${esc(words)}</p>` : "");
        const shared =
          view.design === "today"
            ? ""
            : `<h2>Every design but Today</h2><ul>
                      <li>The Thread sits on the plain surface, so cards and bubbles show against it.</li>
                      <li>Text goes from 13 to 14px, with more space between turns than within one.</li>
                      <li>Tool calls fold to one line that names the latest. Open it and every command shows whole, wrapped at any width.</li>
                      <li>The Office's lines lose their dashed boxes: a day or a run sits on a hairline, the rest are small centred notes.</li>
                      <li>A refusal's reason wraps instead of being cut off.</li>
                      <li>A failure keeps its red and gains a tinted strip, so it can't be missed in a long Thread.</li>
                      <li>A Thread that spans days gets a day line.</li>
                      <li>In a large window, the Thread stays in a centred column at reading width.</li>
                    </ul>
                    <h2>Stays as it is</h2><ul>
                      <li>Decisions, Handover notes and the other cards.</li>
                                      <li>Your own messages stay neutral.</li>
                      <li>One author's neighbouring messages join into a turn.</li>
                    </ul>`;
        return `${design.chosen ? '<span class="badge accent recommended">Chosen</span>' : ""}<h1>${esc(design.label)}</h1><p>${esc(design.summary)}</p>${point("Good at", design.good)}${point("Watch for", design.watch)}${shared}`;
      }

      function segmented(label, key, options) {
        const buttons = options
          .map(
            ([value, words]) =>
              `<button data-${key}="${value}" aria-pressed="${view[key] === value}">${esc(words)}</button>`,
          )
          .join("");
        return `<div class="control"><span class="control-label">${label}</span><div class="segments">${buttons}</div></div>`;
      }

      function barHtml() {
        return `<span class="bar-title">Thread dialog</span><span class="bar-tag">proposal</span>
                ${segmented(
                  "Design",
                  "design",
                  Object.entries(DESIGNS).map(([k, d]) => [k, d.label]),
                )}
                ${segmented(
                  "Scenario",
                  "scenario",
                  Object.entries(SCENARIOS).map(([k, s]) => [k, s.label]),
                )}
                ${segmented(
                  "Width",
                  "width",
                  Object.entries(WIDTHS).map(([k, [words]]) => [k, words]),
                )}
                ${segmented("Palette", "palette", [
                  ["light", "Light"],
                  ["dark", "Dark"],
                ])}`;
      }

      function render() {
        const root = document.documentElement;
        root.dataset.theme = view.palette;
        root.dataset.palette = view.palette;
        const pane = document.getElementById("pane");
        pane.dataset.design = view.design;
        pane.style.setProperty("--pane-width", `${WIDTHS[view.width][1]}px`);
        pane.innerHTML = paneHtml();
        document.getElementById("bar").innerHTML = barHtml();
        document.getElementById("notes").innerHTML = notesHtml();
        const thread = document.getElementById("thread");
        thread.scrollTop = thread.scrollHeight;
      }

      document.addEventListener("click", (event) => {
        const button = event.target.closest("button");
        if (!button) return;
        for (const key of ["design", "scenario", "width", "palette"]) {
          if (button.dataset[key]) view[key] = button.dataset[key];
        }
        if (button.dataset.toggle === "details") view.details = !view.details;
        if (button.closest(".bar") || button.dataset.toggle) render();
      });

      render();
    </script>
  </body>
</html>
