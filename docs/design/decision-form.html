<!doctype html>
<html lang="en" data-palette="light" data-theme="light" data-density="comfortable">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>The Decision form card · design proposal · The Office</title>
    <style>
      /* ---------- Tokens (design-system/tokens/ and packages/ui/src/appearance/, copied as they were on 2026-11-16) ---------- */
      :root {
        --ember-50: #fff2ed;
        --ember-100: #ffe0d4;
        --ember-300: #ff9370;
        --ember-400: #ff6638;
        --ember-500: #f23d0f;
        --ember-600: #cc2f07;
        --ember-700: #9e2406;
        --flare-300: #ffc266;
        --flare-500: #ff9a1f;
        --white: #ffffff;
        --gray-25: #fafaf9;
        --gray-50: #f4f4f2;
        --gray-100: #e9e9e6;
        --gray-150: #dededa;
        --gray-200: #d1d1cc;
        --gray-300: #b1b1ab;
        --gray-400: #8a8a84;
        --gray-500: #6b6b66;
        --gray-600: #50504c;
        --gray-700: #3a3a37;
        --gray-800: #262624;
        --gray-900: #181817;
        --gray-950: #0f0f0e;
        --green-50: #edf8f1;
        --green-100: #d5f0df;
        --green-500: #1e9e57;
        --green-600: #17834a;
        --green-700: #106a3b;
        --amber-50: #fff8e6;
        --amber-100: #ffedc2;
        --amber-500: #e5a00d;
        --amber-700: #865b05;
        --red-50: #fdeef0;
        --red-100: #fad9dd;
        --red-500: #c8102e;
        --red-600: #aa0d27;
        --red-700: #8e0b20;
        --blue-50: #eef3fd;
        --blue-100: #dae5fa;
        --blue-500: #2f6bdb;
        --blue-700: #1d4699;
        --teal-500: #14a38b;
        --violet-500: #7c5cd6;

        --bg: var(--gray-50);
        --surface: var(--white);
        --surface-raised: var(--white);
        --surface-sunken: var(--gray-50);
        --surface-hover: var(--gray-25);
        --surface-selected: var(--ember-50);
        --surface-inverse: var(--gray-900);
        --fg-1: var(--gray-950);
        --fg-2: var(--gray-600);
        --fg-3: var(--gray-500);
        --fg-disabled: var(--gray-400);
        --fg-inverse: var(--white);
        --fg-on-accent: var(--white);
        --border: var(--gray-150);
        --border-subtle: var(--gray-100);
        --border-strong: var(--gray-200);
        --border-focus: var(--ember-500);
        --accent: var(--ember-500);
        --accent-hover: var(--ember-600);
        --accent-subtle: var(--ember-50);
        --accent-subtle-fg: var(--ember-700);
        --primary: var(--gray-900);
        --primary-hover: var(--gray-700);
        --primary-fg: var(--white);
        --control-hover: var(--gray-50);
        --control-press: var(--gray-100);
        --success: var(--green-500);
        --success-subtle: var(--green-50);
        --success-fg: var(--green-700);
        --success-border: var(--green-100);
        --warning: var(--amber-500);
        --warning-subtle: var(--amber-50);
        --warning-fg: var(--amber-700);
        --warning-border: var(--amber-100);
        --danger: var(--red-500);
        --danger-subtle: var(--red-50);
        --danger-fg: var(--red-700);
        --danger-border: var(--red-100);
        --info: var(--blue-500);
        --info-subtle: var(--blue-50);
        --info-fg: var(--blue-700);
        --info-border: var(--blue-100);
        --neutral-subtle: var(--gray-50);
        --neutral-fg: var(--gray-600);
        --neutral-border: var(--gray-150);
        --focus-ring: 0 0 0 3px color-mix(in oklab, var(--ember-500) 30%, transparent);
        --overlay: color-mix(in oklab, var(--gray-950) 45%, transparent);

        --font-sans: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        --font-mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        --text-2xs: 11px;
        --text-xs: 12px;
        --text-sm: 13px;
        --text-md: 14px;
        --text-lg: 16px;
        --text-xl: 18px;
        --text-2xl: 20px;
        --type-body: 400 var(--text-md) / 1.5 var(--font-sans);
        --type-body-sm: 400 var(--text-sm) / 1.45 var(--font-sans);
        --type-caption: 400 var(--text-xs) / 1.4 var(--font-sans);
        --type-card-title: 600 var(--text-md) / 1.4 var(--font-sans);
        --type-section-title: 600 var(--text-lg) / 1.3 var(--font-sans);
        --type-overline: 500 var(--text-2xs) / 1.2 var(--font-mono);
        --tracking-caps: 0.06em;
        --tracking-tight: -0.01em;

        --space-1: 4px;
        --space-2: 8px;
        --space-3: 12px;
        --space-4: 16px;
        --radius-sm: 4px;
        --radius-md: 6px;
        --radius-lg: 8px;
        --radius-xl: 12px;
        --radius-full: 999px;
        --radius-control: var(--radius-md);
        --radius-badge: var(--radius-sm);
        --control-xs: 24px;
        --control-sm: 28px;
        --control-md: 32px;

        --shadow-1: 0 1px 2px rgba(16, 16, 15, 0.05);
        --shadow-2: 0 4px 12px -2px rgba(16, 16, 15, 0.08), 0 1px 3px rgba(16, 16, 15, 0.05);
        --shadow-3: 0 16px 40px -8px rgba(16, 16, 15, 0.18), 0 2px 6px rgba(16, 16, 15, 0.06);
        --ease-out: cubic-bezier(0.2, 0.8, 0.2, 1);
        --duration-fast: 120ms;
        --duration-base: 200ms;
        --duration-slow: 280ms;
      }
      [data-theme="dark"] {
        --surface-selected: color-mix(in oklab, var(--ember-500) 12%, var(--gray-900));
        --fg-disabled: var(--gray-600);
        --accent-hover: var(--ember-400);
        --accent-subtle: color-mix(in oklab, var(--ember-500) 16%, transparent);
        --accent-subtle-fg: var(--ember-300);
        --success-subtle: color-mix(in oklab, var(--green-500) 16%, transparent);
        --success-fg: #6fd69b;
        --success-border: color-mix(in oklab, var(--green-500) 30%, transparent);
        --warning-subtle: color-mix(in oklab, var(--amber-500) 16%, transparent);
        --warning-fg: var(--flare-300);
        --warning-border: color-mix(in oklab, var(--amber-500) 30%, transparent);
        --danger-subtle: color-mix(in oklab, var(--red-500) 20%, transparent);
        --danger-fg: #ff8a97;
        --danger-border: color-mix(in oklab, var(--red-500) 36%, transparent);
        --info-subtle: color-mix(in oklab, var(--blue-500) 18%, transparent);
        --info-fg: #93b5f5;
        --info-border: color-mix(in oklab, var(--blue-500) 34%, transparent);
        --overlay: color-mix(in oklab, #000 65%, transparent);
        --shadow-1: 0 0 0 1px rgba(255, 255, 255, 0.04);
        --shadow-2: 0 4px 12px -2px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.06);
        --shadow-3: 0 16px 40px -8px rgba(0, 0, 0, 0.65), 0 0 0 1px rgba(255, 255, 255, 0.08);
      }
      /* packages/ui/src/appearance/palettes/light.css */
      :root[data-palette="light"] {
        --fg-1: var(--gray-800);
        --fg-2: var(--gray-500);
        --fg-3: var(--gray-400);
        --border: var(--gray-100);
        --border-subtle: #efefec;
        --border-strong: var(--gray-150);
        --surface-hover: var(--gray-25);
        --neutral-subtle: var(--gray-50);
        --neutral-fg: var(--gray-500);
        --neutral-border: var(--gray-100);
      }
      /* packages/ui/src/appearance/palettes/dark.css */
      :root[data-palette="dark"] {
        --bg: #161615;
        --surface: #1d1d1b;
        --surface-raised: #242422;
        --surface-sunken: #131312;
        --surface-hover: #222220;
        --surface-selected: #2a2420;
        --surface-inverse: #e6e6e2;
        --fg-1: #d9d9d5;
        --fg-2: #9a9a94;
        --fg-3: #6f6f69;
        --fg-inverse: #161615;
        --border: #262624;
        --border-subtle: #222220;
        --border-strong: #33332f;
        --primary: #d9d9d5;
        --primary-fg: #161615;
        --primary-hover: #e6e6e2;
        --control-hover: #262624;
        --control-press: #2e2e2b;
        --neutral-subtle: #242422;
        --neutral-fg: #9a9a94;
        --neutral-border: #2e2e2b;
      }
      /* packages/ui/src/appearance/densities/comfortable.css */
      :root[data-density="comfortable"] {
        --pad-card: 16px 18px;
        --gap-card: 12px;
        --pad-row: 14px 18px;
        --pad-page: 24px;
        --gap-panel: 20px;
        --radius-card: 10px;
        --text-item: 14px;
        --text-body: 13px;
        --control-h: 28px;
        --line: 1.5;
      }

      /* ---------- Base (design-system/tokens/base.css) ---------- */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      button,
      textarea,
      input {
        font: inherit;
        color: inherit;
      }
      p {
        margin: 0;
      }
      @supports selector(::-webkit-scrollbar) {
        ::-webkit-scrollbar {
          width: 10px;
          height: 10px;
        }
        ::-webkit-scrollbar-track,
        ::-webkit-scrollbar-corner {
          background: transparent;
        }
        ::-webkit-scrollbar-thumb {
          border: 3px solid transparent;
          border-radius: var(--radius-full);
          background: var(--border-strong) padding-box;
        }
      }
      @supports not selector(::-webkit-scrollbar) {
        * {
          scrollbar-width: thin;
          scrollbar-color: var(--border-strong) transparent;
        }
      }
      :is(button, textarea, a, [tabindex]):focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 1px;
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation: none !important;
          transition: none !important;
        }
      }

      /* ---------- packages/ui, re-drawn: Badge, Avatar, Button, TextButton, Textarea, Alert, Tooltip ---------- */
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        height: 22px;
        padding: 0 8px;
        border-radius: var(--radius-badge);
        border: 1px solid var(--neutral-border);
        background: var(--neutral-subtle);
        color: var(--neutral-fg);
        font-size: var(--text-xs);
        font-weight: 500;
        white-space: nowrap;
      }
      .badge.sm {
        height: 18px;
        padding: 0 6px;
        font-size: var(--text-2xs);
      }
      .badge.success {
        background: var(--success-subtle);
        color: var(--success-fg);
        border-color: var(--success-border);
      }
      .badge.warning {
        background: var(--warning-subtle);
        color: var(--warning-fg);
        border-color: var(--warning-border);
      }
      .badge.danger {
        background: var(--danger-subtle);
        color: var(--danger-fg);
        border-color: var(--danger-border);
      }
      .badge.info {
        background: var(--info-subtle);
        color: var(--info-fg);
        border-color: var(--info-border);
      }
      .badge.accent {
        background: var(--accent-subtle);
        color: var(--accent-subtle-fg);
        border-color: transparent;
      }
      .avatar {
        width: 24px;
        height: 24px;
        border-radius: 50%;
        flex: none;
        display: inline-grid;
        place-items: center;
        font-size: 9px;
        font-weight: 600;
        line-height: 1;
        color: var(--avatar-fg, var(--fg-1));
        background: var(--avatar-bg, var(--neutral-subtle));
      }
      .avatar.sm {
        width: 20px;
        height: 20px;
        font-size: 8px;
      }
      .avatar.xs {
        width: 18px;
        height: 18px;
        font-size: 8px;
      }
      .avatar.lg {
        width: 32px;
        height: 32px;
        font-size: 11px;
      }
      .tint-jim {
        --avatar-bg: color-mix(in oklab, var(--teal-500) 24%, var(--surface));
      }
      .tint-angela {
        --avatar-bg: color-mix(in oklab, var(--violet-500) 24%, var(--surface));
      }
      .tint-michael {
        --avatar-bg: color-mix(in oklab, var(--blue-500) 24%, var(--surface));
      }
      .tint-pam {
        --avatar-bg: color-mix(in oklab, var(--amber-500) 30%, var(--surface));
      }
      .tint-you {
        --avatar-bg: var(--neutral-subtle);
        --avatar-fg: var(--fg-2);
        box-shadow: inset 0 0 0 1px var(--border-strong);
      }
      .tint-office {
        --avatar-bg: var(--ember-500);
        --avatar-fg: var(--white);
      }
      .btn {
        display: inline-flex;
        flex: none;
        align-items: center;
        justify-content: center;
        gap: 6px;
        height: var(--control-md);
        padding: 0 12px;
        border: 1px solid transparent;
        border-radius: var(--radius-control);
        font: 500 var(--text-sm) / 1 var(--font-sans);
        white-space: nowrap;
        cursor: pointer;
        transition: background var(--duration-fast) var(--ease-out);
      }
      .btn.sm {
        height: var(--control-sm);
        padding: 0 10px;
      }
      .btn.secondary {
        border-color: var(--border-strong);
        background: var(--surface);
        color: var(--fg-1);
        box-shadow: var(--shadow-1);
      }
      .btn.secondary:hover:not(:disabled) {
        background: var(--control-hover);
      }
      .btn.primary {
        background: var(--primary);
        color: var(--primary-fg);
      }
      .btn.primary:hover:not(:disabled) {
        background: var(--primary-hover);
      }
      .btn:disabled {
        cursor: not-allowed;
        opacity: 0.45;
      }
      .icon-button {
        display: inline-grid;
        flex: none;
        place-items: center;
        width: var(--control-sm);
        height: var(--control-sm);
        padding: 0;
        border: 0;
        border-radius: var(--radius-md);
        background: none;
        color: var(--fg-2);
        cursor: pointer;
      }
      .icon-button.xs {
        width: var(--control-xs);
        height: var(--control-xs);
      }
      .icon-button:hover {
        background: var(--control-hover);
        color: var(--fg-1);
      }
      .text-button {
        display: inline-flex;
        align-items: center;
        min-height: var(--control-xs);
        gap: 5px;
        padding: 0;
        border: 0;
        background: none;
        color: var(--fg-2);
        font: 500 var(--text-xs) / 1.4 var(--font-sans);
        cursor: pointer;
      }
      .text-button:hover {
        color: var(--fg-1);
        text-decoration: underline;
        text-underline-offset: 2px;
      }
      .link {
        padding: 0;
        border: 0;
        background: none;
        color: var(--accent-subtle-fg);
        font: inherit;
        font-weight: 500;
        text-decoration: underline;
        text-decoration-color: color-mix(in oklab, currentColor 35%, transparent);
        text-underline-offset: 2px;
        cursor: pointer;
      }
      .textarea {
        display: block;
        width: 100%;
        min-height: 56px;
        padding: 7px 10px;
        border: 1px solid var(--border-strong);
        border-radius: var(--radius-control);
        background: var(--surface);
        color: var(--fg-1);
        font: var(--type-body-sm);
        resize: vertical;
      }
      .textarea.one-line {
        min-height: var(--control-md);
        height: auto;
        resize: none;
      }
      .textarea::placeholder {
        color: var(--fg-3);
      }
      .textarea:focus {
        outline: none;
        border-color: var(--border-focus);
        box-shadow: var(--focus-ring);
      }
      .field {
        display: grid;
        gap: 5px;
      }
      .field-label {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 4px 6px;
        font: 500 var(--text-xs) / 1.4 var(--font-sans);
        color: var(--fg-2);
      }
      .field-label .optional {
        font-weight: 400;
        color: var(--fg-3);
      }
      .alert {
        display: flex;
        gap: 10px;
        align-items: flex-start;
        padding: 10px 12px;
        border: 1px solid var(--danger-border);
        border-radius: var(--radius-md);
        background: var(--danger-subtle);
        color: var(--danger-fg);
        font: var(--type-body-sm);
      }
      .alert svg {
        flex: none;
        margin-top: 2px;
      }
      .alert b {
        display: block;
        font-weight: 600;
      }
      .alert span {
        color: var(--fg-1);
      }
      /* Tooltip: on hover and keyboard focus, as packages/ui's Tooltip; pinned open where a scenario shows it. */
      .tip-wrap {
        position: relative;
        display: inline-flex;
        flex: none;
      }
      .tip {
        position: absolute;
        bottom: calc(100% + 8px);
        left: 0;
        z-index: 30;
        /* Out of layout until shown, as packages/ui's Tooltip mounts only when open, so a hidden tip never widens a narrow Thread. */
        display: none;
        width: max-content;
        max-width: min(260px, 90cqi);
        padding: 6px 9px;
        border-radius: var(--radius-md);
        background: var(--surface-inverse);
        color: var(--fg-inverse);
        font: var(--type-caption);
        box-shadow: var(--shadow-2);
        pointer-events: none;
      }
      .tip::after {
        content: "";
        position: absolute;
        top: 100%;
        left: 14px;
        border: 5px solid transparent;
        border-top-color: var(--surface-inverse);
      }
      /* A control after another, or at a row's end, opens its tip leftwards so it stays inside the card. */
      .tip-wrap + .tip-wrap .tip,
      .composer .tip {
        left: auto;
        right: 0;
      }
      .tip-wrap + .tip-wrap .tip::after,
      .composer .tip::after {
        left: auto;
        right: 14px;
      }
      .tip-wrap:hover .tip,
      .tip-wrap:focus-within .tip,
      .tip-wrap.pinned .tip {
        display: block;
      }
      .person-tag {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        color: var(--fg-1);
        font-weight: 500;
        white-space: nowrap;
      }
      .project-chip {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font: var(--type-caption);
        color: var(--fg-2);
        white-space: nowrap;
      }
      .project-chip::before {
        content: "";
        width: 10px;
        height: 10px;
        border-radius: 3px;
        background: var(--teal-500);
      }
      .record-chip {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        max-width: 100%;
        padding: 1px 7px;
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        background: var(--surface);
        color: var(--fg-1);
        font: 500 var(--text-xs) / 1.5 var(--font-sans);
        vertical-align: baseline;
        cursor: pointer;
      }
      .record-chip svg {
        flex: none;
        color: var(--fg-3);
      }
      .overline {
        font: var(--type-overline);
        letter-spacing: var(--tracking-caps);
        text-transform: uppercase;
        color: var(--fg-3);
      }
      .muted {
        color: var(--fg-2);
      }
      .grow {
        flex: 1;
      }
      .dot {
        display: inline-block;
        flex: none;
        width: 8px;
        height: 8px;
        border-radius: 50%;
      }
      .dot.live {
        background: var(--success);
        animation: live 1.4s ease-in-out infinite;
      }
      @keyframes live {
        0%,
        100% {
          box-shadow: 0 0 0 0 color-mix(in oklab, var(--success) 55%, transparent);
        }
        60% {
          box-shadow: 0 0 0 4px color-mix(in oklab, var(--success) 0%, transparent);
        }
      }
      code,
      .code {
        font: 12px / 1.5 var(--font-mono);
      }
      .code-block {
        margin: 8px 0 0;
        padding: 8px 10px;
        border-radius: var(--radius-md);
        background: var(--surface-sunken);
        border: 1px solid var(--border);
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }

      /* ---------- The Decision form card (this design) ---------- */
      .dcard {
        container: dcard / inline-size;
        min-width: 0;
        padding: 14px 16px 16px;
        border: 1px solid var(--warning-border);
        border-radius: var(--radius-card);
        background: var(--warning-subtle);
        scroll-margin-top: 12px;
      }
      /* Nothing waits on it any more: the amber goes, so what still waits stands out in a Thread. */
      .dcard.settled {
        border-color: var(--border);
        background: var(--surface);
      }
      .dcard.flash,
      .acard.flash {
        box-shadow: var(--focus-ring);
      }
      /* A path or a link in an Agent's words breaks instead of widening a 390px Thread. */
      .dcard,
      .acard,
      .win,
      .turn-text {
        overflow-wrap: anywhere;
      }
      .dcard-head {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px 8px;
        font: var(--type-caption);
        color: var(--fg-2);
      }
      .dcard-head .put-to {
        color: var(--fg-3);
      }
      .dcard-head .when {
        margin-left: auto;
        white-space: nowrap;
      }
      .dcard-on {
        margin-top: 6px;
        font: var(--type-caption);
        color: var(--fg-2);
      }
      .dcard-context {
        margin-top: 10px;
        max-width: 72ch;
        font: var(--type-body-sm);
        color: var(--fg-1);
      }
      .dcard-context.first-line {
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
        color: var(--fg-2);
      }
      .dcard-request {
        margin-top: 10px;
        font: var(--type-card-title);
      }
      .dcard-note {
        display: flex;
        gap: 6px;
        align-items: flex-start;
        margin-top: 10px;
        padding: 7px 10px;
        border-radius: var(--radius-md);
        background: color-mix(in oklab, var(--surface) 70%, transparent);
        font: var(--type-caption);
        color: var(--fg-2);
      }
      .dcard-note svg {
        flex: none;
        margin-top: 1px;
      }
      .dcard-attachments {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px 10px;
        margin-top: 10px;
        font: var(--type-caption);
        color: var(--fg-2);
      }

      /* A question: its number, its words, its answer, its comment. */
      .q {
        margin-top: 14px;
      }
      .q + .q {
        padding-top: 14px;
        border-top: 1px solid var(--warning-border);
      }
      .win .q + .q,
      .settled .q + .q {
        border-top-color: var(--border-subtle);
      }
      .q-head {
        display: flex;
        gap: 10px;
        align-items: flex-start;
      }
      .q-num {
        flex: none;
        display: inline-grid;
        place-items: center;
        min-width: 20px;
        height: 20px;
        margin-top: 1px;
        padding: 0 5px;
        border: 1px solid var(--border-strong);
        border-radius: var(--radius-full);
        background: var(--surface);
        color: var(--fg-2);
        font: 600 var(--text-2xs) / 1 var(--font-sans);
      }
      .q-num.answered {
        border-color: var(--success-border);
        background: var(--success-subtle);
        color: var(--success-fg);
      }
      .q-num.missing {
        border-color: var(--warning);
        border-style: dashed;
        color: var(--warning-fg);
      }
      .q-text {
        flex: 1;
        min-width: 0;
        font: var(--type-card-title);
      }
      .q-kind {
        display: block;
        margin-top: 1px;
        font: var(--type-caption);
        color: var(--fg-3);
      }
      .q-body {
        display: grid;
        gap: 8px;
        margin-top: 10px;
        padding-left: 30px;
      }
      .q.unnumbered .q-body {
        padding-left: 0;
      }
      @container dcard (width < 460px) {
        .q-body {
          padding-left: 0;
        }
      }
      @container win (width < 520px) {
        .q-body {
          padding-left: 0;
        }
      }

      /* packages/ui RadioList: one boxed line per option, "Recommended" as its aside. Rows at its sm size in a card. */
      .radio-list {
        display: grid;
        gap: 6px;
      }
      .radio-list-item {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
        padding: 8px 12px;
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        background: var(--surface);
        cursor: pointer;
        font: var(--type-body-sm);
      }
      .win .radio-list-item {
        padding: var(--pad-row);
        font: var(--type-body);
      }
      .radio-list-item:hover {
        background: var(--surface-hover);
      }
      .radio-list-item.picked {
        border-color: var(--border-focus);
        background: var(--surface-selected);
      }
      .radio-list-item:has(input:focus-visible) {
        outline: 2px solid var(--border-focus);
        outline-offset: 1px;
      }
      .radio-list-item:has(input:disabled) {
        cursor: not-allowed;
        opacity: 0.6;
      }
      .radio-list-item input {
        flex: none;
        margin: 0;
        accent-color: var(--accent);
      }
      .radio-list-label {
        flex: 1;
        min-width: 0;
        overflow-wrap: anywhere;
      }
      .radio-list-item.none-of-these {
        border-style: dashed;
        background: transparent;
        color: var(--fg-2);
      }
      .radio-list-item.none-of-these.picked {
        background: var(--surface-selected);
        color: var(--fg-1);
      }
      .why {
        max-width: 72ch;
        font: var(--type-caption);
        color: var(--fg-2);
      }
      .why b {
        font-weight: 600;
        color: var(--fg-1);
      }
      .win .why {
        font: var(--type-body-sm);
      }
      .comment-fold {
        justify-self: start;
      }

      /* The progress line: how many questions are answered, and the way to the first one that isn't. */
      .progress {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 4px 10px;
        font: var(--type-caption);
        color: var(--fg-2);
      }
      .progress b {
        font-weight: 600;
        color: var(--fg-1);
      }
      .meter {
        position: relative;
        flex: none;
        width: 56px;
        height: 4px;
        overflow: hidden;
        border-radius: var(--radius-full);
        background: var(--border-strong);
      }
      .meter i {
        position: absolute;
        inset: 0 auto 0 0;
        border-radius: inherit;
        background: var(--success);
      }
      .progress .missing-link {
        color: var(--warning-fg);
      }

      .general {
        margin-top: 16px;
        padding-top: 14px;
        border-top: 1px solid var(--warning-border);
      }
      .dactions {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px 10px;
        margin-top: 12px;
      }
      .dactions .progress {
        margin-left: auto;
      }
      .dhints {
        display: grid;
        gap: 4px;
        margin-top: 10px;
        font: var(--type-caption);
        color: var(--fg-3);
      }
      .dhints .reach {
        color: var(--info-fg);
      }
      .ask-again-step {
        display: grid;
        gap: 8px;
        margin-top: 16px;
        padding: 12px;
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        background: var(--surface);
      }
      .ask-again-step .dactions {
        margin-top: 2px;
      }
      .step-note {
        font: var(--type-caption);
        color: var(--fg-3);
      }
      .refused {
        margin-top: 12px;
      }

      /* The compact card: a long form, or one with Attachments, in brief. */
      .compact-first {
        display: grid;
        gap: 6px;
        margin-top: 12px;
        padding: 10px 12px;
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        background: var(--surface);
      }
      .compact-first .overline {
        font-size: 10px;
      }
      .rec-line {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px 8px;
        font: var(--type-body-sm);
        font-weight: 500;
      }
      .rec-line svg {
        color: var(--accent);
      }
      .compact-more {
        margin-top: 8px;
        font: var(--type-caption);
        color: var(--fg-2);
      }

      /* Answered, asked again or closed: read-only, where it was asked. */
      .qa-list {
        display: grid;
        gap: 10px;
        margin: 12px 0 0;
        padding: 0;
        list-style: none;
      }
      .qa {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr);
        gap: 2px 10px;
      }
      .qa .q-num {
        grid-row: span 3;
      }
      .qa-q {
        font: var(--type-caption);
        color: var(--fg-2);
      }
      .qa-a {
        font: var(--type-body-sm);
        font-weight: 500;
        color: var(--fg-1);
        overflow-wrap: anywhere;
      }
      .qa-a .tag {
        font-weight: 400;
        color: var(--fg-3);
      }
      .qa-a.unanswered {
        font-weight: 400;
        color: var(--fg-3);
      }
      .qa-c,
      .qa-general {
        max-width: 72ch;
        padding-left: 9px;
        border-left: 2px solid var(--border-strong);
        font: var(--type-caption);
        color: var(--fg-2);
      }
      .qa-c b,
      .qa-general b {
        font-weight: 600;
        color: var(--fg-1);
      }
      .qa-general {
        margin-top: 12px;
      }
      .show-all {
        margin-top: 10px;
      }
      .outcome {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 4px 6px;
        margin-top: 12px;
        padding-top: 10px;
        border-top: 1px solid var(--border-subtle);
        font: var(--type-caption);
        color: var(--success-fg);
      }
      .outcome.asked-again {
        color: var(--info-fg);
      }
      .outcome.closed {
        color: var(--fg-2);
      }
      .outcome .outcome-words {
        color: var(--fg-1);
      }

      /* In short, in the Thread while it waits. */
      .dshort .dshort-q {
        margin-top: 8px;
        font: var(--type-body-sm);
        font-weight: 500;
      }
      .dshort .dshort-line {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 8px;
        margin-top: 6px;
        font: var(--type-caption);
        color: var(--fg-2);
      }

      /* The approval of a call past a Hard switch: a card of its own, never a question in a form. */
      .acard {
        container: dcard / inline-size;
        min-width: 0;
        padding: 14px 16px 16px;
        border: 1px solid var(--danger-border);
        border-radius: var(--radius-card);
        background: color-mix(in oklab, var(--danger-subtle) 60%, var(--surface));
      }
      .acard.settled {
        border-color: var(--border);
        background: var(--surface);
      }
      .acard-call {
        margin-top: 10px;
        font: var(--type-card-title);
      }
      .acard-switch {
        display: flex;
        gap: 6px;
        align-items: flex-start;
        margin-top: 8px;
        font: var(--type-caption);
        color: var(--fg-2);
      }
      .acard-switch svg {
        flex: none;
        margin-top: 1px;
      }

      /* Pictures at the one screenshot size; files as chips. */
      .thumbs {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }
      .thumb {
        display: grid;
        width: 160px;
        gap: 4px;
        padding: 0;
        border: 0;
        background: none;
        text-align: left;
        cursor: zoom-in;
      }
      .thumb svg {
        display: block;
        width: 160px;
        height: 100px;
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        background: var(--surface);
      }
      .thumb span {
        font: var(--type-caption);
        color: var(--fg-2);
        overflow-wrap: anywhere;
      }
      .file-chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        max-width: 100%;
        min-width: 0;
        height: 28px;
        padding: 0 10px;
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        background: var(--surface);
        font: var(--type-caption);
        color: var(--fg-1);
      }

      /* ---------- The window (packages/ui Dialog, Large) ---------- */
      .win-layer {
        position: absolute;
        inset: 0;
        z-index: 50;
        background: var(--overlay);
      }
      .win {
        container: win / inline-size;
        position: absolute;
        top: max(24px, 7%);
        left: 50%;
        display: flex;
        flex-direction: column;
        width: min(1180px, 94%);
        height: 86%;
        overflow: hidden;
        transform: translateX(-50%);
        border: 1px solid var(--border);
        border-radius: var(--radius-xl);
        background: var(--surface-raised);
        color: var(--fg-1);
        box-shadow: var(--shadow-3);
      }
      .win-head {
        flex: none;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px 10px;
        padding: 10px 10px 10px 18px;
        border-bottom: 1px solid var(--border-subtle);
        font: var(--type-caption);
        color: var(--fg-2);
      }
      .win-head h2 {
        margin: 0;
        min-width: 0;
        overflow: hidden;
        color: var(--fg-1);
        font: var(--type-section-title);
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      .win-body {
        flex: 1;
        min-height: 0;
        overflow: hidden;
      }
      .win-foot {
        flex: none;
        border-top: 1px solid var(--border-subtle);
        background: var(--surface-sunken);
      }
      .win-step {
        display: grid;
        gap: 6px;
        padding: 12px 18px 0;
      }
      .win-actions {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        padding: 10px 18px 12px;
      }
      .win-actions-start {
        display: flex;
        flex: 1;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px 10px;
      }

      /* List and details (spec 4.1): the questions on the left, the picked one on the right. */
      .split {
        display: grid;
        grid-template-columns: 300px minmax(0, 1fr);
        height: 100%;
      }
      .qlist {
        overflow-y: auto;
        border-right: 1px solid var(--border-subtle);
        background: var(--surface-sunken);
      }
      .qlist-head {
        position: sticky;
        top: 0;
        z-index: 1;
        display: grid;
        gap: 6px;
        padding: 12px 14px 10px;
        border-bottom: 1px solid var(--border-subtle);
        background: var(--surface-sunken);
      }
      .qrow {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr);
        gap: 2px 10px;
        width: 100%;
        padding: 10px 14px;
        border: 0;
        border-bottom: 1px solid var(--border-subtle);
        border-left: 3px solid transparent;
        background: none;
        text-align: left;
        cursor: pointer;
      }
      .qrow:hover {
        background: var(--surface-hover);
      }
      /* Inside the list's scroll box, so the ring is drawn inwards to stay whole. */
      .qrow:focus-visible {
        outline-offset: -2px;
      }
      .qrow[aria-current="true"] {
        border-left-color: var(--accent);
        background: var(--surface-selected);
      }
      .qrow .q-num {
        grid-row: span 2;
      }
      .qrow-text {
        overflow: hidden;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        font: 500 var(--text-sm) / 1.4 var(--font-sans);
        color: var(--fg-1);
      }
      .qrow-state {
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
        font: var(--type-caption);
        color: var(--fg-3);
      }
      .qrow-state.missing {
        color: var(--warning-fg);
      }
      .detail {
        overflow-y: auto;
        padding: 18px 24px 24px;
      }
      .detail-inner {
        max-width: 760px;
      }
      .detail-nav {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 18px;
      }
      .detail .q {
        margin-top: 6px;
      }
      .detail .q-text {
        font: 600 var(--text-lg) / 1.35 var(--font-sans);
      }
      .context-block {
        display: grid;
        gap: 10px;
        margin-bottom: 18px;
        padding-bottom: 18px;
        border-bottom: 1px solid var(--border-subtle);
      }
      .context-block .dcard-context {
        margin: 0;
        font: var(--type-body);
      }
      /* The question strip: the list, under 900px, one row of numbers above the picked question. */
      .qstrip {
        display: none;
      }
      @container win (width < 900px) {
        .split {
          grid-template-columns: minmax(0, 1fr);
          grid-template-rows: auto minmax(0, 1fr);
        }
        .qlist {
          display: none;
        }
        .qstrip {
          display: grid;
          gap: 8px;
          padding: 10px 16px;
          border-bottom: 1px solid var(--border-subtle);
          background: var(--surface-sunken);
        }
        .qstrip-row {
          display: flex;
          flex-wrap: wrap;
          gap: 6px;
        }
        .qstrip-row button {
          display: inline-grid;
          place-items: center;
          min-width: 32px;
          height: 32px;
          padding: 0 8px;
          border: 1px solid var(--border-strong);
          border-radius: var(--radius-md);
          background: var(--surface);
          color: var(--fg-1);
          font: 600 var(--text-xs) / 1 var(--font-sans);
          cursor: pointer;
        }
        .qstrip-row button.answered {
          border-color: var(--success-border);
          background: var(--success-subtle);
          color: var(--success-fg);
        }
        .qstrip-row button.missing {
          border-style: dashed;
          border-color: var(--warning);
          color: var(--warning-fg);
        }
        /* Unlike the focus ring, so the current question and keyboard focus read apart. */
        .qstrip-row button[aria-current="true"] {
          border-color: var(--accent);
          background: var(--surface-selected);
          box-shadow: inset 0 0 0 1px var(--accent);
        }
        .detail {
          padding: 14px 16px 20px;
        }
      }
      /* The alternative for the Gate: one scrolling form. */
      .scroll-form {
        height: 100%;
        overflow-y: auto;
        padding: 0 24px 24px;
      }
      .scroll-form-inner {
        max-width: 760px;
        margin: 0 auto;
      }
      .scroll-form .progress-bar {
        position: sticky;
        top: 0;
        z-index: 1;
        padding: 12px 0 10px;
        border-bottom: 1px solid var(--border-subtle);
        background: var(--surface);
      }
      .scroll-form .context-block {
        margin-top: 16px;
      }
      @container win (width < 600px) {
        .scroll-form {
          padding: 0 16px 20px;
        }
      }

      /* ---------- The design page around the mock ---------- */
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg-1);
        font: var(--type-body);
      }
      .bar {
        position: sticky;
        top: 0;
        z-index: 100;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px 18px;
        padding: 10px 16px;
        background: var(--gray-900);
        color: var(--gray-100);
      }
      .bar-title {
        font-weight: 600;
      }
      .bar-tag {
        padding: 1px 6px;
        border-radius: 4px;
        background: var(--ember-500);
        color: var(--white);
        font: var(--type-overline);
      }
      .control {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px 8px;
      }
      .control-label {
        font: var(--type-overline);
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--gray-300);
      }
      .segments {
        display: flex;
        flex-wrap: wrap;
        overflow: hidden;
        border: 1px solid var(--gray-600);
        border-radius: 6px;
      }
      .segments button {
        padding: 4px 10px;
        border: 0;
        background: none;
        font: var(--type-caption);
        color: var(--gray-200);
        cursor: pointer;
      }
      .segments button + button {
        border-left: 1px solid var(--gray-600);
      }
      .segments button[aria-pressed="true"] {
        background: var(--gray-50);
        color: var(--gray-900);
      }
      .segments button:disabled {
        color: var(--gray-500);
        text-decoration: line-through;
        cursor: not-allowed;
      }
      .segments button:focus-visible {
        outline-offset: -2px;
      }
      .bar-break {
        flex-basis: 100%;
        height: 0;
      }
      .bar .reset {
        padding: 4px 10px;
        border: 1px solid var(--gray-600);
        border-radius: 6px;
        background: none;
        color: var(--gray-200);
        font: var(--type-caption);
        cursor: pointer;
      }
      .stage {
        display: grid;
        gap: 14px;
        padding: 16px 24px 40px;
      }
      .scenario-note {
        max-width: 130ch;
        font: var(--type-body-sm);
        color: var(--fg-2);
      }
      .scenario-note strong {
        color: var(--fg-1);
      }
      .frame-row {
        display: flex;
        justify-content: center;
        overflow-x: auto;
      }
      .frame {
        position: relative;
        flex: none;
        height: max(700px, calc(100vh - 230px));
        overflow: hidden;
        border: 1px solid var(--border-strong);
        border-radius: 10px;
        background: var(--bg);
        box-shadow: var(--shadow-2);
      }
      .frame.w-wide {
        flex: 1 1 auto;
        width: 100%;
        min-width: 1000px;
      }
      .frame.w-900 {
        width: 900px;
      }
      .frame.w-390 {
        width: 390px;
        height: max(700px, min(844px, calc(100vh - 230px)));
      }
      .reference {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
        gap: 18px 32px;
        max-width: 1400px;
        margin-top: 10px;
        font: var(--type-body-sm);
        color: var(--fg-2);
      }
      .reference h2 {
        margin: 0 0 8px;
        font: var(--type-card-title);
        color: var(--fg-1);
      }
      .reference p,
      .reference ul {
        margin: 0 0 8px;
      }
      .reference ul {
        padding-left: 18px;
      }
      .reference table {
        width: 100%;
        border-collapse: collapse;
      }
      .reference th,
      .reference td {
        padding: 5px 8px 5px 0;
        border-bottom: 1px solid var(--border);
        text-align: left;
        vertical-align: top;
      }
      .reference th {
        font: var(--type-overline);
        letter-spacing: var(--tracking-caps);
        text-transform: uppercase;
        color: var(--fg-3);
      }
      .toast {
        position: absolute;
        left: 50%;
        bottom: 20px;
        z-index: 80;
        transform: translateX(-50%);
        max-width: calc(100% - 32px);
        padding: 8px 14px;
        border-radius: var(--radius-md);
        background: var(--surface-inverse);
        color: var(--fg-inverse);
        font: var(--type-caption);
        box-shadow: var(--shadow-3);
      }

      /* ---------- The app around the card: the shell ---------- */
      .app {
        position: absolute;
        inset: 0;
        display: grid;
        grid-template-columns: 56px minmax(0, 1fr);
        grid-template-rows: 52px 52px minmax(0, 1fr);
        color: var(--fg-1);
        font: var(--type-body);
      }
      .app.no-rail {
        grid-template-columns: 0 minmax(0, 1fr);
      }
      .rail {
        grid-row: 1 / -1;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        padding: 12px 0;
        overflow: hidden;
        border-right: 1px solid var(--border);
        background: var(--surface);
      }
      .rail-mark {
        display: grid;
        place-items: center;
        width: 28px;
        height: 28px;
        margin-bottom: 12px;
        border-radius: 7px;
        background: var(--ember-500);
        color: var(--white);
        font: 700 12px/1 var(--font-sans);
      }
      .rail-item {
        display: grid;
        place-items: center;
        width: 40px;
        height: 40px;
        border-radius: var(--radius-lg);
        color: var(--fg-2);
      }
      .rail-item.on {
        background: var(--surface-selected);
        color: var(--accent-subtle-fg);
      }
      .topbar {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
        padding: 0 16px;
        border-bottom: 1px solid var(--border);
        background: var(--surface);
      }
      .search {
        display: flex;
        align-items: center;
        gap: 8px;
        flex: 1;
        max-width: 420px;
        height: 32px;
        padding: 0 10px;
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        background: var(--surface-sunken);
        color: var(--fg-3);
        font: var(--type-caption);
        overflow: hidden;
        white-space: nowrap;
      }
      .chat-button {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 32px;
        padding: 0 10px;
        border: 1px solid var(--border-strong);
        border-radius: var(--radius-md);
        background: var(--surface);
        font: 500 var(--text-sm) / 1 var(--font-sans);
      }
      .chat-button.on {
        border-color: var(--border-focus);
        background: var(--surface-selected);
      }
      .strip {
        display: flex;
        align-items: stretch;
        gap: 20px;
        min-width: 0;
        padding: 0 16px;
        overflow: hidden;
        border-bottom: 1px solid var(--border);
        background: var(--surface);
      }
      .no-rail .strip {
        gap: var(--space-3);
      }
      .no-rail .strip .figure:last-child {
        display: none;
      }
      .figure {
        display: grid;
        align-content: center;
        gap: 2px;
        padding: 0;
        border: 0;
        background: none;
        text-align: left;
        white-space: nowrap;
        cursor: default;
      }
      .figure .overline {
        font-size: 10px;
      }
      .figure b {
        display: flex;
        align-items: center;
        gap: 6px;
        font: 600 var(--text-sm) / 1.2 var(--font-sans);
      }
      .figure.needs b {
        color: var(--warning-fg);
      }
      button.figure {
        cursor: pointer;
      }
      .count-pill {
        display: inline-grid;
        place-items: center;
        min-width: 18px;
        height: 18px;
        padding: 0 5px;
        border-radius: 9px;
        background: var(--warning);
        color: var(--gray-950);
        font: 700 11px / 1 var(--font-sans);
      }
      .count-pill.quiet {
        background: var(--neutral-subtle);
        color: var(--fg-2);
      }
      .page-area {
        position: relative;
        min-width: 0;
        min-height: 0;
        overflow: hidden;
      }
      .page {
        height: 100%;
        overflow-y: auto;
        padding: 20px var(--pad-page) 32px;
      }
      .narrow .page {
        padding: 16px 16px 28px;
      }
      .crumbs {
        font: var(--type-caption);
        color: var(--fg-3);
      }
      .page-head {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px 10px;
        margin: 4px 0 14px;
      }
      .page-head h1 {
        margin: 0;
        font: 600 var(--text-xl) / 1.3 var(--font-sans);
        letter-spacing: var(--tracking-tight);
      }
      .card {
        border: 1px solid var(--border);
        border-radius: var(--radius-card);
        background: var(--surface);
      }

      /* The Task page in small: the rail, record left, conversation right. */
      .stage-rail {
        display: flex;
        align-items: center;
        gap: 0;
        margin-bottom: 16px;
        padding: 12px 16px;
        overflow-x: auto;
      }
      .stage-rail .st {
        display: grid;
        justify-items: center;
        gap: 4px;
        min-width: 88px;
        font: var(--type-caption);
        color: var(--fg-2);
      }
      .stage-rail .st b {
        font: 500 var(--text-xs) / 1.2 var(--font-sans);
        color: var(--fg-1);
      }
      .stage-rail .mark {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        border: 2px solid var(--border-strong);
        background: var(--surface);
      }
      .stage-rail .mark.done {
        border-color: var(--success);
        background: var(--success);
      }
      .stage-rail .mark.wait {
        border-color: var(--warning);
        background: var(--warning);
      }
      .stage-rail .mark.dropped {
        border-color: var(--fg-3);
        background: var(--fg-3);
      }
      .stage-rail .line {
        flex: 1;
        min-width: 16px;
        height: 2px;
        margin-bottom: 18px;
        background: var(--border-strong);
      }
      .stage-rail .line.done {
        background: var(--success);
      }
      .task-cols {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(360px, 440px);
        gap: var(--gap-panel);
        align-items: start;
      }
      .narrow .task-cols {
        grid-template-columns: minmax(0, 1fr);
      }
      .needs-you {
        margin-bottom: var(--gap-panel);
        padding: var(--pad-card);
        border-color: var(--warning-border);
      }
      .needs-you.clear {
        padding: 12px 16px;
        border-color: var(--border);
      }
      .needs-head {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        margin-bottom: 12px;
      }
      .needs-head h2 {
        margin: 0;
        font: var(--type-card-title);
      }
      .needs-list {
        display: grid;
        gap: 12px;
      }
      .nothing {
        display: flex;
        align-items: center;
        gap: 8px;
        font: var(--type-body-sm);
        color: var(--fg-2);
      }
      .nothing svg {
        color: var(--success);
      }
      .tabs {
        display: flex;
        gap: 2px;
        overflow-x: auto;
        border-bottom: 1px solid var(--border);
      }
      .tab {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 8px 10px;
        border-bottom: 2px solid transparent;
        font: 500 var(--text-sm) / 1.2 var(--font-sans);
        color: var(--fg-2);
        white-space: nowrap;
      }
      .tab.on {
        border-bottom-color: var(--accent);
        color: var(--fg-1);
      }
      .record-stub {
        padding: 14px 16px;
        display: grid;
        gap: 8px;
      }
      .stub-line {
        height: 9px;
        border-radius: var(--radius-full);
        background: var(--border-subtle);
      }
      .fold-row {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 12px 16px;
        border-bottom: 1px solid var(--border-subtle);
        font: var(--type-caption);
        color: var(--fg-2);
      }
      .fold-row b {
        font: var(--type-card-title);
        color: var(--fg-1);
      }

      /* A conversation: tabs, the Thread in Rows, a composer. */
      .conversation {
        display: flex;
        flex-direction: column;
        min-height: 560px;
        overflow: hidden;
      }
      .conv-head {
        padding: 0 8px;
      }
      .conv-tools {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 14px;
        border-bottom: 1px solid var(--border-subtle);
        font: var(--type-caption);
        color: var(--fg-2);
      }
      .thread {
        flex: 1;
        display: grid;
        align-content: start;
        gap: 18px;
        padding: 16px 14px;
        font-size: var(--text-md);
      }
      .turn {
        display: grid;
        grid-template-columns: 28px minmax(0, 1fr);
        gap: 4px 10px;
      }
      .turn > .avatar {
        width: 28px;
        height: 28px;
        font-size: 10px;
      }
      .turn-body {
        display: grid;
        gap: 8px;
        min-width: 0;
      }
      .turn-by {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 4px 8px;
        font: var(--type-caption);
        color: var(--fg-3);
      }
      .turn-by b {
        font: 600 var(--text-sm) / 1.3 var(--font-sans);
        color: var(--fg-1);
      }
      .turn-text {
        max-width: 72ch;
        font: var(--type-body);
      }
      .office-line {
        display: flex;
        gap: 8px;
        align-items: center;
        font: var(--type-caption);
        color: var(--fg-2);
      }
      .office-line::before,
      .office-line::after {
        content: "";
        flex: 1;
        height: 1px;
        background: var(--border-subtle);
      }
      .typing {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font: var(--type-caption);
        color: var(--fg-2);
      }
      .composer {
        display: grid;
        gap: 6px;
        padding: 10px 14px 14px;
        border-top: 1px solid var(--border-subtle);
      }
      .composer .to {
        font: var(--type-caption);
        color: var(--fg-3);
      }
      .composer-box {
        display: flex;
        align-items: flex-end;
        gap: 8px;
        padding: 8px 8px 8px 12px;
        border: 1px solid var(--border-strong);
        border-radius: var(--radius-lg);
        background: var(--surface);
        font: var(--type-body-sm);
        color: var(--fg-3);
      }
      .composer-box span {
        flex: 1;
        padding-bottom: 6px;
      }
      /* The conversation's drawer on a narrow page (spec 4.1 Narrow). */
      .conv-handle {
        position: absolute;
        right: 0;
        top: 96px;
        z-index: 20;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 8px 10px;
        border: 1px solid var(--border-strong);
        border-right: 0;
        border-radius: var(--radius-md) 0 0 var(--radius-md);
        background: var(--surface);
        box-shadow: var(--shadow-2);
        font: 500 var(--text-xs) / 1 var(--font-sans);
        cursor: pointer;
      }
      .conv-drawer {
        position: absolute;
        top: 0;
        right: 0;
        bottom: 0;
        z-index: 25;
        display: flex;
        flex-direction: column;
        width: min(440px, 100%);
        border-left: 1px solid var(--border);
        background: var(--surface);
        box-shadow: var(--shadow-3);
      }
      .conv-drawer .conversation {
        flex: 1;
        min-height: 0;
        border: 0;
        border-radius: 0;
      }
      .conv-drawer .thread {
        overflow-y: auto;
      }
      .drawer-head {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 8px 8px 14px;
        border-bottom: 1px solid var(--border-subtle);
        font: var(--type-card-title);
      }

      /* Now and the Needs you panel. */
      .now-cols {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: var(--gap-panel);
        align-items: start;
      }
      .narrow .now-cols {
        grid-template-columns: minmax(0, 1fr);
      }
      .now-col {
        padding: 14px 16px;
        display: grid;
        gap: 12px;
        align-content: start;
      }
      .now-col h2 {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 0;
        font: var(--type-card-title);
      }
      .entry {
        display: grid;
        gap: 8px;
      }
      .entry-line {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 4px 8px;
        font: var(--type-caption);
        color: var(--fg-2);
      }
      .entry-line .entry-kind {
        font-weight: 600;
        color: var(--fg-1);
      }
      .entry-title {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 4px 8px;
        font: var(--type-card-title);
      }
      .row-stub {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 0;
        border-bottom: 1px solid var(--border-subtle);
        font: var(--type-body-sm);
      }
      .backdrop {
        position: absolute;
        inset: 0;
        z-index: 40;
        background: var(--overlay);
      }
      .side-panel {
        position: absolute;
        top: 0;
        right: 0;
        bottom: 0;
        z-index: 45;
        display: flex;
        flex-direction: column;
        width: min(560px, 100%);
        border-left: 1px solid var(--border);
        background: var(--bg);
        box-shadow: var(--shadow-3);
      }
      .side-panel-head {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 10px 10px 16px;
        border-bottom: 1px solid var(--border);
        background: var(--surface);
      }
      .side-panel-head h2 {
        margin: 0;
        font: var(--type-section-title);
      }
      .side-panel-body {
        flex: 1;
        overflow-y: auto;
        display: grid;
        align-content: start;
        gap: 18px;
        padding: 16px;
      }
      .group-title {
        font: var(--type-overline);
        letter-spacing: var(--tracking-caps);
        text-transform: uppercase;
        color: var(--fg-3);
      }

      /* The Initiative page in small. */
      .init-cols {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(380px, 520px);
        gap: var(--gap-panel);
        align-items: start;
      }
      .narrow .init-cols {
        grid-template-columns: minmax(0, 1fr);
      }
      .person-tab-intro {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 14px;
        border-bottom: 1px solid var(--border-subtle);
        font: var(--type-caption);
        color: var(--fg-2);
      }
      .person-tab-intro b {
        display: block;
        font: var(--type-card-title);
        color: var(--fg-1);
      }

      /* The chat drawer (docs/design/chat-drawer.html). */
      .with-drawer {
        position: absolute;
        inset: 0;
        display: grid;
        grid-template-columns: minmax(0, 1fr) 420px;
      }
      .with-drawer.over {
        grid-template-columns: minmax(0, 1fr);
      }
      .chat-drawer {
        display: flex;
        flex-direction: column;
        min-height: 0;
        border-left: 1px solid var(--border);
        background: var(--surface);
      }
      .with-drawer.over .chat-drawer {
        position: absolute;
        top: 0;
        right: 0;
        bottom: 0;
        z-index: 30;
        width: min(420px, 100%);
        box-shadow: var(--shadow-3);
      }
      .chat-drawer.fills {
        position: absolute;
        inset: 0;
        z-index: 30;
        border-left: 0;
      }
      .chat-drawer .thread {
        overflow-y: auto;
      }
      .chat-tabs {
        display: flex;
        gap: 4px;
        padding: 6px 10px;
        border-bottom: 1px solid var(--border-subtle);
        overflow-x: auto;
      }
      .chat-tab {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 8px;
        border-radius: var(--radius-md);
        font: 500 var(--text-xs) / 1.2 var(--font-sans);
        color: var(--fg-2);
        white-space: nowrap;
      }
      .chat-tab.on {
        background: var(--surface-selected);
        color: var(--fg-1);
      }
      .thread-row {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 14px;
        border-bottom: 1px solid var(--border-subtle);
        font: var(--type-caption);
        color: var(--fg-2);
      }
      .thread-row b {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
        font: 600 var(--text-sm) / 1.3 var(--font-sans);
        color: var(--fg-1);
      }
      .chat-drawer .thread,
      .conv-drawer .thread {
        min-height: 0;
      }
      .scroll-form .context-block:first-child {
        margin-top: 18px;
      }
      .behind {
        position: relative;
        min-width: 0;
        min-height: 0;
        overflow: hidden;
      }

      /* The shell's grid: without the rail (at 390px) the top bar, strip and page keep their column. */
      .topbar,
      .strip,
      .page-area {
        grid-column: 2;
      }
      .topbar .rail-mark {
        flex: none;
        margin: 0;
      }
      .win {
        z-index: 51;
      }
      .stage-rail .mark.live {
        border-color: var(--info);
        background: var(--info);
      }
      .drawer-head .muted,
      .entry-title .muted {
        font: var(--type-caption);
      }
      .person-tab-intro > div {
        min-width: 0;
      }
      .reference code {
        font-size: var(--text-xs);
      }
    </style>
  </head>
  <body>
    <header class="bar" id="bar"></header>
    <main class="stage">
      <p class="scenario-note" id="note"></p>
      <div class="frame-row">
        <div class="frame w-wide" id="frame"></div>
      </div>
      <section class="reference" id="reference"></section>
    </main>
    <script>
      "use strict";

      /* ---------- Icons (lucide, as packages/ui's Icon draws them) ---------- */
      const ICON_PATHS = {
        check: '<path d="M20 6 9 17l-5-5"/>',
        x: '<path d="M18 6 6 18M6 6l12 12"/>',
        link: '<path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>',
        users: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>',
        paperclip: '<path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"/>',
        "chevron-right": '<path d="m9 18 6-6-6-6"/>',
        "chevron-left": '<path d="m15 18-6-6 6-6"/>',
        "chevron-down": '<path d="m6 9 6 6 6-6"/>',
        plus: '<path d="M12 5v14M5 12h14"/>',
        rotate: '<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/>',
        alert: '<path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4M12 17h.01"/>',
        file: '<path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/>',
        shield: '<path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/>',
        home: '<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
        board: '<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18M15 3v18"/>',
        sliders: '<path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/>',
        message: '<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',
        search: '<circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/>',
        target: '<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>',
        task: '<rect x="3" y="3" width="18" height="18" rx="2"/><path d="m8 12 3 3 5-6"/>',
        send: '<path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/>',
      };
      function icon(name, size = 14) {
        return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON_PATHS[name]}</svg>`;
      }
      function esc(text) {
        return String(text)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      /* ---------- People (names and titles for display) ---------- */
      const PEOPLE = {
        jim: { name: "Jim", title: "Developer", initials: "JH" },
        angela: { name: "Angela", title: "Planner", initials: "AM" },
        michael: { name: "Michael", title: "CTO", initials: "MS" },
        pam: { name: "Pam", title: "Office Manager", initials: "PB" },
      };
      function avatar(key, size = "xs") {
        if (key === null) return `<span class="avatar ${size} tint-office">O</span>`;
        if (key === "you") return `<span class="avatar ${size} tint-you">You</span>`;
        return `<span class="avatar ${size} tint-${key}">${PEOPLE[key].initials}</span>`;
      }
      function personTag(key) {
        const name = key === null ? "The Office" : PEOPLE[key].name;
        return `<span class="person-tag">${avatar(key)}${name}</span>`;
      }

      /* Who asks, by place: the Task's developer, the Initiative's planner, the CTO in their chat. */
      const PLACE_ASKER = { task: "jim", thread: "jim", panel: "jim", initiative: "angela", chat: "michael" };
      const TASK_TITLE = "Conflict resolution screen";
      const INITIATIVE_TITLE = "Offline sync";

      /* ---------- The questions each scenario asks ---------- */
      const ONE_CHOICE = {
        lead: "The drafts store is the last piece before offline editing works end to end.",
        context: "Offline drafts need a store that survives a reload and holds pictures. Both work in every browser the app supports.",
        questions: [
