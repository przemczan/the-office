          lines.push(`<p>${esc(asker)} is still answering. Answer once they finish.</p>`);
        }
        if (!d.office && ctx.place !== "panel") {
          const where = ctx.place !== "chat" ? "in the Thread" : ctx.slot === "win" ? "in the chat" : "below";
          lines.push(`<p>A question first? Ask ${esc(asker)} ${where}; the Decision stays open.</p>`);
        }
        return lines.length ? `<div class="dhints">${lines.join("")}</div>` : "";
      }

      /* The whole form, answered in place. */
      function wholeForm(d, ctx) {
        const draft = draftOf(d);
        const n = d.questions.length;
        let html = d.questions.map((q, i) => questionBlock(d, i, ctx, { numbered: n > 1 })).join("");
        if (draft.step === "ask-again") {
          html += askAgainStep(d, ctx);
        } else {
          html += `<div class="general">${generalField(d, ctx)}</div>`;
          html += refusedAlert(d);
          html += `<div class="dactions">${submitControl(d, ctx)}${askAgainControl(d, ctx)}${n > 1 ? progressLine(d, ctx) : ""}</div>`;
        }
        return html + hints(d, ctx);
      }

      /* The compact card: a long form, or one with Attachments, in brief, with Open details. */
      function compactBody(d, ctx) {
        const q = d.questions[0];
        const n = d.questions.length;
        const asker = askerName(d);
        const touched = changes(d) > 0;
        let html = `<div class="compact-first"><span class="overline">${n > 1 ? `Question 1 of ${n}` : "The question"}</span><p class="q-text">${esc(q.text)}</p>`;
        if (q.kind === "choice") {
          html += `<p class="rec-line">${icon("check", 14)}${esc(q.options[q.recommended])}<span class="badge sm accent">Recommended</span></p>`;
          html += `<p class="why"><b>${esc(asker)} recommends it:</b> ${esc(q.reason)}</p>`;
        } else {
          html += `<p class="why">Answered in words.</p>`;
        }
        html += `</div>`;
        const more = [];
        const rest = n - 1;
        if (rest > 0) {
          const open = d.questions.slice(1).filter((x) => x.kind === "open").length;
          more.push(`${rest} more question${rest > 1 ? "s" : ""}${open ? `, ${open} of them open question${open > 1 ? "s" : ""}` : ""}`);
        }
        if (d.attachments.length) {
          const count = d.attachments.length;
          more.push(`${icon("paperclip", 12)} ${count} Attachment${count > 1 ? "s" : ""} to look at in Open details`);
        }
        if (more.length) html += `<p class="compact-more">${more.join(" · ")}</p>`;
        html += refusedAlert(d);
        const accept = everyQuestionAChoice(d) && !touched;
        const reason = stillAnswering(ctx.place) ? `${asker} is still answering. Answer once they finish.` : null;
        let actions = "";
        if (accept) {
          actions += withTip(
            `<button class="btn primary" data-action="accept" data-id="${d.id}"${reason ? " disabled" : ""}>${icon("check", 13)} Accept</button>`,
            reason,
          );
          actions += `<button class="btn secondary" data-action="open-details" data-id="${d.id}">Open details</button>`;
        } else {
          actions += `<button class="btn primary" data-action="open-details" data-id="${d.id}">Open details</button>`;
        }
        if (touched) actions += `<span class="badge info">Draft kept · ${changes(d)} change${changes(d) > 1 ? "s" : ""}</span>`;
        if (n > 1) actions += progressLine(d, ctx);
        html += `<div class="dactions">${actions}</div>`;
        return html + hints(d, ctx);
      }

      /* The card in Needs you, in a chat or in an Initiative's Thread: answered there. */
      function formCard(d, ctx) {
        const compact = isCompact(d);
        let html = ctx.headless ? "" : cardHead(d, ctx);
        html += onLine(d, ctx);
        html += requestLine(d);
        html += contextLine(d, { firstLineOnly: compact });
        html += consultationNote(d);
        html += compact ? compactBody(d, ctx) : wholeForm(d, ctx);
        const flash = state.flash === `${ctx.slot}-${d.id}` ? " flash" : "";
        return `<section class="dcard${flash}" id="card-${ctx.slot}-${d.id}" aria-label="Decision">${html}</section>`;
      }

      /* In short, in a Task's Thread while it waits: the way to Needs you. */
      function shortCard(d, ctx) {
        const n = d.questions.length;
        const first = d.kind === "request" ? `Asked you to: ${d.questions[0].text}` : d.questions[0].text;
        const lead = n > 1 ? `${n} questions, starting with: ` : "";
        const waits = d.putTo
          ? `Waiting on ${PEOPLE[d.putTo].name} in a Consultation. <button class="link" data-action="go-needs-you" data-id="${d.id}">Take it over in Needs you</button> · <button class="link" data-action="toast" data-words="Opens the Consultation in Michael's tab">Open the Consultation</button>`
          : `Waits on you. <button class="link" data-action="go-needs-you" data-id="${d.id}">Answer it in Needs you</button>`;
        return `<section class="dcard dshort" aria-label="Decision">${cardHead(d, ctx)}<p class="dshort-q">${esc(lead)}${esc(first)}</p><p class="dshort-line">${waits}</p></section>`;
      }

      /* Answered, asked again or closed: read-only, where it was asked. */
      function answeredByWords(d) {
        const by = d.result.by;
        if (by === "ana") return "Answered by Ana";
        if (by === "consultant") {
          return `Answered by Michael in a Consultation · <button class="link" data-action="toast" data-words="Opens the Consultation in Michael's tab">Open the Consultation</button>`;
        }
        if (by === "pam") {
          return `Answered by Pam <button class="link" data-action="toast" data-words="Opens your chat with Pam, at the message that asked">at your request</button>`;
        }
        return "Answered by you";
      }
      function answerItem(d, index) {
        const q = d.questions[index];
        const a = d.result.answers[index];
        let answer;
        let comment = a.comment.trim();
        if (q.kind === "choice" && typeof a.pick === "number") {
          const tag = a.pick === q.recommended ? ` <span class="tag">(recommended)</span>` : "";
          answer = `${esc(q.options[a.pick])}${tag}`;
        } else if (q.kind === "choice") {
          answer = esc(comment);
          comment = "";
        } else {
          answer = esc(a.words);
        }
        const commentLine = comment ? `<p class="qa-c"><b>Comment:</b> ${esc(comment)}</p>` : "";
        return `<li class="qa"><span class="q-num answered">${index + 1}</span><p class="qa-q">${esc(q.text)}</p><p class="qa-a">${answer}</p>${commentLine}</li>`;
      }
      function unansweredItem(d, index) {
        return `<li class="qa"><span class="q-num">${index + 1}</span><p class="qa-q">${esc(d.questions[index].text)}</p><p class="qa-a unanswered">Not answered</p></li>`;
      }
      function settledCard(d, ctx) {
        const n = d.questions.length;
        const all = showAll.has(d.id) || n <= 3;
        const shown = all ? n : 3;
        const answered = d.status === "answered";
        let items = "";
        for (let i = 0; i < shown; i += 1) items += answered ? answerItem(d, i) : unansweredItem(d, i);
        let html = cardHead(d, ctx) + onLine(d, ctx) + requestLine(d) + contextLine(d, { firstLineOnly: true });
        if (d.kind !== "request" || answered) html += `<ol class="qa-list">${items}</ol>`;
        if (!all) html += `<button class="text-button show-all" data-action="show-all" data-id="${d.id}">${icon("chevron-down", 12)} Show all ${n}</button>`;
        if (answered && d.result.general) html += `<p class="qa-general"><b>General comment:</b> ${esc(d.result.general)}</p>`;
        if (answered) {
          html += `<p class="outcome">${icon("check", 13)}<span>${answeredByWords(d)} · ${d.result.at}</span></p>`;
        } else if (d.status === "asked-again") {
          const words = d.result.general ? `: <span class="outcome-words">${esc(d.result.general)}</span>` : ", with no comment";
          html += `<p class="outcome asked-again">${icon("rotate", 13)}<span>Asked again by you · ${d.result.at}${words}</span></p>`;
        } else {
          html += `<p class="outcome closed">${icon("x", 13)}<span>Closed: the Task was dropped · ${d.result.at}</span></p>`;
        }
        if (d.result.pending) html += `<div class="dhints"><p class="reach">Reaches ${esc(askerName(d))} when this turn ends.</p></div>`;
        return `<section class="dcard settled" aria-label="Decision">${html}</section>`;
      }

      /* The approval of a call past a Hard switch: its own card, beside a form, never in one. */
      function approvalCard(a, { headless = false } = {}) {
        const head = headless
          ? ""
          : `<div class="dcard-head"><span class="badge${a.status === "open" ? " danger" : ""}">${icon("shield", 11)} Approval</span>${personTag("jim")}<span>· in ${esc(a.from)}</span><span class="when">asked ${a.askedAt}</span></div>`;
        let foot;
        if (a.status === "open") {
          foot = `<div class="dactions"><button class="btn primary" data-action="allow" data-id="${a.id}">Allow once</button><button class="btn secondary" data-action="deny" data-id="${a.id}">Deny</button></div>`;
        } else {
          const allowed = a.status === "allowed";
          foot = `<p class="outcome${allowed ? "" : " closed"}">${icon(allowed ? "check" : "x", 13)}<span>${allowed ? "Allowed once" : "Denied"} by you · 10:58</span></p>`;
        }
        const id = headless ? "" : ` id="card-needs-${a.id}"`;
        const flash = !headless && state.flash === `needs-${a.id}` ? " flash" : "";
        return `<section class="acard${a.status === "open" ? "" : " settled"}${flash}"${id} aria-label="Approval">${head}<p class="acard-call">Jim asks to: ${esc(a.call)}</p><pre class="code-block code">${esc(a.command)}</pre><p class="why"><b>Why Jim needs it:</b> ${esc(a.why)}</p><p class="acard-switch">${icon("shield", 12)}<span>Past the Hard switch Run installs: “${esc(a.hardSwitch)}” Nobody holds Devops, so it comes to you. Allow once lets this one call run; Deny means Jim goes on without it.</span></p>${foot}</section>`;
      }

      /* ---------- Attachments ---------- */
      function pictureArt(art) {
        const bar = (x, y, w, tone = "var(--border-strong)") => `<rect x="${x}" y="${y}" width="${w}" height="4" rx="2" style="fill:${tone}"/>`;
        const pane = (x, y, w, h) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="4" style="fill:var(--surface-sunken);stroke:var(--border)"/>`;
        let body = `<rect width="160" height="100" style="fill:var(--surface)"/><rect width="160" height="14" style="fill:var(--surface-sunken)"/>`;
        body += bar(8, 5, 40, "var(--fg-3)");
        if (art === "side") {
          body += pane(8, 22, 68, 70) + pane(84, 22, 68, 70);
          body += bar(14, 30, 40, "var(--accent)") + bar(14, 40, 54) + bar(14, 48, 46) + bar(14, 56, 50);
          body += bar(90, 30, 40, "var(--info)") + bar(90, 40, 50) + bar(90, 48, 54) + bar(90, 56, 38);
        } else {
          body += pane(8, 22, 144, 32) + pane(8, 60, 144, 32);
          body += bar(14, 30, 50, "var(--accent)") + bar(14, 40, 120);
          body += bar(14, 68, 50, "var(--info)") + bar(14, 78, 110);
        }
        return `<svg viewBox="0 0 160 100" role="img" aria-label="Screenshot">${body}</svg>`;
      }
      function attachmentsBlock(d) {
        if (!d.attachments.length) return "";
        const pictures = d.attachments
          .filter((a) => a.kind === "picture")
          .map((a) => `<button class="thumb" data-action="toast" data-words="Opens ${esc(a.name)} in the Attachment viewer">${pictureArt(a.art)}<span>${esc(a.name)}</span></button>`)
          .join("");
        const files = d.attachments
          .filter((a) => a.kind !== "picture")
          .map((a) => `<button class="file-chip" data-action="toast" data-words="Opens ${esc(a.name)} in the document window">${icon("file", 13)}${esc(a.name)}</button>`)
          .join("");
        return `<div class="thumbs">${pictures}</div>${files ? `<div class="thumbs">${files}</div>` : ""}`;
      }

      /* ---------- The Large window: Open details ---------- */
      function qrowState(d, index) {
        const q = d.questions[index];
        const a = draftOf(d).answers[index];
        if (q.kind === "choice") {
          if (typeof a.pick === "number") return `${q.options[a.pick]}${a.pick === q.recommended ? " (recommended)" : ""}`;
          return a.comment.trim() ? `In words: ${a.comment.trim()}` : "Needs an answer in words";
        }
        return a.words.trim() ? a.words.trim() : "Needs an answer";
      }
      function contextBlock(d) {
        const draft = draftOf(d);
        const label = d.attachments.length ? `Context and ${d.attachments.length} Attachments` : "Context";
        const fold = `<button class="text-button" data-action="toggle-context" data-id="${d.id}" aria-expanded="${draft.contextOpen}">${icon(draft.contextOpen ? "chevron-down" : "chevron-right", 12)} ${label}</button>`;
        if (!draft.contextOpen) return `<div class="context-block">${fold}</div>`;
        return `<div class="context-block">${fold}${contextLine(d)}${consultationNote(d)}${attachmentsBlock(d)}</div>`;
      }
      function splitBody(d, ctx) {
        const draft = draftOf(d);
        const n = d.questions.length;
        const current = draft.current;
        const rows = d.questions
          .map((q, i) => {
            const ok = isAnswered(q, draft.answers[i]);
            return `<button class="qrow" data-action="win-go" data-q="${i}" aria-current="${i === current}">${qNumber(d, i)}<span class="qrow-text">${esc(q.text)}</span><span class="qrow-state${ok ? "" : " missing"}" data-live="${d.id}" data-kind="qrow" data-q="${i}">${esc(qrowState(d, i))}</span></button>`;
          })
          .join("");
        const list = `<nav class="qlist" aria-label="Questions" data-scroll="qlist"><div class="qlist-head">${progressLine(d, ctx)}</div>${rows}</nav>`;
        const numbers = d.questions
          .map((q, i) => {
            const ok = isAnswered(q, draft.answers[i]);
            return `<button class="${ok ? "answered" : "missing"}" data-action="win-go" data-q="${i}" aria-current="${i === current}" aria-label="Question ${i + 1}" data-live="${d.id}" data-kind="strip">${i + 1}</button>`;
          })
          .join("");
        const strip = `<div class="qstrip">${progressLine(d, ctx)}<div class="qstrip-row">${numbers}</div></div>`;
        const previous = `<button class="btn secondary" data-action="win-go" data-q="${current - 1}"${current === 0 ? " disabled" : ""}>${icon("chevron-left", 14)} Previous</button>`;
        const next = current < n - 1 ? `<button class="btn secondary" data-action="win-go" data-q="${current + 1}">Next ${icon("chevron-right", 14)}</button>` : "";
        const question = `<span class="overline">Question ${current + 1} of ${n}</span>${questionBlock(d, current, ctx, { numbered: false })}`;
        return `<div class="split">${list}${strip}<div class="detail" data-scroll="detail"><div class="detail-inner">${contextBlock(d)}${question}<div class="detail-nav">${previous}${next}</div></div></div></div>`;
      }
      function scrollBody(d, ctx) {
        const several = d.questions.length > 1;
        const questions = d.questions.map((q, i) => questionBlock(d, i, ctx, { numbered: several })).join("");
        const progress = several ? `<div class="progress-bar">${progressLine(d, ctx)}</div>` : "";
        return `<div class="scroll-form" data-scroll="scroll-form"><div class="scroll-form-inner">${progress}${contextBlock(d)}${questions}</div></div>`;
      }
      function windowFoot(d, ctx) {
        const draft = draftOf(d);
        if (draft.step === "ask-again") {
          const field = textField({
            d,
            field: "general",
            label: `What should ${askerName(d)} explain or change?`,
            optional: true,
            placeholder: "Your general comment, sent alone",
            value: draft.general,
            slot: ctx.slot,
          });
          return `<div class="win-foot"><div class="win-step">${field}<p class="step-note">Sends this comment and no answers. Your picks stay here as a draft until you send.</p></div><div class="win-actions"><div class="win-actions-start"><button class="btn primary" data-action="ask-again-confirm" data-id="${d.id}">${icon("rotate", 13)} Ask me again</button><button class="btn secondary" data-action="cancel-step" data-id="${d.id}">Cancel</button></div><button class="btn secondary" data-action="close-window">Close</button></div></div>`;
        }
        return `<div class="win-foot"><div class="win-step">${generalField(d, ctx, { oneLine: true })}${refusedAlert(d)}${hints(d, ctx)}</div><div class="win-actions"><div class="win-actions-start">${submitControl(d, ctx)}${askAgainControl(d, ctx)}</div><button class="btn secondary" data-action="close-window">Close</button></div></div>`;
      }
      function windowLayer() {
        const d = findDecision(state.window);
        if (!d || d.status !== "open") return "";
        const ctx = { place: state.place, slot: "win" };
        const n = d.questions.length;
        const where = state.place === "initiative" ? INITIATIVE_TITLE : state.place === "chat" ? "In your chat with Michael" : TASK_TITLE;
        const putTo = d.putTo ? `<span>to</span>${personTag(d.putTo)}` : "";
        const head = `<div class="win-head"><span class="badge warning">Decision</span><h2>${esc(where)}</h2>${personTag(askerKey(d))}${putTo}<span>· ${n} question${n > 1 ? "s" : ""} · asked ${d.askedAt}</span><span class="grow"></span><button class="icon-button" data-action="close-window" aria-label="Close">${icon("x", 16)}</button></div>`;
        const body = state.layout === "list" && n > 1 ? splitBody(d, ctx) : scrollBody(d, ctx);
        return `<div class="win-layer" data-action="close-window"></div><div class="win" role="dialog" aria-modal="true" aria-label="Decision">${head}<div class="win-body">${body}</div>${windowFoot(d, ctx)}</div>`;
      }

      /* ---------- The Thread ---------- */
      /* An approval is never here: it waits in its Stage's Thread, as this Thread already holds a Decision. */
      function threadItems() {
        return world.decisions.map((d) => ({ who: askerKey(d), at: d.askedAt, text: d.lead, decision: d }));
      }
      function decisionInThread(d, place) {
        const ctx = { place, slot: "thread" };
        if (d.status !== "open") return settledCard(d, ctx);
        if (place === "task" || place === "thread") return shortCard(d, ctx);
        return formCard(d, ctx);
      }
      function renderTurn(item, place) {
        const name = item.who === null ? "The Office" : PEOPLE[item.who].name;
        const title = item.who === null ? "" : `<span>${PEOPLE[item.who].title}</span>`;
        const card = item.decision ? decisionInThread(item.decision, place) : "";
        const text = item.text ? `<p class="turn-text">${esc(item.text)}</p>` : "";
        return `<div class="turn">${avatar(item.who, "")}<div class="turn-body"><div class="turn-by"><b>${name}</b>${title}<span>${item.at}</span></div>${text}${card}</div></div>`;
      }
      function threadHtml(place, scrollKey, extraBefore = "") {
        let html = extraBefore + threadItems().map((item) => renderTurn(item, place)).join("");
        if (world.answering || world.typing) {
          html += `<p class="typing"><span class="dot live"></span>${PEOPLE[PLACE_ASKER[place]].name} is answering…</p>`;
        }
        return `<div class="thread" data-scroll="${scrollKey}">${html}</div>`;
      }
      function composer(key) {
        const name = PEOPLE[key].name;
        return `<div class="composer"><span class="to">To ${name}</span><div class="composer-box"><span>Message ${name}…</span>${withTip(`<button class="btn primary sm" disabled aria-label="Send">${icon("send", 13)}</button>`, "Write a message first")}</div></div>`;
      }

      /* ---------- Places ---------- */
      function waitingDecisions() {
        return state.place === "chat" ? [] : world.decisions.filter((d) => d.status === "open");
      }
      function waitingApprovals() {
        return ["task", "thread", "panel"].includes(state.place) ? world.approvals.filter((a) => a.status === "open") : [];
      }
      function waitingCount() {
        return waitingDecisions().length + waitingApprovals().length;
      }
      function railNav() {
        const on = state.place === "panel" || state.place === "chat" ? "home" : "board";
        const items = [
          ["home", "Now"],
          ["board", "Work"],
          ["users", "People"],
          ["sliders", "Settings"],
        ];
        return `<nav class="rail" aria-label="Main"><span class="rail-mark">O</span>${items.map(([name, label]) => `<span class="rail-item${name === on ? " on" : ""}" title="${label}">${icon(name, 18)}</span>`).join("")}</nav>`;
      }
      function topBar() {
        const small = state.width === "390";
        return `<header class="topbar">${small ? `<span class="rail-mark">O</span>` : ""}<div class="search">${icon("search", 14)}<span>Search Tasks, Initiatives and people</span></div><span class="grow"></span><span class="chat-button${state.place === "chat" ? " on" : ""}">${icon("message", 14)}${small ? "" : " Chat"}</span></header>`;
      }
      function statusStrip() {
        const count = waitingCount();
        const needs = `<button class="figure${count ? " needs" : ""}" data-action="toggle-panel"><span class="overline">Needs you</span><b><span class="count-pill${count ? "" : " quiet"}">${count}</span>${count ? "waiting" : "nothing"}</b></button>`;
        return `<div class="strip">${needs}<div class="figure"><span class="overline">Claude Code</span><b>41% of 5 h</b></div><div class="figure"><span class="overline">Desks</span><b>2 of 4 busy</b></div><div class="figure"><span class="overline">Tokens today</span><b>1.2M</b></div></div>`;
      }
      function stubLines(widths) {
        return widths.map((w) => `<span class="stub-line" style="width:${w}%"></span>`).join("");
      }
      function stageRail() {
        const office = world.decisions.some((d) => d.office && d.status === "open");
        const waiting = waitingCount() > 0;
        const at = office ? 2 : 1;
        const marks = [
          ["Plan", "Angela"],
          ["Build", "Jim"],
          ["Review", "Oscar"],
          ["Your review", "waits for you"],
          ["Publish", "publish"],
        ].map(([name, who], i) => {
          let tone = "";
          if (i < at) tone = "done";
          else if (i === at) tone = world.dropped ? "dropped" : waiting ? "wait" : "live";
          return `<div class="st"><span class="mark ${tone}"></span><b>${name}</b><span>${i === at && waiting ? "waits on you" : who}</span></div>`;
        });
        const lines = (i) => `<span class="line${i <= at ? " done" : ""}"></span>`;
        return `<div class="card stage-rail" aria-label="Pipeline">${marks.map((m, i) => (i === 0 ? m : lines(i) + m)).join("")}</div>`;
      }
      function needsYou() {
        const decisions = waitingDecisions();
        const approvals = waitingApprovals();
        if (!decisions.length && !approvals.length) {
          return `<section class="card needs-you clear" id="needs-you" aria-label="Needs you"><p class="nothing">${icon("check", 16)} Nothing waits on you on this Task.</p></section>`;
        }
        const ctx = { place: state.place, slot: "needs" };
        const cards = decisions.map((d) => formCard(d, ctx)).join("") + approvals.map((a) => approvalCard(a)).join("");
        return `<section class="card needs-you" id="needs-you" aria-label="Needs you"><div class="needs-head"><h2>Needs you</h2><span class="count-pill">${decisions.length + approvals.length}</span></div><div class="needs-list">${cards}</div></section>`;
      }
      function taskConversation(scrollKey) {
        const live = world.answering || world.typing ? `<span class="dot live"></span>` : "";
        return `<div class="tabs conv-head"><span class="tab">${avatar("angela")} Angela</span><span class="tab on">${avatar("jim")} Jim ${live}</span></div><div class="conv-tools"><span>Jim's Thread on this Task</span><span class="grow"></span><span>Details</span></div>${threadHtml(state.place, scrollKey)}${composer("jim")}`;
      }
      function narrowDrawer(title, inner) {
        if (state.width === "wide") return "";

          render();
        },
        "win-go": (t) => {
          const d = findDecision(state.window);
          const index = Number(t.dataset.q);
          if (!d || index < 0 || index >= d.questions.length) return;
          draftOf(d).current = index;
          if (state.layout === "scroll") state.scrollTo = `#q-win-${d.id}-${index}`;
          render();
          const detail = document.querySelector(".detail");
          if (detail && state.layout === "list") detail.scrollTop = 0;
          focusQuestion(document.getElementById(`q-win-${d.id}-${index}`));
        },
        "toggle-context": (t, d) => {
          const draft = draftOf(d);
          draft.contextOpen = !draft.contextOpen;
          render();
        },
        jump: (t, d, q) => jumpTo(d, q, t.dataset.slot),
        "show-all": (t, d) => {
          showAll.add(d.id);
          render();
        },
        "go-needs-you": (t) => goToNeedsYou(t.dataset.id),
        "toggle-conv": () => {
          state.convOpen = !state.convOpen;
          render();
        },
        "toggle-panel": () => {
          state.panelOpen = !state.panelOpen;
          render();
        },
        "close-panel": () => {
          state.panelOpen = false;
          render();
        },
        allow: (t) => settleApproval(t.dataset.id, "allowed"),
        deny: (t) => settleApproval(t.dataset.id, "denied"),
        "copy-link": () => say("Link copied"),
        toast: (t) => say(t.dataset.words),
      };
      document.addEventListener("click", (event) => {
        const target = event.target.closest("[data-action]");
        if (!target || target.disabled) return;
        const handler = ACTIONS[target.dataset.action];
        if (!handler) return;
        const d = target.dataset.id ? findDecision(target.dataset.id) || null : null;
        const q = target.dataset.q === undefined ? null : Number(target.dataset.q);
        handler(target, d, q);
      });
      document.addEventListener("change", (event) => {
        const el = event.target;
        if (!el.matches('input[type="radio"][data-id]')) return;
        const d = findDecision(el.dataset.id);
        if (!d) return;
        const answer = draftOf(d).answers[Number(el.dataset.q)];
        answer.pick = el.value === "none" ? "none" : Number(el.value);
        if (answer.pick === "none") state.focus = `#${el.closest(".q").id} textarea[data-field="comment"]`;
        render();
      });
      document.addEventListener("input", (event) => {
        const el = event.target;
        if (!el.matches("textarea[data-field]")) return;
        const d = findDecision(el.dataset.id);
        if (!d) return;
        const draft = draftOf(d);
        if (el.dataset.field === "general") draft.general = el.value;
        else draft.answers[Number(el.dataset.q)][el.dataset.field] = el.value;
        refreshLive(d);
      });
      /* Esc closes one thing: the window's step, then the window, then the side panel opened last. */
      document.addEventListener("keydown", (event) => {
        if (event.key !== "Escape") return;
        if (state.window) {
          const d = findDecision(state.window);
          if (d && draftOf(d).step) draftOf(d).step = null;
          else state.window = null;
        } else if (state.panelOpen) {
          state.panelOpen = false;
        } else if (state.convOpen && state.width !== "wide") {
          state.convOpen = false;
        } else {
          return;
        }
        render();
      });

      /* ---------- Under the frame: what the parts are ---------- */
      const REFERENCE = `
        <div>
          <h2>The card, top to bottom</h2>
          <ul>
            <li><b>Head:</b> the Decision badge (amber while it waits), who asks (The Office has its own mark), “to” and the Consultant when put to one, “· 3 questions”, when it was asked, Copy link on a Task.</li>
            <li><b>Context</b> at reading width; a Request reads “Asked you to: …” instead.</li>
            <li><b>Each question</b>, numbered when there are several. Its number turns green once answered and is dashed amber while it needs an answer. A choice is <code>RadioList</code>: one boxed line per option, the recommended one preselected with a “Recommended” <code>Badge</code>, then “None of these: answer in words”, then “Jim recommends “…”: why”. An open question is a <code>Textarea</code>. Under each, <b>Add a comment</b> (a <code>TextButton</code>) opens its comment.</li>
            <li><b>General comment</b>, always shown, optional.</li>
            <li><b>Submit</b> (primary), <b>Ask me again</b>, and with several questions the <b>progress line</b> at the right: “2 of 3 answered”, a small meter, and “Question 3 needs an answer”, which jumps there.</li>
            <li><b>Hints</b> in small type: still answering, reaches when the turn ends, “A question first? Ask Jim in the Thread”.</li>
          </ul>
        </div>
        <div>
          <h2>Compact card and the window</h2>
          <p><b>Compact</b> when the form has <b>more than 3 questions or any Attachment</b> (the threshold, open for the Gate). It shows the context's first line, question 1 with its recommendation and reason, how many follow, and <b>Open details</b>; <b>Accept</b> too while every question is a choice and nothing was changed. Once the draft differs, Accept goes and a “Draft kept · 2 changes” badge shows, so one click never throws away what was picked.</p>
          <p><b>Open details</b> is a Large <code>Dialog</code> of one height: the questions on the left, each with its answer so far, the picked one on the right with Previous and Next; the context folds above it. Under 900px the list becomes a row of numbers above the question. The general comment, Submit, Ask me again and Close are in the bar; Ask me again's step opens over it.</p>
          <p><b>One scrolling form</b> is the alternative for the Gate: the same form as in place, numbered, with the progress line pinned at the top.</p>
        </div>
        <div>
          <h2>Drafts</h2>
          <p>A form's picks and words are kept per Decision, in this browser, while the user moves between Needs you, the panel, Now and the window: the same draft shows wherever the card does. Closing the window keeps it, so the window doesn't ask “Close without saving?”: this is its exception to spec 4.1, which lets a window say otherwise. Submit and Ask me again end the draft; a refused send keeps it.</p>
          <h2>The approval</h2>
          <p>A call past a Hard switch stays a card of its own, red-edged, with the command whole, why, the Hard switch's words, and <b>Allow once</b> and <b>Deny</b>. It has no comment, no Ask me again and never joins a form; it sits beside the form in Needs you and the Needs you panel. A Thread on a Task holds one Decision at a time, a form counting as one, so the approval waits in another Thread on the Task, its Stage's, which its head names (“· in Build”).</p>
        </div>
        <div>
          <h2>Words</h2>
          <table>
            <tr><th>Where</th><th>Words</th></tr>
            <tr><td>Submit, a question unanswered</td><td>“Answer question 3 first”; one question: “Pick an option or write your answer first”</td></tr>
            <tr><td>A choice answered in words, still empty</td><td>“Answer question 2 in its words first”</td></tr>
            <tr><td>The asker answering</td><td>“Jim is still answering. Answer once they finish.”</td></tr>
            <tr><td>Planning Thread, while answering</td><td>“Reaches Angela when this turn ends.”</td></tr>
            <tr><td>Ask me again's step</td><td>“What should Jim explain or change?”, Optional</td></tr>
            <tr><td>In the Thread, waiting</td><td>“Waits on you. Answer it in Needs you”</td></tr>
            <tr><td>Answered</td><td>“Answered by you”, another user's name (“Answered by Ana”), “by Michael in a Consultation”, “by Pam at your request”</td></tr>
            <tr><td>Asked again</td><td>“Asked again by you: …”</td></tr>
            <tr><td>Closed</td><td>“Closed: the Task was dropped”</td></tr>
            <tr><td>Consultation</td><td>“Waiting on Michael in a Consultation. Answer here to take it over.” (on a Task only)</td></tr>
            <tr><td>Planning Thread, sent while answering</td><td>“Reaches Angela when this turn ends.” under the outcome</td></tr>
            <tr><td>Refused</td><td>“The answer wasn't sent” and the reason</td></tr>
          </table>
        </div>`;

      document.getElementById("reference").innerHTML = REFERENCE;
      resetScenario();
      render({ keepScroll: false });
    </script>
  </body>
</html>
