        info: (s = 16) => svg(s, '<circle cx="8" cy="8" r="6"/><path d="M8 7.3v3.6M8 5v.1"/>'),
        broken: (s = 16) => svg(s, '<circle cx="8" cy="8" r="6"/><path d="M8 4.8v3.6M8 10.9v.1"/>'),
        route: (s = 15) => svg(s, '<circle cx="4" cy="12" r="1.8"/><circle cx="12" cy="4" r="1.8"/><path d="M5.8 12H10a2 2 0 0 0 0-4H6a2 2 0 0 1 0-4h4.2"/>'),
        user: (s = 12) => svg(s, '<circle cx="8" cy="5.5" r="2.6"/><path d="M3 13.5c.7-2.6 2.6-4 5-4s4.3 1.4 5 4"/>'),
        terminal: (s = 12) => svg(s, '<rect x="1.8" y="2.8" width="12.4" height="10.4" rx="2"/><path d="m4.5 6.5 2 1.8-2 1.8M8.5 10.5h3"/>'),
        hand: (s = 12) => svg(s, '<path d="M5 8V3.8a1 1 0 0 1 2 0V7M7 7V2.8a1 1 0 0 1 2 0V7M9 7V3.6a1 1 0 0 1 2 0V8.5M11 6.2a1 1 0 0 1 2 0V9a5 5 0 0 1-5 5h-.4A4.6 4.6 0 0 1 4 12L2.6 9.6a1 1 0 0 1 1.7-1L5 9.6"/>'),
        more: (s = 14) => svg(s, '<circle cx="3.5" cy="8" r=".6" fill="currentColor"/><circle cx="8" cy="8" r=".6" fill="currentColor"/><circle cx="12.5" cy="8" r=".6" fill="currentColor"/>'),
        undo: (s = 13) => svg(s, '<path d="M5.5 3.5 2.5 6.5l3 3"/><path d="M2.5 6.5H10a3.5 3.5 0 0 1 0 7H7"/>'),
        trash: (s = 14) => svg(s, '<path d="M2.5 4.5h11M6 4.5V3h4v1.5M4 4.5l.7 9h6.6l.7-9"/>'),
        chevronDown: (s = 12) => svg(s, '<path d="m4 6 4 4 4-4"/>'),
        chevronUp: (s = 12) => svg(s, '<path d="m4 10 4-4 4 4"/>'),
        chevronLeft: (s = 12) => svg(s, '<path d="m10 3-5 5 5 5"/>'),
        chevronRight: (s = 12) => svg(s, '<path d="m6 3 5 5-5 5"/>'),
        arrowRight: (s = 12) => svg(s, '<path d="M3 8h10M9 4l4 4-4 4"/>'),
        bookmark: (s = 14) => svg(s, '<path d="M4 2.5h8v11l-4-3-4 3z"/>'),
        chat: (s = 14) => svg(s, '<path d="M2.5 8a5.5 5.5 0 1 1 2.7 4.7l-2.7.8.8-2.6A5.5 5.5 0 0 1 2.5 8z"/>'),
        loop: (s = 12) => svg(s, '<path d="M13 8a5 5 0 1 1-1.5-3.6"/><path d="M12 1.8v3h-3"/>'),
        flow: (s = 13) => svg(s, '<rect x="1.5" y="2.5" width="4.5" height="3.5" rx="1"/><rect x="10" y="10" width="4.5" height="3.5" rx="1"/><path d="M6 4.2h2.2v7.5H10"/>'),
        list: (s = 13) => svg(s, '<path d="M5.5 4h8M5.5 8h8M5.5 12h8"/><circle cx="2.6" cy="4" r=".7" fill="currentColor"/><circle cx="2.6" cy="8" r=".7" fill="currentColor"/><circle cx="2.6" cy="12" r=".7" fill="currentColor"/>'),
        minus: (s = 12) => svg(s, '<path d="M3.5 8h9"/>'),
        group: (s = 13) => svg(s, '<path d="M5 2.5H3a.5.5 0 0 0-.5.5v10a.5.5 0 0 0 .5.5h2M11 2.5h2a.5.5 0 0 1 .5.5v10a.5.5 0 0 1-.5.5h-2"/>'),
        now: (s = 18) => svg(s, '<path d="M2.5 7 8 2.5 13.5 7v6.5h-11z"/><path d="M6.5 13.5v-4h3v4"/>'),
        work: (s = 18) => svg(s, '<rect x="2.5" y="2.5" width="3" height="11" rx="1"/><rect x="6.5" y="2.5" width="3" height="7" rx="1"/><rect x="10.5" y="2.5" width="3" height="9" rx="1"/>'),
        people: (s = 18) => svg(s, '<circle cx="6" cy="5.5" r="2.5"/><path d="M1.5 13.5c.6-2.5 2.3-3.8 4.5-3.8s3.9 1.3 4.5 3.8"/><circle cx="11.5" cy="6" r="2"/><path d="M12 9.7c1.5.2 2.4 1.4 2.8 3.3"/>'),
        projects: (s = 18) => svg(s, '<path d="M1.5 4.5v8h13v-6.5H8L6.5 4.5z"/>'),
        settings: (s = 18) =>
          svg(s, '<path d="M3 4.5h10M3 8h10M3 11.5h10"/><circle cx="6" cy="4.5" r="1.4" fill="var(--surface)"/><circle cx="10.5" cy="8" r="1.4" fill="var(--surface)"/><circle cx="5" cy="11.5" r="1.4" fill="var(--surface)"/>'),
      };
      const KIND_ICON = { agent: ICON.user, script: ICON.terminal, gate: ICON.hand };
      const KIND_WORDS = { agent: "Agent Stage", script: "Script Stage", gate: "Gate" };
      const esc = (text) => String(text).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
      const copy = (value) => JSON.parse(JSON.stringify(value));
      const same = (a, b) => JSON.stringify(a ?? null) === JSON.stringify(b ?? null);
      const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;
      const listJoin = (parts, word) => (parts.length < 2 ? parts.join("") : parts.length === 2 ? `${parts[0]} ${word} ${parts[1]}` : `${parts.slice(0, -1).join(", ")} ${word} ${parts.at(-1)}`);

      /* ---------- Mock data: Pipelines, Stages and their routes, in the shapes the design asks of packages/contracts ---------- */
      /* A Stage keeps its place on the canvas, a column and a row; the Pipeline's order reads the columns left to right, a column top to bottom. */
      const agent = (key, name, who, c, r, extra = {}) => ({ key, name, kind: "agent", who, budget: 200, place: { c, r }, onFailure: null, routes: [], ...extra });
      const script = (key, name, command, c, r, extra = {}) => ({ key, name, kind: "script", command, place: { c, r }, onFailure: null, routes: [], ...extra });
      const gate = (key, name, c, r, extra = {}) => ({ key, name, kind: "gate", place: { c, r }, onFailure: null, routes: [], ...extra });
      /* A route: where it leads (a Stage's key, or null for End) and its condition, or null for none. */
      const to = (key, when = null) => ({ to: key, when });
      /* A condition: All of / Any of groups of tests, nested. */
      const all = (...items) => ({ all: true, items });
      const any = (...items) => ({ all: false, items });
      /* A built-in test of a Stage: `of` null is the previous Stage, the one the route leaves. */
      const stageTest = (of, is, extra = {}) => ({ t: "stage", of, is, ...extra });
      const dodTest = (is) => ({ t: "dod", is });
      const commandTest = (key) => ({ t: "command", key });

      const PROJECTS = [
        {
          id: "the-office",
          name: "the-office",
          letter: "T",
          mark: "#7c5cd6",
          defaultId: "pp-linux",
          commands: [
            ["test", "npm run verify"],
            ["test-full", "npm run verify:full"],
            ["lint", "npm run lint"],
            ["test-linux", "npm run verify:linux"],
            ["platform-changed", "node tools/flow/changed.mjs apps/service/src/platform"],
            ["docs-changed", "node tools/flow/changed.mjs docs"],
            ["glossary-check", "node tools/glossary/check.mjs"],
          ],
        },
        { id: "not-astray", name: "not-astray", letter: "N", mark: "#14a38b", defaultId: "quick-fix", commands: [["test", "npm test"], ["test-linux", "npm run test:linux"]] },
        { id: "notnullsoft", name: "notnullsoft", letter: "N", mark: "#e5a00d", defaultId: "full", commands: [["test", "composer test"], ["lint", "composer lint"], ["test-visual", "composer test:visual"]] },
      ];
      const projectById = (id) => PROJECTS.find((p) => p.id === id);
      const projectMark = (p) => `<span class="project-mark" style="--mark:${p.mark}" aria-hidden="true">${p.letter}</span>`;

      function fullStages() {
        return [
          agent("implement", "Implement", "Implements · Jim", 0, 0, { budget: 250, routes: [to("tests")] }),
          script("tests", "Tests", "test", 1, 0, { onFailure: { to: "implement", times: 3 }, routes: [to("review")] }),
          agent("review", "Review & fix", "Implements · Jim", 2, 0, { budget: 370, onFailure: { to: "implement", times: 1 }, routes: [to("publish")] }),
          script("publish", "Publish", "publish", 3, 0, { onFailure: { to: "review", times: 1 }, routes: [to(null)] }),
        ];
      }
      function officeSeed() {
        return [
          { id: "full", name: "Full", description: "Implement, test, review and fix, then publish.", stages: fullStages() },
          {
            id: "quick-fix",
            name: "Quick fix",
            description: "A small change: implement, test, publish.",
            stages: [
              agent("implement", "Implement", "Implements · Jim", 0, 0, { routes: [to("tests")] }),
              script("tests", "Tests", "test", 1, 0, { onFailure: { to: "implement", times: 2 }, routes: [to("publish")] }),
              script("publish", "Publish", "publish", 2, 0, { routes: [to(null)] }),
            ],
          },
          {
            id: "document",
            name: "Document",
            description: "Write a document, then review and fix it. Its Produce Stage was replaced by Write since Spec change was made.",
            stages: [agent("write", "Write", "Implements · Jim", 0, 0, { budget: 80, routes: [to("review")] }), agent("review", "Review & fix", "Implements · Jim", 1, 0, { budget: 120, routes: [to(null)] })],
          },
          {
            id: "docs-check",
            name: "Docs with a glossary check",
            description: "Made in the library: write the docs, check the glossary's terms when something isn't met yet, publish.",
            optionalWas: "glossary",
            stages: [
              agent("produce", "Produce", "Implements · Jim", 0, 0, { budget: 80, routes: [to("glossary", all(dodTest("unmet"))), to("publish")] }),
              script("glossary", "Glossary check", "glossary-check", 1, 0, { onFailure: { to: "produce", times: 2 }, routes: [to("publish")] }),
              script("publish", "Publish", "publish", 2, 0, { routes: [to(null)] }),
            ],
          },
          {
            id: "onboard",
            name: "Onboard",
            description: "Onboard a Project: set it up, verify, publish.",
            stages: [
              agent("onboard", "Onboard", "Onboards and repairs Projects · Dwight", 0, 0, { budget: 150, routes: [to("verify")] }),
              script("verify", "Verify", "test", 1, 0, { onFailure: { to: "onboard", times: 2 }, routes: [to("publish")] }),
              script("publish", "Publish", "publish", 2, 0, { routes: [to(null)] }),
            ],
          },
          {
            id: "proof",
            name: "Proof of concept",
            description: "Implement and test, then push the branch only.",
            stages: [
              agent("implement", "Implement", "Implements · Jim", 0, 0, { routes: [to("tests")] }),
              script("tests", "Tests", "test", 1, 0, { onFailure: { to: "implement", times: 2 }, routes: [to("publish")] }),
              script("publish", "Publish", "publish", 2, 0, { routes: [to(null)] }),
            ],
          },
        ];
      }
      function projectPipelinesSeed() {
        return [
          {
            id: "pp-linux",
            projectId: "the-office",
            name: "Full with Linux check",
            baseId: "full",
            description: "Full, with the Linux run after review whenever the platform code changed.",
            changes: [
              { kind: "insertAfter", key: "review", name: "Review & fix", stage: script("linux", "Verify on Linux", "test-linux", 0, 0, { onFailure: { to: "implement", times: 1 } }) },
              { kind: "changeRoutes", key: "review", name: "Review & fix", routes: [to("linux", all(commandTest("platform-changed"))), to("publish")] },
            ],
          },
          {
            id: "pp-ui",
            projectId: "the-office",
            name: "UI change",
            baseId: "full",
            description: "For screens: your review in place of the Tests run.",
            changes: [
              { kind: "remove", key: "tests", name: "Tests" },
              { kind: "insertAfter", key: "review", name: "Review & fix", stage: gate("your-review", "Your review", 0, 0) },
            ],
          },
          {
            id: "pp-spec",
            projectId: "the-office",
            name: "Spec change",
            baseId: "document",
            description: "Document, with the glossary check whenever the spec changed.",
            changes: [
              { kind: "insertAfter", key: "produce", name: "Produce", stage: script("glossary", "Glossary check", "glossary-check", 0, 0) },
              { kind: "changeRoutes", key: "produce", name: "Produce", routes: [to("glossary", all(stageTest("produce", "changed", { ofName: "Produce" }))), to("review")] },
            ],
          },
          {
            id: "pp-visual",
            projectId: "notnullsoft",
            name: "Full with visual check",
            baseId: "full",
            description: "Full, with the visual check after review.",
            changes: [{ kind: "insertAfter", key: "review", name: "Review & fix", stage: script("visual", "Visual check", "test-visual", 0, 0) }],
          },
        ];
      }
      const TEMPLATES = [
        { name: "Review & fix", kind: "agent", who: "Implements · Jim" },
        { name: "Verify on Linux", kind: "script", command: "test-linux" },
        { name: "Your review", kind: "gate" },
      ];

      /* The scenarios' own drafts */
      function releaseNotesStages(step) {
        const stages = fullStages();
        stages.find((s) => s.key === "publish").place.c = 3;
        const notes = agent("notes", "Release notes", "Implements · Jim", 2, 1, { budget: 60 });
        stages.push(notes);
        if (step === "added") return stages;
        const tests = stages.find((s) => s.key === "tests");
        notes.routes = [to("publish")];
        if (step === "drawn") {
          tests.routes = [to("review", all(stageTest("implement", "changed"))), to("notes")];
          return stages;
        }
        tests.routes = [
          to("review", all(stageTest("implement", "changed"), any(dodTest("unmet"), stageTest(null, "ran", { n: 2 })))),
          to("notes", all(commandTest("docs-changed"))),
          to("publish"),
        ];
        return stages;
      }
      function validationStages() {
        const stages = fullStages();
        const tests = stages.find((s) => s.key === "tests");
        const review = stages.find((s) => s.key === "review");
        tests.routes = [to("review", all(stageTest("verify", "changed", { ofName: "Verify" }))), to("changelog", all(commandTest("docs-changed")))];
        review.routes = [to("tests", all(stageTest(null, "failed"))), to("publish")];
        stages.push(agent("notes", "Release notes", "Implements · Jim", 2, 1, { budget: 60, routes: [to("publish")] }));
        stages.push(script("changelog", "Changelog check", "lint", 3, 1));
        return stages;
      }
      /* Dwight's Proposal: "run Review & fix only when Implement changed files, otherwise Publish" */
      function proposedFull(stages) {
        const after = copy(stages);
        after.find((s) => s.key === "tests").routes = [to("review", all(stageTest("implement", "changed"))), to("publish")];
        return after;
      }

      /* ---------- The Pipeline's order and building a Project Pipeline (spec 2.3, "A Pipeline is a flow", "Project Pipelines") ---------- */
      const byPlace = (a, b) => a.place.c - b.place.c || a.place.r - b.place.r;
      const live = (stages) => stages.filter((s) => !s.removed);
      const orderOf = (stages) => live(stages).slice().sort(byPlace);
      const stageOf = (stages, key) => stages.find((s) => s.key === key && !s.removed);

      function build(pp, office) {
        const base = office.find((p) => p.id === pp.baseId);
        const stages = copy(base.stages).map((s) => ({ ...s, origin: "base" }));
        const notApplying = [];
        pp.changes.forEach((change, index) => {
          const at = stageOf(stages, change.key);
          const kindWords = { insertAfter: "Insert after", changeRoutes: "Change routes", remove: "Remove" }[change.kind];
          if (!at) {
            const why =
              change.kind === "insertAfter"
                ? `Inserts ${change.stage.name} after ${change.name}, which ${base.name} no longer has.`
                : change.kind === "changeRoutes"
                  ? `Changes ${change.name}'s routes, which ${base.name} no longer has.`
                  : `Removes ${change.name}, which ${base.name} no longer has.`;
            notApplying.push({ index, change, kindWords, why });
            return;
          }
          if (change.kind === "insertAfter") {
            const fresh = { ...copy(change.stage), origin: "inserted", changeIndex: index, after: at.name };
            stages.forEach((s) => {
              if (s.place.c > at.place.c) s.place.c += 1;
            });
            fresh.place = { c: at.place.c + 1, r: at.place.r };
            fresh.routes = at.routes;
            at.routes = [to(fresh.key)];
            stages.push(fresh);
          } else if (change.kind === "changeRoutes") {
            at.routes = copy(change.routes);
            at.routesChange = index;
          } else if (change.kind === "remove") {
            at.removed = true;
            at.origin = "removed";
            at.changeIndex = index;
            const out = at.routes.filter((r) => r.to !== at.key);
            stages.forEach((s) => {
              if (s === at) return;
              s.routes = s.routes.flatMap((r) => (r.to !== at.key ? [r] : out.length === 1 ? [{ ...r, to: out[0].to }] : []));
            });
          }
        });
        stages.sort(byPlace);
        return { stages, notApplying, base };
      }

      /* ---------- Words: a condition in plain words ---------- */
      const STAGE_IS = { done: "ended Done", failed: "ended Failed", skipped: "was Skipped", changed: "changed files", unchanged: "changed no files", ran: "ran N or more times" };
      function testWords(test, from, stages, short = false) {
        if (test.t === "dod") return test.is === "met" ? "the Definition of Done is all Reported met" : "the Definition of Done has some not Reported met";
        if (test.t === "command") return short ? `${test.key || "a command"} exits 0` : `the Project command ${test.key || "(none picked)"} exits 0`;
        const named = test.of === null ? from : stageOf(stages, test.of);
        const name = named ? named.name : test.ofName || test.of;
        return `${name} ${test.is === "ran" ? `ran ${test.n} or more times` : STAGE_IS[test.is]}`;
      }
      function groupWords(group, from, stages, short = false, depth = 0) {
        const parts = group.items.map((item) => (item.items ? groupWords(item, from, stages, short, depth + 1) : testWords(item, from, stages, short)));
        if (!parts.length) return "no test yet";
        if (parts.length === 1) return parts[0];
        const joined = listJoin(parts, group.all ? "and" : "or");
        if (!depth) return joined;
        return parts.length === 2 ? `${group.all ? "both" : "either"} ${joined}` : `${group.all ? "all of" : "any of"}: ${joined}`;
      }
      const whereWords = (route, stages) => (route.to === null ? "End" : (stageOf(stages, route.to)?.name ?? route.toName ?? route.to));
      function routeWhen(route, from, stages, short = true) {
        if (route.when) return `when ${groupWords(route.when, from, stages, short)}`;
        return from.routes.length > 1 ? "otherwise" : "always";
      }
      function routeReads(route, index, from, stages) {
        if (route.when) return `Followed when ${groupWords(route.when, from, stages)}.`;
        if (from.routes.length === 1) return `Always followed: it is ${from.name}'s one route out.`;
        return index === from.routes.length - 1 ? "Followed otherwise, when no route before it holds." : "Always holds, so no route after it can be followed.";
      }
      function whoWords(stage) {
        if (stage.kind === "gate") return "waits for you";
        if (stage.kind === "script") return stage.command === "publish" ? "publishes the work" : `runs ${stage.command}`;
        return stage.who;
      }
      /* Each test with its place in the condition: "0", "1.0" … */
      function testsOf(group, path = "") {
        return group.items.flatMap((item, i) => {
          const at = path === "" ? `${i}` : `${path}.${i}`;
          return item.items ? testsOf(item, at) : [{ test: item, path: at }];
        });
      }
      function groupsOf(group, path = "") {
        return [{ group, path }, ...group.items.flatMap((item, i) => (item.items ? groupsOf(item, path === "" ? `${i}` : `${path}.${i}`) : []))];
      }

      /* ---------- Validation (spec 2.3, "Validation"; "A Pipeline needs the commands it runs") ---------- */
      const KEY_RULE = /^[a-z][a-z0-9-]*$/;
      function pathLeads(stages, fromKey, toKey) {
        const seen = new Set([fromKey]);
        const queue = [fromKey];
        while (queue.length) {
          const key = queue.shift();
          if (key === toKey) return true;
          for (const r of stageOf(stages, key)?.routes ?? []) {
            if (r.to && stageOf(stages, r.to) && !seen.has(r.to)) {
              seen.add(r.to);
              queue.push(r.to);
            }
          }
        }
        return false;
      }
      /* What holds Save (problems) and what is only said (warnings), each where it is: a Stage, one of its routes, a test in it, or its loop. */
      function check(stages, ctx) {
        const order = orderOf(stages);
        const pos = (key) => order.findIndex((s) => s.key === key);
        const found = [];
        const problem = (at, text) => found.push({ level: "problem", ...at, text });
        if (!order.length) return found;
        const reached = new Set();
        const queue = [order[0].key];
        reached.add(order[0].key);
        while (queue.length) {
          for (const r of stageOf(stages, queue.shift()).routes) {
            if (r.to && stageOf(stages, r.to) && !reached.has(r.to)) {
              reached.add(r.to);
              queue.push(r.to);
            }
          }
        }
        for (const s of order) {
          const at = { key: s.key, route: null };
          if (!reached.has(s.key))
            problem(
              at,
              order.some((x) => x.routes.some((r) => r.to === s.key))
                ? `No path of routes leads from ${order[0].name} to ${s.name}: the Stages whose routes lead to it are never reached either.`
                : `No route leads to ${s.name}: draw one from an earlier Stage, or remove ${s.name}.`,
            );
          if (!s.routes.length) problem(at, `${s.name} has no route out: add one to a later Stage, or to End to make it a final Stage.`);
          let open = false;
          const places = new Set();
          s.routes.forEach((r, index) => {
            const here = { key: s.key, route: index };
            const target = r.to === null ? null : stageOf(stages, r.to);
            const where = whereWords(r, stages);
            if (r.to !== null && !target) problem(here, `${s.name}'s route leads to ${where}, ${ctx.gone}.`);
            else if (target && target.place.c < s.place.c)
              problem(here, `${s.name}'s route to ${where} leads back, as ${where} comes earlier: routes only lead forward. To go back when ${s.name} fails, set its On failure to Go back to ${where}.`);
            else if (target && target.place.c === s.place.c)
              problem(here, `${s.name}'s route to ${where} stays in its own column: a route leads to a later column. Move ${where} to a column after ${s.name}.`);
            if (open) problem(here, `${s.name}'s route to ${where} comes after one with no condition, so it can never be followed: move it up, or give the one before it a condition.`);
            if (places.has(r.to)) problem(here, `Two routes lead from ${s.name} to ${where}: make them one, its condition joining both with Any of.`);
            places.add(r.to);
            if (!r.when) {
              open = true;
              return;
            }
            for (const g of groupsOf(r.when)) if (!g.group.items.length) problem({ ...here, test: g.path }, `${s.name}'s route to ${where} has a group with no test yet: add a test, or remove the group.`);
            for (const { test, path } of testsOf(r.when)) {
              const there = { ...here, test: path };
              if (test.t === "stage" && test.of !== null) {
                const named = stageOf(stages, test.of);
                if (!named) problem(there, `The condition of ${s.name}'s route to ${where} names ${test.ofName || test.of}, ${ctx.gone}.`);
                else if (pos(test.of) > pos(s.key)) problem(there, `The condition of ${s.name}'s route to ${where} names ${named.name}, which comes after ${s.name}: a condition tests the route's own Stage or an earlier one.`);
              }
              if (test.t === "command") {
                if (!test.key) problem(there, `The condition of ${s.name}'s route to ${where} names no Project command yet: pick one.`);
                else if (test.key === "install" || test.key === "publish") problem(there, `The condition of ${s.name}'s route to ${where} runs ${test.key}, which a condition can't: install runs before every Stage on its own, and publish is Publish's.`);
                else if (!KEY_RULE.test(test.key)) problem(there, `The condition of ${s.name}'s route to ${where} names "${test.key}", which isn't a command key: lower-case letters, digits and -, starting with a letter.`);
                else
                  for (const p of ctx.users)
                    if (!p.commands.some(([key]) => key === test.key))
                      problem(there, `The condition of ${s.name}'s route to ${where} runs the Project command ${test.key}, which ${p.name} doesn't have${ctx.mode === "office" ? `, and ${ctx.name} is ${p.name}'s default` : ""}.`);
              }
            }
          });
          if (s.kind === "script" && s.command !== "publish")
            for (const p of ctx.users)
              if (!p.commands.some(([key]) => key === s.command))
                problem(at, `${s.name} runs the Project command ${s.command}, which ${p.name} doesn't have${ctx.mode === "office" ? `, and ${ctx.name} is ${p.name}'s default` : ""}.`);
          if (s.routes.length && s.routes.every((r) => r.when))
            found.push({ level: "warning", key: s.key, route: null, text: `Every route out of ${s.name} has a condition: when none holds, the walk stops after ${s.name} and asks you which to follow.` });
          if (s.onFailure) {
            const back = stageOf(stages, s.onFailure.to);
            const loop = { key: s.key, route: null, loop: true };
            if (!back) problem(loop, `${s.name} goes back to ${s.onFailure.toName || s.onFailure.to} on failure, which isn't among the Stages any more.`);
            else if (back.place.c > s.place.c) problem(loop, `${s.name} goes back to ${back.name} on failure, which now comes after it.`);
            else if (back.place.c === s.place.c) problem(loop, `${s.name} goes back to ${back.name} on failure, which stands in its own column: the Stage it goes back to must be in an earlier column.`);
            else if (!pathLeads(stages, back.key, s.key)) problem(loop, `${s.name} goes back to ${back.name} on failure, but no path of routes leads from ${back.name} to ${s.name}.`);
          }
        }
        return found;
      }

      /* ---------- Scenarios and state ---------- */
      const SCENARIOS = [
        {
          key: "converted",
          label: "Converted",
          note: "Full as it reads once The Office converted it: the same four Stages in the same order, one route with no condition from each to the next and from Publish to End, and its three On failure loops drawn as dashed red lines above. Nothing else changed. Built on by stays as adopted. Open Docs with a glossary check for an optional Stage turned into routes.",
        },
        {
          key: "placing",
          label: "Placing and routes",
          note: "A new Pipeline duplicated from Full, with Release notes just added beside Review & fix: unconnected, it shows what the editor says until its routes are drawn. Drag it, drag from a Stage's + to draw a route, pick a route and Remove it, or switch to List, the same flow without dragging. Show it drawn for paths that part at Tests and meet again at Publish, a join.",
        },
        {
          key: "condition",
          label: "A condition",
          note: "Tests has three routes out: to Review & fix when built-in tests hold (All of, with an Any of group inside), to Release notes when a Project command exits 0, and to Publish otherwise. Each reads on the canvas inside its Stage, in order, and in full below. Change a test, flip All of and Any of, add a group, or pick the command route.",
        },
        {
          key: "loop",
          label: "On failure",
          note: "The Stage's own loop is set under On failure in its settings, apart from Routes out, and drawn as a dashed red line above the Stages, never as a route. Change where Tests goes back to, or how many times; a target that is later is refused there.",
        },
        {
          key: "validation",
          label: "Validation",
          note: "An edit of Full with every rule broken once: a condition naming a Stage that is gone, a command notnullsoft lacks, a route leading back, a Stage no route reaches and one with no route out. Each is said where it is, and in the list above the bar, whose items pick it. Save waits until none is left. Fix them one by one to see Save come back.",
        },
        {
          key: "project",
          label: "Project Pipeline",
          note: "the-office's Full with Linux check on its Project page: an inserted Stage (green) and Review & fix's routes changed (amber) to run it only when a Project command exits 0, each with its Undo. Open UI change for a removed Stage, struck through in place with its route carried on, and Spec change for a Broken one fixed in place.",
        },
        {
          key: "proposal",
          label: "Proposal",
          note: "Dwight's Proposal in a Thread: run Review & fix only when Implement changed files, otherwise Publish. The card reads each route as Was and Proposed and shows the flow as proposed. Show it on the flow draws it on Full before you apply or decline it.",
        },
      ];
      const WIDTHS = [
        { key: "wide", label: "Wide" },
        { key: "900", label: "900px" },
        { key: "390", label: "390px" },
      ];
      const PALETTES = [
        { key: "light", label: "Light" },
        { key: "dark", label: "Dark" },
      ];
      const state = {
        scenario: "converted",
        width: "wide",
        palette: "light",
        view: "flow",
        sel: null,
        menu: null,
        toast: null,
        hint: null,
        showDetail: true,
        place: "settings",
        openOffice: "full",
        openProject: "pp-linux",
        office: [],
        pps: [],
        saved: {},
        dismissed: {},
        chat: "thread",
        proposal: "open",
        proposalBefore: null,
        step: null,
        flash: null,
        focusKey: null,
        resetScroll: true,
      };
      let toastTimer;
      const scenario = () => SCENARIOS.find((s) => s.key === state.scenario);
      const isPhone = () => state.width === "390";
      const orient = () => (isPhone() ? "down" : "across");
      const officeOpen = () => state.office.find((p) => p.id === state.openOffice);
      const ppOpen = () => state.pps.find((p) => p.id === state.openProject);

      function applyScenario() {
        Object.assign(state, { office: officeSeed(), pps: projectPipelinesSeed(), sel: null, menu: null, hint: null, view: "flow", showDetail: true, dismissed: {}, chat: "thread", proposal: "open", step: null, flash: null, toast: null, resetScroll: true });
        Object.assign(state, { place: "settings", openOffice: "full", openProject: "pp-linux" });
        const s = state.scenario;
        if (s === "placing" || s === "condition" || s === "loop") {
          const step = s === "placing" ? "added" : "conditions";
          state.office.splice(1, 0, { id: "release", name: "Full with release notes", description: "Full, with release notes written when the docs changed.", stages: releaseNotesStages(step) });
          state.openOffice = "release";
        }
        if (s === "placing") {
          state.step = "added";
          state.sel = { type: "stage", key: "notes" };
          state.hint = { text: "Release notes was added beside Review & fix. Drag it where it goes, then draw its routes: drag from a Stage's + to another Stage or to End. Without dragging: Move and Routes out, below." };
        }
        if (s === "condition") state.sel = { type: "route", key: "tests", index: 0 };
        if (s === "loop") {
          state.sel = { type: "stage", key: "tests" };
          state.flash = "loop";
        }
        if (s === "validation") state.office[0].stages = validationStages();
        if (s === "project") {
          state.place = "project";
          state.sel = { type: "stage", key: "review" };
        }
        if (s === "proposal") {
          state.place = "chat";
          state.proposalBefore = copy(state.office[0].stages);
        }
        state.saved = {};
        for (const p of state.office) state.saved[p.id] = JSON.stringify(p.stages);
        for (const p of state.pps) state.saved[p.id] = JSON.stringify(p.changes);
        if (s === "validation") state.saved.full = JSON.stringify(fullStages());
        if (s === "placing") state.saved.release = null;
      }

      /* ---------- What the open editor holds ---------- */
      function ppContext(pp) {
        const built = build(pp, state.office);
        const project = projectById(pp.projectId);
        return { mode: "project", pp, project, base: built.base, stages: built.stages, notApplying: built.notApplying, name: pp.name, users: [project], gone: `which ${built.base.name} no longer has`, editable: true, id: pp.id };
      }
      const brokenOf = (pp) => {

        return ctx.notApplying.length + check(ctx.stages, ctx).filter((p) => p.level === "problem").length;
      };
      function editorCtx() {
        if (state.place === "project") return ppContext(ppOpen());
        const p = officeOpen();
        const preview = state.place === "chat" && state.chat === "flow" && state.proposal === "open" && p.id === "full";
        return {
          mode: "office",
          pipeline: p,
          stages: preview ? proposedFull(p.stages) : p.stages,
          before: preview ? p.stages : null,
          preview,
          name: p.name,
          users: PROJECTS.filter((pr) => pr.defaultId === p.id),
          gone: `which isn't in ${p.name} any more`,
          editable: !preview,
          id: p.id,

      }
      /* Why a control can't be used here, for its hover (spec 4.1: a disabled control says why) */
      const readOnlyWhy = (ctx) =>
        ctx.preview
          ? "The Proposal is only read here: apply it or decline it first"
          : ctx.mode === "project"
            ? `Edited as the adopted Project Pipelines design has it: a change here makes a Change of only that field, on top of ${ctx.base.name}`
            : "A removed Stage can't be edited: Undo puts it back";
      const isDirty = (ctx) => (ctx.mode === "project" ? JSON.stringify(ctx.pp.changes) !== state.saved[ctx.pp.id] : JSON.stringify(ctx.pipeline.stages) !== state.saved[ctx.pipeline.id]);

      /* ---------- Edits: an office-wide Pipeline's Stages directly; a Project Pipeline's as Stage changes ---------- */
      const uniqueKey = (stages, base) => {
        let key = base;
        for (let n = 2; stages.some((s) => s.key === key); n += 1) key = `${base}-${n}`;
        return key;
      };
      function compact(stages) {
        const cols = [...new Set(live(stages).map((s) => s.place.c))].sort((a, b) => a - b);
        const rows = [...new Set(live(stages).map((s) => s.place.r))].sort((a, b) => a - b);
        for (const s of stages) {
          s.place.c = cols.indexOf(s.place.c);
          s.place.r = rows.indexOf(s.place.r);
        }
        stages.sort(byPlace);
      }
      function setRoutes(key, routes) {
        const ctx = editorCtx();
        if (ctx.mode === "office") {
          stageOf(ctx.pipeline.stages, key).routes = routes;
          return;
        }
        const pp = ctx.pp;
        const name = stageOf(ctx.stages, key)?.name ?? key;
        let at = pp.changes.findIndex((c) => c.kind === "changeRoutes" && c.key === key);
        if (at >= 0) pp.changes[at].routes = routes;
        else {
          pp.changes.push({ kind: "changeRoutes", key, name, routes });
          at = pp.changes.length - 1;
        }
        const without = build({ ...pp, changes: pp.changes.filter((_, i) => i !== at) }, state.office);
        if (same(stageOf(without.stages, key)?.routes, routes)) pp.changes.splice(at, 1);
      }
      function addStage(kind, template) {
        const ctx = editorCtx();
        const stages = ctx.pipeline.stages;
        const words = template ? template.name : { agent: "New Stage", script: "Script", gate: "Gate" }[kind];
        const key = uniqueKey(stages, words.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, ""));
        const picked = state.sel?.type === "stage" ? stageOf(stages, state.sel.key) : null;
        const after = picked ?? orderOf(stages).at(-1);
        const c = after ? after.place.c + 1 : 0;
        for (const s of stages) if (s.place.c >= c) s.place.c += 1;
        const r = after ? after.place.r + 1 : 0;
        const fresh =
          kind === "agent" ? agent(key, words, template?.who ?? "Implements · Jim", c, r) : kind === "script" ? script(key, words, template?.command ?? "test", c, r) : gate(key, words, c, r);
        stages.push(fresh);
        compact(stages);
        state.sel = { type: "stage", key };
        state.hint = { text: `${words} was added beside ${after?.name ?? "the start"}. Drag it where it goes, then draw its routes: drag from a Stage's + to another Stage or to End. Without dragging: Move and Routes out, below.` };
        state.focusKey = key;
      }
      function removeStage(key) {
        const ctx = editorCtx();
        if (ctx.mode === "project") {
          const s = stageOf(ctx.stages, key);
          if (s.origin === "inserted") ctx.pp.changes.splice(s.changeIndex, 1);
          else ctx.pp.changes.push({ kind: "remove", key, name: s.name });
          state.sel = null;
          return;
        }
        const stages = ctx.pipeline.stages;
        const gone = stageOf(stages, key);
        const out = gone.routes;
        for (const s of stages) s.routes = s.routes.flatMap((r) => (r.to !== key ? [r] : out.length === 1 ? [{ ...r, to: out[0].to }] : []));
        for (const s of stages) if (s.onFailure?.to === key) s.onFailure.toName = gone.name;
        stages.splice(stages.indexOf(gone), 1);
        compact(stages);
        state.sel = null;
        state.hint = { text: `${gone.name} was removed. Each route that led into it now leads where its one route out led, so a straight line stays one.` };
      }
      function moveStage(key, c, r, newColumn) {
        const stages = editorCtx().pipeline.stages;
        const moving = stageOf(stages, key);
        if (newColumn) for (const s of stages) if (s !== moving && s.place.c >= c) s.place.c += 1;
        const taken = (row) => stages.some((s) => s !== moving && s.place.c === c && s.place.r === row);
        let row = Math.max(0, r);
        while (taken(row)) row += 1;
        moving.place = { c: Math.max(0, c), r: row };
        compact(stages);
        state.focusKey = key;
      }
      function nudge(key, dir) {
        const s = stageOf(editorCtx().pipeline.stages, key);
        if (dir === "earlier") {
          if (s.place.c === 0) moveStage(key, 0, s.place.r, true);
          else moveStage(key, s.place.c - 1, s.place.r, false);
        } else if (dir === "later") moveStage(key, s.place.c + 1, s.place.r, false);
        else if (dir === "up") {
          const above = stageOf(editorCtx().pipeline.stages, key);
          if (above.place.r > 0) swapRow(key, above.place.r - 1);
        } else if (dir === "down") swapRow(key, s.place.r + 1);
      }
      function swapRow(key, row) {
        const stages = editorCtx().pipeline.stages;
        const s = stageOf(stages, key);
        const other = stages.find((x) => x !== s && x.place.c === s.place.c && x.place.r === row);
        if (other) other.place.r = s.place.r;
        s.place.r = row;
        compact(stages);
        state.focusKey = key;
      }
      /* The List's arrows move a Stage one step in the Pipeline's order, swapping places with its neighbour. */
      function stepInOrder(key, dir) {
        const stages = editorCtx().pipeline.stages;
        const order = orderOf(stages);
        const i = order.findIndex((s) => s.key === key);
        const j = dir === "earlier" ? i - 1 : i + 1;
        if (j < 0 || j >= order.length) return;
        const a = order[i].place;
        order[i].place = order[j].place;
        order[j].place = a;
        stages.sort(byPlace);
        state.focusKey = key;
      }
      function insertOnRoute(key, index) {
        const stages = editorCtx().pipeline.stages;
        const from = stageOf(stages, key);
        const route = from.routes[index];
        const c = from.place.c + 1;
        for (const s of stages) if (s.place.c >= c) s.place.c += 1;
        const fresh = agent(uniqueKey(stages, "new-stage"), "New Stage", "Implements · Jim", c, from.place.r, { routes: [to(route.to)] });
        from.routes[index] = { ...route, to: fresh.key };
        stages.push(fresh);
        compact(stages);
        state.sel = { type: "stage", key: fresh.key };
        state.hint = { text: `New Stage was put on the route from ${from.name}: that route now leads to it, its condition kept, and one route with no condition leads on from it.` };
      }
      function insertAfterProject(key, kind) {
        const ctx = editorCtx();
        const at = stageOf(ctx.stages, key);
        const words = { agent: "New Stage", script: "Script", gate: "Gate" }[kind];
        const newKey = uniqueKey(ctx.stages, words.toLowerCase().replace(/ /g, "-"));
        const stage = kind === "agent" ? agent(newKey, words, "Implements · Jim", 0, 0) : kind === "script" ? script(newKey, words, "test", 0, 0) : gate(newKey, words, 0, 0);
        ctx.pp.changes.push({ kind: "insertAfter", key, name: at.name, stage });
        state.sel = { type: "stage", key: newKey };
      }
      const getAt = (group, path) => (path === "" ? group : path.split(".").reduce((g, i) => g.items[Number(i)], group));
      function editRoute(fn) {
        const ctx = editorCtx();
        const { key, index } = state.sel;
        const routes = copy(stageOf(ctx.stages, key).routes);
        fn(routes[index], routes);
        setRoutes(key, routes);
      }

      /* ---------- The shell ---------- */
      function shell({ title, crumb, rail, main, overlay = "", chatOpen = false, pushed = false }) {
        const phone = isPhone();
        const item = (key, icon) => `<span class="rail-item ${rail === key ? "on" : ""}">${icon()}</span>`;
        return `<div class="app ${phone ? "w-phone" : ""} ${pushed ? "pushed" : ""}">
          <nav class="rail" aria-label="Surfaces"><span class="rail-mark">O</span>${item("now", ICON.now)}${item("work", ICON.work)}${item("people", ICON.people)}${item("projects", ICON.projects)}${item("settings", ICON.settings)}</nav>
          <header class="top"><span class="crumb">${esc(crumb)}</span><h1>${esc(title)}</h1><span class="grow"></span>
            <span class="chat-button ${chatOpen ? "open" : ""}">${ICON.chat(14)}${phone ? "" : "Chat"}</span></header>
          <div class="strip"><span><b>1</b> Needs you</span><span><b>2</b> running</span>${phone ? "" : "<span><b>38%</b> of the 5-hour window</span>"}</div>
          <main class="main">${main}</main>
          ${overlay}
          ${state.toast ? `<div class="toast" role="status">${esc(state.toast)}</div>` : ""}
        </div>`;
      }
      function sectionPage(label, sections, active, body) {
        const menu = `<nav class="section-menu" aria-label="${esc(label)}">${sections.map((s) => `<span class="${s === active ? "active" : ""}">${s}</span>`).join("")}</nav>`;

      }
      const SETTINGS_SECTIONS = ["Pipelines", "Skills", "MCP servers", "Engines", "Office identity", "Office limits", "Office instructions", "Notifications", "Updates", "Appearance"];
      const PROJECT_SECTIONS = ["Overview", "Commands", "Pipelines", "Run environment", "Engine", "Skills", "Server values", "Appearance"];
      const backButton = (label) => `<button type="button" class="btn sm ghost back-to-lists" data-action="back">${ICON.chevronLeft(12)} ${esc(label)}</button>`;
      const split = (lists, back, detail) =>
        `<div class="settings-split ${state.showDetail ? "showing-detail" : ""}"><div class="library-lists">${lists}</div><div class="library-detail">${back}${detail}</div></div>`;
      /* A flow in one line, as a list row shows it: the columns in order, Stages side by side split by a slash. */
      function flowLine(stages) {
        const cols = new Map();
        for (const s of orderOf(stages)) cols.set(s.place.c, [...(cols.get(s.place.c) ?? []), s.name]);
        return [...cols.values()].map((names) => names.join(" / ")).join(" → ");
      }
      const builtOnBy = (id) => state.pps.filter((pp) => pp.baseId === id);
      const DEVOPS = "Dwight";

      /* ---------- Settings › Pipelines ---------- */
      function libraryLists() {
        const rows = state.office
          .map((p) => {
            const built = builtOnBy(p.id);
            const broken = built.filter((pp) => brokenOf(pp)).length;
            const second = built.length ? `<span class="pick-list-line">Built on by ${plural(built.length, "Project Pipeline", "Project Pipelines")}</span>` : "";
            const fresh = state.saved[p.id] === null ? '<span class="badge sm">Not saved yet</span>' : "";

          })
          .join("");
        const templates = TEMPLATES.map(
          (t) => `<li><button type="button" class="pick-list-item"><span class="stage-mark kind-${t.kind}">${KIND_ICON[t.kind](11)}</span><span class="pick-list-words"><span class="pick-list-name">${esc(t.name)}</span><span class="pick-list-line">${KIND_WORDS[t.kind]}</span></span></button></li>`,
        ).join("");
        return `<section class="pick-list-card" aria-label="Office-wide Pipelines">
            <div class="pick-list-head"><h3 class="pick-list-title"><span class="name">Office-wide Pipelines</span><span class="pick-list-count">${state.office.length}</span></h3><button type="button" class="btn sm secondary">${ICON.plus(12)} New Pipeline</button></div>
            <ul class="pick-list-rows">${rows}</ul>
            <div class="pick-list-foot"><button type="button" class="btn sm ghost">Duplicate ${esc(officeOpen()?.name ?? "")}</button></div></section>
          <section class="pick-list-card" aria-label="Stage templates">
            <div class="pick-list-head"><h3 class="pick-list-title"><span class="name">Stage templates</span><span class="pick-list-count">${TEMPLATES.length}</span></h3><button type="button" class="btn sm secondary">${ICON.plus(12)} New template</button></div>
            <ul class="pick-list-rows">${templates}</ul></section>`;
      }
      function convertedAlert(p) {
        if (state.scenario !== "converted" || state.dismissed[p.id]) return "";
        const body = p.optionalWas
          ? `<p>Glossary check was optional: skipped when the Definition of Done was already met. That setting is now two routes out of Produce: to Glossary check when the Definition of Done has some not Reported met, otherwise straight to Publish. It runs and passes by the same Stages as before.</p>`
          : `<p>As The Office updated, every Pipeline became the same flow drawn as a straight line: its Stages in the same order, one route with no condition from each to the next and from the last to End, and each On failure loop as it was. Nothing else changed, and Tasks walk it as before.</p>`;
        return `<div class="alert" role="status">${ICON.info(16)}<span class="alert-title">${esc(p.name)} is now drawn as a flow</span><div class="alert-body">${body}</div><div class="alert-actions"><button type="button" class="btn sm secondary" data-action="dismiss" data-id="${p.id}">Hide this note</button></div></div>`;
      }
      function builtOnCard(p) {

          })

        return `<section class="card" aria-label="Built on by"><div class="card-head"><h3 class="card-title">Built on by ${plural(built.length, "Project Pipeline", "Project Pipelines")}</h3></div>
          <p class="note">Each Project edits its own on its page, with its Stage changes on top of ${esc(p.name)}'s Stages and routes.</p><ul class="built-on-rows">${rows}</ul></section>`;
      }
      function officeDetail() {
        const ctx = editorCtx();

      }
      function settingsPage() {

      }

      /* ---------- A Project page's Pipelines section ---------- */
      function projectPage() {
        const project = projectById(ppOpen().projectId);

        const rows = own
          .map((pp) => {

            <ul class="pick-list-rows">${rows}</ul>
            <div class="pick-list-foot"><button type="button" class="btn sm ghost">${ICON.plus(12)} Add a Pipeline built from…</button><button type="button" class="btn sm ghost">${ICON.chat(13)} Ask ${DEVOPS}</button></div></section>`;
        return sectionPage("Project sections", PROJECT_SECTIONS, "Pipelines", split(lists, backButton(`${project.name}'s Pipelines`), projectDetail()));
      }
      function projectDetail() {
        const ctx = editorCtx();
        const { pp, project, base } = ctx;
        const problems = check(ctx.stages, ctx).filter((p) => p.level === "problem");
        const broken = ctx.notApplying.length + problems.length;
        const wasBroken = state.saved[pp.id] !== JSON.stringify(pp.changes) && brokenOf({ ...pp, changes: JSON.parse(state.saved[pp.id]) });
        const isDefault = project.defaultId === pp.id;
        const head = `<section class="card"><div class="card-head"><h2 class="card-title">${ICON.route(15)}${esc(pp.name)}</h2>${isDefault ? '<span class="badge sm">Default</span>' : ""}${broken ? '<span class="badge sm danger">Broken</span>' : ""}
            ${isDefault ? "" : `<button type="button" class="btn sm secondary" ${broken ? 'aria-disabled="true" title="A Broken Pipeline can\'t be the default: fix it first"' : ""}>Make it the default</button>`}
            <button type="button" class="btn sm secondary" data-action="ask">${ICON.chat(13)} Ask ${DEVOPS}</button></div>
            <p>${esc(pp.description)}</p>
            <div class="detail-facts"><span>Project Pipeline of ${esc(project.name)}</span><span class="sep">·</span><span>Built from <button type="button" class="text-link" data-open-office-from-project="${base.id}">${esc(base.name)}</button></span>${isDefault ? `<span class="sep">·</span><span>Default for ${esc(project.name)}</span>` : ""}</div></section>`;
        const status = broken
          ? `<div class="alert danger" role="status">${ICON.broken(16)}<span class="alert-title">${esc(pp.name)} is Broken: ${esc(
              [
                ctx.notApplying.length ? `${plural(ctx.notApplying.length, "Stage change no longer applies", "Stage changes no longer apply")} to ${base.name}` : "",
                problems.length ? `its flow ${ctx.notApplying.length ? "also " : ""}has ${plural(problems.length, "problem", "problems")}` : "",

                .join(", and "),
            )}</span><div class="alert-body"><p>Until they are fixed, Tasks can't choose ${esc(pp.name)}. Tasks already started keep their Stages. Fix each one marked in red below, then save.</p></div></div>`
          : wasBroken
            ? `<div class="alert success" role="status">${ICON.check(16)}<span class="alert-title">Fixed: save it, and Tasks can choose ${esc(pp.name)} again</span></div>`
            : "";
        const baseOptions = state.office.filter((p) => p.id !== "onboard").map((p) => `<option ${p.id === base.id ? "selected" : ""}>${esc(p.name)}</option>`).join("");
        const form = `<section class="card"><div class="form-grid">

            <label class="field wide"><span class="field-label">Description</span><input class="input" value="${esc(pp.description)}" /></label></div>
            ${notApplyingBlock(ctx)}${flowEditor(ctx)}</section>`;
        return `${head}${status}${form}${saveBar(ctx)}`;
      }
      function notApplyingBlock(ctx) {
        if (!ctx.notApplying.length) return "";

          .map((s) => `<option value="${s.key}">${esc(s.name)}</option>`)
          .join("");
        const items = ctx.notApplying
          .map(
            ({ index, kindWords, change, why }) => `<div class="not-applying-item"><div><span class="badge sm danger">${kindWords}</span> <b>${esc(change.name)}</b></div><span>${esc(why)}</span>
              <div class="not-applying-fix"><span>Apply it to</span><select class="select sm" data-apply-to="${index}"><option value="">Choose a Stage…</option>${options}</select><span>or</span><button type="button" class="btn sm danger-ghost" data-action="undo" data-index="${index}">Remove this Stage change</button></div></div>`,

          .join("");

      /* ---------- The save bar: Save waits while a problem stands ---------- */
      function saveBar(ctx) {
        const problems = check(ctx.stages, ctx).filter((p) => p.level === "problem").length + (ctx.notApplying?.length ?? 0);
        const dirty = isDirty(ctx);
        const isNew = ctx.mode === "office" && state.saved[ctx.id] === null;
        const words = problems
          ? `${plural(problems, "problem holds", "problems hold")} Save`
          : isNew
            ? "Not in the library yet"
            : dirty
              ? "Unsaved changes"
              : "Saved";
        const why =
          ctx.mode === "project" && ctx.notApplying.length
            ? "Fix the Stage changes that don't apply first: a save never leaves it Broken"
            : `Fix ${problems === 1 ? "the problem" : `the ${problems} problems`} above first: Save waits while one stands`;
        const hold = problems || ctx.preview ? `aria-disabled="true" title="${esc(ctx.preview ? "Apply or decline the Proposal first" : why)}"` : "";
        const label = isNew ? "Add the Pipeline" : "Save the Pipeline";
        return `<div class="save-bar"><span class="save-state ${problems ? "held" : dirty || isNew ? "dirty" : ""}">${words}</span>
          <button type="button" class="btn danger-ghost">Remove</button><button type="button" class="btn secondary" data-action="discard" ${dirty && !isNew ? "" : `disabled title="${isNew ? "Not in the library yet: nothing to go back to" : "No unsaved changes to discard"}"`}>Discard</button>
          <button type="button" class="btn" data-action="save" ${hold}>${label}</button></div>`;
      }

      /* ---------- Proposed: the flow editor ---------- */
      function summaryWords(ctx) {
        const stages = orderOf(ctx.stages);
        const routes = stages.reduce((n, s) => n + s.routes.length, 0);
        const loops = stages.filter((s) => s.onFailure).length;
        if (ctx.mode === "project") {
          const baseCount = orderOf(ctx.base.stages).length;
          return `${plural(stages.length, "Stage", "Stages")}: ${ctx.base.name}'s ${baseCount}, with ${plural(ctx.pp.changes.length, "Stage change", "Stage changes")}`;
        }
        return `${plural(stages.length, "Stage", "Stages")} · ${plural(routes, "route", "routes")} · ${plural(loops, "On failure loop", "On failure loops")}`;
      }
      function addMenu(ctx) {
        if (!ctx.editable) return "";
        if (ctx.mode === "project") {
          const picked = state.sel?.type === "stage" ? stageOf(ctx.stages, state.sel.key) : null;
          const open = state.menu === "add";
          const items = picked
            ? ["agent", "script", "gate"].map((k) => `<button type="button" class="menu-item" data-insert-after="${picked.key}" data-kind="${k}">${KIND_ICON[k](13)}${KIND_WORDS[k]}</button>`).join("")
            : "";
          return `<span class="menu-wrap"><button type="button" class="btn sm secondary" data-menu="add" aria-expanded="${open}" ${picked ? "" : 'aria-disabled="true" title="Pick the Stage to insert after first"'}>${ICON.plus(12)} ${picked ? `Insert after ${esc(picked.name)}` : "Insert a Stage"}</button>
            ${open && picked ? `<div class="menu" role="menu"><span class="menu-label">Insert after ${esc(picked.name)}</span>${items}<div class="menu-rule"></div><span class="menu-label">From a template</span>${TEMPLATES.map((t) => `<button type="button" class="menu-item" data-insert-after="${picked.key}" data-kind="${t.kind}">${KIND_ICON[t.kind](13)}${esc(t.name)}</button>`).join("")}</div>` : ""}</span>`;
        }
        const open = state.menu === "add";
        const items = ["agent", "script", "gate"].map((k) => `<button type="button" class="menu-item" data-add="${k}">${KIND_ICON[k](13)}${KIND_WORDS[k]}</button>`).join("");
        const templates = TEMPLATES.map(
          (t, i) => `<button type="button" class="menu-item" data-add="${t.kind}" data-template="${i}">${KIND_ICON[t.kind](13)}<span class="menu-item-words">${esc(t.name)}<small>${KIND_WORDS[t.kind]}</small></span></button>`,
        ).join("");
        return `<span class="menu-wrap"><button type="button" class="btn sm secondary" data-menu="add" aria-expanded="${open}">${ICON.plus(12)} Add a Stage</button>
          ${open ? `<div class="menu" role="menu"><span class="menu-label">Add a Stage</span>${items}<div class="menu-rule"></div><span class="menu-label">From a template</span>${templates}</div>` : ""}</span>`;
      }
      function legend(ctx) {
        const items = ctx.preview
          ? ['<li><span class="legend-line"></span>As it is</li>', `<li><span class="legend-line proposed"></span>Proposed by ${DEVOPS}</li>`, '<li><span class="legend-line was"></span>Taken away</li>']
          : ctx.mode === "project"
            ? [
                `<li><span class="legend-edge"></span>From ${esc(ctx.base.name)}</li>`,
                '<li><span class="legend-edge" style="--edge:var(--success)"></span>Inserted</li>',
                '<li><span class="legend-edge" style="--edge:var(--info)"></span>Replaced</li>',
                '<li><span class="legend-edge" style="--edge:var(--warning)"></span>Changed or routes changed</li>',
                '<li><span class="legend-edge removed"></span>Removed</li>',

            : ['<li><span class="legend-line"></span>Route</li>'];
        items.push('<li><span class="legend-line loop"></span>On failure loop</li>');
        return `<ul class="flow-legend" aria-label="What the lines mean">${items.join("")}</ul>`;
      }
      function flowEditor(ctx) {
        const problems = check(ctx.stages, ctx);
        const view = `<div class="segmented" role="group" aria-label="View"><button type="button" data-view="flow" aria-pressed="${state.view === "flow"}">${ICON.flow(12)} Flow</button><button type="button" data-view="list" aria-pressed="${state.view === "list"}">${ICON.list(12)} List</button></div>`;
        const title = ctx.mode === "project" ? `What ${esc(ctx.project.name)} gets` : "Stages and routes";
        const howTo = !ctx.editable
          ? "The Proposal on the flow: pick a Stage or a route to read it. It changes nothing until you apply it."
          : state.view === "list"
            ? "The same flow as a list, in the Pipeline's order: move a Stage with its arrows, and add or edit its routes under Routes out."
            : orient() === "down"
              ? "Press a Stage or a route to edit it below. Move and Routes out do everything without dragging; drag from a Stage's + to draw a route."
              : ctx.mode === "project"
                ? "Pick a Stage or a route to edit it below: a route's edit becomes a Change routes Stage change, with its Undo, and an edit of one of a Stage's own fields a Change Stage change of only that field. A Project Pipeline's Stages keep the places its base Pipeline gives them."
                : "Drag a Stage to move it. Drag from its + to another Stage, or to End, to draw a route; pick a route to set its condition. Without a mouse: Tab to a Stage, Shift + arrows move it, Enter opens it below.";
        const hint = state.hint && ctx.editable ? state.hint : { text: howTo };
        const body = state.view === "list" ? listView(ctx, problems) : canvas("flow-main", ctx.stages, { orient: orient(), ctx, problems, readonly: !ctx.editable, before: ctx.before });
        return `<div class="flow-editor" id="flow-editor">
            <div class="flow-head"><div class="flow-head-title"><b>${title}</b><span>${esc(summaryWords(ctx))}</span></div>${addMenu(ctx)}${view}</div>
            ${legend(ctx)}
            <p class="flow-hint ${hint.refused ? "refused" : ""}">${hint.refused ? ICON.alert(13) : ICON.info(13)}<span>${esc(hint.text)}</span></p>
            ${body}
            ${inspector(ctx, problems)}
            ${checkAlerts(problems)}
          </div>`;
      }
      function checkAlerts(problems) {
        const holds = problems.filter((p) => p.level === "problem");
        const warnings = problems.filter((p) => p.level === "warning");
        const item = (p) => `<li><button type="button" class="text-link" data-pick="${p.key}" data-route="${p.route ?? ""}" data-loop="${p.loop ? 1 : ""}">${esc(p.text)}</button></li>`;
        const hold = holds.length
          ? `<div class="alert danger" role="status">${ICON.alert(16)}<span class="alert-title">The Pipeline can't be saved yet</span><div class="alert-body"><ul>${holds.map(item).join("")}</ul></div></div>`
          : "";
        const warn = warnings.length ? `<div class="alert" role="status">${ICON.info(16)}<span class="alert-title">Worth a look, though it doesn't hold Save</span><div class="alert-body"><ul>${warnings.map(item).join("")}</ul></div></div>` : "";
        return hold + warn;
      }

      /* ---------- The canvas: the HTML; drawFlow draws the routes and loops over it once it is laid out ---------- */
      const FLOWS = {};
      /* How each route reads against the Pipeline before a Proposal: kept, proposed, or taken away. */
      function routeDiff(stage, before) {
        const was = before ? stageOf(before, stage.key) : null;
        const lines = stage.routes.map((route, index) => {
          if (!before) return { route, index, look: "" };
          const old = was?.routes.find((r) => r.to === route.to);
          return { route, index, look: old && same(old.when, route.when) ? "" : "proposed" };
        });
        const gone = before && was ? was.routes.filter((r) => !stage.routes.some((x) => x.to === r.to)).map((route) => ({ route, index: -1, look: "was" })) : [];
        return [...lines, ...gone];
      }
      function canvas(id, stages, opts) {
        FLOWS[id] = { stages, opts };
        const all = stages.slice().sort(byPlace);
        const cols = Math.max(0, ...all.map((s) => s.place.c)) + 1;
        const rows = Math.max(0, ...all.map((s) => s.place.r)) + 1;
        const endStyle = opts.orient === "down" ? `grid-row:${cols + 1}` : `grid-column:${cols + 1}`;
        const nodes = all.map((s) => flowNode(s, stages, opts)).join("");
        const label = opts.compact ? "Full, as proposed" : `The flow: ${flowLine(stages)}`;
        /* Room above (or beside) the Stages for the loops' lanes, and below (or beside) them for routes that go round */
        const lanes = loopLanes(stages).count;
        const detours = all.reduce((n, s) => {
          const lines = s.removed ? s.routes.map((route) => ({ route })) : routeDiff(s, opts.before);
          return n + lines.filter((l) => l.route.to !== null && needsDetour(stages, s, stageOf(stages, l.route.to))).length;
        }, 0);
        const room = `--loop-room:${lanes ? lanes * 11 + 14 : 0}px;--detour-room:${detours ? detours * 8 + 16 : 0}px`;
        return `<div class="flow ${opts.compact ? "compact" : ""} ${opts.readonly ? "readonly" : ""}" id="${id}" data-orient="${opts.orient}" style="--cols:${cols};--rows:${rows};--lanes:${rows};${room}" role="group" aria-label="${esc(label)}">
            <div class="flow-grid">${nodes}<div class="flow-end" data-end="1" style="${endStyle}">End</div></div>
            <svg class="flow-lines" aria-hidden="true"></svg><div class="flow-labels"></div></div>`;
      }
      function originTag(s, ctx) {
        if (ctx?.mode !== "project") return "";
        if (s.origin === "inserted") return `<span class="badge sm success flow-node-tag">Inserted after ${esc(s.after)}</span>`;
        if (s.removed) return '<span class="badge sm flow-node-tag">Removed</span>';
        if (s.routesChange !== undefined) return '<span class="badge sm warning flow-node-tag">Routes changed</span>';
        return "";
      }
      function flowNode(s, stages, opts) {
        const { ctx, problems = [] } = opts;
        const style = opts.orient === "down" ? `grid-row:${s.place.c + 1};grid-column:${s.place.r + 1}` : `grid-column:${s.place.c + 1};grid-row:${s.place.r + 1}`;
        const mark = `<span class="stage-mark kind-${s.kind}">${KIND_ICON[s.kind](opts.compact ? 10 : 11)}</span>`;
        if (opts.compact) return `<div class="flow-node" data-key="${s.key}" style="${style}"><span class="flow-node-head">${mark}<span class="flow-node-name">${esc(s.name)}</span></span></div>`;
        const selected = state.sel?.type === "stage" && state.sel.key === s.key;
        const own = problems.filter((p) => p.key === s.key && p.level === "problem" && p.route === null);
        const warned = problems.some((p) => p.key === s.key && p.level === "warning");
        const cls = ["flow-node", selected && "selected", own.length && "problem", s.origin === "inserted" && "inserted", s.origin === "base" && s.routesChange !== undefined && "routes-changed", s.removed && "removed"]
          .filter(Boolean)
          .join(" ");
        const flag = own.length ? `<span class="flow-node-flag" title="${esc(own.map((p) => p.text).join(" "))}">${ICON.broken(14)}</span>` : "";
        const lines = s.removed ? [] : routeDiff(s, opts.before);
        const showLines = lines.length > 1 || lines.some((l) => l.route.when || l.look);
        const lineHtml = showLines
          ? `<div class="flow-routes">${lines
              .map((l) => {
                const routeProblem = problems.some((p) => p.key === s.key && p.route === l.index && p.level === "problem");
                const picked = state.sel?.type === "route" && state.sel.key === s.key && state.sel.index === l.index;
                const words = l.route.when ? routeWhen(l.route, s, stages) : l.look === "was" ? "always" : routeWhen(l.route, s, stages);
                const full = `${whereWords(l.route, stages)} ${words}`;
                const cls2 = ["flow-route-line", picked && "selected", routeProblem && "problem", l.look].filter(Boolean).join(" ");
                const port = l.look === "was" ? "" : `<span class="flow-port" data-port="${s.key}:${l.index}"></span>`;
                return `<div class="flow-route"><button type="button" class="${cls2}" ${l.index >= 0 ? `data-select-route="${s.key}:${l.index}"` : "disabled"} title="${esc(full)}"><span class="flow-route-words"><b>${esc(whereWords(l.route, stages))}</b> ${esc(words)}</span></button>${port}</div>`;
              })
              .join("")}${warned ? `<span class="flow-none-holds">${ICON.alert(11)}When none holds, you're asked</span>` : ""}</div>`
          : "";
        const handle = opts.readonly || s.removed ? "" : `<button type="button" class="flow-handle" data-handle="${s.key}" aria-label="Draw a route from ${esc(s.name)}" title="Draw a route from ${esc(s.name)}">${ICON.plus(10)}</button>`;
        return `<div class="${cls}" role="group" tabindex="0" data-key="${s.key}" style="${style}" aria-label="${esc(`${s.name}, ${KIND_WORDS[s.kind]}${own.length ? ", has a problem" : ""}`)}">
            <span class="flow-node-head">${mark}<span class="flow-node-words"><span class="flow-node-name">${esc(s.name)}</span><span class="flow-node-who">${esc(whoWords(s))}</span></span>${flag}</span>${originTag(s, ctx)}${lineHtml}${handle}</div>`;
      }

      /* ---------- The List: the same flow, a Stage a row in the Pipeline's order ---------- */
      function listView(ctx, problems) {
        const order = orderOf(ctx.stages);
        const ghosts = ctx.stages.filter((s) => s.removed);
        const rows = order
          .map((s, i) => {
            const selected = state.sel?.type === "stage" && state.sel.key === s.key;
            const own = problems.filter((p) => p.key === s.key && p.level === "problem" && p.route === null);
            const lines = routeDiff(s, ctx.before)
              .map((l) => {
                const picked = state.sel?.type === "route" && state.sel.key === s.key && state.sel.index === l.index;
                const bad = problems.some((p) => p.key === s.key && p.route === l.index && p.level === "problem");
                return `<li><button type="button" class="fl-row-line ${picked ? "selected" : ""} ${bad ? "problem" : ""}" ${l.index >= 0 ? `data-select-route="${s.key}:${l.index}"` : "disabled"}>${ICON.arrowRight(12)}<span><b>${esc(whereWords(l.route, ctx.stages))}</b> · ${esc(routeWhen(l.route, s, ctx.stages, false))}${l.look === "proposed" ? " · proposed" : l.look === "was" ? " · taken away" : ""}</span></button></li>`;
              })
              .join("");
            const loopTo = s.onFailure ? (stageOf(ctx.stages, s.onFailure.to)?.name ?? s.onFailure.toName ?? s.onFailure.to) : null;
            const loop = loopTo
              ? `<li><button type="button" class="fl-row-line loop" data-pick="${s.key}" data-loop="1">${ICON.loop(12)}<span>On failure: back to ${esc(loopTo)}, at most ${plural(s.onFailure.times, "time", "times")}</span></button></li>`
              : "";
            const tools =
              ctx.mode === "office" && ctx.editable
                ? `<div class="fl-row-tools"><button type="button" class="icon-button" data-step="earlier" data-key="${s.key}" aria-label="Move ${esc(s.name)} earlier" title="${i === 0 ? `${esc(s.name)} is first: nothing comes before it` : `Move ${esc(s.name)} earlier`}" ${i === 0 ? 'aria-disabled="true"' : ""}>${ICON.chevronUp(12)}</button><button type="button" class="icon-button" data-step="later" data-key="${s.key}" aria-label="Move ${esc(s.name)} later" title="${i === order.length - 1 ? `${esc(s.name)} is last in the Pipeline's order` : `Move ${esc(s.name)} later`}" ${i === order.length - 1 ? 'aria-disabled="true"' : ""}>${ICON.chevronDown(12)}</button></div>`
                : "<span></span>";
            return `<li class="fl-row ${selected ? "selected" : ""} ${own.length ? "problem" : ""}"><span class="fl-row-number">${i + 1}</span>
                <button type="button" class="fl-row-main" data-pick="${s.key}"><span class="stage-mark kind-${s.kind}">${KIND_ICON[s.kind](11)}</span><span class="flow-node-words"><span class="flow-node-name">${esc(s.name)}</span><span class="flow-node-who">${esc(whoWords(s))}${own.length ? ` · <span style="color:var(--danger-fg)">${esc(own[0].text)}</span>` : ""}</span></span>${originTag(s, ctx)}</button>${tools}

          .join("");
        const removed = ghosts.map((s) => `<li class="fl-row"><span class="fl-row-number"></span><span class="fl-row-main"><span class="stage-mark kind-${s.kind}">${KIND_ICON[s.kind](11)}</span><span class="flow-node-words"><span class="flow-node-name" style="text-decoration:line-through;color:var(--fg-3)">${esc(s.name)}</span><span class="flow-node-who">Removed</span></span></span><span></span></li>`).join("");
        return `<ol class="flow-list" aria-label="Stages in the Pipeline's order">${rows}${removed}<li class="fl-row"><span class="fl-row-number"></span><span class="fl-row-main"><span class="flow-node-words"><span class="flow-node-name">End</span><span class="flow-node-who">A route to End makes a final Stage</span></span></span><span></span></li></ol>`;
      }

      /* ---------- Under the canvas: the Stage or route picked ---------- */
      function inspector(ctx, problems) {
        const sel = state.sel;
        const s = sel ? ctx.stages.find((x) => x.key === sel.key) : null;
        if (!s || (sel.type === "route" && !s.routes[sel.index])) {
          return `<section class="inspector" aria-label="Picked"><div class="inspector-empty"><b>Pick a Stage or a route to edit it here.</b><span>A Stage's settings, its Routes out and its On failure loop; a route's place and its condition.</span></div></section>`;
        }
