      }
      const problemAlert = (items) =>
        items.length ? `<div class="alert danger" role="status">${ICON.broken(16)}<span class="alert-title">${items.length === 1 ? esc(items[0].text) : `${items.length} problems here`}</span>${items.length > 1 ? `<div class="alert-body"><ul>${items.map((p) => `<li>${esc(p.text)}</li>`).join("")}</ul></div>` : ""}</div>` : "";
      function stageInspector(ctx, s, problems) {
        const order = orderOf(ctx.stages);
        const index = order.findIndex((x) => x.key === s.key);
        const own = problems.filter((p) => p.key === s.key && p.level === "problem" && p.route === null);
        const editable = ctx.editable && !s.removed;
        const down = orient() === "down";
        const tool = (dir, icon, words) => `<button type="button" class="icon-button" data-nudge="${dir}" data-key="${s.key}" aria-label="${esc(words)}" title="${esc(words)}">${icon(13)}</button>`;
        let tools = "";
        if (ctx.mode === "office" && editable) {
          tools =
            tool("earlier", down ? ICON.chevronUp : ICON.chevronLeft, `Move ${s.name} earlier`) +
            tool("later", down ? ICON.chevronDown : ICON.chevronRight, `Move ${s.name} later`) +
            tool("up", down ? ICON.chevronLeft : ICON.chevronUp, down ? `Move ${s.name} left` : `Move ${s.name} up`) +
            tool("down", down ? ICON.chevronRight : ICON.chevronDown, down ? `Move ${s.name} right` : `Move ${s.name} down`) +
            `<button type="button" class="icon-button" aria-label="Save ${esc(s.name)} as a template" title="Save ${esc(s.name)} as a template">${ICON.bookmark(13)}</button>` +
            `<button type="button" class="icon-button danger" data-action="remove-stage" data-key="${s.key}" aria-label="Remove ${esc(s.name)}" title="Remove ${esc(s.name)}">${ICON.trash(13)}</button>`;
        }
        if (ctx.mode === "project") {
          const undoIndex = s.origin === "inserted" || s.removed ? s.changeIndex : undefined;
          if (undoIndex !== undefined)
            tools += `<button type="button" class="btn sm ghost" data-action="undo" data-index="${undoIndex}" title="${esc(s.removed ? `Undo: put ${ctx.base.name}'s ${s.name} back` : `Undo: take ${s.name} out`)}">${ICON.undo(12)} Undo</button>`;
          if (!s.removed && s.origin !== "inserted")
            tools += `<button type="button" class="icon-button danger" data-action="remove-stage" data-key="${s.key}" aria-label="Remove from ${esc(ctx.project.name)}'s Stages" title="Remove from ${esc(ctx.project.name)}'s Stages">${ICON.trash(13)}</button>`;
        }
        const head = `<div class="inspector-head"><h4 class="inspector-title"><span class="stage-mark kind-${s.kind}">${KIND_ICON[s.kind](11)}</span>${esc(s.name)} <small>${KIND_WORDS[s.kind]}${index >= 0 ? ` · ${index + 1} of ${order.length} in the Pipeline's order` : ""}</small></h4><div class="inspector-tools">${tools}</div></div>`;
        const origin =
          ctx.mode !== "project"
            ? ""
            : s.removed
              ? `<p class="note">Removed: ${esc(ctx.project.name)} doesn't get it. Each route that led into it leads where its one route out led. Undo puts ${esc(ctx.base.name)}'s ${esc(s.name)} back, in its place.</p>`
              : s.origin === "inserted"
                ? `<p class="note">Inserted after ${esc(s.after)}: it took ${esc(s.after)}'s routes out, and ${esc(s.after)} got one route to it. It stays beside ${esc(s.after)} when ${esc(ctx.base.name)} changes.</p>`
                : `<p class="note">From ${esc(ctx.base.name)}: what you change here is a Stage change of only what you change. The rest follows ${esc(ctx.base.name)}.</p>`;
        const fieldsDisabled = editable && ctx.mode === "office" ? "" : `disabled title="${esc(readOnlyWhy(ctx))}"`;
        const fields =
          s.kind === "agent"
            ? `<label class="field"><span class="field-label">Name</span><input class="input sm" value="${esc(s.name)}" data-stage-name="${s.key}" ${fieldsDisabled} /></label>
               <label class="field"><span class="field-label">Who works it</span><select class="select sm" ${fieldsDisabled}><option>Implements · Jim</option><option>Onboards and repairs Projects · Dwight</option></select></label>
               <label class="field"><span class="field-label">Budget</span><input class="input sm" value="${s.budget}k tokens" ${fieldsDisabled} /></label>
               <label class="field"><span class="field-label">Session</span><select class="select sm" ${fieldsDisabled}><option>Fresh, with a brief</option><option>Continue the previous Stage's session</option></select></label>`
            : s.kind === "script"
              ? `<label class="field"><span class="field-label">Name</span><input class="input sm" value="${esc(s.name)}" data-stage-name="${s.key}" ${fieldsDisabled} /></label>
               <label class="field"><span class="field-label">Project command</span><input class="input sm mono" value="${esc(s.command)}" ${fieldsDisabled} /><span class="field-hint">Runs with no Agent; the result is recorded.</span></label>`
              : `<label class="field wide"><span class="field-label">Name</span><input class="input sm" value="${esc(s.name)}" data-stage-name="${s.key}" ${fieldsDisabled} /><span class="field-hint">A label for you; the Agents don't read it or act on it.</span></label>`;
        const body = s.removed
          ? `<div class="inspector-body">${origin}</div>`
          : `<div class="inspector-body">${problemAlert(own.filter((p) => !p.loop))}${origin}<div class="form-grid">${fields}</div>${routesSection(ctx, s, problems, editable)}${s.kind === "gate" ? "" : loopSection(ctx, s, order, index, editable && ctx.mode === "office")}</div>`;
        return `<section class="inspector" aria-label="${esc(s.name)}">${head}${body}</section>`;
      }
      function routesSection(ctx, s, problems, editable) {
        const rows = s.routes
          .map((r, i) => {
            const bad = problems.filter((p) => p.key === s.key && p.route === i && p.level === "problem");
            const n = s.routes.length;
            const move = editable
              ? `<span class="inspector-tools"><button type="button" class="icon-button" data-route-move="${i}" data-dir="-1" aria-label="Move this route up" title="${i === 0 ? "It is weighed first already" : "Move this route up"}" ${i === 0 ? 'aria-disabled="true"' : ""}>${ICON.chevronUp(12)}</button><button type="button" class="icon-button" data-route-move="${i}" data-dir="1" aria-label="Move this route down" title="${i === n - 1 ? "It is weighed last already" : "Move this route down"}" ${i === n - 1 ? 'aria-disabled="true"' : ""}>${ICON.chevronDown(12)}</button><button type="button" class="icon-button danger" data-route-remove="${i}" aria-label="Remove this route" title="Remove this route">${ICON.trash(12)}</button></span>`
              : "<span></span>";
            return `<li class="route-row ${bad.length ? "problem" : ""}"><span class="route-row-number">${i + 1}</span><button type="button" class="route-row-words" data-select-route="${s.key}:${i}"><b>→ ${esc(whereWords(r, ctx.stages))}</b><span>${esc(routeWhen(r, s, ctx.stages, false))}</span>${bad.map((p) => `<span class="why">${esc(p.text)}</span>`).join("")}</button>${move}</li>`;
          })
          .join("");
        const baseStage = ctx.mode === "project" && s.routesChange !== undefined ? stageOf(ctx.base.stages, s.key) : null;
        const compare = baseStage
          ? `<div class="compare"><div><b>${esc(ctx.base.name)} has</b>${baseStage.routes.map((r, i) => `<span>${i + 1}. → ${esc(whereWords(r, ctx.base.stages))}, ${esc(routeWhen(r, baseStage, ctx.base.stages, false))}</span>`).join("")}</div>
              <div><b>${esc(ctx.project.name)} gets</b>${s.routes.map((r, i) => `<span>${i + 1}. → ${esc(whereWords(r, ctx.stages))}, ${esc(routeWhen(r, s, ctx.stages, false))}</span>`).join("")}</div></div>
              <div><button type="button" class="btn sm ghost" data-action="undo" data-index="${s.routesChange}">${ICON.undo(12)} Undo: give ${esc(s.name)} ${esc(ctx.base.name)}'s routes back</button></div>`
          : "";
        const add = editable ? `<button type="button" class="btn sm secondary" data-action="add-route" data-key="${s.key}">${ICON.plus(12)} Add a route</button>` : "";
        return `<section class="inspector-section" id="sec-routes"><div class="section-head"><span class="overline">Routes out · ${s.routes.length}</span>${add}</div>
            ${s.routes.length ? `<ol class="route-rows">${rows}</ol>` : `<p class="empty-block">No route out yet. Add one to a later Stage, or to End to make ${esc(s.name)} a final Stage.</p>`}
            ${compare}
            <p class="field-hint">The walk follows the first route whose condition holds, from the top. One with no condition always holds, so it goes last. To run a Stage only in some cases, give the route into it a condition.</p></section>`;
      }
      function loopSection(ctx, s, order, index, editable) {
        const earlier = order.filter((e) => e.place.c < s.place.c);
        const target = s.onFailure ? stageOf(ctx.stages, s.onFailure.to) : null;
        const stale = s.onFailure && !earlier.some((e) => e.key === s.onFailure.to);
        const staleName = target?.name ?? s.onFailure?.toName ?? s.onFailure?.to;
        const options = `<option value="">No loop</option>${earlier.map((e) => `<option value="${e.key}" ${s.onFailure?.to === e.key ? "selected" : ""}>Go back to ${esc(e.name)}</option>`).join("")}${stale ? `<option value="${s.onFailure.to}" selected>Go back to ${esc(staleName)} (${target ? "not earlier" : "gone"})</option>` : ""}`;
        const times = s.onFailure?.times ?? 1;
        const stepper = `<span class="stepper"><button type="button" data-loop-times="-1" aria-label="Fewer times" ${editable ? "" : `disabled title="${esc(readOnlyWhy(ctx))}"`}>${ICON.minus(12)}</button><output>${times}</output><button type="button" data-loop-times="1" aria-label="More times" ${editable ? "" : `disabled title="${esc(readOnlyWhy(ctx))}"`}>${ICON.plus(12)}</button></span>`;
        const failedRoute = s.routes.find((r) => r.when && r.when.all && r.when.items.some((t) => t.t === "stage" && t.of === null && t.is === "failed"));
        const loopProblem = ctx.editable ? check(ctx.stages, ctx).filter((p) => p.key === s.key && p.loop) : [];
        return `<section class="inspector-section ${state.flash === "loop" ? "flash" : ""}" id="sec-loop"><div class="section-head"><span class="overline">On failure</span></div>
            ${problemAlert(loopProblem)}
            <div class="loop-row"><select class="select sm ${stale ? "invalid" : ""}" data-loop-to="${s.key}" aria-label="On failure" ${editable ? "" : `disabled title="${esc(readOnlyWhy(ctx))}"`}>${options}</select>
            ${s.onFailure ? `<span>at most</span>${stepper}<span>${times === 1 ? "time" : "times"}, then as below</span>` : ""}</div>
            <p class="field-hint">A loop, not a route: it runs only when ${esc(s.name)} fails, going back before any route is weighed, and it is drawn apart from the routes, as a dashed red line.${earlier.length ? "" : ` ${esc(s.name)} is first, so it has nowhere earlier to go back to.`}</p>
            <ol class="when-fails" aria-label="When ${esc(s.name)} fails">
              <li>${target && !stale ? `Back to ${esc(target.name)} while it has rounds left: at most ${plural(times, "time", "times")}.` : "No loop: nothing runs again by itself."}</li>
              <li>${failedRoute ? `Then the route to ${esc(whereWords(failedRoute, ctx.stages))}, as its condition says ${esc(s.name)} ended Failed.` : `Then a route whose condition says ${esc(s.name)} ended Failed: it has none.`}</li>
              <li>Then it is put to whoever holds Asked first when a Stage runs out of tries, then to you. Continuing with the issues follows its routes as usual.</li></ol></section>`;
      }
      function routeInspector(ctx, s, index, problems) {
        const r = s.routes[index];
        const editable = ctx.editable;
        const own = problems.filter((p) => p.key === s.key && p.route === index && p.level === "problem");
        const where = whereWords(r, ctx.stages);
        const order = orderOf(ctx.stages);
        const targets = order
          .filter((x) => x.key !== s.key)
          .map((x) => `<option value="${x.key}" ${r.to === x.key ? "selected" : ""}>${esc(x.name)}${x.place.c < s.place.c ? " (earlier: refused)" : x.place.c === s.place.c ? " (same column: refused)" : ""}</option>`)
          .join("");
        const goneTarget = r.to !== null && !stageOf(ctx.stages, r.to) ? `<option value="${esc(r.to)}" selected>${esc(where)} (gone)</option>` : "";
        const tools = editable
          ? `${ctx.mode === "office" ? `<button type="button" class="btn sm ghost" data-action="insert-on-route">${ICON.plus(12)} Insert a Stage on this route</button>` : ""}<button type="button" class="btn sm danger-ghost" data-route-remove="${index}">${ICON.trash(12)} Remove route</button>`
          : "";
        const head = `<div class="inspector-head"><h4 class="inspector-title">${ICON.route(14)}Route from ${esc(s.name)} to ${esc(where)} <small>${index + 1} of ${plural(s.routes.length, "route", "routes")} out of ${esc(s.name)}</small></h4><div class="inspector-tools">${tools}</div></div>`;
        const condition = `<fieldset class="radio-list" ${editable ? "" : `disabled title="${esc(readOnlyWhy(ctx))}"`}><legend class="field-label" style="margin-bottom:6px">Condition</legend>
            <label class="radio-option"><input type="radio" name="when" value="none" data-when="none" ${r.when ? "" : "checked"} /><b>No condition</b><span>Always holds. With other routes out of ${esc(s.name)}, it goes last, as otherwise.</span></label>
            <label class="radio-option"><input type="radio" name="when" value="some" data-when="some" ${r.when ? "checked" : ""} /><b>When these hold</b><span>Built-in tests of a Stage or the Definition of Done, or a Project command that exits 0, in All of and Any of groups.</span></label></fieldset>`;
        const builder = r.when ? groupEditor(r.when, "", ctx, s, index, problems, 0, editable) : "";
        const commands = r.when ? testsOf(r.when).filter(({ test }) => test.t === "command" && test.key) : [];
        const commandNote = commands.length
          ? `<p class="field-hint">${esc(listJoin(commands.map(({ test }) => test.key), "and"))} runs as ${esc(s.name)} ends, as a Script Stage's command runs: in the Task's worktree, with the Task's earlier Stage runs in the file OFFICE_STAGE_RUNS_FILE names. It holds when it exits 0; one that can't run stops the walk and asks you. Its output is kept on ${esc(s.name)}'s run.</p>`
          : "";
        return `<section class="inspector" aria-label="Route"><div>${head}</div><div class="inspector-body">${problemAlert(own)}
            <label class="field"><span class="field-label">Goes to</span><select class="select sm ${own.some((p) => /leads back|any more|no longer has/.test(p.text)) ? "invalid" : ""}" data-route-to ${editable ? "" : `disabled title="${esc(readOnlyWhy(ctx))}"`}>${goneTarget}${targets}<option value="" ${r.to === null ? "selected" : ""}>End</option></select><span class="field-hint">A later Stage, or End to make ${esc(s.name)} a final Stage. To go back, use ${esc(s.name)}'s On failure.</span></label>
            ${condition}${builder}<p class="cond-reads">${esc(routeReads(r, index, s, ctx.stages))}</p>${commandNote}</div></section>`;
      }
      /* The condition builder: a group's All of / Any of, its tests and groups, nested */
      function groupEditor(group, path, ctx, s, index, problems, depth, editable) {
        const order = orderOf(ctx.stages);
        const own = order.findIndex((x) => x.key === s.key);
        const earlier = order.slice(0, Math.max(0, own));
        const commandOptions =
          ctx.mode === "project"
            ? ctx.project.commands.map(([key, line]) => ({ key, words: `${key} · ${line}` }))
            : [...new Set(PROJECTS.flatMap((p) => p.commands.map(([key]) => key)))].map((key) => ({ key, words: `${key} · in ${listJoin(PROJECTS.filter((p) => p.commands.some(([k]) => k === key)).map((p) => p.name), "and")}` }));
        const dis = editable ? "" : `disabled title="${esc(readOnlyWhy(ctx))}"`;
        const items = group.items
          .map((item, i) => {
            const at = path === "" ? `${i}` : `${path}.${i}`;
            const join = i ? `<li class="cond-join">${group.all ? "and" : "or"}</li>` : "";
            if (item.items) return `${join}<li>${groupEditor(item, at, ctx, s, index, problems, depth + 1, editable)}</li>`;
            const bad = problems.filter((p) => p.key === s.key && p.route === index && p.test === at);
            const ofOwnStage = item.t === "stage" && (item.of === null || item.of === s.key);
            const subject = item.t === "stage" ? (ofOwnStage ? "prev" : item.of) : item.t;
            const named = item.t === "stage" && !ofOwnStage ? earlier.find((e) => e.key === item.of) : true;
            const staleName = item.t === "stage" && !ofOwnStage && !named ? (stageOf(ctx.stages, item.of)?.name ?? item.ofName ?? item.of) : null;
            const subjects = `<option value="prev" ${subject === "prev" ? "selected" : ""}>The previous Stage (${esc(s.name)})</option>${earlier.map((e) => `<option value="${e.key}" ${subject === e.key ? "selected" : ""}>${esc(e.name)}</option>`).join("")}${staleName ? `<option value="${item.of}" selected>${esc(staleName)} (${stageOf(ctx.stages, item.of) ? "later" : "gone"})</option>` : ""}<option value="dod" ${subject === "dod" ? "selected" : ""}>The Definition of Done</option><option value="command" ${subject === "command" ? "selected" : ""}>A Project command</option>`;
            let second;
            let extra = "";
            if (item.t === "stage") {
              second = `<select class="select sm" data-test-is="${at}" aria-label="Test" ${dis}>${Object.entries(STAGE_IS)
                .map(([k, w]) => `<option value="${k}" ${item.is === k ? "selected" : ""}>${k === "ran" ? "ran N or more times" : w}</option>`)
                .join("")}</select>`;
              if (item.is === "ran") extra = `<span class="stepper"><button type="button" data-test-n="${at}" data-step="-1" aria-label="Fewer" ${dis}>${ICON.minus(12)}</button><output>${item.n}</output><button type="button" data-test-n="${at}" data-step="1" aria-label="More" ${dis}>${ICON.plus(12)}</button></span>`;
            } else if (item.t === "dod") {
              second = `<select class="select sm" data-test-is="${at}" aria-label="Test" ${dis}><option value="met" ${item.is === "met" ? "selected" : ""}>is all Reported met</option><option value="unmet" ${item.is === "unmet" ? "selected" : ""}>has some not Reported met</option></select>`;
            } else {
              const known = commandOptions.some((o) => o.key === item.key);
              second = `<select class="select sm ${bad.length ? "invalid" : ""}" data-test-key="${at}" aria-label="Project command" ${dis}><option value="" ${item.key ? "" : "selected"}>Choose a command…</option>${commandOptions.map((o) => `<option value="${o.key}" ${item.key === o.key ? "selected" : ""}>${esc(o.words)}</option>`).join("")}${item.key && !known ? `<option value="${esc(item.key)}" selected>${esc(item.key)}</option>` : ""}</select>`;
            }
            const remove = `<button type="button" class="icon-button" data-remove-item="${at}" aria-label="Remove this test" title="Remove this test" ${dis}>${ICON.x(13)}</button>`;
            const note = item.t === "command" ? '<p class="cond-test-note">Holds when it exits 0.</p>' : "";
            return `${join}<li class="cond-test ${extra ? "with-extra" : ""}"><select class="select sm ${staleName ? "invalid" : ""}" data-test-subject="${at}" aria-label="What it tests" ${dis}>${subjects}</select>${second}${extra}${remove}${bad.map((p) => `<p class="cond-test-why">${esc(p.text)}</p>`).join("")}${note}</li>`;
          })
          .join("");
        const removeGroup = depth ? `<button type="button" class="icon-button" data-remove-item="${path}" aria-label="Remove this group" title="Remove this group" ${dis}>${ICON.x(13)}</button>` : "";
        const groupBad = problems.filter((p) => p.key === s.key && p.route === index && p.test === path && !group.items.length);
        return `<div class="cond-group"><div class="cond-group-head"><div class="segmented" role="group" aria-label="How these combine"><button type="button" data-group-all="${path}" data-value="1" aria-pressed="${group.all}" ${dis}>All of</button><button type="button" data-group-all="${path}" data-value="0" aria-pressed="${!group.all}" ${dis}>Any of</button></div><span class="grow">these ${group.all ? "hold" : "holds"}</span>${removeGroup}</div>
            ${group.items.length ? `<ul class="cond-items">${items}</ul>` : '<p class="empty-block">No test yet: add one, or remove this group.</p>'}${groupBad.map((p) => `<p class="cond-test-why">${esc(p.text)}</p>`).join("")}
            ${editable ? `<div class="cond-foot"><button type="button" class="btn sm secondary" data-add-test="${path}">${ICON.plus(12)} Add a test</button><button type="button" class="btn sm ghost" data-add-group="${path}">${ICON.group(12)} Add a group</button></div>` : ""}</div>`;
      }

      /* ---------- Dwight's Proposal in a Thread ---------- */
      function proposalCard() {
        const before = state.proposalBefore;
        const after = proposedFull(before);
        const changed = after.filter((s) => !same(s.routes, stageOf(before, s.key).routes));
        const side = (stages, stage, look) =>
          `<div class="proposal-route-side ${look}"><span>${look === "was" ? "Was" : "Proposed"}</span><ol>${stage.routes.map((r) => `<li>→ ${esc(whereWords(r, stages))} <span class="when">${esc(routeWhen(r, stage, stages, false))}</span></li>`).join("")}</ol></div>`;
        const rows = changed.map((s) => `<li><span class="proposal-change-label">Routes out of ${esc(s.name)}</span><div class="proposal-route-values">${side(before, stageOf(before, s.key), "was")}${side(after, s, "to")}</div></li>`).join("");
        const foot =
          state.proposal === "open"
            ? `<button type="button" class="btn sm" data-action="apply">Apply change</button><button type="button" class="btn sm ghost" data-action="decline">Not now</button><span class="proposal-note">Refused if it changes before you apply this</span>`
            : state.proposal === "applied"
              ? '<span class="badge success">Applied</span><span class="proposal-note">by you · just now</span>'
              : '<span class="badge">Not applied</span><span class="proposal-note">by you · just now</span>';
        const showOn = state.proposal === "open" ? `<button type="button" class="btn sm secondary" data-action="show-on-flow">${ICON.flow(12)} Show it on the flow</button>` : "";
        return `<div class="proposal-card"><div class="proposal-head"><span class="badge accent">Proposal</span><span class="proposal-title">Change the Full Pipeline</span></div>
            <ul class="proposal-changes">${rows}</ul>
            <div class="proposal-section"><div class="proposal-section-head"><span class="overline">Full, as proposed</span>${showOn}</div>
              ${canvas("flow-mini", after, { orient: "across", compact: true, readonly: true, before })}
              <p class="proposal-checked">${ICON.check(12)}<span>Checked: every Stage is reached, each has a route out and every route leads forward. Review &amp; fix's and Publish's On failure loops still have a path back.</span></p></div>
            <div class="proposal-foot">${foot}</div></div>`;
      }
      function chatPlace() {
        const drawerOpen = state.chat === "thread" || state.width === "wide";
        const look = isPhone() ? "fill" : state.width === "900" ? "over" : "";
        const turn = (who, time, body) =>
          `<div class="turn">${who === "You" ? '<span class="avatar you">You</span>' : '<span class="avatar dwight">DS</span>'}<div style="min-width:0"><div class="turn-by"><b>${who}</b>${who === "You" ? "" : "<span>Devops</span>"}<span>${time}</span></div><div class="said">${body}</div></div></div>`;
        const thread = `<div class="thread-column">
            ${turn("You", "10:02", "<p>Can Full run Review &amp; fix only when Implement changed files, and otherwise go straight to Publish?</p>")}
            ${turn(DEVOPS, "10:03", `<p>Here are Full's new routes out of Tests: Review &amp; fix only when Implement changed files, otherwise Publish. The rest stays as it is, and nothing changes until you apply it.</p>${proposalCard()}`)}
          </div>`;
        const drawer = drawerOpen
          ? `<aside class="chat-drawer ${look}" aria-label="Chat">
              <div class="drawer-head"><span class="avatar dwight">DS</span><div class="drawer-head-main"><span class="drawer-title">${DEVOPS}</span><span class="drawer-sub">Devops · proposes Pipelines, commands and run environments</span></div><button type="button" class="icon-button" aria-label="Close the chat" data-action="close-chat">${ICON.x()}</button></div>
              <div class="thread-row"><button type="button" class="btn ghost sm">${ICON.chevronLeft()} Threads</button><span class="thread-row-title">Full's routes</span></div>
              <div class="thread" id="thread">${thread}</div>
              <div class="composer"><textarea class="composer-field" rows="1" placeholder="Write to ${DEVOPS}…" aria-label="Message"></textarea></div>
            </aside>`
          : "";
        return shell({ title: "Pipelines", crumb: "Settings ›", rail: "settings", main: settingsPage(), overlay: drawer, chatOpen: drawerOpen, pushed: drawerOpen && state.width === "wide" });
      }

      /* ---------- Drawing the routes and loops once the Stages are laid out ---------- */
      /* A route needs a way round when a Stage stands in its straight path: one in a column between, on the row it leaves from. */
      function needsDetour(stages, from, target) {
        if (!target) return false;
        if (target.place.c <= from.place.c) return true;
        return live(stages).some((u) => u !== from && u !== target && u.place.c > from.place.c && u.place.c < target.place.c && u.place.r === from.place.r);
      }
      /* Loops get lanes above the Stages (beside them, top to bottom), so two loops that overlap never share a line. */
      function loopLanes(stages) {
        const loops = orderOf(stages)
          .filter((s) => s.onFailure && stageOf(stages, s.onFailure.to))
          .map((s) => ({ from: s, to: stageOf(stages, s.onFailure.to) }))
          .map((l) => ({ ...l, lo: Math.min(l.from.place.c, l.to.place.c), hi: Math.max(l.from.place.c, l.to.place.c) }))
          .sort((a, b) => a.hi - a.lo - (b.hi - b.lo));
        const lanes = [];
        for (const l of loops) {
          let lane = 0;
          while ((lanes[lane] ?? []).some((o) => !(o.hi <= l.lo || o.lo >= l.hi))) lane += 1;
          (lanes[lane] ??= []).push(l);
          l.lane = lane;
        }
        return { loops, count: lanes.length };
      }
      const orth = (points, radius = 6) => {
        const pts = points.filter((p, i) => i === 0 || p[0] !== points[i - 1][0] || p[1] !== points[i - 1][1]);
        let d = `M${pts[0][0]},${pts[0][1]}`;
        for (let i = 1; i < pts.length - 1; i += 1) {
          const [px, py] = pts[i - 1];
          const [x, y] = pts[i];
          const [nx, ny] = pts[i + 1];
          const r = Math.min(radius, Math.hypot(x - px, y - py) / 2, Math.hypot(nx - x, ny - y) / 2);
          const ax = x - Math.sign(x - px) * r;
          const ay = y - Math.sign(y - py) * r;
          const bx = x + Math.sign(nx - x) * r;
          const by = y + Math.sign(ny - y) * r;
          d += ` L${ax},${ay} Q${x},${y} ${bx},${by}`;
        }
        const last = pts.at(-1);
        return `${d} L${last[0]},${last[1]}`;
      };
      const arrowHead = (x, y, dir, cls) => {
        const p = dir === "down" ? `${x},${y} ${x - 4},${y - 7} ${x + 4},${y - 7}` : `${x},${y} ${x - 7},${y - 4} ${x - 7},${y + 4}`;
        return `<polygon class="${cls}" points="${p}"/>`;
      };
      function drawAll() {
        for (const id of Object.keys(FLOWS)) {
          const el = document.getElementById(id);
          if (el) drawFlow(el);
        }
      }
      function drawFlow(el) {
        const { stages, opts } = FLOWS[el.id];
        const down = el.dataset.orient === "down";
        const box = el.getBoundingClientRect();
        const ox = box.left + el.clientLeft;
        const oy = box.top + el.clientTop;
        const rel = (r) => ({ l: r.left - ox, t: r.top - oy, r: r.right - ox, b: r.bottom - oy, cx: (r.left + r.right) / 2 - ox, cy: (r.top + r.bottom) / 2 - oy });
        /* Lines join the Stages' cards, or their marks in a compact flow; bounds are the whole Stage, its name included */
        const nodes = {};
        const bounds = [];
        el.querySelectorAll(".flow-node").forEach((n) => {
          const whole = rel(n.getBoundingClientRect());
          bounds.push(whole);
          nodes[n.dataset.key] = opts.compact ? rel(n.querySelector(".stage-mark").getBoundingClientRect()) : whole;
        });
        const end = rel(el.querySelector(".flow-end").getBoundingClientRect());
        const ports = {};
        if (!down) el.querySelectorAll(".flow-port").forEach((p) => (ports[p.dataset.port] = rel(p.getBoundingClientRect())));
        const all = bounds;
        const maxBottom = Math.max(end.b, ...all.map((n) => n.b));
        const maxRight = Math.max(end.r, ...all.map((n) => n.r));
        const minTop = Math.min(...all.map((n) => n.t));
        const minLeft = Math.min(...all.map((n) => n.l));
        const { ctx, problems = [] } = opts;
        const before = opts.before;
        let detour = 0;
        let paths = "";
        let heads = "";
        let hits = "";
        const routeLook = (s, r, index, look) => {
          const picked = state.sel?.type === "route" && state.sel.key === s.key && state.sel.index === index;
          if (picked) return "selected";
          if (problems.some((p) => p.key === s.key && p.route === index && p.level === "problem")) return "problem";
          if (look) return look;
          if (ctx?.mode === "project") {
            if (s.removed) return "ghost";
            if (s.origin === "inserted" || stageOf(stages, r.to)?.origin === "inserted") return "inserted";
            if (s.routesChange !== undefined) return "changed";
          }
          return "";
        };
        const drawRoute = (s, r, index, look) => {
          const from = nodes[s.key];
          const target = r.to === null ? null : stageOf(stages, r.to);
          const t = r.to === null ? end : target ? nodes[target.key] : null;
          if (!from || !t) return;
          const cls = routeLook(s, r, index, look);
          const port = ports[`${s.key}:${index}`];
          const away = needsDetour(stages, s, target);
          let points;
          let tip;
          if (!down) {
            const sx = port ? port.cx : from.r;
            const sy = port ? port.cy : from.cy;
            const ex = t.l;
            const ey = t.cy;
            const mx = ex - 14;
            if (away) {
              const lane = maxBottom + 12 + detour * 8;
              detour += 1;
              points = [[sx, sy], [sx + 10, sy], [sx + 10, lane], [mx, lane], [mx, ey], [ex - 6, ey]];
            } else points = Math.abs(sy - ey) < 1 ? [[sx, sy], [ex - 6, ey]] : [[sx, sy], [mx, sy], [mx, ey], [ex - 6, ey]];
            tip = arrowHead(ex, ey, "right", `fl-arrow ${cls}`);
          } else {
            const sx = from.cx;
            const sy = from.b;
            const ex = t.cx;
            const ey = t.t;
            const my = ey - 14;
            if (away) {
              const gutter = maxRight + 12 + detour * 8;
              detour += 1;
              points = [[sx, sy], [sx, sy + 10], [gutter, sy + 10], [gutter, my], [ex, my], [ex, ey - 6]];
            } else points = Math.abs(sx - ex) < 1 ? [[sx, sy], [ex, ey - 6]] : [[sx, sy], [sx, my], [ex, my], [ex, ey - 6]];
            tip = arrowHead(ex, ey, "down", `fl-arrow ${cls}`);
          }
          const d = orth(points);
          paths += `<path class="fl-route ${cls}" d="${d}"/>`;
          heads += tip;
          if (index >= 0 && !opts.compact) hits += `<path class="fl-hit" d="${d}" data-select-route="${s.key}:${index}"><title>${esc(`${s.name} → ${whereWords(r, stages)}, ${routeWhen(r, s, stages, false)}`)}</title></path>`;
        };
        for (const s of stages) {
          if (s.removed) {
            s.routes.forEach((r, i) => drawRoute(s, r, -1, "ghost"));
            continue;
          }
          for (const l of routeDiff(s, before)) drawRoute(s, l.route, l.index, l.look);
        }
        /* The On failure loops: dashed red, above the Stages (beside them, top to bottom), with their ↺ mark */
        let loops = "";
        let pills = "";
        const lanes = loopLanes(stages);
        for (const l of lanes.loops) {
          const a = nodes[l.from.key];
          const b = nodes[l.to.key];
          if (!a || !b) continue;
          const bad = problems.some((p) => p.key === l.from.key && p.loop);
          const words = `On failure, ${l.from.name} goes back to ${l.to.name}, at most ${plural(l.from.onFailure.times, "time", "times")}`;
          let pts;
          let px;
          let py;
          if (!down) {
            const y = minTop - 12 - l.lane * 11;
            pts = [[a.cx + 6, a.t], [a.cx + 6, y], [b.cx - 6, y], [b.cx - 6, b.t - 6]];
            loops += arrowHead(b.cx - 6, b.t, "down", "fl-loop-arrow");
            px = (a.cx + b.cx) / 2;
            py = y;
          } else {
            const x = minLeft - 12 - l.lane * 11;
            pts = [[a.l, a.cy - 4], [x, a.cy - 4], [x, b.cy + 4], [b.l - 6, b.cy + 4]];
            loops += arrowHead(b.l, b.cy + 4, "right", "fl-loop-arrow");
            px = x;
            py = (a.cy + b.cy) / 2;
          }
          loops = `<path class="fl-loop ${bad ? "problem" : ""}" d="${orth(pts)}"/>` + loops;
          pills += `<button type="button" class="flow-pill" style="left:${px}px;top:${py}px" ${opts.compact ? "tabindex=\"-1\"" : `data-pick="${l.from.key}" data-loop="1"`} aria-label="${esc(words)}" title="${esc(words)}">↺ ${l.from.onFailure.times}×</button>`;
        }
        /* Where the walk starts */
        const first = orderOf(stages)[0];
        let start = "";
        if (first && nodes[first.key]) {
          const f = nodes[first.key];
          start = down
            ? `<circle class="fl-start" cx="${f.cx}" cy="${f.t - 24}" r="4"/><path class="fl-start-line" d="M${f.cx},${f.t - 20} L${f.cx},${f.t - 6}"/>${arrowHead(f.cx, f.t, "down", "fl-start")}`
            : `<circle class="fl-start" cx="${f.l - (opts.compact ? 16 : 24)}" cy="${f.cy}" r="4"/><path class="fl-start-line" d="M${f.l - (opts.compact ? 12 : 20)},${f.cy} L${f.l - 6},${f.cy}"/>${arrowHead(f.l, f.cy, "right", "fl-start")}`;
        }
        const svgEl = el.querySelector(".flow-lines");
        svgEl.setAttribute("width", el.clientWidth);
        svgEl.setAttribute("height", el.clientHeight);
        svgEl.innerHTML = `${start}${paths}${heads}${loops}${hits}<path class="fl-route temp" d="" id="${el.id}-temp" style="display:none"/>`;
        el.querySelector(".flow-labels").innerHTML = pills;
      }

      /* ---------- Dragging: a Stage to a place, or a route from a Stage's + ---------- */
      let drag = null;
      function cellAt(flowEl, clientX, clientY) {
        const grid = flowEl.querySelector(".flow-grid");
        const g = grid.getBoundingClientRect();
        const cs = getComputedStyle(grid);
        const cols = cs.gridTemplateColumns.split(" ").map(parseFloat);
        const rows = cs.gridTemplateRows.split(" ").map(parseFloat);
        const colGap = parseFloat(cs.columnGap) || 0;
        const rowGap = parseFloat(cs.rowGap) || 0;
        const down = flowEl.dataset.orient === "down";
        /* major: the Pipeline's order (columns across, bands down); minor: rows (lanes down) */
        const majorSizes = down ? rows.slice(0, -1) : cols.slice(0, -1);
        const minorSizes = down ? cols : rows;
        const majorGap = down ? rowGap : colGap;
        const minorGap = down ? colGap : rowGap;
        const major = down ? clientY - g.top : clientX - g.left;
        const minor = down ? clientX - g.left : clientY - g.top;
        let at = 0;
        let c = majorSizes.length;
        let newColumn = true;
        let slot = { start: 0, size: 0 };
        for (let i = 0; i < majorSizes.length; i += 1) {
          const size = majorSizes[i];
          if (major < at + size * 0.2) {
            c = i;
            newColumn = true;
            slot = { start: at - majorGap / 2, size: 0 };
            break;
          }
          if (major <= at + size * 0.8) {
            c = i;
            newColumn = false;
            slot = { start: at, size };
            break;
          }
          at += size + majorGap;
          slot = { start: at - majorGap / 2, size: 0 };
        }
        let r = minorSizes.length;
        let mat = 0;
        let minorSlot = { start: 0, size: minorSizes[0] ?? 60 };
        for (let i = 0; i < minorSizes.length; i += 1) {
          if (minor <= mat + minorSizes[i] + minorGap / 2) {
            r = i;
            minorSlot = { start: mat, size: minorSizes[i] };
            break;
          }
          mat += minorSizes[i] + minorGap;
          minorSlot = { start: mat, size: minorSizes[0] ?? 60 };
        }
        const fr = flowEl.getBoundingClientRect();
        const gx = g.left - fr.left - flowEl.clientLeft;
        const gy = g.top - fr.top - flowEl.clientTop;
        const ghost = newColumn
          ? down
            ? { left: gx, top: gy + slot.start - 3, width: g.width, height: 6 }
            : { left: gx + slot.start - 3, top: gy, width: 6, height: g.height }
          : down
            ? { left: gx + minorSlot.start, top: gy + slot.start, width: minorSlot.size, height: slot.size }
            : { left: gx + slot.start, top: gy + minorSlot.start, width: slot.size, height: minorSlot.size };
        return { c, r, newColumn, ghost };
      }
      function showDrop(flowEl, ghost, column) {
        let drop = flowEl.querySelector(".flow-drop");
        if (!drop) {
          drop = document.createElement("div");
          flowEl.appendChild(drop);
        }
        drop.className = `flow-drop ${column ? "column" : ""}`;

            const n = old.n ?? 2;
            group.items[last] =
              t.value === "dod" ? dodTest("unmet") : t.value === "command" ? commandTest("") : stageTest(t.value === "prev" ? null : t.value, is, is === "ran" ? { n } : {});
          });
        } else if (ds.testIs) {
          editRoute((route) => {
            const test = getAt(route.when, ds.testIs);
            test.is = t.value;
            if (t.value === "ran") test.n = test.n ?? 2;
          });
        } else if (ds.testKey) {
          editRoute((route) => (getAt(route.when, ds.testKey).key = t.value));
        } else if (ds.loopTo) {
          const s = stageOf(editorCtx().pipeline.stages, ds.loopTo);
          s.onFailure = t.value ? { to: t.value, times: s.onFailure?.times ?? 1 } : null;
          state.flash = "loop";
        } else if (ds.applyTo) {
          const pp = ppOpen();
          const change = pp.changes[Number(ds.applyTo)];
          const target = stageOf(editorCtx().stages, t.value);
          if (!target) return;
          change.key = target.key;
          change.name = target.name;
        } else return;
        render();
      }
      function onKey(e) {
        if (e.key === "Escape" && state.menu) {
          state.menu = null;
          return render();
        }
        const nodeEl = e.target.closest?.(".flow-node");
        if (nodeEl && nodeEl.closest("#flow-main") && e.target === nodeEl) {
          const key = nodeEl.dataset.key;
          const down = nodeEl.closest(".flow").dataset.orient === "down";
          const ctx = editorCtx();
          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            pick(key);
            state.focusKey = key;
            return render();
          }
          const arrows = down
            ? { ArrowUp: "earlier", ArrowDown: "later", ArrowLeft: "up", ArrowRight: "down" }
            : { ArrowLeft: "earlier", ArrowRight: "later", ArrowUp: "up", ArrowDown: "down" };
          const dir = arrows[e.key];
          if (!dir) return;
          e.preventDefault();
          if (e.shiftKey && ctx.mode === "office" && ctx.editable) {
            nudge(key, dir);
            state.sel = { type: "stage", key };
            state.focusKey = key;
            return render();
          }
          const order = orderOf(ctx.stages);
          const i = order.findIndex((s) => s.key === key);
          const next = order[dir === "earlier" || dir === "up" ? i - 1 : i + 1];
          if (next) document.querySelector(`#flow-main .flow-node[data-key="${next.key}"]`)?.focus();
          return;
        }
        const routeEl = e.target.closest?.("[data-select-route]");
        if ((e.key === "Delete" || e.key === "Backspace") && routeEl && editorCtx().editable) {
          e.preventDefault();
          /* The route the focus is on, which Tab may have reached without picking it */
          const [key, index] = routeEl.dataset.selectRoute.split(":");
          removeRoute(key, Number(index));
        }
      }
      function writeHash() {
        history.replaceState(null, "", `#${state.scenario}/${state.width}/${state.palette}`);
      }
      function readHash() {
        const [s, w, p] = location.hash.slice(1).split("/");
        if (SCENARIOS.some((x) => x.key === s)) state.scenario = s;
        if (WIDTHS.some((x) => x.key === w)) state.width = w;
        if (PALETTES.some((x) => x.key === p)) state.palette = p;
      }
      document.addEventListener("click", onClick);
      document.addEventListener("change", onChange);
      document.addEventListener("keydown", onKey);
      window.addEventListener("resize", () => drawAll());
      readHash();
      applyScenario();
      render();
    </script>
  </body>
</html>
