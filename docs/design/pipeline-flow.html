<!doctype html>
<html lang="en" data-palette="light" data-theme="light" data-density="comfortable">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>The Pipeline flow editor · design proposal · The Office</title>
    <style>
      /* ---------- Tokens (design-system/tokens/, as docs/design/project-pipelines.html copied them) ---------- */
      :root {
        --ember-50: #fff2ed;
        --ember-300: #ff9370;
        --ember-500: #f23d0f;
        --ember-700: #9e2406;
        --flare-300: #ffc266;
        --white: #ffffff;
        --gray-25: #fafaf9;
        --gray-50: #f4f4f2;
        --gray-100: #e9e9e6;
        --gray-150: #dededa;
        --gray-200: #d1d1cc;
        --gray-300: #b1b1ab;
        --gray-400: #8a8a84;
        --gray-500: #6b6b66;
        --gray-600: #50504c;
        --gray-700: #3a3a37;
        --gray-800: #262624;
        --gray-900: #181817;
        --gray-950: #0f0f0e;
        --green-50: #edf8f1;
        --green-100: #d5f0df;
        --green-500: #1e9e57;
        --green-700: #106a3b;
        --amber-50: #fff8e6;
        --amber-100: #ffedc2;
        --amber-500: #e5a00d;
        --amber-700: #865b05;
        --red-50: #fdeef0;
        --red-100: #fad9dd;
        --red-500: #c8102e;
        --red-700: #8e0b20;
        --blue-50: #eef3fd;
        --blue-100: #dae5fa;
        --blue-500: #2f6bdb;
        --blue-700: #1d4699;
        --teal-500: #14a38b;
        --violet-500: #7c5cd6;

        --bg: var(--gray-50);
        --surface: var(--white);
        --surface-raised: var(--white);
        --surface-sunken: var(--gray-50);
        --surface-hover: var(--gray-25);
        --surface-selected: var(--ember-50);
        --fg-1: var(--gray-950);
        --fg-2: var(--gray-600);
        --fg-3: var(--gray-500);
        --border: var(--gray-150);
        --border-subtle: var(--gray-100);
        --border-strong: var(--gray-200);
        --border-focus: var(--ember-500);
        --accent: var(--ember-500);
        --accent-subtle: var(--ember-50);
        --accent-subtle-fg: var(--ember-700);
        --primary: var(--gray-900);
        --primary-hover: var(--gray-700);
        --primary-fg: var(--white);
        --control-hover: var(--gray-50);
        --control-press: var(--gray-100);
        --success: var(--green-500);
        --success-subtle: var(--green-50);
        --success-fg: var(--green-700);
        --success-border: var(--green-100);
        --warning: var(--amber-500);
        --warning-subtle: var(--amber-50);
        --warning-fg: var(--amber-700);
        --warning-border: var(--amber-100);
        --danger: var(--red-500);
        --danger-subtle: var(--red-50);
        --danger-fg: var(--red-700);
        --danger-border: var(--red-100);
        --info: var(--blue-500);
        --info-subtle: var(--blue-50);
        --info-fg: var(--blue-700);
        --info-border: var(--blue-100);
        --neutral-subtle: var(--gray-50);
        --neutral-fg: var(--gray-600);
        --neutral-border: var(--gray-150);
        --overlay: color-mix(in oklab, var(--gray-950) 45%, transparent);

        --font-sans: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        --font-mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        --text-2xs: 11px;
        --text-xs: 12px;
        --text-sm: 13px;
        --text-md: 14px;
        --text-lg: 16px;
        --type-body: 400 var(--text-md) / 1.5 var(--font-sans);
        --type-body-sm: 400 var(--text-sm) / 1.45 var(--font-sans);
        --type-label: 500 var(--text-sm) / 1.35 var(--font-sans);
        --type-caption: 400 var(--text-xs) / 1.4 var(--font-sans);
        --type-card-title: 600 var(--text-md) / 1.4 var(--font-sans);
        --type-section-title: 600 var(--text-lg) / 1.3 var(--font-sans);
        --type-overline: 500 var(--text-2xs) / 1.2 var(--font-mono);
        --type-mono: 400 var(--text-xs) / 1.55 var(--font-mono);
        --tracking-caps: 0.06em;
        --tracking-tight: -0.01em;

        --radius-sm: 4px;
        --radius-md: 6px;
        --radius-lg: 8px;
        --radius-xl: 12px;
        --radius-full: 999px;
        --radius-control: var(--radius-md);
        --radius-badge: var(--radius-sm);
        --control-sm: 28px;
        --control-md: 32px;

        --shadow-1: 0 1px 2px rgba(16, 16, 15, 0.05);
        --shadow-2: 0 4px 12px -2px rgba(16, 16, 15, 0.08), 0 1px 3px rgba(16, 16, 15, 0.05);
        --shadow-3: 0 16px 40px -8px rgba(16, 16, 15, 0.18), 0 2px 6px rgba(16, 16, 15, 0.06);
        --ease-out: cubic-bezier(0.2, 0.8, 0.2, 1);
        --duration-fast: 120ms;
        --duration-base: 200ms;
      }
      [data-theme="dark"] {
        --surface-selected: color-mix(in oklab, var(--ember-500) 12%, var(--gray-900));
        --accent-subtle: color-mix(in oklab, var(--ember-500) 16%, transparent);
        --accent-subtle-fg: var(--ember-300);
        --success-subtle: color-mix(in oklab, var(--green-500) 16%, transparent);
        --success-fg: #6fd69b;
        --success-border: color-mix(in oklab, var(--green-500) 30%, transparent);
        --warning-subtle: color-mix(in oklab, var(--amber-500) 16%, transparent);
        --warning-fg: var(--flare-300);
        --warning-border: color-mix(in oklab, var(--amber-500) 30%, transparent);
        --danger-subtle: color-mix(in oklab, var(--red-500) 20%, transparent);
        --danger-fg: #ff8a97;
        --danger-border: color-mix(in oklab, var(--red-500) 36%, transparent);
        --info-subtle: color-mix(in oklab, var(--blue-500) 18%, transparent);
        --info-fg: #93b5f5;
        --info-border: color-mix(in oklab, var(--blue-500) 34%, transparent);
        --overlay: color-mix(in oklab, #000 65%, transparent);
        --shadow-1: 0 0 0 1px rgba(255, 255, 255, 0.04);
        --shadow-2: 0 4px 12px -2px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.06);
        --shadow-3: 0 16px 40px -8px rgba(0, 0, 0, 0.65), 0 0 0 1px rgba(255, 255, 255, 0.08);
      }
      /* packages/ui/src/appearance/palettes/light.css */
      :root[data-palette="light"] {
        --fg-1: var(--gray-800);
        --fg-2: var(--gray-500);
        --fg-3: var(--gray-400);
        --border: var(--gray-100);
        --border-subtle: #efefec;
        --border-strong: var(--gray-150);
        --neutral-fg: var(--gray-500);
        --neutral-border: var(--gray-100);
      }
      /* packages/ui/src/appearance/palettes/dark.css */
      :root[data-palette="dark"] {
        --bg: #161615;
        --surface: #1d1d1b;
        --surface-raised: #242422;
        --surface-sunken: #131312;
        --surface-hover: #222220;
        --surface-selected: #2a2420;
        --fg-1: #d9d9d5;
        --fg-2: #9a9a94;
        --fg-3: #6f6f69;
        --border: #262624;
        --border-subtle: #222220;
        --border-strong: #33332f;
        --primary: #d9d9d5;
        --primary-fg: #161615;
        --primary-hover: #e6e6e2;
        --control-hover: #262624;
        --control-press: #2e2e2b;
        --neutral-subtle: #242422;
        --neutral-fg: #9a9a94;
        --neutral-border: #2e2e2b;
      }
      /* packages/ui/src/appearance/densities/comfortable.css */
      :root[data-density="comfortable"] {
        --pad-card: 16px 18px;
        --pad-row: 10px 14px;
        --radius-card: 10px;
        --gap-card: 16px;
      }

      /* ---------- Base (design-system/tokens/base.css) ---------- */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
        color: inherit;
      }
      @supports selector(::-webkit-scrollbar) {
        ::-webkit-scrollbar {
          width: 10px;
          height: 10px;
        }
        ::-webkit-scrollbar-track,
        ::-webkit-scrollbar-corner {
          background: transparent;
        }
        ::-webkit-scrollbar-thumb {
          border: 3px solid transparent;
          border-radius: var(--radius-full);
          background: var(--border-strong) padding-box;
        }
      }
      @supports not selector(::-webkit-scrollbar) {
        * {
          scrollbar-width: thin;
          scrollbar-color: var(--border-strong) transparent;
        }
      }
      :is(button, input, select, textarea, [tabindex]):focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 1px;
      }
      @keyframes rise {
        from {
          opacity: 0;
          transform: translate(-50%, 6px);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation: none !important;
          transition: none !important;
        }
      }

      /* ---------- packages/ui, re-drawn: badge, avatar, button, fields, alert, menu, toast, segmented control, stepper, radio list ---------- */
      .badge {
        display: inline-flex;
        flex: none;
        align-items: center;
        gap: 5px;
        height: 22px;
        padding: 0 8px;
        border: 1px solid var(--neutral-border);
        border-radius: var(--radius-badge);
        background: var(--neutral-subtle);
        color: var(--neutral-fg);
        font: 500 var(--text-xs) / 1 var(--font-sans);
        white-space: nowrap;
      }
      .badge.sm {
        height: 18px;
        padding: 0 6px;
        font-size: var(--text-2xs);
      }
      .badge.success {
        border-color: var(--success-border);
        background: var(--success-subtle);
        color: var(--success-fg);
      }
      .badge.warning {
        border-color: var(--warning-border);
        background: var(--warning-subtle);
        color: var(--warning-fg);
      }
      .badge.danger {
        border-color: var(--danger-border);
        background: var(--danger-subtle);
        color: var(--danger-fg);
      }
      .badge.info {
        border-color: var(--info-border);
        background: var(--info-subtle);
        color: var(--info-fg);
      }
      .badge.accent {
        border-color: transparent;
        background: var(--accent-subtle);
        color: var(--accent-subtle-fg);
      }
      .avatar {
        display: inline-grid;
        flex: none;
        place-items: center;
        width: 24px;
        height: 24px;
        border-radius: 50%;
        background: var(--avatar-bg, var(--gray-100));
        color: var(--avatar-fg, var(--gray-700));
        font: 600 9px/1 var(--font-sans);
      }
      .avatar.dwight {
        --avatar-bg: color-mix(in oklab, var(--amber-500) 24%, var(--surface));
        --avatar-fg: color-mix(in oklab, var(--amber-700) 80%, var(--fg-1));
      }
      .avatar.you {
        --avatar-bg: var(--neutral-subtle);
        --avatar-fg: var(--fg-2);
      }
      .btn {
        display: inline-flex;
        flex: none;
        align-items: center;
        justify-content: center;
        gap: 6px;
        height: var(--control-md);
        padding: 0 12px;
        border: 1px solid transparent;
        border-radius: var(--radius-control);
        background: var(--primary);
        color: var(--primary-fg);
        font: 500 var(--text-sm) / 1 var(--font-sans);
        white-space: nowrap;
        cursor: pointer;
        transition: background var(--duration-fast) var(--ease-out);
      }
      .btn:hover {
        background: var(--primary-hover);
      }
      .btn.sm {
        height: var(--control-sm);
        padding: 0 10px;
        font-size: var(--text-xs);
      }
      .btn.secondary {
        border-color: var(--border-strong);
        background: var(--surface);
        color: var(--fg-1);
      }
      .btn.secondary:hover {
        background: var(--control-hover);
      }
      .btn.ghost {
        background: none;
        color: var(--fg-2);
      }
      .btn.ghost:hover {
        background: var(--control-hover);
        color: var(--fg-1);
      }
      .btn.danger-ghost {
        background: none;
        color: var(--danger-fg);
      }
      .btn.danger-ghost:hover {
        background: var(--danger-subtle);
      }
      .btn[disabled],
      .btn[aria-disabled="true"] {
        opacity: 0.45;
        cursor: not-allowed;
      }
      .icon-button {
        display: inline-grid;
        flex: none;
        place-items: center;
        width: var(--control-sm);
        height: var(--control-sm);
        padding: 0;
        border: 0;
        border-radius: var(--radius-md);
        background: none;
        color: var(--fg-2);
        cursor: pointer;
      }
      .icon-button:hover,
      .icon-button[aria-expanded="true"] {
        background: var(--control-hover);
        color: var(--fg-1);
      }
      .icon-button.danger {
        color: var(--danger-fg);
      }
      .icon-button[aria-disabled="true"],
      .icon-button[disabled] {
        opacity: 0.4;
        cursor: not-allowed;
      }
      .text-link {
        padding: 0;
        border: 0;
        background: none;
        color: var(--fg-1);
        font: inherit;
        font-weight: 500;
        text-align: left;
        text-decoration: underline;
        text-decoration-color: var(--border-strong);
        text-underline-offset: 2px;
        cursor: pointer;
      }
      .text-link:hover {
        text-decoration-color: currentColor;
      }
      .overline {
        font: var(--type-overline);
        letter-spacing: var(--tracking-caps);
        text-transform: uppercase;
        color: var(--fg-3);
      }
      code,
      .mono {
        font: var(--type-mono);
      }
      .field {
        display: flex;
        flex-direction: column;
        gap: 5px;
        min-width: 0;
      }
      .field-label {
        font: var(--type-label);
        color: var(--fg-1);
      }
      .field-hint {
        margin: 0;
        font: var(--type-caption);
        color: var(--fg-3);
      }
      .input,
      .select,
      .textarea {
        width: 100%;
        min-width: 0;
        height: var(--control-md);
        padding: 0 10px;
        border: 1px solid var(--border-strong);
        border-radius: var(--radius-control);
        background: var(--surface);
        color: var(--fg-1);
        font: var(--type-body-sm);
      }
      .select {
        appearance: none;
        padding-right: 28px;
        background-image: linear-gradient(45deg, transparent 50%, var(--fg-3) 50%), linear-gradient(135deg, var(--fg-3) 50%, transparent 50%);
        background-position:
          calc(100% - 14px) 50%,
          calc(100% - 10px) 50%;
        background-size: 4px 4px;
        background-repeat: no-repeat;
        text-overflow: ellipsis;
      }
      .select.sm,
      .input.sm {
        height: var(--control-sm);
        font-size: var(--text-xs);
      }
      .select.invalid,
      .input.invalid {
        border-color: var(--danger);
      }
      .textarea {
        height: auto;
        min-height: 64px;
        padding: 7px 10px;
        line-height: 1.5;
        resize: vertical;
      }
      .input[disabled],
      .select[disabled],
      .textarea[disabled] {
        background-color: var(--surface-sunken);
        color: var(--fg-3);
      }
      .alert {
        display: grid;
        grid-template-columns: 18px minmax(0, 1fr);
        gap: 2px 10px;
        padding: 11px 14px;
        border: 1px solid var(--info-border);
        border-radius: var(--radius-lg);
        background: var(--info-subtle);
        color: var(--fg-1);
        font: var(--type-body-sm);
      }
      .alert > svg {
        margin-top: 2px;
        color: var(--info-fg);
      }
      .alert-title {
        font-weight: 600;
        overflow-wrap: anywhere;
      }
      .alert-body {
        grid-column: 2;
        min-width: 0;
        color: var(--fg-2);
        overflow-wrap: anywhere;
      }
      .alert-body p {
        margin: 2px 0 0;
      }
      .alert-body ul {
        margin: 4px 0 0;
        padding-left: 16px;
      }
      .alert-body li + li {
        margin-top: 3px;
      }
      .alert-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        grid-column: 2;
        margin-top: 6px;
      }
      .alert.warning {
        border-color: var(--warning-border);
        background: var(--warning-subtle);
      }
      .alert.warning > svg {
        color: var(--warning-fg);
      }
      .alert.danger {
        border-color: var(--danger-border);
        background: var(--danger-subtle);
      }
      .alert.danger > svg {
        color: var(--danger-fg);
      }
      .alert.success {
        border-color: var(--success-border);
        background: var(--success-subtle);
      }
      .alert.success > svg {
        color: var(--success-fg);
      }
      .alert.accent {
        border-color: color-mix(in oklab, var(--accent) 40%, transparent);
        background: var(--accent-subtle);
      }
      .alert.accent > svg {
        color: var(--accent-subtle-fg);
      }
      .menu-wrap {
        position: relative;
        display: inline-flex;
      }
      .menu {
        position: absolute;
        top: calc(100% + 4px);
        left: 0;
        z-index: 40;
        display: flex;
        flex-direction: column;
        width: 248px;
        max-width: calc(100cqw - 24px);
        padding: 4px;
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        background: var(--surface-raised);
        box-shadow: var(--shadow-3);
      }
      .menu.end {
        right: 0;
        left: auto;
      }
      .menu-item {
        display: flex;
        align-items: center;
        gap: 8px;
        min-height: 32px;
        padding: 4px 8px;
        border: 0;
        border-radius: var(--radius-md);
        background: none;
        color: var(--fg-1);
        font: var(--type-body-sm);
        text-align: left;
        cursor: pointer;
      }
      .menu-item:hover {
        background: var(--control-hover);
      }
      .menu-item svg {
        flex: none;
        color: var(--fg-2);
      }
      .menu-item[aria-disabled="true"] {
        color: var(--fg-3);
        cursor: not-allowed;
      }
      .menu-item-words {
        display: grid;
        min-width: 0;
      }
      .menu-item-words small {
        font: var(--type-caption);
        color: var(--fg-3);
      }
      .menu-label {
        padding: 6px 8px 2px;
        font: var(--type-overline);
        letter-spacing: var(--tracking-caps);
        text-transform: uppercase;
        color: var(--fg-3);
      }
      .menu-rule {
        height: 1px;
        margin: 4px;
        background: var(--border-subtle);
      }
      .toast {
        position: absolute;
        bottom: 18px;
        left: 50%;
        z-index: 400;
        max-width: min(520px, calc(100% - 24px));
        padding: 10px 14px;
        border-radius: var(--radius-lg);
        background: var(--primary);
        color: var(--primary-fg);
        font: var(--type-body-sm);
        box-shadow: var(--shadow-3);
        transform: translateX(-50%);
        animation: rise var(--duration-base) var(--ease-out);
      }
      /* SegmentedControl (design-system/components/forms/SegmentedControl.jsx) */
      .segmented {
        display: inline-flex;
        flex: none;
        gap: 2px;
        padding: 2px;
        border-radius: var(--radius-md);
        background: var(--control-press);
      }
      .segmented button {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        height: 24px;
        padding: 0 10px;
        border: 0;
        border-radius: var(--radius-sm);
        background: none;
        color: var(--fg-2);
        font: 500 var(--text-xs) / 1 var(--font-sans);
        cursor: pointer;
      }
      .segmented button[aria-pressed="true"] {
        background: var(--surface);
        color: var(--fg-1);
        box-shadow: var(--shadow-1);
      }
      .segmented button[disabled] {
        opacity: 0.45;
        cursor: not-allowed;
      }
      /* Stepper (packages/ui/src/stepper.tsx) */
      .stepper {
        display: inline-flex;
        flex: none;
        align-items: center;
        height: var(--control-sm);
        border: 1px solid var(--border-strong);
        border-radius: var(--radius-control);
        background: var(--surface);
      }
      .stepper button {
        display: grid;
        place-items: center;
        width: 26px;
        height: 100%;
        padding: 0;
        border: 0;
        background: none;
        color: var(--fg-2);
        cursor: pointer;
      }
      .stepper button[disabled] {
        opacity: 0.45;
        cursor: not-allowed;
      }
      .stepper output {
        min-width: 22px;
        font: 500 var(--text-xs) / 1 var(--font-sans);
        font-variant-numeric: tabular-nums;
        text-align: center;
      }
      /* RadioList (packages/ui/src/radio-list.tsx) */
      .radio-list {
        display: grid;
        gap: 6px;
        margin: 0;
        padding: 0;
        border: 0;
      }
      .radio-option {
        display: grid;
        grid-template-columns: 16px minmax(0, 1fr);
        gap: 2px 8px;
        align-items: start;
        padding: 8px 10px;
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        background: var(--surface);
        cursor: pointer;
      }
      .radio-option:has(input:checked) {
        border-color: var(--accent);
        background: var(--surface-selected);
      }
      .radio-option input {
        margin: 2px 0 0;
        accent-color: var(--accent);
      }
      .radio-option b {
        font: var(--type-label);
      }
      .radio-option span {
        grid-column: 2;
        font: var(--type-caption);
        color: var(--fg-3);
      }

      /* ---------- The design page around the mock ---------- */
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg-1);
        font: var(--type-body);
      }
      .bar {
        position: sticky;
        top: 0;
        z-index: 10;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px 18px;
        padding: 10px 16px;
        background: #181817;
        color: #e6e6e2;
      }
      .bar-title {
        font-weight: 600;
      }
      .bar-tag {
        padding: 1px 6px;
        border-radius: 4px;
        background: var(--ember-500);
        color: #fff;
        font: var(--type-overline);
      }
      .control {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
      }
      .control-label {
        font: var(--type-overline);
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: #b1b1ab;
      }
      .segments {
        display: flex;
        flex-wrap: wrap;
        overflow: hidden;
        border: 1px solid #50504c;
        border-radius: 6px;
      }
      .segments button {
        padding: 4px 10px;
        border: 0;
        background: none;
        font: var(--type-caption);
        color: #d1d1cc;
        cursor: pointer;
      }
      .segments button + button {
        border-left: 1px solid #50504c;
      }
      .segments button[aria-pressed="true"] {
        background: #f4f4f2;
        color: #181817;
      }
      /* The segments clip what runs past them, so their focus ring sits inside */
      .segments button:focus-visible {
        outline-offset: -2px;
      }
      .bar-break {
        flex-basis: 100%;
        height: 0;
      }
      .stage {
        display: grid;
        gap: 14px;
        padding: 16px 24px 40px;
      }
      .scenario-note {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 6px 12px;
        max-width: 130ch;
        margin: 0;
        font: var(--type-body-sm);
        color: var(--fg-2);
      }
      .scenario-note strong {
        color: var(--fg-1);
      }
      .scenario-note .note-actions {
        display: inline-flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .frame-row {
        display: flex;
        justify-content: center;
        overflow-x: auto;
      }
      .frame {
        position: relative;
        flex: none;
        height: max(720px, calc(100vh - 220px));
        overflow: hidden;
        border: 1px solid var(--border-strong);
        border-radius: 10px;
        background: var(--bg);
        box-shadow: var(--shadow-2);
      }
      .frame.w-wide {
        flex: 1 1 auto;
        width: 100%;
      }
      .frame.w-900 {
        width: 900px;
      }
      .frame.w-390 {
        width: 390px;
        height: max(720px, min(844px, calc(100vh - 220px)));
      }
      .reference {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(330px, 1fr));
        gap: 18px 28px;
        max-width: 1400px;
        font: var(--type-body-sm);
        color: var(--fg-2);
      }
      .reference h2 {
        margin: 0 0 8px;
        font: var(--type-card-title);
        color: var(--fg-1);
      }
      .reference p,
      .reference ul,
      .reference table {
        margin: 0 0 8px;
      }
      .reference ul {
        padding-left: 18px;
      }
      .reference li + li {
        margin-top: 4px;
      }
      .reference table {
        width: 100%;
        border-collapse: collapse;
      }
      .reference th,
      .reference td {
        padding: 5px 8px 5px 0;
        border-bottom: 1px solid var(--border);
        text-align: left;
        vertical-align: top;
      }
      .reference th {
        font: var(--type-overline);
        letter-spacing: var(--tracking-caps);
        text-transform: uppercase;
        color: var(--fg-3);
      }
      .reference kbd {
        padding: 0 4px;
        border: 1px solid var(--border-strong);
        border-radius: var(--radius-sm);
        background: var(--surface);
        font: var(--type-mono);
      }

      /* ---------- The app: Shell A3 · Desk ---------- */
      .app {
        position: absolute;
        inset: 0;
        display: grid;
        grid-template-columns: 56px minmax(0, 1fr);
        grid-template-rows: 56px 48px minmax(0, 1fr);
        color: var(--fg-1);
        font: var(--type-body);
      }
      .app.w-phone {
        grid-template-columns: minmax(0, 1fr);
      }
      .rail {
        grid-row: 1 / -1;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        padding: 12px 0;
        border-right: 1px solid var(--border);
        background: var(--surface);
      }
      .app.w-phone .rail {
        display: none;
      }
      .rail-mark {
        display: grid;
        place-items: center;
        width: 28px;
        height: 28px;
        margin-bottom: 12px;
        border-radius: 7px;
        background: var(--ember-500);
        color: var(--white);
        font: 700 12px/1 var(--font-sans);
      }
      .rail-item {
        position: relative;
        display: grid;
        place-items: center;
        width: 40px;
        height: 40px;
        border-radius: var(--radius-lg);
        color: var(--fg-2);
      }
      .rail-item.on {
        background: var(--surface-selected);
        color: var(--accent-subtle-fg);
      }
      .rail-item.on::before {
        content: "";
        position: absolute;
        left: -8px;
        width: 3px;
        height: 16px;
        border-radius: 0 2px 2px 0;
        background: var(--accent);
      }
      .top {
        display: flex;
        align-items: center;
        gap: 12px;
        min-width: 0;
        padding: 0 20px;
        border-bottom: 1px solid var(--border);
        background: var(--bg);
      }
      .app.w-phone .top {
        gap: 8px;
        padding: 0 12px;
      }
      .top h1 {
        min-width: 0;
        margin: 0;
        overflow: hidden;
        font: var(--type-section-title);
        letter-spacing: var(--tracking-tight);
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      .crumb {
        flex: none;
        font: var(--type-body-sm);
        color: var(--fg-3);
        white-space: nowrap;
      }
      .app.w-phone .crumb {
        display: none;
      }
      .grow {
        flex: 1;
        min-width: 0;
      }
      .chat-button {
        display: inline-flex;
        flex: none;
        align-items: center;
        gap: 6px;
        height: var(--control-md);
        padding: 0 10px;
        border: 1px solid var(--border-strong);
        border-radius: var(--radius-control);
        background: var(--surface);
        font: 500 var(--text-sm) / 1 var(--font-sans);
      }
      .chat-button.open {
        background: var(--control-press);
      }
      .strip {
        display: flex;
        align-items: center;
        gap: 24px;
        min-width: 0;
        padding: 0 20px;
        overflow: hidden;
        border-bottom: 1px solid var(--border);
        background: var(--surface);
        font: var(--type-body-sm);
        color: var(--fg-2);
        white-space: nowrap;
      }
      .app.w-phone .strip {
        gap: 14px;
        padding: 0 12px;
      }
      .strip b {
        font: 600 15px/1 var(--font-sans);
        color: var(--fg-1);
      }
      .main {
        position: relative;
        min-width: 0;
        min-height: 0;
        overflow: hidden;
        container: page / inline-size;
      }
      .app.pushed .main {
        margin-right: 420px;
      }
      .page-scroll {
        position: absolute;
        inset: 0;
        overflow-x: hidden;
        overflow-y: auto;
        padding: 20px 24px 40px;
      }
      .card {
        display: flex;
        flex-direction: column;
        gap: 12px;
        min-width: 0;
        padding: var(--pad-card);
        border: 1px solid var(--border);
        border-radius: var(--radius-card);
        background: var(--surface);
        box-shadow: var(--shadow-1);
      }
      .card-head {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px 10px;
        min-width: 0;
      }
      .card-title {
        display: flex;
        flex: 1 1 auto;
        align-items: center;
        gap: 8px;
        min-width: 0;
        margin: 0;
        font: var(--type-card-title);
        overflow-wrap: anywhere;
      }
      .card-title svg {
        flex: none;
        color: var(--fg-2);
      }
      .card p {
        margin: 0;
      }
      .note {
        margin: 0;
        font: var(--type-caption);
        color: var(--fg-3);
      }
      .project-mark {
        display: inline-grid;
        flex: none;
        place-items: center;
        width: 18px;
        height: 18px;
        border-radius: 5px;
        background: var(--mark);
        color: var(--white);
        font: 700 10px/1 var(--font-sans);
      }
      .project-chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        min-width: 0;
        font: var(--type-label);
        overflow-wrap: anywhere;
      }

      /* ---------- Settings and a Project page: their sections beside the open one (shell/section-layout.css) ---------- */
      .section-layout {
        display: grid;
        grid-template-columns: 200px minmax(0, 1fr);
        gap: 24px;
        align-items: start;
      }
      .section-menu {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .section-menu span {
        display: flex;
        align-items: center;
        gap: 10px;
        height: 36px;
        padding: 0 10px;
        border-radius: 8px;
        font: var(--type-label);
        color: var(--fg-2);
        white-space: nowrap;
      }
      .section-menu span.active {
        background: var(--surface-selected);
        color: var(--fg-1);
      }
      .section-body {
        display: flex;
        flex-direction: column;
        gap: 16px;
        min-width: 0;
        max-width: 1100px;
      }
      @container page (max-width: 924px) {
        .section-layout {
          grid-template-columns: minmax(0, 1fr);
          gap: 14px;
        }
        .section-menu {
          flex-direction: row;
          overflow-x: auto;
        }
      }
      .settings-split {
        display: grid;
        grid-template-columns: 300px minmax(0, 1fr);
        gap: 16px;
        align-items: start;
      }
      .library-lists,
      .library-detail {
        display: flex;
        flex-direction: column;
        gap: 16px;
        min-width: 0;
      }
      .back-to-lists {
        display: none;
        align-self: flex-start;
      }
      @container page (max-width: 1224px) {
        .settings-split {
          grid-template-columns: minmax(0, 1fr);
        }
        .settings-split.showing-detail .library-lists,
        .settings-split:not(.showing-detail) .library-detail {
          display: none;
        }
        .back-to-lists {
          display: inline-flex;
        }
      }
      @container page (max-width: 600px) {
        .page-scroll {
          padding: 14px 12px 40px;
        }
      }

      /* ---------- PickList (packages/ui/src/pick-list.css) ---------- */
      .pick-list-card {
        display: flex;
        flex-direction: column;
        min-width: 0;
        border: 1px solid var(--border);
        border-radius: var(--radius-card);
        background: var(--surface);
      }
      .pick-list-head {
        display: flex;
        align-items: center;
        gap: 8px;
        min-height: 44px;
        padding: 6px 8px 6px 12px;
        border-bottom: 1px solid var(--border);
      }
      .pick-list-title {
        display: flex;
        flex: 1;
        align-items: center;
        gap: 7px;
        min-width: 0;
        margin: 0;
        font: var(--type-card-title);
      }
      .pick-list-title > .name {
        min-width: 0;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      .pick-list-count {
        font: var(--type-caption);
        font-variant-numeric: tabular-nums;
        color: var(--fg-3);
      }
      .pick-list-rows {
        margin: 0;
        padding: 0;
        list-style: none;
      }
      .pick-list-rows li + li {
        border-top: 1px solid var(--border-subtle);
      }
      .pick-list-item {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        min-width: 0;
        padding: var(--pad-row);
        border: 0;
        background: transparent;
        color: var(--fg-1);
        text-align: left;
        cursor: pointer;
      }
      .pick-list-item:hover {
        background: var(--surface-hover);
      }
      .pick-list-item.picked {
        background: var(--surface-selected);
        box-shadow: inset 2px 0 0 var(--accent);
      }
      .pick-list-rows li:last-child .pick-list-item {
        border-radius: 0 0 9px 9px;
      }
      .pick-list-words {
        display: flex;
        flex: 1;
        flex-direction: column;
        gap: 2px;
        min-width: 0;
      }
      .pick-list-name {
        font: var(--type-label);
        overflow-wrap: anywhere;
      }
      .pick-list-line {
        overflow: hidden;
        font: var(--type-caption);
        color: var(--fg-3);
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      .pick-list-line.why {
        color: var(--danger-fg);
        white-space: normal;
      }
      .pick-list-aside {
        display: inline-flex;
        flex: none;
        align-items: center;
        gap: 6px;
      }
      .pick-list-foot {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 6px;
        padding: 8px 12px;
        border-top: 1px solid var(--border-subtle);
      }

      /* ---------- The open Pipeline (as the adopted Project Pipelines design) ---------- */
      .detail-facts {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 4px 8px;
        font: var(--type-caption);
        color: var(--fg-2);
      }
      .detail-facts .sep {
        color: var(--fg-3);
      }
      .form-grid {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        gap: 12px 14px;
      }
      .form-grid .wide {
        grid-column: 1 / -1;
      }
      @container page (max-width: 600px) {
        .form-grid {
          grid-template-columns: minmax(0, 1fr);
        }
      }
      .save-bar {
        position: sticky;
        bottom: -40px;
        z-index: 5;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        margin: 0 -2px;
        padding: 10px 2px 2px;
        background: linear-gradient(to bottom, transparent, var(--bg) 14px);
      }
      .save-state {
        flex: 1 1 140px;
        font: var(--type-caption);
        color: var(--fg-3);
      }
      .save-state.dirty {
        color: var(--fg-1);
        font-weight: 500;
      }
      .save-state.held {
        color: var(--danger-fg);
        font-weight: 500;
      }
      .built-on-rows {
        display: grid;
        margin: 0;
        padding: 0;
        list-style: none;
      }
      .built-on-rows li + li {
        border-top: 1px solid var(--border-subtle);
      }
      .built-on-row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px 10px;
        padding: 8px 0;
        font: var(--type-body-sm);
      }
      .built-on-row .grow {
        flex: 1 1 auto;
      }
      .default-card .select {
        max-width: 360px;
      }
      .not-applying {
        display: grid;
        gap: 10px;
        padding: 12px 14px;
        border: 1px solid var(--danger-border);
        border-radius: var(--radius-lg);
        background: var(--danger-subtle);
      }
      .not-applying h4 {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 0;
        font: var(--type-label);
        color: var(--danger-fg);
      }
      .not-applying-item {
        display: grid;
        gap: 6px;
        padding: 10px 12px;
        border-radius: var(--radius-md);
        background: var(--surface);
        font: var(--type-body-sm);
      }
      .not-applying-fix {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px 8px;
        font: var(--type-caption);
        color: var(--fg-2);
      }
      .not-applying-fix .select {
        width: auto;
        min-width: 150px;
        max-width: 100%;
      }
      /* A button that names a Stage or a Pipeline wraps in a narrow panel instead of running past it */
      .flow-editor .btn.sm,
      .not-applying-fix .btn.sm {
        height: auto;
        min-height: var(--control-sm);
        max-width: 100%;
        padding-block: 6px;
        line-height: 1.25;
        white-space: normal;
        text-align: left;
      }

      /* ---------- Proposed: the flow editor ---------- */
      .flow-editor {
        display: grid;
        gap: 12px;
        min-width: 0;
        container: editor / inline-size;
      }
      .flow-head {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px 10px;
        min-width: 0;
      }
      /* In a narrow editor the Add a Stage menu opens under the head from its left edge, so it never runs past the page */
      @container editor (max-width: 560px) {
        .flow-head {
          position: relative;
        }
        .flow-head .menu-wrap {
          position: static;
        }
        .flow-head .menu {
          left: 0;
          right: auto;
        }
      }
      .flow-head-title {
        display: grid;
        flex: 1 1 200px;
        gap: 1px;
        min-width: 0;
      }
      .flow-head-title b {
        font: var(--type-label);
        overflow-wrap: anywhere;
      }
      .flow-head-title span {
        font: var(--type-caption);
        color: var(--fg-3);
      }
      .flow-legend {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 14px;
        margin: 0;
        padding: 0;
        list-style: none;
        font: var(--type-caption);
        color: var(--fg-2);
      }
      .flow-legend li {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .legend-line {
        display: inline-block;
        width: 18px;
        border-top: 2px solid var(--fg-3);
      }
      .legend-line.loop {
        border-top: 2px dashed var(--danger);
      }
      .legend-line.proposed {
        border-top: 2px dashed var(--accent);
      }
      .legend-line.was {
        border-top: 2px dotted var(--fg-3);
      }
      .legend-line.inserted {
        border-top-color: var(--success);
      }
      .legend-line.changed {
        border-top-color: var(--warning);
      }
      .legend-edge {
        display: inline-block;
        width: 12px;
        height: 12px;
        border: 1px solid var(--border-strong);
        border-left: 3px solid var(--edge, var(--border-strong));
        border-radius: var(--radius-sm);
        background: var(--surface);
      }
      .legend-edge.removed {
        border-style: dashed;
      }
      .flow-hint {
        display: flex;
        align-items: flex-start;
        gap: 8px;
        margin: 0;
        font: var(--type-caption);
        color: var(--fg-2);
      }
      .flow-hint svg {
        flex: none;
        margin-top: 1px;
        color: var(--fg-3);
      }
      .flow-hint.refused {
        color: var(--danger-fg);
      }
      .flow-hint.refused svg {
        color: var(--danger-fg);
      }

      /* The canvas: Stages in a grid of places, the routes and loops drawn over it */
      .flow {
        --loop-room: 0px;
        --detour-room: 0px;
        position: relative;
        isolation: isolate;
        min-width: 0;
        padding: calc(18px + var(--loop-room)) 14px calc(18px + var(--detour-room)) 34px;
        overflow: hidden;
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        background-color: var(--surface-sunken);
        background-image: radial-gradient(circle, var(--border-strong) 1px, transparent 1.3px);
        background-size: 16px 16px;
      }
      .flow[data-orient="down"] {
        padding: 34px calc(16px + var(--detour-room)) 16px calc(14px + var(--loop-room));
      }
      .flow.compact {
        padding: calc(10px + var(--loop-room)) 8px calc(10px + var(--detour-room)) 22px;
        background-image: none;
      }
      .flow-grid {
        position: relative;
        z-index: 1;
        display: grid;
        grid-template-columns: repeat(var(--cols), minmax(0, 1fr)) 44px;
        grid-template-rows: repeat(var(--rows), minmax(72px, auto));
        gap: 22px 40px;
        align-items: center;
        /* The grid's empty places let a press through to the routes' hit lines under it */
        pointer-events: none;
      }
      .flow-grid > * {
        pointer-events: auto;
      }
      /* A narrow canvas (900 wide, or beside Settings' Pipelines list) keeps its Stages readable with five columns */
      @container editor (max-width: 860px) {
        .flow[data-orient="across"]:not(.compact) .flow-grid {
          column-gap: 28px;
        }
      }
      .flow[data-orient="down"] .flow-grid {
        grid-template-columns: repeat(var(--lanes), minmax(0, 1fr));
        grid-template-rows: none;
        grid-auto-rows: auto;
        gap: 34px 14px;
      }
      .flow.compact .flow-grid {
        grid-template-columns: repeat(var(--cols), minmax(0, 1fr)) 30px;
        grid-template-rows: repeat(var(--rows), auto);
        gap: 14px 18px;
      }
      .flow-node {
        position: relative;
        display: flex;
        flex-direction: column;
        gap: 6px;
        min-width: 0;
        padding: 9px 11px;
        border: 1px solid var(--border-strong);
        border-radius: var(--radius-lg);
        background: var(--surface);
        box-shadow: var(--shadow-1);
        color: var(--fg-1);
        font: var(--type-body-sm);
        text-align: left;
        cursor: grab;
        touch-action: none;
        user-select: none;
      }
      .flow.readonly .flow-node,
      .flow[data-orient="down"] .flow-node {
        cursor: pointer;
      }
      /* Top to bottom, a Stage moves by its Move buttons, so a touch on it still scrolls the page */
      .flow[data-orient="down"] .flow-node {
        touch-action: auto;
      }
      .flow-node:hover {
        border-color: var(--fg-3);
      }
      .flow-node.selected {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--accent-subtle);
      }
      .flow-node.problem {
        border-color: var(--danger);
      }
      .flow-node.inserted {
        --edge: var(--success);
      }
      .flow-node.routes-changed {
        --edge: var(--warning);
      }
      .flow-node.inserted,
      .flow-node.routes-changed {
        border-left: 3px solid var(--edge);
        padding-left: 9px;
      }
      .flow-node.removed {
        border-style: dashed;
        background: transparent;
        box-shadow: none;
        color: var(--fg-3);
        cursor: pointer;
      }
      .flow-node.removed .flow-node-name {
        text-decoration: line-through;
      }
      .flow-node.dragging {
        z-index: 30;
        box-shadow: var(--shadow-3);
        cursor: grabbing;
        opacity: 0.95;
      }
      .flow-node-head {
        display: flex;
        flex-wrap: wrap;
        align-items: flex-start;
        gap: 8px;
        min-width: 0;
      }
      .stage-mark {
        display: grid;
        flex: none;
        place-items: center;
        width: 22px;
        height: 22px;
        border: 2px solid var(--border-strong);
        border-radius: 50%;
        background: var(--surface);
        color: var(--fg-2);
      }
      .stage-mark.kind-gate {
        width: 19px;
        height: 19px;
        margin: 1.5px;
        border-radius: var(--radius-sm);
        transform: rotate(45deg);
      }
      .stage-mark.kind-gate svg {
        transform: rotate(-45deg);
      }
      /* In a narrow card the name goes under the mark, with the card's whole width, rather than a few letters a line */
      .flow-node-words {
        display: grid;
        flex: 1 1 64px;
        gap: 1px;
        min-width: 0;
      }
      .flow-node-name {
        font: 600 var(--text-sm) / 1.3 var(--font-sans);
        overflow-wrap: anywhere;
        hyphens: auto;
      }
      .flow-node-who {
        font: var(--type-caption);
        color: var(--fg-3);
        overflow-wrap: anywhere;
      }
      .flow-node-flag {
        flex: none;
        margin-top: 1px;
        color: var(--danger-fg);
      }
      .flow-node-flag.warning {
        color: var(--warning-fg);
      }
      /* A badge is a flex box, so an ellipsis can't show in it: a long one ("Inserted after Review & fix") wraps instead */
      .badge.flow-node-tag {
        flex: 0 1 auto;
        align-self: flex-start;
        max-width: 100%;
        height: auto;
        min-height: 18px;
        padding-block: 2px;
        line-height: 1.25;
        white-space: normal;
        overflow-wrap: anywhere;
      }
      .flow-routes {
        display: grid;
        gap: 1px;
        margin: 0 -11px -9px;
        padding: 3px 0 5px;
        border-top: 1px solid var(--border-subtle);
      }
      .flow-node.inserted .flow-routes,
      .flow-node.routes-changed .flow-routes {
        margin-left: -9px;
      }
      .flow-route {
        position: relative;
        min-width: 0;
      }
      .flow-route-line {
        display: block;
        width: 100%;
        padding: 2px 14px 2px 11px;
        border: 0;
        background: none;
        color: var(--fg-2);
        font: var(--type-caption);
        text-align: left;
        cursor: pointer;
      }
      /* Two lines at most on the canvas; the whole condition is on hover and in the panel */
      .flow-route-words {
        display: -webkit-box;
        overflow: hidden;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
        line-clamp: 2;
        overflow-wrap: anywhere;
      }
      .flow-route-line:hover {
        background: var(--control-hover);
        color: var(--fg-1);
      }
      /* A route taken away by a Proposal is only read: no press, no hover */
      .flow-route-line[disabled],
      .fl-row-line[disabled] {
        cursor: default;
      }
      .flow-route-line[disabled]:hover {
        background: none;
        color: var(--fg-3);
      }
      .fl-row-line[disabled]:hover {
        background: none;
      }
      .flow-route-line.selected {
        background: var(--accent-subtle);
        color: var(--accent-subtle-fg);
      }
      .flow-route-line.problem {
        color: var(--danger-fg);
      }
      .flow-route-line.proposed {
        color: var(--accent-subtle-fg);
      }
      .flow-route-line.was {
        color: var(--fg-3);
        text-decoration: line-through;
      }
      .flow-route-line b {
        font-weight: 600;
      }
      .flow-port {
        position: absolute;
        top: 50%;
        right: -5px;
        width: 9px;
        height: 9px;
        border: 1.5px solid var(--fg-3);
        border-radius: 50%;
        background: var(--surface);
        transform: translateY(-50%);
        pointer-events: none;
      }
      .flow[data-orient="down"] .flow-port {
        display: none;
      }
      .flow-none-holds {
        display: flex;
        align-items: flex-start;
        gap: 5px;
        padding: 2px 14px 0 11px;
        font: var(--type-caption);
        color: var(--warning-fg);
      }
      .flow-none-holds svg {
        flex: none;
        margin-top: 2px;
      }
      .flow-handle {
        position: absolute;
        right: -9px;
        bottom: -9px;
        z-index: 3;
        display: grid;
        place-items: center;
        width: 18px;
        height: 18px;
        padding: 0;
        border: 1.5px solid var(--accent);
        border-radius: 50%;
        background: var(--surface);
        color: var(--accent);
        opacity: 0;
        cursor: crosshair;
        touch-action: none;
      }
      /* The + is drawn small but takes a press 30px across, as a finger needs */
      .flow-handle::before {
        content: "";
        position: absolute;
        inset: -6px;
        border-radius: 50%;
      }
      .flow[data-orient="down"] .flow-handle {
        right: auto;
        left: 50%;
        transform: translateX(-50%);
      }
      .flow-node:hover .flow-handle,
      .flow-node:focus-within .flow-handle,
      .flow-node.selected .flow-handle,
      .flow[data-orient="down"] .flow-handle,
      .flow.drawing .flow-handle {
        opacity: 1;
      }
      .flow.readonly .flow-handle {
        display: none;
      }
      .flow-end {
        display: grid;
        grid-row: 1 / -1;
        place-items: center;
        justify-self: center;
        width: 44px;
        height: 44px;
        border: 2px solid var(--fg-2);
        border-radius: 50%;
        background: var(--surface);
        color: var(--fg-1);
        font: 600 var(--text-2xs) / 1 var(--font-sans);
      }
      .flow-end.target {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--accent-subtle);
      }
      .flow[data-orient="down"] .flow-end {
        grid-row: auto;
        grid-column: 1 / -1;
        width: auto;
        height: 28px;
        padding: 0 16px;
        border-radius: var(--radius-full);
      }
      .flow-node.target {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--accent-subtle);
      }
      /* Compact: as the Initiative page's diagram, each Stage its mark with its name under it */
      .flow.compact .flow-node {
        align-items: center;
        gap: 4px;
        padding: 0;
        border: 0;
        background: none;
        box-shadow: none;
        text-align: center;
        cursor: default;
      }
      .flow.compact .flow-node-head {
        flex-direction: column;
        align-items: center;
        gap: 4px;
      }
      .flow.compact .flow-node-name {
        font: 600 var(--text-2xs) / 1.3 var(--font-sans);
      }
      .flow.compact .flow-end {
        width: 28px;
        height: 28px;
      }
      .flow-lines {
        position: absolute;
        top: 0;
        left: 0;
        z-index: 0;
        overflow: visible;
        pointer-events: none;
      }
      .fl-route {
        fill: none;
        stroke: var(--fg-3);
        stroke-width: 1.5;
        stroke-linejoin: round;
      }
      .fl-arrow {
        fill: var(--fg-3);
      }
      .fl-route.selected {
        stroke: var(--accent);
        stroke-width: 2.25;
      }
      .fl-arrow.selected,
      .fl-arrow.proposed,
      .fl-arrow.temp {
        fill: var(--accent);
      }
      .fl-route.problem {
        stroke: var(--danger);
      }
      .fl-arrow.problem {
        fill: var(--danger);
      }
      .fl-route.inserted {
        stroke: var(--success);
      }
      .fl-arrow.inserted {
        fill: var(--success);
      }
      .fl-route.changed {
        stroke: var(--warning);
      }
      .fl-arrow.changed {
        fill: var(--warning);
      }
      .fl-route.proposed,
      .flow.compact .fl-route.proposed {
        stroke: var(--accent);
        stroke-width: 2;
        stroke-dasharray: 5 4;
      }
      .fl-route.was,
      .fl-route.ghost {
        stroke: var(--fg-3);
        stroke-dasharray: 2 3;
        opacity: 0.6;
      }
      .fl-arrow.was,
      .fl-arrow.ghost {
        fill: var(--fg-3);
        opacity: 0.6;
      }
      .fl-route.temp {
        stroke: var(--accent);
        stroke-width: 2;
        stroke-dasharray: 4 3;
      }
      .fl-loop {
        fill: none;
        stroke: var(--danger);
        stroke-width: 1.5;
        stroke-dasharray: 4 3;
      }
      .fl-loop-arrow {
        fill: var(--danger);
      }
      .fl-loop.problem {
        stroke-width: 2;
      }
      .fl-start {
        fill: var(--fg-2);
      }
      .fl-start-line {
        fill: none;
        stroke: var(--fg-2);
        stroke-width: 1.5;
      }
      .fl-hit {
        fill: none;
        stroke: transparent;
        stroke-width: 12;
        pointer-events: stroke;
        cursor: pointer;
      }
      .flow-labels {
        position: absolute;
        inset: 0;
        z-index: 2;
        pointer-events: none;
      }
      .flow-pill {
        position: absolute;
        padding: 1px 7px;
        border: 1px solid var(--danger-border);
        border-radius: var(--radius-full);
        background: var(--surface);
        color: var(--danger-fg);
        font: 600 var(--text-2xs) / 1.4 var(--font-sans);
        white-space: nowrap;
        transform: translate(-50%, -50%);
        cursor: pointer;
        pointer-events: auto;
      }
      .flow.compact .flow-pill {
        padding: 0 5px;
      }
      .flow-pill.start {
        border-color: var(--border-strong);
        color: var(--fg-2);
        cursor: default;
      }
      .flow-drop {
        position: absolute;
        z-index: 0;
        border: 1.5px dashed var(--accent);
        border-radius: var(--radius-lg);
        background: var(--accent-subtle);
        pointer-events: none;
      }
      .flow-drop.column {
        border-radius: var(--radius-full);
      }

      /* The List: the same flow without dragging, a Stage a row in the Pipeline's order */
      .flow-list {
        display: grid;
        margin: 0;
        padding: 0;
        overflow: hidden;
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        background: var(--surface);
        list-style: none;
      }
      .flow-list > li + li {
        border-top: 1px solid var(--border-subtle);
      }
      .fl-row {
        display: grid;
        grid-template-columns: 22px minmax(0, 1fr) auto;
        gap: 4px 10px;
        align-items: start;
        padding: 10px 12px;
      }
      .fl-row.selected {
        background: var(--surface-selected);
        box-shadow: inset 2px 0 0 var(--accent);
      }
      .fl-row.problem {
        box-shadow: inset 2px 0 0 var(--danger);
      }
      .fl-row-number {
        padding-top: 3px;
        font: var(--type-caption);
        font-variant-numeric: tabular-nums;
        color: var(--fg-3);
      }
      .fl-row-main {
        display: flex;
        align-items: flex-start;
        gap: 8px;
        min-width: 0;
        padding: 0;
        border: 0;
        background: none;
        color: var(--fg-1);
        text-align: left;
        cursor: pointer;
      }
      .fl-row-tools {
        display: flex;
        gap: 2px;
      }
      .fl-row-lines {
        display: grid;
        grid-column: 2 / -1;
        gap: 2px;
        margin: 0;
        padding: 0;
        list-style: none;
      }
      .fl-row-line {
        display: flex;
        align-items: flex-start;
        gap: 6px;
        width: 100%;
        padding: 3px 6px;
        border: 0;
        border-radius: var(--radius-sm);
        background: none;
        color: var(--fg-2);
        font: var(--type-caption);
        text-align: left;
        cursor: pointer;
        overflow-wrap: anywhere;
      }
      .fl-row-line:hover {
        background: var(--control-hover);
      }
      .fl-row-line.selected {
        background: var(--accent-subtle);
        color: var(--accent-subtle-fg);
      }
      .fl-row-line.problem {
        color: var(--danger-fg);
      }
      .fl-row-line.loop {
        color: var(--danger-fg);
      }
      .fl-row-line svg {
        flex: none;
        margin-top: 1px;
      }
      .fl-row-line b {
        font-weight: 600;
        color: var(--fg-1);
      }
      .fl-row-line.selected b {
        color: inherit;
      }

      /* The panel under the canvas: the Stage or route picked */
      .inspector {
        min-width: 0;
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        background: var(--surface);
      }
      .inspector-head {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px 10px;
        padding: 10px 12px;
        border-bottom: 1px solid var(--border-subtle);
      }
      .inspector-title {
        display: flex;
        flex: 1 1 220px;
        flex-wrap: wrap;
        align-items: center;
        gap: 2px 8px;
        min-width: 0;
        margin: 0;
        font: var(--type-card-title);
        overflow-wrap: anywhere;
      }
      .inspector-title small {
        font: var(--type-caption);
        color: var(--fg-3);
      }
      .inspector-tools {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 2px;
      }
      .inspector-body {
        display: grid;
        gap: 14px;
        padding: 12px;
      }
      .inspector-empty {
        display: grid;
        gap: 4px;
        padding: 14px;
        font: var(--type-body-sm);
        color: var(--fg-2);
      }
      .inspector-empty b {
        color: var(--fg-1);
      }
      .inspector-section {
        display: grid;
        gap: 8px;
        min-width: 0;
      }
      .inspector-section + .inspector-section {
        padding-top: 14px;
        border-top: 1px solid var(--border-subtle);
      }
      .inspector-section.flash {
        border-radius: var(--radius-md);
        box-shadow: 0 0 0 3px var(--accent-subtle);
      }
      .section-head {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px 10px;
      }
      .section-head .overline {
        flex: 1 1 auto;
      }
      .route-rows {
        display: grid;
        gap: 6px;
        margin: 0;
        padding: 0;
        list-style: none;
      }
      .route-row {
        display: grid;
        grid-template-columns: 18px minmax(0, 1fr) auto;
        gap: 4px 8px;
        align-items: center;
        padding: 6px 6px 6px 10px;
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
      }
      .route-row.problem {
        border-color: var(--danger-border);
        background: var(--danger-subtle);
      }
      .route-row-number {
        font: var(--type-caption);
        font-variant-numeric: tabular-nums;
        color: var(--fg-3);
      }
      .route-row-words {
        display: grid;
        gap: 1px;
        min-width: 0;
        padding: 0;
        border: 0;
        background: none;
        color: var(--fg-1);
        text-align: left;
        cursor: pointer;
      }
      .route-row-words b {
        font: var(--type-label);
        overflow-wrap: anywhere;
      }
      .route-row-words span {
        font: var(--type-caption);
        color: var(--fg-3);
        overflow-wrap: anywhere;
      }
      .route-row-words .why {
        color: var(--danger-fg);
      }
      .empty-block {
        margin: 0;
        padding: 10px 12px;
        border: 1px dashed var(--border-strong);
        border-radius: var(--radius-md);
        font: var(--type-body-sm);
        color: var(--fg-3);
      }
      .loop-row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px 8px;
        font: var(--type-body-sm);
      }
      .loop-row .select {
        width: auto;
        min-width: 170px;
        max-width: 100%;
      }
      .when-fails {
        margin: 0;
        padding: 8px 10px 8px 28px;
        border-radius: var(--radius-md);
        background: var(--neutral-subtle);
        font: var(--type-caption);
        color: var(--fg-2);
      }
      .when-fails li + li {
        margin-top: 2px;
      }
      .compare {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        gap: 8px;
      }
      .compare > div {
        display: grid;
        gap: 4px;
        padding: 8px 10px;
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        font: var(--type-caption);
        color: var(--fg-2);
      }
      .compare b {
        font: var(--type-overline);
        letter-spacing: var(--tracking-caps);
        text-transform: uppercase;
        color: var(--fg-3);
      }
      @container editor (max-width: 520px) {
        .compare {
          grid-template-columns: minmax(0, 1fr);
        }
      }

      /* The condition builder */
      .cond-group {
        display: grid;
        gap: 8px;
        min-width: 0;
        padding: 10px;
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        background: var(--surface-sunken);
      }
      .cond-group .cond-group {
        background: var(--surface);
      }
      .cond-group-head {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px 8px;
        font: var(--type-label);
      }
      .cond-group-head .grow {
        flex: 1 1 0;
      }
      .cond-items {
        display: grid;
        gap: 6px;
        margin: 0;
        padding: 0;
        list-style: none;
      }
      .cond-join {
        padding-left: 2px;
        font: var(--type-overline);
        letter-spacing: var(--tracking-caps);
        text-transform: uppercase;
        color: var(--fg-3);
      }
      .cond-test {
        display: grid;
        grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr) auto;
        gap: 6px;
        align-items: center;
        min-width: 0;
      }
      .cond-test.with-extra {
        grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr) auto auto;
      }
      .cond-test-why {
        grid-column: 1 / -1;
        margin: 0;
        font: var(--type-caption);
        color: var(--danger-fg);
      }
      .cond-test-note {
        grid-column: 1 / -1;
        margin: 0;
        font: var(--type-caption);
        color: var(--fg-3);
      }
      .cond-foot {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .cond-reads {
        margin: 0;
        padding: 8px 10px;
        border-left: 3px solid var(--fg-3);
        border-radius: var(--radius-sm);
        background: var(--neutral-subtle);
        font: var(--type-body-sm);
        color: var(--fg-1);
        overflow-wrap: anywhere;
      }
      @container editor (max-width: 560px) {
        .cond-test {
          grid-template-columns: minmax(0, 1fr) auto;
        }
        /* The test, its count and its remove button stay on one row under what it tests */
        .cond-test.with-extra {
          grid-template-columns: minmax(0, 1fr) auto auto;
        }
        .cond-test > :first-child {
          grid-column: 1 / -1;
        }
      }

      /* ---------- The chat drawer and a Thread in Rows (docs/design/chat-drawer.html, thread-dialog.html) ---------- */
      .chat-drawer {
        position: absolute;
        top: 104px;
        right: 0;
        bottom: 0;
        z-index: 30;
        display: flex;
        flex-direction: column;
        width: 420px;
        min-width: 0;
        border-left: 1px solid var(--border);
        background: var(--surface);
      }
      .chat-drawer.over {
        box-shadow: var(--shadow-3);
      }
      .chat-drawer.fill {
        top: 0;
        left: 0;
        width: auto;
        border-left: 0;
      }
      .drawer-head {
        display: flex;
        flex: none;
        align-items: center;
        gap: 10px;
        min-width: 0;
        padding: 10px 10px 10px 16px;
        border-bottom: 1px solid var(--border);
      }
      .drawer-head-main {
        display: grid;
        flex: 1;
        gap: 1px;
        min-width: 0;
      }
      .drawer-title {
        font: var(--type-card-title);
      }
      .drawer-sub {
        font: var(--type-caption);
        color: var(--fg-2);
      }
      .thread-row {
        display: flex;
        flex: none;
        align-items: center;
        gap: 8px;
        min-width: 0;
        padding: 6px 12px 6px 8px;
        border-bottom: 1px solid var(--border);
      }
      .thread-row-title {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        font: 500 var(--text-sm) / 1.3 var(--font-sans);
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      .thread {
        flex: 1;
        min-height: 0;
        overflow-x: hidden;
        overflow-y: auto;
      }
      .thread-column {
        display: flex;
        flex-direction: column;
        gap: 18px;
        padding: 16px 14px 20px;
      }
      .turn {
        display: grid;
        grid-template-columns: 32px minmax(0, 1fr);
        min-width: 0;
      }
      .turn-by {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 2px 6px;
        margin-bottom: 2px;
        font: var(--type-caption);
        color: var(--fg-2);
      }
      .turn-by b {
        font: 600 var(--text-sm) / 1.4 var(--font-sans);
        color: var(--fg-1);
      }
      .said {
        display: grid;
        gap: 8px;
        min-width: 0;
        font: var(--type-body);
        line-height: 1.6;
        overflow-wrap: anywhere;
      }
      .said p {
        margin: 0;
      }
      .composer {
        flex: none;
        padding: 10px 12px 12px;
        border-top: 1px solid var(--border);
      }
      .composer-field {
        width: 100%;
        min-height: 44px;
        padding: 8px 10px;
        border: 1px solid var(--border-strong);
        border-radius: var(--radius-lg);
        background: var(--surface);
        font: var(--type-body-sm);
        resize: none;
      }
      .proposal-card {
        container: proposal / inline-size;
        min-width: 0;
        overflow: hidden;
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        background: var(--surface);
        font: var(--type-body-sm);
        line-height: 1.45;
      }
      .proposal-head {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px 8px;
        padding: 10px 12px;
        border-bottom: 1px solid var(--border-subtle);
      }
      .proposal-title {
        min-width: 0;
        font-weight: 600;
        overflow-wrap: anywhere;
      }
      .proposal-changes {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin: 0;
        padding: 10px 12px;
        list-style: none;
      }
      .proposal-changes > li {
        display: grid;
        grid-template-columns: 112px minmax(0, 1fr);
        gap: 2px 10px;
        min-width: 0;
      }
      .proposal-change-label {
        padding-top: 2px;
        font: var(--type-overline);
        letter-spacing: var(--tracking-caps);
        text-transform: uppercase;
        color: var(--fg-3);
      }
      .proposal-route-values {
        display: grid;
        gap: 6px;
        min-width: 0;
      }
      .proposal-route-side {
        display: grid;
        gap: 2px;
        min-width: 0;
      }
      .proposal-route-side > span:first-child {
        font: var(--type-caption);
        color: var(--fg-3);
      }
      .proposal-route-side ol {
        margin: 0;
        padding-left: 18px;
        overflow-wrap: anywhere;
      }
      .proposal-route-side.was ol {
        color: var(--fg-3);
        text-decoration: line-through;
      }
      .proposal-route-side.to ol {
        font-weight: 600;
      }
      .proposal-route-side.to .when {
        font-weight: 400;
        color: var(--fg-2);
      }
      .proposal-section {
        display: grid;
        gap: 8px;
        padding: 10px 12px;
        border-top: 1px solid var(--border-subtle);
      }
      .proposal-section-head {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px 10px;
      }
      .proposal-section-head .overline {
        flex: 1 1 auto;
      }
      .proposal-checked {
        display: flex;
        align-items: flex-start;
        gap: 6px;
        margin: 0;
        font: var(--type-caption);
        color: var(--success-fg);
      }
      .proposal-checked svg {
        flex: none;
        margin-top: 2px;
      }
      .proposal-foot {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        padding: 10px 12px;
        border-top: 1px solid var(--border-subtle);
      }
      .proposal-note {
        font: var(--type-caption);
        color: var(--fg-3);
      }
      @container proposal (max-width: 360px) {
        .proposal-changes > li {
          grid-template-columns: minmax(0, 1fr);
        }
        .flow.compact .flow-grid {
          column-gap: 12px;
        }
      }
    </style>
  </head>
  <body>
    <div class="bar" id="bar"></div>
    <main class="stage">
      <p class="scenario-note" id="note"></p>
      <div class="frame-row"><div class="frame w-wide" id="frame"></div></div>
      <section class="reference" id="reference" aria-label="Reference"></section>
    </main>
    <script>
      "use strict";
      /* ---------- Icons (the app's Icon set, re-drawn) ---------- */
      const svg = (size, body) =>
        `<svg width="${size}" height="${size}" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${body}</svg>`;
      const ICON = {
        x: (s = 16) => svg(s, '<path d="m4 4 8 8M12 4l-8 8"/>'),
