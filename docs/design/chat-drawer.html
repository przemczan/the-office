      function gateCard() {
        return `<div class="block" style="--edge:var(--info)"><div class="card-over"><b>Export usage as CSV</b><span class="project-chip">the-office</span></div><div class="card-over"><span class="badge info">Gate</span><span>Waiting for your review after Test</span></div><div class="block-sub">6 files changed · +214 −38 · tests passed · 5 of 5 statements met</div><div class="card-actions"><button type="button" class="btn sm primary" tabindex="-1">Continue</button><button type="button" class="btn sm secondary" tabindex="-1">Show details</button></div></div>`;
      }
      function nowPage(geometry) {
        const columns = geometry.pageWidth >= 1000 ? 3 : geometry.pageWidth >= 620 ? 2 : 1;
        const running = [
          ["Fix the login redirect loop", "Jim", "Implement"],
          ["Export usage as CSV", "Oscar", "Review"],
          ["Archive old Initiatives", "Angela", "Plan"],
        ]
          .map(([task, person, stage]) => `<div class="row">${avatar(person, "sm")}<span class="row-text">${task}</span><span class="badge info">${stage}</span></div>`)
          .join("");
        const since = ["Pam captured an Idea: Dark mode for the rail", "Oscar passed Review on Task 52", "Publish merged the-office #54"]
          .map((line) => `<div class="row"><span class="row-text">${line}</span></div>`)
          .join("");
        return `<div class="page${geometry.phone ? " tight" : ""}"><div class="cols" style="grid-template-columns:repeat(${columns}, minmax(0, 1fr))">
          <section class="col"><span class="overline">Needs you · 2</span>${decisionCard({ withTask: true })}${gateCard()}</section>
          <section class="col"><span class="overline">Running · 3</span><div class="block" style="--edge:var(--success)"><div class="row-list">${running}</div></div><span class="overline">Today's tokens</span><div class="block"><div class="block-title">184k</div>${skeleton(90, 70)}</div></section>
          <section class="col"><span class="overline">Since you left</span><div class="block"><div class="row-list">${since}</div>${skeleton(80, 60, 72)}</div></section>

      function taskConversation(withComposer = true) {
        const messages = [
          say("planner", "08:02", "The Plan and the Definition of Done are on the left. The loop is between `/login` and `/sign-in`."),
          say("developer", "09:12", "I've put a Decision to you: keep `/login` as a redirect for one release?"),
        ];
        return `<div class="tabs"><span class="tab">${avatar("Angela", "xs")}Angela</span><span class="tab on">${avatar("Jim", "xs")}Jim<span class="dot answering"></span></span><span class="tab">${avatar("Oscar", "xs")}Oscar</span><span class="grow"></span>${detailsSwitch()}</div>
          <div class="thread">${threadColumn(messages, null)}</div>
          ${withComposer ? `<div class="composer"><div class="composer-to"><span class="context-dot warm"></span>To <strong>Jim</strong> · cache warm, 38 min left</div><div class="composer-row"><textarea class="composer-field" rows="1" placeholder="Message Jim" data-focus="task-composer" data-draft="task-jim">${escapeHtml(session.drafts["task-jim"] ?? "")}</textarea><button type="button" class="composer-send" tabindex="-1" aria-label="Send">${ICON.send()}</button></div></div>` : ""}`;
      }
      function initiativeConversation() {
        const messages = [day("Yesterday"), say("you", "17:40", "Should the reports page wait for the schedules?"), say("planner", "17:52", "No: it can ship with the CSV export and grow the schedules later.")];
        return `<div class="tabs"><span class="tab on">Threads · 3</span><span class="grow"></span>${detailsSwitch()}</div>

      // A page folds its side column into a drawer when the page, not the window, is 844px or less.
      const pageIsNarrow = (geometry) => geometry.pageWidth <= 844;

      function taskPage(geometry) {

        const conversation = narrow ? "" : `<section class="task-conversation">${taskConversation()}</section>`;

      function initiativePage(geometry) {
        const narrow = pageIsNarrow(geometry);
        const tasks = [
          ["Export usage as CSV", "Waiting on you", "warning"],
          ["The reports page", "Ready", "info"],
          ["Schedule a report", "Backlog", ""],

        ]
          .map(([task, stateWords, tone]) => `<div class="row"><span class="row-text">${task}</span><span class="badge ${tone}">${stateWords}</span></div>`)
          .join("");
        const blocks = `<section class="col"><div class="block"><div class="block-title">Goal</div>${skeleton(94, 86, 52)}</div><div class="block" style="--edge:var(--info)"><div class="block-title">Tasks · 4</div><div class="row-list">${tasks}</div></div><div class="block"><div class="block-title">Notes</div>${skeleton(70, 90)}</div></section>`;

      /* ---------- Side panels ---------- */
      function conversationHandle(geometry) {
        if (!hasConversationDrawer(geometry)) return "";
        // While the chat drawer is beside or over the page, the handle keeps to the page's side of it.
        const offset = session.chatOpen && geometry.mode !== "fill" ? geometry.drawerWidth : 0;

      function conversationDrawer(geometry) {

        return `<div class="scrim" style="z-index:${z}" data-action="close-conversation"></div>
          <aside class="conversation-drawer" style="z-index:${z + 1}" aria-label="${title}"><div class="drawer-head"><div class="drawer-head-main"><span class="drawer-title">${title}</span><span class="drawer-sub">${state.page === "task" ? "Fix the login redirect loop" : "Usage exports"}</span></div><button type="button" class="icon-button" data-action="close-conversation" aria-label="Close (Esc)">${ICON.x()}</button></div>
          ${state.page === "task" ? taskConversation() : initiativeConversation()}</aside>`;
      }
      function needsYouPanel() {
        if (!session.needsYouOpen) return "";
        const z = zOf("needsYou");
        return `<div class="scrim" style="z-index:${z}"></div><aside class="needs-you-panel" style="z-index:${z + 1}" role="dialog" aria-label="Needs you">
          <div class="panel-head"><div class="drawer-head-main"><h3>Needs you</h3><span class="drawer-sub">2 need you, oldest first</span></div><button type="button" class="icon-button" data-action="close-needs-you" aria-label="Close (Esc)">${ICON.x()}</button></div>
          <div class="panel-body">${decisionCard({ withTask: true })}${gateCard()}</div>
          <div class="panel-foot"><button type="button" class="btn secondary" data-action="close-needs-you">Close</button></div></aside>`;
      }

      /* ---------- The chat drawer ---------- */
      function drawerEdge(geometry) {
        if (geometry.mode === "fill") return "";
        return `<div class="drawer-edge${state.resizing ? " dragging" : ""}" role="separator" aria-orientation="vertical" aria-label="Resize the chat" aria-valuemin="${DRAWER.min}" aria-valuemax="${geometry.max}" aria-valuenow="${geometry.drawerWidth}" tabindex="0" data-focus="edge" title="Drag to resize · double-click for ${DRAWER.default}px"><span class="edge-readout">${geometry.drawerWidth}px · ${DRAWER.min}–${geometry.max}px</span></div>`;
      }
      function closeButton() {
        return `<button type="button" class="icon-button" data-action="close-chat" aria-label="Close (Esc)" title="Close (Esc)">${ICON.x()}</button>`;
      }
      function statusWords(roleKey) {
        const status = personStatus(roleKey);
        const dot = status.kind === "answered" || status.kind === "answering" ? `<span class="dot ${status.kind}"></span>` : "";
        return `<span class="status ${status.kind}">${dot}${status.words}</span>`;
      }
      function peopleView() {
        const rows = CHAT_PEOPLE.map(
          (role) =>
            `<button type="button" class="person-row" data-action="pick" data-role="${role.key}">${avatar(role.card.name, "lg")}<span class="who"><b>${role.card.name}</b><span>${role.card.title}</span></span>${statusWords(role.key)}</button>`,
        ).join("");
        return `<header class="drawer-head"><div class="drawer-head-main"><span class="drawer-title">Chat</span><span class="drawer-sub">Pick a person to talk to</span></div>${closeButton()}</header>
          <div class="people">${rows}<p class="people-note">People with chat off aren't listed. Chat is turned on in a person's Role card.</p></div>`;
      }
      function personMenu(role) {
        const items = CHAT_PEOPLE.map((each) => {
          const status = personStatus(each.key);
          const dot = status.kind === "answered" || status.kind === "answering" ? `<span class="dot ${status.kind}" title="${status.words}"></span>` : "<span></span>";
          return `<button type="button" class="menu-item" role="menuitemradio" aria-checked="${each.key === role.key}" data-action="switch-person" data-role="${each.key}">${avatar(each.card.name, "sm")}<span class="who"><b>${each.card.name}</b><span>${each.card.title}</span></span>${dot}</button>`;
        }).join("");
        return `<div class="menu" role="menu" aria-label="Chat with">${items}<div class="menu-foot">Open <a href="#" data-action="noop">${role.card.name}'s page</a> for their Role card and Memory.</div></div>`;
      }
      function personHead(role) {
        return `<header class="drawer-head">${avatar(role.card.name, "lg")}<div class="drawer-head-main">
            <button type="button" class="person-switch" data-action="toggle-menu" aria-haspopup="menu" aria-expanded="${session.menuOpen}" title="Chat with someone else"><span class="person-switch-name">${role.card.name}</span><span class="person-switch-title">${role.card.title}</span>${ICON.chevronDown()}</button>
            <span class="drawer-sub">${canDo(role)}</span></div>${closeButton()}${session.menuOpen ? personMenu(role) : ""}</header>`;
      }
      function threadListView(role) {
        const threads = threadsOf(role.key);
        if (threads.length === 0)
          return `<div class="threads"><div class="empty"><span class="empty-icon">${ICON.chat(18)}</span><b>No Threads with ${role.card.name} yet.</b><span>A new Thread starts a session that reads every Project's base branch.</span><button type="button" class="btn secondary" data-action="new-thread">${ICON.plus()}New thread</button></div></div>`;
        const items = threads
          .map((thread) => {
            const unseen = thread.seen.answeredUnseen;
            const current = thread.id === session.threadId;
            const after = thread.state === "answering" ? '<span class="status answering"><span class="dot answering"></span>answering</span>' : unseen ? '<span class="status answered">answered</span>' : "";
            return `<button type="button" class="thread-item${current ? " current" : ""}${unseen ? " has-answer" : ""}" data-action="open-thread" data-thread="${thread.id}" aria-current="${current}"><span class="thread-item-title"><span>${escapeHtml(thread.title ?? "New thread")}</span>${unseen ? '<span class="dot answered"></span>' : ""}</span><span class="thread-item-sub"><span class="context-dot${thread.context.cacheWarm ? " warm" : ""}" title="${thread.context.cacheWarm ? "Cache warm" : "Starts fresh with a brief, or continues a small context"}"></span>${thread.display.last}${after ? " · " : ""}${after}</span></button>`;
          })
          .join("");
        return `<div class="threads"><button type="button" class="btn secondary block" data-action="new-thread">${ICON.plus()}New thread</button><div class="overline list-count">Threads · ${threads.length}</div>${items}</div>`;
      }
      function allowChangesBar(thread) {
        if (thread.changesAllowed === null) return "";
        if (thread.changesAllowed)
          return `<p class="thread-changes allowed" role="note">${ICON.shield()}<span class="thread-changes-text">Changes allowed in this Thread: the Caretaker can do anything on the workstation except read your secrets</span><button type="button" class="btn sm secondary" data-action="switch-off">Switch off</button></p>`;
        const answeringNow = thread.state === "answering";
        return `<p class="thread-changes" role="note">${ICON.eye()}<span class="thread-changes-text">The Caretaker only reads in this Thread.</span><button type="button" class="btn sm secondary" data-action="allow-changes" ${answeringNow ? 'disabled title="Wait for the answer to finish, then Allow changes"' : ""}>${ICON.shield()}Allow changes</button></p>`;
      }
      function threadView(role, thread) {
        const othersAnswered = threadsOf(role.key).some((each) => each.id !== thread.id && each.seen.answeredUnseen);
        const draft = session.drafts[thread.id] ?? "";
        const answeringNow = thread.state === "answering";
        const minutes = thread.display.warmMinutes;
        const cache = thread.context.cacheWarm ? `cache warm, ${minutes} min left` : "starts fresh";
        const body =
          thread.display.messages.length === 0
            ? `<div class="thread-column"><p class="office-line">Write the first message: it gives the Thread its title.</p></div>`
            : threadColumn(thread.display.messages, answeringNow ? thread.roleKey : null);
        return `<div class="thread-bar"><button type="button" class="back" data-action="to-list" title="Every Thread with ${role.card.name}">${ICON.chevronLeft()}Threads${othersAnswered ? '<span class="dot answered"></span>' : ""}</button><span class="thread-bar-title" title="${escapeHtml(thread.title ?? "New thread")}">${escapeHtml(thread.title ?? "New thread")}</span>${detailsSwitch()}</div>
          ${allowChangesBar(thread)}
          <div class="thread" data-scroll="thread">${body}</div>
          <div class="composer"><div class="composer-to"><span class="context-dot${thread.context.cacheWarm ? " warm" : ""}"></span>To <strong>${role.card.name}</strong> · ${cache}</div>
            <div class="composer-row"><textarea class="composer-field" rows="1" placeholder="Message ${role.card.name}" data-focus="composer-${thread.id}" data-thread="${thread.id}">${escapeHtml(draft)}</textarea><button type="button" class="composer-send" data-action="send" data-thread="${thread.id}" aria-label="Send" ${answeringNow ? `disabled title="${role.card.name} is answering; send once the answer ends"` : 'title="Send (Enter)"'}>${ICON.send()}</button></div></div>`;
      }
      function chatDrawer(geometry) {
        if (!session.chatOpen) return "";
        const role = session.roleKey ? roleOf(session.roleKey) : null;
        const thread = shownThread();
        let content = peopleView();
        if (role && session.view === "list") content = personHead(role) + threadListView(role);
        if (role && session.view === "thread" && thread) content = personHead(role) + threadView(role, thread);
        const label = role ? `Chat with ${role.card.name}` : "Chat";
        return `<aside class="chat-drawer ${geometry.mode === "push" ? "beside" : geometry.mode}" style="z-index:${zOf("chat")}" aria-label="${label}">${drawerEdge(geometry)}${content}</aside>`;
      }

      /* ---------- Windows ---------- */
      function windowLayer() {
        if (session.window === "decision") {
          const choices = DECISION.answers
            .map(
              (answer, index) =>
                `<button type="button" class="choice${session.picked === index ? " picked" : ""}" data-action="choice" data-index="${index}"><span class="choice-mark"></span><span>${answer.text}${answer.recommended ? ' <span class="badge accent">Recommended</span>' : ""}<small>${answer.reason}</small></span></button>`,
            )
            .join("");
          return `<div class="window-backdrop"><div class="window large" role="dialog" aria-modal="true" aria-label="Decision"><header class="window-head"><h2><span class="badge warning">Decision</span>Jim's<span>· ${DECISION.task} · asked ${DECISION.asked}</span></h2><button type="button" class="icon-button" data-action="close-window" aria-label="Close (Esc)">${ICON.x()}</button></header>
            <div class="window-body"><h3>${DECISION.question}</h3><p>${DECISION.context}</p>${choices}<button type="button" class="choice${session.picked === 2 ? " picked" : ""}" data-action="choice" data-index="2"><span class="choice-mark"></span><span>In your own words</span></button></div>
            <footer class="window-bar"><button type="button" class="btn primary" data-action="close-window">Answer</button><span class="grow"></span><button type="button" class="btn secondary" data-action="close-window">Close</button></footer></div></div>`;
        }
        if (session.window === "allow-changes")
          return `<div class="window-backdrop"><div class="window small" role="dialog" aria-modal="true" aria-label="Allow changes in this Thread?"><header class="window-head"><h2>Allow changes in this Thread?</h2><button type="button" class="icon-button" data-action="close-window" aria-label="Close (Esc)">${ICON.x()}</button></header>
            <div class="window-body"><p>The Caretaker can read and edit any file and run any command on the workstation in this Thread, git push included. Your secrets stay refused: SSH keys, credentials, browser profiles, the Office identity and the database credentials.</p><p>The Caretaker's session restarts under the new rules.</p></div>
            <footer class="window-bar"><button type="button" class="btn danger" data-action="confirm-allow">Allow changes</button><span class="grow"></span><button type="button" class="btn secondary" data-action="close-window">Close</button></footer></div></div>`;
        return "";
      }

      /* ---------- The bar, the note and the reference ---------- */
      const PAGES = [
        ["now", "Now"],
        ["task", "A Task page"],
        ["initiative", "An Initiative page"],
      ];
      const WIDTHS = [
        ["wide", "Wide"],
        ["900", "900px"],
        ["390", "390px"],
      ];
      const BESIDE = [
        ["push", "Pushes the page aside (recommended)"],
        ["over", "Over the page"],
      ];
      const PALETTES = [
        ["light", "Light"],
        ["dark", "Dark"],
      ];
      function segments(key, options) {
        return `<div class="segments">${options
          .map(([value, label]) => `<button type="button" data-action="set" data-key="${key}" data-value="${value}" aria-pressed="${String(state[key]) === value}">${label}</button>`)
          .join("")}</div>`;
      }
      function renderBar() {
        const layers = openLayers();
        const escape = layers.length ? layers.map((layer) => `<b>${LAYER_NAMES[layer]()}</b>`).join(" → ") : "nothing open";
        const scenarios = `<div class="segments">${Object.entries(SCENARIOS)
          .map(([key, scenario]) => `<button type="button" data-action="scenario" data-value="${key}" aria-pressed="${state.scenario === key}">${scenario.label}</button>`)
          .join("")}</div>`;
        document.getElementById("bar").innerHTML = `<span class="bar-title">The chat drawer</span><span class="bar-tag">PROPOSAL</span>
          <div class="control"><span class="control-label">Page behind</span>${segments("page", PAGES)}</div>
          <div class="control"><span class="control-label">Width</span>${segments("width", WIDTHS)}</div>
          <div class="control"><span class="control-label">Beside the page</span>${segments("beside", BESIDE)}</div>
          <div class="control"><span class="control-label">Palette</span>${segments("palette", PALETTES)}</div>
          <span class="bar-break"></span>
          <div class="control"><span class="control-label">Scenario</span>${scenarios}</div>
          <span class="bar-escape">Esc closes, one per press: ${escape}</span>`;
      }
      function renderNote(geometry) {
        const where =
          geometry.mode === "fill"
            ? " At 600px and below the drawer fills the window and can't be resized."
            : geometry.mode === "over" && geometry.width <= 900
              ? " At 900px and below the drawer lies over the page, with no backdrop, whatever the switch says: there is no room to push."
              : geometry.mode === "push"
                ? " <strong>Pushes the page aside:</strong> the page gives up the drawer's width and lays itself out at what is left, so a Task page folds its conversation into its drawer once the page is 844px or less."
                : " <strong>Over the page:</strong> the page keeps its width and the drawer covers its right side, which on a Task or an Initiative page is the conversation and its composer.";
        document.getElementById("note").innerHTML = SCENARIOS[state.scenario].note + (session.chatOpen ? where : "") + " Switch the page behind: the drawer stays open across pages.";
      }
      function renderReference(geometry) {
        const looks = [
          ["nothing-new", "Nothing new"],
          ["answering", "Someone answering"],
          ["answered", "Someone has answered"],
        ]
          .map(([look, words]) => `<div class="look">${chatButton({ phone: geometry.phone }, { look, expanded: false, interactive: false })}<span>${words}</span></div>`)
          .join("");
        document.getElementById("reference").innerHTML = `
          <div><h2>The button's three looks</h2><div class="looks">${looks}<div class="look"><span class="strip-stat"><b>2</b> need you</span><span>Needs you, in the strip</span></div></div>
            <p>A face and a dot, never a number: the number is the Needs you count's. At 600px and below the button shows its mark alone.</p></div>
          <div><h2>Esc, one thing per press</h2><table><thead><tr><th>Order</th><th>What closes</th></tr></thead><tbody>
            <tr><td>1</td><td>A window: the Decision's, Allow changes, the Attachment viewer</td></tr>
            <tr><td>2</td><td>A menu or picker inside a panel: the person switch, the mention picker</td></tr>
            <tr><td>3</td><td>The side panel opened last: the chat drawer, the Needs you panel or the conversation drawer</td></tr>
            <tr><td>4</td><td>The next side panel, by the same rule</td></tr></tbody></table>
            <p>Esc never steps back inside the drawer, from a Thread to the list. Every draft stays.</p></div>
          <div><h2>Width</h2><p>Drag the drawer's left edge, or focus it and press ← and →. It keeps between ${DRAWER.min}px and ${DRAWER.max}px and leaves the page at least ${DRAWER.pageAtLeast}px beside it, or ${DRAWER.pageInViewAtLeast}px in view when it lies over the page; double-click the edge for ${DRAWER.default}px. The width is remembered in this browser.</p>
            <p>Now: <b>${state.drawerWidth}px</b> remembered, ${geometry.mode === "fill" ? "the whole window" : `${geometry.drawerWidth}px shown`} at this width. <button type="button" class="btn sm secondary" data-action="reset-width">Reset width</button></p>
            <table><tbody><tr><td>Over 900px</td><td>Beside the page, which gives up its width</td></tr><tr><td>601–900px</td><td>Over the page, no backdrop</td></tr><tr><td>600px and below</td><td>Fills the window</td></tr></tbody></table></div>`;
      }

      /* ---------- Render ---------- */
      function render() {
        markSeen();
        document.documentElement.dataset.palette = state.palette;
        document.documentElement.dataset.theme = state.palette;
        frame.className = `frame w-${state.width}`;
        const geometry = layout();
        // A page that unfolds its conversation, or a page without one, has no drawer to close: Esc skips it.
        if (session.conversationOpen && !hasConversationDrawer(geometry)) closeLayer("conversation");
        const focused = document.activeElement;
        const focusKey = session.focusNext ?? (frame.contains(focused) ? focused?.dataset?.focus : null);
        const selection = focused && "selectionStart" in focused && !session.focusNext ? [focused.selectionStart, focused.selectionEnd] : null;
        const threadScroll = frame.querySelector('[data-scroll="thread"]');
        const keepScroll = threadScroll && threadScroll.scrollHeight - threadScroll.scrollTop - threadScroll.clientHeight > 40 ? threadScroll.scrollTop : null;
        // Messages only ever come at the end, so an opened fold keeps its place in the list.
        const openFolds = [...frame.querySelectorAll("details.tools")].map((fold) => fold.open);
        session.focusNext = null;

        const pages = { now: nowPage, task: taskPage, initiative: initiativePage };
        frame.innerHTML = `<div class="app${geometry.pushed ? " pushed" : ""}${geometry.phone ? " w-phone" : ""}" style="--drawer-width:${geometry.drawerWidth}px">
          ${rail()}${topBar(geometry)}${statusStrip(geometry)}
          <main class="main">${pages[state.page](geometry)}</main>
          ${conversationHandle(geometry)}${chatDrawer(geometry)}${conversationDrawer(geometry)}${needsYouPanel()}${windowLayer()}
        </div>`;

        frame.querySelectorAll("details.tools").forEach((fold, index) => {
          fold.open = openFolds[index] ?? false;
        });
        const thread = frame.querySelector('[data-scroll="thread"]');
        if (thread) thread.scrollTop = keepScroll ?? thread.scrollHeight;
        if (focusKey) {
          const target = frame.querySelector(`[data-focus="${focusKey}"]`);
          if (target) {
            target.focus({ preventScroll: true });
            if (selection && "setSelectionRange" in target) target.setSelectionRange(...selection);
            else if (target.tagName === "TEXTAREA") target.setSelectionRange(target.value.length, target.value.length);
          }
        }
        renderBar();
        renderNote(geometry);
        renderReference(geometry);
      }

      /* ---------- Events ---------- */
      const ACTIONS = {
        set: (target) => {
          state[target.dataset.key] = target.dataset.value;
        },
        scenario: (target) => applyScenario(target.dataset.value),
        "toggle-chat": () => (session.chatOpen ? closeLayer("chat") : openChat()),
        "close-chat": () => closeLayer("chat"),
        pick: (target) => showPerson(target.dataset.role),
        "toggle-menu": () => {
          session.menuOpen = !session.menuOpen;
        },
        "switch-person": (target) => showPerson(target.dataset.role),
        "to-list": () => {
          session.view = "list";
        },
        "open-thread": (target) => showThread(session.roleKey, target.dataset.thread),
        "new-thread": () => newThread(),
        "toggle-details": () => {
          state.details = !state.details;
        },
        send: (target) => send(target.dataset.thread),
        "open-decision": () => {
          session.picked = 0;
          session.window = "decision";
        },
        choice: (target) => {
          session.picked = Number(target.dataset.index);
        },
        "close-window": () => closeLayer("window"),
        "allow-changes": () => {
          session.window = "allow-changes";
        },
        "confirm-allow": () => {
          shownThread().changesAllowed = true;
          shownThread().display.messages.push({ kind: "note", text: "You allowed changes in this Thread. The session restarts." });
          closeLayer("window");
        },
        "switch-off": () => {
          shownThread().changesAllowed = false;
          shownThread().display.messages.push({ kind: "note", text: "You switched changes off in this Thread. The session restarts." });
        },
        "open-needs-you": () => openPanel("needsYou"),
        "close-needs-you": () => closeLayer("needsYou"),
        "open-conversation": () => openPanel("conversation"),
        "close-conversation": () => closeLayer("conversation"),
        "reset-width": () => {
          state.drawerWidth = DRAWER.default;
          rememberWidth(DRAWER.default);
        },
        noop: () => {},
      };
      document.addEventListener("click", (event) => {
        const target = event.target.closest("[data-action]");
        // A press anywhere but the menu and its switch closes the menu.
        const closesMenu = session.menuOpen && !event.target.closest(".menu, .person-switch");
        if (closesMenu) session.menuOpen = false;
        if (!target) {
          if (closesMenu) render();
          return;
        }
        event.preventDefault();
        ACTIONS[target.dataset.action](target);
        render();
      });
      document.addEventListener("input", (event) => {
        const key = event.target.dataset.thread ?? event.target.dataset.draft;
        if (key) session.drafts[key] = event.target.value;
      });
      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") {
          const [topmost] = openLayers();
          if (!topmost) return;
          event.preventDefault();
          closeLayer(topmost);
          render();
          return;
        }
        const field = event.target;
        if (event.key === "Enter" && !event.shiftKey && field.tagName === "TEXTAREA" && field.dataset.thread) {
          event.preventDefault();
          send(field.dataset.thread);
          render();
          return;
        }
        if (field.classList?.contains("drawer-edge") && ["ArrowLeft", "ArrowRight", "Home", "End"].includes(event.key)) {
          event.preventDefault();
          const { max } = layout();
          const steps = { ArrowLeft: state.drawerWidth + 16, ArrowRight: state.drawerWidth - 16, Home: DRAWER.min, End: max };
          state.drawerWidth = Math.min(Math.max(steps[event.key], DRAWER.min), max);
          rememberWidth(state.drawerWidth);
          render();
        }
      });

      // Dragging the left edge: listened for on the document, as each frame re-draws the edge. A
      // second press soon after the first resets the width; dblclick can't, as its target is gone.
      let drag = null;
      let lastEdgePress = 0;
      document.addEventListener("pointerdown", (event) => {
        if (!event.target.closest(".drawer-edge")) return;
        event.preventDefault();
        if (event.timeStamp - lastEdgePress < 350) {
          lastEdgePress = 0;
          state.drawerWidth = DRAWER.default;
          rememberWidth(DRAWER.default);
          render();
          return;
        }
        lastEdgePress = event.timeStamp;
        drag = { startX: event.clientX, startWidth: layout().drawerWidth };
        state.resizing = true;
        render();
      });
      document.addEventListener("pointermove", (event) => {
        if (!drag) return;
        const { max } = layout();
        state.drawerWidth = Math.round(Math.min(Math.max(drag.startWidth + drag.startX - event.clientX, DRAWER.min), max));
        render();
      });
      document.addEventListener("pointerup", () => {
        if (!drag) return;
        drag = null;
        state.resizing = false;
        rememberWidth(state.drawerWidth);
        render();
      });
      window.addEventListener("resize", render);

      applyScenario(state.scenario);
      render();
    </script>
  </body>
</html>
