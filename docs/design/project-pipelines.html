        { key: "light", label: "Light" },
        { key: "dark", label: "Dark" },
      ];

      const state = {
        scenario: "library",
        width: "wide",
        palette: "light",
        /* Where the frame is: Settings › Pipelines, a Project's Pipelines section, a Task or the chat. A link
           between Settings and a Project page moves it without starting the scenario again. */
        view: "settings",
        project: "the-office",
        picked: "full",
        showDetail: false,
        open: new Set(),
        editing: null,
        menu: null,
        window: null,
        newBase: "full",
        fullDraft: false,
        picker: { open: true, chosen: null },
        defaultOpen: true,
        toast: null,
        fresh: null,
      };
      const scenario = () => SCENARIOS.find((s) => s.key === state.scenario);
      const isPhone = () => state.width === "390";
      let toastTimer;

      function resetData() {
        OFFICE.splice(0, OFFICE.length, ...copy(ORIGINAL.office));
        PROJECT_PIPELINES.splice(0, PROJECT_PIPELINES.length, ...copy(ORIGINAL.project));
        PROJECTS.splice(0, PROJECTS.length, ...copy(ORIGINAL.projects));
      }
      function applyScenario() {
        const s = scenario();
        resetData();
        state.view = s.view;
        state.project = "the-office";
        state.picked = s.picked ?? "full";
        state.showDetail = Boolean(s.detail);
        state.open = new Set(s.open ?? []);
        state.editing = null;
        state.menu = null;
        state.window = s.window ?? null;
        state.fullDraft = Boolean(s.draft);
        state.newBase = "full";
        state.picker = { open: true, chosen: null };
        state.defaultOpen = s.key === "project";
        state.toast = null;
        state.fresh = null;
      }
      /* A link to a Project Pipeline on its Project's page, or to an office-wide one in Settings › Pipelines. */
      function goTo(view, picked) {
        state.view = view;
        state.picked = picked;
        if (view === "project") state.project = ppOf(picked).projectId;
        state.showDetail = true;
        state.window = null;
        state.editing = null;
        state.open = new Set();
        state.defaultOpen = false;
        state.keepScroll = false;
      }
      function showToast(text) {
        state.toast = text;
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => ((state.toast = null), renderFrame()), 4200);
      }

      /* ---------- The shell ---------- */
      function shell({ title, crumb, rail, main, overlay = "", chatOpen = false, pushed = false }) {
        const phone = isPhone();
        const item = (key, icon) => `<span class="rail-item ${rail === key ? "on" : ""}">${icon()}</span>`;
        return `<div class="app ${phone ? "w-phone" : ""} ${pushed ? "pushed" : ""}">
          <nav class="rail" aria-label="Surfaces"><span class="rail-mark">O</span>${item("now", ICON.now)}${item("work", ICON.work)}${item("people", ICON.people)}${item("projects", ICON.projects)}${item("settings", ICON.settings)}</nav>
          <header class="top"><span class="crumb">${esc(crumb)}</span><h1>${esc(title)}</h1><span class="grow"></span>
            <span class="chat-button ${chatOpen ? "open" : ""}">${ICON.chat(14)}${phone ? "" : "Chat"}</span></header>
          <div class="strip"><span><b>1</b> Needs you</span><span><b>2</b> running</span>${phone ? "" : "<span><b>38%</b> of the 5-hour window</span>"}</div>
          <main class="main">${main}</main>
          ${overlay}
          ${state.toast ? `<div class="toast" role="status">${esc(state.toast)}</div>` : ""}
        </div>`;
      }
      /* The shell's SectionLayout: the left-hand menu of a page's sections beside the open one. */
      function sectionPage(label, sections, active, body, head = "") {
        const menu = `<nav class="section-menu" aria-label="${esc(label)}">${sections.map((s) => `<span class="${s === active ? "active" : ""}">${s}</span>`).join("")}</nav>`;
        return `<div class="page-scroll" id="page-scroll">${head}<div class="section-layout">${menu}<div class="section-body">${body}</div></div></div>`;
      }
      const SETTINGS_SECTIONS = ["Pipelines", "Skills", "MCP servers", "Engines", "Office identity", "Office limits", "Office instructions", "Notifications", "Updates", "Appearance"];
      /* Proposed: "Default Pipeline" becomes "Pipelines", the Project's own and its default. */
      const PROJECT_SECTIONS = ["Overview", "Commands", "Pipelines", "Run environment", "Engine", "Skills", "Server values", "Appearance"];
      const projectMark = (project) => `<span class="project-mark" style="--mark:${project.mark}" aria-hidden="true">${project.letter}</span>`;
      const backButton = (label) => `<button class="btn sm ghost back-to-lists" data-action="back">${ICON.chevronLeft(12)} ${esc(label)}</button>`;
      /* The list or the open Pipeline under 1224px, as Settings › Pipelines has it. */
      const split = (lists, back, detail) =>
        `<div class="settings-split ${state.showDetail ? "showing-detail" : ""}"><div class="library-lists">${lists}</div><div class="library-detail" id="detail">${back}${detail}</div></div>`;
      const builtOnBy = (pipelineId) => PROJECT_PIPELINES.filter((p) => p.basePipelineId === pipelineId);
      const builtOnWords = (n) => `Built on by ${plural(n, "Project Pipeline", "Project Pipelines")}`;

      /* ---------- Settings › Pipelines: office-wide Pipelines only ---------- */
      function libraryLists() {
        const office = `<section class="pick-list-card" aria-label="Office-wide Pipelines">
          <div class="pick-list-head"><h3 class="pick-list-title"><span class="name">Office-wide Pipelines</span><span class="pick-list-count">${OFFICE.length}</span></h3>
            <button class="btn sm secondary">${ICON.plus(13)}New Pipeline</button></div>
          <ul class="pick-list-rows">${OFFICE.map((p) => {
            const on = builtOnBy(p.id);
            const broken = on.filter((pp) => build(pp).broken).length;
            const second = on.length ? `<span class="pick-list-line built-on-line">${builtOnWords(on.length)}</span>` : "";
            const aside = broken ? `<span class="badge sm danger" title="${plural(broken, "Project Pipeline built on it is", "Project Pipelines built on it are")} Broken">${ICON.broken(11)}${broken}</span>` : "";
            return listRow(p.id, p.name, stagesLine(p.stages), aside, false, second);
          }).join("")}</ul>
          ${officeOf(state.picked) ? `<div class="pick-list-foot"><button class="btn sm secondary">${ICON.copy(13)}Duplicate ${esc(officeOf(state.picked).name)}</button></div>` : ""}
        </section>`;
        const templates = `<section class="pick-list-card" aria-label="Stage templates">
          <div class="pick-list-head"><h3 class="pick-list-title"><span class="name">Stage templates</span><span class="pick-list-count">7</span></h3><button class="btn sm secondary">${ICON.plus(13)}New template</button></div>
          <ul class="pick-list-rows">${[["agent", "Implement", "Jim"], ["script", "Tests", "test"], ["agent", "Review & fix", "Jim"]].map(([k, n, w]) => `<li><div class="pick-list-item"><span class="stage-kind" style="width:24px;height:24px">${KIND_ICON[k](12)}</span><span class="pick-list-words"><span class="pick-list-name">${n}</span><span class="pick-list-line">${w}</span></span></div></li>`).join("")}</ul>
        </section>`;
        return `${office}${templates}`;
      }
      function listRow(id, name, line, aside = "", broken = false, second = "") {
        return `<li><button class="pick-list-item ${state.picked === id ? "picked" : ""}" data-action="pick" data-id="${id}">
          <span class="pick-list-words"><span class="pick-list-name">${esc(name)}</span><span class="pick-list-line ${broken ? "why" : ""}">${esc(line)}</span>${second}</span>
          ${aside ? `<span class="pick-list-aside">${aside}</span>` : ""}</button></li>`;
      }
      function libraryPage() {
        return sectionPage("Settings", SETTINGS_SECTIONS, "Pipelines", split(libraryLists(), backButton("All Pipelines"), officeDetail(officeOf(state.picked))));
      }

      /* ---------- Proposed: a Project page's Pipelines section ---------- */
      function projectPage(project) {
        const head = `<div class="record-head"><h2>${projectMark(project)}${esc(project.name)}</h2><div class="record-facts"><span class="badge sm success">Onboarded</span><span>Base branch main</span></div></div>`;
        const pp = ppOf(state.picked);
        const detail = pp && pp.projectId === project.id ? projectDetail(pp) : "";
        return sectionPage("Project", PROJECT_SECTIONS, "Pipelines", split(`${defaultCard(project)}${ownList(project)}`, backButton(`${project.name}'s Pipelines`), detail), head);
      }
      const addButton = (project) => `<button class="btn sm secondary" data-action="new-for" title="A Pipeline of ${esc(project.name)}'s own, built from an office-wide one">${ICON.plus(13)}Add a Pipeline built from…</button>`;
      function ownList(project) {
        const own = PROJECT_PIPELINES.filter((p) => p.projectId === project.id);
        const rows = own.length
          ? `<ul class="pick-list-rows">${own
              .map((p) => {
                const built = build(p);
                const line = built.broken
                  ? `Built from ${built.base.name} · ${plural(built.count, "Stage change doesn't apply", "Stage changes don't apply")}`
                  : `Built from ${built.base.name} · ${stageChangesWords(p.stageChanges.length)}`;
                const aside = `${project.default === p.id ? '<span class="badge sm">Default</span>' : ""}${built.broken ? `<span class="badge sm danger">${ICON.broken(11)}Broken</span>` : ""}`;
                return listRow(p.id, p.name, line, aside, built.broken);
              })
              .join("")}</ul>`
          : `<p class="pick-list-empty">None yet: ${esc(project.name)}'s Tasks choose from the office-wide Pipelines. Add one to change a few Stages for ${esc(project.name)} alone.</p>`;
        return `<section class="pick-list-card" aria-label="${esc(project.name)}'s Pipelines">
          <div class="pick-list-head"><h3 class="pick-list-title"><span class="name">${esc(project.name)}'s Pipelines</span><span class="pick-list-count">${own.length}</span></h3></div>
          ${rows}
          <div class="pick-list-foot">${addButton(project)}</div>
        </section>`;
      }
      /* The Project's default: one of its own Pipelines or an office-wide one, in the grouped picker. */
      function defaultCard(project) {
        const groups = pipelineOptions(project.id, { forDefault: true });
        const current = optionById(groups, project.default);
        const currentPp = ppOf(project.default);
        const brokenDefault = currentPp && build(currentPp).broken
          ? `<div class="alert danger" role="alert">${ICON.broken()}<span class="alert-title">${esc(currentPp.name)}, the default, is Broken</span><div class="alert-body"><p>${esc(brokenReasons(currentPp).join(" "))} New Tasks can't follow it, and Angela proposes from the others, until it is fixed or another default is chosen.</p></div></div>`
          : "";
        return `<section class="card default-card" aria-label="Default Pipeline"><div class="card-head"><h3 class="card-title">${ICON.route()}Default Pipeline</h3></div>
          ${brokenDefault}
          <div><button class="picker-trigger" data-action="default-toggle" aria-expanded="${state.defaultOpen}" aria-label="Default Pipeline: ${esc(current.name)}"><span class="grow">${esc(current.name)}</span>${ICON.chevronDown()}</button>${state.defaultOpen ? listbox(groups, project.default, "default") : ""}</div>
          <p class="note">${esc(current.why ? "" : `${current.line}. `)}A new Task has no Pipeline until Angela proposes one at planning, starting from this one, or you choose one.</p>
          <div class="project-row"><span class="project-row-label">Publishing</span><select class="select sm" style="width:auto"><option>Merge</option><option>Push + PR</option></select></div></section>`;
      }
      function askDevops(label = "Ask Dwight") {
        return `<button class="btn sm secondary" data-action="ask">${ICON.sparkles(13)}${label}</button>`;
      }

      function officeDetail(pipeline) {
        const draft = state.fullDraft && pipeline.id === "full";
        const stages = draft ? FULL_SPLIT : pipeline.stages;
        const builtOn = builtOnBy(pipeline.id);
        const breaks = draft ? breaksOf("full", FULL_SPLIT) : [];
        const rows = stages
          .map((stage, i) => {
            const isNew = draft && !FULL.some((s) => s.key === stage.key);
            return `<li class="stage-row ${isNew ? "fresh" : ""}"><div class="stage-line"><span class="stage-number">${i + 1}</span><span class="stage-kind" title="${KIND_WORDS[stage.kind]}">${KIND_ICON[stage.kind]()}</span>
              <span class="stage-words"><span class="stage-name">${esc(stage.name)} <span class="who">· ${esc(whoWorks(stage))}</span></span><span class="stage-detail">${esc(stageFacts(stage, stages.map((s) => ({ key: s.key, stage: s }))))}</span></span>
              <span></span><span class="stage-tools"><button class="icon-button" title="Move ${esc(stage.name)} up">${ICON.arrowUp()}</button><button class="icon-button" title="Move ${esc(stage.name)} down">${ICON.arrowDown()}</button><button class="icon-button" title="Edit ${esc(stage.name)}">${ICON.pencil()}</button><button class="icon-button" title="Remove ${esc(stage.name)}">${ICON.trash()}</button></span></div></li>`;
          })
          .join("");
        const warn = breaks.length
          ? `<div class="alert warning" role="status">${ICON.alert()}<span class="alert-title">Saving breaks ${plural(breaks.length, "Project Pipeline", "Project Pipelines")}</span>
              <div class="alert-body"><p>${breaksSentence(breaks)} name Review &amp; fix, which this edit takes out of Full. You can save anyway: each is then Broken until its Stage changes are fixed.</p></div></div>`
          : "";
        return `<section class="card">
            <div class="card-head"><h2 class="card-title">${ICON.route()}${esc(pipeline.name)}</h2><span class="badge sm">Office-wide</span>${askDevops()}</div>
            <p>${esc(pipeline.description)}</p><p class="note">${esc(pipeline.use)}</p>
          </section>
          ${builtOnCard(pipeline, builtOn)}
          <section class="card">
            <div class="form-grid">
              <label class="field"><span class="field-label">Name</span><input class="input" value="${esc(pipeline.name)}" /></label>
              <label class="field wide"><span class="field-label">Description</span><textarea class="textarea" rows="2" style="min-height:56px">${esc(pipeline.description)}</textarea></label>
            </div>
            <div class="gets"><div class="gets-head"><h3>Stages</h3>${builtOn.length ? `<span class="gets-sum">${builtOnWords(builtOn.length)}: an edit here reaches them.</span>` : ""}</div>
              <ol class="stage-list" aria-label="Stages">${rows}</ol>
              <p class="rules">${ICON.info(13)}<span>Whatever the Pipeline, you are always asked when a round or budget limit is reached, a Stage fails with no retries left, the Definition of Done is not met after the last review, or an Agent reaches a hard switch.</span></p>
            </div>
            ${warn}
          </section>
          <div class="save-bar"><span class="save-state ${draft ? "dirty" : ""}">${draft ? "Unsaved changes" : "Saved"}</span><button class="btn danger-ghost" ${builtOn.length ? `disabled title="Refused while it is built on by ${plural(builtOn.length, "Project Pipeline", "Project Pipelines")}"` : ""}>Remove</button><button class="btn secondary" data-action="discard-office">Discard</button><button class="btn" data-action="save-office">Save the Pipeline</button></div>`;
      }

      /* What saving an office-wide Pipeline with `stages` would break: each Project Pipeline built from it, with why. */
      function breaksOf(baseId, stages) {
        const base = officeOf(baseId);
        const was = base.stages;
        base.stages = stages;
        const found = PROJECT_PIPELINES.filter((p) => p.basePipelineId === baseId)
          .map((p) => {
            const built = build(p);
            const tail = `which this save takes out of ${base.name}`;
            const reasons = [
              ...built.notApplying.map((n) => (n.why === "gone" ? goneWhy(n.change, tail) : takenWhy(n.change, base.name))),
              ...built.loopProblems.map((row) => loopWhy(row, was.map((s) => ({ key: s.key, stage: s })), tail)),
            ];
            return { pp: p, reasons };
          })
          .filter((b) => b.reasons.length);
        base.stages = was;
        return found;
      }
      function breaksSentence(breaks) {
        const byProject = PROJECTS.map((project) => ({ project, names: breaks.filter((b) => b.pp.projectId === project.id).map((b) => `<b>${esc(b.pp.name)}</b>`) })).filter((g) => g.names.length);
        const parts = byProject.map((g) => `${esc(g.project.name)}'s ${listWords(g.names)}`);
        return parts.length < 2 ? parts.join("") : `${parts.slice(0, -1).join(", ")}, and ${parts.at(-1)}`;
      }
      /* Proposed: the Project Pipelines built on an office-wide one, by Project, each opening on its Project's page. */
      function builtOnCard(pipeline, builtOn) {
        if (!builtOn.length) return "";
        const groups = PROJECTS.map((project) => ({ project, items: builtOn.filter((p) => p.projectId === project.id) })).filter((g) => g.items.length);
        const rows = groups
          .map(
            (g) => `<li class="built-on-project"><span class="project-chip">${projectMark(g.project)}${esc(g.project.name)}</span><ul class="built-on-rows">${g.items
              .map((p) => {
                const built = build(p);
                const line = built.broken ? `${plural(built.count, "Stage change doesn't apply", "Stage changes don't apply")}` : stageChangesWords(p.stageChanges.length);
                const aside = `${g.project.default === p.id ? '<span class="badge sm">Default</span>' : ""}${built.broken ? `<span class="badge sm danger">${ICON.broken(11)}Broken</span>` : ""}`;
                return `<li><button class="built-on-row" data-action="goto-pp" data-id="${p.id}" title="Open ${esc(p.name)} on ${esc(g.project.name)}'s page"><b>${esc(p.name)}</b><span class="aside">${aside}</span>${ICON.arrowRight()}<span class="line ${built.broken ? "why" : ""}">${esc(line)}</span></button></li>`;
              })
              .join("")}</ul></li>`,
          )
          .join("");
        return `<section class="card" aria-label="${builtOnWords(builtOn.length)}"><div class="card-head"><h3 class="card-title">${ICON.route()}${builtOnWords(builtOn.length)}</h3></div>
          <p class="note">Each belongs to one Project and is edited on its page. They follow ${esc(pipeline.name)}'s Stages, with their own Stage changes on top.</p>
          <ul class="built-on">${rows}</ul></section>`;
      }

      function projectDetail(pp) {
        const project = projectOf(pp.projectId);
        const built = build(pp);
        const saved = savedOf(pp.id);
        const dirty = !same({ ...pp }, saved);
        const isDefault = project.default === pp.id;
        const facts = [
          `Project Pipeline of ${esc(project.name)}`,
          `Built from <button class="text-link" data-action="goto-office" data-id="${built.base.id}" title="Open ${esc(built.base.name)} in Settings › Pipelines">${esc(built.base.name)}</button>`,
          isDefault ? `Default for ${esc(project.name)}` : "",
          esc(pp.use),
        ].filter(Boolean);
        const makeDefault = isDefault
          ? ""
          : `<button class="btn sm secondary" data-action="make-default" ${built.broken ? `disabled title="A Broken Pipeline can't be the default: fix it first"` : ""}>Make it the default</button>`;
        const baseOptions = OFFICE.map((o) => `<option value="${o.id}" ${o.id === pp.basePipelineId ? "selected" : ""}>${esc(o.name)}</option>`).join("");
        const brokenAlert = built.broken
          ? `<div class="alert danger" role="alert">${ICON.broken()}<span class="alert-title">${esc(pp.name)} is Broken: ${plural(built.count, "Stage change no longer applies", "Stage changes no longer apply")} to ${esc(built.base.name)}</span>
              <div class="alert-body"><p>Until ${built.count === 1 ? "it is" : "they are"} fixed, Tasks can't choose ${esc(pp.name)}${pp.waiting.length ? ` and ${esc(waitingWords(pp))}` : ""}. Tasks already started keep their Stages. Fix each one marked in red below, then save.</p></div></div>`
          : saved && build(saved).broken && !built.broken
            ? `<div class="alert" role="status">${ICON.check(14)}<span class="alert-title">Fixed: save it, and Tasks can choose ${esc(pp.name)} again</span></div>`
            : "";
        return `<section class="card">
            <div class="card-head"><h2 class="card-title">${ICON.route()}${esc(pp.name)}</h2>${isDefault ? '<span class="badge sm">Default</span>' : ""}${built.broken ? `<span class="badge danger">${ICON.broken(12)}Broken</span>` : ""}${makeDefault}${askDevops()}</div>
            <p>${esc(pp.description)}</p>
            <div class="detail-facts">${facts.join('<span class="sep">·</span>')}</div>
          </section>
          ${brokenAlert}
          <section class="card">
            <div class="form-grid">
              <label class="field"><span class="field-label">Name</span><input class="input" value="${esc(pp.name)}" data-pp-field="name" /></label>
              <label class="field"><span class="field-label">Base Pipeline</span><select class="select" data-action="base">${baseOptions}</select><span class="field-hint">An office-wide Pipeline: its edits reach this one, and the Stage changes apply on top.</span></label>
              <label class="field wide"><span class="field-label">Description</span><textarea class="textarea" rows="2" style="min-height:56px" data-pp-field="description">${esc(pp.description)}</textarea></label>
            </div>
            ${getsBlock(pp, built)}
          </section>
          <div class="save-bar"><span class="save-state ${dirty ? "dirty" : ""}">${dirty ? "Unsaved changes" : "Saved"}</span>
            <button class="btn danger-ghost" title="${isDefault ? `Refused while it is ${esc(project.name)}'s default` : ""}">Remove</button>
            <button class="btn secondary" data-action="discard" ${dirty ? "" : "disabled"}>Discard</button>
            <button class="btn" data-action="save" ${built.broken || !dirty ? "disabled" : ""} title="${built.broken ? "Fix the Stage changes that don't apply first: a save never leaves it Broken" : dirty ? "" : "Nothing to save"}">Save the Pipeline</button></div>`;
      }

      /* ---------- Proposed: the one view of what the Project gets ---------- */
      function getsBlock(pp, built, { readOnly = false } = {}) {
        const project = projectOf(pp.projectId);
        const baseName = built.base.name;
        const legend = `<span class="legend" aria-hidden="true"><span><i class="plain"></i>From ${esc(baseName)}</span><span><i style="--edge:var(--success)"></i>Inserted</span><span><i style="--edge:var(--info)"></i>Replaced</span><span><i style="--edge:var(--warning)"></i>Changed</span><span><i style="--edge:var(--border-strong)"></i>Removed</span></span>`;
        const sum = pp.stageChanges.length
          ? `${plural(built.live.length, "Stage", "Stages")}: ${esc(baseName)}'s ${built.base.stages.length}, with ${stageChangesWords(pp.stageChanges.length)}`
          : `${esc(baseName)}'s ${plural(built.base.stages.length, "Stage", "Stages")} as they are: no Stage change yet`;
        let number = 0;
        const items = [];
        built.rows.forEach((row, i) => {
          if (!readOnly) items.push(insertPoint(built, i));
          if (!row.removed) number += 1;
          items.push(stageRow(pp, built, row, row.removed ? "" : number, readOnly));
        });
        if (!readOnly) items.push(insertPoint(built, built.rows.length));
        return `<div class="gets">
          <div class="gets-head"><h3>What ${esc(project.name)} gets</h3><span class="gets-sum">${sum}</span>${legend}</div>
          ${notApplyingBlock(pp, built, readOnly)}
          <ol class="stage-list" aria-label="What ${esc(project.name)} gets">${items.join("")}</ol>
          ${readOnly ? "" : `<p class="rules">${ICON.info(13)}<span>Each mark is one Stage change. A Stage from ${esc(baseName)} follows ${esc(baseName)}'s edits; editing it here makes a Change of only the fields you edit. ${esc(baseName)} itself stays as it is.</span></p>`}
        </div>`;
      }
      function insertPoint(built, index) {
        const id = `insert-${index}`;
        const open = state.menu === id;
        const kinds = ["agent", "script", "gate"].map((k) => `<button class="menu-item" data-action="insert" data-at="${index}" data-kind="${k}">${KIND_ICON[k](14)}${KIND_WORDS[k]}</button>`).join("");
        const menu = open ? `<div class="menu" role="menu"><span class="menu-label">${esc(insertLabel(built, index))}</span>${kinds}<button class="menu-item">${ICON.bookmark()}From a template</button></div>` : "";
        return `<li class="insert-point"><button data-action="menu" data-menu="${id}" aria-expanded="${open}" title="${esc(insertLabel(built, index))}">${ICON.plus(11)}Insert</button>${menu}</li>`;
      }
      function anchorFor(built, index) {
        const above = built.rows.slice(0, index).reverse().find((r) => !r.removed);
        if (above) return { kind: "insert-after", row: above };
        const below = built.rows.slice(index).find((r) => !r.removed);
        return { kind: "insert-before", row: below };
      }
      function insertLabel(built, index) {
        const a = anchorFor(built, index);
        return `Insert ${a.kind === "insert-after" ? "after" : "before"} ${a.row.stage.name}`;
      }

      function stageRow(pp, built, row, number, readOnly) {
        const baseName = built.base.name;
        const origin = originWords(row, baseName);
        const editing = state.editing === row.key && !row.removed;
        const open = editing || state.open.has(row.key);
        const flagged = Boolean(row.loopProblem);
        const tone = origin.tone === "plain" ? `<span>${esc(origin.text)}</span>` : `<span class="badge ${origin.tone}" title="${esc(row.change ? changeLine(row.change) : "")}">${esc(origin.text)}</span>`;
        const foldable = row.origin === "changed" || row.origin === "replaced";
        const menuId = `row-${row.key}`;
        let tools = "";
        if (!readOnly) {
          const edit = row.removed ? "" : `<button class="icon-button" data-action="edit" data-key="${row.key}" title="${editing ? `Done editing ${esc(row.stage.name)}` : `Edit ${esc(row.stage.name)}`}">${editing ? ICON.chevronUp(14) : ICON.pencil()}</button>`;
          const fold = foldable && !editing ? `<button class="icon-button" data-action="fold" data-key="${row.key}" title="${open ? "Hide" : "Show"} what ${esc(row.origin === "changed" ? "changed" : "it replaces")}">${open ? ICON.chevronUp(14) : ICON.chevronDown(14)}</button>` : "";
          const undo = row.origin !== "base" ? `<button class="undo" data-action="undo" data-index="${row.index}" title="${esc(undoTitle(row, baseName))}">${ICON.undo()}${isPhone() ? "" : "Undo"}</button>` : "";
          const moreMenu =
            row.origin === "base"
              ? `<span class="menu-wrap"><button class="icon-button" data-action="menu" data-menu="${menuId}" aria-expanded="${state.menu === menuId}" title="More for ${esc(row.stage.name)}">${ICON.more()}</button>${
                  state.menu === menuId
                    ? `<div class="menu" role="menu"><span class="menu-label">Replace ${esc(row.stage.name)} with</span>${["agent", "script", "gate"].map((k) => `<button class="menu-item" data-action="replace" data-key="${row.key}" data-kind="${k}">${ICON.swap()}A new ${KIND_WORDS[k]}</button>`).join("")}<span class="menu-rule"></span><button class="menu-item danger" data-action="remove" data-key="${row.key}">${ICON.trash()}Remove from ${esc(projectOf(pp.projectId).name)}'s Stages</button></div>`
                    : ""
                }</span>`
              : "";
          tools = `<span class="stage-tools">${fold}${edit}${undo}${moreMenu}</span>`;
        }
        let more = "";
        if (editing) more = `<div class="stage-more">${stageForm(pp, built, row)}</div>`;
        else if (open && row.origin === "changed") more = `<div class="stage-more">${compareBlock(row, built)}</div>`;
        else if (open && row.origin === "replaced")
          more = `<div class="stage-more"><div class="replaced-by"><div><span class="overline">${esc(baseName)}'s ${esc(row.replaced.name)}</span><span>${esc(KIND_WORDS[row.replaced.kind])} · ${esc(whoWorks(row.replaced))}</span><span class="stage-detail">${esc(stageFacts(row.replaced, built.rows))}</span></div>
            <div><span class="overline">${esc(projectOf(pp.projectId).name)} gets</span><span>${esc(KIND_WORDS[row.stage.kind])} · ${esc(whoWorks(row.stage))}</span><span class="stage-detail">${esc(stageFacts(row.stage, built.rows))}</span></div></div></div>`;
        const problem = flagged && !readOnly ? loopFix(pp, built, row) : flagged ? `<div class="row-problem">${ICON.broken(14)}<span>${esc(loopWhy(row, built.rows))}</span></div>` : "";
        const classes = ["stage-row", row.origin, flagged ? "flagged" : "", editing ? "open" : "", state.fresh === row.key ? "fresh" : ""].join(" ");
        return `<li class="${classes}"><div class="stage-line"><span class="stage-number">${number}</span><span class="stage-kind" title="${KIND_WORDS[row.stage.kind]}">${KIND_ICON[row.stage.kind]()}</span>
            <span class="stage-words"><span class="stage-name">${esc(row.stage.name)} <span class="who">· ${esc(whoWorks(row.stage))}</span></span><span class="stage-detail">${esc(stageFacts(row.stage, built.rows))}</span></span>
            <span class="origin">${tone}</span>${tools}</div>${problem}${more}</li>`;
      }

      function compareBlock(row, built) {
        const baseName = built.base.name;
        const projectName = projectOf(ppOf(state.picked)?.projectId ?? "the-office").name;
        const cells = Object.keys(row.change.fields)
          .map(
            (field) => `<div class="label">${FIELD_LABELS[field]}</div><div class="was" data-who="${esc(baseName)}">${esc(fieldWords(field, row.baseStage[field], built.rows))}</div><div class="now" data-who="${esc(projectName)}">${esc(fieldWords(field, row.change.fields[field], built.rows))}</div>
              <div class="set-back"><button class="undo" data-action="set-back" data-key="${row.key}" data-field="${field}" title="Set ${FIELD_LABELS[field]} back to ${esc(baseName)}'s">${ICON.undo()}Set back</button></div>`,
          )
          .join("");
        return `<div class="compare"><div class="head"></div><div class="head">${esc(baseName)} has</div><div class="head">${esc(projectName)} gets</div><div class="head"></div>${cells}</div>`;
      }

      function stageForm(pp, built, row) {
        const s = row.stage;
        const fromBase = row.origin === "base" || row.origin === "changed";
        const baseName = built.base.name;
        const differs = (field) => fromBase && !same(s[field], row.baseStage[field]);
        const hint = (field) =>
          differs(field)
            ? `<span class="from-base">${esc(baseName)}: <span>${esc(fieldWords(field, row.baseStage[field], built.rows))}</span><button class="text-link" data-action="set-back" data-key="${row.key}" data-field="${field}">Set back</button></span>`
            : "";
        const input = (field, label, extra = "") => `<label class="field ${extra}"><span class="field-label">${label}</span>${fieldControl(field, s, built, row)}${hint(field)}</label>`;
        const lead = fromBase
          ? `<p class="rules wide">${ICON.info(13)}<span>From ${esc(baseName)}: what you change here is a Change of only those fields, marked with ${esc(baseName)}'s value. The rest follows ${esc(baseName)}.</span></p>`
          : `<label class="field wide"><span class="field-label">Where it goes</span><select class="select" data-action="place" data-index="${row.index}">${placeOptions(built, row)}</select><span class="field-hint">${row.origin === "replaced" ? `Replaces ${esc(row.change.stageName)} of ${esc(baseName)}.` : `Kept beside this Stage of ${esc(baseName)} when ${esc(baseName)} changes.`}</span></label>`;
        const fields = [input("name", "Name")];
        if (s.kind === "agent") fields.push(input("role", "Who works it"), input("session", "Session"), input("budget", "Budget"), input("effort", "Effort"), input("brief", "Brief", "wide"));
        if (s.kind === "script") fields.push(input("command", "Project command"));
        if (s.kind === "gate") fields.push(`<label class="field"><span class="field-label">What you see</span><input class="input" disabled value="The diff, results, Attachments and screenshots so far" /></label>`);
        if (s.kind !== "gate") fields.push(input("onFailure", "On failure", "wide"));
        return `<div class="stage-form">${lead}${fields.join("")}</div>`;
      }
      function placeOptions(built, row) {
        if (row.origin === "replaced") return `<option>In place of ${esc(row.change.stageName)}</option>`;
        // An insert may sit beside a Stage of the base Pipeline or one an earlier Stage change inserted.
        return built.rows
          .filter((r) => !r.removed && (r.origin !== "inserted" || r.index < row.index))
          .flatMap((r) => [
            [`insert-before:${r.key}`, `Before ${r.stage.name}`],
            [`insert-after:${r.key}`, `After ${r.stage.name}`],
          ])
          .map(([v, l]) => `<option value="${v}" ${v === `${row.change.kind}:${row.change.stageKey}` ? "selected" : ""}>${esc(l)}</option>`)
          .join("");
      }
      function fieldControl(field, s, built, row) {
        const data = `data-edit="${row.key}" data-field="${field}"`;
        if (field === "role")
          return `<select class="select" ${data}>${Object.entries(PEOPLE)
            .map(([id, p]) => `<option value="${id}" ${s.role === id ? "selected" : ""}>${p.name} · ${p.title}</option>`)
            .join("")}</select>`;
        if (field === "session") return `<select class="select" ${data}><option value="fresh" ${s.session === "fresh" ? "selected" : ""}>Fresh, with a brief</option><option value="continue" ${s.session === "continue" ? "selected" : ""}>Continue the previous Stage's session</option></select>`;
        if (field === "effort") return `<select class="select" ${data}>${Object.entries(EFFORT).map(([v, l]) => `<option value="${v}" ${s.effort === v ? "selected" : ""}>${l}</option>`).join("")}</select>`;
        if (field === "command") return `<select class="select" ${data}>${["test", "test-full", "test-data", "lint", "publish"].map((k) => `<option ${s.command === k ? "selected" : ""}>${k}</option>`).join("")}</select>`;
        if (field === "budget") return `<input class="input" type="number" ${data} value="${s.budget ?? ""}" />`;
        if (field === "brief") return `<textarea class="textarea" rows="3" ${data}>${esc(s.brief ?? "")}</textarea>`;
        if (field === "onFailure") return onFailureControl(s, built, row, data);
        return `<input class="input" ${data} value="${esc(s[field] ?? "")}" />`;
      }
      function onFailureControl(s, built, row, data) {
        const live = built.rows.filter((r) => !r.removed);
        const earlier = live.slice(0, live.indexOf(row));
        const target = s.onFailure?.goBackTo ?? "";
        const options = [`<option value="" ${target ? "" : "selected"}>Ask you</option>`, ...earlier.map((r) => `<option value="${r.key}" ${r.key === target ? "selected" : ""}>Go back to ${esc(r.stage.name)}</option>`)];
        if (target && !earlier.some((r) => r.key === target)) options.push(`<option value="${target}" selected>Go back to ${esc(nameOfKey(target, built.rows, s.onFailure.goBackToName))} (not there)</option>`);
        const rounds = target ? `<span>at most</span><select class="select sm" data-edit="${row.key}" data-field="rounds">${[1, 2, 3, 4, 5].map((n) => `<option ${n === s.onFailure.rounds ? "selected" : ""}>${n}</option>`).join("")}</select><span>${s.onFailure.rounds === 1 ? "time" : "times"}, then ask you</span>` : "";
        return `<span class="on-failure"><select class="select" ${data}>${options.join("")}</select>${rounds}</span>`;
      }

      function notApplyingBlock(pp, built, readOnly) {
        if (!built.notApplying.length) return "";
        const choices = built.live.map((r) => `<option value="${r.key}">${esc(r.stage.name)}</option>`).join("");
        const items = built.notApplying
          .map((n) => {
            const kindWords = { "insert-before": "Insert before", "insert-after": "Insert after", replace: "Replace", change: "Change", remove: "Remove" }[n.change.kind];
            const why = n.why === "gone" ? goneWhy(n.change, noLongerHas(built.base.name)) : takenWhy(n.change, built.base.name);
            const remove = `<button class="btn sm secondary" data-action="undo" data-index="${n.index}">${ICON.trash(13)}Remove this Stage change</button>`;
            // A Stage that is gone is fixed by pointing at another; a key the base Pipeline took, by a new key.
            const fix = readOnly
              ? ""
              : n.why === "gone"
                ? `<div class="fix"><span>Apply it to</span><select class="select" data-action="repoint" data-index="${n.index}"><option value="" selected disabled>Choose a Stage…</option>${choices}</select><span>or</span>${remove}</div>`
                : `<div class="fix"><button class="btn sm secondary" data-action="rekey" data-index="${n.index}">Give ${esc(n.change.stage.name)} a key of its own</button><span>or</span>${remove}</div>`;
            return `<div class="not-apply-item"><div class="what"><span class="badge sm warning">${kindWords}</span>${esc(n.change.stageName)}${n.change.fields ? `<span class="note">· ${esc(listWords(changedFields(n.change)))}</span>` : ""}</div><div class="why">${esc(why)}</div>${fix}</div>`;
          })
          .join("");
        return `<div class="not-apply" role="group" aria-label="Stage changes that don't apply"><div class="not-apply-head">${ICON.broken(14)}${plural(built.notApplying.length, "Stage change doesn't apply", "Stage changes don't apply")} to ${esc(built.base.name)}</div>${items}</div>`;
      }
      function loopFix(pp, built, row) {
        const live = built.live;
        const earlier = live.slice(0, live.indexOf(row));
        const options = [`<option value="" selected disabled>Choose…</option>`, `<option value="">Ask you</option>`, ...earlier.map((r) => `<option value="${r.key}">Go back to ${esc(r.stage.name)}</option>`)].join("");
        return `<div class="row-problem">${ICON.broken(14)}<span>${esc(loopWhy(row, built.rows))}</span><span class="fix">On failure <select class="select sm" data-edit="${row.key}" data-field="onFailure">${options}</select></span></div>`;
      }

      /* ---------- Editing: every edit becomes a Stage change, kept as small as it can be ---------- */
      function editStage(pp, key, field, raw) {
        const built = build(pp);
        const row = built.rows.find((r) => r.key === key);
        if (!row) return;
        let value = raw;
        if (field === "budget") value = raw === "" ? undefined : Number(raw);
        if (field === "rounds") {
          field = "onFailure";
          value = { ...row.stage.onFailure, rounds: Number(raw) };
        } else if (field === "onFailure" && typeof raw !== "object") value = raw ? { goBackTo: raw, rounds: row.stage.onFailure?.rounds ?? 2 } : undefined;
        if (row.origin === "inserted" || row.origin === "replaced") {
          const stage = { ...row.change.stage, [field]: value };
          if (value === undefined) delete stage[field];
          pp.stageChanges[row.index] = { ...row.change, stage };
          return;
        }
        const next = { ...row.stage, [field]: value };
        const fields = {};
        Object.keys(FIELD_LABELS).forEach((f) => {
          if (!same(next[f], row.baseStage[f])) fields[f] = next[f] ?? null;
        });
        const at = pp.stageChanges.findIndex((c) => c.kind === "change" && c.stageKey === key);
        if (!Object.keys(fields).length) {
          if (at >= 0) pp.stageChanges.splice(at, 1);
        } else if (at >= 0) pp.stageChanges[at] = { ...pp.stageChanges[at], fields };
        else pp.stageChanges.push({ kind: "change", stageKey: key, stageName: row.baseStage.name, fields });
      }
      const newKey = (built, name) => {
        const base = name.toLowerCase().replace(/[^a-z0-9]+/g, "-");
        let key = base;
        for (let n = 2; built.rows.some((r) => r.key === key); n += 1) key = `${base}-${n}`;
        return key;
      };
      const newStage = (built, kind) => {
        const name = { agent: "New Stage", script: "Script", gate: "Gate" }[kind];
        const stage = { key: newKey(built, name), name, kind };
        if (kind === "agent") Object.assign(stage, { role: "jim", session: "fresh", budget: 200, effort: "default", brief: "" });
        if (kind === "script") stage.command = "test";
        return stage;
      };

      /* ---------- Windows ---------- */
      function newWindow() {
        const base = officeOf(state.newBase);
        const project = projectOf(state.project);
        const choices = OFFICE.filter((o) => o.id !== "onboard")
          .map((o) => `<li><button class="base-choice" role="radio" aria-checked="${o.id === state.newBase}" data-action="new-base" data-base="${o.id}"><span class="radio"></span><b>${esc(o.name)}</b><span>${esc(stagesLine(o.stages))}</span></button></li>`)
          .join("");
        return `<div class="window-backdrop"><div class="window keeps-height" role="dialog" aria-modal="true" aria-labelledby="new-title">
          <div class="window-head"><h2 id="new-title">Add a Pipeline to ${esc(project.name)}</h2><button class="icon-button" data-action="close" aria-label="Close">${ICON.x()}</button></div>
          <div class="window-body">
            <p class="note">A Project Pipeline: only ${esc(project.name)}'s Tasks and its default can choose it.</p>
            <div class="field" role="radiogroup" aria-label="Base Pipeline"><span class="field-label">Base Pipeline</span><span class="field-hint">The office-wide Pipeline it is built from. It starts as its Stages exactly; you then insert, replace, change or remove Stages, and ${esc(base.name)}'s later edits still reach it.</span><ul class="base-choices">${choices}</ul></div>
            <label class="field"><span class="field-label">Name</span><input class="input" value="${esc(base.name)} for ${esc(project.name)}" /><span class="field-hint">Not a name an office-wide Pipeline or another of ${esc(project.name)}'s has.</span></label>
            <label class="field"><span class="field-label">Description</span><textarea class="textarea" rows="2" style="min-height:56px" placeholder="What it is for, in a sentence"></textarea></label>
          </div>
          <div class="window-bar"><button class="btn" data-action="add-new">Add the Pipeline</button><button class="btn secondary" data-action="ask">${ICON.sparkles(13)}Ask Dwight instead</button><span class="grow"></span><button class="btn secondary" data-action="close">Close</button></div>
        </div></div>`;
      }
      function breaksWindow() {
        const breaks = breaksOf("full", FULL_SPLIT);
        const groups = PROJECTS.map((project) => ({ project, items: breaks.filter((b) => b.pp.projectId === project.id) }))
          .filter((g) => g.items.length)
          .map(
            (g) => `<li class="breaks-project"><span class="project-chip">${projectMark(g.project)}${esc(g.project.name)}</span>${g.items
              .map((b) => {
                const isDefault = g.project.default === b.pp.id;
                return `<div class="break-item"><div class="what">${esc(b.pp.name)}${isDefault ? `<span class="badge sm">${esc(g.project.name)}'s default</span>` : ""}</div><ul>${b.reasons.map((r) => `<li>${esc(r)}</li>`).join("")}</ul>${b.pp.waiting.length ? `<span class="tasks">${b.pp.waiting.length === 1 ? `Its Task that hasn't started, ${esc(b.pp.waiting[0])}, can't start until it is fixed.` : `Its ${b.pp.waiting.length} Tasks that haven't started can't start until it is fixed.`}</span>` : ""}<button class="text-link open-it" data-action="goto-pp" data-id="${b.pp.id}">Open it on ${esc(g.project.name)}'s page</button></div>`;
              })
              .join("")}</li>`,
          )
          .join("");
        return `<div class="window-backdrop"><div class="window small" role="alertdialog" aria-modal="true" aria-labelledby="breaks-title">
          <div class="window-head"><h2 id="breaks-title">Saving Full breaks ${plural(breaks.length, "Project Pipeline", "Project Pipelines")}</h2><button class="icon-button" data-action="close" aria-label="Close">${ICON.x()}</button></div>
          <div class="window-body"><p>Their Stage changes name Stages this save takes out of Full. Saved, each is Broken: Tasks can't choose it until its Stage changes are fixed on its Project's page. Tasks already started keep their Stages.</p><ul class="breaks">${groups}</ul></div>
          <div class="window-bar"><button class="btn" data-action="save-anyway">Save anyway</button><span class="grow"></span><button class="btn secondary" data-action="close">Close</button></div>
        </div></div>`;
      }

      /* ---------- Proposed: the grouped Pipeline picker ---------- */
      function pipelineOptions(projectId, { forDefault = false } = {}) {
        const project = projectOf(projectId);
        const own = PROJECT_PIPELINES.filter((p) => p.projectId === projectId).sort((a, b) => (a.id === project.default ? -1 : b.id === project.default ? 1 : 0));
        const ownOptions = own.map((p) => {
          const built = build(p);
          const reasons = brokenReasons(p);
          return {
            id: p.id,
            name: p.name,
            badge: !forDefault && p.id === project.default ? "Project default" : "",
            line: `${stagesLine(built.live.map((r) => r.stage))} · built from ${built.base.name}`,
            why: reasons.length ? `Broken: ${reasons.join(" ")} Fix it in ${project.name}'s Pipelines.` : "",
          };
        });
        const office = OFFICE.map((o) => ({ id: o.id, name: o.name, badge: !forDefault && o.id === project.default ? "Project default" : "", line: stagesLine(o.stages) }));
        return [
          { label: `${project.name}'s Pipelines`, options: ownOptions },
          { label: "Office-wide Pipelines", options: office },
        ];
      }
      function listbox(groups, chosen, action) {
        return `<div class="listbox" role="listbox">${groups
          .map(
            (g) => `<div class="listbox-group" role="presentation">${esc(g.label)}</div>${g.options
              .map(
                (o) => `<button class="option" role="option" data-action="${action}" data-id="${o.id}" aria-selected="${o.id === chosen}" ${o.why ? 'aria-disabled="true"' : ""} title="${o.why ? esc(`Can't be chosen: ${o.why}`) : ""}">
                <span class="tick">${o.id === chosen ? ICON.check(13) : ""}</span><b>${esc(o.name)}</b><span class="aside">${o.badge ? `<span class="badge sm">${o.badge}</span>` : ""}${o.why ? `<span class="badge sm danger">${ICON.broken(11)}Broken</span>` : ""}</span>
                <span class="line ${o.why ? "why" : ""}">${esc(o.why || o.line)}</span></button>`,
              )
              .join("")}`,
          )
          .join("")}</div>`;
      }
      const optionById = (groups, id) => groups.flatMap((g) => g.options).find((o) => o.id === id);

      function taskPlace() {
        const groups = pipelineOptions("the-office");
        const chosen = optionById(groups, state.picker.chosen);
        const page = `<div class="page-scroll"><div class="record-head"><h2>Add a search box to the Thread list</h2>
            <div class="record-facts"><span class="badge">Backlog</span><span class="project-chip">${projectMark(projectOf("the-office"))}the-office</span><span>No Pipeline yet</span></div></div>
          <div class="rail-none"><span class="slot"></span><span class="slot"></span><span class="slot"></span><span>No Pipeline yet: Angela proposes one at planning, or you choose one.</span><button class="btn sm secondary">Choose a Pipeline</button></div>
          <div class="card ghost-card"><span class="overline">Description</span><span class="ghost-line" style="width:82%"></span><span class="ghost-line" style="width:64%"></span></div></div>`;
        const trigger = `<button class="picker-trigger" data-action="picker-toggle" aria-expanded="${state.picker.open}"><span class="grow ${chosen ? "" : "placeholder"}">${chosen ? esc(chosen.name) : "Choose a Pipeline"}</span>${ICON.chevronDown()}</button>`;
        const win = `<div class="window-backdrop"><div class="window keeps-height" role="dialog" aria-modal="true" aria-labelledby="choose-title">
          <div class="window-head"><h2 id="choose-title">Choose a Pipeline for Add a search box to the Thread list</h2><button class="icon-button" aria-label="Close">${ICON.x()}</button></div>
          <div class="window-body"><div class="field"><span class="field-label">Pipeline</span>${trigger}${state.picker.open ? listbox(groups, state.picker.chosen, "choose") : ""}${chosen && !state.picker.open ? `<span class="chosen-stages">${esc(chosen.line)}</span>` : ""}</div></div>
          <div class="window-bar"><button class="btn" ${chosen ? "" : "disabled"} title="${chosen ? "" : "Choose a Pipeline first"}">Choose</button><span class="grow">Once it is chosen, Edit for this Task changes its Stages for this Task alone.</span><button class="btn secondary">Close</button></div>
        </div></div>`;
        return shell({ title: "Add a search box to the Thread list", crumb: "Work ›", rail: "work", main: page, overlay: win });
      }

      function projectPlace({ overlay = "", chatOpen = false, pushed = false } = {}) {
        const project = projectOf(state.project);
        return shell({ title: project.name, crumb: "Projects ›", rail: "projects", main: projectPage(project), overlay, chatOpen, pushed });
      }

      /* ---------- Devops' Proposals in a Thread ---------- */
      function proposalRows(rows) {
        return `<ul class="proposal-changes">${rows
          .map(([label, from, to]) => `<li><span class="proposal-change-label">${label}</span><span class="proposal-values">${from !== undefined ? `<span class="proposal-change-from">${esc(from)}</span>${ICON.arrowRight()}<span class="proposal-change-to">${esc(to)}</span>` : `<span>${esc(to)}</span>`}</span></li>`)
          .join("")}</ul>`;
      }
      function flow(stages, marks = {}) {
        return `<div class="flow">${stages.map((s) => `<span class="${marks[s.key] ?? ""}">${esc(s.name)}</span>`).join(ICON.arrowRight(10))}</div>`;
      }
      function scItem(change, tag, extra = "") {
        const tone = { "insert-before": "inserted", "insert-after": "inserted", replace: "replaced", change: "changed", remove: "removed" }[change.kind];
        const tagHtml = tag === "New" ? '<span class="badge sm success">New</span>' : tag === "Dropped" ? '<span class="badge sm">Dropped</span>' : `<span class="note">${tag}</span>`;
        const detail = change.stage ? `${KIND_WORDS[change.stage.kind]} · ${whoWorks(change.stage)} · ${stageFacts(change.stage, [])}` : "";
        return `<li class="sc-item ${tone} ${tag === "Dropped" ? "dropped" : ""}"><b>${esc(changeLine(change))}</b>${tagHtml}${detail ? `<span class="stage-detail">${esc(detail)}</span>` : ""}${extra}</li>`;
      }
      function proposalNew() {
        const pp = ppOf("pp-linux");
        const built = build(pp);
        return `<section class="proposal-card"><div class="proposal-head"><span class="badge accent">Proposal</span><span class="proposal-title">Add Full with Linux check to the-office's Pipelines</span></div>
          ${proposalRows([
            ["Project", undefined, "the-office"],
            ["Name", undefined, pp.name],
            ["Base Pipeline", undefined, "Full"],
            ["Description", undefined, pp.description],
          ])}
          <div class="proposal-section"><span class="overline">Stage changes · 1</span><ul class="sc-list">${scItem(pp.stageChanges[0], "New")}</ul></div>
          <div class="proposal-section"><span class="overline">the-office gets</span>${flow(built.live.map((r) => r.stage), { "verify-on-linux": "new" })}</div>
          <div class="proposal-foot"><span class="badge success">${ICON.check(11)}Applied</span><span class="proposal-note">by you · 10:05</span></div></section>`;
      }
      function proposalChange() {
        const pp = ppOf("pp-linux");
        const was = build(pp);
        const proposed = copy(pp);
        proposed.stageChanges.push(
          { kind: "change", stageKey: "implement", stageName: "Implement", fields: { brief: "Implement the Plan, changing only the files it names, until the Definition of Done is met; check it with the Project's commands." } },
          { kind: "insert-before", stageKey: "publish", stageName: "Publish", stage: { key: "your-review", name: "Your review", kind: "gate" } },
        );
        const now = build(proposed);
        const brief = `<div class="compare" style="grid-column:1/-1;margin-top:4px"><div class="label">Brief</div><div class="was" data-who="Full">${esc(STAGE.implement.brief)}</div><div class="now" data-who="Proposed">${esc(proposed.stageChanges[1].fields.brief)}</div><div class="set-back"></div></div>`;
        return `<section class="proposal-card"><div class="proposal-head"><span class="badge accent">Proposal</span><span class="proposal-title">Change the-office's Full with Linux check</span></div>
          ${proposalRows([["Stage changes", "1", "3"]])}
          <div class="proposal-section"><span class="overline">Stage changes, as proposed</span><ul class="sc-list">${scItem(pp.stageChanges[0], "Kept")}${scItem(proposed.stageChanges[1], "New", brief)}${scItem(proposed.stageChanges[2], "New")}</ul></div>
          <div class="proposal-section"><span class="overline">the-office gets</span>
            <div class="proposal-values"><span class="note" style="min-width:64px">Was</span>${flow(was.live.map((r) => r.stage))}</div>
            <div class="proposal-values"><span class="note" style="min-width:64px">Proposed</span>${flow(now.live.map((r) => r.stage), { "your-review": "new" })}</div></div>
          <div class="proposal-foot"><button class="btn sm" data-action="apply">Apply change</button><button class="btn sm ghost">Not now</button><span class="proposal-note">Refused if it changes before you apply this</span></div></section>`;
      }
      function proposalBase() {
        const breaks = breaksOf("full", FULL_SPLIT);
        return `<section class="proposal-card"><div class="proposal-head"><span class="badge accent">Proposal</span><span class="proposal-title">Change the Full Pipeline</span></div>
          <div class="proposal-section" style="border-top:0"><span class="overline">Stages</span>
            <div class="proposal-values"><span class="note" style="min-width:64px">Was</span>${flow(FULL, { "review-fix": "gone" })}</div>
            <div class="proposal-values"><span class="note" style="min-width:64px">Proposed</span>${flow(FULL_SPLIT, { review: "new", fix: "new" })}</div></div>
          <div class="proposal-section"><div class="alert warning">${ICON.alert()}<span class="alert-title">Applying this breaks ${plural(breaks.length, "Project Pipeline", "Project Pipelines")}</span>
            <div class="alert-body">${breaks.map((b) => `<p><b>${esc(projectOf(b.pp.projectId).name)} › ${esc(b.pp.name)}</b>: ${esc(b.reasons.join(" "))}</p>`).join("")}<p>Each is Broken until its Stage changes are fixed.</p></div></div></div>
          <div class="proposal-foot"><button class="btn sm">Apply anyway</button><button class="btn sm ghost">Not now</button><span class="proposal-note">Refused if it changes before you apply this</span></div></section>`;
      }
      function proposalPlace() {
        const phone = isPhone();
        const look = phone ? "fill" : state.width === "900" ? "over" : "";
        const turn = (who, time, body) =>
          `<div class="turn">${who === "You" ? '<span class="avatar you">You</span>' : '<span class="avatar dwight">DS</span>'}<div style="min-width:0"><div class="turn-by"><b>${who}</b>${who === "You" ? "" : "<span>Devops</span>"}<span>${time}</span></div><div class="said">${body}</div></div></div>`;
        const thread = `<div class="thread-column">
          ${turn("You", "10:02", "<p>Can you propose a the-office Pipeline built from Full, with Verify on Linux after Review &amp; fix? It should only run when the platform code changed.</p>")}
          ${turn("Dwight", "10:04", `<p>Here is a new Project Pipeline for the-office, built from Full, with one Stage change. Nothing changes until you apply it.</p>${proposalNew()}`)}
          ${turn("You", "10:12", "<p>Also a Gate before Publish, and keep Implement to the files the Plan names.</p>")}
          ${turn("Dwight", "10:13", `<p>Two new Stage changes to Full with Linux check; the one you have stays as it is.</p>${proposalChange()}`)}
          ${turn("You", "10:20", "<p>Could Full itself split Review &amp; fix into a review by Oscar and a fix by Jim?</p>")}
          ${turn("Dwight", "10:22", `<p>Here are Full's new Stages. Three Project Pipelines name Review &amp; fix, so applying this breaks them; the card lists each one.</p>${proposalBase()}`)}
        </div>`;
        const drawer = `<aside class="chat-drawer ${look}" aria-label="Chat">
          <div class="drawer-head"><span class="avatar dwight">DS</span><div class="drawer-head-main"><span class="drawer-title">Dwight</span><span class="drawer-sub">Devops · proposes Pipelines, commands and run environments</span></div><button class="icon-button" aria-label="Close the chat">${ICON.x()}</button></div>
          <div class="thread-row"><button class="btn ghost sm">${ICON.chevronLeft()} Threads</button><span class="thread-row-title">the-office's Pipelines</span></div>
          <div class="thread">${thread}</div>
          <div class="composer"><textarea class="composer-field" rows="1" placeholder="Write to Dwight…" aria-label="Message"></textarea></div>
        </aside>`;
        return projectPlace({ overlay: drawer, chatOpen: true, pushed: state.width === "wide" });
      }

      /* ---------- The frame ---------- */
      function renderFrame() {
        const frame = document.getElementById("frame");
        frame.className = `frame w-${state.width}`;
        const overlay = state.window === "new" ? newWindow() : state.window === "breaks" ? breaksWindow() : "";
        let html;
        if (state.view === "task") html = taskPlace();
        else if (state.view === "chat") html = proposalPlace();
        else if (state.view === "project") html = projectPlace({ overlay });
        else html = shell({ title: "Pipelines", crumb: "Settings ›", rail: "settings", main: libraryPage(), overlay });
        const scroll = document.getElementById("page-scroll");
        const keep = scroll ? scroll.scrollTop : 0;
        frame.innerHTML = html;
        const next = document.getElementById("page-scroll");
        if (next && state.keepScroll) next.scrollTop = keep;
        state.keepScroll = false;
      }

      /* ---------- The bar, the note and the reference ---------- */
      function segments(name, options, current) {
        return `<div class="control"><span class="control-label">${name}</span><div class="segments">${options
          .map((o) => `<button data-${name.toLowerCase()}="${o.key}" aria-pressed="${o.key === current}">${o.label}</button>`)
          .join("")}</div></div>`;
      }
      function renderBar() {
        document.getElementById("bar").innerHTML = `<span class="bar-title">Project Pipelines</span><span class="bar-tag">PROPOSAL</span>
          ${segments("Width", WIDTHS, state.width)}${segments("Palette", PALETTES, state.palette)}<span class="bar-break"></span>${segments("Scenario", SCENARIOS, state.scenario)}`;
      }
      function renderNote() {
        const s = scenario();
        const brokenDefault = projectOf("the-office").default === "pp-spec";
        const extra =
          s.key === "project"
            ? `<button class="btn sm secondary" data-action="default-broken">${brokenDefault ? "Show a default that works" : "Show a Broken default"}</button>`
            : `<button class="btn sm secondary" data-action="reset">Start the scenario again</button>`;
        document.getElementById("note").innerHTML = `<span><strong>${esc(s.label)}.</strong> ${esc(s.note)}</span>${extra}`;
      }
      function renderReference() {
        document.getElementById("reference").innerHTML = `
          <div><h2>How each Stage reads</h2>
            <table><tr><th>Mark</th><th>Words on the row</th><th>Undo gives</th></tr>
              <tr><td>None</td><td>From Full</td><td>Nothing to undo: edit it to make a Change</td></tr>
              <tr><td>Green edge</td><td>Inserted after Review &amp; fix</td><td>Takes the Stage out</td></tr>
              <tr><td>Blue edge</td><td>Replaces Tests</td><td>Full's Tests back</td></tr>
              <tr><td>Amber edge</td><td>Changed: Brief, Effort</td><td>Full's Stage as it is; Set back does one field</td></tr>
              <tr><td>Grey, struck through</td><td>Removed</td><td>Full's Stage back, in its place</td></tr>
              <tr><td>Red edge</td><td>Why it is Broken, with its fix</td><td>Remove this Stage change, or point it at another Stage</td></tr></table>
            <p>The numbers count what the Project gets; a removed Stage keeps its row, unnumbered, so the list still reads against the base Pipeline.</p></div>
          <div><h2>Broken, in plain words</h2><ul>
              <li><b>A Stage gone:</b> "Changes Produce, which Document no longer has." Fix: Apply it to another Stage, or Remove this Stage change.</li>
              <li><b>A key taken:</b> "Inserts Write, but Document now has a Stage of its own with the same key." It shows in the same red block, as its Stage has no row. Fix: Give Write a key of its own, or Remove this Stage change.</li>
              <li><b>A loop target gone:</b> "Glossary check goes back to Produce on failure, which isn't among the Stages any more." Fix: On failure, Go back to another earlier Stage, or Ask you.</li>
              <li><b>A loop target later:</b> "… which now comes after it." Same fix.</li>
              <li>A save never leaves a Project Pipeline Broken: Save waits until each is fixed. Only a base Pipeline's save, or a Proposal of its Stages, breaks one, and both warn first.</li></ul></div>
          <div><h2>Where each piece is</h2><ul>
              <li><b>A Project's page › Pipelines</b> (was Default Pipeline): its default, then its own Pipelines, each opening in the editor beside the list. A Project Pipeline belongs to one Project, like its commands and skills, so it lives there.</li>
              <li><b>Settings › Pipelines:</b> office-wide Pipelines only, then Stage templates. One that Project Pipelines are built from says "Built on by N Project Pipelines", each a link to it on its Project's page.</li>
              <li><b>Add:</b> Add a Pipeline built from… under the Project's Pipelines; Ask Dwight instead in the same window.</li>
              <li><b>The default:</b> the Default Pipeline picker at the top of the section, or Make it the default on an open one.</li>
              <li><b>The picker:</b> the Project's own first, its default on top, then the office-wide ones, in groups; a Broken one is listed with why and can't be chosen.</li>
              <li><b>A Proposal:</b> what is new and what stays, each value as was → proposed, and what the Project gets before and after.</li></ul></div>
          <div><h2>Widths</h2>
            <table><tr><th>Width</th><th>Settings › Pipelines and a Project's Pipelines</th><th>A Stage row</th></tr>
              <tr><td>Wide</td><td>Lists beside the open Pipeline</td><td>Number, mark, name, its mark's words, tools on one line</td></tr>
              <tr><td>900px</td><td>The lists, or the open Pipeline with ‹ All Pipelines or ‹ the-office's Pipelines</td><td>The same while the list is over 620px wide</td></tr>
              <tr><td>390px</td><td>The same, the section menu a row of its own</td><td>Its mark's words under the name; Undo as an icon</td></tr></table>
            <p>Nothing scrolls sideways but the section menus, rows made to (spec 4.1).</p></div>`;
      }
      function render() {
        document.documentElement.dataset.palette = state.palette;
        document.documentElement.dataset.theme = state.palette;
        renderBar();
        renderNote();
        renderFrame();
        renderReference();
      }

      /* ---------- Events ---------- */
      const currentPp = () => ppOf(state.picked);
      document.addEventListener("click", (event) => {
        const bar = event.target.closest(".bar button");
        if (bar) {
          if (bar.dataset.width) state.width = bar.dataset.width;
          if (bar.dataset.palette) state.palette = bar.dataset.palette;
          if (bar.dataset.scenario) {
            state.scenario = bar.dataset.scenario;
            applyScenario();
          }
          writeHash();
          return render();
        }
        const target = event.target.closest("[data-action]");
        if (!target || target.tagName === "SELECT") {
          if (state.menu && !event.target.closest(".menu")) {
            state.menu = null;
            state.keepScroll = true;
            renderFrame();
          }
          return;
        }
        const pp = currentPp();
        const { action } = target.dataset;
        state.keepScroll = true;
        if (action === "reset") {
          applyScenario();
          return render();
        }
        if (action === "default-broken") {
          const project = projectOf("the-office");
          // As if Document's save had broken Spec change while it was the default: a save of its own never could.
          project.default = project.default === "pp-spec" ? "pp-linux" : "pp-spec";
          return render();
        }
        if (action === "goto-pp" || action === "goto-office") {
          goTo(action === "goto-pp" ? "project" : "settings", target.dataset.id);
          return renderFrame();
        }
        if (action === "menu") state.menu = state.menu === target.dataset.menu ? null : target.dataset.menu;
        else state.menu = null;
        if (action === "pick") {
          state.picked = target.dataset.id;
          state.showDetail = true;
          state.editing = null;
          state.open = new Set();
          state.keepScroll = false;
        }
        if (action === "back") state.showDetail = false;
        if (action === "fold") state.open.has(target.dataset.key) ? state.open.delete(target.dataset.key) : state.open.add(target.dataset.key);
        if (action === "edit") state.editing = state.editing === target.dataset.key ? null : target.dataset.key;
        if (action === "undo" && pp) {
          const change = pp.stageChanges[Number(target.dataset.index)];
          pp.stageChanges.splice(Number(target.dataset.index), 1);
          state.editing = null;
          showToast(`Undone: ${changeLine(change)}.`);
        }
        if (action === "rekey" && pp) {
          const i = Number(target.dataset.index);
          const change = pp.stageChanges[i];
          pp.stageChanges[i] = { ...change, stage: { ...change.stage, key: newKey(build(pp), change.stage.name) } };
          showToast(`${change.stage.name} is inserted under a key of its own now.`);
        }
        if (action === "set-back" && pp) {
          const row = build(pp).rows.find((r) => r.key === target.dataset.key);
          editStage(pp, target.dataset.key, target.dataset.field, row.baseStage[target.dataset.field]);
          if (!build(pp).rows.find((r) => r.key === target.dataset.key && r.origin === "changed")) state.open.delete(target.dataset.key);
        }
        if (action === "remove" && pp) {
          const key = target.dataset.key;
          const row = build(pp).rows.find((r) => r.key === key);
          pp.stageChanges = pp.stageChanges.filter((c) => !(c.kind === "change" && c.stageKey === key));
          pp.stageChanges.push({ kind: "remove", stageKey: key, stageName: row.stage.name });
          state.editing = null;
        }
        if ((action === "replace" || action === "insert") && pp) {
          const built = build(pp);
          const stage = newStage(built, target.dataset.kind);
          if (action === "replace") {
            const row = built.rows.find((r) => r.key === target.dataset.key);
            pp.stageChanges = pp.stageChanges.filter((c) => !(c.kind === "change" && c.stageKey === row.key));
            pp.stageChanges.push({ kind: "replace", stageKey: row.key, stageName: row.stage.name, stage });
          } else {
            const anchor = anchorFor(built, Number(target.dataset.at));
            pp.stageChanges.push({ kind: anchor.kind, stageKey: anchor.row.key, stageName: anchor.row.stage.name, stage });
          }
          state.editing = stage.key;
          state.fresh = stage.key;
        }
        if (action === "discard" && pp) {
          Object.assign(pp, copy(savedOf(pp.id)));
          state.editing = null;
        }
        if (action === "save" && pp) {
          Object.assign(savedOf(pp.id), copy(pp));
          state.editing = null;
          showToast(`${pp.name} saved. Tasks that haven't started follow it; running ones keep their copy.`);
        }
        if (action === "save-office") state.window = state.fullDraft ? "breaks" : null;
        if (action === "discard-office") state.fullDraft = false;
        if (action === "save-anyway") {
          officeOf("full").stages = FULL_SPLIT;
          state.fullDraft = false;
          state.window = null;
          showToast("Full saved. 3 Project Pipelines are Broken until their Stage changes are fixed.");
        }
        if (action === "close") state.window = null;
        if (action === "new-for") state.window = "new";
        if (action === "new-base") state.newBase = target.dataset.base;
        if (action === "add-new") {
          state.window = null;
          const project = projectOf(state.project);
          showToast(`${officeOf(state.newBase).name} for ${project.name} added to ${project.name}'s Pipelines.`);
        }
        if (action === "make-default" && pp) {
          const project = projectOf(pp.projectId);
          project.default = pp.id;
          showToast(`${project.name}'s default Pipeline is ${pp.name} now.`);
        }
        if (action === "ask") showToast("In the app: a chat with Dwight opens, with a draft naming the Pipeline and its Project.");
        if (action === "apply") showToast("Full with Linux check changed. Tasks that haven't started follow it.");
        if (action === "picker-toggle") state.picker.open = !state.picker.open;
        if (action === "choose" && target.getAttribute("aria-disabled") !== "true") {
          state.picker.chosen = target.dataset.id;
          state.picker.open = false;
        }
        if (action === "default-toggle") state.defaultOpen = !state.defaultOpen;
        if (action === "default" && target.getAttribute("aria-disabled") !== "true") {
          const project = projectOf(state.project);
          project.default = target.dataset.id;
          state.defaultOpen = false;
          showToast(`${project.name}'s default Pipeline is ${optionById(pipelineOptions(project.id), target.dataset.id).name} now.`);
        }
        if (action === "default-toggle" || action === "default" || action === "make-default") renderNote();
        renderFrame();
      });
      document.addEventListener("change", (event) => {
        const el = event.target;
        const pp = currentPp();
        state.keepScroll = true;
        if (pp && el.dataset.action === "base") pp.basePipelineId = el.value;
        else if (pp && el.dataset.ppField) pp[el.dataset.ppField] = el.value;
        else if (pp && el.dataset.action === "repoint") {
          const i = Number(el.dataset.index);
          const row = build(pp).rows.find((r) => r.key === el.value);
          pp.stageChanges[i] = { ...pp.stageChanges[i], stageKey: el.value, stageName: row.stage.name };
          showToast(`It applies to ${row.stage.name} now.`);
        } else if (pp && el.dataset.action === "place") {
          const [kind, key] = el.value.split(":");
          const i = Number(el.dataset.index);
          const row = build(pp).rows.find((r) => r.key === key);
          pp.stageChanges[i] = { ...pp.stageChanges[i], kind, stageKey: key, stageName: row.stage.name };
        } else if (pp && el.dataset.edit) editStage(pp, el.dataset.edit, el.dataset.field, el.value);
        else return;
        renderFrame();
      });
      document.addEventListener("keydown", (event) => {
        if (event.key !== "Escape") return;
        if (state.menu) state.menu = null;
        else if (state.window) state.window = null;
        else return;
        state.keepScroll = true;
        renderFrame();
      });

      /* The address keeps the scenario, width and palette, so a link or a screenshot opens the same look. */
      function writeHash() {
        history.replaceState(null, "", `#${state.scenario}/${state.width}/${state.palette}`);
      }
      function readHash() {
        const [s, w, p] = location.hash.slice(1).split("/");
        if (SCENARIOS.some((x) => x.key === s)) state.scenario = s;
        if (WIDTHS.some((x) => x.key === w)) state.width = w;
        if (PALETTES.some((x) => x.key === p)) state.palette = p;
      }
      readHash();
      applyScenario();
      render();
    </script>
  </body>
</html>
