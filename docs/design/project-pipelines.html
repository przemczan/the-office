<!doctype html>
<html lang="en" data-palette="light" data-theme="light" data-density="comfortable">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Project Pipelines · design proposal · The Office</title>
    <style>
      /* ---------- Tokens (design-system/tokens/, as docs/design/sub-agents-and-processes.html copied them) ---------- */
      :root {
        --ember-50: #fff2ed;
        --ember-300: #ff9370;
        --ember-500: #f23d0f;
        --ember-700: #9e2406;
        --flare-300: #ffc266;
        --white: #ffffff;
        --gray-25: #fafaf9;
        --gray-50: #f4f4f2;
        --gray-100: #e9e9e6;
        --gray-150: #dededa;
        --gray-200: #d1d1cc;
        --gray-300: #b1b1ab;
        --gray-400: #8a8a84;
        --gray-500: #6b6b66;
        --gray-600: #50504c;
        --gray-700: #3a3a37;
        --gray-800: #262624;
        --gray-900: #181817;
        --gray-950: #0f0f0e;
        --green-50: #edf8f1;
        --green-100: #d5f0df;
        --green-500: #1e9e57;
        --green-700: #106a3b;
        --amber-50: #fff8e6;
        --amber-100: #ffedc2;
        --amber-500: #e5a00d;
        --amber-700: #865b05;
        --red-50: #fdeef0;
        --red-100: #fad9dd;
        --red-500: #c8102e;
        --red-700: #8e0b20;
        --blue-50: #eef3fd;
        --blue-100: #dae5fa;
        --blue-500: #2f6bdb;
        --blue-700: #1d4699;
        --teal-500: #14a38b;
        --violet-500: #7c5cd6;

        --bg: var(--gray-50);
        --surface: var(--white);
        --surface-raised: var(--white);
        --surface-sunken: var(--gray-50);
        --surface-hover: var(--gray-25);
        --surface-selected: var(--ember-50);
        --fg-1: var(--gray-950);
        --fg-2: var(--gray-600);
        --fg-3: var(--gray-500);
        --border: var(--gray-150);
        --border-subtle: var(--gray-100);
        --border-strong: var(--gray-200);
        --border-focus: var(--ember-500);
        --accent: var(--ember-500);
        --accent-subtle: var(--ember-50);
        --accent-subtle-fg: var(--ember-700);
        --primary: var(--gray-900);
        --primary-hover: var(--gray-700);
        --primary-fg: var(--white);
        --control-hover: var(--gray-50);
        --control-press: var(--gray-100);
        --success: var(--green-500);
        --success-subtle: var(--green-50);
        --success-fg: var(--green-700);
        --success-border: var(--green-100);
        --warning: var(--amber-500);
        --warning-subtle: var(--amber-50);
        --warning-fg: var(--amber-700);
        --warning-border: var(--amber-100);
        --danger: var(--red-500);
        --danger-subtle: var(--red-50);
        --danger-fg: var(--red-700);
        --danger-border: var(--red-100);
        --info: var(--blue-500);
        --info-subtle: var(--blue-50);
        --info-fg: var(--blue-700);
        --info-border: var(--blue-100);
        --neutral-subtle: var(--gray-50);
        --neutral-fg: var(--gray-600);
        --neutral-border: var(--gray-150);
        --overlay: color-mix(in oklab, var(--gray-950) 45%, transparent);

        --font-sans: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        --font-mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        --text-2xs: 11px;
        --text-xs: 12px;
        --text-sm: 13px;
        --text-md: 14px;
        --text-lg: 16px;
        --type-body: 400 var(--text-md) / 1.5 var(--font-sans);
        --type-body-sm: 400 var(--text-sm) / 1.45 var(--font-sans);
        --type-label: 500 var(--text-sm) / 1.35 var(--font-sans);
        --type-caption: 400 var(--text-xs) / 1.4 var(--font-sans);
        --type-card-title: 600 var(--text-md) / 1.4 var(--font-sans);
        --type-section-title: 600 var(--text-lg) / 1.3 var(--font-sans);
        --type-overline: 500 var(--text-2xs) / 1.2 var(--font-mono);
        --type-mono: 400 var(--text-xs) / 1.55 var(--font-mono);
        --tracking-caps: 0.06em;
        --tracking-tight: -0.01em;

        --radius-sm: 4px;
        --radius-md: 6px;
        --radius-lg: 8px;
        --radius-xl: 12px;
        --radius-full: 999px;
        --radius-control: var(--radius-md);
        --radius-badge: var(--radius-sm);
        --control-sm: 28px;
        --control-md: 32px;

        --shadow-1: 0 1px 2px rgba(16, 16, 15, 0.05);
        --shadow-2: 0 4px 12px -2px rgba(16, 16, 15, 0.08), 0 1px 3px rgba(16, 16, 15, 0.05);
        --shadow-3: 0 16px 40px -8px rgba(16, 16, 15, 0.18), 0 2px 6px rgba(16, 16, 15, 0.06);
        --ease-out: cubic-bezier(0.2, 0.8, 0.2, 1);
        --duration-fast: 120ms;
        --duration-base: 200ms;
      }
      [data-theme="dark"] {
        --surface-selected: color-mix(in oklab, var(--ember-500) 12%, var(--gray-900));
        --accent-subtle: color-mix(in oklab, var(--ember-500) 16%, transparent);
        --accent-subtle-fg: var(--ember-300);
        --success-subtle: color-mix(in oklab, var(--green-500) 16%, transparent);
        --success-fg: #6fd69b;
        --success-border: color-mix(in oklab, var(--green-500) 30%, transparent);
        --warning-subtle: color-mix(in oklab, var(--amber-500) 16%, transparent);
        --warning-fg: var(--flare-300);
        --warning-border: color-mix(in oklab, var(--amber-500) 30%, transparent);
        --danger-subtle: color-mix(in oklab, var(--red-500) 20%, transparent);
        --danger-fg: #ff8a97;
        --danger-border: color-mix(in oklab, var(--red-500) 36%, transparent);
        --info-subtle: color-mix(in oklab, var(--blue-500) 18%, transparent);
        --info-fg: #93b5f5;
        --info-border: color-mix(in oklab, var(--blue-500) 34%, transparent);
        --overlay: color-mix(in oklab, #000 65%, transparent);
        --shadow-1: 0 0 0 1px rgba(255, 255, 255, 0.04);
        --shadow-2: 0 4px 12px -2px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.06);
        --shadow-3: 0 16px 40px -8px rgba(0, 0, 0, 0.65), 0 0 0 1px rgba(255, 255, 255, 0.08);
      }
      /* packages/ui/src/appearance/palettes/light.css */
      :root[data-palette="light"] {
        --fg-1: var(--gray-800);
        --fg-2: var(--gray-500);
        --fg-3: var(--gray-400);
        --border: var(--gray-100);
        --border-subtle: #efefec;
        --border-strong: var(--gray-150);
        --neutral-fg: var(--gray-500);
        --neutral-border: var(--gray-100);
      }
      /* packages/ui/src/appearance/palettes/dark.css */
      :root[data-palette="dark"] {
        --bg: #161615;
        --surface: #1d1d1b;
        --surface-raised: #242422;
        --surface-sunken: #131312;
        --surface-hover: #222220;
        --surface-selected: #2a2420;
        --fg-1: #d9d9d5;
        --fg-2: #9a9a94;
        --fg-3: #6f6f69;
        --border: #262624;
        --border-subtle: #222220;
        --border-strong: #33332f;
        --primary: #d9d9d5;
        --primary-fg: #161615;
        --primary-hover: #e6e6e2;
        --control-hover: #262624;
        --control-press: #2e2e2b;
        --neutral-subtle: #242422;
        --neutral-fg: #9a9a94;
        --neutral-border: #2e2e2b;
      }
      /* packages/ui/src/appearance/densities/comfortable.css */
      :root[data-density="comfortable"] {
        --pad-card: 16px 18px;
        --pad-row: 10px 14px;
        --radius-card: 10px;
        --gap-card: 16px;
      }

      /* ---------- Base (design-system/tokens/base.css) ---------- */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
        color: inherit;
      }
      @supports selector(::-webkit-scrollbar) {
        ::-webkit-scrollbar {
          width: 10px;
          height: 10px;
        }
        ::-webkit-scrollbar-track,
        ::-webkit-scrollbar-corner {
          background: transparent;
        }
        ::-webkit-scrollbar-thumb {
          border: 3px solid transparent;
          border-radius: var(--radius-full);
          background: var(--border-strong) padding-box;
        }
      }
      @supports not selector(::-webkit-scrollbar) {
        * {
          scrollbar-width: thin;
          scrollbar-color: var(--border-strong) transparent;
        }
      }
      :is(button, input, select, textarea, [tabindex]):focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 1px;
      }
      @keyframes rise {
        from {
          opacity: 0;
          transform: translate(-50%, 6px);
        }
      }
      @keyframes flash {
        from {
          background: var(--success-subtle);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation: none !important;
          transition: none !important;
        }
      }

      /* ---------- packages/ui, re-drawn: badge, avatar, button, fields, alert, menu, toast ---------- */
      .badge {
        display: inline-flex;
        flex: none;
        align-items: center;
        gap: 5px;
        height: 22px;
        padding: 0 8px;
        border: 1px solid var(--neutral-border);
        border-radius: var(--radius-badge);
        background: var(--neutral-subtle);
        color: var(--neutral-fg);
        font: 500 var(--text-xs) / 1 var(--font-sans);
        white-space: nowrap;
      }
      .badge.sm {
        height: 18px;
        padding: 0 6px;
        font-size: var(--text-2xs);
      }
      .badge.success {
        border-color: var(--success-border);
        background: var(--success-subtle);
        color: var(--success-fg);
      }
      .badge.warning {
        border-color: var(--warning-border);
        background: var(--warning-subtle);
        color: var(--warning-fg);
      }
      .badge.danger {
        border-color: var(--danger-border);
        background: var(--danger-subtle);
        color: var(--danger-fg);
      }
      .badge.info {
        border-color: var(--info-border);
        background: var(--info-subtle);
        color: var(--info-fg);
      }
      .badge.accent {
        border-color: transparent;
        background: var(--accent-subtle);
        color: var(--accent-subtle-fg);
      }
      .avatar {
        display: inline-grid;
        flex: none;
        place-items: center;
        width: 24px;
        height: 24px;
        border-radius: 50%;
        background: var(--avatar-bg, var(--gray-100));
        color: var(--avatar-fg, var(--gray-700));
        font: 600 9px/1 var(--font-sans);
      }
      .avatar.sm {
        width: 20px;
        height: 20px;
        font-size: 8px;
      }
      .avatar.dwight {
        --avatar-bg: color-mix(in oklab, var(--amber-500) 24%, var(--surface));
        --avatar-fg: color-mix(in oklab, var(--amber-700) 80%, var(--fg-1));
      }
      .avatar.you {
        --avatar-bg: var(--neutral-subtle);
        --avatar-fg: var(--fg-2);
      }
      .btn {
        display: inline-flex;
        flex: none;
        align-items: center;
        justify-content: center;
        gap: 6px;
        height: var(--control-md);
        padding: 0 12px;
        border: 1px solid transparent;
        border-radius: var(--radius-control);
        background: var(--primary);
        color: var(--primary-fg);
        font: 500 var(--text-sm) / 1 var(--font-sans);
        white-space: nowrap;
        cursor: pointer;
        transition: background var(--duration-fast) var(--ease-out);
      }
      .btn:hover {
        background: var(--primary-hover);
      }
      .btn.sm {
        height: var(--control-sm);
        padding: 0 10px;
        font-size: var(--text-xs);
      }
      .btn.secondary {
        border-color: var(--border-strong);
        background: var(--surface);
        color: var(--fg-1);
      }
      .btn.secondary:hover {
        background: var(--control-hover);
      }
      .btn.ghost {
        background: none;
        color: var(--fg-2);
      }
      .btn.ghost:hover {
        background: var(--control-hover);
        color: var(--fg-1);
      }
      .btn.danger-ghost {
        background: none;
        color: var(--danger-fg);
      }
      .btn.danger-ghost:hover {
        background: var(--danger-subtle);
      }
      .btn[disabled] {
        opacity: 0.45;
        cursor: not-allowed;
      }
      .icon-button {
        display: inline-grid;
        flex: none;
        place-items: center;
        width: var(--control-sm);
        height: var(--control-sm);
        padding: 0;
        border: 0;
        border-radius: var(--radius-md);
        background: none;
        color: var(--fg-2);
        cursor: pointer;
      }
      .icon-button:hover,
      .icon-button[aria-expanded="true"] {
        background: var(--control-hover);
        color: var(--fg-1);
      }
      .text-link {
        padding: 0;
        border: 0;
        background: none;
        color: var(--fg-1);
        font: inherit;
        font-weight: 500;
        text-decoration: underline;
        text-decoration-color: var(--border-strong);
        text-underline-offset: 2px;
        cursor: pointer;
      }
      .text-link:hover {
        text-decoration-color: currentColor;
      }
      .overline {
        font: var(--type-overline);
        letter-spacing: var(--tracking-caps);
        text-transform: uppercase;
        color: var(--fg-3);
      }
      code,
      .mono {
        font: var(--type-mono);
      }
      .field {
        display: flex;
        flex-direction: column;
        gap: 5px;
        min-width: 0;
      }
      .field-label {
        font: var(--type-label);
        color: var(--fg-1);
      }
      .field-hint {
        font: var(--type-caption);
        color: var(--fg-3);
      }
      .input,
      .select,
      .textarea {
        width: 100%;
        min-width: 0;
        height: var(--control-md);
        padding: 0 10px;
        border: 1px solid var(--border-strong);
        border-radius: var(--radius-control);
        background: var(--surface);
        color: var(--fg-1);
        font: var(--type-body-sm);
      }
      .select {
        appearance: none;
        padding-right: 28px;
        background-image: linear-gradient(45deg, transparent 50%, var(--fg-3) 50%), linear-gradient(135deg, var(--fg-3) 50%, transparent 50%);
        background-position:
          calc(100% - 14px) 50%,
          calc(100% - 10px) 50%;
        background-size: 4px 4px;
        background-repeat: no-repeat;
      }
      .select.sm {
        height: var(--control-sm);
        font-size: var(--text-xs);
      }
      .textarea {
        height: auto;
        min-height: 72px;
        padding: 7px 10px;
        line-height: 1.5;
        resize: vertical;
      }
      .input[disabled] {
        background: var(--surface-sunken);
        color: var(--fg-3);
      }
      .alert {
        display: grid;
        grid-template-columns: 18px minmax(0, 1fr);
        gap: 2px 10px;
        padding: 11px 14px;
        border: 1px solid var(--info-border);
        border-radius: var(--radius-lg);
        background: var(--info-subtle);
        color: var(--fg-1);
        font: var(--type-body-sm);
      }
      .alert > svg {
        margin-top: 2px;
        color: var(--info-fg);
      }
      .alert-title {
        font-weight: 600;
      }
      .alert-body {
        grid-column: 2;
        min-width: 0;
        color: var(--fg-2);
      }
      .alert-body p {
        margin: 2px 0 0;
      }
      .alert.warning {
        border-color: var(--warning-border);
        background: var(--warning-subtle);
      }
      .alert.warning > svg {
        color: var(--warning-fg);
      }
      .alert.danger {
        border-color: var(--danger-border);
        background: var(--danger-subtle);
      }
      .alert.danger > svg {
        color: var(--danger-fg);
      }
      .menu-wrap {
        position: relative;
        display: inline-flex;
      }
      .menu {
        position: absolute;
        top: calc(100% + 4px);
        right: 0;
        z-index: 40;
        display: flex;
        flex-direction: column;
        width: 232px;
        padding: 4px;
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        background: var(--surface-raised);
        box-shadow: var(--shadow-3);
      }
      .menu-item {
        display: flex;
        align-items: center;
        gap: 8px;
        min-height: 32px;
        padding: 0 8px;
        border: 0;
        border-radius: var(--radius-md);
        background: none;
        color: var(--fg-1);
        font: var(--type-body-sm);
        text-align: left;
        cursor: pointer;
      }
      .menu-item:hover {
        background: var(--control-hover);
      }
      .menu-item svg {
        flex: none;
        color: var(--fg-2);
      }
      .menu-item.danger,
      .menu-item.danger svg {
        color: var(--danger-fg);
      }
      .menu-label {
        padding: 6px 8px 2px;
        font: var(--type-overline);
        letter-spacing: var(--tracking-caps);
        text-transform: uppercase;
        color: var(--fg-3);
      }
      .menu-rule {
        height: 1px;
        margin: 4px;
        background: var(--border-subtle);
      }
      .toast {
        position: absolute;
        bottom: 18px;
        left: 50%;
        z-index: 400;
        max-width: min(520px, calc(100% - 24px));
        padding: 10px 14px;
        border-radius: var(--radius-lg);
        background: var(--primary);
        color: var(--primary-fg);
        font: var(--type-body-sm);
        box-shadow: var(--shadow-3);
        transform: translateX(-50%);
        animation: rise var(--duration-base) var(--ease-out);
      }

      /* ---------- The design page around the mock ---------- */
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg-1);
        font: var(--type-body);
      }
      .bar {
        position: sticky;
        top: 0;
        z-index: 10;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px 18px;
        padding: 10px 16px;
        background: #181817;
        color: #e6e6e2;
      }
      .bar-title {
        font-weight: 600;
      }
      .bar-tag {
        padding: 1px 6px;
        border-radius: 4px;
        background: var(--ember-500);
        color: #fff;
        font: var(--type-overline);
      }
      .control {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
      }
      .control-label {
        font: var(--type-overline);
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: #b1b1ab;
      }
      .segments {
        display: flex;
        flex-wrap: wrap;
        overflow: hidden;
        border: 1px solid #50504c;
        border-radius: 6px;
      }
      .segments button {
        padding: 4px 10px;
        border: 0;
        background: none;
        font: var(--type-caption);
        color: #d1d1cc;
        cursor: pointer;
      }
      .segments button + button {
        border-left: 1px solid #50504c;
      }
      .segments button[aria-pressed="true"] {
        background: #f4f4f2;
        color: #181817;
      }
      .bar-break {
        flex-basis: 100%;
        height: 0;
      }
      .stage {
        display: grid;
        gap: 14px;
        padding: 16px 24px 40px;
      }
      .scenario-note {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 6px 12px;
        max-width: 130ch;
        margin: 0;
        font: var(--type-body-sm);
        color: var(--fg-2);
      }
      .scenario-note strong {
        color: var(--fg-1);
      }
      .frame-row {
        display: flex;
        justify-content: center;
        overflow-x: auto;
      }
      .frame {
        position: relative;
        flex: none;
        height: max(680px, calc(100vh - 220px));
        overflow: hidden;
        border: 1px solid var(--border-strong);
        border-radius: 10px;
        background: var(--bg);
        box-shadow: var(--shadow-2);
      }
      .frame.w-wide {
        flex: 1 1 auto;
        width: 100%;
      }
      .frame.w-900 {
        width: 900px;
      }
      .frame.w-390 {
        width: 390px;
        height: max(700px, min(844px, calc(100vh - 220px)));
      }
      .reference {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(330px, 1fr));
        gap: 18px 28px;
        max-width: 1400px;
        font: var(--type-body-sm);
        color: var(--fg-2);
      }
      .reference h2 {
        margin: 0 0 8px;
        font: var(--type-card-title);
        color: var(--fg-1);
      }
      .reference p,
      .reference ul,
      .reference table {
        margin: 0 0 8px;
      }
      .reference ul {
        padding-left: 18px;
      }
      .reference li + li {
        margin-top: 4px;
      }
      .reference table {
        width: 100%;
        border-collapse: collapse;
      }
      .reference th,
      .reference td {
        padding: 5px 8px 5px 0;
        border-bottom: 1px solid var(--border);
        text-align: left;
        vertical-align: top;
      }
      .reference th {
        font: var(--type-overline);
        letter-spacing: var(--tracking-caps);
        text-transform: uppercase;
        color: var(--fg-3);
      }

      /* ---------- The app: Shell A3 · Desk ---------- */
      .app {
        position: absolute;
        inset: 0;
        display: grid;
        grid-template-columns: 56px minmax(0, 1fr);
        grid-template-rows: 56px 48px minmax(0, 1fr);
        color: var(--fg-1);
        font: var(--type-body);
      }
      .app.w-phone {
        grid-template-columns: minmax(0, 1fr);
      }
      .rail {
        grid-row: 1 / -1;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        padding: 12px 0;
        border-right: 1px solid var(--border);
        background: var(--surface);
      }
      .app.w-phone .rail {
        display: none;
      }
      .rail-mark {
        display: grid;
        place-items: center;
        width: 28px;
        height: 28px;
        margin-bottom: 12px;
        border-radius: 7px;
        background: var(--ember-500);
        color: var(--white);
        font: 700 12px/1 var(--font-sans);
      }
      .rail-item {
        position: relative;
        display: grid;
        place-items: center;
        width: 40px;
        height: 40px;
        border-radius: var(--radius-lg);
        color: var(--fg-2);
      }
      .rail-item.on {
        background: var(--surface-selected);
        color: var(--accent-subtle-fg);
      }
      .rail-item.on::before {
        content: "";
        position: absolute;
        left: -8px;
        width: 3px;
        height: 16px;
        border-radius: 0 2px 2px 0;
        background: var(--accent);
      }
      .top {
        display: flex;
        align-items: center;
        gap: 12px;
        min-width: 0;
        padding: 0 20px;
        border-bottom: 1px solid var(--border);
        background: var(--bg);
      }
      .app.w-phone .top {
        gap: 8px;
        padding: 0 12px;
      }
      .top h1 {
        min-width: 0;
        margin: 0;
        overflow: hidden;
        font: var(--type-section-title);
        letter-spacing: var(--tracking-tight);
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      .crumb {
        flex: none;
        font: var(--type-body-sm);
        color: var(--fg-3);
        white-space: nowrap;
      }
      .app.w-phone .crumb {
        display: none;
      }
      .grow {
        flex: 1;
        min-width: 0;
      }
      .chat-button {
        display: inline-flex;
        flex: none;
        align-items: center;
        gap: 6px;
        height: var(--control-md);
        padding: 0 10px;
        border: 1px solid var(--border-strong);
        border-radius: var(--radius-control);
        background: var(--surface);
        font: 500 var(--text-sm) / 1 var(--font-sans);
      }
      .chat-button.open {
        background: var(--control-press);
      }
      .strip {
        display: flex;
        align-items: center;
        gap: 24px;
        min-width: 0;
        padding: 0 20px;
        overflow: hidden;
        border-bottom: 1px solid var(--border);
        background: var(--surface);
        font: var(--type-body-sm);
        color: var(--fg-2);
        white-space: nowrap;
      }
      .app.w-phone .strip {
        gap: 14px;
        padding: 0 12px;
      }
      .strip b {
        font: 600 15px/1 var(--font-sans);
        color: var(--fg-1);
      }
      .main {
        position: relative;
        min-width: 0;
        min-height: 0;
        overflow: hidden;
        container: page / inline-size;
      }
      .app.pushed .main {
        margin-right: 420px;
      }
      .page-scroll {
        position: absolute;
        inset: 0;
        overflow-x: hidden;
        overflow-y: auto;
        padding: 20px 24px 40px;
      }
      .card {
        display: flex;
        flex-direction: column;
        gap: 10px;
        min-width: 0;
        padding: var(--pad-card);
        border: 1px solid var(--border);
        border-radius: var(--radius-card);
        background: var(--surface);
        box-shadow: var(--shadow-1);
      }
      .card-head {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px 10px;
        min-width: 0;
      }
      .card-title {
        display: flex;
        flex: 1 1 auto;
        align-items: center;
        gap: 8px;
        min-width: 0;
        margin: 0;
        font: var(--type-card-title);
        overflow-wrap: anywhere;
      }
      .card-title svg {
        flex: none;
        color: var(--fg-2);
      }
      .card p {
        margin: 0;
      }
      .note {
        font: var(--type-caption);
        color: var(--fg-3);
      }
      .ghost-line {
        display: block;
        height: 9px;
        border-radius: var(--radius-sm);
        background: var(--border);
      }
      .project-mark {
        display: inline-grid;
        flex: none;
        place-items: center;
        width: 18px;
        height: 18px;
        border-radius: 5px;
        background: var(--mark);
        color: var(--white);
        font: 700 10px/1 var(--font-sans);
      }
      .project-chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font: var(--type-label);
        white-space: nowrap;
      }

      /* ---------- Settings and a Project page: their sections beside the open one (shell/section-layout.css) ---------- */
      .section-layout {
        display: grid;
        grid-template-columns: 200px minmax(0, 1fr);
        gap: 24px;
        align-items: start;
      }
      .section-menu {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .section-menu span {
        display: flex;
        align-items: center;
        gap: 10px;
        height: 36px;
        padding: 0 10px;
        border-radius: 8px;
        font: var(--type-label);
        color: var(--fg-2);
        white-space: nowrap;
      }
      .section-menu span.active {
        background: var(--surface-selected);
        color: var(--fg-1);
      }
      .section-body {
        display: flex;
        flex-direction: column;
        gap: 16px;
        min-width: 0;
        max-width: 1100px;
      }
      @container page (max-width: 924px) {
        .section-layout {
          grid-template-columns: minmax(0, 1fr);
          gap: 14px;
        }
        .section-menu {
          flex-direction: row;
          overflow-x: auto;
        }
      }
      .settings-split {
        display: grid;
        grid-template-columns: 300px minmax(0, 1fr);
        gap: 16px;
        align-items: start;
      }
      .library-lists,
      .library-detail {
        display: flex;
        flex-direction: column;
        gap: 16px;
        min-width: 0;
      }
      .back-to-lists {
        display: none;
        align-self: flex-start;
      }
      /* Proposed: under 1224px the lists or the open Pipeline, not one under the other. */
      @container page (max-width: 1224px) {
        .settings-split {
          grid-template-columns: minmax(0, 1fr);
        }
        .settings-split.showing-detail .library-lists,
        .settings-split:not(.showing-detail) .library-detail {
          display: none;
        }
        .back-to-lists {
          display: inline-flex;
        }
      }
      @container page (max-width: 600px) {
        .page-scroll {
          padding: 14px 12px 40px;
        }
      }

      /* ---------- PickList (packages/ui/src/pick-list.css) ---------- */
      .pick-list-card {
        display: flex;
        flex-direction: column;
        min-width: 0;
        border: 1px solid var(--border);
        border-radius: var(--radius-card);
        background: var(--surface);
      }
      .pick-list-head {
        display: flex;
        align-items: center;
        gap: 8px;
        min-height: 44px;
        padding: 6px 8px 6px 12px;
        border-bottom: 1px solid var(--border);
      }
      .pick-list-title {
        display: flex;
        flex: 1;
        align-items: center;
        gap: 7px;
        min-width: 0;
        margin: 0;
        font: var(--type-card-title);
      }
      .pick-list-title > .name {
        min-width: 0;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      .pick-list-count {
        font: var(--type-caption);
        font-variant-numeric: tabular-nums;
        color: var(--fg-3);
      }
      .pick-list-rows {
        margin: 0;
        padding: 0;
        list-style: none;
      }
      .pick-list-rows li + li {
        border-top: 1px solid var(--border-subtle);
      }
      .pick-list-item {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        min-width: 0;
        padding: var(--pad-row);
        border: 0;
        background: transparent;
        color: var(--fg-1);
        text-align: left;
        cursor: pointer;
      }
      .pick-list-item:hover {
        background: var(--surface-hover);
      }
      .pick-list-item.picked {
        background: var(--surface-selected);
        box-shadow: inset 2px 0 0 var(--accent);
      }
      .pick-list-rows li:last-child .pick-list-item {
        border-radius: 0 0 9px 9px;
      }
      .pick-list-words {
        display: flex;
        flex: 1;
        flex-direction: column;
        gap: 2px;
        min-width: 0;
      }
      .pick-list-name {
        font: var(--type-label);
        overflow-wrap: anywhere;
      }
      .pick-list-line {
        overflow: hidden;
        font: var(--type-caption);
        color: var(--fg-3);
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      .pick-list-line.why {
        color: var(--danger-fg);
        white-space: normal;
      }
      .pick-list-aside {
        display: inline-flex;
        flex: none;
        align-items: center;
        gap: 6px;
      }
      .pick-list-empty {
        margin: 0;
        padding: 12px 14px;
        font: var(--type-body-sm);
        color: var(--fg-3);
      }
      .pick-list-foot {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 6px;
        padding: 8px 12px;
        border-top: 1px solid var(--border-subtle);
      }

      /* ---------- The open Pipeline ---------- */
      .detail-facts {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 4px 8px;
        font: var(--type-caption);
        color: var(--fg-2);
      }
      .detail-facts .sep {
        color: var(--fg-3);
      }
      .form-grid {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        gap: 12px 14px;
      }
      .form-grid .wide {
        grid-column: 1 / -1;
      }
      @container page (max-width: 600px) {
        .form-grid {
          grid-template-columns: minmax(0, 1fr);
        }
      }
      .save-bar {
        position: sticky;
        bottom: -40px;
        z-index: 5;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        margin: 0 -2px;
        padding: 10px 2px 2px;
        background: linear-gradient(to bottom, transparent, var(--bg) 14px);
      }
      .save-state {
        flex: 1 1 140px;
        font: var(--type-caption);
        color: var(--fg-3);
      }
      .save-state.dirty {
        color: var(--fg-1);
        font-weight: 500;
      }

      /* ---------- Proposed: what the Project gets, the built Stages with each Stage change ---------- */
      .gets {
        container: gets / inline-size;
        display: flex;
        flex-direction: column;
        gap: 10px;
        min-width: 0;
      }
      .gets-head {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 4px 12px;
      }
      .gets-head h3 {
        margin: 0;
        font: var(--type-card-title);
      }
      .gets-sum {
        font: var(--type-caption);
        color: var(--fg-2);
      }
      .legend {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 14px;
        margin-left: auto;
        font: var(--type-caption);
        color: var(--fg-3);
      }
      .legend span {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .legend i {
        width: 3px;
        height: 12px;
        border-radius: 2px;
        background: var(--edge);
      }
      .legend i.plain {
        width: 9px;
        height: 9px;
        border: 1px solid var(--border-strong);
        border-radius: 2px;
        background: none;
      }
      .stage-list {
        margin: 0;
        padding: 0;
        list-style: none;
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        background: var(--surface);
      }
      .stage-row {
        --edge: transparent;
        position: relative;
        box-shadow: inset 3px 0 0 var(--edge);
      }
      /* Insert points sit between the rows, so the first and last rows are found past them. */
      .stage-row ~ .stage-row {
        border-top: 1px solid var(--border-subtle);
      }
      .stage-list > .stage-row:first-child,
      .stage-list > .insert-point:first-child + .stage-row {
        border-radius: 7px 7px 0 0;
      }
      .stage-list > .stage-row:last-child,
      .stage-list > .stage-row:has(+ .insert-point:last-child) {
        border-bottom-left-radius: 7px;
        border-bottom-right-radius: 7px;
      }
      .stage-row.inserted {
        --edge: var(--success);
      }
      .stage-row.replaced {
        --edge: var(--info);
      }
      .stage-row.changed {
        --edge: var(--warning);
      }
      .stage-row.removed {
        --edge: var(--border-strong);
        background: var(--surface-sunken);
      }
      .stage-row.flagged {
        --edge: var(--danger);
      }
      .stage-row.open {
        background: var(--surface-sunken);
      }
      .stage-row.fresh {
        animation: flash 1.2s var(--ease-out);
      }
      .stage-line {
        display: grid;
        grid-template-columns: 22px 28px minmax(0, 1fr) auto auto;
        align-items: center;
        gap: 10px;
        min-height: 56px;
        padding: 8px 8px 8px 14px;
      }
      .stage-number {
        font: 500 var(--text-xs) / 1 var(--font-mono);
        font-variant-numeric: tabular-nums;
        color: var(--fg-3);
        text-align: right;
      }
      .stage-kind {
        display: grid;
        place-items: center;
        width: 26px;
        height: 26px;
        border: 1px solid var(--border-strong);
        border-radius: 50%;
        background: var(--surface);
        color: var(--fg-2);
      }
      .stage-words {
        display: flex;
        flex-direction: column;
        gap: 2px;
        min-width: 0;
      }
      .stage-name {
        font: 500 var(--text-sm) / 1.35 var(--font-sans);
        overflow-wrap: anywhere;
      }
      .stage-name .who {
        font-weight: 400;
        color: var(--fg-3);
      }
      .stage-detail {
        font: var(--type-caption);
        color: var(--fg-2);
        overflow-wrap: anywhere;
      }
      .stage-row.removed .stage-name,
      .stage-row.removed .stage-detail {
        color: var(--fg-3);
        text-decoration: line-through;
        text-decoration-color: var(--fg-3);
      }
      .stage-row.removed .stage-kind {
        border-style: dashed;
        color: var(--fg-3);
      }
      .origin {
        display: inline-flex;
        justify-self: end;
        align-items: center;
        gap: 6px;
        min-width: 0;
        font: var(--type-caption);
        color: var(--fg-3);
        white-space: nowrap;
      }
      .origin .badge {
        max-width: 100%;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .stage-tools {
        display: inline-flex;
        align-items: center;
        gap: 2px;
      }
      .undo {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        height: var(--control-sm);
        padding: 0 8px;
        border: 0;
        border-radius: var(--radius-md);
        background: none;
        color: var(--fg-2);
        font: 500 var(--text-xs) / 1 var(--font-sans);
        cursor: pointer;
      }
      .undo:hover {
        background: var(--control-hover);
        color: var(--fg-1);
      }
      .stage-more {
        display: grid;
        gap: 10px;
        padding: 0 14px 14px 74px;
      }
      .row-problem {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px 10px;
        padding: 0 14px 12px 74px;
        font: var(--type-body-sm);
        color: var(--danger-fg);
      }
      .row-problem svg {
        flex: none;
      }
      .row-problem .fix {
        display: inline-flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px;
        color: var(--fg-2);
      }
      .row-problem .select {
        width: auto;
        min-width: 150px;
      }
      /* Where one Stage change sits between two Stages: an insert point shown on hover and focus. */
      .insert-point {
        position: relative;
        height: 0;
      }
      .insert-point button {
        position: absolute;
        top: -11px;
        left: 50%;
        z-index: 3;
        display: inline-flex;
        align-items: center;
        gap: 4px;
        height: 22px;
        padding: 0 8px 0 6px;
        border: 1px solid var(--border-strong);
        border-radius: var(--radius-full);
        background: var(--surface);
        color: var(--fg-2);
        font: 500 var(--text-2xs) / 1 var(--font-sans);
        opacity: 0;
        transform: translateX(-50%);
        cursor: pointer;
        transition: opacity var(--duration-fast);
      }
      .stage-list:hover .insert-point button,
      .insert-point button:focus-visible,
      .insert-point button[aria-expanded="true"] {
        opacity: 1;
      }
      .insert-point .menu {
        top: 14px;
        right: auto;
        left: 50%;
        transform: translateX(-50%);
      }
      .compare {
        display: grid;
        grid-template-columns: 110px minmax(0, 1fr) minmax(0, 1fr) auto;
        gap: 0;
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        background: var(--surface);
        font: var(--type-body-sm);
      }
      .compare > div {
        min-width: 0;
        padding: 7px 10px;
        border-top: 1px solid var(--border-subtle);
        overflow-wrap: anywhere;
      }
      .compare > .head {
        border-top: 0;
        font: var(--type-overline);
        letter-spacing: var(--tracking-caps);
        text-transform: uppercase;
        color: var(--fg-3);
      }
      .compare .label {
        font: var(--type-label);
      }
      .compare .was {
        color: var(--fg-3);
      }
      .compare .now {
        background: color-mix(in oklab, var(--warning-subtle) 70%, transparent);
      }
      .compare .set-back {
        display: flex;
        align-items: flex-start;
        justify-content: flex-end;
      }
      .replaced-by {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        gap: 8px;
      }
      .replaced-by > div {
        display: grid;
        gap: 3px;
        min-width: 0;
        padding: 8px 10px;
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        background: var(--surface);
        font: var(--type-body-sm);
      }
      .replaced-by > div:first-child {
        color: var(--fg-3);
      }
      .stage-form {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        gap: 12px 14px;
        padding: 14px;
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        background: var(--surface);
      }
      .stage-form .wide {
        grid-column: 1 / -1;
      }
      .from-base {
        display: flex;
        flex-wrap: wrap;
        gap: 2px 8px;
        font: var(--type-caption);
        color: var(--warning-fg);
      }
      .from-base span {
        min-width: 0;
        color: var(--fg-3);
        overflow-wrap: anywhere;
      }
      .on-failure {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px 8px;
        font: var(--type-body-sm);
        color: var(--fg-2);
      }
      .on-failure .select {
        width: auto;
      }
      .not-apply {
        display: flex;
        flex-direction: column;
        border: 1px solid var(--danger-border);
        border-radius: var(--radius-lg);
        background: var(--surface);
      }
      .not-apply-head {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 9px 14px;
        border-bottom: 1px solid var(--danger-border);
        background: var(--danger-subtle);
        border-radius: 7px 7px 0 0;
        font: 600 var(--text-sm) / 1.3 var(--font-sans);
        color: var(--danger-fg);
      }
      .not-apply-item {
        display: grid;
        gap: 8px;
        padding: 12px 14px;
      }
      .not-apply-item + .not-apply-item {
        border-top: 1px solid var(--border-subtle);
      }
      .not-apply-item .what {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px 8px;
        font: var(--type-label);
      }
      .not-apply-item .why {
        font: var(--type-body-sm);
        color: var(--danger-fg);
      }
      .not-apply-item .fix {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        font: var(--type-body-sm);
        color: var(--fg-2);
      }
      .not-apply-item .select {
        width: auto;
        min-width: 160px;
      }
      .fixed-note {
        padding: 10px 14px;
        font: var(--type-body-sm);
        color: var(--success-fg);
      }
      .rules {
        display: flex;
        gap: 8px;
        margin: 0;
        font: var(--type-caption);
        color: var(--fg-3);
      }
      .rules svg {
        flex: none;
        margin-top: 1px;
      }
      @container gets (max-width: 620px) {
        .stage-line {
          grid-template-columns: 28px minmax(0, 1fr) auto;
          grid-template-areas:
            "kind words tools"
            "kind origin origin";
          gap: 4px 10px;
          padding: 10px 6px 10px 12px;
        }
        .stage-number {
          display: none;
        }
        .stage-kind {
          grid-area: kind;
          align-self: start;
        }
        .stage-words {
          grid-area: words;
        }
        .stage-tools {
          grid-area: tools;
          align-self: start;
        }
        .origin {
          grid-area: origin;
          justify-self: start;
          white-space: normal;
        }
        .stage-more,
        .row-problem {
          padding-left: 12px;
          padding-right: 12px;
        }
        .compare {
          grid-template-columns: minmax(0, 1fr);
        }
        .compare > .head {
          display: none;
        }
        .compare > .head + .label {
          border-top: 0;
        }
        .compare .label {
          padding-bottom: 2px;
        }
        .compare .was,
        .compare .now,
        .compare .set-back {
          border-top: 0;
        }
        .compare .now {
          margin: 0 8px;
          border-radius: var(--radius-sm);
        }
        .compare .set-back {
          justify-content: flex-start;
          padding: 2px 4px 6px;
        }
        .compare .set-back:empty {
          display: none;
        }
        .compare .was::before,
        .compare .now::before {
          content: attr(data-who);
          display: block;
          font: var(--type-overline);
          letter-spacing: var(--tracking-caps);
          text-transform: uppercase;
          color: var(--fg-3);
        }
        .replaced-by,
        .stage-form {
          grid-template-columns: minmax(0, 1fr);
        }
        .legend {
          margin-left: 0;
        }
        .insert-point button {
          opacity: 1;
        }
      }

      /* ---------- Windows (packages/ui Dialog) ---------- */
      .window-backdrop {
        position: absolute;
        inset: 0;
        z-index: 200;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 0 12px;
        background: var(--overlay);
      }
      .window-backdrop::before {
        content: "";
        flex: none;
        height: max(24px, 7%);
      }
      .window {
        display: flex;
        flex-direction: column;
        width: min(720px, 94%);
        max-height: calc(100% - max(24px, 7%) - 24px);
        min-height: 0;
        overflow: hidden;
        border-radius: var(--radius-xl);
        background: var(--surface-raised);
        box-shadow: var(--shadow-3);
      }
      .window.small {
        width: min(440px, 94%);
      }
      .window.keeps-height {
        height: min(640px, calc(100% - max(24px, 7%) - 24px));
      }
      .window-head {
        display: flex;
        flex: none;
        align-items: center;
        gap: 10px;
        min-width: 0;
        padding: 12px 12px 12px 20px;
        border-bottom: 1px solid var(--border);
      }
      .window-head h2 {
        flex: 1;
        min-width: 0;
        margin: 0;
        font: var(--type-section-title);
        overflow-wrap: anywhere;
      }
      .window-body {
        display: flex;
        flex: 1;
        flex-direction: column;
        gap: 14px;
        min-height: 0;
        padding: 16px 20px 20px;
        overflow-y: auto;
      }
      .window-body p {
        margin: 0;
        font: var(--type-body-sm);
        color: var(--fg-2);
      }
      .window-bar {
        display: flex;
        flex: none;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        padding: 10px 16px 10px 20px;
        border-top: 1px solid var(--border);
      }
      .window-bar .grow {
        font: var(--type-caption);
        color: var(--fg-3);
      }
      .app.w-phone .window-backdrop {
        padding: 0 8px;
      }
      .app.w-phone .window {
        width: 100%;
      }
      .base-choices {
        display: grid;
        gap: 6px;
        margin: 0;
        padding: 0;
        list-style: none;
      }
      .base-choice {
        display: grid;
        grid-template-columns: 18px minmax(0, 1fr);
        gap: 2px 10px;
        width: 100%;
        padding: 10px 12px;
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        background: var(--surface);
        text-align: left;
        cursor: pointer;
      }
      .base-choice:hover {
        background: var(--surface-hover);
      }
      .base-choice[aria-checked="true"] {
        border-color: var(--accent);
        background: var(--surface-selected);
      }
      .radio {
        width: 16px;
        height: 16px;
        margin-top: 1px;
        border: 1px solid var(--border-strong);
        border-radius: 50%;
        background: var(--surface);
      }
      .base-choice[aria-checked="true"] .radio {
        border: 5px solid var(--accent);
      }
      .base-choice b {
        font: var(--type-label);
      }
      .base-choice span:last-child {
        grid-column: 2;
        font: var(--type-caption);
        color: var(--fg-3);
        overflow-wrap: anywhere;
      }
      .breaks {
        display: grid;
        gap: 10px;
        margin: 0;
        padding: 0;
        list-style: none;
      }
      .breaks-project {
        display: grid;
        gap: 6px;
      }
      .break-item {
        display: grid;
        gap: 4px;
        padding: 10px 12px;
        border: 1px solid var(--border);
        border-left: 3px solid var(--danger);
        border-radius: var(--radius-md);
        background: var(--surface);
      }
      .break-item .what {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 4px 8px;
        font: var(--type-label);
      }
      .break-item ul {
        margin: 0;
        padding-left: 16px;
        font: var(--type-body-sm);
        color: var(--fg-2);
      }
      .break-item .tasks {
        font: var(--type-caption);
        color: var(--warning-fg);
      }

      /* ---------- Proposed: the Pipeline picker, grouped (packages/ui Select with groups) ---------- */
      .picker-trigger {
        display: flex;
        align-items: center;
        gap: 8px;
        width: 100%;
        min-height: var(--control-md);
        padding: 4px 10px;
        border: 1px solid var(--border-strong);
        border-radius: var(--radius-control);
        background: var(--surface);
        font: var(--type-body-sm);
        text-align: left;
        cursor: pointer;
      }
      .picker-trigger[aria-expanded="true"] {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px color-mix(in oklab, var(--ember-500) 20%, transparent);
      }
      .picker-trigger .grow {
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      .picker-trigger .placeholder {
        color: var(--fg-3);
      }
      .listbox {
        display: flex;
        flex-direction: column;
        margin-top: 4px;
        padding: 4px;
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        background: var(--surface-raised);
        box-shadow: var(--shadow-3);
      }
      .listbox-group {
        padding: 8px 8px 4px;
        font: var(--type-overline);
        letter-spacing: var(--tracking-caps);
        text-transform: uppercase;
        color: var(--fg-3);
      }
      .listbox-group:not(:first-child) {
        margin-top: 4px;
        border-top: 1px solid var(--border-subtle);
        padding-top: 10px;
      }
      .option {
        display: grid;
        grid-template-columns: 16px minmax(0, 1fr) auto;
        gap: 1px 8px;
        width: 100%;
        padding: 7px 8px;
        border: 0;
        border-radius: var(--radius-md);
        background: none;
        color: var(--fg-1);
        text-align: left;
        cursor: pointer;
      }
      .option:hover:not([aria-disabled="true"]) {
        background: var(--control-hover);
      }
      .option[aria-selected="true"] {
        background: var(--surface-selected);
      }
      .option .tick {
        grid-row: 1 / span 2;
        margin-top: 2px;
        color: var(--accent);
      }
      .option b {
        min-width: 0;
        font: var(--type-label);
        overflow-wrap: anywhere;
      }
      .option .aside {
        display: inline-flex;
        gap: 4px;
      }
      .option .line {
        grid-column: 2 / -1;
        font: var(--type-caption);
        color: var(--fg-3);
        overflow-wrap: anywhere;
      }
      .option[aria-disabled="true"] {
        cursor: not-allowed;
      }
      .option[aria-disabled="true"] b {
        color: var(--fg-3);
      }
      .option .line.why {
        color: var(--danger-fg);
      }
      .chosen-stages {
        font: var(--type-caption);
        color: var(--fg-2);
      }

      /* ---------- A Task page and a Project page, behind ---------- */
      .record-head {
        display: grid;
        gap: 6px;
        margin-bottom: 14px;
      }
      .record-head h2 {
        margin: 0;
        font: 600 20px/1.25 var(--font-sans);
        letter-spacing: var(--tracking-tight);
      }
      .record-facts {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px 12px;
        font: var(--type-caption);
        color: var(--fg-2);
      }
      .rail-none {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px;
        padding: 14px 16px;
        border: 1px dashed var(--border-strong);
        border-radius: var(--radius-card);
        background: var(--surface);
        font: var(--type-body-sm);
        color: var(--fg-2);
      }
      .rail-none .slot {
        width: 84px;
        height: 26px;
        border: 1px dashed var(--border-strong);
        border-radius: var(--radius-full);
      }
      .ghost-card {
        display: grid;
        gap: 8px;
        margin-top: 14px;
      }
      .project-row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px 10px;
        font: var(--type-body-sm);
      }
      .project-row-label {
        flex: 1;
        color: var(--fg-2);
      }
      .record-head h2 {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
        overflow-wrap: anywhere;
      }
      .record-head h2 .project-mark {
        width: 28px;
        height: 28px;
        border-radius: 8px;
        font-size: 14px;
      }
      .default-card {
        display: grid;
        gap: 10px;
      }
      .pick-list-line.built-on-line {
        color: var(--fg-2);
      }

      /* ---------- Proposed: an office-wide Pipeline's "Built on by", each a link to its Project page ---------- */
      .built-on {
        display: grid;
        gap: 12px;
        margin: 0;
        padding: 0;
        list-style: none;
      }
      .built-on-project {
        display: grid;
        gap: 4px;
      }
      .built-on-project > .project-chip {
        color: var(--fg-2);
      }
      .built-on-rows {
        margin: 0;
        padding: 0;
        list-style: none;
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
      }
      .built-on-rows li + li {
        border-top: 1px solid var(--border-subtle);
      }
      .built-on-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto 12px;
        align-items: center;
        gap: 2px 10px;
        width: 100%;
        padding: 8px 12px;
        border: 0;
        border-radius: inherit;
        background: transparent;
        color: var(--fg-1);
        text-align: left;
        cursor: pointer;
      }
      .built-on-row:hover {
        background: var(--surface-hover);
      }
      .built-on-row b {
        font: var(--type-label);
        overflow-wrap: anywhere;
      }
      .built-on-row .line {
        grid-column: 1;
        font: var(--type-caption);
        color: var(--fg-3);
      }
      .built-on-row .line.why {
        color: var(--danger-fg);
      }
      .built-on-row .aside {
        display: inline-flex;
        grid-row: 1 / span 2;
        grid-column: 2;
        gap: 4px;
      }
      .built-on-row > svg {
        grid-row: 1 / span 2;
        grid-column: 3;
        color: var(--fg-3);
      }
      .break-item .open-it {
        justify-self: start;
      }

      /* ---------- The chat drawer and a Thread in Rows (docs/design/chat-drawer.html, thread-dialog.html) ---------- */
      .chat-drawer {
        position: absolute;
        top: 104px;
        right: 0;
        bottom: 0;
        z-index: 30;
        display: flex;
        flex-direction: column;
        width: 420px;
        min-width: 0;
        border-left: 1px solid var(--border);
        background: var(--surface);
      }
      .chat-drawer.over {
        box-shadow: var(--shadow-3);
      }
      .chat-drawer.fill {
        top: 0;
        left: 0;
        width: auto;
        border-left: 0;
      }
      .drawer-head {
        display: flex;
        flex: none;
        align-items: center;
        gap: 10px;
        min-width: 0;
        padding: 10px 10px 10px 16px;
        border-bottom: 1px solid var(--border);
      }
      .drawer-head-main {
        display: grid;
        flex: 1;
        gap: 1px;
        min-width: 0;
      }
      .drawer-title {
        font: var(--type-card-title);
      }
      .drawer-sub {
        font: var(--type-caption);
        color: var(--fg-2);
      }
      .thread-row {
        display: flex;
        flex: none;
        align-items: center;
        gap: 8px;
        min-width: 0;
        padding: 6px 12px 6px 8px;
        border-bottom: 1px solid var(--border);
      }
      .thread-row-title {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        font: 500 var(--text-sm) / 1.3 var(--font-sans);
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      .thread {
        flex: 1;
        min-height: 0;
        overflow-x: hidden;
        overflow-y: auto;
      }
      .thread-column {
        display: flex;
        flex-direction: column;
        gap: 18px;
        padding: 16px 14px 20px;
      }
      .turn {
        display: grid;
        grid-template-columns: 32px minmax(0, 1fr);
        min-width: 0;
      }
      .turn-by {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 2px 6px;
        margin-bottom: 2px;
        font: var(--type-caption);
        color: var(--fg-2);
      }
      .turn-by b {
        font: 600 var(--text-sm) / 1.4 var(--font-sans);
        color: var(--fg-1);
      }
      .said {
        display: grid;
        gap: 8px;
        min-width: 0;
        font: var(--type-body);
        line-height: 1.6;
        overflow-wrap: anywhere;
      }
      .said p {
        margin: 0;
      }
      .said code {
        padding: 1px 4px;
        border-radius: var(--radius-sm);
        background: var(--neutral-subtle);
      }
      .composer {
        flex: none;
        padding: 10px 12px 12px;
        border-top: 1px solid var(--border);
      }
      .composer-field {
        width: 100%;
        min-height: 44px;
        padding: 8px 10px;
        border: 1px solid var(--border-strong);
        border-radius: var(--radius-lg);
        background: var(--surface);
        font: var(--type-body-sm);
        resize: none;
      }
      .proposal-card {
        container: gets / inline-size;
        min-width: 0;
        overflow: hidden;
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        background: var(--surface);
        font: var(--type-body-sm);
        line-height: 1.45;
      }
      .proposal-head {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px 8px;
        padding: 10px 12px;
        border-bottom: 1px solid var(--border-subtle);
      }
      .proposal-title {
        min-width: 0;
        font-weight: 600;
        overflow-wrap: anywhere;
      }
      .proposal-changes {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin: 0;
        padding: 10px 12px;
        list-style: none;
      }
      .proposal-changes li {
        display: grid;
        grid-template-columns: 112px minmax(0, 1fr);
        gap: 2px 10px;
        min-width: 0;
      }
      .proposal-change-label {
        padding-top: 2px;
        font: var(--type-overline);
        letter-spacing: var(--tracking-caps);
        text-transform: uppercase;
        color: var(--fg-3);
      }
      .proposal-values {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 2px 6px;
        min-width: 0;
        overflow-wrap: anywhere;
      }
      .proposal-change-from {
        color: var(--fg-3);
        text-decoration: line-through;
      }
      .proposal-change-to {
        font-weight: 600;
      }
      .proposal-values svg {
        flex: none;
        align-self: center;
        color: var(--fg-3);
      }
      .proposal-section {
        display: grid;
        gap: 8px;
        padding: 10px 12px;
        border-top: 1px solid var(--border-subtle);
      }
      .proposal-section .gets {
        gap: 8px;
      }
      .proposal-foot {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        padding: 10px 12px;
        border-top: 1px solid var(--border-subtle);
      }
      .proposal-note {
        font: var(--type-caption);
        color: var(--fg-3);
      }
      .sc-list {
        display: grid;
        gap: 0;
        margin: 0;
        padding: 0;
        list-style: none;
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
      }
      .sc-item {
        --edge: transparent;
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 2px 8px;
        padding: 8px 10px;
        border-top: 1px solid var(--border-subtle);
        box-shadow: inset 3px 0 0 var(--edge);
      }
      .sc-item:first-child {
        border-top: 0;
      }
      .sc-item b {
        font: var(--type-label);
      }
      .sc-item .stage-detail {
        grid-column: 1 / -1;
      }
      .sc-item.inserted {
        --edge: var(--success);
      }
      .sc-item.replaced {
        --edge: var(--info);
      }
      .sc-item.changed {
        --edge: var(--warning);
      }
      .sc-item.removed {
        --edge: var(--border-strong);
      }
      .sc-item.dropped b,
      .sc-item.dropped .stage-detail {
        color: var(--fg-3);
        text-decoration: line-through;
      }
      .flow {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 4px;
        font: var(--type-caption);
        color: var(--fg-2);
      }
      .flow span {
        padding: 1px 6px;
        border-radius: var(--radius-sm);
        background: var(--neutral-subtle);
      }
      .flow span.new {
        background: var(--success-subtle);
        color: var(--success-fg);
        font-weight: 500;
      }
      .flow span.gone {
        color: var(--fg-3);
        text-decoration: line-through;
      }
      .flow svg {
        color: var(--fg-3);
      }
      .chat-drawer {
        container: drawer / inline-size;
      }
      @container drawer (max-width: 400px) {
        .proposal-changes li {
          grid-template-columns: minmax(0, 1fr);
        }
      }
    </style>
  </head>
  <body>
    <div class="bar" id="bar"></div>
    <main class="stage">
      <p class="scenario-note" id="note"></p>
      <div class="frame-row"><div class="frame" id="frame"></div></div>
      <section class="reference" id="reference" aria-label="What the page settles"></section>
    </main>
    <script>
      /* ---------- Icons (the app's Icon set, re-drawn) ---------- */
      const svg = (size, body, extra = "") =>
        `<svg width="${size}" height="${size}" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ${extra}>${body}</svg>`;
      const ICON = {
        x: (s = 16) => svg(s, '<path d="m4 4 8 8M12 4l-8 8"/>'),
        plus: (s = 14) => svg(s, '<path d="M8 3v10M3 8h10"/>'),
        check: (s = 12) => svg(s, '<path d="m3 8.5 3 3 7-7"/>'),
        alert: (s = 16) => svg(s, '<path d="M8 2.2 14.5 13.5h-13z"/><path d="M8 6.5v3M8 11.6v.1"/>'),
        info: (s = 16) => svg(s, '<circle cx="8" cy="8" r="6"/><path d="M8 7.3v3.6M8 5v.1"/>'),
        broken: (s = 16) => svg(s, '<circle cx="8" cy="8" r="6"/><path d="M8 4.8v3.6M8 10.9v.1"/>'),
        route: (s = 15) => svg(s, '<circle cx="4" cy="12" r="1.8"/><circle cx="12" cy="4" r="1.8"/><path d="M5.8 12H10a2 2 0 0 0 0-4H6a2 2 0 0 1 0-4h4.2"/>'),
        user: (s = 13) => svg(s, '<circle cx="8" cy="5.5" r="2.6"/><path d="M3 13.5c.7-2.6 2.6-4 5-4s4.3 1.4 5 4"/>'),
        terminal: (s = 13) => svg(s, '<rect x="1.8" y="2.8" width="12.4" height="10.4" rx="2"/><path d="m4.5 6.5 2 1.8-2 1.8M8.5 10.5h3"/>'),
        hand: (s = 13) => svg(s, '<path d="M5 8V3.8a1 1 0 0 1 2 0V7M7 7V2.8a1 1 0 0 1 2 0V7M9 7V3.6a1 1 0 0 1 2 0V8.5M11 6.2a1 1 0 0 1 2 0V9a5 5 0 0 1-5 5h-.4A4.6 4.6 0 0 1 4 12L2.6 9.6a1 1 0 0 1 1.7-1L5 9.6"/>'),
        pencil: (s = 14) => svg(s, '<path d="m10.5 2.5 3 3-8 8H2.5v-3z"/><path d="m9 4 3 3"/>'),
        more: (s = 14) => svg(s, '<circle cx="3.5" cy="8" r=".6" fill="currentColor"/><circle cx="8" cy="8" r=".6" fill="currentColor"/><circle cx="12.5" cy="8" r=".6" fill="currentColor"/>'),
        undo: (s = 13) => svg(s, '<path d="M5.5 3.5 2.5 6.5l3 3"/><path d="M2.5 6.5H10a3.5 3.5 0 0 1 0 7H7"/>'),
        trash: (s = 14) => svg(s, '<path d="M2.5 4.5h11M6 4.5V3h4v1.5M4 4.5l.7 9h6.6l.7-9"/>'),
        swap: (s = 14) => svg(s, '<path d="M3 5.5h9.5L10 3M13 10.5H3.5L6 13"/>'),
        chevronDown: (s = 12) => svg(s, '<path d="m4 6 4 4 4-4"/>'),
        chevronUp: (s = 12) => svg(s, '<path d="m4 10 4-4 4 4"/>'),
        chevronLeft: (s = 12) => svg(s, '<path d="m10 3-5 5 5 5"/>'),
        arrowRight: (s = 12) => svg(s, '<path d="M3 8h10M9 4l4 4-4 4"/>'),
        arrowUp: (s = 14) => svg(s, '<path d="M8 13V3M4 7l4-4 4 4"/>'),
        arrowDown: (s = 14) => svg(s, '<path d="M8 3v10M4 9l4 4 4-4"/>'),
