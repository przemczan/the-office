      const threadPlace = (t) => {
        const found = stageOfThread(t.id);
        return found ? `${found.taskStage.stage.name}, run ${found.run.number}` : "Planning";
      };
      const gateWaiting = () =>
        view.data.stages.find((ts) => ts.stage.kind === "gate" && ts.state === "waiting-on-you");
      const needsCount = () =>
        openDecisions().length +
        (gateWaiting() ? 1 : 0) +
        (view.data.task.state === "planning" ? 2 : 0);

      /* ===================== Head ===================== */

      function renderHead() {
        const { task, stages } = view.data;
        const used =
          stages.reduce((a, ts) => a + sumTokens(ts.tokens), 0) +
          sumTokens(view.data.threads[0].tokens);
        const [stateWord, tone] = TASK_STATE[task.state];
        const pct = Math.min(100, Math.round((used / task.estimatedTokens) * 100));
        const actions = {
          planning:
            '<button class="btn primary" disabled title="Confirm the Plan and the Definition of Done first">' +
            ICON.play.replace("<svg", '<svg width="12" height="12"') +
            " Start</button>",
          "in-progress":
            '<button class="btn" data-action="toast" data-text="Pausing holds the running Stage at its next safe point.">Pause</button><button class="btn danger" data-action="toast" data-text="Stopping ends the running Stage now.">Stop</button>',
          "waiting-on-you":
            '<button class="btn" data-action="toast" data-text="Pausing holds the Task where it waits.">Pause</button>',
          done: `<a class="btn" href="#" data-action="toast" data-text="Opens pull request ${view.data.published} on GitHub.">Open pull request ${view.data.published}</a>`,
        }[task.state];
        $("head").innerHTML = `
          <div class="head-main">
            <div class="crumbs"><span class="project-mark">${PROJECT.mark}</span>${PROJECT.name}<span>/</span>Tasks</div>
            <div class="title-row">
              <h1>${esc(task.title)}</h1>
              <span class="badge ${tone}">${task.state === "in-progress" ? '<span class="dot live"></span>' : ""}${stateWord}</span>
            </div>
            <div class="meta-row">
              <span class="priority">${ICON.flag} High priority</span><span class="sep">·</span>
              <span>Pipeline <b style="font-weight:500;color:var(--fg-1)">Full</b>${task.state === "planning" ? " (proposed)" : ""}</span><span class="sep">·</span>
              <span class="meter" title="Tokens used of the Planner's estimate"><span class="bar"><i style="width:${pct}%"></i></span><span class="num">${kTokens(used)} of ~${kTokens(task.estimatedTokens)} tokens</span></span><span class="sep">·</span>
              <span>${task.tags.map((t) => `#${t}`).join(" ")}</span>
            </div>
          </div>
          <div class="head-actions">${actions}<button class="btn ghost" aria-label="More actions" data-action="toast" data-text="More: Edit for this Task, Duplicate, Drop Task.">···</button></div>`;

        const n = needsCount();
        const banner = $("needs-banner");
        banner.hidden = n === 0;
        banner.innerHTML = `<span class="count-pill">${n}</span><span class="grow">${n === 1 ? "One thing needs" : `${n} things need`} you on this Task</span><button class="btn xs" data-action="open-drawer">Open</button>`;
      }

      /* ===================== Pipeline rail ===================== */

      /** The node the walk has reached: the live or stopped one, else the last that ran. */
      function currentIndex(stages) {
        const active = stages.findIndex((ts) =>
          ["running", "waiting-on-you", "failed", "paused", "stopped"].includes(ts.state),
        );
        if (active >= 0) return active;
        let last = -1;
        stages.forEach((ts, i) => {
          if (ts.runs.length) last = i;
        });
        return last;
      }

      /** Loop-backs from the run history: each run briefed with a carried failure is one trip back. */
      function loopBacks(stages) {
        const loops = new Map();
        for (const ts of stages)
          for (const r of ts.runs) {
            if (!r.carriedFailure) continue;
            const key = `${r.carriedFailure.stageKey}>${ts.stage.key}`;
            const loop = loops.get(key) || {
              from: r.carriedFailure.stageKey,
              to: ts.stage.key,
              count: 0,
              rounds: r.carriedFailure.rounds,
            };
            loop.count += 1;
            loops.set(key, loop);
          }
        return [...loops.values()];
      }

      /** Room above the track for the loop-back arcs, one level per loop (see layoutRail). */
      function railHeadroom(stages) {
        const loops = loopBacks(stages).length;
        return loops ? `--marker-top: ${26 + loops * 16}px` : "";
      }

      function nodeHtml(ts, index, current) {
        const { stage, state, runs } = ts;
        const who = stageWorker(stage);
        const time = runs.reduce((a, r) => a + runDuration(r), 0);
        const tok = sumTokens(ts.tokens);
        const glyph =
          {
            done: ICON.check,
            failed: ICON.cross,
            "waiting-on-you": ICON.pause,
            skipped: ICON.dash,
          }[state] || "";
        const facts =
          state === "skipped"
            ? "Not needed"
            : runs.length === 0
              ? view.data.task.state === "planning"
                ? "Not started"
                : "Not run yet"
              : [
                  `${runs.length} ${runs.length === 1 ? "run" : "runs"}`,
                  span(time) + (state === "running" ? " so far" : ""),
                  stage.kind === "agent" ? kTokens(tok) : null,
                ]
                  .filter(Boolean)
                  .join(" · ");
        const classes = ["node", state, stage.kind, index > current ? "future" : ""].join(" ");
        return `<button class="${classes}" role="tab" data-stage="${stage.key}" aria-selected="${view.selectedStage === stage.key}" title="${esc(stage.name)}: ${STATE_WORDS[state]}">
          <span class="marker">${glyph}</span>
          <span class="node-body">
            <span class="node-name">${esc(stage.name)}${stage.optional ? '<span class="node-optional"> · optional</span>' : ""}</span>
            <span class="node-who">${who.avatar}${esc(who.label)}</span>
            <span class="node-state">${state === "running" ? '<span class="dot live" style="display:inline-block;margin-right:4px;vertical-align:1px"></span>' : ""}${STATE_WORDS[state]}${ts.wentBack ? ` · went back to ${byKey(ts.wentBack.stageKey).name}` : ""}</span>
            <span class="node-meta">${facts}</span>
            
          </span>
        </button>`;
      }

      function renderRail() {
        const { stages, task } = view.data;
        const current = currentIndex(stages);
        const doneCount = stages.filter(
          (ts) => ts.state === "done" || ts.state === "skipped",
        ).length;
        const at = stages[current];
        const caption =
          task.state === "planning"
            ? "Starts once you confirm the Plan, the Definition of Done and the Pipeline"
            : task.state === "done"
              ? `All ${stages.length} Stages walked`
              : at && at.state !== "done"
                ? `At ${at.stage.name}: ${STATE_WORDS[at.state].toLowerCase()}`
                : `${doneCount} of ${stages.length} Stages walked`;
        $("rail").innerHTML = `
          <div class="rail-top"><span class="overline">Pipeline · Full</span><span class="muted">${caption} · select a Stage for its history</span></div>
          <div class="rail-scroll" id="rail-scroll">
            <div class="rail-inner" id="rail-inner" style="${railHeadroom(stages)}" role="tablist" aria-label="Stages">
              <div class="rail-track" id="rail-track"></div><div class="rail-fill" id="rail-fill"></div>
              <svg class="rail-arcs" id="rail-arcs" aria-hidden="true"></svg>
              ${stages.map((ts, i) => nodeHtml(ts, i, current)).join("")}
            </div>
          </div>`;
        requestAnimationFrame(layoutRail);
      }

      /** Positions the track, its fill and the loop-back arcs from where the nodes landed. */
      function layoutRail() {
        const inner = $("rail-inner");
        if (!inner) return;
        const { stages } = view.data;
        // Shorter loops nest under longer ones: each is one level higher than the loops it spans.
        const indexOf = (key) => stages.findIndex((ts) => ts.stage.key === key);
        const loops = loopBacks(stages)
          .map((loop) => ({ ...loop, span: Math.abs(indexOf(loop.from) - indexOf(loop.to)) }))
          .sort((a, b) => a.span - b.span);
        const box = inner.getBoundingClientRect();
        const centers = {};
        inner.querySelectorAll(".node").forEach((node) => {
          const m = node.querySelector(".marker").getBoundingClientRect();
          centers[node.dataset.stage] = {
            x: m.left - box.left + m.width / 2,
            top: m.top - box.top,
          };
        });
        const keys = stages.map((ts) => ts.stage.key);
        const first = centers[keys[0]].x,
          last = centers[keys[keys.length - 1]].x;
        const track = $("rail-track");
        track.style.left = `${first}px`;
        track.style.width = `${last - first}px`;
        const current = currentIndex(stages);
        const fill = $("rail-fill");
        const reached = current < 0 ? first : centers[keys[current]].x;
        fill.style.left = `${first}px`;
        fill.style.width = `${reached - first}px`;
        fill.classList.toggle("live", stages[current] && stages[current].state === "running");

        const svg = $("rail-arcs");
        inner.querySelectorAll(".arc-label").forEach((l) => l.remove());
        svg.innerHTML =
          '<defs><marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L9 5 0 9z" fill="var(--danger)"/></marker></defs>' +
          loops
            .map((loop, i) => {
              const a = centers[loop.from],
                b = centers[loop.to];
              const y = a.top - 2,
                height = 28 + i * 21;
              const x1 = a.x - 4,
                x2 = b.x + 2 + i * 9;
              const label = document.createElement("button");
              label.className = "arc-label";
              label.type = "button";
              label.dataset.stage = loop.from;
              label.title = `${byKey(loop.from).name} failed and went back to ${byKey(loop.to).name} ${loop.count} ${loop.count === 1 ? "time" : "times"}, of at most ${loop.rounds}`;
              label.textContent = `↺ ${loop.count} of ${loop.rounds}`;
              label.style.left = `${(x1 + x2) / 2}px`;
              label.style.top = `${y - height * 0.75}px`;
              inner.appendChild(label);
              return `<path d="M${x1} ${y} C ${x1} ${y - height}, ${x2} ${y - height}, ${x2} ${y}" marker-end="url(#arrow)"/>`;
            })
            .join("");
      }

      /* ===================== Stage history ===================== */

      function runHtml(ts, r) {
        const o = r.outcome;
        const state =
          o === null
            ? ts.stage.kind === "gate"
              ? "waiting-on-you"
              : "running"
            : o.status === "failed"
              ? "failed"
              : o.skipped
                ? "skipped"
                : o.status === "needs-decision"
                  ? "waiting-on-you"
                  : "done";
        const outcomeBadge = {
          done: '<span class="badge success">Done</span>',
          failed: '<span class="badge danger">Failed</span>',
          skipped: '<span class="badge">Skipped</span>',
          running: '<span class="badge accent"><span class="dot live"></span>Running</span>',
          "waiting-on-you": '<span class="badge warning">Waiting on you</span>',
        }[state];
        const thread = r.threadId ? threadById(r.threadId) : null;
        const tok = sumTokens(r.tokens);
        const facts = [
          `${clock(r.startedAt)} → ${r.endedAt ? clock(r.endedAt) : "now"}`,
          span(runDuration(r)),
          ts.stage.kind === "agent" ? `${kTokens(tok)} tokens` : null,
          r.session ? `${r.session} session` : null,
        ]
          .filter(Boolean)
          .join(" · ");
        const carried = r.carriedFailure
          ? `<div class="carried">↺ Briefed with what failed in ${esc(byKey(r.carriedFailure.stageKey).name)}, round ${r.carriedFailure.round} of ${r.carriedFailure.rounds}</div>`
          : "";
        const text = o
          ? o.status === "failed"
            ? o.error
            : o.summary
          : ts.stage.kind === "gate"
            ? "Waits for you to look at the changes and let the work continue."
            : "Working now.";
        const commands = r.commandRuns
          .map(
            (c) =>
              `<div class="cmd"><code>${esc(c.commandLine)}</code><span class="${c.outcome === "passed" ? "add" : "del"}">${c.outcome}</span><span class="faint">${c.purpose === "re-run" ? "re-run · " : ""}${span(c.durationMs)}</span></div>`,
          )
          .join("");
        const gate = r.gateAction
          ? `<div class="run-note muted">You chose: ${r.gateAction.kind === "continue" ? "Continue" : r.gateAction.kind === "drop" ? "Drop Task" : "Send back"}</div>`
          : "";
        const handover =
          o && o.handoverNote
            ? `<div class="handover"><span class="overline">Handover note · ${esc(personName(ts.stage.role))}</span>${inline(o.handoverNote)}</div>`
            : "";
        const open = thread
          ? `<button class="btn xs" data-action="open-thread" data-thread="${thread.id}">${thread.id === view.data.liveThreadId ? "Open its Thread · live" : "Open its Thread"}</button>`
          : "";
        return `<li class="run ${state}">
          <div class="run-line"><span class="title">Run ${r.number}</span>${outcomeBadge}<span class="run-facts">${facts}</span><span class="grow"></span>${open}</div>
          ${carried}<div class="run-note">${inline(text)}</div>${commands}${gate}${handover}
        </li>`;
      }

      function renderHistory() {
        const panel = $("history");
        if (!view.selectedStage) {
          panel.hidden = true;
          return;
        }
        const { stages } = view.data;
        const index = stages.findIndex((ts) => ts.stage.key === view.selectedStage);
        const ts = stages[index];
        const who = stageWorker(ts.stage);
        const kindWords =
          ts.stage.kind === "agent"
            ? `Agent Stage · ${PEOPLE[ts.stage.role].name} · ${PEOPLE[ts.stage.role].role} · budget ${kTokens(ts.stage.budget)} tokens`
            : ts.stage.kind === "gate"
              ? "Gate · waits for you"
              : `Project command · ${ts.stage.command}`;
        const loop = ts.stage.onFailure
          ? ` · on failure goes back to ${byKey(ts.stage.onFailure.goBackTo).name}, at most ${ts.stage.onFailure.rounds} times`
          : "";
        panel.hidden = false;
        panel.innerHTML = `
          <div class="history-head">
            ${who.avatar.replace("sm", "lg")}<h2>${esc(ts.stage.name)}</h2><span class="badge">${STATE_WORDS[ts.state]}</span>
            <span class="grow"></span>
            <span class="faint" style="font-size:11px"><span class="kbd">←</span> <span class="kbd">→</span> Stages · <span class="kbd">Esc</span> close</span>
            <button class="btn ghost xs" data-action="step-stage" data-step="-1" aria-label="Previous Stage" ${index === 0 ? "disabled" : ""}>${ICON.left}</button>
            <button class="btn ghost xs" data-action="step-stage" data-step="1" aria-label="Next Stage" ${index === stages.length - 1 ? "disabled" : ""}>${ICON.right}</button>
            <button class="btn ghost xs" data-action="close-history" aria-label="Close the Stage history">${ICON.close}</button>
          </div>
          <div class="history-sub">${kindWords}${loop}${ts.runs.length ? ` · ${kTokens(sumTokens(ts.tokens))} tokens over ${ts.runs.length} ${ts.runs.length === 1 ? "run" : "runs"}` : ""}</div>
          ${
            ts.runs.length
              ? `<ol class="runs">${[...ts.runs]
                  .reverse()
                  .map((r) => runHtml(ts, r))
                  .join("")}</ol>`
              : `<div class="muted" style="font-size:var(--text-sm)">${view.data.task.state === "planning" ? "Runs once the Task starts." : "Hasn't run yet."}</div>`
          }`;
      }

      function selectStage(key) {
        view.selectedStage = view.selectedStage === key ? null : key;
        renderRail();
        renderHistory();
        fitConversation();
        if (view.selectedStage)
          $("history").scrollIntoView({ block: "nearest", behavior: "smooth" });
      }

      /* ===================== Record ===================== */

      const BLOCKS = ["plan", "dod", "dependencies", "attachments", "origin"];

      function foldOpen(block) {
        const remembered = store.get(`folds.${view.data.task.id}`, {});
        if (block in remembered) return remembered[block];
        // By default the Plan and Definition of Done are open while Planning and folded once the Task runs.
        return view.data.task.state === "planning" && (block === "plan" || block === "dod");
      }
      function toggleFold(block) {
        const key = `folds.${view.data.task.id}`;
        const remembered = store.get(key, {});
        remembered[block] = !foldOpen(block);
        store.set(key, remembered);
        renderRecord();
      }

      function fold(block, title, summary, side, body, tone = "") {
        const open = foldOpen(block);
        return `<section class="fold card ${open ? "open" : ""}" data-tone="${tone}">
          <button class="fold-head" data-action="fold" data-block="${block}" aria-expanded="${open}">
            <span class="chev">${ICON.chev}</span><span class="fold-title">${title}</span>
            <span class="fold-summary">${summary}</span><span class="fold-side">${side}</span>
          </button>
          <div class="fold-body">${body}</div>
        </section>`;
      }

      function renderRecord() {
        const { task, dodMet, attachments } = view.data;
        const planning = task.state === "planning";
        const firstLine = task.plan.split("\n")[0].replace(/\*\*/g, "");
        const proposed = (confirmed) =>
          confirmed
            ? '<span class="badge success">Confirmed</span>'
            : `<span class="badge info">${avatar("planner", "sm")} Proposed by Angela</span>`;

        const plan = fold(
          "plan",
          "Plan",
          `${esc(firstLine)} · ${task.filesToChange.length} files`,
          proposed(task.planConfirmed),
          `<div class="md">${markdown(task.plan)}</div>
           <div class="overline" style="margin-top:12px">Files to change</div>
           <ul class="files">${task.filesToChange.map((f) => `<li>${ICON.file}${esc(f)}</li>`).join("")}</ul>
           ${planning ? '<div class="block-foot"><button class="btn xs" data-action="toast" data-text="Opens the Plan in the editor.">Edit Plan</button><span>Angela updates it as you talk in the Thread.</span></div>' : ""}`,
          planning ? "info" : "",
        );

        const met = new Set(dodMet);
        const dodSummary = planning
          ? `${task.definitionOfDone.length} statements · not confirmed yet`
          : `${met.size} of ${task.definitionOfDone.length} checked`;
        const dod = fold(
          "dod",
          "Definition of Done",
          dodSummary,
          planning
            ? proposed(false)
            : met.size === task.definitionOfDone.length
              ? '<span class="badge success">All met</span>'
              : `<span class="badge">${met.size} / ${task.definitionOfDone.length}</span>`,
          `<ul class="dod">${task.definitionOfDone.map((s, i) => `<li><span class="check ${met.has(i + 1) ? "on" : ""}">${met.has(i + 1) ? ICON.check.replace("<svg", '<svg width="10" height="10"') : ""}</span><span><span class="n">${i + 1}.</span>${inline(s)}</span></li>`).join("")}</ul>
           ${view.data.dodMetBy ? `<div class="block-foot">Checked as of ${esc(view.data.dodMetBy)}</div>` : ""}`,
          planning ? "info" : met.size === task.definitionOfDone.length ? "success" : "",
        );

        const deps = fold(
          "dependencies",
          "Dependencies",
          `Waits on ${task.blockedBy.length} Task · Done, so it doesn't block`,
          "",
          `<div class="rows"><div class="row"><span class="ico">${ICON.task}</span><span class="grow"><a href="#" data-action="toast" data-text="Opens that Task's page.">${esc(OTHER_TASK.title)}</a><div class="faint" style="font-size:var(--text-xs)">Must be Done before this Task starts</div></span><span class="badge success">Done</span></div></div>`,
        );

        const att = fold(
          "attachments",
          "Attachments",
          attachments.length
            ? `${attachments.length} · ${attachments.map((a) => a.name).join(", ")}`
            : "None yet",
          attachments.length ? `<span class="badge">${attachments.length}</span>` : "",
          attachments.length
            ? `<div class="rows">${attachments.map((a) => `<div class="row"><span class="ico">${a.kind === "link" ? ICON.link : ICON.file}</span><span class="grow"><a href="#" data-action="toast" data-text="Opens the Attachment.">${esc(a.name)}</a><div class="faint" style="font-size:var(--text-xs)">${esc(a.size)} · by ${esc(personName(a.by))}</div></span></div>`).join("")}</div>`
            : '<div class="muted">Agents and you can attach documents, screenshots, files and links here.</div>',
        );

        const origin = fold(
          "origin",
          "Origin",
          `Idea: ${esc(ORIGIN.idea)} · Initiative: ${esc(ORIGIN.initiative)}`,
          "",
          `<div class="rows">
            <div class="row"><span class="ico">${ICON.idea}</span><span class="grow"><a href="#" data-action="toast" data-text="Opens the Idea.">${esc(ORIGIN.idea)}</a><div class="faint" style="font-size:var(--text-xs)">Idea · captured by you on ${ORIGIN.capturedAt}</div></span></div>
            <div class="row"><span class="ico">${ICON.task}</span><span class="grow"><a href="#" data-action="toast" data-text="Opens the Initiative.">${esc(ORIGIN.initiative)}</a><div class="faint" style="font-size:var(--text-xs)">Initiative · this Task is one of 4</div></span></div>
          </div>`,
        );

        const changesAvailable = !planning;
        const added = CHANGES.reduce((a, c) => a + c.added, 0),
          removed = CHANGES.reduce((a, c) => a + c.removed, 0);
        const tabs = `<div class="tabs" role="tablist">
          <button class="tab" role="tab" data-action="record-tab" data-tab="record" aria-selected="${view.recordTab === "record"}">Record</button>
          <button class="tab" role="tab" data-action="record-tab" data-tab="changes" aria-selected="${view.recordTab === "changes"}" ${changesAvailable ? "" : 'disabled title="No changes before the Task starts"'}>Changes <span class="count">${changesAvailable ? `${CHANGES.length} files` : ""}</span></button>
        </div>`;
        const changes = `<div class="card" style="padding:14px 16px">
          <div class="changes-sum"><b>${CHANGES.length} files</b><span class="add num">+${added}</span><span class="del num">−${removed}</span><span class="badge success">Tests passed · run 4</span><span class="grow" style="flex:1"></span><a href="#" data-action="toast" data-text="Opens the Task's worktree in VS Code.">Open in editor</a></div>
          <div class="rows">${CHANGES.map((c) => `<div class="row"><span class="mono grow">${esc(c.path)}</span>${c.status === "added" ? '<span class="badge info">new</span>' : ""}<span class="mono add">+${c.added}</span><span class="mono del">−${c.removed}</span></div>`).join("")}</div>
          <div class="diff"><div class="diff-head">apps/api/src/modules/reports/usage-csv.ts</div><pre>${DIFF.map(([k, l]) => `<span class="${k}">${k === "a" ? "+" : k === "d" ? "−" : " "} ${esc(l)}</span>`).join("")}</pre></div>
        </div>`;
        $("record").innerHTML =
          tabs +
          (view.recordTab === "changes" && changesAvailable
            ? changes
            : `<div class="folds">${plan}${dod}${deps}${att}${origin}</div>`);
      }

      /* ===================== Conversation ===================== */

      function decisionCard(d) {
        const asker = d.roleKey
          ? `${avatar(d.roleKey, "sm")}<b style="color:var(--fg-1)">${personName(d.roleKey)}</b> asks`
          : `${avatar(null, "sm")}<b style="color:var(--fg-1)">The Office</b> asks`;
        const t = threadById(d.threadId);
        return `<div class="ask ${d.roleKey ? "" : "office"}">
          <div class="ask-kind">${asker}<span>· Decision</span><span class="grow"></span><button class="linklike" style="font-size:11px" data-action="open-thread" data-thread="${d.threadId}">in ${esc(threadPlace(t))} · ${clock(d.askedAt)}</button></div>
          <p class="ask-q">${esc(d.question)}</p>
          <div class="ask-actions">${d.options.map((o, i) => `<button class="btn option ${i === d.recommendation.option ? "primary" : ""}" data-action="answer" data-decision="${d.id}" data-option="${i}">${esc(o)}${i === d.recommendation.option ? ' <span class="rec">Recommended</span>' : ""}</button>`).join("")}</div>
          <details class="details"><summary>Context, why it's recommended, or your own answer</summary>
            <p class="ask-ctx">${esc(d.context)}</p>
            <div class="why">${personName(d.roleKey)} recommends it: ${esc(d.recommendation.reason)}</div>
            <div class="free"><input placeholder="Answer in your own words" aria-label="Your answer" /><button class="btn" data-action="answer" data-decision="${d.id}" data-option="free">Answer</button></div>
          </details>
        </div>`;
      }

      function gateCard(ts) {
        const added = CHANGES.reduce((a, c) => a + c.added, 0),
          removed = CHANGES.reduce((a, c) => a + c.removed, 0);
        const agentStages = view.data.stages.filter(
          (s) =>
            s.stage.kind === "agent" &&
            s.runs.length &&
            !s.runs.every((r) => r.outcome && r.outcome.skipped),
        );
        return `<div class="ask gate">
          <div class="ask-kind">${avatar("you", "sm")}<b style="color:var(--fg-1)">Gate</b><span>· before Publish</span><span class="grow"></span><button class="linklike" style="font-size:11px" data-action="select-stage" data-stage="${ts.stage.key}">on the rail · ${clock(ts.runs[ts.runs.length - 1].startedAt)}</button></div>
          <p class="ask-q">Look at the changes and let the work continue to Publish</p>
          <p class="ask-ctx">${CHANGES.length} files · <span class="add">+${added}</span> <span class="del">−${removed}</span> · Tests passed · Definition of Done ${view.data.dodMet.length} of 6 checked · <button class="linklike" data-action="record-tab" data-tab="changes">Open Changes</button></p>
          <div class="ask-actions">
            <button class="btn accent" data-action="toast" data-text="Continue: Publish runs next.">Continue</button>
            <button class="btn" data-action="send-back" aria-expanded="${view.sendBackOpen}">Send back…</button>
            <button class="btn danger" data-action="toast" data-text="Drop Task asks you to confirm first.">Drop Task</button>
          </div>
          ${
            view.sendBackOpen
              ? `<div class="sendback">
            <select aria-label="Send back to">${agentStages.map((s) => `<option>${esc(s.stage.name)} · ${PEOPLE[s.stage.role].name}</option>`).join("")}</select>
            <textarea placeholder="Say what should change"></textarea>
            <div><button class="btn primary xs" data-action="toast" data-text="Sends the work back with your feedback in the Stage's Brief.">Send back</button></div>
          </div>`
              : ""
          }
        </div>`;
      }

      function planningCards() {
        return `<div class="ask">
            <div class="ask-kind">${avatar("planner", "sm")}<b style="color:var(--fg-1)">Angela</b><span>· Plan and Definition of Done</span></div>
            <p class="ask-q">Confirm the Plan and the Definition of Done</p>
            <p class="ask-ctx">3 files to change · 6 statements · about 600k tokens</p>
            <div class="ask-actions"><button class="btn primary" data-action="toast" data-text="Confirms both; the Task becomes Ready once the Pipeline is set.">Confirm both</button><button class="btn" data-action="open-fold" data-block="plan">Read the Plan</button></div>
          </div>
          <div class="ask">
            <div class="ask-kind">${avatar("planner", "sm")}<b style="color:var(--fg-1)">Angela</b><span>· Pipeline</span></div>
            <p class="ask-q">Angela proposes the Full Pipeline</p>
            <p class="ask-ctx">${esc(view.data.task.proposedPipeline.reason)}</p>
            <div class="ask-actions"><button class="btn primary" data-action="toast" data-text="Takes the Full Pipeline.">Take Full</button><button class="btn" data-action="toast" data-text="Keeps the Project's default, Quick fix.">Keep Quick fix</button></div>
          </div>`;
      }

      function renderNeeds() {
        const decisions = openDecisions();
        const gate = gateWaiting();
        const n = needsCount();
        if (n === 0) {
          const words =
            view.data.task.state === "done"
              ? "Nothing needs you: this Task is Done."
              : "Nothing needs you right now. You'll see it here first.";
          return `<div class="needs empty"><div class="nothing">${ICON.ok}${words}</div></div>`;
        }
        const cards =
          (view.data.task.state === "planning" ? planningCards() : "") +
          decisions.map(decisionCard).join("") +
          (gate ? gateCard(gate) : "");
        return `<div class="needs" role="region" aria-label="Needs you">
          <div class="needs-head"><span class="count-pill">${n}</span><span class="title">Needs you</span><span class="grow"></span>
            <button class="btn ghost xs" data-action="collapse-needs">${view.needsCollapsed ? "Show" : "Fold"}</button></div>
          ${view.needsCollapsed ? "" : `<div class="needs-list">${cards}</div><div class="needs-more"><button class="btn xs" data-action="show-all-needs">${ICON.chev} More that needs you below</button></div>`}
        </div>`;
      }

      function messageHtml(msg, thread) {
        if (msg.kind === "say") {
          return `<div class="msg ${msg.author === "you" ? "you" : ""}">${avatar(msg.author, "lg")}<div><div class="who"><b>${personName(msg.author)}</b><span>${clock(msg.at)}</span></div><div class="text">${markdown(msg.text)}</div></div></div>`;
        }
        if (msg.kind === "tool") return `<div class="tool">› ${esc(msg.text)}</div>`;
        if (msg.kind === "start")
          return `<div class="divider ${msg.failedBefore ? "fail" : ""}">${esc(msg.text)}</div>`;
        if (msg.kind === "end")
          return `<div class="divider ${msg.failedRun ? "fail" : ""}">${esc(msg.text)}</div>`;
        if (msg.kind === "handover")
          return `<div class="inline-card note"><span class="overline">Handover note · ${personName(thread.roleKey)}</span><div>${inline(msg.text)}</div></div>`;
        if (msg.kind === "decision") {
          const d = decision(msg.decisionId);
          if (d.answer === null)
            return `<div class="inline-card"><span class="overline">Decision · waits on you</span><div><b>${esc(d.question)}</b></div><div class="faint" style="font-size:var(--text-xs);margin-top:2px">Answer it in Needs you, at the top.</div></div>`;
          const answer = d.answer.kind === "option" ? d.options[d.answer.option] : d.answer.text;
          return `<div class="inline-card answered"><span class="overline">Decision · answered by you at ${clock(d.answeredAt)}</span><div>${esc(d.question)}</div><div style="margin-top:4px">${ICON.check.replace("<svg", '<svg width="12" height="12" style="color:var(--success);vertical-align:-1px"')} <b>${esc(answer)}</b></div></div>`;
        }
        return "";
      }

      const typingHtml = (t) =>
        t.state === "answering"
          ? `<div class="typing"><i></i><i></i><i></i>${personName(t.roleKey)} is working</div>`
          : "";

      function earlierThreads() {
        const live = view.data.liveThreadId;
        const groups = new Map();
        const sorted = [...view.data.threads]
          .filter((t) => t.id !== live)
          .sort((a, b) => Date.parse(b.startedAt) - Date.parse(a.startedAt));
        for (const t of sorted) {
          const found = stageOfThread(t.id);
          const key = found ? found.taskStage.stage.key : "planning";
          if (!groups.has(key))
            groups.set(key, {
              name: found ? found.taskStage.stage.name : "Planning",
              stageKey: found ? key : null,
              threads: [],
            });
          groups.get(key).threads.push({ t, run: found ? found.run : null });
        }
        return [...groups.values()];
      }

      function outcomeWords(run) {
        if (!run) return "Plan confirmed";
        if (!run.outcome) return "Running";
        if (run.outcome.status === "failed") return "Failed";
        return "Done";
      }

      function renderEarlier() {
        const groups = earlierThreads();
        const count = groups.reduce((a, g) => a + g.threads.length, 0);
        if (!count) return "";
        const latest = groups[0].threads[0];
        return `<div class="earlier ${view.earlierOpen ? "open" : ""} ${view.data.liveThreadId === null && !view.viewingThreadId ? "fill" : ""}">
          <button class="earlier-head" data-action="toggle-earlier" aria-expanded="${view.earlierOpen}"><span class="chev">${ICON.chev}</span><b style="font-weight:600">Earlier Threads</b><span class="faint">${count}</span>
            <span class="summary">Latest: ${personName(latest.t.roleKey)} in ${esc(groups[0].name)} · ${outcomeWords(latest.run)}</span></button>
          <div class="earlier-list">${groups
            .map(
              (g) => `
            <div class="group-label">${g.stageKey ? `<button class="stage-chip" data-action="select-stage" data-stage="${g.stageKey}" title="Show ${esc(g.name)} on the rail">◆ ${esc(g.name)}</button>` : `<span class="stage-chip" style="cursor:default">Planning</span>`}</div>
            ${g.threads
              .map(
                ({
                  t,
                  run,
                }) => `<button class="thread-line" data-action="open-thread" data-thread="${t.id}" aria-current="${view.viewingThreadId === t.id}">
              ${avatar(t.roleKey, "sm")}<span class="who">${personName(t.roleKey)}</span>
              <span class="grow">${run ? `Run ${run.number} · ` : ""}${outcomeWords(run)}</span><span class="when">${relative(t.startedAt)}</span></button>`,
              )
              .join("")}`,
            )
            .join("")}
          </div>
        </div>`;
      }

      function composer(live) {
        const { task } = view.data;
        if (task.state === "done") {
          return `<div class="composer"><div class="ended">This Task is Done and its working copy has been removed, so you can read this conversation but not continue it. To keep working, start a new Task.</div></div>`;
        }
        const place = threadPlace(live).replace(/, run \d+$/, "");
        const p = PEOPLE[live.roleKey];
        const note =
          live.state === "answering"
            ? "Your message lands at the next safe point"
            : "Continues the session";
        return `<div class="composer">
          <div class="to">To ${avatar(live.roleKey, "sm")}<span><b>${p.name} · ${p.role}</b>, in ${esc(place)}</span></div>
          <div class="compose-box"><textarea placeholder="Write to ${p.name}…" aria-label="Message to ${p.name}"></textarea><button class="btn primary" data-action="toast" data-text="Sends your message to ${p.name}.">Send</button></div>
          <div class="context-label">${note} · ${kTokens(live.context.contextTokens)} tokens of context · cache warm</div>
        </div>`;
      }

      function renderThreadsConcept() {
        const live = view.data.liveThreadId ? threadById(view.data.liveThreadId) : null;
        const viewing = view.viewingThreadId ? threadById(view.viewingThreadId) : live;
        const readOnly = viewing && live && viewing.id !== live.id;
        let header;
        if (!viewing) {
          header = `<div class="thread-head" style="border-top:1px solid var(--border)"><span class="grow"><span class="name">No Thread is live</span><div class="sub">The Pipeline has ended; open an earlier Thread above to read it.</div></span></div>`;
        } else if (readOnly || !live) {
          header = `${live ? `<div class="readonly-bar"><span class="grow">Reading an earlier Thread. It's read-only.</span><button class="btn xs" data-action="back-to-live"><span class="dot live"></span>Back to live${view.unread ? ` <span class="unread">${view.unread}</span>` : ""}</button></div>` : ""}
            <div class="thread-head">${avatar(viewing.roleKey, "lg")}<span class="grow"><span class="name">${personLabel(viewing.roleKey)}</span><div class="sub">${esc(threadPlace(viewing))} · ${kTokens(sumTokens(viewing.tokens))} tokens · started ${clock(viewing.startedAt)}</div></span>${live ? "" : '<button class="btn ghost xs" data-action="close-thread">Close</button>'}</div>`;
        } else {
          header = `<div class="thread-head">${avatar(live.roleKey, "lg")}<span class="grow"><span class="name">${personLabel(live.roleKey)}</span><div class="sub">${esc(threadPlace(live))} · ${kTokens(sumTokens(live.tokens))} tokens</div></span><span class="live-badge"><span class="dot live"></span>Live</span></div>`;
        }
        const body = viewing
          ? `<div class="messages" id="messages">${viewing.messages.map((m) => messageHtml(m, viewing)).join("")}${typingHtml(viewing)}</div>`
          : "";
        const foot = readOnly
          ? `<div class="composer"><div class="ended">Read-only: this Thread's run has ended. <button class="linklike" data-action="back-to-live">Back to live</button> to write to ${personName(live.roleKey)}.</div></div>`
          : live
            ? composer(live)
            : composer(null);
        return renderEarlier() + header + body + foot;
      }

      function renderTimelineConcept() {
        const live = view.data.liveThreadId ? threadById(view.data.liveThreadId) : null;
        const ordered = [...view.data.threads].sort(
          (a, b) => Date.parse(a.startedAt) - Date.parse(b.startedAt),
        );
        const segments = ordered
          .map((t) => {
            const found = stageOfThread(t.id);
            const isLive = live && t.id === live.id;
            return `<div class="segment ${isLive ? "live" : "past"}" id="seg-${t.id}">
            <div class="segment-head">${avatar(t.roleKey, "sm")}<b style="color:var(--fg-1)">${personName(t.roleKey)}</b><span>${esc(threadPlace(t))}</span><span class="grow"></span>
              ${found ? `<button class="stage-chip" data-action="select-stage" data-stage="${found.taskStage.stage.key}">◆ rail</button>` : ""}
              ${isLive ? '<span class="live-badge"><span class="dot live"></span>Live</span>' : `<span class="faint">${outcomeWords(found ? found.run : null)}</span>`}</div>
            <div style="display:flex;flex-direction:column;gap:10px;padding-top:10px">${t.messages.map((m) => messageHtml(m, t)).join("")}${typingHtml(t)}</div>
          </div>`;
          })
          .join("");
        const header = `<div class="thread-head"><span class="grow"><span class="name">One timeline</span><div class="sub">Every Thread of this Task in order; the live one last</div></span>${live ? `<span class="live-badge"><span class="dot live"></span>${personName(live.roleKey)} live</span>` : ""}</div>`;
        return header + `<div class="messages" id="messages">${segments}</div>` + composer(live);
      }

      function renderConversation() {
        const conversation = $("conversation");
        const previous = $("messages");
        const keepScroll =
          previous &&
          previous.dataset.thread === `${view.scenario}/${view.concept}/${view.viewingThreadId}`
            ? previous.scrollTop
            : null;
        const close = `<div class="drawer-close" style="justify-content:flex-end;padding:6px 8px 0"><button class="btn ghost xs" data-action="close-drawer" aria-label="Close the conversation">${ICON.close}</button></div>`;
        conversation.innerHTML =
          close +
          renderNeeds() +
          (view.concept === "threads" ? renderThreadsConcept() : renderTimelineConcept());
        const messages = $("messages");
        if (messages) {
          messages.dataset.thread = `${view.scenario}/${view.concept}/${view.viewingThreadId}`;
          messages.scrollTop = keepScroll !== null ? keepScroll : messages.scrollHeight;
        }

        const needs = conversation.querySelector(".needs");
        if (needs) needs.addEventListener("scroll", updateNeedsCue, { passive: true });
        requestAnimationFrame(updateNeedsCue);

        const n = needsCount();
        $("drawer-handle").innerHTML =
          `${ICON.chat}Conversation${view.data.liveThreadId ? ' <span class="dot live"></span>' : ""}${n ? ` <span class="count-pill">${n}</span>` : ""}`;
      }

      /** Running scenario: new messages arrive in the live Thread; while you read another, they count as unread. */
      function startLiveScript() {
        clearInterval(view.liveTimer);
        const script = view.data.liveScript;
        if (!script) return;
        let next = 0;
        view.liveTimer = setInterval(() => {
          if (next >= script.length) {
            clearInterval(view.liveTimer);
            return;
          }
          const live = threadById(view.data.liveThreadId);
          live.messages.push({ ...script[next], at: new Date(NOW).toISOString() });
          next += 1;
          const reading =
            view.concept === "threads" && view.viewingThreadId && view.viewingThreadId !== live.id;
          if (reading) view.unread += 1;
          const messages = $("messages");
          const atBottom =
            messages && messages.scrollHeight - messages.scrollTop - messages.clientHeight < 40;
          renderConversation();
          // Only follow new messages when already at the end; never jump the page.
          if (!reading && atBottom) $("messages").scrollTop = $("messages").scrollHeight;
        }, 6000);
      }

      /* ===================== Render & events ===================== */

      function renderAll() {
        renderHead();
        renderRail();
        renderHistory();
        renderRecord();
        // Sized before it's filled, so a Thread opens at its newest message.
        fitConversation();
        renderConversation();
        $("viewport").classList.toggle("drawer-open", view.drawerOpen);
      }

      /**
       * Wide: the conversation column ends at the window's bottom edge wherever it starts, so the
       * composer is always in view; it grows to the full height as the page scrolls. Narrow: a drawer.
       */
      function fitConversation() {
        const conversation = $("conversation");
        if (isNarrow()) {
          conversation.style.height = "";
          updateNeedsCue();
          return;
        }
        const scroller = $("scroller");
        const top = conversation.getBoundingClientRect().top - scroller.getBoundingClientRect().top;
        const messages = $("messages");
        const atEnd =
          messages && messages.scrollHeight - messages.scrollTop - messages.clientHeight < 40;
        conversation.style.height = `${Math.max(420, scroller.clientHeight - Math.max(top, 12) - 16)}px`;
        if (atEnd) messages.scrollTop = messages.scrollHeight;
        updateNeedsCue();
      }

      function updateNeedsCue() {
        const needs = document.querySelector(".needs:not(.empty)");
        if (!needs) return;
        const hiddenBelow = needs.scrollHeight - needs.scrollTop - needs.clientHeight > 4;
        needs.classList.toggle("overflowing", hiddenBelow);
      }

      /** Wide: scrolls the page until the column has the whole window; then whatever is left scrolls into view. */
      function showAllNeeds() {
        const scroller = $("scroller");
        if (!isNarrow()) {
          const top =
            $("conversation").getBoundingClientRect().top - scroller.getBoundingClientRect().top;
          scroller.scrollTop += top - 12;
          fitConversation();
        }
        const needs = document.querySelector(".needs");
        needs.scrollTo({ top: needs.scrollHeight, behavior: "smooth" });
      }

      function loadScenario(key) {
        view.scenario = key;
        view.data = SCENARIOS[key].build();
        view.selectedStage = null;
        view.viewingThreadId = null;
        view.unread = 0;
        view.recordTab = "record";
        view.sendBackOpen = false;
        view.needsCollapsed = false;
        view.earlierOpen = view.data.liveThreadId === null;
        renderSwitches();
        renderAll();
        startLiveScript();
      }

      function segmented(id, options, current, action) {
        $(id).innerHTML = options
          .map(
            ([value, label]) =>
              `<button type="button" data-action="${action}" data-value="${value}" aria-pressed="${current === value}">${label}</button>`,
          )
          .join("");
      }
      function renderSwitches() {
        segmented(
          "scenario-switch",
          Object.entries(SCENARIOS).map(([k, s]) => [k, s.label]),
          view.scenario,
          "scenario",
        );
        segmented(
          "concept-switch",
          [
            ["threads", "Threads"],
            ["timeline", "One timeline"],
          ],
          view.concept,
          "concept",
        );
        segmented(
          "width-switch",
          [
            ["wide", "Window"],
            ["narrow", "Narrow · 820px"],
          ],
          view.narrow ? "narrow" : "wide",
          "width",
        );
        segmented(
          "palette-switch",
          [
            ["light", "Light"],
            ["dark", "Dark"],
          ],
          view.palette,
          "palette",
        );
      }

      let toastTimer = null;
      function toast(text) {
        const el = $("toast");
        el.textContent = `${text} (In the mock-up nothing changes.)`;
        el.classList.add("show");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => el.classList.remove("show"), 2600);
      }

      function isNarrow() {
        return $("viewport").getBoundingClientRect().width <= 900;
      }

      function openThread(id) {
        view.viewingThreadId = id === view.data.liveThreadId ? null : id;
        if (view.viewingThreadId === null) view.unread = 0;
        if (view.concept === "timeline") {
          renderConversation();
          const seg = $(`seg-${id}`);
          if (seg) seg.scrollIntoView({ block: "start", behavior: "smooth" });
        } else renderConversation();
        if (isNarrow()) {
          view.drawerOpen = true;
          $("viewport").classList.add("drawer-open");
        }
      }

      const ACTIONS = {
        scenario: (el) => loadScenario(el.dataset.value),
        concept: (el) => {
          view.concept = el.dataset.value;
          view.viewingThreadId = null;
          view.unread = 0;
          renderSwitches();
          renderConversation();
        },
        width: (el) => {
          view.narrow = el.dataset.value === "narrow";
          $("viewport").classList.toggle("narrow-demo", view.narrow);
          renderSwitches();
          requestAnimationFrame(() => {
            layoutRail();
            fitConversation();
          });
        },
        palette: (el) => {
          view.palette = el.dataset.value;
          document.documentElement.dataset.theme = view.palette;
          document.documentElement.dataset.palette = view.palette;
          renderSwitches();
        },
        "reset-folds": () => {
          store.clear();
          renderRecord();
          toast("Remembered folds forgotten; each Task shows its defaults again.");
        },
        fold: (el) => toggleFold(el.dataset.block),
        "open-fold": (el) => {
          const key = `folds.${view.data.task.id}`;
          const remembered = store.get(key, {});
          remembered[el.dataset.block] = true;
          store.set(key, remembered);
          view.recordTab = "record";
          renderRecord();
          view.drawerOpen = false;
          $("viewport").classList.remove("drawer-open");
        },
        "record-tab": (el) => {
          view.recordTab = el.dataset.tab;
          renderRecord();
          view.drawerOpen = false;
          $("viewport").classList.remove("drawer-open");
        },
        "select-stage": (el) => {
          view.drawerOpen = false;
          $("viewport").classList.remove("drawer-open");
          view.selectedStage = null;
          selectStage(el.dataset.stage);
        },
        "step-stage": (el) => stepStage(Number(el.dataset.step)),
        "close-history": () => {
          view.selectedStage = null;
          renderRail();
          renderHistory();
          fitConversation();
        },
        "open-thread": (el) => openThread(el.dataset.thread),
        "back-to-live": () => {
          view.viewingThreadId = null;
          view.unread = 0;
          renderConversation();
        },
        "close-thread": () => {
          view.viewingThreadId = null;
          renderConversation();
        },
        "show-all-needs": showAllNeeds,
        "toggle-earlier": () => {
          view.earlierOpen = !view.earlierOpen;
          renderConversation();
        },
        "collapse-needs": () => {
          view.needsCollapsed = !view.needsCollapsed;
          renderConversation();
        },
        "send-back": () => {
          view.sendBackOpen = !view.sendBackOpen;
          renderConversation();
        },
        answer: (el) => {
          const d = decision(el.dataset.decision);
          toast(
            el.dataset.option === "free"
              ? "Sends your own answer to the Decision."
              : `Answers: "${d.options[Number(el.dataset.option)]}".`,
          );
        },
        "open-drawer": () => {
          view.drawerOpen = true;
          $("viewport").classList.add("drawer-open");
        },
        "close-drawer": () => {
          view.drawerOpen = false;
          $("viewport").classList.remove("drawer-open");
        },
        toast: (el) => toast(el.dataset.text),
      };

      function stepStage(step) {
        const keys = view.data.stages.map((ts) => ts.stage.key);
        const index = keys.indexOf(view.selectedStage);
        const next = keys[Math.max(0, Math.min(keys.length - 1, index + step))];
        if (next === view.selectedStage) return;
        view.selectedStage = next;
        renderRail();
        renderHistory();
        const node = document.querySelector(`.node[data-stage="${next}"]`);
        if (node) {
          node.focus({ preventScroll: true });
          node.scrollIntoView({ block: "nearest", inline: "nearest" });
        }
      }

      document.addEventListener("click", (event) => {
        const node = event.target.closest(".node, .arc-label");
        if (node) {
          selectStage(node.dataset.stage);
          return;
        }
        const el = event.target.closest("[data-action]");
        if (!el || el.disabled) return;
        if (el.tagName === "A") event.preventDefault();
        ACTIONS[el.dataset.action](el);
      });

      document.addEventListener("keydown", (event) => {
        const typing = event.target.closest("input, textarea, select");
        if (typing) return;
        if (event.key === "Escape") {
          if (view.drawerOpen) ACTIONS["close-drawer"]();
          else if (view.selectedStage) ACTIONS["close-history"]();
          return;
        }
        if (!view.selectedStage) return;
        if (event.key === "ArrowRight") {
          event.preventDefault();
          stepStage(1);
        }
        if (event.key === "ArrowLeft") {
          event.preventDefault();
          stepStage(-1);
        }
      });

      new ResizeObserver(() => {
        layoutRail();
        fitConversation();
      }).observe($("viewport"));
      $("scroller").addEventListener("scroll", fitConversation, { passive: true });

      view.palette = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.dataset.theme = view.palette;
      document.documentElement.dataset.palette = view.palette;
      loadScenario(view.scenario);
    </script>
