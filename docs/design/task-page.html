<!doctype html>
<html lang="en" data-theme="light" data-palette="light" data-density="comfortable">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>The Office · Task page · proposal</title>
    <!--
      A design proposal, not the UI spec: see README.md next to this file. Self-contained on purpose
      (no network requests): tokens are copied from design-system/tokens and packages/ui/src/appearance,
      the fonts are inlined at the end of the page.
    -->
    <style>
      /* ---------- Tokens: design-system/tokens (colours, type, spacing, radius, elevation, motion) ---------- */
      :root {
        --ember-50: #fff2ed;
        --ember-100: #ffe0d4;
        --ember-300: #ff9370;
        --ember-400: #ff6638;
        --ember-500: #f23d0f;
        --ember-600: #cc2f07;
        --ember-700: #9e2406;
        --flare-300: #ffc266;
        --flare-500: #ff9a1f;
        --white: #ffffff;
        --gray-25: #fafaf9;
        --gray-50: #f4f4f2;
        --gray-100: #e9e9e6;
        --gray-150: #dededa;
        --gray-200: #d1d1cc;
        --gray-300: #b1b1ab;
        --gray-400: #8a8a84;
        --gray-500: #6b6b66;
        --gray-600: #50504c;
        --gray-700: #3a3a37;
        --gray-800: #262624;
        --gray-900: #181817;
        --gray-950: #0f0f0e;
        --green-50: #edf8f1;
        --green-100: #d5f0df;
        --green-500: #1e9e57;
        --green-600: #17834a;
        --green-700: #106a3b;
        --amber-50: #fff8e6;
        --amber-100: #ffedc2;
        --amber-500: #e5a00d;
        --amber-700: #865b05;
        --red-50: #fdeef0;
        --red-100: #fad9dd;
        --red-500: #c8102e;
        --red-600: #aa0d27;
        --red-700: #8e0b20;
        --blue-50: #eef3fd;
        --blue-100: #dae5fa;
        --blue-500: #2f6bdb;
        --blue-700: #1d4699;
        --teal-500: #14a38b;
        --violet-500: #7c5cd6;

        --bg: var(--gray-50);
        --surface: var(--white);
        --surface-raised: var(--white);
        --surface-sunken: var(--gray-50);
        --surface-hover: var(--gray-25);
        --surface-selected: var(--ember-50);
        --surface-inverse: var(--gray-900);
        --fg-1: var(--gray-950);
        --fg-2: var(--gray-600);
        --fg-3: var(--gray-500);
        --fg-disabled: var(--gray-400);
        --fg-inverse: var(--white);
        --fg-on-accent: var(--white);
        --border: var(--gray-150);
        --border-subtle: var(--gray-100);
        --border-strong: var(--gray-200);
        --border-focus: var(--ember-500);
        --accent: var(--ember-500);
        --accent-hover: var(--ember-600);
        --accent-subtle: var(--ember-50);
        --accent-subtle-fg: var(--ember-700);
        --primary: var(--gray-900);
        --primary-hover: var(--gray-700);
        --primary-fg: var(--white);
        --control-hover: var(--gray-50);
        --control-press: var(--gray-100);
        --success: var(--green-500);
        --success-subtle: var(--green-50);
        --success-fg: var(--green-700);
        --success-border: var(--green-100);
        --warning: var(--amber-500);
        --warning-subtle: var(--amber-50);
        --warning-fg: var(--amber-700);
        --warning-border: var(--amber-100);
        --danger: var(--red-500);
        --danger-subtle: var(--red-50);
        --danger-fg: var(--red-700);
        --danger-border: var(--red-100);
        --info: var(--blue-500);
        --info-subtle: var(--blue-50);
        --info-fg: var(--blue-700);
        --info-border: var(--blue-100);
        --neutral-subtle: var(--gray-50);
        --neutral-fg: var(--gray-600);
        --neutral-border: var(--gray-150);
        --text-link: var(--fg-1);
        --text-link-hover: var(--accent-hover);
        --focus-ring: 0 0 0 3px color-mix(in oklab, var(--ember-500) 30%, transparent);
        --overlay: color-mix(in oklab, var(--gray-950) 45%, transparent);

        --font-sans: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        --font-mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        --text-2xs: 11px;
        --text-xs: 12px;
        --text-sm: 13px;
        --text-md: 14px;
        --text-lg: 16px;
        --text-xl: 18px;
        --text-2xl: 20px;
        --type-body: 400 var(--text-md) / 1.5 var(--font-sans);
        --type-overline: 500 var(--text-2xs) / 1.2 var(--font-mono);
        --tracking-caps: 0.06em;

        --radius-sm: 4px;
        --radius-md: 6px;
        --radius-lg: 8px;
        --radius-xl: 12px;
        --radius-full: 999px;
        --radius-control: var(--radius-md);
        --radius-badge: var(--radius-sm);
        --control-xs: 24px;
        --control-sm: 28px;
        --control-md: 32px;

        --shadow-1: 0 1px 2px rgba(16, 16, 15, 0.05);
        --shadow-2: 0 4px 12px -2px rgba(16, 16, 15, 0.08), 0 1px 3px rgba(16, 16, 15, 0.05);
        --shadow-3: 0 16px 40px -8px rgba(16, 16, 15, 0.18), 0 2px 6px rgba(16, 16, 15, 0.06);
        --ease-out: cubic-bezier(0.2, 0.8, 0.2, 1);
        --duration-fast: 120ms;
        --duration-base: 200ms;
        --duration-slow: 280ms;
      }
      [data-theme="dark"] {
        --surface-selected: color-mix(in oklab, var(--ember-500) 12%, var(--gray-900));
        --fg-disabled: var(--gray-600);
        --accent-hover: var(--ember-400);
        --accent-subtle: color-mix(in oklab, var(--ember-500) 16%, transparent);
        --accent-subtle-fg: var(--ember-300);
        --success-subtle: color-mix(in oklab, var(--green-500) 16%, transparent);
        --success-fg: #6fd69b;
        --success-border: color-mix(in oklab, var(--green-500) 30%, transparent);
        --warning-subtle: color-mix(in oklab, var(--amber-500) 16%, transparent);
        --warning-fg: var(--flare-300);
        --warning-border: color-mix(in oklab, var(--amber-500) 30%, transparent);
        --danger-subtle: color-mix(in oklab, var(--red-500) 20%, transparent);
        --danger-fg: #ff8a97;
        --danger-border: color-mix(in oklab, var(--red-500) 36%, transparent);
        --info-subtle: color-mix(in oklab, var(--blue-500) 18%, transparent);
        --info-fg: #93b5f5;
        --info-border: color-mix(in oklab, var(--blue-500) 34%, transparent);
        --overlay: color-mix(in oklab, #000 65%, transparent);
        --shadow-1: 0 0 0 1px rgba(255, 255, 255, 0.04);
        --shadow-2: 0 4px 12px -2px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.06);
        --shadow-3: 0 16px 40px -8px rgba(0, 0, 0, 0.65), 0 0 0 1px rgba(255, 255, 255, 0.08);
      }
      /* packages/ui/src/appearance/palettes/light.css */
      :root[data-palette="light"] {
        --fg-1: var(--gray-800);
        --fg-2: var(--gray-500);
        --fg-3: var(--gray-400);
        --border: var(--gray-100);
        --border-subtle: #efefec;
        --border-strong: var(--gray-150);
        --surface-hover: var(--gray-25);
        --neutral-subtle: var(--gray-50);
        --neutral-fg: var(--gray-500);
        --neutral-border: var(--gray-100);
      }
      /* packages/ui/src/appearance/palettes/dark.css */
      :root[data-palette="dark"] {
        --bg: #161615;
        --surface: #1d1d1b;
        --surface-raised: #242422;
        --surface-sunken: #131312;
        --surface-hover: #222220;
        --surface-selected: #2a2420;
        --surface-inverse: #e6e6e2;
        --fg-1: #d9d9d5;
        --fg-2: #9a9a94;
        --fg-3: #6f6f69;
        --fg-inverse: #161615;
        --border: #262624;
        --border-subtle: #222220;
        --border-strong: #33332f;
        --primary: #d9d9d5;
        --primary-fg: #161615;
        --primary-hover: #e6e6e2;
        --control-hover: #262624;
        --control-press: #2e2e2b;
        --neutral-subtle: #242422;
        --neutral-fg: #9a9a94;
        --neutral-border: #2e2e2b;
      }
      /* packages/ui/src/appearance/densities/comfortable.css */
      :root[data-density="comfortable"] {
        --pad-card: 16px 18px;
        --gap-card: 12px;
        --pad-row: 14px 18px;
        --pad-page: 24px;
        --gap-panel: 20px;
        --radius-card: 10px;
        --text-item: 14px;
        --text-body: 13px;
        --control-h: 28px;
        --line: 1.5;
      }

      /* ---------- Base (design-system/tokens/base.css) ---------- */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg-1);
        font: var(--type-body);
        -webkit-font-smoothing: antialiased;
        font-feature-settings: "cv11";
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      a {
        color: var(--text-link);
        text-decoration: underline;
        text-decoration-thickness: 1px;
        text-underline-offset: 3px;
        text-decoration-color: var(--border-strong);
      }
      a:hover {
        color: var(--text-link-hover);
        text-decoration-color: currentColor;
      }
      code,
      kbd,
      pre {
        font-family: var(--font-mono);
      }
      :focus-visible {
        outline: none;
        box-shadow: var(--focus-ring);
      }
      ::selection {
        background: color-mix(in oklab, var(--ember-500) 25%, transparent);
      }
      button {
        font: inherit;
        color: inherit;
      }
      .num {
        font-variant-numeric: tabular-nums;
      }
      [hidden] {
        display: none !important;
      }

      /* ---------- Controls ---------- */
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: var(--control-sm);
        padding: 0 10px;
        border: 1px solid var(--border-strong);
        border-radius: var(--radius-control);
        background: var(--surface);
        color: var(--fg-1);
        font-size: var(--text-sm);
        font-weight: 500;
        cursor: pointer;
        white-space: nowrap;
        transition: background var(--duration-fast);
      }
      .btn:hover {
        background: var(--control-hover);
      }
      .btn:active {
        background: var(--control-press);
      }
      .btn:disabled {
        color: var(--fg-disabled);
        cursor: not-allowed;
        background: var(--surface);
      }
      .btn.primary {
        background: var(--primary);
        border-color: var(--primary);
        color: var(--primary-fg);
      }
      .btn.primary:hover {
        background: var(--primary-hover);
      }
      .btn.primary:disabled {
        background: var(--neutral-subtle);
        border-color: var(--border);
        color: var(--fg-disabled);
      }
      .btn.accent {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--fg-on-accent);
      }
      .btn.accent:hover {
        background: var(--accent-hover);
      }
      .btn.danger {
        color: var(--danger-fg);
      }
      .btn.ghost {
        border-color: transparent;
        background: transparent;
      }
      .btn.ghost:hover {
        background: var(--control-hover);
      }
      .btn.xs {
        height: var(--control-xs);
        padding: 0 8px;
        font-size: var(--text-xs);
      }
      .linklike {
        border: 0;
        background: none;
        padding: 0;
        cursor: pointer;
        color: var(--fg-2);
        font-size: inherit;
        text-decoration: underline;
        text-underline-offset: 3px;
        text-decoration-color: var(--border-strong);
      }
      .linklike:hover {
        color: var(--text-link-hover);
      }

      .badge {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        height: 20px;
        padding: 0 7px;
        border-radius: var(--radius-badge);
        font-size: var(--text-xs);
        font-weight: 500;
        border: 1px solid var(--neutral-border);
        background: var(--neutral-subtle);
        color: var(--neutral-fg);
        white-space: nowrap;
      }
      .badge.success {
        background: var(--success-subtle);
        color: var(--success-fg);
        border-color: var(--success-border);
      }
      .badge.warning {
        background: var(--warning-subtle);
        color: var(--warning-fg);
        border-color: var(--warning-border);
      }
      .badge.danger {
        background: var(--danger-subtle);
        color: var(--danger-fg);
        border-color: var(--danger-border);
      }
      .badge.info {
        background: var(--info-subtle);
        color: var(--info-fg);
        border-color: var(--info-border);
      }
      .badge.accent {
        background: var(--accent-subtle);
        color: var(--accent-subtle-fg);
        border-color: transparent;
      }
      .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: currentColor;
        flex: none;
      }
      .dot.live {
        background: var(--accent);
        animation: pulse-dot 1.6s var(--ease-out) infinite;
      }
      .overline {
        font: var(--type-overline);
        letter-spacing: var(--tracking-caps);
        text-transform: uppercase;
        color: var(--fg-3);
      }
      .muted {
        color: var(--fg-2);
      }
      .faint {
        color: var(--fg-3);
      }
      .mono {
        font-family: var(--font-mono);
        font-size: 12px;
      }

      .avatar {
        --c: var(--gray-500);
        width: 22px;
        height: 22px;
        border-radius: 50%;
        flex: none;
        display: inline-grid;
        place-items: center;
        font-size: 11px;
        font-weight: 600;
        color: var(--white);
        background: var(--c);
        box-shadow: 0 0 0 2px var(--surface);
      }
      .avatar.lg {
        width: 28px;
        height: 28px;
        font-size: 12px;
      }
      .avatar.sm {
        width: 18px;
        height: 18px;
        font-size: 10px;
      }
      .avatar.you {
        background: var(--surface-inverse);
        color: var(--fg-inverse);
      }
      .avatar.office {
        background: var(--neutral-subtle);
        color: var(--fg-2);
        box-shadow: 0 0 0 1px var(--border-strong);
      }
      .avatar.command {
        border-radius: var(--radius-sm);
        background: var(--neutral-subtle);
        color: var(--fg-2);
        box-shadow: 0 0 0 1px var(--border-strong);
        font-family: var(--font-mono);
      }

      @keyframes pulse-dot {
        0% {
          box-shadow: 0 0 0 0 color-mix(in oklab, var(--accent) 55%, transparent);
        }
        70% {
          box-shadow: 0 0 0 7px transparent;
        }
        100% {
          box-shadow: 0 0 0 0 transparent;
        }
      }
      @keyframes pulse-ring {
        0% {
          transform: scale(1);
          opacity: 0.55;
        }
        100% {
          transform: scale(1.9);
          opacity: 0;
        }
      }
      @keyframes blink {
        0%,
        80%,
        100% {
          opacity: 0.25;
        }
        40% {
          opacity: 1;
        }
      }

      /* ---------- Demo toolbar (not part of the design) ---------- */
      .demo {
        flex: none;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px 16px;
        padding: 8px 16px;
        background: var(--surface-inverse);
        color: var(--fg-inverse);
        font-size: var(--text-xs);
      }
      .demo .label {
        font: var(--type-overline);
        letter-spacing: var(--tracking-caps);
        text-transform: uppercase;
        opacity: 0.7;
      }
      .demo .group {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .seg {
        display: inline-flex;
        border: 1px solid color-mix(in oklab, var(--fg-inverse) 25%, transparent);
        border-radius: var(--radius-control);
        overflow: hidden;
      }
      .seg button {
        border: 0;
        background: transparent;
        padding: 4px 9px;
        cursor: pointer;
        color: inherit;
        font-size: var(--text-xs);
        opacity: 0.75;
      }
      .seg button + button {
        border-left: 1px solid color-mix(in oklab, var(--fg-inverse) 25%, transparent);
      }
      .seg button[aria-pressed="true"] {
        background: var(--fg-inverse);
        color: var(--surface-inverse);
        opacity: 1;
        font-weight: 600;
      }
      .demo .title {
        font-weight: 600;
        font-size: var(--text-sm);
      }
      .demo .chip {
        font-family: var(--font-mono);
        font-size: 11px;
        padding: 1px 6px;
        border-radius: var(--radius-sm);
        background: var(--accent);
        color: var(--white);
      }
      .demo .spacer {
        flex: 1;
      }
      .demo .linklike {
        color: inherit;
        opacity: 0.75;
      }

      /* ---------- Page frame ---------- */
      .viewport {
        flex: 1;
        min-height: 0;
        position: relative;
        overflow: hidden;
        margin: 0 auto;
        width: 100%;
        container: app / size;
      }
      .viewport.narrow-demo {
        max-width: 820px;
        border-inline: 1px solid var(--border-strong);
      }
      .scroller {
        height: 100%;
        overflow: auto;
        padding: 16px var(--pad-page) 24px;
        scroll-behavior: smooth;
      }
      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius-card);
        box-shadow: var(--shadow-1);
      }

      /* ---------- Head ---------- */
      .head {
        display: flex;
        flex-wrap: wrap;
        align-items: flex-start;
        gap: 10px 16px;
        margin-bottom: 14px;
      }
      .head-main {
        flex: 1 1 420px;
        min-width: 0;
      }
      .crumbs {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: var(--text-xs);
        color: var(--fg-3);
        margin-bottom: 4px;
      }
      .project-mark {
        width: 16px;
        height: 16px;
        border-radius: 4px;
        display: inline-grid;
        place-items: center;
        background: var(--teal-500);
        color: var(--white);
        font-size: 9px;
        font-weight: 700;
      }
      .title-row {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 8px 10px;
      }
      .title-row h1 {
        margin: 0;
        font-size: var(--text-2xl);
        line-height: 1.3;
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      .meta-row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 4px 14px;
        margin-top: 6px;
        font-size: var(--text-sm);
        color: var(--fg-2);
      }
      .meta-row .sep {
        color: var(--border-strong);
      }
      .priority {
        display: inline-flex;
        align-items: center;
        gap: 4px;
      }
      .priority svg {
        color: var(--accent);
      }
      .meter {
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }
      .meter .bar {
        width: 84px;
        height: 5px;
        border-radius: 3px;
        background: var(--neutral-subtle);
        box-shadow: inset 0 0 0 1px var(--border);
        overflow: hidden;
      }
      .meter .bar i {
        display: block;
        height: 100%;
        background: var(--fg-2);
        border-radius: 3px;
      }
      .head-actions {
        display: flex;
        gap: 6px;
        align-items: center;
        padding-top: 18px;
      }
      .needs-banner {
        display: none;
      }

      /* ---------- Pipeline rail ---------- */
      .rail {
        padding: 10px 0 0;
        margin-bottom: 14px;
      }
      .rail-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 0 16px 2px;
      }
      .rail-top .muted {
        font-size: var(--text-xs);
      }
      .rail-scroll {
        overflow-x: auto;
        overflow-y: hidden;
        padding: 0 8px 10px;
        scrollbar-width: thin;
      }
      .rail-inner {
        --marker-top: 14px;
        position: relative;
        display: flex;
        padding-top: var(--marker-top);
        min-width: 100%;
      }
      .rail-track,
      .rail-fill {
        position: absolute;
        top: calc(var(--marker-top) + 11px);
        height: 2px;
        border-radius: 2px;
      }
      .rail-track {
        background: var(--border-strong);
      }
      .rail-fill {
        background: var(--success);
        transition: width var(--duration-slow) var(--ease-out);
      }
      .rail-fill.live {
        background: linear-gradient(90deg, var(--success) calc(100% - 60px), var(--accent));
      }
      .rail-arcs {
        position: absolute;
        inset: 0;
        pointer-events: none;
        overflow: visible;
      }
      .rail-arcs path {
        fill: none;
        stroke: var(--danger);
        stroke-width: 1.5;
        stroke-dasharray: 4 3;
      }
      .arc-label {
        position: absolute;
        transform: translate(-50%, -50%);
        pointer-events: auto;
        cursor: pointer;
        font-size: 11px;
        font-weight: 600;
        color: var(--danger-fg);
        background: var(--surface);
        border: 1px solid var(--danger-border);
        border-radius: var(--radius-full);
        padding: 1px 7px;
        white-space: nowrap;
      }
      .node {
        flex: 1 1 0;
        min-width: 150px;
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2px;
        padding: 0 6px 8px;
        border: 0;
        background: none;
        cursor: pointer;
        text-align: center;
        border-radius: var(--radius-lg);
      }
      .node:hover .node-body {
        background: var(--surface-hover);
      }
      .node[aria-selected="true"] .node-body {
        background: var(--surface-selected);
        box-shadow: inset 0 0 0 1px color-mix(in oklab, var(--accent) 35%, transparent);
      }
      .node:focus-visible {
        box-shadow: none;
      }
      .node:focus-visible .node-body {
        box-shadow: var(--focus-ring);
      }
      .marker {
        position: relative;
        z-index: 1;
        width: 24px;
        height: 24px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: var(--surface);
        border: 2px solid var(--border-strong);
        color: var(--fg-3);
      }
      .marker svg {
        width: 12px;
        height: 12px;
      }
      .node.gate .marker {
        border-radius: 5px;
        transform: rotate(45deg);
        width: 21px;
        height: 21px;
        margin: 1.5px 0;
      }
      .node.gate .marker svg {
        transform: rotate(-45deg);
      }
      .node.done .marker {
        background: var(--success);
        border-color: var(--success);
        color: var(--white);
      }
      .node.failed .marker {
        background: var(--danger);
        border-color: var(--danger);
        color: var(--white);
      }
      .node.waiting-on-you .marker {
        background: var(--warning);
        border-color: var(--warning);
        color: var(--gray-950);
      }
      .node.running .marker {
        border-color: var(--accent);
        color: var(--accent);
      }
      .node.running .marker::after {
        content: "";
        position: absolute;
        inset: -3px;
        border-radius: inherit;
        border: 2px solid var(--accent);
        animation: pulse-ring 1.6s var(--ease-out) infinite;
      }
      .node.skipped .marker {
        border-style: dashed;
      }
      .node.pending.future .marker {
        border-color: var(--border-strong);
      }
      .node-body {
        width: 100%;
        margin-top: 6px;
        padding: 6px 6px 7px;
        border-radius: var(--radius-lg);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 3px;
        transition: background var(--duration-fast);
      }
      .node-name {
        font-weight: 600;
        font-size: var(--text-sm);
        color: var(--fg-1);
      }
      .node.pending .node-name,
      .node.skipped .node-name {
        color: var(--fg-2);
      }
      .node-who {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font-size: var(--text-xs);
        color: var(--fg-2);
      }
      .node-state {
        font-size: 11px;
        font-weight: 500;
        color: var(--fg-3);
      }
      .node.running .node-state {
        color: var(--accent-subtle-fg);
      }
      .node.failed .node-state {
        color: var(--danger-fg);
      }
      .node.waiting-on-you .node-state {
        color: var(--warning-fg);
      }
      .node.done .node-state {
        color: var(--success-fg);
      }
      .node-meta {
        font-size: 11px;
        color: var(--fg-3);
        font-variant-numeric: tabular-nums;
      }
      .node-optional {
        font-size: 10px;
        color: var(--fg-3);
        font-style: italic;
      }

      /* ---------- Stage history ---------- */
      .history {
        margin: -6px 0 14px;
        padding: 14px 16px 16px;
        animation: drop-in var(--duration-base) var(--ease-out);
      }
      @keyframes drop-in {
        from {
          opacity: 0;
          transform: translateY(-4px);
        }
      }
      .history-head {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }
      .history-head h2 {
        margin: 0;
        font-size: var(--text-lg);
        font-weight: 600;
      }
      .history-head .grow {
        flex: 1;
      }
      .kbd {
        font-family: var(--font-mono);
        font-size: 10px;
        border: 1px solid var(--border-strong);
        border-bottom-width: 2px;
        border-radius: 4px;
        padding: 0 4px;
        color: var(--fg-2);
      }
      .history-sub {
        font-size: var(--text-sm);
        color: var(--fg-2);
        margin: 4px 0 12px;
      }
      .runs {
        list-style: none;
        margin: 0;
        padding: 0 0 0 14px;
        border-left: 2px solid var(--border);
        display: grid;
        gap: 10px;
      }
      .run {
        position: relative;
        padding: 10px 12px;
        border: 1px solid var(--border);
        border-left: 3px solid var(--border-strong);
        border-radius: var(--radius-lg);
        background: var(--surface);
      }
      .run::before {
        content: "";
        position: absolute;
        left: -22px;
        top: 15px;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--surface);
        border: 2px solid var(--border-strong);
      }
      .run.done {
        border-left-color: var(--success);
      }
      .run.done::before {
        background: var(--success);
        border-color: var(--success);
      }
      .run.failed {
        border-left-color: var(--danger);
      }
      .run.failed::before {
        background: var(--danger);
        border-color: var(--danger);
      }
      .run.running {
        border-left-color: var(--accent);
      }
      .run.running::before {
        border-color: var(--accent);
      }
      .run.waiting-on-you {
        border-left-color: var(--warning);
      }
      .run.waiting-on-you::before {
        background: var(--warning);
        border-color: var(--warning);
      }
      .run.skipped {
        border-left-style: dashed;
      }
      .run-line {
        display: flex;
        align-items: center;
        gap: 8px 12px;
        flex-wrap: wrap;
        font-size: var(--text-sm);
      }
      .run-line .title {
        font-weight: 600;
      }
      .run-line .grow {
        flex: 1;
      }
      .run-facts {
        font-size: var(--text-xs);
        color: var(--fg-2);
        font-variant-numeric: tabular-nums;
      }
      .run-note {
        margin-top: 8px;
        font-size: var(--text-sm);
      }
      .carried {
        margin-top: 6px;
        font-size: var(--text-xs);
        color: var(--danger-fg);
        display: flex;
        gap: 6px;
        align-items: center;
      }
      .handover {
        margin-top: 8px;
        padding: 8px 10px;
        border-radius: var(--radius-md);
        background: var(--surface-sunken);
        border: 1px solid var(--border-subtle);
        font-size: var(--text-sm);
      }
      .handover .overline {
        display: block;
        margin-bottom: 3px;
      }
      .cmd {
        margin-top: 6px;
        display: flex;
        gap: 8px;
        align-items: center;
        font-size: var(--text-xs);
      }
      .cmd code {
        background: var(--surface-sunken);
        border: 1px solid var(--border-subtle);
        padding: 1px 6px;
        border-radius: 4px;
      }

      /* ---------- Body: record | conversation ---------- */
      .body {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(380px, 460px);
        gap: 16px;
        align-items: start;
      }

      /* Record */
      .tabs {
        display: flex;
        gap: 2px;
        border-bottom: 1px solid var(--border);
        margin-bottom: 12px;
      }
      .tab {
        border: 0;
        background: none;
        padding: 8px 10px;
        margin-bottom: -1px;
        font-size: var(--text-sm);
        font-weight: 500;
        color: var(--fg-2);
        cursor: pointer;
        border-bottom: 2px solid transparent;
        display: inline-flex;
        gap: 6px;
        align-items: center;
      }
      .tab[aria-selected="true"] {
        color: var(--fg-1);
        border-bottom-color: var(--fg-1);
      }
      .tab:disabled {
        color: var(--fg-disabled);
        cursor: not-allowed;
      }
      .tab .count {
        font-size: 11px;
        color: var(--fg-3);
        font-weight: 400;
      }
      .folds {
        display: grid;
        gap: 8px;
      }
      .fold {
        overflow: hidden;
        border-left: 3px solid var(--border-strong);
      }
      .fold[data-tone="info"] {
        border-left-color: var(--info);
      }
      .fold[data-tone="success"] {
        border-left-color: var(--success);
      }
      .fold[data-tone="warning"] {
        border-left-color: var(--warning);
      }
      .fold-head {
        width: 100%;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 11px 14px;
        border: 0;
        background: none;
        cursor: pointer;
        text-align: left;
      }
      .fold-head:hover {
        background: var(--surface-hover);
      }
      .fold-head .chev {
        flex: none;
        color: var(--fg-3);
        transition: transform var(--duration-fast);
      }
      .fold.open .fold-head .chev {
        transform: rotate(90deg);
      }
      .fold-title {
        font-weight: 600;
        font-size: var(--text-md);
        flex: none;
      }
      .fold-summary {
        flex: 1;
        min-width: 0;
        font-size: var(--text-sm);
        color: var(--fg-2);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .fold.open .fold-summary {
        visibility: hidden;
      }
      .fold-side {
        flex: none;
        display: flex;
        gap: 6px;
        align-items: center;
      }
      .fold-body {
        padding: 2px 18px 16px 38px;
        font-size: var(--text-sm);
      }
      .fold:not(.open) .fold-body {
        display: none;
      }

      .md {
        line-height: 1.6;
      }
      .md h1,
      .md h2,
      .md h3 {
        font-size: var(--text-md);
        font-weight: 600;
        margin: 14px 0 4px;
      }
      .md p {
        margin: 0 0 8px;
      }
      .md ul,
      .md ol {
        margin: 0 0 8px;
        padding-left: 20px;
      }
      .md li {
        margin: 2px 0;
      }
      .md code {
        font-size: 12px;
        background: var(--surface-sunken);
        border: 1px solid var(--border-subtle);
        padding: 0 4px;
        border-radius: 4px;
      }
      .md pre {
        background: var(--surface-sunken);
        border: 1px solid var(--border-subtle);
        border-radius: var(--radius-md);
        padding: 8px 10px;
        overflow-x: auto;
        font-size: 12px;
      }
      .md pre code {
        border: 0;
        padding: 0;
        background: none;
      }
      .files {
        list-style: none;
        margin: 6px 0 0;
        padding: 0;
        display: grid;
        gap: 3px;
      }
      .files li {
        display: flex;
        gap: 8px;
        align-items: center;
        font-family: var(--font-mono);
        font-size: 12px;
        color: var(--fg-2);
      }
      .block-foot {
        margin-top: 12px;
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
        font-size: var(--text-xs);
        color: var(--fg-3);
      }

      .dod {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        gap: 6px;
      }
      .dod li {
        display: grid;
        grid-template-columns: 18px 1fr;
        gap: 8px;
        align-items: start;
      }
      .check {
        width: 16px;
        height: 16px;
        margin-top: 2px;
        border-radius: 4px;
        border: 1.5px solid var(--border-strong);
        display: grid;
        place-items: center;
        color: var(--white);
      }
      .check.on {
        background: var(--success);
        border-color: var(--success);
      }
      .dod .n {
        color: var(--fg-3);
        font-variant-numeric: tabular-nums;
        margin-right: 4px;
      }

      .rows {
        display: grid;
        gap: 6px;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 10px;
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        background: var(--surface);
      }
      .row .grow {
        flex: 1;
        min-width: 0;
      }
      .row .ico {
        width: 26px;
        height: 26px;
        border-radius: 6px;
        background: var(--neutral-subtle);
        color: var(--fg-2);
        display: grid;
        place-items: center;
        flex: none;
      }

      .changes-sum {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 16px;
        align-items: center;
        margin-bottom: 10px;
        font-size: var(--text-sm);
      }
      .add {
        color: var(--success-fg);
      }
      .del {
        color: var(--danger-fg);
      }
      .diff {
        margin-top: 10px;
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        overflow: hidden;
        font-size: 12px;
      }
      .diff-head {
        padding: 6px 10px;
        background: var(--surface-sunken);
        border-bottom: 1px solid var(--border);
        font-family: var(--font-mono);
      }
      .diff pre {
        margin: 0;
        padding: 6px 0;
        overflow-x: auto;
        line-height: 1.55;
      }
      .diff span {
        display: block;
        padding: 0 10px;
        white-space: pre;
      }
      .diff .a {
        background: var(--success-subtle);
      }
      .diff .d {
        background: var(--danger-subtle);
      }

      /* Conversation */
      .conversation {
        position: sticky;
        top: 12px;
        height: 520px;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius-card);
        box-shadow: var(--shadow-1);
      }
      .drawer-close {
        display: none;
      }
      /*
       * Takes the height its actions need, so they are never cut off; the live Thread's messages give
       * way first, down to their minimum. Only past that does it scroll inside itself.
       */
      .needs {
        flex: 0 1 auto;
        min-height: 0;
        padding: 10px 12px;
        border-bottom: 1px solid var(--border);
        background: color-mix(in oklab, var(--warning-subtle) 70%, var(--surface));
        overflow: auto;
      }
      /* Shown only while some of Needs you is out of view, so nothing waits unseen below the fold. */
      .needs-more {
        display: none;
        position: sticky;
        bottom: -10px;
        margin: 6px -12px -10px;
        padding: 14px 12px 8px;
        background: linear-gradient(
          transparent,
          color-mix(in oklab, var(--warning-subtle) 70%, var(--surface)) 45%
        );
        text-align: center;
      }
      .needs.overflowing .needs-more {
        display: block;
      }
      .needs-more svg {
        transform: rotate(90deg);
      }
      .needs.empty {
        background: var(--surface);
      }
      .needs-head {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .needs-head .title {
        font-weight: 600;
        font-size: var(--text-sm);
      }
      .needs-head .grow {
        flex: 1;
      }
      .count-pill {
        min-width: 18px;
        height: 18px;
        padding: 0 5px;
        border-radius: 9px;
        background: var(--warning);
        color: var(--gray-950);
        font-size: 11px;
        font-weight: 700;
        display: inline-grid;
        place-items: center;
      }
      .needs-list {
        display: grid;
        gap: 8px;
        margin-top: 8px;
      }
      .ask {
        background: var(--surface);
        border: 1px solid var(--border);
        border-left: 3px solid var(--warning);
        border-radius: var(--radius-lg);
        padding: 10px 12px;
        box-shadow: var(--shadow-1);
      }
      .ask.gate {
        border-left-color: var(--accent);
      }
      .ask.office {
        border-left-color: var(--danger);
      }
      .ask-kind {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: var(--text-xs);
        color: var(--fg-2);
      }
      .ask-kind .grow {
        flex: 1;
      }
      .ask-q {
        margin: 6px 0 8px;
        font-weight: 600;
        font-size: var(--text-sm);
        line-height: 1.4;
      }
      .ask-ctx {
        font-size: var(--text-xs);
        color: var(--fg-2);
        margin: 0 0 8px;
      }
      .ask-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .option {
        text-align: left;
        height: auto;
        min-height: var(--control-sm);
        padding: 4px 10px;
        white-space: normal;
      }
      .option .rec {
        font-size: 10px;
        font-weight: 600;
        color: var(--fg-on-accent);
        background: var(--accent);
        padding: 1px 5px;
        border-radius: 3px;
        margin-left: 2px;
      }
      .free {
        display: flex;
        gap: 6px;
        margin-top: 8px;
      }
      .free input,
      .sendback textarea,
      .sendback select {
        flex: 1;
        min-width: 0;
        height: var(--control-sm);
        border: 1px solid var(--border-strong);
        border-radius: var(--radius-control);
        background: var(--surface);
        color: var(--fg-1);
        padding: 0 8px;
        font: inherit;
        font-size: var(--text-sm);
      }
      .sendback {
        margin-top: 8px;
        display: grid;
        gap: 6px;
      }
      .sendback textarea {
        height: 56px;
        padding: 6px 8px;
        resize: vertical;
      }
      .why {
        font-size: var(--text-xs);
        color: var(--fg-3);
        margin-top: 6px;
      }
      .details {
        margin-top: 8px;
        font-size: var(--text-xs);
      }
      .details summary {
        cursor: pointer;
        color: var(--fg-2);
        width: max-content;
        max-width: 100%;
      }
      .details summary:hover {
        color: var(--fg-1);
      }
      .details .ask-ctx {
        margin: 6px 0 0;
      }
      .nothing {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: var(--text-sm);
        color: var(--fg-2);
      }
      .nothing svg {
        color: var(--success);
      }

      .earlier {
        flex: none;
        border-bottom: 1px solid var(--border);
      }
      .earlier-head {
        width: 100%;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        border: 0;
        background: none;
        cursor: pointer;
        font-size: var(--text-sm);
        text-align: left;
      }
      .earlier-head:hover {
        background: var(--surface-hover);
      }
      .earlier-head .chev {
        color: var(--fg-3);
        transition: transform var(--duration-fast);
        flex: none;
      }
      .earlier.open .earlier-head .chev {
        transform: rotate(90deg);
      }
      .earlier-head .summary {
        flex: 1;
        min-width: 0;
        color: var(--fg-3);
        font-size: var(--text-xs);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .earlier-list {
        max-height: 240px;
        overflow: auto;
        padding: 0 8px 8px;
      }
      .earlier:not(.open) .earlier-list {
        display: none;
      }
      .earlier.fill {
        flex: 1;
        min-height: 0;
        overflow: auto;
        border-bottom: 0;
      }
      .earlier.fill .earlier-list {
        max-height: none;
      }
      .group-label {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 8px 4px 3px;
      }
      .stage-chip {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        height: 18px;
        padding: 0 6px;
        border-radius: 4px;
        border: 1px solid var(--border);
        background: var(--surface-sunken);
        font-size: 11px;
        color: var(--fg-2);
        cursor: pointer;
      }
      .stage-chip:hover {
        border-color: var(--border-strong);
        color: var(--fg-1);
      }
      .thread-line {
        width: 100%;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 6px;
        border: 0;
        border-radius: var(--radius-md);
        background: none;
        cursor: pointer;
        text-align: left;
        font-size: var(--text-sm);
      }
      .thread-line:hover {
        background: var(--surface-hover);
      }
      .thread-line[aria-current="true"] {
        background: var(--surface-selected);
      }
      .thread-line .who {
        font-weight: 500;
        white-space: nowrap;
      }
      .thread-line .grow {
        flex: 1;
        min-width: 0;
        color: var(--fg-2);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .thread-line .when {
        color: var(--fg-3);
        font-size: var(--text-xs);
        white-space: nowrap;
      }

      .thread-head {
        flex: none;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 12px;
        border-bottom: 1px solid var(--border);
      }
      .thread-head .grow {
        flex: 1;
        min-width: 0;
      }
      .thread-head .name {
        font-weight: 600;
        font-size: var(--text-sm);
      }
      .thread-head .sub {
        font-size: var(--text-xs);
        color: var(--fg-2);
      }
      .live-badge {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        height: 20px;
        padding: 0 7px;
        border-radius: var(--radius-full);
        background: var(--accent-subtle);
        color: var(--accent-subtle-fg);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }
      .readonly-bar {
        flex: none;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        background: var(--info-subtle);
        border-bottom: 1px solid var(--info-border);
        color: var(--info-fg);
        font-size: var(--text-xs);
      }
      .readonly-bar .grow {
        flex: 1;
      }
      .unread {
        min-width: 18px;
        height: 18px;
        padding: 0 5px;
        border-radius: 9px;
        background: var(--accent);

      /** The Full Pipeline, with an optional docs Stage and a Gate before Publish (Stage, from stages.ts). */

        {

        {

      const tokens = (total) => ({
        input: Math.round(total * 0.18),
        output: Math.round(total * 0.07),
        cacheRead: Math.round(total * 0.68),
        cacheCreation:
          total - Math.round(total * 0.18) - Math.round(total * 0.07) - Math.round(total * 0.68),
      });
      const sumTokens = (t) => t.input + t.output + t.cacheRead + t.cacheCreation;

      /** A StageRun (pipelines.ts). */
      function run(number, stageKey, startMin, endMin, total, outcome, extra = {}) {
        return {
          id: `run-${number}`,
          number,
          stageKey,
          startedAt: ago(startMin),
          endedAt: endMin === null ? null : ago(endMin),

2. Take the columns from \`UsageRow\`; dates in ISO 8601 (UTC), amounts in minor units, as the API gives them.
3. Add an **Export CSV** button to the report's toolbar, after **Export PDF**.

## Risks
- Large accounts have about 200k rows a month: stream, never buffer.
- \`formatMoney\` is shared with the PDF export; leave it as it is.

## Estimate
About 600k tokens over the whole Pipeline.`;

      /** A small Markdown renderer: headings, paragraphs, lists, fenced code and inline marks. */
      function markdown(source) {
        const out = [];
        let list = null;
        let para = [];
        let fence = null;
        const flushPara = () => {
          if (para.length) {
            out.push(`<p>${inline(para.join(" "))}</p>`);
            para = [];
          }
        };
        const flushList = () => {
          if (list) {
            out.push(
              `<${list.tag}>${list.items.map((i) => `<li>${inline(i)}</li>`).join("")}</${list.tag}>`,
            );
            list = null;
          }
        };
        for (const line of source.split("\n")) {
          if (fence !== null) {
            if (line.startsWith("```")) {
              out.push(`<pre><code>${esc(fence.join("\n"))}</code></pre>`);
              fence = null;
            } else fence.push(line);
            continue;
          }
          if (line.startsWith("```")) {
            flushPara();
            flushList();
            fence = [];
            continue;
          }
          const heading = /^(#{1,3})\s+(.*)$/.exec(line);
          const bullet = /^[-*]\s+(.*)$/.exec(line);
          const numbered = /^\d+\.\s+(.*)$/.exec(line);
          if (heading) {
            flushPara();
            flushList();
            out.push(
              `<h${heading[1].length + 1}>${inline(heading[2])}</h${heading[1].length + 1}>`,
            );
          } else if (bullet || numbered) {
            flushPara();
            const tag = bullet ? "ul" : "ol";
            if (!list || list.tag !== tag) {
              flushList();
              list = { tag, items: [] };
            }
            list.items.push((bullet || numbered)[1]);
          } else if (!line.trim()) {
            flushPara();
            flushList();
          } else {
            flushList();
            para.push(line.trim());
          }
        }
        flushPara();
        flushList();
        return out.join("");
      }
